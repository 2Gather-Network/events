<!doctype html>
<html>
<head>

<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="My network · 2Gather">
<title>My network · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:500;margin-bottom:22px;opacity:.92;}
  .breadcrumb .now{font-weight:800;}
  .breadcrumb a{color:#fff;text-decoration:none;cursor:pointer;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{font-size:26px;font-weight:800;margin:0 0 18px;color:#fff;}
  h2{font-size:21px;font-weight:800;margin:18px 0 16px;color:var(--ink);}
  .sub{font-size:14.5px;color:var(--soft);margin:0 0 18px;line-height:1.6;}
  .sub a{color:var(--brand);font-weight:700;}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:14px;padding-bottom:6px;}
  .person{display:flex;align-items:center;gap:12px;border:1.5px solid var(--panel-line);border-radius:14px;
          padding:12px 14px;text-decoration:none;color:inherit;background:var(--panel);}
  .person:hover{border-color:var(--brand);}
  .face{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 46px;background:#E7F0F8;}
  .initial{width:46px;height:46px;border-radius:50%;flex:0 0 46px;background:#E7F0F8;color:var(--brand);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .pname{font-size:15.5px;font-weight:700;color:var(--brand);line-height:1.3;word-break:break-word;}
  .ptext{min-width:0;}
  .pgroups{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:4px;word-break:break-word;}
  .find{display:block;width:100%;max-width:420px;margin:0 0 16px;padding:10px 13px;border:1.5px solid var(--panel-line);
        border-radius:10px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;}
  .find:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand);}
  .none{font-size:14.5px;color:var(--soft);margin:0 0 6px;}
</style>
<script src="/nav/identity.js?v=26"></script>
</head>
<body>

<div class="wrap">
  <div class="breadcrumb"><a href="https://2gather.network/events/">2Gather</a> / <span class="now">My network</span></div>
  <h1>My network</h1>
  <div id="pane">
    <h2>My bookmarks</h2>
    <p class="sub" id="sub">Looking up the people you bookmarked. This can take up to a minute.</p>
    <input class="find" id="find" type="search" autocomplete="off" placeholder="Search by name" aria-label="Search your bookmarks by name" hidden>
    <p class="none" id="none" hidden></p>
    <div class="people" id="people"></div>
  </div>
</div>

<script src="https://2gather.network/nav/profile-rail.js?v=8"></script>
<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';

  try {
    if (window.cwProfileRail) {
      window.cwProfileRail({ wrap: document.getElementById('pane'), shape: 'network', active: 'bookmarks' });
    }
  } catch (e) {}

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function profileHref(p){
    var v = String(p.vanity||'').trim();
    if (v) { return 'https://2gather.network/hi/' + encodeURIComponent(v); }
    return 'https://2gather.network/me/?v=' + encodeURIComponent(String(p.appearId||'').trim());
  }

  function firstLetter(n){
    var s = String(n||'').trim();
    return s ? s.charAt(0).toUpperCase() : '·';
  }

  function say(text){
    var s = document.getElementById('sub');
    if (!s) { return; }
    if (!text) { s.style.display = 'none'; return; }
    s.style.display = '';
    s.innerHTML = text;
  }

  var TRY = false;
  try { TRY = new URLSearchParams(location.search).get('try') === '1'; } catch (e) {}

  var ALL = [];

  function sharedLine(p){
    var g = (p && p.groups) || [];
    if (!g.length) { return ''; }
    if (g.length === 1) { return 'With you in ' + esc(g[0]); }
    if (g.length === 2) { return 'With you in ' + esc(g[0]) + ' and ' + esc(g[1]); }
    return 'With you in ' + g.slice(0, g.length - 1).map(esc).join(', ') + ' and ' + esc(g[g.length - 1]);
  }

  function paint(list){
    var box = document.getElementById('people');
    if (!box) { return; }
    box.innerHTML = '';
    list.forEach(function(p){
      var a = document.createElement('a');
      a.className = 'person';
      a.href = profileHref(p);
      var name = String(p.name||'').trim() || 'Someone';
      var face = String(p.photo||'').trim()
        ? '<img class="face" src="' + esc(p.photo) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;initial&quot;>' + esc(firstLetter(name)) + '</div>\'">'
        : '<div class="initial">' + esc(firstLetter(name)) + '</div>';
      var line = TRY ? sharedLine(p) : '';
      a.innerHTML = face + '<div class="ptext"><div class="pname">' + esc(name) + '</div>'
                  + (line ? '<div class="pgroups">' + line + '</div>' : '') + '</div>';
      box.appendChild(a);
    });
  }

  function none(text){
    var n = document.getElementById('none');
    if (!n) { return; }
    if (!text) { n.hidden = true; n.textContent = ''; return; }
    n.hidden = false; n.textContent = text;
  }

  function applyFind(){
    var f = document.getElementById('find');
    var q = f ? String(f.value || '').trim().toLowerCase() : '';
    if (!q) { none(''); paint(ALL); return; }
    var hit = ALL.filter(function(p){ return String(p.name||'').toLowerCase().indexOf(q) > -1; });
    none(hit.length ? '' : 'Nobody you bookmarked is called that.');
    paint(hit);
  }

  function openFind(){
    var f = document.getElementById('find');
    if (!f) { return; }
    f.hidden = false;
    f.oninput = applyFind;
  }

  (function(){
    var me = null;
    try { me = CW.me(); } catch (e) {}
    var myId = me && me.id ? String(me.id).trim() : '';

    if (!myId) {
      say('Sign in to see the people you bookmarked. <a href="https://2gather.network/signin/">Sign in</a>');
      return;
    }

    fetch(GS_URL + '?action=getBookmarks&appearId=' + encodeURIComponent(myId))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        var list = (resp && resp.bookmarks) || [];
        if (!list.length) {
          say('You have not bookmarked anyone yet. Open somebody’s profile and press <b>Bookmark</b>, and they will show up here.');
          return;
        }
        say('');
        ALL = list;
        if (TRY) { openFind(); }
        paint(list);
      })
      .catch(function(){
        say('Could not reach your bookmarks just now. Reload the page and it will try again.');
      });
  })();
</script>

<script src="/nav/topbar.js?v=6.24" defer></script>
</body>
</html>
