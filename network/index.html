<title>My network · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:500;margin-bottom:22px;opacity:.92;}
  .breadcrumb:empty{display:none;}
  .crumb-link{text-decoration:underline;cursor:pointer;}
  .breadcrumb .now{font-weight:800;}
  .breadcrumb a{color:#fff;text-decoration:none;cursor:pointer;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{font-size:26px;font-weight:800;margin:0 0 18px;color:#fff;}
  h2{font-size:21px;font-weight:800;margin:18px 0 16px;color:var(--ink);}
  .sub{font-size:14.5px;color:var(--soft);margin:0 0 18px;line-height:1.6;}
  .sub a{color:var(--brand);font-weight:700;}
  input[type=text]{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#F7F9FC;}
  select{padding:8px 10px;border:1.5px solid #DDE4EE;border-radius:10px;font:inherit;background:#fff;}
  .btn{background:var(--brand);color:#fff;border:0;padding:9px 18px;border-radius:22px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .tools[hidden]{display:none;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;}
  .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7DD3FC,#1F699E);color:#fff;
      display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;overflow:hidden;}
  .av img{width:100%;height:100%;object-fit:cover;}
  .who{flex:1;min-width:0;}
  .who .name{font-size:14px;font-weight:700;color:var(--ink);}
  .who .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .actions-row{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .none{font-size:14.5px;color:var(--soft);margin:0 0 6px;}
  .more-wrap{margin-top:14px;text-align:center;}
  .more-wrap[hidden]{display:none;}
  .count{font-size:12.5px;color:var(--muted);margin-top:8px;}
  #cw-prail-main{padding-top:12px;}
  #cw-prail-main h2{margin-top:0;}
</style>
<script src="/nav/identity.js?v=26"></script>
</head>
<body>

<div class="wrap">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="pane">
    <h2>My bookmarks</h2>
    <p class="sub" id="sub">Looking up the people you bookmarked. This can take up to a minute.</p>
    <div class="tools" id="tools" hidden>
      <input type="text" id="find" autocomplete="off" placeholder="Search by name…" style="flex:1;min-width:180px;margin:0;">
      <select id="filter" aria-label="Narrow by group"><option value="all">Everyone</option></select>
      <select id="sort" aria-label="Order them">
        <option value="at">Bookmarked newest to oldest</option>
        <option value="name">Name A to Z</option>
      </select>
      <label id="size-wrap" hidden style="align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;">
        Show
        <select id="size"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select>
        at a time
      </label>
    </div>
    <p class="none" id="none" hidden></p>
    <div id="people"></div>
    <div class="more-wrap" id="more-wrap" hidden>
      <button class="btn ghost" type="button" id="more">Show more</button>
      <div class="count" id="count"></div>
    </div>
  </div>
</div>

<script src="https://2gather.network/nav/profile-rail.js?v=13"></script>
<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';

  try {
    if (window.cwBreadcrumb) { window.cwBreadcrumb(document.getElementById('breadcrumb'), 'My network'); }
  } catch (e) {}

  try {
    if (window.cwProfileRail) {
      window.cwProfileRail({ wrap: document.getElementById('pane'), shape: 'network', active: 'bookmarks' });
    }
  } catch (e) {}

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function profileHref(p){
    var v = String(p.vanity||'').trim();
    if (v) { return 'https://2gather.network/hi/' + encodeURIComponent(v); }
    return 'https://2gather.network/me/?v=' + encodeURIComponent(String(p.appearId||'').trim());
  }

  function firstLetter(n){
    var s = String(n||'').trim();
    return s ? s.charAt(0).toUpperCase() : '·';
  }

  function say(text){
    var s = document.getElementById('sub');
    if (!s) { return; }
    if (!text) { s.style.display = 'none'; return; }
    s.style.display = '';
    s.innerHTML = text;
  }

  var ALL = [], SHOWN = 0;

  function pageSize(){
    var el = document.getElementById('size');
    var n = el ? parseInt(el.value, 10) : 50;
    return (n > 0 ? n : 50);
  }

  function sub(p){
    var g = (p && p.groups) || [];
    if (!g.length) { return ''; }
    if (g.length <= 3) { return g.join(' / '); }
    return g.slice(0, 3).join(' / ') + ' and ' + (g.length - 3) + ' more';
  }

  function paint(list){
    var box = document.getElementById('people');
    if (!box) { return; }
    box.innerHTML = '';
    list.forEach(function(p){
      var name = String(p.name||'').trim() || 'Someone';
      var row = document.createElement('div'); row.className = 'row';

      var av = document.createElement('span'); av.className = 'av';
      if (String(p.photo||'').trim()) { av.innerHTML = '<img src="' + esc(p.photo) + '" alt="">'; }
      else { av.textContent = firstLetter(name); }

      var who = document.createElement('div'); who.className = 'who';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
      who.appendChild(nm);
      var line = sub(p);
      if (line) {
        var sl = document.createElement('div'); sl.className = 'sub'; sl.textContent = line;
        who.appendChild(sl);
      }

      var acts = document.createElement('div'); acts.className = 'actions-row';
      var go = document.createElement('a');
      go.className = 'btn ghost'; go.textContent = 'View profile'; go.href = profileHref(p);
      acts.appendChild(go);

      row.appendChild(av); row.appendChild(who); row.appendChild(acts);
      box.appendChild(row);
    });
  }

  function none(text){
    var n = document.getElementById('none');
    if (!n) { return; }
    if (!text) { n.hidden = true; n.textContent = ''; return; }
    n.hidden = false; n.textContent = text;
  }

  function draw(){
    var f = document.getElementById('find');
    var q = f ? String(f.value || '').trim().toLowerCase() : '';
    var mode = (document.getElementById('filter') || {}).value || 'all';
    var order = (document.getElementById('sort') || {}).value || 'at';

    var matching = ALL.filter(function(p){
      if (q && String(p.name||'').toLowerCase().indexOf(q) === -1) { return false; }
      if (mode === 'all') { return true; }
      if (mode === '__none') { return !((p.groups||[]).length); }
      return (p.groups||[]).some(function(g){ return g === mode; });
    });

    if (order === 'name') {
      matching.sort(function(a, b){
        return String(a.name||'').localeCompare(String(b.name||''));
      });
    } else {
      matching.sort(function(a, b){
        var da = String(a.at||''), db = String(b.at||'');
        if (da && db) { return db.localeCompare(da); }
        if (da) { return -1; }
        if (db) { return 1; }
        return 0;
      });
    }

    var shown = matching.slice(0, SHOWN);
    none(matching.length ? '' : 'Nobody here matches that.');
    paint(shown);

    var wrap = document.getElementById('more-wrap');
    var count = document.getElementById('count');
    if (wrap) { wrap.hidden = !(matching.length > shown.length); }
    if (count) { count.textContent = 'Showing ' + shown.length + ' of ' + matching.length; }
  }

  function fillFilter(){
    var sel = document.getElementById('filter');
    if (!sel) { return; }
    var seen = {}, names = [], anyWithout = false;
    ALL.forEach(function(p){
      var g = p.groups || [];
      if (!g.length) { anyWithout = true; return; }
      g.forEach(function(n){ if (!seen[n]) { seen[n] = 1; names.push(n); } });
    });
    names.sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
    names.forEach(function(n){
      var o = document.createElement('option'); o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    if (anyWithout && names.length) {
      var o2 = document.createElement('option');
      o2.value = '__none'; o2.textContent = 'No group with you';
      sel.appendChild(o2);
    }
  }

  function openTools(){
    var t = document.getElementById('tools');
    if (t) { t.hidden = false; }
    var sw = document.getElementById('size-wrap');
    if (sw) { sw.hidden = !(ALL.length > 25); }
    fillFilter();
    SHOWN = pageSize();
    draw();
  }

  (function(){
    var f = document.getElementById('find');
    if (f) { f.oninput = function(){ SHOWN = pageSize(); draw(); }; }
    ['filter', 'sort', 'size'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) { el.onchange = function(){ SHOWN = pageSize(); draw(); }; }
    });
    var m = document.getElementById('more');
    if (m) { m.onclick = function(){ SHOWN += pageSize(); draw(); }; }
  })();

  (function(){
    var me = null;
    try { me = CW.me(); } catch (e) {}
    var myId = me && me.id ? String(me.id).trim() : '';

    if (!myId) {
      say('Sign in to see the people you bookmarked. <a href="https://2gather.network/signin/">Sign in</a>');
      return;
    }

    fetch(GS_URL + '?action=getBookmarks&appearId=' + encodeURIComponent(myId))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        var list = (resp && resp.bookmarks) || [];
        try { if (resp && Array.isArray(resp.bookmarks)) { localStorage.setItem('cw-havebookmarks', JSON.stringify({ who: myId, yes: list.length > 0, at: Date.now() })); } } catch (e) {}
        if (!list.length) {
          say('You have not bookmarked anyone yet. Open somebody’s profile and press <b>Bookmark</b>, and they will show up here.');
          return;
        }
        say('');
        ALL = list;
        openTools();
      })
      .catch(function(){
        say('Could not reach your bookmarks just now. Reload the page and it will try again.');
      });
  })();
</script>

<script src="/nav/topbar.js?v=6.29" defer></script>
</body>
</html>
