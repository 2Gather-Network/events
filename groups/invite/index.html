<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Invite people · 2Gather">
<title>Invite people · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:500;margin-bottom:24px;opacity:.92;}
  .breadcrumb .now{font-weight:800;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .card{background:var(--card);border-radius:14px;padding:28px 30px;margin-bottom:16px;}
  h1{font-size:24px;font-weight:800;margin:0;line-height:1.25;}
  .lede{font-size:15px;color:var(--soft);margin:10px 0 22px;line-height:1.55;}
  .q{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 6px;}
  input[type=text]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;color:var(--ink);background:#F7F9FC;}
  input:focus{outline:none;border-color:var(--brand);background:#fff;}
  .invitees{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .invitee{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:5px 12px 5px 5px;font-size:14px;color:var(--ink);}
  .invitee .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7DD3FC,#1F699E);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;overflow:hidden;}
  .invitee .av img{width:100%;height:100%;object-fit:cover;}
  .invitee .name{flex:1;font-weight:600;}
  .invitee .role{color:var(--muted);font-size:12px;margin-right:6px;}
  .invitee .x{color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;padding:2px 8px;}
  .invitee .x:hover{color:#c0392b;}
  .lookup-results{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.05);display:none;}
  .lookup-results.on{display:block;}
  .lookup-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;}
  .lookup-item:hover{background:var(--panel);}
  .lookup-item .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7DD3FC,#1F699E);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;overflow:hidden;}
  .lookup-item .av img{width:100%;height:100%;object-fit:cover;}
  .lookup-item .who{flex:1;color:var(--ink);}
  .lookup-item .add{color:var(--brand);font-weight:700;font-size:13px;}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap;}
  .btn{background:var(--brand);color:#fff;border:0;padding:11px 22px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;display:none;}
  .status.err{display:block;background:#FBE9E7;border:1px solid #E8B0A5;color:#7A2410;}
  .status.ok{display:block;background:#E7F5EA;border:1px solid #A5D5B0;color:#1A5A2C;}
  .foot{color:#fff;opacity:.55;font-size:11px;text-align:right;margin-top:24px;font-weight:600;letter-spacing:.05em;}
</style>
  <script src="/nav/identity.js?v=12"></script>
</head>
<body>
<div class="wrap">
  <div class="breadcrumb">‹ <a role="link" tabindex="0" id="crumb-back" onclick="return _safeNavGo(this)" style="cursor:pointer;">My groups</a> / <span class="now">Invite people</span></div>
  <div class="card">
    <h1 id="page-title">Invite people</h1>
    <p class="lede">Add people you already know. They'll get an invitation to join. Skip this and invite from inside the group later.</p>

    <div class="q">Find people by name:</div>
    <input type="text" id="lookup-input" placeholder="Start typing a name…" autocomplete="off">
    <div class="lookup-results" id="lookup-results"></div>

    <div class="q">Invited (<span id="invitee-count">0</span>):</div>
    <div class="invitees" id="invitees-list"></div>

    <div id="save-status" class="status"></div>

    <div class="actions">
      <a class="btn ghost" id="skip-btn" role="link" tabindex="0" onclick="return _safeNavGo(this)">Done for now</a>
      <button class="btn" id="send-btn" disabled>Send invitations</button>
    </div>
  </div>

  <div class="card" id="sent-card" style="display:none;">
    <div class="q" style="margin-top:0;">Already invited</div>
    <div id="sent-list"></div>
  </div>
</div>

<script>
(function(){
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  var params = new URLSearchParams(window.location.search);
  var groupId = (params.get('id') || params.get('groupId') || '').trim();
  var meId = CW.me().id;

  var groupHref = 'https://2gather.network/group?id=' + encodeURIComponent(groupId) + '&CWid=' + encodeURIComponent(meId);
  document.getElementById('crumb-back').setAttribute('data-nav', groupHref);
  document.getElementById('skip-btn').setAttribute('data-nav', groupHref);

  if (!groupId) {
    document.querySelector('.card').innerHTML = '<h1>Missing group.</h1><p class="lede">This page needs <code>?id=&lt;groupId&gt;</code>. Start a group first.</p>'
      + '<div class="actions"><a class="btn ghost" role="link" tabindex="0" data-nav="https://2gather.network/groups/create" onclick="return _safeNavGo(this)">Start a group</a></div>';
    return;
  }

  // Fill page title with the group name
  fetch(GS_URL + '?action=getGroupBundle&groupId=' + encodeURIComponent(groupId))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var nm = (d && d.group && d.group.name) || '';
      if (nm) document.getElementById('page-title').textContent = 'Invite people to ' + nm;
    })
    .catch(function(){});

  var lookupInput = document.getElementById('lookup-input');
  var lookupResults = document.getElementById('lookup-results');
  var invitees = [];
  var _lookupTimer = null;

  function renderInvitees(){
    var list = document.getElementById('invitees-list');
    list.innerHTML = '';
    invitees.forEach(function(p, idx){
      var chip = document.createElement('div');
      chip.className = 'invitee';
      var av = document.createElement('span'); av.className = 'av';
      if (p.photo) av.innerHTML = '<img src="' + p.photo + '" alt="">';
      else av.textContent = String(p.first || p.name || '?').charAt(0).toUpperCase();
      var nm = document.createElement('span'); nm.className = 'name';
      nm.textContent = p.first || p.name || p.appearId;
      var role = document.createElement('span'); role.className = 'role';
      if (p.role) role.textContent = '· ' + p.role;
      var x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
      x.addEventListener('click', function(){
        invitees.splice(idx, 1); renderInvitees();
      });
      chip.appendChild(av); chip.appendChild(nm);
      if (p.role) chip.appendChild(role);
      chip.appendChild(x);
      list.appendChild(chip);
    });
    document.getElementById('invitee-count').textContent = invitees.length;
    document.getElementById('send-btn').disabled = invitees.length === 0;
  }
  renderInvitees();

  lookupInput.addEventListener('input', function(){
    var q = lookupInput.value.trim();
    if (_lookupTimer) clearTimeout(_lookupTimer);
    if (q.length < 3) { lookupResults.classList.remove('on'); lookupResults.innerHTML = ''; return; }
    // Each search reads the whole member list, so it waits until typing stops rather than firing
    // on every keystroke, and says it is working instead of sitting blank.
    lookupResults.innerHTML = '<div class="lookup-item" style="cursor:default;color:var(--muted);">Searching…</div>';
    lookupResults.classList.add('on');
    _lookupTimer = setTimeout(function(){
      // findPeople, not lookupProfile: an id is what opens a profile, so the backend checks the
      // caller hosts this group before it hands any back.
      fetch(GS_URL + '?action=findPeople&q=' + encodeURIComponent(q)
        + '&groupId=' + encodeURIComponent(groupId)
        + '&hostAppearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(matches){
          lookupResults.innerHTML = '';
          var arr = Array.isArray(matches) ? matches : (matches && matches.matches) || [];
          // Searching by name is not built on the backend: lookupProfile only answers to an id,
          // so a name comes back as {found:false} and every search read "No matches", which
          // blamed the data for a feature that does not exist yet. Say the true thing instead.
          var _err = (!Array.isArray(matches) && matches && matches.status === 'error') ? matches.message : '';
          var _notBuilt = !Array.isArray(matches) && !!matches && matches.matches === undefined && !_err;
          if (_err) {
            // Built as text, not markup: this string comes from the backend, and this file has
            // no escaper of its own.
            lookupResults.innerHTML = '';
            var _e = document.createElement('div');
            _e.className = 'lookup-item';
            _e.setAttribute('style', 'cursor:default;color:var(--muted);');
            _e.textContent = _err;
            lookupResults.appendChild(_e);
          } else if (_notBuilt) {
            lookupResults.innerHTML = '<div class="lookup-item" style="cursor:default;color:var(--muted);">'
              + 'Searching by name is not switched on yet, so this finds nobody. It is not that they are missing.</div>';
          } else if (!arr.length) {
            lookupResults.innerHTML = '<div class="lookup-item" style="cursor:default;color:var(--muted);">No matches for "' + q + '"</div>';
          } else {
            arr.slice(0, 8).forEach(function(p){
              if (invitees.some(function(x){ return x.appearId === p.appearId; })) return;
              var item = document.createElement('div');
              item.className = 'lookup-item';
              var av = document.createElement('span'); av.className = 'av';
              if (p.photo) av.innerHTML = '<img src="' + p.photo + '" alt="">';
              else av.textContent = String(p.first || p.name || '?').charAt(0).toUpperCase();
              var who = document.createElement('span'); who.className = 'who';
              who.textContent = (p.first || p.name || p.appearId) + (p.role ? ' · ' + p.role : '');
              var add = document.createElement('span'); add.className = 'add';
              // Somebody already in the group is shown, so you know they are accounted for, but
              // cannot be invited again.
              if (p.inGroup) {
                add.textContent = 'Already in this group';
                add.style.color = 'var(--muted)';
                item.style.cursor = 'default';
                item.style.opacity = '.7';
                item.appendChild(av); item.appendChild(who); item.appendChild(add);
                lookupResults.appendChild(item);
                return;
              }
              add.textContent = '+ Add';
              item.appendChild(av); item.appendChild(who); item.appendChild(add);
              item.addEventListener('click', function(){
                invitees.push(p);
                lookupInput.value = ''; lookupResults.classList.remove('on'); lookupResults.innerHTML = '';
                renderInvitees();
              });
              lookupResults.appendChild(item);
            });
          }
          lookupResults.classList.add('on');
        })
        .catch(function(){
          lookupResults.innerHTML = '<div class="lookup-item" style="cursor:default;color:var(--muted);">Lookup unavailable — try again in a moment.</div>';
          lookupResults.classList.add('on');
        });
    }, 220);
  });

  var statusEl = document.getElementById('save-status');
  var sendBtn = document.getElementById('send-btn');
  function showStatus(kind, msg){ statusEl.className = 'status ' + kind; statusEl.textContent = msg; }

  // Who has already been invited to this group, and where they got to. Loaded on arrival and
  // again after every send, so the page is a record rather than a one-shot form.
  function fmtWhen(iso){
    var d = new Date(String(iso || ''));
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function loadSent(){
    var card = document.getElementById('sent-card');
    var list = document.getElementById('sent-list');
    if (!card || !list) return;
    fetch(GS_URL + '?action=getGroupInvites&groupId=' + encodeURIComponent(groupId)
      + '&hostAppearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var arr = (d && d.invites) || [];
        if (!Array.isArray(arr) || !arr.length) { card.style.display = 'none'; return; }
        list.innerHTML = '';
        arr.forEach(function(v){
          var row = document.createElement('div');
          row.setAttribute('style', 'display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border,#DDE4EE);font-size:14px;');
          var nm = document.createElement('span');
          nm.setAttribute('style', 'flex:1;min-width:0;font-weight:600;color:var(--ink,#1A2E42);');
          nm.textContent = v.name || v.appearId || 'Someone';
          var when = document.createElement('span');
          when.setAttribute('style', 'color:var(--muted,#6B7A8D);white-space:nowrap;');
          when.textContent = fmtWhen(v.sentAt);
          var st = document.createElement('span');
          var joined = String(v.status || '').toLowerCase() === 'joined';
          st.setAttribute('style', 'white-space:nowrap;font-size:12px;font-weight:800;text-transform:uppercase;'
            + 'letter-spacing:.04em;padding:3px 9px;border-radius:10px;'
            + (joined ? 'background:#E7F5EA;color:#1A5A2C;' : 'background:#EEF6FF;color:#154F74;'));
          st.textContent = joined ? 'Joined' : 'Invited';
          row.appendChild(nm); row.appendChild(when); row.appendChild(st);
          list.appendChild(row);
        });
        card.style.display = '';
      })
      .catch(function(){});
  }
  loadSent();

  sendBtn.addEventListener('click', function(){
    if (!invitees.length) return;
    sendBtn.disabled = true;
    showStatus('ok', 'Sending invitations…');
    var ids = invitees.map(function(p){ return p.appearId; }).join('|');
    var url = GS_URL + '?action=inviteToGroup'
      + '&groupId=' + encodeURIComponent(groupId)
      + '&invitedById=' + encodeURIComponent(meId)
      + '&appearIds=' + encodeURIComponent(ids);
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.status === 'ok') {
          var _n = (d.sent === undefined) ? invitees.length : d.sent;
          var _sk = d.skipped || 0;
          showStatus('ok', _n + (_n === 1 ? ' invitation sent' : ' invitations sent')
            + (_sk ? ', ' + _sk + ' already invited' : '') + '.');
          // Staying put on purpose. Being thrown into the group after every send made inviting a
          // second person mean navigating back.
          invitees.length = 0;
          renderInvitees();
          loadSent();
        } else {
          sendBtn.disabled = false;
          var msg = (d && d.message) ? d.message : 'Backend not wired yet. Your list is still here — try again after Jessie pastes the inviteToGroup action.';
          showStatus('err', msg);
        }
      })
      .catch(function(){
        sendBtn.disabled = false;
        showStatus('err', 'Backend not wired yet. Your list is still here — try again after Jessie pastes the inviteToGroup action.');
      });
  });
})();
</script>
</body>
