name: No comments in shipped pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save acorn
      - name: Check every served page and script
        run: node tools/no-comments.mjs $(git ls-files '*.html' '*.js' | grep -v '^tools/' | grep -v '^node_modules/')
