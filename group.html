<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#1F699E;color:#1a1a2e;min-height:100vh;}
[data-nav]{cursor:pointer;}
.header-stack{position:sticky;top:0;z-index:100;}
.event-header{background:#fff;border-radius:14px;margin:0 14px 14px;padding:14px 18px;}
.event-header-row{align-items:center;}
.hub-search-slot{flex:1;min-width:200px;max-width:320px;display:flex;}
@media(max-width:720px){
  .event-header-row{flex-wrap:wrap;align-items:flex-start;}
  .hub-search-slot{flex-basis:100%;max-width:none;order:3;margin-top:10px;}
}
.event-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.event-header-left{min-width:0;flex:1;}
.event-title{font-size:17px;font-weight:700;color:#1a1a2e;line-height:1.2;}
.event-meta{font-size:12.5px;color:#6b7280;font-weight:600;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px;}
.btn-matches{background:#2d5282;color:#fff;border:none;border-radius:24px;padding:0 18px;height:38px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:background 0.15s;flex-shrink:0;}
.btn-matches:hover{background:#1e3a5f;}
.btn-matches.active{background:#1F699E;color:#fff;}
.hub-btn-group{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.btn-help{background:#2d5282;color:#fff;border:none;border-radius:24px;height:38px;padding:0 14px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;flex-shrink:0;line-height:38px;}
.btn-help:hover{background:#1e3a5f;}
.btn-share{background:#fff;color:#2d5282;border:1.5px solid #2d5282;border-radius:24px;height:38px;padding:0 12px;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
.btn-share:hover{background:#eef3f9;}
.btn-share svg{width:20px;height:20px;display:block;}
.qr-reveal{background:#fff;border-bottom:1px solid #e8eaf0;padding:20px;text-align:center;}
.qr-reveal .qr-card{display:inline-flex;flex-direction:column;align-items:center;gap:10px;}
.qr-reveal svg{width:210px;height:210px;max-width:72vw;}
.qr-reveal .qr-cap{font-size:15px;font-weight:700;color:#1a1a2e;}
.qr-reveal .qr-sub{font-size:12.5px;font-weight:600;color:#6b7280;}
.qr-reveal .qr-close{margin-top:2px;background:#f5f6f8;border:1px solid #e0e2ea;border-radius:20px;padding:7px 18px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;font-family:'DM Sans',sans-serif;}
.hub-me{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#2d5282;color:#fff;font-size:15px;font-weight:700;text-decoration:none;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1.5px #cdd3e0;}
.hub-me img{width:100%;height:100%;object-fit:cover;display:block;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1a2433;color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .3s ease;z-index:2000;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);font-family:'DM Sans',sans-serif;}
.toast.show{transform:translateX(-50%) translateY(0);}
.match-legend{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;font-weight:600;color:#6b7280;}
.match-legend .lg{display:inline-flex;align-items:center;gap:6px;}
.match-legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot-orange{background:#2d5282;}
.dot-green{background:#1a7f4b;}
.top-bar{background:#fff;border-bottom:1px solid #e8eaf0;padding:10px 20px 12px;display:flex;align-items:center;gap:10px;}
.search-wrap{flex:1;display:flex;align-items:center;background:#f5f6f8;border:1.5px solid #e0e2ea;border-radius:24px;padding:0 14px;height:40px;gap:8px;}
.search-wrap input{border:none;background:transparent;font-size:14px;font-family:'DM Sans',sans-serif;flex:1;outline:none;color:#1a1a2e;}
.search-wrap input::placeholder{color:#9ea3b8;}
.search-icon{color:#9ea3b8;font-size:16px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;}
.quadrant{background:#fff;border-radius:14px;border:1px solid #e8eaf0;overflow:hidden;display:flex;flex-direction:column;}
.q-header{padding:10px 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f1f5;background:#fff;cursor:pointer;user-select:none;}
.q-title{font-size:14px;font-weight:700;letter-spacing:0.04em;color:#374151;}
.guest-photos{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 0;margin-top:10px;border-top:1px solid #f0f1f5;}
.guest-photos .gp-count{font-size:12.5px;color:#6b7280;font-weight:600;width:100%;padding-bottom:6px;}
.guest-photo{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#e8eaf0;cursor:pointer;flex-shrink:0;position:relative;}
.guest-photo.noclick{cursor:default;}
.guest-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.guest-photo:hover{outline:2px solid #2d5282;}
.guest-photo .gp-initial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#6b7280;}
.gp-more{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;height:36px;border-radius:24px;background:#2d5282;color:#fff;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;border:none;font-family:'DM Sans',sans-serif;}
.gp-more:hover{background:#1e3a5f;}
.q-count{font-size:13px;color:#9ea3b8;font-weight:600;}
.lang-accent{width:100%;font-size:12px;color:#1F699E;font-weight:600;padding:6px 2px 0;border-top:1px solid #f0f1f5;margin-top:4px;cursor:pointer;}
.lang-accent:hover{color:#2d5282;}
.q-toggle{font-size:12px;color:#9ea3b8;transition:transform 0.2s;}
.q-toggle.open{transform:rotate(180deg);}
.q-body{padding:10px 12px;display:flex;flex-wrap:wrap;gap:7px;transition:max-height 0.25s ease;align-content:flex-start;}
.q-body.collapsed{max-height:56px;overflow:hidden;}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:16px;background:#fff;border:1.5px solid #d5d9e3;cursor:pointer;transition:opacity 0.15s;max-width:100%;}
.chip-open{display:inline-flex;align-items:center;gap:8px;min-width:0;cursor:pointer;}
.chip.noclick,.chip.noclick .chip-open{cursor:default;}
.chip.noclick:hover{opacity:1;}
.seek-info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid #2d5282;border-radius:50%;font-size:9px;font-weight:700;color:#2d5282;margin-left:2px;cursor:pointer;flex-shrink:0;}
.seek-detail-pop{position:absolute;top:100%;left:0;margin-top:6px;z-index:50;background:#fff;border:1.5px solid #2d5282;border-radius:10px;padding:8px 26px 8px 12px;font-size:13px;color:#1f2a44;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:170px;max-width:260px;white-space:normal;text-align:left;line-height:1.4;}
.seek-pop-close{position:absolute;top:2px;right:5px;background:none;border:none;font-size:17px;line-height:1;color:#6b7280;cursor:pointer;padding:2px 4px;font-family:inherit;}
.seek-pop-close:hover{color:#1f2a44;}
.chip:hover{opacity:0.88;}
.chip-text{display:flex;flex-direction:column;min-width:0;line-height:1.15;}
.chip-label{font-size:12.5px;font-weight:700;color:#1f2a44;white-space:normal;overflow-wrap:anywhere;}
.chip-cat{font-size:10px;font-weight:600;color:#8a90a2;white-space:normal;overflow-wrap:anywhere;margin-top:1px;}
.chip-photo{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid #e0e2ea;flex-shrink:0;background:#4a6fa5;}
.chip-photo-fallback{width:30px;height:30px;border-radius:50%;background:#2d5282;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.chip.dim{opacity:0.3;}
.chip.match{background:#1a7f4b;border-color:#1a7f4b;}
.chip.match-need{background:#2d5282;border-color:#2d5282;}
.chip.match .chip-label,.chip.match-need .chip-label{color:#fff;}
.chip.match .seek-info,.chip.match-need .seek-info{color:#fff;border-color:rgba(255,255,255,0.7);}
.chip.match .chip-cat,.chip.match-need .chip-cat{color:rgba(255,255,255,0.72);}
.chip.match .chip-photo,.chip.match-need .chip-photo{border-color:rgba(255,255,255,0.35);}
.empty{font-size:12px;color:#c0c4d6;padding:4px 2px;font-style:italic;}
.loading{font-size:12px;color:#c0c4d6;padding:4px 2px;}
.hub-cant{}
@media(max-width:640px){.hub-cant{flex-basis:100%;text-align:center;margin-top:2px;}}
.show-all-pill-wrap{flex-basis:100%;margin-top:8px;text-align:right;}
.show-all-pill{display:inline-block;background:#2d5282;color:#fff;border-radius:24px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:background 0.15s;font-family:'DM Sans',sans-serif;}
.show-all-pill:hover{background:#1e3a5f;}
.back-hub{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.45);border-radius:20px;padding:8px 16px;cursor:pointer;text-decoration:none;margin-bottom:14px;}
.back-hub:hover{background:rgba(255,255,255,0.26);}
@media(max-width:640px){
  .event-header-row{flex-direction:column;align-items:stretch;}
  .hub-btn-group{align-self:flex-start;}
  .grid{grid-template-columns:1fr;}
}
/* My matches panel */
#matches-panel{background:#fff;border-radius:12px;padding:22px 26px;max-width:660px;margin:0 auto 20px;box-shadow:0 24px 64px rgba(0,0,0,0.25),0 4px 16px rgba(0,0,0,0.12);}
.mp-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:12px;flex-wrap:wrap;}
.mp-title{font-size:16px;font-weight:700;color:#1A2E42;}
.mp-sub{font-size:13px;color:#6A8FAF;}
.mp-back{font-size:13px;color:#1F699E;cursor:pointer;text-decoration:none;font-weight:600;}
.mp-back:hover{text-decoration:underline;}
.mp-key{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#6A8FAF;padding:10px 0 14px;margin-bottom:4px;border-bottom:1px solid #DDE4EE;}
.mp-key-item{display:inline-flex;align-items:center;gap:6px;}
.mp-key-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.mp-key-dot.share{background:#5DCAA5;}
.mp-key-dot.comp{background:#EE8B2C;}
.mp-key-dot.coseek{background:#7F77DD;}
.mp-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid #DDE4EE;}
.mp-row:first-of-type{border-top:none;padding-top:6px;}
.mp-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.mp-photo-fallback{width:44px;height:44px;border-radius:50%;background:#EBF3FA;color:#185FA5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
.mp-body{flex:1;min-width:0;}
.mp-name{font-size:14px;font-weight:700;color:#1A2E42;margin:0 0 8px;}
.mp-list{display:flex;flex-direction:column;gap:8px;}
.mp-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#1A2E42;}
.mp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px;display:inline-block;}
.mp-dot.share{background:#5DCAA5;}
.mp-dot.comp{background:#EE8B2C;}
.mp-dot.coseek{background:#7F77DD;}
.mp-item-text{display:flex;flex-direction:column;}
.mp-item-name{line-height:1.3;}
.mp-note{font-size:11px;color:#6A8FAF;margin-top:2px;}
.mp-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.mp-btn{font-size:12px;padding:6px 14px;border-radius:16px;border:1px solid #B8CCDE;background:#fff;color:#1A2E42;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center;font-family:inherit;font-weight:500;}
.mp-btn:hover{background:#F7F9FC;}
.mp-btn.primary{background:#2d5282;color:#fff;border-color:#2d5282;}
.mp-btn.primary:hover{background:#1e3a5f;}
.mp-empty{padding:40px 20px;text-align:center;color:#6A8FAF;font-size:14px;}
.mp-search-wrap{padding:0 0 12px;}
.mp-search{width:100%;padding:10px 14px;border:1px solid #DDE4EE;border-radius:20px;font-size:14px;font-family:'DM Sans',sans-serif;background:#F7F9FC;color:#1A2E42;box-sizing:border-box;}
.mp-search:focus{outline:none;border-color:#1F699E;background:#fff;}
</style>
</head>

<div class="header-stack">
  <div class="event-header">
    <div class="event-header-row">
      <div class="event-header-left">
        <div class="event-title" id="event-title">Community</div>
        <div class="event-meta" id="event-meta"></div>

var _myNeed={};                   // lower(item) -> true : my needs

var _needersByItem={};            // lower(item) -> {normId:true} everyone who needs it

var _myProvide={};                // lower(item) -> true : what I can provide

function normId(id){return String(id||'').split('.').join('').toLowerCase();}
function escHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Hover-URL leak protection: anchors that would carry memberCard / me / show / id in a static
// href are rendered WITHOUT an href, and the real URL lives in data-nav — read at click time.
// Browser's hover URL preview stays empty; tooltip content comes from the native title="" attr.
window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var t=e.target;if(t&&t.tagName==='A'&&!t.hasAttribute('href')&&t.hasAttribute('data-nav')){e.preventDefault();_safeNavGo(t);}});
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ── Tag parsing (must match intake.html serialization) ──
// stored per item as "item" or "item:level" (2 parts) or "item:category:level" (3 parts)
function parseTagStr(str){
  if(!str) return [];
  return String(str).split(/[|,]/).filter(Boolean).map(function(s){
    var p=s.split(':');
    // meta = everything after the item: roles for interests (Fan,Participant,Coach), level for skills
    return {item:(p[0]||'').trim(), category:(p.length>=3?p[1]:'').trim(), meta:p.slice(1).join(':').trim()};
  }).filter(function(o){return o.item;});
}
// Ikigai interests only: items split on | (never comma) because a single item may carry a
// comma-separated multi-role suffix like "Kayaking:Participant,Fan". Comma-splitting here
// used to break "Fan" off as its own bogus chip.
function parseIkigaiInterests(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var p=s.split(':');
    return {item:(p[0]||'').trim(), category:(p.length>=3?p[1]:'').trim(), meta:p.slice(1).join(':').trim()};
  }).filter(function(o){return o.item;});
}
// Display helper: title-case the first letter of each whitespace-separated word.
// Preserves internal casing so acronyms like MTG / PNW stay untouched.
function titleCase(s){
  return String(s||'').split(/(\s+)/).map(function(w){
    return w && w.charAt(0) ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  }).join('');
}
// needs stored as "item[:local]:ntype:category"
function parseNeeds(str){
  if(!str) return [];
  return String(str).split(/[|,]/).filter(Boolean).map(function(s){
    var detail=''; var tio=s.indexOf('~'); if(tio>-1){ try{detail=decodeURIComponent(s.slice(tio+1));}catch(e){detail=s.slice(tio+1);} s=s.slice(0,tio); }
    var p=s.split(':');
    var local=p[1]==='local';
    var ntype=local?(p[2]||'skill'):(p[1]||'skill');
    var catParts=(local?p.slice(3):p.slice(2)).join(':').split(' / ');
    return {item:(p[0]||'').trim(), ntype:ntype, category:(catParts[0]||'').trim(), detail:detail};
  }).filter(function(n){return n.item;});
}

// ── Reference-data lookups ──
// Fuzzy category lookup. Exact match first (fast), then a substring pass so Main-sourced
// chips (Specialties, Indie shines in, etc.) still pick up a category when the label is
// close but not identical to a reference-data entry. Results are memoized in _refCache.
var _refCache={};
function refFor(item){
  var key=String(item||'').toLowerCase().trim();
  if(!key) return {category:'',associations:''};
  if(_refCache.hasOwnProperty(key)) return _refCache[key];
  if(_catMap[key]){ _refCache[key]=_catMap[key]; return _catMap[key]; }
  for(var k in _catMap){
    if(!_catMap.hasOwnProperty(k) || !k) continue;
    if(key.indexOf(k)>-1 || k.indexOf(key)>-1){ _refCache[key]=_catMap[k]; return _catMap[k]; }
  }
  var empty={category:'',associations:''};
  _refCache[key]=empty;
  return empty;
}
async function loadRefData(){
  try{
    var res=await fetch(GS_URL+'?action=getReferenceData');
    var d=await res.json();
    ['skills','recreation','values','domains'].forEach(function(k){
      (d[k]||[]).forEach(function(r){
        if(!r.item) return;
        _catMap[String(r.item).toLowerCase()]={category:r.category||'',associations:r.associations||''};
      });
    });
  }catch(e){}
}
async function loadCategories(){
  try{
    var res=await fetch(GS_URL+'?action=getCategories');
    var d=await res.json();
    (d.categories||[]).forEach(function(c){ if(c.label) _parentCats[String(c.label).toLowerCase()]=true; });
  }catch(e){}
}

// ── Event header ──
function fmtDate(d){
  if(!d) return '';
  if(String(d)==='TBD') return 'Date to be announced';
  var s=String(d).split('T')[0];         // drop any time/UTC-Z suffix - keep just the date
  var dt=new Date(s+'T00:00:00');        // parse as local midnight, not UTC midnight, to avoid the previous-day shift
  if(!isNaN(dt.getTime())) return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  return String(d);
}
async function loadEvent(){
  // GROUP-MVP-3: header shows the group name from GROUP_NAMES, and ONLY when a viewer is
  // signed in (memberCard=). Anonymous viewers see a generic "Group" label — group names are
  // not exposed publicly. Optional soft fallback to a mapped display event via getEventById
  // when the id is not in GROUP_NAMES.
  var titleEl=document.getElementById('event-title');
  var metaEl=document.getElementById('event-meta');
  if(metaEl) metaEl.textContent='';
  if(!titleEl) return;
  var setTitle=function(name){ titleEl.textContent = name ? ('Group: ' + name) : 'Group'; };
  if(!_myId){ setTitle(''); return; }
  var mapped=GROUP_NAMES[_groupId];
  if(mapped){ setTitle(mapped); return; }
  if(!_eventId){ setTitle(''); return; }
  try{
    var res=await fetch(GS_URL+'?action=getEventById&id='+encodeURIComponent(_eventId));
    var d=await res.json();
    if(!d.found||!d.event){ setTitle(''); return; }
    var ev=d.event;
    setTitle(ev.title||'');
    window._hostEmail=ev.hostEmail||ev.contactEmail||'';
    var _hb=document.getElementById('hub-help-btn'); if(_hb) _hb.style.display=window._hostEmail?'':'none';
  }catch(e){ setTitle(''); }
}

// ── Members ──
async function loadMembers(){
  // ONE batched call (getGroupMembers) returns every Main-sheet profile whose "Groups joined"
  // cell includes _groupId, joined to their ikigai fields. Same shape as getEventProfiles so
  // the rest of this file is unchanged. Falls back to the legacy per-person path if the gate
  // is not yet updated (in which case the GAS returns its events-list fallback with no .attendees).
  try{
    var res=await fetch(GS_URL+'?action=getGroupMembers&groupId='+encodeURIComponent(_groupId)+(_myId?'&me='+encodeURIComponent(_myId):''));
    var d=await res.json();
    if(d && d.attendees){
      // Filter out test/staff accounts and photoless guests before anything downstream sees them.
      // Photoless guests are ones Main has no Image column value for (legacy imports, or accounts
      // where the photo upload never completed).
      var _dropTest=0, _dropNoPhoto=0;
      var attendees=d.attendees.filter(function(p){
        var nm=String(p.first||p.name||'').toLowerCase().trim();
        if(nm === 'test' || nm.indexOf('test ') === 0){ _dropTest++; return false; }
        if(!p.photo || !String(p.photo).trim()){ _dropNoPhoto++; return false; }
        return true;
      });
      try{ console.log('[group-hub] filtered', _dropTest, 'test accounts and', _dropNoPhoto, 'photoless guests out of', d.attendees.length); }catch(e){}
      attendees.forEach(function(p){ _photoMap[normId(p.appearId)]={photo:p.photo||'',pageLink:p.pageLink||''}; });
      attendees.forEach(function(p){ processRow(p, p.appearId); });
      if(d.me){ if(!_photoMap[normId(d.me.appearId)]) _photoMap[normId(d.me.appearId)]={photo:d.me.photo||'',pageLink:d.me.pageLink||''}; processRow(d.me, d.me.appearId); }
      // GROUP-MVP-3: in the group-hub context there is no per-event RSVP concept.
      // Anyone signed in with a memberCard is treated as "registered" and can click chips.
      _meRegistered = !!_myId;
      // Viewer signed in but not in this group -> pull their Main profile so matching still runs.
      // getGroupMembers only returns rows in the group, so a signed-in viewer outside the group
      // would otherwise have no _myData and see zero matches.
      if(_myId && !_myData) await loadMyDataFallback();
      computeGlobals(); buildChips(); renderAll();
      return;
    }
  }catch(e){}
  await loadMembersLegacy();
}

async function loadMembersLegacy(){
  _meRegistered = !!_myId;   // legacy fallback (no meRegistered available)
  // 1) Who is here (public, non-cancelled) + their photos
  var attendees=[];
  try{
    var res=await fetch(GS_URL+'?action=getAttendees&eventId='+encodeURIComponent(_eventId));
    var d=await res.json();
    attendees=d.attendees||[];
  }catch(e){}
  attendees.forEach(function(a){
    _photoMap[normId(a.appearId)]={photo:a.photo||a.profileUrl||'',pageLink:a.pageLink||''};
  });

  // Load chips for every attendee, plus me (so matching works even if I'm private)
  var ids=attendees.map(function(a){return a.appearId;});
  if(_myId && ids.map(normId).indexOf(normId(_myId))<0) ids.push(_myId);

  await Promise.all(ids.map(function(id){return loadMember(id);}));
  computeGlobals();
  buildChips();
  renderAll();
}

async function loadMember(appearId){
  try{
    var res=await fetch(GS_URL+'?action=getIntake&appearId='+encodeURIComponent(appearId));
    var d=await res.json();
    if(!d.found||!d.data) return;
    processRow(d.data, appearId);
  }catch(e){}
}

async function loadMyDataFallback(){
  if(!_myId || _myData) return;
  try{
    var res = await fetch(GS_URL+'?action=getMainProfile&appearId='+encodeURIComponent(_myId));
    var d = await res.json();
    if(!d || !d.found || !d.data) return;
    var data = d.data;
    _myData = {
      appearId: _myId,
      photo: data.photo || '',
      pageLink: data.pageLink || '',
      name: data.first || data.name || _myId,
      search: '',
      skills: parseTagStr(data.skills),
      interests: parseTagStr(data.interests),
      values: parseTagStr(data.values).concat(parseTagStr(data.domains)),
      needs: parseNeeds(data.needs),
      languages: String(data.languages||'').split('|').map(function(s){return s.trim();}).filter(Boolean)
    };
  }catch(e){}
}

// Union merge: ikigai items win on duplicates (they carry sub-levels), Main-only items still surface.
function unionByItem(mainArr, ikArr){
  var out=[]; var seen={};
  (ikArr||[]).forEach(function(x){
    if(!x||!x.item) return;
    var k=String(x.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(x);
  });
  (mainArr||[]).forEach(function(x){
    if(!x||!x.item) return;
    var k=String(x.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(x);
  });
  return out;
}
function processRow(data, appearId){
  if(_members.some(function(m){return normId(m.appearId)===normId(appearId);})) return;
  var pm=_photoMap[normId(appearId)]||{};
  // Searchable blob: include Main AND ikigai tokens so header search finds people via ikigai items too.
  var search=String([data.first,data.name,data.languages,data.advocating,
    data.skills,data.interests,data.values,data.domains,data.needs,data.hobbies,data.professionalServices,
    data.ikigaiSkills,data.ikigaiInterests,data.ikigaiValues,data.ikigaiDomains,data.ikigaiNeeds
  ].filter(Boolean).join(' ')).toLowerCase();
  // Rule of thumb: Main-sourced items that lack an ikigai-shaped category subtitle are only
  // shown as a FALLBACK when the corresponding ikigai lane is empty. That's what suppresses
  // bare chips like "Advisor", "Feedback provider", "Professional services", or the
  // 13-parent-category "Desired community type" labels once someone has real ikigai data.
  var mainSkills        = parseTagStr(data.skills);
  var mainCommunityType = parseTagStr(data.interests);        // Main.Desired community type — fallback for interests when ikigai is empty
  var mainProfSvc       = data.professionalServices ? parseTagStr(data.professionalServices) : [];   // Main.Professional services — fallback for skills when ikigai is empty
  // Main.Hobbies — comma-separated, may carry :Coach role suffix; drop >2 word tokens as a safety net.
  // Every hobby defaults to a Participant role tag; Coach wins if we detected it during import.
  var mainHobbies       = data.hobbies
    ? parseTagStr(data.hobbies)
        .filter(function(h){ return h.item.split(/\s+/).length <= 2; })
        .map(function(h){ if(!h.meta) h.meta='Participant'; return h; })
    : [];
  var mainValues        = parseTagStr(data.values).concat(parseTagStr(data.domains));   // Main.values now includes Eco focus via getGroupMembers
  var mainNeeds         = parseNeeds(data.needs);
  var ikSkills          = data.ikigaiSkills    ? parseTagStr(data.ikigaiSkills)    : [];
  var ikInterests       = data.ikigaiInterests ? parseIkigaiInterests(data.ikigaiInterests) : [];
  var ikValues          = data.ikigaiValues    ? parseTagStr(data.ikigaiValues).concat(data.ikigaiDomains?parseTagStr(data.ikigaiDomains):[]) : (data.ikigaiDomains?parseTagStr(data.ikigaiDomains):[]);
  var ikNeeds           = data.ikigaiNeeds     ? parseNeeds(data.ikigaiNeeds)      : [];
  var member={
    appearId:appearId,
    photo:pm.photo||'',
    pageLink:pm.pageLink||'',
    name:data.first||data.name||appearId,   // first name once getEventProfiles returns it; the id is only a last resort
    search:search,
    // Skills: Specialties + Indie shines in always; Professional services ONLY when ikigai is empty; ikigai always
    skills:        ikSkills.length
                   ? unionByItem(mainSkills, ikSkills)
                   : unionByItem(mainSkills, mainProfSvc),
    // Interests: Hobbies always; Desired community type ONLY when ikigai.interests is empty; ikigai always.
    // Default meta = Participant so every recreational chip has a role subtitle (Coach wins if hobby carried :Coach).
    interests:     (ikInterests.length
                   ? unionByItem(mainHobbies, ikInterests)
                   : unionByItem(mainHobbies, mainCommunityType))
                   .map(function(x){ if(!x.meta) x.meta='Participant'; return x; }),
    communityType: mainCommunityType,                        // still exposed as a separate lane for future event matching
    values:        unionByItem(mainValues, ikValues),
    // Needs: union ikigai + Main.Seeking pro bono. Ikigai carries context (category subtitles) so it renders first;
    // bare Main needs (Advisor, Feedback provider, Mentor) still surface as extra context alongside.
    needs:         unionByItem(mainNeeds, ikNeeds),
    languages:String(data.languages||'').split('|').map(function(s){return s.trim();}).filter(Boolean)
  };
  _members.push(member);
  if(normId(appearId)===normId(_myId)) _myData=member;
}

// ── Global lookups for matching ──
function addTo(map, item, id){
  var k=String(item||'').toLowerCase(); if(!k) return;
  if(!map[k]) map[k]={};
  map[k][normId(id)]=true;
}
// A person can PROVIDE an item if it's one of their Skills, or an interest where they marked a Coach role.
// Fans / Participants are NOT providers, so they never satisfy someone's need.
function isCoach(x){ return /coach/i.test((x&&x.meta)||''); }
function computeGlobals(){
  _myOffer={}; _myNeed={}; _offerersByItem={}; _needersByItem={}; _providersByItem={}; _myProvide={};
  _members.forEach(function(m){
    ['skills','interests','values'].forEach(function(f){
      (m[f]||[]).forEach(function(x){ addTo(_offerersByItem, x.item, m.appearId); });
    });
    (m.skills||[]).forEach(function(x){ addTo(_providersByItem, x.item, m.appearId); });
    (m.interests||[]).forEach(function(x){ if(isCoach(x)) addTo(_providersByItem, x.item, m.appearId); });
    (m.needs||[]).forEach(function(n){ addTo(_needersByItem, n.item, m.appearId); });
  });
  if(_myData){
    ['skills','interests','values'].forEach(function(f){
      (_myData[f]||[]).forEach(function(x){ if(x.item) _myOffer[x.item.toLowerCase()]=true; });
    });
    (_myData.skills||[]).forEach(function(x){ if(x.item) _myProvide[x.item.toLowerCase()]=true; });
    (_myData.interests||[]).forEach(function(x){ if(x.item && isCoach(x)) _myProvide[x.item.toLowerCase()]=true; });
    (_myData.needs||[]).forEach(function(n){ if(n.item) _myNeed[n.item.toLowerCase()]=true; });
  }
}
// true if anyone OTHER THAN me is in this {normId:true} set
function someoneElse(map){
  if(!map) return false;
  var mine=normId(_myId);
  for(var k in map){ if(k!==mine) return true; }
  return false;
}

// ── One chip per person per item (parent categories excluded) ──
// Round-robin ordering: chips are grouped by person, and the returned list interleaves
// one chip from each person before returning to any person for a second chip. This means
// the first N chips shown in a quadrant are all different people (up to the unique-people
// count); the sixth chip of a very prolific person only appears after everyone else has
// contributed five. Show all still reveals every chip.
function memberChips(field){
  var byPerson={};
  var pids=[];   // insertion order, then shuffled
  _members.forEach(function(m){
    var pid=normId(m.appearId);
    var seen={};
    (m[field]||[]).forEach(function(it){
      var label=(it.item||'').trim(); if(!label) return;
      var low=label.toLowerCase();
      if(_parentCats[low]) return;            // never show a 1st-degree parent category
      if(seen[low]) return; seen[low]=true;   // one chip per person per item
      if(!byPerson[pid]){ byPerson[pid]=[]; pids.push(pid); }
      byPerson[pid].push({item:label, category:it.category||'', meta:it.meta||'', detail:it.detail||'', member:{appearId:m.appearId, photo:m.photo, pageLink:m.pageLink, search:m.search||''}});
    });
  });
  pids=shuffle(pids);
  pids.forEach(function(pid){ byPerson[pid]=shuffle(byPerson[pid]); });
  var out=[]; var maxLen=0;
  pids.forEach(function(pid){ if(byPerson[pid].length>maxLen) maxLen=byPerson[pid].length; });
  for(var i=0;i<maxLen;i++){
    pids.forEach(function(pid){ if(byPerson[pid][i]) out.push(byPerson[pid][i]); });
  }
  if (field === 'needs') {
    // Needs: ikigai-context chips (have a category subtitle like "Food & Drink", "Business & Finance")
    // render first; bare Main.Seeking pro bono chips (Advisor, Mentor, Feedback provider) come after.
    // Round-robin ordering within each half preserves per-person diversity in the shown slice.
    var withCat = out.filter(function(c){ return c.category; });
    var bare    = out.filter(function(c){ return !c.category; });
    return withCat.concat(bare);
  }
  return out;
}
// Languages spoken across everyone here, de-duped case-insensitively, alphabetical.
// Shown as a one-line accent under the skills chips (so nothing gets squeezed), and in full on Show all.
function allLanguages(){
  var seen={};
  _members.forEach(function(m){
    (m.languages||[]).forEach(function(l){
      var k=l.toLowerCase(); if(!seen[k]) seen[k]=l;
    });
  });
  return Object.keys(seen).sort().map(function(k){ return seen[k]; });
}
function buildChips(){
  _chips.skills   =memberChips('skills');
  _chips.interests=memberChips('interests');
  _chips.values   =memberChips('values');
  _chips.needs    =memberChips('needs');
  renderGuestPhotos();
}

// GROUP-MVP-3: photo strip of everyone in the group, below the header. Clickable when a viewer
// is known (memberCard=), otherwise inert. Shows the first PHOTOS_INITIAL guests and a
// "Show all (N)" button that expands inline. Every img uses loading="lazy" so large groups
// (Appear Network at 697 members) do not stall the tab on load. Guests whose name is "test"
// (case-insensitive) are filtered out.
var PHOTOS_INITIAL=(window.matchMedia && window.matchMedia('(max-width: 720px)').matches) ? 20 : 60;
var PHOTOS_STEP=30;             // "Load more" adds this many at a time
var _photosShown=PHOTOS_INITIAL;
var _shuffledMembers=null;      // shuffled once per session and reused so the browser cache hits on re-renders
var _withCount=0;               // count of viewer + members with any profile info; used to hide empties from the initial strip when the group has >30 people
function renderGuestPhotos(){
  var el=document.getElementById('guest-photos');
  if(!el) return;
  var visible=_members.filter(function(m){
    var nm=(m.name||m.first||'').toLowerCase().trim();
    if (nm === 'test' || nm.indexOf('test ') === 0) return false;
    if (_searchQ && (!m.search || m.search.indexOf(_searchQ) === -1)) return false;
    return true;
  });
  if(!visible.length){ el.style.display='none'; return; }
  // Shuffle ONCE per session and reuse. Subsequent renders (Load more, Show fewer) reuse
  // the same order so the browser cache serves the same img URLs without a fresh flicker.
  if(!_shuffledMembers || _shuffledMembers.length !== visible.length){
    var _shuf=shuffle(visible.slice());
    // Partition: viewer first (if present), then people with any profile info, then empty profiles.
    // "Empty" = zero items across skills, interests, values, needs, AND community type (Main data too).
    var _mineNorm = _myId ? normId(_myId) : '';
    var _hasData = function(m){
      return (m.skills&&m.skills.length) || (m.interests&&m.interests.length) || (m.values&&m.values.length) || (m.needs&&m.needs.length) || (m.communityType&&m.communityType.length);
    };
    var _mine=null, _with=[], _without=[];
    _shuf.forEach(function(m){
      if(_mineNorm && normId(m.appearId)===_mineNorm){ _mine=m; return; }
      if(_hasData(m)) _with.push(m); else _without.push(m);
    });
    _shuffledMembers = (_mine?[_mine]:[]).concat(_with).concat(_without);
    _withCount = (_mine?1:0) + _with.length;
  }
  var ordered=_shuffledMembers;
  el.style.display='';
  var n=ordered.length;
  // Groups over 30 people: hide empties from the initial strip; they still surface at the bottom
  // of Show more (because _without sits last in _shuffledMembers). ≤30 people: everyone shows.
  var HIDE_EMPTIES_THRESHOLD = 30;
  var initialCap = (n > HIDE_EMPTIES_THRESHOLD) ? _withCount : n;
  var showCount = (_photosShown === PHOTOS_INITIAL)
    ? Math.min(_photosShown, initialCap)
    : Math.min(_photosShown, n);
  var slice=ordered.slice(0, showCount);
  var head='<div class="gp-count">'+n+' '+(n===1?'person':'people')+' here</div>';
  var cells=slice.map(function(m){
    var display=m.name||m.appearId||'';
    // No initial fallback: if the photo URL 404s, drop the whole cell rather than showing
    // a lone letter (avoids the 'A' problem she flagged).
    var inner=m.photo
      ? '<img src="'+escHTML(m.photo)+'" alt="" loading="lazy" onerror="var p=this.closest(\'.guest-photo\'); if(p) p.remove();">'
      : '';
    if(!inner) return '';
    var attrs=' title="'+escHTML(display)+'"';
    if(_myId){
      attrs+=' onclick="openProfile(\''+escHTML(m.appearId||'')+'\',\''+escHTML(m.pageLink||'')+'\')"';
      return '<div class="guest-photo"'+attrs+'>'+inner+'</div>';
    }
    return '<div class="guest-photo noclick"'+attrs+'>'+inner+'</div>';
  }).join('');
  var buttons='';
  if(showCount < n){
    var remain=n-showCount;
    var step=Math.min(PHOTOS_STEP, remain);
    buttons+='<button class="gp-more" onclick="loadMorePhotos()">Show more</button>';
  }
  if(_photosShown > PHOTOS_INITIAL){
    buttons+=' <button class="gp-more" onclick="resetPhotos()">Show fewer</button>';
  }
  el.innerHTML=head+cells+buttons;
}
window.loadMorePhotos=function(){ _photosShown += PHOTOS_STEP; renderGuestPhotos(); };
window.resetPhotos=function(){ _photosShown = PHOTOS_INITIAL; renderGuestPhotos(); try{document.getElementById('guest-photos').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){} };

// ── Match colour for a single person's chip (never pairs a user with themselves) ──
// Offering chip (skills / interests / values):
//   orange = another person needs what I offer, or I need what THIS person offers
//   green  = the same item I also have, and at least one OTHER person has it too
function matchOfferingChip(entry){
  var x=entry.item.toLowerCase();
  var mNorm=normId(entry.member.appearId), mine=normId(_myId);
  // orange = provider ↔ need. THIS person must be able to provide x (skill/coach), not just be a fan.
  if((mNorm!==mine && _myNeed[x] && _providersByItem[x] && _providersByItem[x][mNorm])
     || (mNorm===mine && _myProvide[x] && someoneElse(_needersByItem[x]))) return 'orange';
  if(_myOffer[x] && someoneElse(_offerersByItem[x])) return 'green';
  return '';
}
// Need chip:
//   orange = I offer what THIS person needs, or another person offers what I need
//   green  = the same need I also have, and at least one OTHER person needs it too
function matchNeedChip(entry){
  var x=entry.item.toLowerCase();
  var mNorm=normId(entry.member.appearId), mine=normId(_myId);
  // orange = a provider ↔ need. I must be able to provide THEIR need, or a real provider can meet mine.
  if((mNorm!==mine && _myProvide[x]) || (mNorm===mine && someoneElse(_providersByItem[x]))) return 'orange';
  if(_myNeed[x] && someoneElse(_needersByItem[x])) return 'green';
  return '';
}

// Need chips carry an optional "what exactly I'm seeking" detail; tap the (i) to reveal it under the chip.
var _hubPopCtr=0;
window.toggleHubSeek=function(id){
  var el=document.getElementById(id); if(!el) return;
  var willOpen=(el.style.display==='none'||!el.style.display);
  var pops=document.querySelectorAll('.seek-detail-pop');
  for(var k=0;k<pops.length;k++){ pops[k].style.display='none'; if(pops[k].parentNode) pops[k].parentNode.style.zIndex=''; }
  el.style.display=willOpen?'block':'none';
  if(willOpen && el.parentNode) el.parentNode.style.zIndex='1000';   // raise this chip so its popover sits above the row below
};
// Click anywhere outside an open seeking popover (and not on an (i)) closes it.
document.addEventListener('click', function(e){
  if(e.target && e.target.closest && (e.target.closest('.seek-detail-pop')||e.target.closest('.seek-info'))) return;
  var pops=document.querySelectorAll('.seek-detail-pop');
  for(var k=0;k<pops.length;k++){ if(pops[k].style.display==='block'){ pops[k].style.display='none'; if(pops[k].parentNode) pops[k].parentNode.style.zIndex=''; } }
});
function chipHTML(entry, matchType, needsMode, key){
  var label=entry.item;
  var mem=entry.member||{};
  var photo=mem.photo;
  var dim=_matchMode&&!matchType;
  var cls='chip'+(dim?' dim':'')+(matchType==='green'?' match':'')+(matchType==='orange'?' match-need':'')+(_myId?'':' noclick');
  // Subtitle sourcing:
  //  - needs: entry.category (from parseNeeds, already meaningful)
  //  - interests: entry.meta (role — Participant, Fan, Coach); blank if no role. Reference-data category ignored here because it produces bad joins like Beach→Court.
  //  - everything else (skills, values): reference-data category
  var cat;
  if(needsMode){ cat=entry.category||''; }
  else if(key==='interests'){ cat=(entry.meta||'').split(',').map(function(s){return s.trim();}).filter(Boolean).join(', '); }
  else { cat=refFor(label).category||''; }
  if(cat==='Domain'){ cat = (key==='values') ? 'Domain interest' : ''; }   // "Domain interest" reads only in the Values quadrant; drop it from Skills so entries like "Technology Generalist / Domain interest" go clean
  var initial=escHTML((label||'?').charAt(0).toUpperCase());
  var photoEl=photo
    ?'<img class="chip-photo" src="'+escHTML(photo)+'" alt="" data-initial="'+initial+'" onerror="imgFallback(this)">'
    :'<div class="chip-photo-fallback">'+initial+'</div>';
  var catEl=cat?'<span class="chip-cat">'+escHTML(cat)+'</span>':'';
  var infoEl='';   // (i) seeking-detail removed from hub chips
  var popEl='';
  // Click into a profile only on the signed-in hub (has memberCard); anonymous chips are not clickable.
  var _chipInner=photoEl+'<div class="chip-text"><span class="chip-label">'+escHTML(titleCase(label))+'</span>'+catEl+'</div>';
  var openInner=_myId
    ? '<span class="chip-open" onclick="openProfile(\''+escHTML(mem.appearId||'')+'\',\''+escHTML(mem.pageLink||'')+'\')">'+_chipInner+'</span>'
    : '<span class="chip-open" style="cursor:default;">'+_chipInner+'</span>';
  return '<div class="'+cls+'" title="'+escHTML(label)+'">'
    +openInner
    +infoEl
    +popEl
    +'</div>';
}

window.imgFallback=function(img){
  var initial=img.getAttribute('data-initial')||'?';
  var div=document.createElement('div');
  div.className='chip-photo-fallback';
  div.textContent=initial;
  img.parentNode.replaceChild(div,img);
};

// ── My matches panel ──
// Walks every chip once, buckets hits per person into shared (green) + complementary (orange),
// sorts by total match count desc. Direction on the orange items is filled from which side
// (viewer.needs vs member.needs) triggered the match.
function computeMyMatches(){
  if(!_myData) return [];
  var mine=normId(_myId);
  var byPerson={};
  function slotFor(mem){
    var mid=normId(mem.appearId);
    if(!byPerson[mid]) byPerson[mid]={appearId:mem.appearId,photo:mem.photo||'',pageLink:mem.pageLink||'',shared:{},comp:{},coseek:{}};
    return byPerson[mid];
  }
  ['skills','interests','values'].forEach(function(field){
    (_chips[field]||[]).forEach(function(en){
      if(normId(en.member.appearId)===mine) return;
      var mt=matchOfferingChip(en); if(!mt) return;
      var slot=slotFor(en.member);
      var key=en.item.toLowerCase();
      if(mt==='green'){ slot.shared[key]={item:en.item}; }
      else if(mt==='orange'){ slot.comp[key]={item:en.item, direction:'they offer / you need'}; }
    });
  });
  (_chips.needs||[]).forEach(function(en){
    if(normId(en.member.appearId)===mine) return;
    var mt=matchNeedChip(en); if(!mt) return;
    var slot=slotFor(en.member);
    var key=en.item.toLowerCase();
    // Both need the same thing -> its own bucket (purple), not lumped in with "in common" offers.
    if(mt==='green'){ slot.coseek[key]={item:en.item}; }
    else if(mt==='orange'){ slot.comp[key]={item:en.item, direction:'you offer / they need'}; }
  });
  var out=[];
  Object.keys(byPerson).forEach(function(mid){
    var s=byPerson[mid];
    var mem=_members.find(function(m){return normId(m.appearId)===mid;});
    if(!mem) return;
    s.name=mem.name||mem.appearId;
    s.sharedList=Object.keys(s.shared).map(function(k){return s.shared[k];});
    s.compList=Object.keys(s.comp).map(function(k){return s.comp[k];});
    s.coseekList=Object.keys(s.coseek).map(function(k){return s.coseek[k];});
    out.push(s);
  });
  // Priority order: offer/need > both-need > in-common. Any comp match beats any row without one,
  // then coseek, then shared as the final tie-break.
  out.sort(function(a,b){
    if(b.compList.length!==a.compList.length) return b.compList.length-a.compList.length;
    if(b.coseekList.length!==a.coseekList.length) return b.coseekList.length-a.coseekList.length;
    return b.sharedList.length-a.sharedList.length;
  });
  return out;
}

var _matchesQ='';
function renderMatchesPanel(){
  var el=document.getElementById('matches-panel'); if(!el) return;
  var matches=computeMyMatches();
  var total=matches.length;
  var q=_matchesQ;
  var filtered=q ? matches.filter(function(m){
    if((m.name||'').toLowerCase().indexOf(q)>-1) return true;
    for(var i=0;i<m.sharedList.length;i++){ if(m.sharedList[i].item.toLowerCase().indexOf(q)>-1) return true; }
    for(var j=0;j<m.compList.length;j++){ if(m.compList[j].item.toLowerCase().indexOf(q)>-1) return true; }
    for(var k=0;k<m.coseekList.length;k++){ if(m.coseekList[k].item.toLowerCase().indexOf(q)>-1) return true; }
    return false;
  }) : matches;
  var n=filtered.length;
  var titleLine=q
    ? n+' of '+total+' '+(total===1?'match':'matches')
    : total+' '+(total===1?'person':'people')+' match you';
  var head='<div class="mp-head"><div><div class="mp-title">'+titleLine+'</div>'+(total?'<div class="mp-sub">Most matches first</div>':'')+'</div></div>';
  var key='<div class="mp-key"><span class="mp-key-item"><span class="mp-key-dot comp"></span>Offer/need match</span><span class="mp-key-item"><span class="mp-key-dot coseek"></span>You both need this</span><span class="mp-key-item"><span class="mp-key-dot share"></span>In common</span></div>';
  var search=total>5 ? '<div class="mp-search-wrap"><input type="text" class="mp-search" placeholder="Search skills, interests, or needs" oninput="filterMatches(this.value)" value="'+escHTML(_matchesQ)+'"></div>' : '';
  if(!total){
    var msg=_myData
      ? 'Nobody in this group shares or complements your profile yet.'
      : 'Fill out your event profile to see who you match with here.';
    el.innerHTML=head+key+'<div class="mp-empty">'+escHTML(msg)+'</div>';
    return;
  }
  if(q && !n){
    el.innerHTML=head+key+search+'<div class="mp-empty">No matches for "'+escHTML(q)+'".</div>';
    var _sf=el.querySelector('.mp-search'); if(_sf){ _sf.focus(); var _v=_sf.value; _sf.value=''; _sf.value=_v; }

function renderSection(bodyId, countId, entries, needsMode, key){

    if(!_searchQ) return true;
    var cat=needsMode?(en.category||''):(refFor(en.item).category||'');
    if(en.item.toLowerCase().indexOf(_searchQ)>-1) return true;
    if(cat.toLowerCase().indexOf(_searchQ)>-1) return true;
    // Person-level search: match against the guest's full Main text (advocating, needs,
    // language, name, etc.). Keeps the chip when any of their Main data mentions the query.
    if(en.member && en.member.search && en.member.search.indexOf(_searchQ)>-1) return true;
    return false;
  });
  if(countEl){
    var ppl={}; filtered.forEach(function(en){ ppl[normId(en.member.appearId)]=true; });
    var n=Object.keys(ppl).length;
    var line=n+' '+(n===1?'person':'people');
    // Per-section item word so "4 people - 14 requests" reads the same shape across all four quadrants.
    var ITEM_WORD={skills:'skill', interests:'interest', values:'value', needs:'request'};
    var w=ITEM_WORD[key];
    if(w){ var r=filtered.length; line += ' - ' + r + ' ' + (r===1?w:w+'s'); }
    countEl.textContent=line;

  if(!filtered.length){ body.innerHTML='<span class="empty">Nothing here yet.</span>'; return; }
  var shown=filtered.slice(0,10);   // grid shows first 10; "Show all" opens the full in-page view
  var html=shown.map(function(en){

    html+='<div class="show-all-pill-wrap"><a class="show-all-pill" onclick="expandSection(\''+key+'\')">Show all ('+filtered.length+')</a></div>';
  }

  // skills chips keep their space. The full list lives in this section's "Show all" view.

async function loadGroupEvents(){
  if(!_groupId) return;
  try{
    var res = await fetch(GS_URL + '?t=' + Date.now());
    if(!res.ok) return;
    var all = await res.json();
    if(!Array.isArray(all)) return;

    _groupEvents = all.filter(function(e){

      if(e.isPrivate) return false;
      if(e.cancelled === true || e.cancelled === 'true') return false;
      if(!e.date) return false;
      var d = new Date(e.date + 'T00:00:00');
      return d >= today;
    }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    renderGroupEventsSection();
    renderHubNav();   // now that we know the count, the "Group events (N)" pill can appear
  }catch(e){}
}
function renderGroupEventsSection(){
  var el = document.getElementById('group-events'); if(!el) return;
  if(!_groupEvents.length){ el.style.display='none'; el.innerHTML=''; return; }
  var groupName = (typeof GROUP_NAMES !== 'undefined' && GROUP_NAMES[_groupId]) || 'this group';
  var cards = _groupEvents.map(function(ev){
    var when = ev.date + (ev.time ? ' · ' + ev.time : '');
    var url = 'https://gather.2gather.network/event.html?id=' + encodeURIComponent(ev.id) + (_myId ? '&memberCard=' + encodeURIComponent(_myId) : '');
    return '<a role="link" tabindex="0" data-nav="' + escHTML(url) + '" title="' + escHTML(ev.title||'Event') + '" onclick="return _safeNavGo(this)" '
      + 'style="display:block;background:#fff;border:1.5px solid #DDE4EE;border-radius:12px;padding:12px 14px;text-decoration:none;color:#1A2E42;cursor:pointer;">'
      + '<div style="font-size:14px;font-weight:800;color:#1A2E42;margin-bottom:4px;">' + escHTML(ev.title||'') + '</div>'
      + '<div style="font-size:12px;color:#6B7A8D;">🗓️ ' + escHTML(when) + '</div>'
      + '</a>';
  }).join('');
  el.style.display = '';
  el.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px 20px;margin:14px 20px 0;">'
    + '<div style="font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:12px;">📅 Group events — '+escHTML(groupName)+'</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;">' + cards + '</div>'
    + '</div>';
}
(async function init(){
  document.title='Group';                              // descriptive title for bookmarking
  var _sb=document.getElementById('hub-share-btn'); if(_sb && _eventId!=='m97sjwa3') _sb.style.display='none';   // QR share button is Lake-Ballinger-only
  if(!_myId){
    var _tb=document.querySelector('.top-bar'); if(_tb) _tb.style.display='none';
    var _sl=document.querySelector('.hub-search-slot'); if(_sl) _sl.style.display='none';   // search is signed-in-only
  }
  renderHubNav();                                          // in-app nav above the header (blue body)
  loadEvent();                                             // independent, fire-and-forget (sets host email for the envelope button)
  loadGroupEvents();                                       // fire-and-forget; updates nav pill + section when done
  var enrich=Promise.all([loadRefData(), loadCategories()]); // heavy — don't block first paint
  await loadMembers();                                     // first paint + sets _myData (do I have a profile?)
  renderProfileCta();                                      // "Build my event profile" when I have an ID but no profile
  renderHubNav();                                          // re-render: "Event profile" nav now knows if I have a profile
  updateHeaderButton();                                    // "My matches" only when I have a completed event profile
  if(_myData) loadContributions();                         // potluck / who's-bringing-what only for people with a profile
  await enrich;
  buildChips(); renderAll();                               // re-render with categories + exclusions
})();
// Hub "who's bringing what": group the event's sign-ups (getPotluckList) by item, each with photo + name -> event profile.
async function loadContributions(){
  // GROUP-MVP-1: potluck / "who's bringing what" is event-only. Skip entirely on the group hub.
  var el=document.getElementById('contrib-section'); if(el) el.innerHTML='';
  return;
  // legacy body below kept intact so the diff against attendees.html stays small:
  if(!_myData){ el.innerHTML=''; return; }                 // potluck sign-up list + "who's bringing what" only for people with a completed event profile
  var claims=[], typeMap={}, catMap={}, rawList='';
  try{
    var res=await fetch(GS_URL+'?action=getPotluckList&eventId='+encodeURIComponent(_eventId));
    var d=await res.json();
    claims=(d&&d.claims)||[];
    rawList=(d&&d.signupPotluck)?String(d.signupPotluck).trim():'';
    var sp=[]; try{ sp=JSON.parse(d.signupPotluck||'[]'); }catch(e){ sp=[]; }
    if(Array.isArray(sp)) sp.forEach(function(it){ if(it&&it.item){ typeMap[it.item]=(it.potluckType||''); catMap[it.item]=(it.category||''); } });
  }catch(e){}
  if(!claims.length && !rawList){ el.innerHTML=''; return; }   // only hide when there's no list AND no sign-ups
  // V2.81: one column, not three. The Skills and Things lanes sat empty while everything
  // real landed in Experiences, so two thirds of the section read as "Nothing here yet."
  // Only Experience sign-ups show here now; anything of another type is held back rather
  // than dropped, so nothing is lost if the lanes come back.
  var experiences=[], _held=[];
  claims.forEach(function(c){
    var t=(typeMap[c.item]||c.potluckType||'').trim().toLowerCase();
    (t==='experience'?experiences:_held).push(c);
  });
  function chip(c){
    var initial=escHTML((c.name||'?').charAt(0).toUpperCase());
    var ph=c.photo
      ?'<img class="chip-photo" src="'+escHTML(c.photo)+'" alt="" data-initial="'+initial+'" onerror="imgFallback(this)">'
      :'<div class="chip-photo-fallback">'+initial+'</div>';
    // V2.82: the type is no longer printed under the item. The column is already headed
    // "Experiences" and every item is one, so the word only repeated the heading on every
    // chip. Any legacy sub-type still shows; new items carry none and the line is omitted.
    var sub=(catMap[c.item]||c.category||'');
    var link=_profileUrl(c.appearId);
    var subEl=sub?'<span class="chip-cat">'+escHTML(sub)+'</span>':'';
    return '<a class="chip" role="link" tabindex="0" data-nav="'+link+'" title="'+escHTML(c.name||c.appearId||'View profile')+'" onclick="return _safeNavGo(this)" style="text-decoration:none;"><span>'+ph+'</span><span class="chip-text"><span class="chip-label">'+escHTML(c.item)+'</span>'+subEl+'</span></a>';
  }
  function col(title, list){
    var body=list.length?list.map(function(c){return chip(c);}).join(''):'<span class="empty">Nothing here yet.</span>';
    return '<div class="quadrant"><div class="q-header"><div><div class="q-title">'+title+'</div></div></div><div class="q-body">'+body+'</div></div>';
  }
  var cols=col('Experiences',experiences);
  el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 14px 0;flex-wrap:wrap;"><div style="font-size:18px;font-weight:800;color:#fff;">🎁 Who\'s bringing what</div>'
    +'</div>'   // V2.81: "Sign up list" button pulled while the sign-up flow is being reworked.
    +'<div class="grid" style="grid-template-columns:minmax(240px,1fr);">'+cols+'</div>';
}
