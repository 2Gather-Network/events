<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Groups I host — Design B (list)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
  .mock-tag{background:#FFF4CC;border:1px solid #E8C766;border-radius:8px;padding:6px 12px;font-size:12px;color:#5A3A00;font-weight:700;display:inline-block;margin-bottom:14px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:600;margin-bottom:14px;opacity:.92;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .btn{background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn.solid{background:#123f5f;color:#fff;}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:4px 6px 4px 16px;margin-bottom:14px;}
  .searchbar input{flex:1;border:none;background:transparent;font-family:inherit;font-size:15px;padding:8px 4px;outline:none;color:var(--ink);}
  .list{background:#fff;border-radius:14px;padding:6px 0;overflow:hidden;}
  .grow{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);}
  .grow:last-child{border-bottom:0;}
  .grow .img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#DDE4EE;}
  .grow .who{flex:1;min-width:0;}
  .grow .name{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2;}
  .grow .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:9px;margin-left:6px;}
  .badge.host{background:#E7F5EA;color:#1A5A2C;}
  .badge.cohost{background:#EEF6FF;color:#154F74;}
  .grow .acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .pending-dot{display:inline-block;background:#B36A0F;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px;}
  @media(max-width:640px){
    .grow{flex-wrap:wrap;}
    .grow .acts{width:100%;justify-content:flex-start;padding-left:54px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mock-tag">MOCKUP · Groups I host — Design B (compact list)</div>
  <div class="breadcrumb">‹ <a href="#">My profile</a> / Groups I host</div>

  <div class="head">
    <h1>Groups I host</h1>
    <a class="btn solid" href="#">+ Start a new group</a>
  </div>

  <div class="searchbar">
    <input type="text" placeholder="Search your groups…">
    <button class="btn sm">Search</button>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
  var GROUPS = [
    {name:'Seattle Tech Network', role:'host', members:62, offers:102, needs:44, pending:3, img:'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/mV6AgDKKrR9A9k9673KJ/pub/qwVNLMlt19536Vl5XRvI.png'},
    {name:'Climate Group', role:'host', members:38, offers:71, needs:29, pending:0},
    {name:'Appear Network', role:'host', members:654, offers:0, needs:0, pending:0},
    {name:'Campfire', role:'host', members:24, offers:40, needs:18, pending:1},
    {name:'GRC Network', role:'cohost', members:31, offers:58, needs:22, pending:0},
    {name:'Creating Works Co-Creation Team', role:'host', members:12, offers:33, needs:9, pending:2},
    {name:'Hack for Social Impact', role:'cohost', members:47, offers:88, needs:35, pending:0},
    {name:'Women in Tech Seattle Regatta', role:'host', members:29, offers:52, needs:20, pending:0},
    {name:'Lake Ballinger Center', role:'host', members:18, offers:26, needs:14, pending:0}
  ];
  var list = document.getElementById('list');
  GROUPS.forEach(function(g){
    var row = document.createElement('div'); row.className = 'grow';
    var pending = g.pending ? '<span class="pending-dot">'+g.pending+' new</span>' : '';
    row.innerHTML =
      (g.img ? '<img class="img" src="'+g.img+'" alt="">' : '<div class="img"></div>')
      + '<div class="who"><div class="name">'+g.name
      + '<span class="badge '+g.role+'">'+(g.role==='host'?'Host':'Co-host')+'</span>'+pending+'</div>'
      + '<div class="sub">'+g.members+' people · '+g.offers+' offers · '+g.needs+' needs</div></div>'
      + '<div class="acts">'
      + '<a class="btn ghost sm" href="#">Open</a>'
      + '<a class="btn ghost sm" href="#">Manage</a>'
      + '<a class="btn ghost sm" href="#">Invite</a>'
      + '</div>';
    list.appendChild(row);
  });
</script>
</body>
</html>
