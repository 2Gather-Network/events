<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>

<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">

<title>Manage attendees · 2Appear</title>
<link rel="icon" type="image/png" href="https://2gather.network/images/2gather_logo.png"><script src="/nav/tab-icon.js?v=1"></script><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#2F3D4F; --muted:#5A6878; --line:#DDE4EE; --card:#fff; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  .crumb{color:#fff;font-size:15px;margin-bottom:20px;}.crumb a{color:#fff;text-decoration:none;cursor:pointer;}.crumb b{font-weight:800;}
  .card{background:#fff;border-radius:14px;padding:20px 22px;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;}
  .sub{font-size:13.5px;color:var(--muted);margin:0;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px;}
  .chip{font:inherit;font-size:14px;font-weight:700;border:1.5px solid #C9D6E4;background:#fff;color:var(--brand);border-radius:22px;padding:7px 14px;cursor:pointer;}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .search{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:#DDE4EE;overflow:hidden;}
  .av img{width:100%;height:100%;object-fit:cover;display:block;}
  .nm{font-weight:700;}.meta{font-size:13px;color:var(--muted);}
  .pill{font-size:12.5px;font-weight:700;color:var(--brand);background:#EAF2FA;border:1px solid #C9DFF3;border-radius:16px;padding:4px 10px;white-space:nowrap;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .b{background:var(--brand);color:#fff;border:0;border-radius:24px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;}
  .say{font-size:14px;color:var(--soft);padding:12px 0;}
  .foot{font-size:12.5px;color:var(--muted);margin:14px 0 0;}
  @keyframes br{0%,100%{opacity:.35}50%{opacity:1}}.breath{animation:br 1.6s ease-in-out infinite;}
  .chip .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;margin-left:8px;padding:0 6px;font-size:13px;font-weight:800;background:var(--brand);color:#fff;}
  .chip.on .n{background:#fff;color:var(--brand);}
</style>
<script src="/nav/identity.js?v=66"></script>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a id="crumb-ev"></a> / <a id="crumb-att">Attendees</a> / <b>Manage</b></div>
  <p id="stale" style="display:none;color:#fff;font-size:13.5px;margin:-8px 0 12px;opacity:.9;">Updating information…</p>
  <div class="card">
    <h1 id="title"></h1>
    <p class="sub" id="counts"><span class="breath">Loading…</span></p>
    <div id="body" style="display:none;">
      <div class="chips" id="chips"></div>
      <input class="search" id="q" type="search" placeholder="Search attendees" aria-label="Search attendees">
      <div id="list" style="margin-top:8px;"></div>
      <div class="btns" id="btns"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  var q = new URLSearchParams(location.search), id = String(q.get('id') || '').trim();
  var $ = function (x) { return document.getElementById(x); };
  var me = ''; try { me = (window.CW && CW.me && CW.me().id) || ''; } catch (e) {}
  var pass = ''; try { pass = (window.CW && CW.passParam) ? CW.passParam() : ''; } catch (e) {}
  var say = function (t) { $('counts').textContent = t; };
  $('counts').innerHTML = '<span class="breath">Loading…</span>';
  if (!id) { say('Open this page from your event so we know which event to manage.'); return; }
  if (!me) { location.replace('https://2appear.network/signin/?next=' + encodeURIComponent(location.href)); return; }
  var series = /^recurring-/.test(id) ? '' : id;
  var evUrl = 'https://2gather.network/mockups/e328/event/?id=' + encodeURIComponent(id);
  $('crumb-ev').style.cursor = 'pointer'; $('crumb-ev').onclick = function () { location.href = evUrl; };
  $('crumb-att').style.cursor = 'pointer'; $('crumb-att').onclick = function () { location.href = 'https://2gather.network/event/people/?id=' + encodeURIComponent(id); };
  var KEY = 'cw-att-view|' + id + '|' + me;
  try {
    var qkOk = localStorage.getItem('cw-hosting|' + id + '|' + me) === '1' || !!localStorage.getItem(KEY) || localStorage.getItem('cw-super') === 'yes';
    try { if (window.CW && CW.me && CW.me().viewing) qkOk = true; } catch (e) {}
    if (!qkOk) { location.replace(evUrl); return; }
  } catch (e) {}
  function saveView(title, bb) { try { localStorage.setItem(KEY, JSON.stringify({ t: title, bb: bb, rows: rows.map(function (r) { var c = Object.assign({}, r); delete c.email; return c; }) })); } catch (e) {} }
  function showBody(title) { $('title').textContent = title; $('crumb-ev').textContent = title; document.title = title + ' · Manage attendees'; $('body').style.display = ''; }
  var rows = [], filter = 'all', hasBB = false;
  function fmt(d) { try { return new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); } catch (e) { return ''; } }
  function paint() {
    var t = String($('q').value || '').trim().toLowerCase();
    var on = rows.filter(function (r) { return r.inLobby; }).length;
    $('chips').innerHTML = '';
    [['all', 'All', rows.length]].concat(hasBB ? [['on', 'On 2Gather', on], ['off', 'Not on 2Gather', rows.length - on]] : []).forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (filter === c[0] ? ' on' : ''); b.appendChild(document.createTextNode(c[1]));
      var nn = document.createElement('span'); nn.className = 'n'; nn.textContent = String(c[2]); b.appendChild(nn);
      b.onclick = function () { filter = c[0]; paint(); }; $('chips').appendChild(b);
    });
    var list = rows.filter(function (r) { return filter === 'all' || (filter === 'on' ? r.inLobby : !r.inLobby); })
      .filter(function (r) { return !t || r.name.toLowerCase().indexOf(t) > -1 || r.seenAs.toLowerCase().indexOf(t) > -1; });
    $('list').innerHTML = '';
    if (!list.length) { var s = document.createElement('div'); s.className = 'say'; s.textContent = rows.length ? 'Nobody matches.' : 'Nobody has registered yet.'; $('list').appendChild(s); }
    list.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'row';
      var av = document.createElement('span'); av.className = 'av';
      if (r.photo) { var im = document.createElement('img'); im.src = r.photo; im.alt = ''; av.appendChild(im); }
      var mid = document.createElement('div'); mid.style.cssText = 'flex:1;min-width:0;';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.name || 'An attendee';
      var meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = [r.seenAs ? 'Shows as ' + r.seenAs : '', r.at ? 'Registered ' + fmt(r.at) : '', r.isHost ? 'Host' : ''].filter(String).join(' \u00b7 ');
      mid.appendChild(nm); mid.appendChild(meta);
      if (r.place) { var pl = document.createElement('div'); pl.className = 'meta'; pl.textContent = r.place; mid.appendChild(pl); }
      if (r.email) { var ea = document.createElement('a'); ea.className = 'meta'; ea.style.cssText = 'display:inline-block;color:#1F699E;'; ea.href = 'mailto:' + encodeURIComponent(r.email).replace(/%40/g, '@'); ea.textContent = r.email; mid.appendChild(ea); }
      row.appendChild(av); row.appendChild(mid);
      if (hasBB && r.inLobby) { var p = document.createElement('span'); p.className = 'pill'; p.textContent = 'On 2Gather'; row.appendChild(p); }
      $('list').appendChild(row);
    });
    var regs = rows.filter(function (r) { return !r.isHost; }).length;
    say(regs + ' registered' + (hasBB ? ' \u00b7 ' + on + ' on 2Gather' : ''));
  }
  $('q').oninput = paint;
  function buttons() {
    var bt = $('btns'); bt.innerHTML = '';
    var inv = document.createElement('a'); inv.className = 'b'; inv.textContent = 'Invite people'; inv.href = evUrl; bt.appendChild(inv);
    if (hasBB) { var go = document.createElement('a'); go.className = 'b'; go.textContent = 'Start 2Gather'; go.href = 'https://2gather.network/attendees/?id=' + encodeURIComponent(id); bt.appendChild(go); }
  }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.rows)) { rows = saved.rows; hasBB = !!saved.bb; showBody(saved.t || ''); buttons(); paint(); $('stale').style.display = ''; }
  } catch (e) {}
  var role = Promise.resolve(null);
  var bundle = fetch(GS + '?action=eventBundle&id=' + encodeURIComponent(id) + '&t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return {}; });
  var att = fetch(GS + '?action=getAttendees&eventId=' + encodeURIComponent(id) + '&appearId=' + encodeURIComponent(me) + pass).then(function (x) { return x.json(); });
  att.then(function (d0) {
    var at0 = (d0 && d0.attendees) || [];
    if (!at0.some(function (c) { return 'inLobby' in c; }) && !(at0.length === 0 && Number(d0 && d0.count) === 0)) { try { localStorage.removeItem(KEY); } catch (e) {} location.replace(evUrl); }
  }).catch(function () {});
  Promise.all([role, bundle, att]).then(function (a) {
    var ev = (a[0] && a[0].event) || {}, r = ev.myRole || 'visitor';
    var evs = (a[1] && a[1].events) || [], sid = /^recurring-/.test(id) ? null : id;
    var row = evs.filter(function (x) { return String(x.id) === id || (!sid && /^rec-/.test(String(x.id))); })[0] || ev.row || {};
    var title = String(row.title || (ev.row && ev.row.title) || 'Your event');
    hasBB = row.hasBB === true || String(row.hasBB) === 'true' || row.hasHub === true || String(row.hasHub) === 'true';
    var d = a[2] || {}, at = d.attendees || [];
    var mayEdit = at.some(function (c) { return 'inLobby' in c; });
    if (!mayEdit && !(at.length === 0 && Number(d.count) === 0)) { try { localStorage.removeItem(KEY); } catch (e) {} location.replace(evUrl); return; }
    rows = at.map(function (c) { var em = String(c.email || '').trim(); return { name: String(c.name || '').trim(), seenAs: String(c.seenAs || '').trim(), photo: String(c.photo || '').trim(), inLobby: c.inLobby === true, at: c.registeredAt || '', isHost: c.isHost === true, place: String(c.place || '').trim(), email: /^[^\s@<>"'()]+@[^\s@<>"'()]+\.[A-Za-z]{2,}$/.test(em) ? em : '' }; });
    rows.sort(function (x, y) { return (x.isHost === y.isHost) ? x.name.localeCompare(y.name) : (x.isHost ? -1 : 1); });
    showBody(title); buttons(); paint(); $('stale').style.display = 'none';
    saveView(title, hasBB);
  }).catch(function () { if ($('stale').style.display === 'none') say('This page could not load. Try again in a moment.'); });
})();
</script>
<script src="/nav/topbar.js?v=7.07" defer></script>
</body>
</html>
