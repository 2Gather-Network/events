<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guests · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#2F3D4F;--line:#DDE4EE;--tint:#E6F1FB;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;padding:0 16px 60px;}
  .wrap{max-width:1100px;margin:0 auto;padding-top:24px;}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:#fff;margin:0 0 20px;}
  .crumbs a{color:#fff;text-decoration:none;font-weight:500;}
  .crumbs .sep{opacity:.6;}
  .crumbs b{font-weight:800;}
  .head{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;margin-bottom:14px;}
  .head .t{min-width:0;flex:1;font-size:18px;font-weight:800;line-height:1.2;}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;padding:9px 18px;border-radius:22px;text-decoration:none;flex-shrink:0;white-space:nowrap;border:0;font-family:inherit;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid #B5D3EA;font-size:13px;padding:7px 14px;}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:18px;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}
  .card{background:#fff;border-radius:14px;padding:24px 28px;}
  .side{background:#fff;border-radius:14px;padding:16px 18px;height:fit-content;}
  .box{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;}
  .box:last-child{margin:0;}
  h1{font-size:17px;font-weight:800;margin:0 0 12px;}
  .lab{font-size:12px;font-weight:800;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .search{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1.5px solid var(--line);border-radius:22px;padding:4px 6px 4px 14px;margin-bottom:16px;}
  .search[hidden]{display:none;}
  .search input{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;padding:6px 4px;outline:none;color:var(--ink);min-width:0;}
  .count{font-size:14px;font-weight:800;margin:0 0 14px;}
  .faces{display:flex;flex-wrap:wrap;gap:12px;}
  .g{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;text-decoration:none;color:var(--ink);}
  .g .f{width:52px;height:52px;border-radius:50%;background:#B7C4D6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;overflow:hidden;}
  .g .f img{width:100%;height:100%;object-fit:cover;}
  .g .n{font-size:12px;font-weight:600;text-align:center;line-height:1.25;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  a.g:hover .n{text-decoration:underline;}
  .msg{font-size:14px;color:var(--ink);margin:6px 0 0;}
  .wait{display:inline-flex;align-items:center;background:var(--brand);color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;animation:br 1.6s ease-in-out infinite;}
  @keyframes br{0%,100%{opacity:1}50%{opacity:.62}}
  .stat{font-size:14px;line-height:1.6;color:#6B7A8D;margin-top:8px;}
</style>
<link rel="icon" type="image/png" href="https://2gather.network/images/2gather_logo.png"><script src="/nav/tab-icon.js?v=1"></script><link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="head">
    <div class="t" id="evt">Event</div>
    <a class="btn" id="evlink" href="https://2gather.network/events/">Event page</a>
  </div>
  <div class="layout">
    <div class="card">
      <h1>All guests</h1>
      <div class="search" id="srch" hidden><input id="q" type="text" placeholder="Search" aria-label="Search guests"></div>
      <p class="count" id="count"></p>
      <div class="faces" id="faces"></div>
      <p class="msg" id="msg"><span class="wait">Looking up the guests</span></p>
    </div>
    <aside class="side" id="side" hidden>
      <div class="box">
        <div class="row"><div class="lab">Lobby</div><a class="btn ghost" id="lobby" href="#">View the lobby</a></div>
        <div class="stat">What guests need, offer and care about, for those who joined the lobby.</div>
      </div>
      <div class="box">
        <div class="row"><div class="lab">My matches</div><a class="btn ghost" id="matches" href="#">See my matches</a></div>
      </div>
    </aside>
  </div>
</div>
<script src="https://2gather.network/nav/identity.js?v=61"></script>
<script>
(function () {
  var GS = "https://cw-api-gate.jessieupp.workers.dev";
  var q = new URLSearchParams(location.search);
  var id = String(q.get("id") || "").trim();
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function me() {
    var m = "";
    try { if (window.CW && typeof window.CW.me === "function") { m = String(window.CW.me().id || "").trim(); } } catch (e) {}
    if (!m) { try { m = localStorage.getItem("cw-id") || localStorage.getItem("appear-id") || ""; } catch (e) {} }
    return m;
  }
  function token() { try { return localStorage.getItem("cw-token") || ""; } catch (e) { return ""; } }
  function say(h) { $("msg").innerHTML = h; }
  var EV = "https://2gather.network/event/?id=" + encodeURIComponent(id);
  function crumbs(title) {
    var c = [["My events", "https://2gather.network/myevents/"], [title || "Event", EV], ["Lobby", "https://2gather.network/attendees/?id=" + encodeURIComponent(id)]], h = "";
    c.forEach(function (x, n) { h += (n ? '<span class="sep">/</span>' : "") + '<a href="' + x[1] + '">' + esc(x[0]) + '</a>'; });
    $("crumbs").innerHTML = h + '<span class="sep">/</span><b>Guests</b>';
  }
  if (!id) { crumbs(""); say("This page needs an event. Go back to the event and open Guests from there."); return; }
  $("evlink").href = EV;
  $("lobby").href = "https://2gather.network/attendees/?id=" + encodeURIComponent(id);
  $("matches").href = "https://2gather.network/event/matches/?id=" + encodeURIComponent(id);
  crumbs("");
  function shown(t) { $("side").hidden = false; if (t) { $("evt").textContent = "Event: " + t; document.title = t + " guests · 2Gather"; crumbs(t); } }
  function hidden() { $("side").hidden = true; $("count").textContent = ""; $("faces").innerHTML = ""; $("srch").hidden = true; say(me() ? "Event not found." : 'This event is not on the public calendar. If you are part of its group, sign in to see it.<br><a class="btn" style="margin-top:12px;" href="https://2gather.network/signin/?next=' + encodeURIComponent(location.pathname + location.search) + '">Sign in</a>'); }
  function seen() {
    var who = me(), pass = (window.CW && CW.passParam) ? CW.passParam() : "&meToken=" + encodeURIComponent(token());
    return fetch(GS + "?action=eventBundle&id=" + encodeURIComponent(id) + "&t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (b) {
        var row = (b && Array.isArray(b.events) ? b.events : []).filter(function (x) { return String(x && x.id) === id; })[0];
        if (row) return row.title || "Event";
        if (!who) return null;
        return fetch(GS + "?action=getEventById&id=" + encodeURIComponent(id) + "&appearId=" + encodeURIComponent(who) + pass + "&t=" + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (o) { var r = o && o.event && (o.event.row || o.event); return (r && String(r.id) === id) ? (r.title || "Event") : null; });
      });
  }
  var all = [];
  function face(a) {
    var nm = String(a.name || "").trim() || "A guest";
    var bits = nm.replace(/\./g, " ").split(/\s+/).filter(String);
    var ini = bits.length ? (bits[0].charAt(0) + (bits.length > 1 ? bits[bits.length - 1].charAt(0) : "")).toUpperCase() : "?";
    var pic = a.photo ? '<img src="' + esc(a.photo) + '" alt="" onerror="this.remove()">' : "";
    var inner = '<span class="f">' + (pic || esc(ini)) + '</span><span class="n">' + esc(nm) + '</span>';
    if (a.noLink || !(a.vanity || a.code)) return '<span class="g" title="' + esc(nm) + '" data-n="' + esc(nm.toLowerCase()) + '">' + inner + '</span>';
    var href = a.vanity ? "https://2gather.network/hi/" + encodeURIComponent(a.vanity) : "https://2gather.network/hi/?v=" + encodeURIComponent(a.code);
    return '<a class="g" href="' + href + '" title="' + esc(nm) + '" data-n="' + esc(nm.toLowerCase()) + '">' + inner + '</a>';
  }
  function paint() {
    var t = String($("q").value || "").trim().toLowerCase();
    var shown = all.filter(function (a) { return !t || String(a.name || "").toLowerCase().indexOf(t) > -1; });
    $("faces").innerHTML = shown.map(face).join("");
    if (t && !shown.length) say("No guest matches that search."); else say("");
  }
  function run(tries) {
    var who = me();
    if (!who) {
      if (tries < 12) { setTimeout(function () { run(tries + 1); }, 500); return; }
      say('Sign in and register for this event to see who is going. <a class="btn" style="margin-top:12px;" href="https://2gather.network/signin/?next=' + encodeURIComponent(location.pathname + location.search) + '">Sign in</a>');
      return;
    }
    var pass = (window.CW && CW.passParam) ? CW.passParam() : "&meToken=" + encodeURIComponent(token());
    fetch(GS + "?action=getAttendees&eventId=" + encodeURIComponent(id) + "&appearId=" + encodeURIComponent(who) + pass)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var n = Number(d && d.count) || 0;
        all = (d && Array.isArray(d.attendees)) ? d.attendees : [];
        if (!all.length) {
          $("count").textContent = "";
          say(n > 0
            ? n + (n === 1 ? " person is" : " people are") + ' going. Register for this event to see who is going. <a class="btn" style="margin-top:12px;" href="' + EV + '&choices=1">Register</a>'
            : "No one has registered for this event yet.");
          return;
        }
        $("count").textContent = all.length + (all.length === 1 ? " guest" : " guests");
        $("srch").hidden = all.length < 8;
        paint();
      })
      .catch(function () { say('The guests could not load just now. <a href="" onclick="location.reload();return false;" style="color:#1F699E;font-weight:700;">Try again</a>'); });
  }
  $("q").addEventListener("input", paint);
  function start(tries) {
    if (!me() && tries < 12) { setTimeout(function () { start(tries + 1); }, 500); return; }
    seen().then(function (t) { if (t === null) { hidden(); return; } shown(t); run(0); })
      .catch(function () { say('The guests could not load just now. <a href="" onclick="location.reload();return false;" style="color:#1F699E;font-weight:700;">Try again</a>'); });
  }
  start(0);
})();
</script>
</body>
</html>
