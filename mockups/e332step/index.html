<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#1A2E42;--muted:#5A6878;--border:#DDE4EE}
*{box-sizing:border-box}html,body{margin:0;background:#1F699E;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--dark)}

#cw-seen-ask .cw-ph{padding:16px 18px 6px}

#cw-seen-ask .cw-pc{float:right;background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;padding:2px 0}
#cw-seen-ask .cw-prog{display:flex;gap:6px}#cw-seen-ask .cw-prog span{flex:1;height:6px;border-radius:3px;background:#DDE4EE}#cw-seen-ask .cw-prog span.on{background:#1F699E}
#cw-seen-ask .cw-pl{font-size:12.5px;color:var(--muted);margin:6px 0 0}
#cw-seen-ask .cw-pb{padding:16px 18px;overflow:auto;flex:1}
#cw-seen-ask .cw-pf{padding:12px 18px;display:flex;gap:10px;justify-content:space-between;align-items:center}
#cw-seen-ask .cw-b{font:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:20px;cursor:pointer}
#cw-seen-ask .cw-b.pri{background:#1F699E;color:#fff;border:1.5px solid #1F699E}#cw-seen-ask .cw-b.gh{background:#fff;color:#1F699E;border:1.5px solid #1F699E}#cw-seen-ask .cw-b[disabled]{opacity:.5;cursor:default}
#cw-seen-ask h3{font-size:16px;font-weight:700;color:var(--dark);margin:0 0 4px}
#cw-seen-ask .cw-sub{display:block;font-size:13px;color:var(--muted);margin:2px 0 0;line-height:1.45}
#cw-seen-ask .cw-row{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--dark);padding:7px 0}#cw-seen-ask .cw-row input{margin-top:4px}#cw-seen-ask .cw-row.off{color:#9AA6B2}
#cw-seen-ask .cw-in{margin:0 0 0 26px}
#cw-seen-ask .cw-imgf{display:flex;align-items:center;gap:10px;border:1.5px solid #C9D6E2;background:#F6F9FC;border-radius:12px;padding:8px 10px;margin:6px 0 4px}
#cw-seen-ask .cw-tile{width:44px;height:44px;border-radius:10px;background:#DDE4EE;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}#cw-seen-ask .cw-tile img{width:100%;height:100%;object-fit:cover}
#cw-seen-ask .cw-imgf input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;min-width:0;outline:none}
#cw-seen-ask .cw-up.need{background:#1F699E;color:#fff}
#cw-seen-ask .cw-up{font:inherit;font-size:13px;font-weight:700;color:#1F699E;background:#fff;border:1.5px solid #1F699E;border-radius:16px;padding:6px 12px;white-space:nowrap;cursor:pointer}
#cw-seen-ask .cw-help{font-size:12.5px;color:var(--muted);margin:0 0 6px}
#cw-seen-ask .cw-info{background:#E8F2F9;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#1A2E42;margin:6px 0 4px}
#cw-seen-ask .cw-same{display:flex;align-items:flex-start;gap:10px;background:#E8F2F9;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14.5px;font-weight:700;color:#1A2E42}#cw-seen-ask .cw-same .cw-sub{font-weight:400}
#cw-seen-ask .cw-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#cw-seen-ask .cw-pill{font:inherit;font-size:13.5px;padding:6px 13px;border-radius:999px;border:1.5px solid #C9D6E2;background:#fff;color:var(--dark);cursor:pointer}#cw-seen-ask .cw-pill[aria-pressed=true]{background:#1F699E;border-color:#1F699E;color:#fff;font-weight:700}
#cw-seen-ask .cw-tr{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--dark);padding:7px 0}
#cw-seen-ask .cw-sw{position:relative;width:42px;height:24px;border-radius:12px;background:#C6CDD8;border:0;cursor:pointer;flex-shrink:0;padding:0}#cw-seen-ask .cw-sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}#cw-seen-ask .cw-sw[aria-checked=true]{background:#1F699E}#cw-seen-ask .cw-sw[aria-checked=true]::after{left:21px}
#cw-seen-ask .cw-sum{background:#F6F9FC;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.7;margin:10px 0;color:var(--dark)}
#cw-seen-ask .cw-msg{font-size:13px;color:#7A2410;margin:0;min-height:18px;flex:1}
#cw-seen-ask .cw-ib{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid #1F699E;background:#fff;color:#1F699E;font:700 12px/1 Georgia,serif;cursor:pointer;padding:0;margin-left:6px;vertical-align:middle}
#cw-seen-ask .cw-ibox{background:#E8F2F9;border:1.5px solid #B9D3EA;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55;color:#1A2E42;margin:6px 0 8px}#cw-seen-ask .cw-ibox p{margin:0 0 4px}#cw-seen-ask .cw-ibox p:last-child{margin:0}
#cw-seen-ask .cw-ex{color:var(--muted);font-weight:400}
#cw-seen-ask .cw-wait{display:inline-flex;align-items:center;background:#1F699E;color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;white-space:nowrap;animation:cw-breathe 1.6s ease-in-out infinite}
#cw-seen-ask .cw-box{border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 12px}
</style></head><body><div class="wrap">
<p class="top">Preview of registration step 2 of 3, "After this event" (events.332). A made-up attendee, nothing is saved.</p>
<div id="cw-seen-ask"><div id="body"></div></div></div>
<script>
var $=function(x){return document.getElementById(x)};var body=$("body");
var FROM=[["bookmarked","People I bookmarked"],["match","People I match with"],["messaged","People I messaged"],["everyone","All event attendees"],["none","Nobody"]];
var st={carry:"",connect:false,others:false,from:{},onlyMine:false,mail:true,mine:true,infoOpen:false};
var esc=function(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")};
function s3(){var any=Object.keys(st.from).some(function(k){return st.from[k]});
var h='<div class="cw-box"><h3>After this event</h3>'
+'<p style="margin:0 0 8px;line-height:1.5">When the event concludes, the lobby will close. You can still carry over all of your bookmarks and messages over to 2Appear so the event lives on. Would you like to bring over your info and continue engaging with event attendees?</p><div class="cw-pills" style="margin-bottom:12px">'
+[["yes","Yes immediately"],["later","Ask me after the event"]].map(function(c){return '<button type="button" class="cw-pill" data-co="'+c[0]+'" aria-pressed="'+(st.carry===c[0])+'">'+c[1]+'</button>'}).join("")+'</div>'
+'<label class="cw-row"><input type="checkbox" id="mk"'+(st.connect?" checked":"")+'><span>Let me connect with people I want to meet after this event</span></label>'
+'<label class="cw-row"><input type="checkbox" id="inv"'+(st.others?" checked":"")+'><span>Let others connect with me after the event</span></label>'
+'<h3 style="margin-top:12px">Who can invite me to their events from here?</h3><p class="cw-sub">Select all that apply.</p><div class="cw-pills">'
+FROM.map(function(f){var on=f[0]==="none"?!any:!!st.from[f[0]];return '<button type="button" class="cw-pill" data-fr="'+f[0]+'" aria-pressed="'+on+'">'+f[1]+'</button>'}).join("")+'</div>'
+'<h3 style="margin-top:14px">How do I hear about an event invite from other event attendees?</h3>'
+'<div class="cw-tr"><span>Email me</span><button type="button" class="cw-sw" role="switch" id="em" aria-checked="'+st.mail+'" aria-label="Email me about event invites"></button></div>'
+'<div class="cw-tr"><span>Show it in My events</span><button type="button" class="cw-sw" role="switch" id="me" aria-checked="'+st.mine+'" aria-label="Show event invites in My events"></button></div></div>';
body.innerHTML=h;
$("mk").onchange=function(){st.connect=this.checked};$("inv").onchange=function(){st.others=this.checked};
Array.prototype.forEach.call(body.querySelectorAll("[data-fr]"),function(b){b.onclick=function(){var k=b.getAttribute("data-fr");if(k==="none")st.from={};else st.from[k]=!st.from[k];s3()}});
$("em").onclick=function(){st.mail=!st.mail;s3()};$("me").onclick=function(){st.mine=!st.mine;s3()};
Array.prototype.forEach.call(body.querySelectorAll("[data-co]"),function(b){b.onclick=function(){st.carry=b.getAttribute("data-co");s3()}});}
s3();
</script></body></html>
