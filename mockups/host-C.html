<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Groups I host — Design C (rail + detail)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 60px;}
  .mock-tag{background:#FFF4CC;border:1px solid #E8C766;border-radius:8px;padding:6px 12px;font-size:12px;color:#5A3A00;font-weight:700;display:inline-block;margin-bottom:14px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:600;margin-bottom:14px;opacity:.92;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .btn{background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn.solid{background:#123f5f;color:#fff;}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.sm{padding:7px 14px;font-size:13px;}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:16px;}
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}
  .rail{background:#fff;border-radius:14px;padding:8px;height:fit-content;}
  .rail .search{display:flex;align-items:center;background:#F7F9FC;border-radius:18px;padding:2px 6px 2px 12px;margin:6px 6px 10px;}
  .rail .search input{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;padding:8px 4px;outline:none;}
  .rail .item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .rail .item:hover{background:var(--panel);}
  .rail .item.on{background:#EEF6FF;}
  .rail .item .img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#DDE4EE;}
  .rail .item .nm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.15;flex:1;min-width:0;}
  .rail .item .dot{background:#B36A0F;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;font-weight:800;}
  .detail{background:#fff;border-radius:14px;padding:24px 28px;}
  .detail .cover{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#DDE4EE;display:block;margin-bottom:16px;}
  .detail h2{font-size:22px;font-weight:800;margin:0 0 4px;}
  .badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;}
  .badge.host{background:#E7F5EA;color:#1A5A2C;}
  .badge.cohost{background:#EEF6FF;color:#154F74;}
  .detail .stats{font-size:14px;color:var(--soft);margin:14px 0;}
  .detail .stats b{color:var(--ink);}
  .detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock-tag">MOCKUP · Groups I host — Design C (rail + detail, best for 10+ groups)</div>
  <div class="breadcrumb">‹ <a href="#">My profile</a> / Groups I host</div>

  <div class="head">
    <h1>Groups I host</h1>
    <a class="btn solid" href="#">+ Start a new group</a>
  </div>

  <div class="layout">
    <div class="rail" id="rail">
      <div class="search"><input type="text" placeholder="Filter…"></div>
    </div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
  var GROUPS = [
    {name:'Seattle Tech Network', role:'host', members:62, offers:102, needs:44, pending:3, intro:'Network with Seattle tech peers.', img:'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/mV6AgDKKrR9A9k9673KJ/pub/qwVNLMlt19536Vl5XRvI.png'},
    {name:'Climate Group', role:'host', members:38, offers:71, needs:29, pending:0, intro:'People working on climate across the region.'},
    {name:'Appear Network', role:'host', members:654, offers:0, needs:0, pending:0, intro:'The default onboarding network.'},
    {name:'Campfire', role:'host', members:24, offers:40, needs:18, pending:1, intro:'Small, warm gatherings.'},
    {name:'GRC Network', role:'cohost', members:31, offers:58, needs:22, pending:0, intro:'Governance, risk, and compliance folks.'},
    {name:'Creating Works Co-Creation Team', role:'host', members:12, offers:33, needs:9, pending:2, intro:'The people building this with me.'},
    {name:'Hack for Social Impact', role:'cohost', members:47, offers:88, needs:35, pending:0, intro:'Builders for good.'},
    {name:'Women in Tech Seattle Regatta', role:'host', members:29, offers:52, needs:20, pending:0, intro:'Women in tech, on and off the water.'},
    {name:'Lake Ballinger Center', role:'host', members:18, offers:26, needs:14, pending:0, intro:'Neighbors around Lake Ballinger.'}
  ];
  var rail = document.getElementById('rail');
  var detail = document.getElementById('detail');
  function renderDetail(g){
    detail.innerHTML =
      (g.img ? '<img class="cover" src="'+g.img+'" alt="">' : '<div class="cover"></div>')
      + '<h2>'+g.name+'</h2>'
      + '<span class="badge '+g.role+'">'+(g.role==='host'?'Host':'Co-host')+'</span>'
      + '<div class="stats">'+g.intro+'<br><b>'+g.members+'</b> people · <b>'+g.offers+'</b> offers · <b>'+g.needs+'</b> needs'
      + (g.pending ? ' · <b style="color:#B36A0F;">'+g.pending+' pending requests</b>' : '')+'</div>'
      + '<div class="acts">'
      + '<a class="btn solid sm" href="#">Open group</a>'
      + '<a class="btn ghost sm" href="#">Manage</a>'
      + '<a class="btn ghost sm" href="#">Invite people</a>'
      + '<a class="btn ghost sm" href="#">Edit info</a>'
      + (g.pending ? '<a class="btn sm" href="#">View requests ('+g.pending+')</a>' : '')
      + '</div>';
  }
  GROUPS.forEach(function(g, i){
    var it = document.createElement('div'); it.className = 'item' + (i===0?' on':'');
    it.innerHTML = (g.img ? '<img class="img" src="'+g.img+'" alt="">' : '<div class="img"></div>')
      + '<span class="nm">'+g.name+'</span>'
      + (g.pending ? '<span class="dot">'+g.pending+'</span>' : '');
    it.addEventListener('click', function(){
      rail.querySelectorAll('.item').forEach(function(x){ x.classList.remove('on'); });
      it.classList.add('on'); renderDetail(g);
    });
    rail.appendChild(it);
  });
  renderDetail(GROUPS[0]);
</script>
</body>
</html>
