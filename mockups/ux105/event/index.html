(function () {
  var t0 = Date.now(), said = 0;
  var tick = setInterval(function () {
    var box = document.getElementById("ev-loading");
    var el = box && box.querySelector(".cw-loading");
    if (!el || !document.body.contains(el)) { clearInterval(tick); return; }
    var s = (Date.now() - t0) / 1000, priv = !!window._evPrivatePath;
    var step = s >= 60 ? 5 : s >= 40 ? 4 : s >= 30 ? 3 : s >= 20 ? 2 : s >= 10 ? 1 : 0;
    if (step === said) return;
    said = step;
    el.style.whiteSpace = "normal";
    el.style.textAlign = "center";
    if (step === 5) {
      clearInterval(tick);
      el.innerHTML = 'This is taking longer than usual. <a href="https://2gather.network/support/?re=' + encodeURIComponent(location.href) + '" style="color:#fff;font-weight:700;text-decoration:underline;margin-left:4px;">Tell support</a>';
      return;
    }
    el.textContent = [
      "Loading this event",
      "Loading this event",
      priv ? "Checking that you can see this event\u2026" : "Still getting the details\u2026",
      priv ? "Almost there. Private events take a bit longer to open\u2026" : "Almost there\u2026",
      "Still working on it. Thanks for waiting\u2026"
    ][step];
  }, 1000);
})();

<script>

var CATEGORIES = [];
var ROOMS = {};
var ROOM_EMOJI = {};
var _isHost = false;
var _signupList = [];
var _potluckClaims = [];
var _potluckTypes = ['Skill','Experience','Thing'];
var _hostSkillsPool = [];
var _pl = {step:'',item:'',potluckType:'',category:'',timed:'',timeNum:'',timeUnit:'',maxClaims:''};

var OLD_ID_TO_PARENT = {
  "arts":"Arts & Culture","movement":"Physical Wellbeing","nature":"Nature & Outdoors",
  "professional":"Business & Finance","creative":"Self-Expression & Beauty",
  "faith":"Mental Wellbeing","care":"Mental Wellbeing","social":"Events & Gatherings",
  "family":"Family Wellbeing","food":"Food & Drink","wealth":"Business & Finance",
  "learning":"","resources":""
};

function resolveCategory(val) {
  val = String(val || "").trim();
  if (!val) return null;
  var cat = CATEGORIES.find(function(c) { return c.label === val; });
  if (cat) return cat;
  var parent = OLD_ID_TO_PARENT[val.toLowerCase()];
  if (parent) return CATEGORIES.find(function(c) { return c.label === parent; }) || null;
  var lower = val.toLowerCase();
  return CATEGORIES.find(function(c) { return c.label.toLowerCase().includes(lower) || lower.includes(c.label.toLowerCase()); }) || null;
}

async function loadCategories() {
  for (var attempt = 0; attempt < 6; attempt++) {
    try {
      var res = await fetch(GS_URL + "?action=getCategories&t=" + Date.now() + "_" + attempt);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var text = await res.text();
      var data = JSON.parse(text);
      var _tc = []; try { _tc = await cwEventCats.load(GS_URL); } catch (e) {}
      if (_tc.length) { CATEGORIES = _tc; }
      else if (data.categories && data.categories.length) { CATEGORIES = data.categories; }
      if (data.rooms && data.rooms.length) {
        data.rooms.forEach(function(r) { if (r.name) { ROOMS[r.name] = r.url || ""; } });
      }
      break;
    } catch(e) {
      if (attempt === 5) { console.warn("Failed to load categories from sheet after 6 attempts:", e); break; }
      await new Promise(function(r) { setTimeout(r, 500); });
    }
  }
  try {
    var pres = await fetch(GS_URL + "?action=getReferenceData");
    var pdata = await pres.json();
    if (pdata && pdata.potluckTypes && pdata.potluckTypes.length) { _potluckTypes = pdata.potluckTypes; }
    if (pdata && pdata.skills && pdata.skills.length) { _hostSkillsPool = pdata.skills; }
  } catch(e) {}
}

let RECURRING_EVENTS = [];

function getNextDate(dayOfWeek, endTime) {
  const now = new Date();
  const d = new Date(now);
  d.setHours(0,0,0,0);
  let diff = (dayOfWeek - d.getDay() + 7) % 7;
  if (diff === 0) {
    const hm = String(endTime || "").match(/^(\d{1,2}):(\d{2})/);
    const endToday = new Date(now);
    if (hm) { endToday.setHours(+hm[1], +hm[2], 0, 0); } else { endToday.setHours(23, 59, 59, 999); }
    if (now > endToday) diff = 7;
  }
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function parseSheetTime(val) {
  if (!val) return "";
  const s = String(val);
  if (/^\d{2}:\d{2}$/.test(s)) return s;
  if (s.includes("T")) { const t = s.split("T")[1]; return t.substring(0, 5); }
  return s;
}

function recurToEv(r) {
  return {
    id: r.id, title: r.title||"",
    date: getNextDate(r.dayOfWeek, r.endtime || r.time),
    time: r.time||"", endtime: r.endtime||"",
    format: r.format||"", location: r.location||"",
    room: r.room||"", description: r.description||"",
    host: r.host||"", hostlink: r.hostlink||"",
    contactEmail: r.contactEmail||"", contactPhone: r.contactPhone||"",
    cooplink: r.cooplink||"", paymentlink: r.paymentlink||"",
    meetinglink: ROOMS[r.room] || "", showLinks: r.showLinks||"",
    roomGated: r.roomGated==="true"||r.roomGated===true||false,
    otherExchange: r.otherExchange||"", exchangeType: r.exchangeType||"",
    recurFreq: r.recurFreq||"weekly", experience: r.experience||"",
    dayOfWeek: r.dayOfWeek, recurAnchor: r.date||"",
    imageUrl: r.imageUrl||"", detailImageUrl: r.detailImageUrl||"", lifeStage: r.servesWho||r.lifeStage||"", keywords: r.keywords||"", venue: r.venue||"", org: r.org||"", county: r.county||"", hostType: r.hostType||"",
    interestedEnabled: r.interestedEnabled||"off", interested: r.interested||"",
    sharedNotesEnabled: r.sharedNotesEnabled||false, sharedNotes: r.sharedNotes||"",
    host_note: r.host_note||"",

function _recurWords(ev) {
  var f = String((ev && ev.recurFreq) || '').trim().toLowerCase();
  if (!f) return '';
  var byWeekday = /nth$/.test(f);
  var base = f.replace(/nth$/, '');
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var ord = function (n) {
    var s = (n % 10 === 1 && n % 100 !== 11) ? 'st' : (n % 10 === 2 && n % 100 !== 12) ? 'nd' : (n % 10 === 3 && n % 100 !== 13) ? 'rd' : 'th';
    return n + s;
  };
  var day = function (s) {
    s = String(s || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var d = new Date(s + 'T12:00:00');
    return isNaN(d.getTime()) ? null : d;
  };
  var shown = day(ev.date);
  var anchor = day(ev.recurAnchor) || shown;   
  var dow = -1;
  if (ev.dayOfWeek !== undefined && ev.dayOfWeek !== null && String(ev.dayOfWeek).trim() !== '' && !isNaN(Number(ev.dayOfWeek))) {
    dow = ((Number(ev.dayOfWeek) % 7) + 7) % 7;   
  } else if (shown) { dow = shown.getDay(); }
  if (base === 'daily') return 'Recurs every day';
  if (base === 'weekly')   return dow > -1 ? 'Recurs every ' + DAYS[dow] : '';
  if (base === 'biweekly') return dow > -1 ? 'Recurs every other ' + DAYS[dow] : '';
  if (base === 'monthly' || base === 'annually') {
    if (!anchor) return '';
    var month = anchor.toLocaleDateString('en-US', { month: 'long' });
    if (byWeekday) {
      var nth = Math.floor((anchor.getDate() - 1) / 7) + 1;
      var place = nth >= 5 ? 'last' : ord(nth);
      var wd = DAYS[anchor.getDay()];
      return base === 'monthly' ? 'Recurs ' + place + ' ' + wd + ' of month'
                                : 'Recurs ' + place + ' ' + wd + ' of ' + month + ' every year';
    }
    return base === 'monthly' ? 'Recurs ' + ord(anchor.getDate()) + ' of month'
                              : 'Recurs ' + month + ' ' + ord(anchor.getDate()) + ' every year';
  }
  return '';
}

  if (m) return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");

}

function parseTime(v) {
  if (!v) return "";

  if (!m) return "";
  let h = parseInt(m[1]); const mn = m[2], ap = (m[3]||"").toUpperCase();
  if (ap==="PM" && h<12) h+=12;
  if (ap==="AM" && h===12) h=0;
  return String(h).padStart(2,"0")+":"+mn;
}

  if (endDate && endDate > date) s += " to " + new Date(endDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  if (time) {
    s += " · " + new Date(date+"T"+time).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    if (endtime) s += " - " + new Date(date+"T"+endtime).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    try { const tzAbbr = new Date(date+"T"+time).toLocaleTimeString("en-US",{timeZoneName:"short"}).split(" ").pop(); s += " " + tzAbbr; } catch(e){}

function downloadCalendarFile(ev, mode) {

function share() {
  const url = _withRef(_shortLink || _shareBase());

  const showCopyUI = () => {
    const existing = document.getElementById("share-url-box");
    if (existing) { existing.remove(); return; }
    const box = document.createElement("div");
    box.id = "share-url-box";
    box.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 4px 24px rgba(0,0,0,.18);z-index:9999;width:min(340px,92vw);";
    box.innerHTML = `<p style="font-size:12px;color:var(--muted);margin:0 0 8px;">Copy this link to share:</p><div style="display:flex;gap:8px;"><input id="share-url-input" value="${url}" readonly style="flex:1;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--dark);min-width:0;"><button id="share-copy-btn" onclick="(()=>{const i=document.getElementById('share-url-input');i.select();navigator.clipboard?.writeText(i.value).catch(()=>{});document.getElementById('share-copy-btn').textContent='✓';setTimeout(()=>document.getElementById('share-url-box')?.remove(),1200);})()" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;">Copy</button></div>`;
    document.body.appendChild(box);
    setTimeout(() => { const i = document.getElementById("share-url-input"); i?.select(); }, 60);
    setTimeout(() => box.remove(), 8000);
  };

  const copyFallback = () => {
    navigator.clipboard?.writeText(url)
      .then(() => showToast("🔗 Link copied!"))
      .catch(() => showCopyUI());
  };

  if (navigator.share) {
    navigator.share({ title: document.title, url })
      .catch(err => { if (err.name !== "AbortError") copyFallback(); });
  } else {
    copyFallback();
  }
}

function showStep(n) {
  ["rsvp-step-register","rsvp-step-signin","rsvp-step-loading"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
  const el = document.getElementById("rsvp-step-" + n);
  if (el) el.style.display = "block";
}


function normalizeAppearId(id) {
  return (id || "").replace(/\./g, "").toLowerCase();
}

function loadRegisterStep(appearId) {
  _rsvpAppearId = appearId;
  const nameEl = document.getElementById("rsvp-confirm-id");
  const photoEl = document.getElementById("rsvp-confirm-photo");
  if (nameEl) nameEl.textContent = "";
  if (photoEl) { photoEl.src = ""; photoEl.style.display = "none"; }
  showStep("register");

  const ids = [appearId];
  const normalized = normalizeAppearId(appearId);
  if (normalized !== appearId.toLowerCase()) ids.push(normalized);
  (async () => {
    for (const id of ids) {
      try {
        const res = await fetch(`${GS_URL}?action=lookupProfile&appearId=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.found) {
          if (nameEl && data.name) nameEl.textContent = data.name;
          if (photoEl && data.photo) { photoEl.src = data.photo; photoEl.style.display = "block"; }
          return;
        }
      } catch(e) {}
    }
  })();
}

async function confirmRsvp() {
  if (!_rsvpAppearId || !_currentEv) return;
  showStep("loading");
  document.getElementById("rsvp-loading-msg").textContent = "Registering you...";
  const isPublic = false;
  try {
    await fetch(`${GS_URL}?action=rsvp&appearId=${encodeURIComponent(_rsvpAppearId)}&eventId=${encodeURIComponent(_currentEv.id)}&public=${isPublic}`);
  } catch(e) {  }
  finishRsvp();
}

async function init() {
  const inIframe = window.self !== window.top;
  if (inIframe) {
    const backBar = document.querySelector('body > div:first-child');
    if (backBar) backBar.style.display = "none";
  }
  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) {
    window.location.replace("https://2gather.network/events/");
    return;
  }

  let _justWrote = false;
  try { _justWrote = (Date.now() - (Number(sessionStorage.getItem("cw-wrote-at")) || 0)) < 10 * 60 * 1000; } catch (e) {}
  if (id.startsWith("rec-")) {
    try {
      const sheetData = await fetchEvents(id, _justWrote);
      const allRows = (sheetData.events || []).filter(r => r.id);
      const tmpl = allRows.find(r => String(r.id) === id);
      if (tmpl && tmpl.dayOfWeek) {
        const slug = (tmpl.title || "").toLowerCase().replace(/\s+/g, "-");
        const nextDate = getNextDate(parseInt(tmpl.dayOfWeek), parseSheetTime(tmpl.endTime) || parseSheetTime(tmpl.startTime));
        const occId = `recurring-${slug}-${nextDate}`;
        const recEv = { ...toEv(tmpl), dayOfWeek: parseInt(tmpl.dayOfWeek) || 0, time: parseSheetTime(tmpl.startTime), endtime: parseSheetTime(tmpl.endTime), id: occId };
        const ev = recurToEv(recEv);
        ev.id = occId;
        ev.date = nextDate;
        ev.seriesId = tmpl.id;   
        const cancelRow = allRows.find(r => String(r.id) === "cancelled-" + occId);
        if (cancelRow) ev.cancelled = true;
        const noteRow = allRows.map(toEv).find(e => e.id === "occ-note-" + occId);
        if (noteRow) {
          const _today = new Date(); _today.setHours(0,0,0,0);
          if (new Date(nextDate + "T00:00:00") >= _today) ev.occurrenceNote = noteRow.description;
        }
        render(ev);
        return;
      }
    } catch(e) {}
    showError("Event not found.");
    return;
  }
  if (id.startsWith("recurring-")) {
    const dateStr = id.slice(-10);
    const slug    = id.slice("recurring-".length, id.length - 11);
    try {
      const sheetData = await fetchEvents(id, _justWrote);
      const allRows = (sheetData.events || []).filter(r => r.id);
      RECURRING_EVENTS = allRows
        .filter(r => String(r.id).startsWith("rec-") && r.recurFreq && r.dayOfWeek)
        .map(r => ({ ...toEv(r), dayOfWeek: parseInt(r.dayOfWeek) || 0, time: parseSheetTime(r.startTime), endtime: parseSheetTime(r.endTime) }));
      const _sameTitle = RECURRING_EVENTS.filter(r =>
        r.title.toLowerCase().replace(/\s+/g, "-") === slug
      );
      const _dowHere = new Date(dateStr + "T12:00:00").getDay();
      const recurMatch = _sameTitle.find(r => ((Number(r.dayOfWeek) % 7) + 7) % 7 === _dowHere) || _sameTitle[0];
      if (recurMatch) {
        const ev = recurToEv(recurMatch);
        ev.id = id;
        ev.date = dateStr;
        ev.seriesId = recurMatch.id;   
        const cancelRow = allRows.find(r => String(r.id) === "cancelled-" + id);
        if (cancelRow) ev.cancelled = true;
        const noteRow = allRows.map(toEv).find(e => e.id === "occ-note-" + id);
        if (noteRow && dateStr) {
          const _today = new Date(); _today.setHours(0,0,0,0);
          if (new Date(dateStr + "T00:00:00") >= _today) ev.occurrenceNote = noteRow.description;
        }
        render(ev);
        return;
      }
    } catch(e) {
      showError("Could not load event. Please try again.");
      return;
    }
  }

  let _fresh = null;
  try {
    const _h = JSON.parse(sessionStorage.getItem("cw-ev-fresh") || "null");
    if (_h && String(_h.id) === id && _h.row && (Date.now() - (Number(_h.at) || 0)) < 10 * 60 * 1000) { _fresh = _h.row; }
  } catch (e) {}
  if (_fresh) { try { render(toEv(_fresh)); } catch (e) {} }
  try {
    const data = await fetchEvents(id, !!_fresh);
    const _rawRow = (data.events||[]).find(r => String(r.id) === id);
    if (_rawRow && String(_rawRow.archived).toLowerCase() === "true") {
      try { sessionStorage.removeItem("cw-ev-fresh"); } catch (e) {}
      showError("This event was deleted.");
      return;
    }
    let ev = (data.events||[]).filter(r=>r.id).map(toEv).find(e=>e.id===id);
    let _signinLapsed = false, _oneFailed = false;
    if (ev && _fresh) { try { sessionStorage.removeItem("cw-ev-fresh"); } catch (e) {} }
    if (!ev) {
      window._evPrivatePath = true;
      try {
        var _me = (window.CW && window.CW.me) ? String(window.CW.me().id || "").trim() : "";
        if (!_me && !(window.CW && CW.signedOutView && CW.signedOutView())) { try { _me = String(localStorage.getItem("cw-id") || localStorage.getItem("appear-id") || "").trim(); } catch (e) {} }
        if (_me) {
          try {
            let _oneAc = null, _oneCap = null;
            try { _oneAc = new AbortController(); _oneCap = setTimeout(function () { try { _oneAc.abort(); } catch (x) {} }, 45000); } catch (x) {}
            const oneRes = await fetch(GS_URL + "?action=getEventById&id=" + encodeURIComponent(id) + "&appearId=" + encodeURIComponent(_me) + "&nocache=1&t=" + Date.now(), _oneAc ? { signal: _oneAc.signal } : undefined);
            const one = await oneRes.json();
            if (_oneCap) clearTimeout(_oneCap);
            if (one && one.event && one.event.row && String(one.event.row.id) === id) { ev = toEv(one.event.row); }
            else if (one && one.signinNeeded) { _signinLapsed = true; }
            else if (!one || !one.event || one.status === "error") { _oneFailed = true; }
          } catch (e) { _oneFailed = true; }
        }
        if (_me && !ev) {
          const mineRes = await fetch(GS_URL + "?action=getMyEvents&appearId=" + encodeURIComponent(_me) + "&nocache=1&t=" + Date.now());
          const mine = await mineRes.json();
          if (mine && mine.status === "ok" && Array.isArray(mine.events)) {
            ev = mine.events.filter(r=>r.id).map(toEv).find(e=>e.id===id);
          }
        }
      } catch (e) {}
    }
    if (!ev && _fresh) { return; }   
    if (!ev && _oneFailed && !_signinLapsed) {
      document.getElementById("card").innerHTML = '<div class="error">This event did not load. The server is slow right now, so it may just need another try.'
        + '<br><br><a href="" onclick="location.reload();return false;" style="color:var(--primary);font-weight:700;">Try again</a>'
        + ' &nbsp;·&nbsp; <a href="https://2gather.network/support/?re=' + encodeURIComponent(location.href) + '" style="color:var(--primary);font-weight:700;">Tell support</a></div>';
      return;
    }
    if (!ev) { showError(_signinLapsed ? "Your sign-in has run out. Sign in again to see this event." : "Event not found."); return; }
    const _r = new URLSearchParams(window.location.search).get("r");
    const viaCard = new URLSearchParams(window.location.search).get("via");
    try {
      if (_r && ev.id && /^[0-9a-z]{6}$/i.test(_r) && !(typeof getMemberId === "function" && getMemberId())) {
        localStorage.setItem("cw-ref", JSON.stringify({ r: String(_r).toLowerCase(), eventId: String(ev.id), at: Date.now() }));
      }
    } catch (e) {}
    if (_r && ev.id) {
      fetch(`${GS_URL}?action=noteShare&r=${encodeURIComponent(_r)}&eventId=${encodeURIComponent(ev.id)}&t=${Date.now()}`)
        .then(function (rr) { return rr.json(); })
        .then(function (dd) {
          if (dd && dd.found && dd.name && String(dd.name).trim().toLowerCase() !== String(ev.host || "").trim().toLowerCase()) { window._sharedByCard = dd.name; try { render(ev); } catch (e) {} }
        })
        .catch(function () {});
    } else if (viaCard && ev.id && String(viaCard).trim().toLowerCase() !== String(ev.host || "").trim().toLowerCase()) {
      window._sharedByCard = viaCard;
    }
    render(ev);
  } catch(e) {
    if (_fresh) return;   
    showError("Could not load event. Please try again.");
  }
}
