<!doctype html>
<html lang="en">

<title>Seeking and offering · 2Appear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1F699E;--ink:#1A2E42;--soft:#2F3D4F;--line:#DDE4EE;--panel:#F7FBFF;--panel-line:#C9DFF3;--brand:#1F699E;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:15px;font-weight:500;margin-bottom:22px;opacity:.92;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .breadcrumb .now{font-weight:800;}
  #pane{background:#fff;border-radius:16px;padding:24px 28px 28px;max-width:960px;margin:0 auto;}
  @media(max-width:600px){#pane{padding:18px 16px 22px;}}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;}
  .av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
  .av img{width:100%;height:100%;object-fit:cover;}
  h2{font-size:21px;font-weight:800;margin:0;flex:1;min-width:200px;}
  h3{font-size:17px;font-weight:800;margin:22px 0 10px;}
  .tabs{display:inline-flex;border:1.5px solid var(--brand);border-radius:24px;overflow:hidden;margin:0 0 6px;}
  .tabs a{font:700 13px 'Nunito Sans',sans-serif;padding:8.5px 16px;color:var(--brand);text-decoration:none;background:#fff;}
  .tabs a.on{background:var(--brand);color:#fff;}
  .btn{background:var(--brand);color:#fff;border:0;padding:9px 18px;border-radius:22px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:14px;font-weight:600;padding:8px 16px;border-radius:22px;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
  .post{padding:12px 0;border-top:1px solid var(--line);}
  .post:first-child{border-top:0;}
  .post .t{font-size:15px;font-weight:700;overflow-wrap:anywhere;}
  .post .m{font-size:14px;color:var(--soft);margin:2px 0 0;line-height:1.45;}
  .post .hid{display:inline-block;font-size:12.5px;font-weight:700;color:var(--soft);background:#EEF2F7;border-radius:12px;padding:2px 10px;margin-top:6px;}
  .none{font-size:14.5px;color:var(--soft);margin:4px 0;}
  #wait{color:#fff;font-size:15px;}
  #addroot{margin-top:16px;}
  [hidden]{display:none !important;}
</style>
<script src="/nav/identity.js?v=77"></script>
</head>
<body>
<div class="wrap">
  <div class="breadcrumb" id="crumb"></div>
  <div id="wait"><span class="cw-loading">Loading information...</span></div>
  <div id="pane" hidden>
    <div class="head"><span class="av" id="av"></span><h2 id="title"></h2><button type="button" class="btn" id="add" hidden>Add something</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="addroot" hidden></div>
    <div id="body">
      <h3 id="h-prof">On the profile</h3>
      <div class="chips" id="prof"></div>
      <h3 id="h-posts">Opportunities</h3>
      <div id="posts"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) { x.className = cls; } if (text != null) { x.textContent = text; } return x; }
  function token() { try { return localStorage.getItem('cw-token') || ''; } catch (e) { return ''; } }
  function meId() { try { var m = CW.me(); return m && m.id ? String(m.id).trim() : ''; } catch (e) { return ''; } }
  function send(action, params) {
    var body = { action: action, appearId: meId(), meToken: token() };
    Object.keys(params || {}).forEach(function (k) { body[k] = params[k] == null ? '' : String(params[k]); });
    return fetch(GS + '?action=' + action + '&meToken=&t=' + Date.now(), { method: 'POST', cache: 'no-store', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function initials(n) { var p = String(n || '').trim().split(/\s+/).filter(String); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); }

  var q = new URLSearchParams(location.search);
  var CODE = String(q.get('p') || '').trim().toLowerCase();
  var KIND = String(q.get('k') || 'seeking') === 'offering' ? 'offering' : 'seeking';
  var DIR = KIND === 'offering' ? 'offer' : 'seek';
  var WORD = KIND === 'offering' ? 'Offering' : 'Seeking';
  function addr(k) { return location.pathname + (SLUG && CODE.length > 1 && q.get('n') ? '?n=' + encodeURIComponent(SLUG) : '?p=' + encodeURIComponent(CODE)) + '&k=' + k; }

  function empty() { $('wait').hidden = true; $('pane').hidden = false; $('title').textContent = 'Nothing here yet.'; $('body').hidden = true; $('tabs').hidden = true; $('crumb').innerHTML = ''; }

  function draw(prof, posts) {
    var own = !!(posts && posts.own);
    var name = String((prof && prof.name) || '').trim();
    if (!name && !own) { empty(); return; }
    var first = name.split(/\s+/)[0] || 'They';
    $('wait').hidden = true; $('pane').hidden = false;
    var cr = $('crumb'); cr.innerHTML = '';
    var a = el('a', '', own ? 'My profile' : name); a.href = 'https://2appear.network/hi/?v=' + encodeURIComponent(CODE); cr.appendChild(a);
    cr.appendChild(document.createTextNode(' / ')); cr.appendChild(el('span', 'now', WORD));
    $('title').textContent = own ? (KIND === 'offering' ? 'What I’m offering' : 'What I’m seeking') : first + (KIND === 'offering' ? ' is offering' : ' is seeking');
    var av = $('av'); av.textContent = initials(name);
    var ph = String((prof && prof.photo) || '').trim();
    if (/^https:\/\//i.test(ph)) { av.textContent = ''; var im = el('img'); im.alt = ''; im.src = ph; im.onerror = function () { av.textContent = initials(name); }; av.appendChild(im); }
    var tb = $('tabs'); tb.innerHTML = '';
    [['seeking', 'Seeking'], ['offering', 'Offering']].forEach(function (t) { var x = el('a', t[0] === KIND ? 'on' : '', t[1]); x.href = addr(t[0]); tb.appendChild(x); });
    var lines = (prof && (KIND === 'offering' ? prof.offerings : prof.needs)) || [];
    var pr = $('prof'); pr.innerHTML = '';
    if (lines.length) { lines.forEach(function (w) { pr.appendChild(el('span', 'chip', w)); }); } else { pr.appendChild(el('p', 'none', 'Nothing here yet.')); }
    var list = (posts && posts.posts) || [], pb = $('posts'); pb.innerHTML = '';
    if (list.length) {
      list.forEach(function (p) {
        var r = el('div', 'post'); r.appendChild(el('div', 't', String(p.title || '')));
        var m = [p.kind, p.category].filter(function (v) { return v; }).join(' · '); if (m) { r.appendChild(el('div', 'm', m)); }
        if (p.line) { r.appendChild(el('div', 'm', String(p.line))); }
        if (own && p.state && p.state !== 'open') { r.appendChild(el('span', 'hid', 'Hidden from others')); }
        pb.appendChild(r);
      });
    } else { pb.appendChild(el('p', 'none', 'Nothing here yet.')); }
    var add = $('add'); add.hidden = !own;
    add.onclick = function () {
      if (!window.CWAdd) { return; }
      $('body').hidden = true; add.hidden = true; var root = $('addroot'); root.hidden = false; root.innerHTML = '';
      CWAdd.start(root, { dir: DIR, gs: GS, send: send,
        onSaved: function () { load(); },
        onExit: function () { root.hidden = true; $('body').hidden = false; add.hidden = false; },
        onList: function () { location.href = 'https://2appear.network/opportunities/'; },
        onMine: function () { location.href = 'https://2appear.network/opportunities/'; } });
    };
  }

  var TRIES = 0;
  var SLUG = String(q.get('n') || '').trim().toLowerCase();
  function load() {
    if (!CODE && /^[a-z0-9-]{2,60}$/.test(SLUG)) {
      fetch(GS + '?action=vanity&slug=' + encodeURIComponent(SLUG) + '&t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' }).then(function (r) { return r.json(); })
        .then(function (v) { CODE = v && v.found && /^[a-z0-9]{4,12}$/.test(String(v.code || '')) ? String(v.code).toLowerCase() : '-'; load(); }).catch(function () { CODE = '-'; load(); });
      return;
    }
    if (!/^[a-z0-9]{4,12}$/.test(CODE)) { empty(); return; }
    if (!meId() && TRIES < 30) { TRIES++; setTimeout(load, 300); return; }
    var none = { status: 'ok', own: false, posts: [] };
    var pp = fetch(GS + '?action=publicProfile&p=' + encodeURIComponent(CODE) + '&t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' }).then(function (r) { return r.json(); }).then(function (d) { return d && d.found ? d.data : null; }).catch(function () { return null; });
    var po = meId() ? send('getPersonPosts', { code: CODE, dir: DIR }).then(function (d) { return d && d.status === 'ok' ? d : none; }).catch(function () { return none; }) : Promise.resolve(none);
    Promise.all([pp, po]).then(function (r) { $('addroot').hidden = true; $('body').hidden = false; draw(r[0], r[1]); });
  }
  load();
})();
</script>
<script src="/nav/add-flow.js?v=1"></script>
<script src="/nav/waiting-words.js?v=16"></script>
<script src="/nav/topbar.js?v=7.15" defer></script>
</body>
</html>
