<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#2F3D4F; --muted:#2F3D4F;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E; --bad:#B42318;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:15px;font-weight:500;margin-bottom:22px;opacity:.92;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .breadcrumb .now{font-weight:800;}
  #pane{background:#fff;border-radius:16px;padding:24px 28px 28px;max-width:960px;margin:0 auto;}
  @media(max-width:600px){#pane{padding:18px 16px 22px;}}
  h2{font-size:21px;font-weight:800;margin:0 0 16px;color:var(--ink);}
  h3{font-size:17px;font-weight:800;margin:26px 0 4px;color:var(--ink);}
  .sub{font-size:14.5px;color:var(--soft);margin:0 0 12px;line-height:1.6;}
  .btn{background:var(--brand);color:#fff;border:0;padding:9px 18px;border-radius:22px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .btn[disabled]{opacity:.6;cursor:default;}
  .notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:14.5px;line-height:1.5;}
  .notice span{flex:1;min-width:200px;}
  .notice .q{font-weight:800;display:block;margin-bottom:2px;}
  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .row:first-child{border-top:0;}
  .av{width:48px;height:48px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#7DD3FC,#1F699E);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;}
  .av img{width:100%;height:100%;object-fit:cover;}
  .who{flex:1;min-width:0;}
  .who .name{font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;}
  .who .line{font-size:14px;color:var(--muted);margin:2px 0 0;line-height:1.45;overflow-wrap:anywhere;}
  .who .city{font-size:13px;color:var(--soft);margin:1px 0 4px;}
  .actions-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .state{font-size:14px;font-weight:700;color:var(--brand);margin-top:10px;}
  .none{font-size:14.5px;color:var(--soft);margin:6px 0;}
  #wait{color:#fff;font-size:15px;}
  [hidden]{display:none !important;}
  .notice .fm-cap{flex:0 0 auto;min-width:0;}
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .cw-card{background:#fff;border-radius:14px;padding:22px 24px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
  .cw-avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden;margin-bottom:4px;}
  .cw-avatar img{width:100%;height:100%;object-fit:cover;}
  .cw-avatar.blank{background:#DDE4EE;}
  .cw-card .name{font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;}
  .cw-card .line{font-size:14px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;}
  .cw-card .actions-row{margin-top:auto;padding-top:8px;}
  #cards .wide{grid-column:1 / -1;}
</style>
<script src="/nav/identity.js?v=77"></script>

<body>
<div class="wrap">
  <div class="breadcrumb"><a href="https://2appear.network/dashboard/">Dashboard</a> / <a href="/mockups/ux83/rms-people/people/met/">Network</a> / <span class="now">My matches</span></div>
  <div id="wait"><span class="cw-loading">Loading information...</span></div>
  <div id="pane" hidden>
    <h2>My matches</h2>
    <div id="findme" hidden></div>
    <div id="cards"></div>
  </div>
</div>
<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var FP_BOX = 'If you both say yes, you see each other’s names and you both appear in each other’s Contacted tab. If you say not now, they are never told.';
  var ME = '';
  try { var _m = CW.me(); ME = _m && _m.id ? String(_m.id).trim() : ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function token() { try { return localStorage.getItem('cw-token') || ''; } catch (e) { return ''; } }
  function viewing() { try { var m = CW.me(); return !!(m && m.viewing); } catch (e) { return true; } }
  function send(action, params) {
    var body = { action: action, appearId: ME, meToken: token() };
    Object.keys(params || {}).forEach(function (k) { body[k] = params[k] == null ? '' : String(params[k]); });
    return fetch(GS_URL + '?action=' + action + '&meToken=&t=' + Date.now(), { method: 'POST', cache: 'no-store', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function initials(n) { var p = String(n || '').trim().split(/\s+/).filter(String); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); }
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) { x.className = cls; } if (text != null) { x.textContent = text; } return x; }
  function lines(who, list) { (list || []).forEach(function (t) { if (t) { who.appendChild(el('div', 'line', String(t))); } }); }
  function notice(text) { var d = el('div', 'notice'); d.appendChild(el('span', '', text)); return d; }
  function shown() { $('wait').hidden = true; $('pane').hidden = false; }

  function drawFindMe(d) {
    var box = $('findme'); box.innerHTML = '';
    if (!d.told || !window.CWFindMe) { box.hidden = true; return; }
    box.hidden = false;
    var n = el('div', 'notice'), sp = el('span');
    sp.appendChild(el('span', 'q', 'Let people find me'));
    sp.appendChild(document.createTextNode('Your matches are visible with people you don\u2019t know. You both stay anonymous until you both say yes to saying hi.'));
    n.appendChild(sp); n.appendChild(CWFindMe.capsule(ME, d.findMe === 'on', function () { load(); }));
    box.appendChild(n);
  }

  function card(name, photo, blank) {
    var c = el('div', 'cw-card'), av = el('span', 'cw-avatar' + (blank ? ' blank' : ''), blank ? '' : initials(name));
    var ph = String(photo || '').trim();
    if (!blank && /^https:\/\//i.test(ph)) { av.textContent = ''; var im = el('img'); im.alt = ''; im.src = ph; im.onerror = function () { av.textContent = initials(name); }; av.appendChild(im); }
    c.appendChild(av); c.appendChild(el('div', 'name', name));
    return c;
  }
  function drawCards(d) {
    var box = $('cards'); box.innerHTML = '';
    if (d.needTopics) {
      var t = notice('Add a topic first so we can find your matches.'); t.className += ' wide';
      var a = el('a', 'btn', 'Add a topic'); a.href = 'https://2appear.network/dashboard/'; t.appendChild(a); box.appendChild(t);
    }
    (d.known || []).forEach(function (k) {
      var name = String(k.name || '').trim() || 'Someone';
      var c = card(name, k.photo, false); lines(c, k.reasons);
      var acts = el('div', 'actions-row'), b = el('button', 'btn', 'Ask to connect'); b.type = 'button';
      var st = el('div', 'state'); st.hidden = true;
      b.onclick = function () { b.disabled = true; send('askConnect57b', { toCode: k.person }).then(function (r) { acts.hidden = true; st.hidden = false; st.textContent = r && r.sent ? 'Sent' : 'Not sent'; }).catch(function () { b.disabled = false; }); };
      acts.appendChild(b); c.appendChild(acts); c.appendChild(st);
      box.appendChild(c);
    });
    if (d.findMe !== 'on') { if (!box.children.length) { var e0 = notice('No matches yet.'); e0.className += ' wide'; box.appendChild(e0); } return; }
    var boxShown = false;
    (d.anon || []).forEach(function (x) {
      var c = card('Someone on 2Appear', '', true);
      if (x.city) { c.appendChild(el('div', 'city', x.city)); }
      lines(c, x.reasons);
      var st = el('div', 'state', 'Waiting'), acts = el('div', 'actions-row');
      if (x.state === 'waiting') { c.appendChild(st); }
      else {
        if (!boxShown) { var bx = notice(FP_BOX); bx.style.margin = '6px 0 0'; c.appendChild(bx); boxShown = true; }
        var r = el('button', 'btn', 'Reach out'), n = el('button', 'btn ghost', 'Not now'); r.type = n.type = 'button';
        st.hidden = true;
        r.onclick = function () { r.disabled = n.disabled = true; send('reachOut57b', { card: x.card }).then(function (y) { if (y && y.state === 'waiting') { acts.hidden = true; st.hidden = false; } else { r.disabled = n.disabled = false; } }).catch(function () { r.disabled = n.disabled = false; }); };
        n.onclick = function () { r.disabled = n.disabled = true; send('fpNotNow57b', { card: x.card }).then(function () { c.remove(); }).catch(function () { r.disabled = n.disabled = false; }); };
        acts.appendChild(r); acts.appendChild(n); c.appendChild(acts); c.appendChild(st);
      }
      box.appendChild(c);
    });
    if (d.dayFull) { var f = notice('That\u2019s everyone for today. More people tomorrow.'); f.className += ' wide'; box.appendChild(f); }
    if (!box.children.length) { var e1 = notice('No matches yet.'); e1.className += ' wide'; box.appendChild(e1); }
  }

  var TRIES = 0;
  function load() {
    try { var m = CW.me(); ME = m && m.id ? String(m.id).trim() : ''; } catch (e) { ME = ''; }
    if (!ME && TRIES < 40) { TRIES++; setTimeout(load, 300); return; }
    if (!ME) { $('wait').textContent = 'Sign in to see your matches.'; return; }
    if (viewing()) { $('wait').textContent = 'Only the person can open their own matches.'; return; }
    var code = ''; try { code = String(new URLSearchParams(location.search).get('c') || '').trim(); } catch (e) {}
    send('myMatches57b', { code: code }).then(function (d) {
      if (!d || d.status !== 'ok') { $('wait').textContent = 'That did not load. Try again in a moment.'; return; }
      shown(); drawFindMe(d); drawCards(d);
    }).catch(function () { $('wait').textContent = 'That did not load. Check your connection and try again.'; });
  }
  load();
</script>
<script src="/nav/find-me-notice.js?v=2"></script>

</body>
