<!doctype html>
<html>
<head>

<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Send appreciation · 2Appear</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{--bg:#1F699E;--ink:#1A2E42;--line:#DDE4EE;--brand:#1F699E;--bad:#B42318;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:15px;font-weight:500;margin-bottom:22px;opacity:.92;}
  .breadcrumb a{color:#fff;text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .breadcrumb .now{font-weight:800;}
  .gr-card{background:#fff;border-radius:18px;padding:18px;color:#1A2E42}
  .gr-card h3{margin:0 0 6px;font-size:20px}
  .gr-hint{font-size:13.5px;color:#4B5A6D;margin:0 0 10px}
  .gr-q{font-weight:800;font-size:15px;margin:14px 0 6px}
  .gr-pills{display:flex;flex-wrap:wrap;gap:8px}
  .gr-pill{font:inherit;font-size:14px;font-weight:600;line-height:1.3;padding:8px 16px;border-radius:22px;border:1.5px solid #DDE4EE;background:#fff;color:#1A2E42;cursor:pointer;min-height:38px;display:inline-flex;align-items:center}
  .gr-pill:hover{background:#EEF2F7}
  .gr-pill[aria-pressed=true],.gr-pill[aria-pressed=true]:hover{background:#1F699E;color:#fff;border-color:#1F699E;font-weight:700}
  .gr-pi{display:inline-block;vertical-align:-4px;margin-left:6px;line-height:0}
  .gr-card textarea{width:100%;font:600 14px 'Nunito Sans',sans-serif;padding:10px 14px;border:1.5px solid #DDE4EE;border-radius:12px;background:#fff;color:#1A2E42;resize:vertical;min-height:80px}
  .gr-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px solid #1F699E;background:#fff;border-radius:24px;font-weight:700;margin-bottom:8px}
  .gr-chip.has-ph{padding-left:6px}
  .gr-chip img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
  .gr-box{background:#EEF1F5;border:1.5px solid #DDE4EE;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
  .gr-foot{display:flex;gap:12px;align-items:center;margin-top:16px}
  .gr-btn{font:inherit;font-size:13px;font-weight:700;line-height:1.3;padding:7px 14px;border-radius:24px;border:1.5px solid #1F699E;background:#1F699E;color:#fff;cursor:pointer;min-height:34px}
  .gr-btn[disabled]{opacity:.6;cursor:default}
  .gr-lk{font:inherit;font-size:14px;font-weight:700;color:#1F699E;background:none;border:0;cursor:pointer;text-decoration:underline}
  .gr-msg{margin:10px 0 0;font-size:14px}
  [hidden]{display:none !important}
  .wait{color:#fff;font-size:14px}
</style>
<script src="/nav/identity.js?v=72"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E49B0F"/><stop offset="1" stop-color="#FFD84D"/></linearGradient><linearGradient id="gp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A4584"/><stop offset="1" stop-color="#D5A8D0"/></linearGradient></defs></svg>
<div class="wrap">
  <div class="breadcrumb" id="crumb"></div>
  <p class="wait" id="wait"><span class="cw-loading">Loading information...</span></p>
  <div class="gr-card" id="form" hidden>
    <h3>Send appreciation</h3>
    <p class="gr-hint">Big or small. They get an email. It shows on their profile only after they say yes.</p>
    <div><span class="gr-chip" id="chip"></span></div>
    <p class="gr-q">How did they show up for you?</p>
    <p class="gr-hint" style="margin:0 0 8px">Pick any that fit.</p>
    <div class="gr-pills" data-gr="showedUpAs"></div>
    <p class="gr-q">What came of it?</p>
    <div class="gr-pills" data-gr="resultsCreated"></div>
    <p style="margin:12px 0 0"><button class="gr-lk" type="button" id="more">+ Add the role they played</button></p>
    <div id="moreb" hidden>
      <p class="gr-q">How did they show up for you in this instance?</p>
      <div class="gr-pills" data-gr="roleThisTime"></div>
    </div>
    <p class="gr-q" id="notelbl">Private message - visible only to them:</p>
    <textarea id="note" maxlength="1000" aria-labelledby="notelbl"></textarea>
    <div class="gr-foot"><button class="gr-lk" type="button" id="cancel">Cancel</button><button class="gr-btn" type="button" id="send" style="margin-left:auto">Send</button></div>
    <p class="gr-msg" id="msg" role="status" hidden></p>
  </div>
</div>
<script>
(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var OPT = {
    showedUpAs: ['Connector 🌐', 'Motivator 🎉', 'Guide ⭐️', 'Believer 🔥', 'Collaborator ✅', 'Challenger 🌱', 'Supporter 💛', 'Provider 🚀'],
    resultsCreated: ['Clarity gained', 'Felt more settled', 'Inspired', 'Time saved', 'Skill built', 'Met someone new', 'Problem solved'],
    roleThisTime: ['Mentor', 'Advisor', 'Feedback giver', 'Volunteer', 'Partner', 'Coach']
  };
  var IC = {"Connector": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#6BB3E6;stroke:#6BB3E6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"18\" r=\"2.5\"/><circle cx=\"19\" cy=\"18\" r=\"2.5\"/><path d=\"M11 7.3L6 15.8M13 7.3l5 8.5M7.5 18h9\"/></svg>", "Motivator": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#F26A10;stroke:#F26A10;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8\"/></svg>", "Guide": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:url(#gg);stroke:#E49B0F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M9 18h6M10 21h4\" fill=\"none\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z\"/></svg>", "Believer": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#E5482B;stroke:#E5482B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><g transform=\"translate(12 11.5) scale(1.3) translate(-12 -11.5)\"><path d=\"M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-1-5 1-8z\"/><path d=\"M12 17.2a2.4 2.4 0 0 1-2.4-2.4c0-1.3 1-2 1.7-3 .4 1 1.1 1.2 1.1 1.2.5-.5.6-1 .6-1.6 1 .8 1.4 1.8 1.4 3.4a2.4 2.4 0 0 1-2.4 2.4z\" fill=\"#F9C61F\" stroke=\"none\"/></g></svg>", "Collaborator": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#2E7CB8;stroke:#2E7CB8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"19.2\" cy=\"4.8\" r=\"3.5\"/><circle cx=\"4.8\" cy=\"19.2\" r=\"3.5\"/><circle cx=\"14.4\" cy=\"9.6\" r=\"1\" fill=\"#2E7CB8\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"1\" fill=\"#2E7CB8\" stroke=\"none\"/><circle cx=\"9.6\" cy=\"14.4\" r=\"1\" fill=\"#2E7CB8\" stroke=\"none\"/></svg>", "Challenger": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#1A1A1A;stroke:#1A1A1A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M13 2L4 14h7l-1 8 9-12h-7z\"/></svg>", "Supporter": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:url(#gp);stroke:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><g transform=\"translate(12 12) scale(1.35 1.2) translate(-12 -12)\"><path d=\"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z\"/></g></svg>", "Provider": "<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"fill:#8B5A2B;stroke:#8B5A2B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M3 10v7l9 5 9-5v-7l-9 5z\"/><path d=\"M3 10l9-5 9 5-9 5z\"/><path d=\"M3 10L1 6l9-5 2 4z\"/><path d=\"M21 10l2-4-9-5-2 4z\"/><path d=\"M3 10l9 5 9-5M12 15v7\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\"/></svg>"};
  function $(id) { return document.getElementById(id); }
  function token() { try { return localStorage.getItem('cw-token') || ''; } catch (e) { return ''; } }
  var ME = '', CODE = '', BUSY = false;
  try { var m = CW.me(); ME = m && m.id ? String(m.id).trim() : ''; } catch (e) {}
  function viewing() { try { var v = CW.me(); return !!(v && v.viewing); } catch (e) { return true; } }
  var qp = new URLSearchParams(location.search);
  CODE = String(qp.get('c') || '').replace(/^c:/i, '').trim();
  function say(t) { var s = $('msg'); s.textContent = t; s.hidden = !t; }
  function backHref() { return '/mockups/ux83/rms-people/people/met/'; }
  function crumb(name) {
    var c = $('crumb');
    c.innerHTML = '<a href="' + backHref() + '">My contacts</a> / <span class="now"></span>';
    c.querySelector('.now').textContent = name ? (name + ' / Appreciation') : 'Appreciation';
  }
  function paintPills() {
    Object.keys(OPT).forEach(function (k) {
      var el = document.querySelector('[data-gr="' + k + '"]'); if (!el) { return; }
      el.innerHTML = '';
      OPT[k].forEach(function (v) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'gr-pill'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('data-v', v); var nm = k === 'showedUpAs' ? v.replace(/[^\p{L}\s-]/gu, '').trim() : v; b.textContent = nm; if (k === 'showedUpAs' && IC[nm]) { var ic = document.createElement('span'); ic.className = 'gr-pi'; ic.innerHTML = IC[nm].replace('width="20" height="20"', 'width="18" height="18"'); b.appendChild(ic); }
        b.onclick = function () { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); };
        el.appendChild(b);
      });
    });
  }
  function pick(k) {
    return Array.prototype.map.call(document.querySelectorAll('[data-gr="' + k + '"] .gr-pill[aria-pressed=true]'), function (b) { return b.getAttribute('data-v'); }).join('|');
  }
  function show(name, photo) {
    crumb(name);
    $('wait').hidden = true; $('form').hidden = false;
    var ch = $('chip'); ch.textContent = ''; ch.classList.remove('has-ph');
    if (/^https:\/\//i.test(String(photo || ''))) { var im = document.createElement('img'); im.alt = ''; im.src = String(photo); im.onerror = function () { im.remove(); ch.classList.remove('has-ph'); }; ch.appendChild(im); ch.classList.add('has-ph'); }
    var sp = document.createElement('span'); sp.textContent = name || 'This person'; ch.appendChild(sp);
    paintPills();
  }
  function start() {
    crumb('');
    if (!ME || !CODE) { $('wait').textContent = 'Open this from a person in your Contacts.'; return; }
    if (viewing()) { $('wait').textContent = 'Appreciation can only be sent as yourself.'; return; }
    fetch(GS_URL + '?action=getContacts&appearId=' + encodeURIComponent(ME) + '&meToken=' + encodeURIComponent(token()) + '&t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json(); }).then(function (d) {
        var list = (d && (d.contacts || d.items)) || [], nm = '', ph = '';
        list.forEach(function (x) { if (x && String(x.person || '').replace(/^c:/i, '') === CODE) { nm = String(x.name || ''); ph = String(x.photo || ''); } });
        show(nm, ph);
      }).catch(function () { show(''); });
  }
  $('more').onclick = function () { $('moreb').hidden = false; $('more').hidden = true; };
  $('cancel').onclick = function () { location.href = backHref(); };
  $('send').onclick = function () {
    if (BUSY || viewing()) { return; }
    if (!pick('showedUpAs')) { say('Pick how they showed up for you.'); return; }
    BUSY = true; $('send').disabled = true; say('Sending your thanks…');
    fetch(GS_URL + '?action=giveGratitude&t=' + Date.now(), {
      method: 'POST', cache: 'no-store', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'giveGratitude', appearId: ME, meToken: token(), receiverId: 'c:' + CODE, showedUpAs: pick('showedUpAs'), resultsCreated: pick('resultsCreated'), roleThisTime: pick('roleThisTime'), expertiseShared: '', privateNote: $('note').value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.status === 'ok') {
        say('Sent. They get an email. It shows on their profile only after they say yes.'); $('send').hidden = true;
        if (d.key) { fetch(GS_URL + '?action=mailGratitude&appearId=' + encodeURIComponent(ME) + '&meToken=' + encodeURIComponent(token()) + '&receiverId=' + encodeURIComponent('c:' + CODE) + '&key=' + encodeURIComponent(d.key) + '&t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer' }).catch(function () {}); }
      } else {
        var code = String((d && (d.code || (d.status === 'error' ? (d.error || d.reason) : d.status))) || '');
        var words = { viewing: 'Appreciation can only be sent as yourself.', self: 'You can not send appreciation to yourself.', notFound: 'I could not find that person.', empty: 'Pick how they showed up for you.', limit: 'You have sent the most you can today. Try again tomorrow.', reload: 'Reload this page and try again.' };
        say(words[code] || (d && d.message) || 'That did not send. Try again.'); $('send').disabled = false;
      }
    }).catch(function () { say('That did not send. Try again.'); $('send').disabled = false; })
      .then(function () { BUSY = false; });
  };
  start();
})();
</script>
<script src="/nav/waiting-words.js?v=16"></script>
</body>
</html>
