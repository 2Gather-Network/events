<!--
  2gather.network/myevents/new/ IS POSTING AN EVENT. It is an address, not a page.

  Jessie, 2026-09-10: "why this url? https://2gather.network/myevents/?post=1 instead of just
  myevents/new". There was no reason worth keeping, so the clean address exists now and every link
  in this repository points at it.

  HER EARLIER DECISION STANDS, as recorded beside ?post=1 on My events on 2026-09-06: a switch on
  the page that already has the thing, rather than a second page. The form lives on My events and
  nowhere else, so this file
  holds no form and no copy of one. It forwards to /myevents/?post=1, which opens the two questions,
  and My events then writes /myevents/new/ back into the address bar. So the address she sees and
  copies is this one, and a reload comes back through here and lands in the questions again.

  Every other parameter is carried through untouched - ?groupId= and ?groupName= from a group's
  panel are what tick the group for her. A post=1 already in the address is not doubled. Same tab,
  and it replaces this step so Back does not land the person here. /myevents/new without the
  slash is sent to /myevents/new/ by the host with its parameters intact, measured on
  /myevents/manage the same day.

  ?post=1 keeps working on its own, forever, for links already sent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post an event</title>
<style>
  html,body{margin:0;padding:0;background:#1F699E;}
</style>
<script>
  (function () {
    var rest = '', hash = '';
    try {
      var p = new URLSearchParams(window.location.search || '');
      p.delete('post');
      rest = p.toString();
      hash = window.location.hash || '';
    } catch (e) {}
    var to = 'https://2gather.network/myevents/?post=1' + (rest ? '&' + rest : '') + hash;
    try { window.location.replace(to); } catch (e) { window.location.href = to; }
  })();
</script>
</head>
<body></body>
</html>
