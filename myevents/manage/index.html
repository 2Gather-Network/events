<!--
  MY EVENTS IS ONE PAGE AND IT IS 2gather.network/myevents/. This is the old address, kept only so
  links already sent keep opening.

  Jessie, 2026-09-10, on being told that /myevents/ and /myevents/manage/ were never a security
  boundary - both need you signed in as yourself and both show only your own events: "so yes let's
  make that one if it's not a securit boundary and it should be called myevents just like mygroups
  - as long as it's secure."

  THE BOUNDARY THAT IS REAL IS A DIFFERENT PAIR AND IT STAYS. 2gather.network/event/?id= is the
  public door and anybody may open it; 2gather.network/myevents/?id= is the editing door and it is
  meant to refuse anybody who is not the host, the socializer or a super admin. One id, two doors:
  one for looking, one for editing. That is the shape Luma and Eventbrite both use. Splitting
  My events in two was never part of it - it was two names for one room.

  Every parameter is carried through untouched, so an ?id= or ?post=1 link somebody shared still
  lands where it did. Same tab, and it replaces this step so Back does not return here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My events</title>
<style>
  html,body{margin:0;padding:0;background:#1F699E;}
</style>
<script>
  (function () {
    var qs = '';
    try { qs = window.location.search || ''; } catch (e) {}
    var to = 'https://2gather.network/myevents/' + qs;
    try { window.location.replace(to); } catch (e) { window.location.href = to; }
  })();
</script>
</head>
<body></body>
</html>
