<!--
  THE ADDRESS MY EVENTS SHOULD ALWAYS HAVE HAD. Jessie, 2026-09-09: "why didn't we make
  https://2gather.network/manage/ - 2gather.network/myevents/manage", and then, about the link
  going into Glide: "we need to update the URL so we can make this work better. in the meantime,
  what URL can we have?"

  This is the answer to both at once. The page still lives at /manage/, because it was built as the
  editing page and only became My events on 2026-09-08, and moving it outright would break every
  link anybody has already shared. This address exists NOW and forwards, so the link that goes into
  Glide and Appear today is the one that stays correct after the page moves for real. Nothing has
  to be changed in Glide twice.

  Every parameter is carried through untouched, CWid included, so identity survives the hop.
  Same tab, and it replaces this step in history so Back does not land the person here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My events</title>
<style>
  html,body{margin:0;padding:0;background:#1F699E;}
</style>
<script>
  (function () {
    var qs = '';
    try { qs = window.location.search || ''; } catch (e) {}
    var to = 'https://2gather.network/manage/' + qs;
    try { window.location.replace(to); } catch (e) { window.location.href = to; }
  })();
</script>
</head>
<body></body>
</html>
