<html>
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta property="og:site_name" content="2Appear">
<meta property="og:title" content="Co-host invitation · 2Appear">
<title>Co-host invitation · 2Appear</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#2F3D4F; --line:#DDE4EE; --brand:#1F699E; --info:#E8F2F9; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:620px;margin:0 auto;padding:24px 16px 60px;}
  .card{background:var(--card);border-radius:16px;padding:24px 22px;}
  h1{font-size:22px;font-weight:800;margin:0 0 6px;line-height:1.3;}
  .lede{font-size:15px;color:var(--soft);margin:6px 0 16px;line-height:1.55;}
  .info{background:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);margin:0 0 16px;}
  .opt{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;margin:0 0 10px;cursor:pointer;}
  .opt input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--brand);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:22px;padding:11px 20px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;border:1.5px solid var(--brand);}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);}
  .btn[disabled]{opacity:.6;cursor:default;}
  .status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;display:none;}
  .status.err{display:block;background:#FBE9E7;border:1px solid #E8B0A5;color:#7A2410;}
</style>
  <script src="/nav/identity.js?v=71"></script>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><p class="lede">Looking up your invitation&hellip;</p></div>
</div>
<script>
(function(){
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var q = new URLSearchParams(location.search);
  var inv = String(q.get('i') || '').trim();
  var here = location.pathname + (inv ? '?i=' + encodeURIComponent(inv) : '');
  try { history.replaceState(null, '', here); } catch (e) {}
  var card = document.getElementById('card');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };
  var say = function(h, p, btns){ card.innerHTML = '<h1>' + h + '</h1>' + (p ? '<p class="lede">' + p + '</p>' : '') + (btns ? '<div class="actions">' + btns + '</div>' : '') + '<div class="status" id="st"></div>'; };
  var myEvents = 'https://2appear.network/myevents/';
  if (!/^[A-Za-z0-9_-]{10,40}$/.test(inv)) { say('This link is missing a piece', 'Open the link from your email again, all of it.'); return; }
  var me = (window.CW && CW.me) ? CW.me() : { id: '' };
  if (me.viewing) { say('You are viewing as someone else', 'Stop viewing as them first. Only the person this email went to can answer it.'); return; }
  var id = (window.CW && CW.realMe) ? CW.realMe().id : '';
  var pass = (window.CW && CW.passParam) ? CW.passParam() : '';
  if (!id || !pass) {
    say('You have been invited to co-host an event', 'Sign in with the address this email came to. You\u2019ll come straight back here.',
      '<a class="btn primary" href="https://2gather.network/signin/?next=' + encodeURIComponent(here) + '">Sign in</a>');
    return;
  }
  var base = GS_URL + '?appearId=' + encodeURIComponent(id) + pass + '&i=' + encodeURIComponent(inv);
  var d = null;
  var ended = function(){ say('This invitation has ended', 'If you still want to co-host, ask the person who invited you to send it again.'); };
  var fail = function(msg){ var st = document.getElementById('st'); if (st) { st.className = 'status err'; st.textContent = msg || 'That did not go through. Try again.'; } };
  var answer = function(ans, btnIds, label){
    btnIds.forEach(function(b){ var el = document.getElementById(b); if (el) el.disabled = true; });
    var main = document.getElementById(btnIds[btnIds.length - 1]); if (main) main.textContent = 'Saving\u2026';
    fetch(base + '&action=respondCoHostInvite&answer=' + ans + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(a){
        if (a && a.status === 'ok') {
          try { sessionStorage.setItem('cw-wrote-at', String(Date.now())); } catch (e) {}
          if (a.state === 'accepted') { d.state = 'accepted'; showAccepted(); return; }
          if (a.state === 'declined') { say('Thanks for letting us know', 'Nothing changed on your account.', '<a class="btn primary" href="' + myEvents + '">See my events</a>'); return; }
          if (a.state === 'stepped-down') { say('You stepped down', 'You are no longer a co-host of ' + esc(d.title) + '.', '<a class="btn primary" href="' + myEvents + '">See my events</a>'); return; }
        }
        if (a && (a.code === 'lapsed' || a.code === 'closed' || a.code === 'ended')) { ended(); return; }
        btnIds.forEach(function(b){ var el = document.getElementById(b); if (el) el.disabled = false; });
        if (main) main.textContent = label;
        fail(a && a.message);
      })
      .catch(function(){ btnIds.forEach(function(b){ var el = document.getElementById(b); if (el) el.disabled = false; }); if (main) main.textContent = label; fail('Could not reach the server. Try again in a moment.'); });
  };
  var showPending = function(){
    card.innerHTML = '<h1>Would you like to co-host this event?</h1>'
      + '<p class="lede">' + esc(d.inviter) + ' asked you to co-host <strong>' + esc(d.title) + '</strong>' + (d.when ? ', ' + esc(d.when) : '') + '.</p>'
      + '<div class="info">As a co-host you can edit the event and see the emails of the people who register. You can step down any time.</div>'
      + '<div class="actions"><button type="button" class="btn ghost" id="dec">Decline</button><button type="button" class="btn primary" id="acc">Accept</button></div>'
      + '<div class="status" id="st"></div>';
    document.getElementById('acc').onclick = function(){ answer('accept', ['dec', 'acc'], 'Accept'); };
    document.getElementById('dec').onclick = function(){ answer('decline', ['acc', 'dec'], 'Decline'); };
  };
  var showAccepted = function(){
    card.innerHTML = '<h1>You are a co-host of ' + esc(d.title) + '</h1>'
      + '<p class="lede">You can edit it from My events.</p>'
      + '<div class="actions"><button type="button" class="btn ghost" id="down">Step down</button><a class="btn primary" href="' + myEvents + '">See my events</a></div>'
      + '<div class="status" id="st"></div>';
    document.getElementById('down').onclick = function(){
      card.innerHTML = '<h1>Step down from co-hosting ' + esc(d.title) + '?</h1>'
        + '<p class="lede">You will no longer be able to edit it or see the emails of the people who register.</p>'
        + '<div class="actions"><button type="button" class="btn ghost" id="keep">Keep co-hosting</button><button type="button" class="btn primary" id="sure">Step down</button></div>'
        + '<div class="status" id="st"></div>';
      document.getElementById('keep').onclick = showAccepted;
      document.getElementById('sure').onclick = function(){ answer('stepdown', ['keep', 'sure'], 'Step down'); };
    };
  };
  fetch(base + '&action=getCoHostInvite&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(x){
      d = x;
      if (!d || d.status !== 'ok') {
        if (d && d.code === 'notForYou') { say('This invitation is not for this account', 'Sign in with the address this email came to, or ask the person who invited you to send it again.'); return; }
        say('This link does not work', esc((d && d.message) || 'Open the link from your email again.')); return;
      }
      if (d.state === 'pending') { showPending(); return; }
      if (d.state === 'accepted') { showAccepted(); return; }
      ended();
    })
    .catch(function(){ say('Could not reach the server', 'Try again in a moment.'); });
})();
</script>
<script src="/nav/topbar.js?v=7.11" defer></script>
</body>
</html>
