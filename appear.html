<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1B6896; --primary-dark: #154F74; --primary-light: #E8F2F9;
    --green: #4CAF7D; --light: #F5F7FA; --border: #DCE3EA;
    --dark: #2C3A47; --muted: #6B7C8D; --white: #FFFFFF;
  }
  body { font-family: 'Nunito Sans','Segoe UI',sans-serif; background:var(--light); color:var(--dark); }

  .header { background:var(--primary); padding:14px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .logo { font-size:22px; font-weight:800; color:white; letter-spacing:-0.3px; }
  .logo span { color:#fff; font-weight:400; }
  .tagline { font-size:11px; color:rgba(255,255,255,0.7); text-transform:uppercase; letter-spacing:.05em; }
  .header-right { margin-left:auto; }

  .btn { display:inline-block; background:var(--primary); color:white; border:none; border-radius:8px; padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; white-space:nowrap; text-decoration:none; }
  .btn:hover { background:var(--primary-dark); }
  .btn-outline { background:var(--white); color:var(--dark); border:1.5px solid var(--border); }
  .btn-outline:hover { background:var(--light); }
  .btn-sm { padding:8px 14px; font-size:13px; }
  .btn-white { background:rgba(255,255,255,.95); color:var(--primary-dark); }
  .btn-white:hover { background:white; }

  .input { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:11px 16px; font-size:15px; font-family:inherit; color:var(--dark); background:var(--white); outline:none; transition:border-color .15s; }
  .input:focus { border-color:var(--primary); }

  .page-body { max-width:1200px; margin:0 auto; padding:24px 20px; width:100%; box-sizing:border-box; min-height:100vh; }
  .embed-mode .page-body { padding-top:8px; }
  .embed-mode .header { display:none; }
  .page-title-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .page-title { font-size:28px; font-weight:800; }
  .page-sub { color:var(--muted); font-size:15px; margin-top:4px; }

  .filter-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-search { flex:1; min-width:200px; border:1.5px solid var(--border); border-radius:8px; padding:9px 14px; font-size:14px; font-family:inherit; color:var(--dark); background:var(--white); outline:none; }
  .filter-search:focus { border-color:var(--primary); }

  .cat-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .cat-pill { background:var(--white); border:1.5px solid var(--border); border-radius:20px; padding:5px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--muted); transition:all .15s; white-space:nowrap; }
  .cat-pill:hover { border-color:var(--primary); color:var(--primary); }
  .cat-pill.active { background:#154F74; border-color:#154F74; color:white; }

  .event-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .event-card { background:var(--white); border-radius:12px; border:1px solid var(--border); box-shadow:0 2px 6px rgba(0,0,0,.05); overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .15s,transform .15s; }
  .event-card:hover { box-shadow:0 6px 18px rgba(0,0,0,.1); transform:translateY(-2px); }

  
.event-card-img { overflow:hidden; border-radius:0; margin:0; transition: height 0.3s ease; }
.event-card-img img { transition: height 0.3s ease; }
.event-card-top + .event-card-img { border-top:1px solid var(--border); }

.event-card-top { padding:16px 18px 12px; border-bottom:1px solid var(--border); }
  .event-title { font-size:15px; font-weight:800; line-height:1.3; margin-bottom:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .event-cats { display:flex; gap:6px; flex-wrap:wrap; }
  .event-cat-tag { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--primary); background:var(--primary-light); padding:3px 8px; border-radius:10px; }

  .event-card-body { padding:14px 18px; flex:1; }
  .event-meta { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .event-meta-item { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); }
  .event-desc { font-size:14px; color:var(--muted); line-height:1.5; }

  .event-card-footer { padding:12px 18px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }

  .loading-bar { display:none; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--primary), var(--green)); z-index:9999; animation: loadpulse 1s ease-in-out infinite; }
  @keyframes loadpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .format-chip { background:var(--white); border:1.5px solid var(--border); border-radius:20px; padding:6px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--muted); transition:all .15s; white-space:nowrap; }
  .format-chip:hover { border-color:var(--primary); color:var(--primary); }
  .format-chip.active { background:#154F74; border-color:#154F74; color:white; }

  .empty-icon { font-size:48px; margin-bottom:16px; }
  .empty-title { font-size:18px; font-weight:700; margin-bottom:8px; color:var(--dark); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--dark); color:white; padding:12px 24px; border-radius:10px; font-weight:700; font-size:14px; transition:transform .3s; z-index:200; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }

  @media(max-width:768px) {
    .header { padding:12px 16px; gap:8px; }
    .header-right { display:flex; gap:8px; flex-wrap:wrap; }
    .page-body { padding:16px 12px; }
    .event-grid { grid-template-columns:1fr; gap:12px; }
    .filter-row { flex-direction:column; gap:8px; }
    .filter-search { width:100%; min-width:unset; box-sizing:border-box; }
    .cat-pills { gap:6px; margin-bottom:16px; }
    .event-card-footer { flex-direction:column; align-items:flex-start; gap:8px; }
    .btn-sm { font-size:12px; padding:6px 10px; }
  }
  @media(max-width:420px) {
    .event-title { font-size:15px; }
    .btn { font-size:13px; padding:9px 14px; }
    .event-grid { gap:10px; }
    .format-chip { font-size:12px; padding:6px 12px; }
  }
  @media(min-width:1024px) {
    .page-body { padding:32px 40px; }
    .event-grid { grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
  }
  @media(min-width:1400px) {
    .event-grid { grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

<script>
const CATEGORIES = [
  { id:"arts",         label:"Arts/culture",             emoji:"🎭", room:"Co-Create room",     extraRooms:["Coworking room"] },
  { id:"movement",     label:"Physical health/wellness",          emoji:"🏓", room:"Wellness room",       extraRooms:["Coworking room"] },
  { id:"learning",     label:"Learning/discovery",       emoji:"🌱", room:"Co-create room",     extraRooms:["Ikigai room","Coworking room"] },
  { id:"nature",       label:"Nature/outdoors",          emoji:"🌲", room:"Coworking room" },
  { id:"professional", label:"Work/skills",          emoji:"💼", room:"Conference room",     extraRooms:["Coworking room"] },
  { id:"creative",     label:"Creative making",          emoji:"🎨", room:"Co-Create room",     extraRooms:["Coworking room"] },
  { id:"faith",        label:"Inner life",               emoji:"💙", room:"Wellness room",       extraRooms:["Coworking room"] },
  { id:"resources",    label:"Resource sharing",         emoji:"🔧", room:"The Commons",         extraRooms:["Coworking room"] },
  { id:"care",         label:"Mental health/wellness", emoji:"💛", room:"Wellness room",     extraRooms:["Coworking room"] },
  { id:"social",       label:"Social gathering",         emoji:"🎉", room:"The Commons",         extraRooms:["Coworking room"] },
  { id:"family",       label:"Family/caregiving/home",    emoji:"🏡", room:"Community Care room", extraRooms:["Coworking room"] },
  { id:"food",         label:"Food/drink",               emoji:"🥘", room:"The Commons",         extraRooms:["Coworking room"] },
  { id:"wealth",       label:"Wealth/abundance",      emoji:"🌳", room:"Abundance room",      extraRooms:["Coworking room"] },
];

const ROOMS = [
  { name:"The Commons",         emoji:"🌳", url:"https://events.2gather.network/events/yvrgej/zkxbzq" },
  { name:"Ikigai room",         emoji:"🧭", url:"https://events.2gather.network/events/eojvkq/qwmpgq" },
  { name:"Wellness room",       emoji:"💛", url:"https://events.2gather.network/events/336936/504368" },
  { name:"Community Care room", emoji:"💜", url:"https://events.2gather.network/events/yvrgej/gypxbp" },
  { name:"Co-Create room",      emoji:"🎨", url:"https://events.2gather.network/events/yvrgej/rwbplq" },
  { name:"Coworking room",      emoji:"💻", url:"https://events.2gather.network/events/yvrgej/gpbqox" },
  { name:"Abundance room",      emoji:"🌻", url:"", comingSoon: true },
  { name:"Conference room",     emoji:"🎤", url:"https://events.2gather.network/events/335887/502618" },
];

let RECURRING_EVENTS = [];

let events = [];
let isLoadingData = true;
let activeFilter = "all";
let activeTab    = "upcoming";
let activeDateFilter = "upcoming";
let activeMode   = "all";

const GS_URL = "https://cw-api-gate.jessieupp.workers.dev";

function parseSheetDate(val) {
  if (!val) return "";
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (s.includes("T")) return s.split("T")[0];
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  return s;
}

function parseSheetTime(val) {
  if (!val) return "";
  const s = String(val);
  if (/^\d{2}:\d{2}$/.test(s)) return s;
  if (s.includes("T")) { const t = s.split("T")[1]; return t.substring(0,5); }
  return s;
}

function sheetToEv(row) {
  const isRecurring = String(row.id).startsWith("rec-") || !!(row.recurFreq);
  return {
    id: String(row.id||""), title: row.title||"",
    categories: row.categories ? String(row.categories).split(",").filter(Boolean) : [],
    date: parseSheetDate(row.date), time: parseSheetTime(row.startTime), endtime: parseSheetTime(row.endTime),
    dayOfWeek: parseInt(row.dayOfWeek) || 0,
    format: row.format||"", location: row.location||"", lat: row.lat||"", lng: row.lng||"",
    room: row.room||"", description: row.description||"", host: row.host||"",
    hostlink: row.hostlink||"", contactEmail: row.contactEmail||"", contactPhone: row.contactPhone||"",
    passcode: row.passcode||"", cooplink: row.cooplink||"", going: parseInt(row.going)||0,
    meetinglink: row.meetinglink||"", recurring: isRecurring, recurFreq: row.recurFreq||"", experience: row.experience||"", imageUrl: row.imageUrl||"",
    cancelled: row.cancelled==="true"||row.cancelled===true||false,
  };
}

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    let settled = false;
    const done = (fn) => { if (settled) return; settled = true; delete window[cbName]; try { script.remove(); } catch(e) {} fn(); };
    const timeout = setTimeout(() => done(() => reject(new Error("JSONP timeout"))), 20000);
    window[cbName] = (data) => { clearTimeout(timeout); done(() => resolve(data)); };
    const qs = Object.entries(params)
      .map(([k,v]) => `${encodeURIComponent(k)}=${encodeURIComponent(typeof v==="object"?JSON.stringify(v):v)}`).join("&");
    const script = document.createElement("script");
    script.src = GS_URL + "?" + qs + "&callback=" + cbName;
    script.onerror = () => {};
    document.head.appendChild(script);
  });
}

// recurring overrides via sheet

async function loadEvents() {
  try {
    showLoading(true);
    events = [];
    renderEvents();
  // Deep link: open event from URL param
  const urlParams = new URLSearchParams(window.location.search);
  const evParam = urlParams.get("event");
  if (evParam) { setTimeout(() => openEventById(evParam), 400); }

    const data = await jsonp({ t: Date.now() });
    const allRows = (data.events||[]).filter(r => r.id).map(sheetToEv);
    RECURRING_EVENTS = allRows.filter(e => e.id.startsWith("rec-") && e.recurFreq && e.dayOfWeek);
    events = allRows.filter(e => !e.id.startsWith("rec-"));
  } catch(e) {
    console.warn("Events load failed, retrying...", e);
    try {
      await new Promise(r => setTimeout(r, 2000));
      const data = await jsonp({ t: Date.now() });
      const allRows = (data.events||[]).filter(r => r.id).map(sheetToEv);
      RECURRING_EVENTS = allRows.filter(e => e.id.startsWith("rec-") && e.recurFreq && e.dayOfWeek);
      events = allRows.filter(e => !e.id.startsWith("rec-"));
    } catch(e2) {
      console.warn("Events retry also failed - showing recurring events only", e2);
      const bar = document.getElementById("loading-bar");
      if (bar) {
        bar.style.cssText = "display:block;background:#FFF8E7;border:1.5px solid #F0B429;border-radius:10px;padding:12px 16px;font-size:13px;color:#7B5800;text-align:center;margin-bottom:14px;";
        bar.innerHTML = "⚠️ Having trouble loading events? Try disabling your browser\'s ad blocker or shields for this page.";
      }
    }
  } finally {
    isLoadingData = false;
    showLoading(false);
    populateHostFilter();
    renderEvents();
    checkEventLink();
  }
}

function populateHostFilter() {
  const sel = document.getElementById("host-filter");
  if (!sel) return;
  const current = sel.value;
  const hosts = [...new Set(events.map(e => e.host).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All hosts</option>';
  hosts.forEach(h => {
    const opt = document.createElement("option");
    opt.value = h; opt.textContent = h;
    if (h === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function showLoading(on) {
  const el = document.getElementById("loading-bar");
  if (el) el.style.display = on ? "block" : "none";
}

function renderPills() {
  const c = document.getElementById("cat-pills");
  c.innerHTML = "";
  c.appendChild(makeFilterBtn("All categories", activeFilter === "all", () => setFilter("all")));
  CATEGORIES.forEach(cat => c.appendChild(makeFilterBtn(`${cat.emoji} ${cat.label}`, activeFilter === cat.id, () => setFilter(cat.id))));
}
function makeFilterBtn(text, isActive, onClick) {
  const b = document.createElement("button");
  b.className = "cat-pill" + (isActive ? " active" : "");
  b.textContent = text; b.onclick = onClick;
  return b;
}
function resetFilters() {
  document.getElementById("search-input").value = "";
  document.getElementById("host-filter").value = "";
  setFilter("all");
  setDateFilter("upcoming");
  setMode("all");
  const stateEl = document.getElementById("filter-state");
  if (stateEl) stateEl.value = "Washington";
}

function setFilter(id) { activeFilter = id; localStorage.setItem("db-filter", id); renderPills(); renderEvents(); }

function renderEvents() {
  const evPageBase = window.location.href.replace(/\/[^/]*(\?.*)?$/, "/");
  const grid = document.getElementById("event-grid");
  const q    = document.getElementById("search-input").value.toLowerCase();
  const now  = Date.now();

  const publicRec = getPublicRecurring(2);
  const allEvents = [...events, ...publicRec];

  // v2.79: skip occ-note-, cancelled-, and stale sheet rows from card display
  const _templateTitles = new Set(RECURRING_EVENTS.map(r => r.title.toLowerCase()));
  let list = allEvents.filter(e => {
    if (e.id.startsWith("occ-note-")) return false;
    if (e.id.startsWith("cancelled-recurring-")) return false;
    if (e.recurFreq && !e.id.startsWith("recurring-") && _templateTitles.has((e.title||"").toLowerCase())) return false;
    return !e.isPrivate;
  }).filter(e => {
    let cats = Array.isArray(e.categories) ? e.categories : [e.category].filter(Boolean);
    cats = cats.map(c => {
      const byId = CATEGORIES.find(cat => cat.id === c); if (byId) return c;
      const byLabel = CATEGORIES.find(cat => cat.label.toLowerCase() === c.toLowerCase()); if (byLabel) return byLabel.id;
      const partial = CATEGORIES.find(cat => cat.label.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(cat.id.toLowerCase()));
      return partial ? partial.id : c;
    });
    const matchCat  = activeFilter === "all" || cats.includes(activeFilter);
    const matchQ    = !q || e.title.toLowerCase().includes(q) || (e.description||"").toLowerCase().includes(q) || (e.location||"").toLowerCase().includes(q) || (e.host||"").toLowerCase().includes(q);
    const evEndMs   = e.endtime ? new Date(e.date + "T" + e.endtime).getTime() : new Date(e.date + "T" + (e.time||"00:00")).getTime() + 60*60*1000;
    const evStartMs = new Date(e.date + "T" + (e.time||"00:00")).getTime();
    const isPast    = evEndMs < now;
    const matchTab  = activeTab === "past" ? isPast : !isPast;
    const MS_WEEK = 7*24*60*60*1000, MS_MONTH = 30*24*60*60*1000, MS_QUARTER = 91*24*60*60*1000;
    let matchDate = true;
    if (activeDateFilter === "week")           matchDate = evStartMs >= now && evStartMs <= now + MS_WEEK;

    else if (activeDateFilter === "past-week") matchDate = evEndMs >= now - MS_WEEK && evEndMs < now;

    const effectiveMatchTab = activeHost ? true : matchTab;

  });

    const da = new Date(a.date+"T"+(a.time||"00:00")).getTime();

function openEventView(id, title) {
  // ABSOLUTE, not derived. Deriving it from window.location broke on a trailing slash: from
  // /events it built /event.html (200) and from /events/ it built /events/event.html (404),
  // and mygroups links to /events/ WITH the slash. A member hit it on 2026-09-04 and thought
  // it was her own company's security. Every other cross-page link on this site is absolute.
  const base = "https://2gather.network/";
  const url = base + "event.html?id=" + encodeURIComponent(id);
  document.getElementById("event-view-frame").src = url;
  document.getElementById("event-view-share-url").value = url;
  document.getElementById("event-view-title").textContent = title || "";
  const isGlide = window.self !== window.top;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const modalHeight = isGlide ? vh - 100 : vh - 90;
  const inner = document.getElementById("event-view-inner");
  if (inner) inner.style.height = modalHeight + "px";
  const m = document.getElementById("event-view-modal");
  m.style.display = "flex";
}

function shareEventModal() {

  } else {
    navigator.clipboard?.writeText(url).then(() => showToast("🔗 Link copied!")).catch(() => prompt("Copy this link:", url));

function shareEvent(id) {
  const allEv = [...(typeof events !== "undefined" ? events : []), ...(typeof getAllRecurring === "function" ? getAllRecurring(2) : [])];
  const ev = allEv.find(e => e.id === id);
  if (!ev) return;
  // ABSOLUTE, like openEventView above. Derived from window.location this built
  // /events/event.html from the page with a trailing slash, so Share handed out a link that
  // 404d for whoever received it. The click was fixed on 2026-09-04 and these three Share
  // functions were missed. Jessie found it on 2026-09-05.
  const url = "https://2gather.network/event.html?id=" + encodeURIComponent(id);
  const copyFallback = () => navigator.clipboard?.writeText(url).then(() => showToast("🔗 Link copied!")).catch(() => prompt("Copy this link:", url));
  const isGlide = /glide/i.test(navigator.userAgent) || window.self !== window.top;
  if (!isGlide && navigator.share) {
    navigator.share({ title: ev.title, text: (ev.description || "").slice(0, 100) || ev.title, url })
      .catch(err => { if (err.name !== "AbortError") copyFallback(); });
  } else {
    copyFallback();
  }
}

function addToCalendar(id) {
  const allEv = [...events, ...getAllRecurring(2)];
  const ev = allEv.find(e => e.id === id);
  if (!ev || !ev.date) return;
  function toCalDT(date, time) { const t = time||"00:00"; return date.replace(/-/g,"")+  "T"+t.replace(":","")+"00"; }
  const start = toCalDT(ev.date, ev.time);
  const end   = toCalDT(ev.date, ev.endtime||ev.time);
  const roomObj = ROOMS.find(r => r.name === ev.room);
  const location = ev.format === "virtual" ? (roomObj ? roomObj.url : "Virtual") : (ev.location||"");
  const details = [ev.description||"", roomObj ? "Room: "+roomObj.url : "", ev.cooplink ? "Group link: "+ev.cooplink : "", "\nHosted by "+ev.host, ev.contactEmail ? "Email: "+ev.contactEmail : "", ev.contactPhone ? "Phone: "+ev.contactPhone : ""].filter(Boolean).join("\n\n");
  const RRULE_MAP = { "kickoff-001":"RRULE:FREQ=WEEKLY;BYDAY=MO", "onboarding-001":"RRULE:FREQ=WEEKLY;BYDAY=MO", "ikigai-001":"RRULE:FREQ=WEEKLY;BYDAY=TU", "monday kickoff":"RRULE:FREQ=WEEKLY;BYDAY=MO", "daybalancer onboarding":"RRULE:FREQ=WEEKLY;BYDAY=MO", "ikigai tuesdays":"RRULE:FREQ=WEEKLY;BYDAY=TU" };
  const titleKey = (ev.title||"").toLowerCase().trim();
  const rrule = RRULE_MAP[id] || Object.entries(RRULE_MAP).find(([k]) => titleKey.includes(k))?.[1];
  const params = new URLSearchParams({ text:ev.title, dates:start+"/"+end, details, location });
  if (ev.recurFreq === "weekly") {
    const day = ["SU","MO","TU","WE","TH","FR","SA"][new Date(ev.date+"T12:00").getDay()];
    params.append("recur", "RRULE:FREQ=WEEKLY;BYDAY="+day);
  } else if (ev.recurFreq === "monthly") {
    params.append("recur", "RRULE:FREQ=MONTHLY");
  } else if (ev.recurring && rrule) {
    params.append("recur", rrule);
  }
  window.open("https://calendar.google.com/calendar/r/eventedit?"+params.toString(), "_blank");
}

function useMyLocation() {
  const btn = document.getElementById("geo-btn");
  btn.textContent = "📍 Detecting..."; btn.disabled = true;
  if (!navigator.geolocation) { btn.textContent = "📍 Not supported"; btn.disabled = false; return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=en`)
        .then(r => r.json()).then(data => {
          const addr = data.address || {};
          const city = addr.city||addr.town||addr.village||""; const state = addr.state||""; const country = addr.country||"";
          const regionEl = document.getElementById("filter-region");
          if (["United States","Canada","Mexico"].some(c => country.includes(c)||c.includes(country))) regionEl.value = "North America";
          else if (["Brazil","Argentina","Colombia","Chile","Peru"].some(c => country.includes(c))) regionEl.value = "South America";
          else if (["United Kingdom","France","Germany","Spain","Italy","Netherlands"].some(c => country.includes(c))) regionEl.value = "Europe";
          else if (["China","Japan","India","South Korea","Indonesia"].some(c => country.includes(c))) regionEl.value = "Asia";
          else if (["Nigeria","Kenya","South Africa","Ethiopia","Ghana"].some(c => country.includes(c))) regionEl.value = "Africa";
          else if (["Australia","New Zealand","Papua New Guinea"].some(c => country.includes(c))) regionEl.value = "Oceania";
          onRegionChange();
          const countEl = document.getElementById("filter-country");
          if (country.includes("United States")||country.includes("USA")) {
            countEl.value = "United States"; onCountryChange();
            if (state) { const match = US_STATES.find(s => s.toLowerCase()===state.toLowerCase()); if (match) document.getElementById("filter-state").value = match; }
          } else if (country.includes("Canada")) countEl.value = "Canada";
          else if (country.includes("Mexico")) countEl.value = "Mexico";
          renderEvents();
          btn.textContent = `📍 ${[city,state].filter(Boolean).join(", ")||country||"Location set"}`; btn.disabled = false;
        }).catch(() => { btn.textContent = "📍 Try again"; btn.disabled = false; alert("Location detected but couldn't look up your city. Please select manually."); });
    },
    err => {
      btn.disabled = false;
      if (err.code === 1) { btn.textContent = "📍 Permission denied"; alert("Location access was blocked. Please allow location in your browser settings, or select manually."); }
      else { btn.textContent = "📍 Use my location"; alert("Could not detect your location. Please select manually."); }
    }, { timeout:10000 }
  );
}

function getNextOccurrences(template, count) {
  const results = [];
  const now = new Date();
  const d   = new Date();
  d.setHours(0,0,0,0);
  let daysUntil = (template.dayOfWeek - d.getDay() + 7) % 7;
  if (daysUntil === 0) {
    const [endH,endM] = (template.endtime||template.time).split(":").map(Number);
    const endToday = new Date(); endToday.setHours(endH,endM,0,0);
    if (now > endToday) daysUntil = 7;
  }
  d.setDate(d.getDate() + daysUntil);
  for (let i = 0; i < count; i++) {
    const dateStr = d.toISOString().split("T")[0];
    const slug    = template.title.toLowerCase().replace(/\s+/g,"-");
    results.push({ ...template, id:`recurring-${slug}-${dateStr}`, date:dateStr, passcode:"", going:0, recurring:true });
    d.setDate(d.getDate() + 7);
  }
  return results;
}

function getAllRecurring(count = 2) { return RECURRING_EVENTS.flatMap(t => getNextOccurrences(t, count)); }

function getPublicRecurring(count = 2) {
  const generated = RECURRING_EVENTS.filter(t => !t.adminOnly).flatMap(t => getNextOccurrences(t, count));
  const realEvents = events.filter(e => !e.id.startsWith("rec-") && !e.id.startsWith("occ-note-") && !e.id.startsWith("cancelled-"));
  // V12.82: only dedupe by room|date|time when a real room is set, so a blank-room in-person event
  // does not hide an unrelated generated recurring occurrence at the same date+time. Title+date still
  // catches a genuine repost of the same event. (Mirrors the fix in events.html.)
  const seen = new Set(realEvents.filter(e => e.room).map(e => `${e.room}|${e.date}|${e.time}`));
  const seenTitleDate = new Set(realEvents.map(e => `${(e.title||"").toLowerCase()}|${e.date}`));
  return generated.filter(rec => !(rec.room && seen.has(`${rec.room}|${rec.date}|${rec.time}`)) && !seenTitleDate.has(`${(rec.title||"").toLowerCase()}|${rec.date}`));
}

function fmtDate(date, time, endtime) {
  if (!date) return "Date TBD";
  const d  = new Date(date+"T"+(time||"00:00"));
  const ds = d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  if (!time) return ds;
  const tz = d.toLocaleTimeString("en-US",{timeZoneName:"short"}).split(" ").pop();
  const ts = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  if (!endtime) return ds + " · " + ts + " " + tz;
  const te = new Date(date+"T"+endtime).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  return ds + " · " + ts + " - " + te + " " + tz;
}
function escNl(s) { return esc(s).replace(/\n/g, "<br>"); }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function trunc(s,n) { return s.length > n ? s.slice(0,n)+"…" : s; }
function parseCityState(location) {
  if (!location) return "";
  const parts = location.split(",").map(s => s.trim()).filter(Boolean);
  if (parts.length < 2) return "";
  const lastPart = parts[parts.length - 1];
  const city = parts[parts.length - 2];
  const stateMatch = lastPart.match(/^([A-Z]{2})\b/);
  return stateMatch ? city + ", " + stateMatch[1] : "";
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Init ──────────────────────────────────────
if (new URLSearchParams(window.location.search).get("embed") === "1") {
  document.body.classList.add("embed-mode");
}

const savedFilter = localStorage.getItem("db-filter");
const savedMode   = localStorage.getItem("db-mode");
if (savedFilter) activeFilter = savedFilter;

renderPills();
// FIX: call setMode() to restore button visual state, not just the variable
setMode(savedMode === 'virtual' ? 'all' : (savedMode || activeMode));
loadEvents();

</script>
