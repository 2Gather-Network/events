<!-- Version: V1.00 | Date: 2026-08-26 | LAST CHANGE: the toggle is real, and who is here opens in place. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="The Commons · 2Gather">
<title>The Commons · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--brand);color:#fff;display:flex;flex-direction:column;
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}

  .head{padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .head .who{flex:1;min-width:240px;}
  .head h1{font-size:17px;font-weight:800;margin:0 0 3px;}
  .head p{font-size:13.5px;color:rgba(255,255,255,.82);margin:0;line-height:1.5;}
  .count{font-size:13.5px;color:rgba(255,255,255,.82);}

  .toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;}
  .track{width:52px;height:30px;border-radius:20px;background:rgba(255,255,255,.28);position:relative;
         transition:background .15s;flex-shrink:0;}
  .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
        transition:left .15s;}
  .toggle.on .track{background:#E8B21F;}
  .toggle.on .knob{left:25px;}

  .count{font-size:13.5px;color:rgba(255,255,255,.85);}
  .seewho{background:#fff;color:var(--brand);font-size:14px;font-weight:700;padding:9px 18px;
          border-radius:22px;cursor:pointer;white-space:nowrap;border:0;font-family:inherit;}
  .seewho[disabled]{opacity:.5;cursor:default;}

  /* Who is here, opening in place under the header rather than over the room. */
  .here{display:none;background:#fff;border-top:1px solid var(--line);padding:16px 20px 18px;}
  .here.open{display:block;}
  .here h2{font-size:15px;font-weight:800;margin:0 0 12px;}
  .faces{display:flex;gap:14px;flex-wrap:wrap;}
  .who{width:96px;text-align:center;}
  .who img{width:72px;height:72px;border-radius:12px;object-fit:cover;display:block;margin:0 auto 6px;}
  .who .nm{font-size:13px;font-weight:700;line-height:1.3;}
  .none{font-size:14px;color:var(--soft);margin:0;}

  .stage{flex:1;min-height:0;background:#fff;display:flex;flex-direction:column;}
  iframe{flex:1;width:100%;border:0;min-height:520px;display:block;}

  .foot{background:#fff;border-top:1px solid var(--line);padding:11px 20px;color:var(--soft);
        font-size:13px;line-height:1.55;}
  .foot a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none;}
  @media(max-width:700px){ iframe{min-height:420px;} }
</style>
</head>
<body>

<div class="head">
  <div class="who">
    <h1>Show up as available</h1>
    <p>Say you are here and open to talking. Turn it off when you are not.</p>
  </div>
  <span class="toggle" id="avail" role="switch" aria-checked="false" tabindex="0">
    <span class="track"><span class="knob"></span></span>
  </span>
  <span class="count" id="count">Nobody has said they are available.</span>
  <button class="seewho" id="seewho">See who is in the commons</button>
</div>

<div class="here" id="here">
  <h2 id="here-title">Who is in the commons</h2>
  <div class="faces" id="faces"></div>
</div>

<div class="stage">
  <iframe id="room"
          title="The Commons"
          allow="camera; microphone; display-capture; autoplay; fullscreen"
          allowfullscreen
          src="https://events.2gather.network/events/yvrgej/zkxbzq"></iframe>
</div>

<div class="foot">
  Needs support?
  <a role="link" tabindex="0" data-nav="https://2gather.network/support"
     onclick="return _safeNavGo(this)">Tell us here</a>
</div>

<script>
window._safeNavGo = window._safeNavGo || function (el) {
  try { var u = el && el.getAttribute && el.getAttribute('data-nav'); if (u) { window.location.href = u; } }
  catch (e) {}
  return false;
};
(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var ROOM = 'commons';

  function me() {
    try {
      var p = new URLSearchParams(location.search);
      var u = p.get('CWid') || p.get('memberCard') || p.get('me') || '';
      if (u) return u.trim();
      return String(window.CW_ID || localStorage.getItem('cw-id') ||
                    localStorage.getItem('appear-id') || '').trim();
    } catch (e) { return ''; }
  }

  var t = document.getElementById('avail');
  var count = document.getElementById('count');
  var here = document.getElementById('here');
  var faces = document.getElementById('faces');
  var beat = null;

  function say(n) {
    count.textContent = !n ? 'Nobody has said they are available.'
      : (n === 1 ? '1 person is available in the commons.'
                 : n + ' people are available in the commons.');
  }

  function tell(on) {
    var who = me();
    if (!who) return;
    fetch(GS_URL + '?action=setPresence&userID=' + encodeURIComponent(who) +
          '&groupId=' + encodeURIComponent(ROOM) + '&available=' + (on ? 'true' : 'false'))
      .then(function () { load(); })
      .catch(function () {});
  }

  function load() {
    fetch(GS_URL + '?action=getPresence&groupId=' + encodeURIComponent(ROOM))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = (d && d.people) || [];
        say(list.length);
        var html = '';
        for (var i = 0; i < list.length; i++) {
          var p = list[i];
          html += '<div class="who">' +
                  (p.photo ? '<img src="' + p.photo + '" alt="">' : '') +
                  '<div class="nm">' + (p.name || p.first || 'Someone') + '</div></div>';
        }
        faces.innerHTML = html || '<p class="none">Nobody is here just now. Turn yourself on above and somebody will find you.</p>';
      })
      .catch(function () {
        count.textContent = 'Who is here cannot load yet. The presence actions are not in the script.';
      });
  }

  function flip() {
    var on = t.className.indexOf('on') === -1;
    t.className = on ? 'toggle on' : 'toggle';
    t.setAttribute('aria-checked', on ? 'true' : 'false');
    tell(on);
    // While somebody says they are available we say so every two minutes, so a closed
    // tab drops off by itself rather than leaving a ghost in the room.
    if (beat) { clearInterval(beat); beat = null; }
    if (on) { beat = setInterval(function () { tell(true); }, 120000); }
  }

  t.addEventListener('click', flip);
  t.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });

  document.getElementById('seewho').addEventListener('click', function () {
    here.className = here.className.indexOf('open') > -1 ? 'here' : 'here open';
    if (here.className.indexOf('open') > -1) { load(); }
  });

  load();
  setInterval(load, 60000);
})();
</script>
<script src="https://2gather.network/nav/topbar.js?v=5.31" defer></script>
</body>
