<!-- Version: V1.00 | Date: 2026-08-26 | LAST CHANGE: the chevron sits under the button, and the toggle takes the button's yellow. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="The Commons · 2Gather">
<title>The Commons · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--brand);color:#fff;display:flex;flex-direction:column;
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}

  .head{padding:18px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .head .said{flex:1;min-width:260px;}
  .head h1{font-size:16px;font-weight:800;margin:0 0 4px;}
  .head p{font-size:14px;color:rgba(255,255,255,.82);margin:0;line-height:1.5;}
  .count{font-size:14px;color:rgba(255,255,255,.9);}

  .toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;}
  .track{width:56px;height:32px;border-radius:20px;background:transparent;position:relative;
         transition:background .15s;flex-shrink:0;box-shadow:inset 0 0 0 2px #fff;}
  .knob{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;
        transition:left .15s;}
  .toggle.on .track{background:#FFCC4D;box-shadow:inset 0 0 0 2px #FFCC4D;}
  .toggle.on .knob{left:28px;}

  .count{font-size:13.5px;color:rgba(255,255,255,.85);}
  .seewho{background:#fff;color:var(--brand);font-size:15px;font-weight:700;padding:11px 22px;
          border-radius:26px;cursor:pointer;white-space:nowrap;border:0;font-family:inherit;}
  .seewho[disabled]{opacity:.5;cursor:default;}

  /* Who is here, opening in place under the header rather than over the room. */
  .here{display:none;background:#fff;border-top:1px solid var(--line);padding:10px 20px 12px;}
  .here.open{display:block;}
  .here h2{display:none;}
  .faces{display:flex;gap:10px;flex-wrap:wrap;}
  .who{width:70px;text-align:center;text-decoration:none;color:var(--ink);cursor:pointer;display:block;}
  .who img{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block;margin:0 auto 5px;}
  .who .nm{font-size:12px;font-weight:700;line-height:1.25;}
  .who:hover .nm{color:var(--brand);}
  .none{font-size:14px;color:var(--soft);margin:4px 0;}
  .note{font-size:13.5px;color:var(--soft);margin:12px 0 0;line-height:1.5;}
  .fold{display:none;width:30px;height:30px;border-radius:50%;background:#fff;border:0;padding:0;
        cursor:pointer;align-items:center;justify-content:center;color:var(--brand);
        box-shadow:0 2px 6px rgba(15,45,70,.25);margin:-15px auto -15px;position:relative;z-index:3;}
  .fold.show{display:flex;}
  .fold svg{transition:transform .15s;}
  .fold.open svg{transform:rotate(180deg);}

  .stage{flex:1;min-height:0;background:#fff;display:flex;flex-direction:column;}
  iframe{flex:1;width:100%;border:0;min-height:520px;display:block;}

  .foot{background:#fff;border-top:1px solid var(--line);padding:11px 20px;color:var(--soft);
        font-size:13px;line-height:1.55;}
  .foot a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none;}
  @media(max-width:700px){ iframe{min-height:420px;} }
</style>
</head>
<body>

<div class="head">
  <div class="said">
    <h1>Show up as available 🟡</h1>
    <p>Enable to say you're available to connect. Disable to say you're no longer available.</p>
  </div>
  <span class="toggle" id="avail" role="switch" aria-checked="false" tabindex="0">
    <span class="track"><span class="knob"></span></span>
  </span>
  <div class="right">
    <span class="count" id="count">0 available in commons</span>
    <button class="seewho" id="seewho" style="display:none;">🟡 See who's in the commons</button>
  </div>
</div>

<button class="fold" id="fold" aria-label="Show or hide who is here">
  <svg width="13" height="9" viewBox="0 0 11 7" fill="none" aria-hidden="true"><path d="M1 1.5L5.5 5.5L10 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<div class="here" id="here">
  <div class="faces" id="faces"></div>
  <p class="note" id="here-note">No need to login - just share your name 🎯 Unmute your mic below.</p>
</div>

<div class="stage">
  <iframe id="room"
          title="The Commons"
          allow="camera; microphone; display-capture; autoplay; fullscreen"
          allowfullscreen
          src="https://events.2gather.network/events/yvrgej/zkxbzq"></iframe>
</div>

<div class="foot">
  Needs support?
  <a role="link" tabindex="0" data-nav="https://2gather.network/support"
     onclick="return _safeNavGo(this)">Tell us here</a>
</div>

<script>
window._safeNavGo = window._safeNavGo || function (el) {
  try { var u = el && el.getAttribute && el.getAttribute('data-nav'); if (u) { window.location.href = u; } }
  catch (e) {}
  return false;
};
(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var ROOM = 'commons';

  function me() {
    try {
      var p = new URLSearchParams(location.search);
      var u = p.get('CWid') || p.get('memberCard') || p.get('me') || '';
      if (u) return u.trim();
      return String(window.CW_ID || localStorage.getItem('cw-id') ||
                    localStorage.getItem('appear-id') || '').trim();
    } catch (e) { return ''; }
  }

  var t = document.getElementById('avail');
  var count = document.getElementById('count');
  var here = document.getElementById('here');
  var faces = document.getElementById('faces');
  var beat = null;

  function say(n) {
    // The count lives in the button once there is somebody to see. An empty room has no
    // button, so the plain line carries it instead.
    var b = document.getElementById('seewho');
    var label = n + (n === 1 ? ' available in the commons' : ' available in the commons');
    count.textContent = n ? '' : '0 available in commons';
    count.style.display = n ? 'none' : 'inline';
    if (b) {
      b.style.display = n ? 'inline-flex' : 'none';
      b.textContent = '\uD83D\uDFE1 ' + label;
      var f = document.getElementById('fold');
      if (f) {
        f.className = n ? (here.className.indexOf('open') > -1 ? 'fold show open' : 'fold show') : 'fold';
      }
      if (!n) { here.className = 'here'; }
    }
  }

  function tell(on) {
    var who = me();
    if (!who) return;
    fetch(GS_URL + '?action=setPresence&userID=' + encodeURIComponent(who) +
          '&groupId=' + encodeURIComponent(ROOM) + '&available=' + (on ? 'true' : 'false'))
      .then(function () { load(); })
      .catch(function () {});
  }

  function load() {
    fetch(GS_URL + '?action=getPresence&groupId=' + encodeURIComponent(ROOM))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = (d && d.people) || [];
        say(list.length);
        var html = '', viewer = me();
        for (var i = 0; i < list.length; i++) {
          var p = list[i];
          // Their profile, as anybody sees it. show is who is being looked at, me is who is looking.
          // Your own profile needs no id in the link, because the device already knows you.
          var mine = viewer && String(p.appearId).split('.').join('').toLowerCase() ===
                     String(viewer).split('.').join('').toLowerCase();
          var to = mine ? 'https://creating.works/profile'
                        : 'https://creating.works/profile?show=' + encodeURIComponent(p.appearId) +
                          (viewer ? '&me=' + encodeURIComponent(viewer) : '');
          html += '<a class="who" role="link" tabindex="0" data-nav="' + to +
                  '" onclick="return _safeNavGo(this)">' +
                  (p.photo ? '<img src="' + p.photo + '" alt="">' : '') +
                  '<span class="nm">' + (p.name || p.first || 'Someone') + '</span></a>';
        }
        faces.innerHTML = html;
      })
      .catch(function () {
        count.textContent = 'Who is here cannot load yet. The presence actions are not in the script.';
      });
  }

  function flip() {
    var on = t.className.indexOf('on') === -1;
    t.className = on ? 'toggle on' : 'toggle';
    t.setAttribute('aria-checked', on ? 'true' : 'false');
    // Say it on screen at once rather than waiting for the round trip, so turning
    // yourself off never looks like it did nothing.
    if (!on) { say(0); faces.innerHTML = ''; }
    tell(on);
    // While somebody says they are available we say so every two minutes, so a closed
    // tab drops off by itself rather than leaving a ghost in the room.
    if (beat) { clearInterval(beat); beat = null; }
    if (on) { beat = setInterval(function () { tell(true); }, 120000); }
  }

  t.addEventListener('click', flip);
  t.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });

  function foldToggle() {
    var open = here.className.indexOf('open') === -1;
    here.className = open ? 'here open' : 'here';
    var f = document.getElementById('fold');
    if (f) { f.className = open ? 'fold show open' : 'fold show'; }
    if (open) { load(); }
  }
  document.getElementById('seewho').addEventListener('click', foldToggle);
  document.getElementById('fold').addEventListener('click', foldToggle);

  load();
  setInterval(load, 60000);
})();
</script>
<script src="https://2gather.network/nav/topbar.js?v=5.40" defer></script>
</body>
