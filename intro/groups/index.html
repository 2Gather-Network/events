<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Before you go in · 2Gather</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;background:#1F699E;color:#fff;
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:26px 18px;}
  a{color:#fff;}
</style>
</head>
<body>
<script>
  // One page asks the questions. This address only says who is on the other side of them, so
  // there is one flow to keep in step rather than two copies of the same eleven hundred lines.
  // Everything else on the address is carried through, so a link with next, first or browse on
  // it still works exactly as it did.
  (function(){
    var p = new URLSearchParams(window.location.search);
    p.set('for', 'group');
    // replace rather than assign, so Back goes where somebody came from instead of bouncing
    // them straight back through here.
    window.location.replace('/intro/?' + p.toString());
  })();
</script>
<noscript><p>Carry on to <a href="/intro/?for=group">the questions</a>.</p></noscript>
</body>
</html>
