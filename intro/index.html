<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';

// Your own record is never served from cache. Added 2026-08-31, after a profile showed the
// answers from before a save for up to six hours. The gate caches getIntake, getProfile,
// lookupProfile, getAccount, getMyGroups, getBookmarks and getRegistrations, and a write clears
// none of them: its purge only ever touches the events feed. `nocache` is a switch the gate
// already has, so this asks for a fresh answer rather than changing how the cache works.
//
// Somebody else's record stays cached and stays fast. Only a read about YOU skips it, which is
// the only case where a stale answer is ever wrong.
(function () {
  var _base = GS_URL;
  var _f = window.fetch;
  window.fetch = function (input, init) {
    try {
      var u = (typeof input === 'string') ? input : (input && input.url) || '';
      // 2026-09-15 (queue row 191): the gate now clears your kept profile and groups the moment you save, so these four are
      // trusted from the kept copy; skipping it made the intro wait 20 to 45 seconds on every visit.
      var _trusted = /[?&]action=(getIntake|getProfile|lookupProfile|getMyGroups)(&|$)/.test(u);
      if (u.indexOf(_base) === 0 && u.indexOf('nocache=') === -1 && !_trusted) {
        var me = (window.CW && CW.me && CW.me().key) || '';
        if (me) {
          var norm = function (s) { return String(s || '').split('.').join('').toLowerCase(); };
          var carries = false;
          (u.split('?')[1] || '').split('&').forEach(function (pair) {
            var bits = pair.split('=');
            var k = bits[0];
            if (k !== 'appearId' && k !== 'id' && k !== 'me' && k !== 'CWid' && k !== 'from' && k !== 'memberCard') return;
            if (norm(decodeURIComponent(bits[1] || '')) === norm(me)) carries = true;
          });
          if (carries) { input = (typeof input === 'string') ? (u + '&nocache=1') : new Request(u + '&nocache=1', input); }
        }
      }
    } catch (e) {}
    return _f.call(this, input, init);
  };
})();

  var params = new URLSearchParams(window.location.search);
  // THE INTRO IN THE RAIL, A LIVE MOCKUP (?look=rail, 2026-09-15). Jessie: "make https://2gather.network/intro/ have the same
  // rail from https://creating.works/work/ But Start is actually Welcome and the only hting that chagnes in the panel is

  var GP_RAIL = (params.get('look') || '') !== 'list';

  // a checklist of the six things joining needs and Join now once they are done. Jessie: "make it very apparent that this

  // Nobody sees any of it without ?avatar=1. What it cannot decide is the policy, and that is the question on row 204.
  var GP_AVATAR = GP_RAIL && (params.get('avatar') || '') === '1';
  // FOUR + OTHERS SIDE BY SIDE (row 205, reopened 2026-09-15: "For some reason i don't like the grey button for other

  var GP_OTHER = (function(){ var v = parseInt(params.get('other'), 10); return (v >= 1 && v <= 4) ? v : 0; })();
  // a: the hint tells the truth, promising a drawn line only when there is one to pick.

  var GP_PURPOSE_TRY = (function(){ var v = String(params.get('purpose') || '').toLowerCase(); return (v === 'a' || v === 'b' || v === 'c') ? v : ''; })();
  var GP_VALUES_TRY = GP_RAIL && (params.get('values') || '') === '1';

  var GP_VALUE_WORDS = [
    ['Open',     'hearing and receiving whatever arrives'],
    ['Fair',     'treating others as I would be treated'],
    ['Truthful', 'saying the true thing when it costs me'],
    ['Generous', 'giving what I have and what I know'],
    ['Reliable', 'being there, and helping when asked'],
    ['Caring',   'attending to how another person is']
  ];
  var _gpValuePicked = {};
  var GP_PURPOSE_GAP = '\u2026\u2026\u2026';
  // A preview switch only, so the difference between a and b can be seen by somebody whose three
  // answers are all filled in. &gap=care, &gap=who or &gap=what drops that one from the DRAFTING
  // alone. Nothing is hidden, nothing is unsaved, and nobody meets it without ?purpose=a or b.
  var GP_PURPOSE_HIDE = GP_PURPOSE_TRY ? String(params.get('gap') || '').toLowerCase() : '';
  var GP_OTHER_STYLES = {
    1: 'background:#6B7A8D;border:1px solid #6B7A8D;color:#fff;font-weight:700;',                   // today: solid grey
    2: 'background:#fff;border:1.5px solid #1F699E;color:#1F699E;font-weight:700;',                 // outlined, site blue
    3: 'background:#1F699E;border:1.5px solid #1F699E;color:#fff;font-weight:700;',                 // filled, site blue
    4: 'background:#fff;border:1.5px dashed #1F699E;color:#1F699E;font-weight:700;'                 // dashed, site blue
  };
  // 2, THE OUTLINED ONE, IS THE + OTHER NOW. Jessie picked it from the four on 2026-09-15: "outlined". It is the same
  // shape as every other button on the site, which is the point: a control that does something looks like the other
  // controls that do something. ?other=1, 3 or 4 still draws the others, for a comparison.
  function gpOtherStyle(){ return GP_OTHER_STYLES[GP_OTHER] || GP_OTHER_STYLES[2]; }
  var GP_PERM_ON = GP_RAIL && (params.get('perm') || '') === '1';
  var meId = CW.me().id;
  // Where to send somebody once they are through. Only our own two hosts are accepted, so a
  // crafted link cannot use this page to bounce anybody somewhere else.
  var _next = (function(){
    var raw = params.get('next') || '';
    try {
      var u = new URL(raw, 'https://2gather.network');
      if (u.host === '2gather.network' || u.host === 'gather.2gather.network'
          || u.host === 'creating.works') return u.toString();
    } catch(err){}
    return 'https://2gather.network/mygroups' + (meId ? '?CWid=' + encodeURIComponent(meId) : '');
  })();
  // Somebody arriving on their way into a group is told about the group, and somebody on
  // their way to an event is told about the event. The link can say which with ?for=event,
  // and when it does not, where it is sending them says it instead.
  var GP_FOR = (function(){
    var said = String(params.get('for') || '').trim().toLowerCase();
    if (said === 'event' || said === 'group') return said;
    return /\/(events?|e)\//.test(_next) ? 'event' : 'group';
  })();
  // Nothing here can be saved by somebody the site does not know, so nobody is left filling in
  // a form that will quietly throw their answers away. They are sent to sign in and brought
  // straight back to this exact address. Jessie's rule, 2026-08-30: any page that writes sends a
  // signed-out person to sign in first.
  if (!meId) {
    var _here = encodeURIComponent(location.pathname + location.search);
    window.location.replace('/signin/?next=' + _here);
  }
  window._gpAlreadyIn = (params.get('already') || '') === '1';
  window._gpFirstTime = (params.get('first') || '') === '1';
  // The group bundle is cached for a minute, and the answer just changed. Without this the
  // page somebody lands on could still believe they had not answered and ask again.
  function _introDone(){
    var u = _next + (_next.indexOf('?') > -1 ? '&' : '?') + 'nocache=1';
    window.location.href = u;
  }

  var GP_INTRO_Q = [
    { key:'introNeed',   need:false, q:'What do you need?',
      ph:'A cat sitter for the last week of September, a massage therapist local to Seattle, and someone who can help me get a PT nursing job where I can travel anywhere.' },
    { key:'introEnjoy',  need:true,  q:'What do you enjoy?',
      hint:'What you love doing.',
      ph:'Pickleball, kayaking, singing badly in a group, anything on the water.' },
    { key:'introSkills', need:true,  q:'What skills do you have?',
      hint:'Name whatever you’re good at. You are multi-dimensional so please shine your light! ✨',
      ph:'Facilitating a room full of people who disagree. Experience design. Cutting short hair, helping people move (I’m great at finding ways to make small spaces very functional!)' },
    { key:'introValues', need:false, q:'What do you care about?',
      hint:'What matters to you, and what you want more of in the world. Leave it blank if you would rather not say.',
      ph:'Housing, food security, keeping the lake swimmable…' },
    { key:'introOffer',  need:false, q:'Do you have something you want to offer right now?',
      ph:'A spare room for the month of September, a truck for moving stuff, a meeting space to meet each week, and gardening tools.' }
  ];

  // it has one (languages, methods, offeringTypes, serveWhoTypes, workExperienceTypes, appreciationTypes), so adding a word
  // to reference-data changes the page with no push.
  function gpRefList(name, fallback){
    var rd = window._gpRd || {};
    var l = rd[name];
    if (!Array.isArray(l) || !l.length) return fallback;
    return l.map(function (v) { return String((v && v.item !== undefined) ? v.item : v).trim(); }).filter(Boolean);
  }
  var GP_THANKS = [
    { label:'\u{1F48E} Money',                        value:'Money' },
    { label:'\u{1F49B} Say thank you',                value:'Say thank you' },
    { label:'✨ Acts of service',                 value:'Acts of service' },
    { label:'\u{1F4E6} Something from my gift list',  value:'Physical goods' },
    { label:'\u{1F331} Pass it on to somebody else',  value:'Pass it on' }
  ];
  var _gpThanksPicked = {};

  // Chips under every question. Somebody in a hurry taps and moves on, somebody with something
  // specific to say still types it. The words come from the reference sheet, so a tap produces

  //
  //   need + offer  three pills, a person, a place, a thing

  var GP_CHIPS_ON = (params.get('chips') || '') !== '0';

  function gpPickRow(all, picked, firstN){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){
        picked[word] = !picked[word]; paint();
        // A language chosen here is what unlocks step 0, so the footer is told.
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

  function gpBlock(title, hint, body){
    var w = document.createElement('div');
    w.style.cssText = 'padding:18px 0;border-top:1px solid #f0f1f5;';
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = title;
    var h = document.createElement('div');
    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    h.textContent = hint;
    w.appendChild(t); w.appendChild(h); w.appendChild(body);
    return w;
  }

  // The search is for the long tail. It is not on screen until somebody has asked for more
  // than the eight in front of them, because a search box beside eight buttons is a question
  // nobody was asking. Picking a language out of the search lights the button that is already
  // there rather than adding a second one that says the same word.
  function gpLanguagesBlockBrowse(){
    var wrap = document.createElement('div');
    var btns = {};
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';

    function paint(word){
      var b = btns[word]; if (!b) return;
      b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + (_gpLangPicked[word]
            ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    }
    function chip(word){
      if (btns[word]) return btns[word];
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      btns[word] = b;
      b.addEventListener('click', function(){
        _gpLangPicked[word] = !_gpLangPicked[word];
        paint(word);
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      paint(word);
      return b;
    }
    function turnOn(word){
      _gpLangPicked[word] = true;
      if (!btns[word]) row.appendChild(chip(word));
      paint(word);
      if (typeof gpStepPaint === 'function') gpStepPaint();
    }

    // The search, above the chips, and not on screen until More is pressed.
    var searchWrap = document.createElement('div');
    searchWrap.style.cssText = 'display:none;margin-bottom:10px;';
    var line = document.createElement('div');
    line.style.cssText = 'display:flex;gap:8px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Search languages';
    inp.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
      + 'padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var add = document.createElement('button');
    add.type = 'button';
    add.textContent = 'Add';
    add.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:20px;'
      + 'border:0;background:#1F699E;color:#fff;cursor:pointer;';
    line.appendChild(inp); line.appendChild(add);
    var hits = document.createElement('div');
    hits.style.cssText = 'margin-top:6px;';
    searchWrap.appendChild(line); searchWrap.appendChild(hits);

    function clearSearch(){ inp.value = ''; hits.innerHTML = ''; }
    inp.addEventListener('input', function(){
      var t = String(inp.value || '').trim().toLowerCase();
      hits.innerHTML = '';
      if (t.length < 2) return;
      GP_LANGS.filter(function(w){ return w.toLowerCase().indexOf(t) > -1; }).slice(0, 6)
        .forEach(function(w){
          var r = document.createElement('div');
          r.setAttribute('role', 'button');
          r.tabIndex = 0;
          r.style.cssText = 'border:1px solid #DDE3EA;border-radius:10px;padding:9px 12px;margin-top:6px;'
            + 'cursor:pointer;background:#fff;font-size:14.5px;font-weight:700;color:#1A2E42;';
          r.textContent = w;
          r.addEventListener('click', function(){
            turnOn(w);
            clearSearch();
            try { btns[w].scrollIntoView({ behavior:'smooth', block:'nearest' }); } catch (e) {}
          });
          hits.appendChild(r);
        });
    });
    function commit(){
      var v = inp.value.trim(); if (!v) return;
      // Typed a language that is already a button? Light that one instead of making a twin.
      var known = null;
      for (var i = 0; i < GP_LANGS.length; i++) {
        if (GP_LANGS[i].toLowerCase() === v.toLowerCase()) { known = GP_LANGS[i]; break; }
      }
      turnOn(known || v);
      clearSearch();
      inp.focus();
    }
    add.addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });

    var first = GP_LANGS.filter(function(w, i){ return i < 8 || _gpLangPicked[w]; });
    var rest  = GP_LANGS.filter(function(w){ return first.indexOf(w) === -1; });
    first.forEach(function(w){ row.appendChild(chip(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(chip(w)); });
        searchWrap.style.display = 'block';
        inp.focus();
      }));
    }
    wrap.appendChild(searchWrap);
    wrap.appendChild(row);
    return gpBlock('Which languages do you speak?', 'So people know they can talk to you in theirs.', wrap);
  }

  function gpLanguagesBlock(){
    if (GP_BROWSE) return gpLanguagesBlockBrowse();
    var picker = gpPickRow(gpRefList('languages', GP_LANGS), _gpLangPicked, 8);
    var wrap = document.createElement('div');

      + 'padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var add = document.createElement('button');
    add.type = 'button';
    add.textContent = 'Add';

    line.appendChild(inp); line.appendChild(add);
    wrap.appendChild(line);
    return gpBlock('Which languages do you speak?', 'So people know they can talk to you in theirs.', wrap);
  }

  // OPEN TO WORK, on the skills screen above appreciation. Jessie, 2026-09-13: "1 yes. But on skills screen above
  // question about appreciation". The same three questions creating.works/work/ asks, saved to the same columns:
  // ikigai.openToPaidWork, ikigai.openToUnpaidTime and ikigai.openToUnpaidWork. The options are getReferenceData's
  // paidWorkTypes (both time questions) and unpaidWorkTypes. An answer the list no longer holds still shows.
  var _gpOtw = { paid: {}, unpaidTime: {}, unpaid: {} };
  function gpOtwList(side){ return Object.keys(_gpOtw[side]).filter(function(k){ return _gpOtw[side][k]; }); }
  function gpOtwBlock(){
    var w = document.createElement('div');
    w.id = 'gp-otw-block';
    w.setAttribute('data-gp-step', '2');
    w.style.display = 'none';   // shown once a skill is chosen, like the question above it
    var fill = function(){
      var rd = window._gpRd || {};
      if (!Array.isArray(rd.paidWorkTypes)) return false;
      w.innerHTML = '';
      var opts = function(side, list){ var l = list.slice(); gpOtwList(side).forEach(function(v){ if (l.indexOf(v) < 0) l.push(v); }); return l; };
      w.appendChild(gpBlock('What type of paid work are you open to?', 'Pick as many as fit.', gpPickRow(opts('paid', rd.paidWorkTypes), _gpOtw.paid, 0).row));
      w.appendChild(gpBlock('What type of non-paid work are you open to?', 'Pick as many as fit.', gpPickRow(opts('unpaidTime', rd.paidWorkTypes), _gpOtw.unpaidTime, 0).row));
      // + OTHER, the way the other pickers have it. Jessie, 2026-09-13: "Make a chip for other like we normally do".
      var _up = gpPickRow(opts('unpaid', rd.unpaidWorkTypes || []), _gpOtw.unpaid, 0);
      var _oth = document.createElement('button');
      _oth.type = 'button'; _oth.textContent = '+ Other';
      _oth.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + gpOtherStyle();
      var _obx = document.createElement('div');
      _obx.style.cssText = 'display:none;margin-top:10px;gap:8px;flex-wrap:wrap;';
      var _oin = document.createElement('input');
      _oin.type = 'text'; _oin.placeholder = 'In your own words';
      _oin.style.cssText = 'flex:1 1 220px;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;';
      var _oadd = document.createElement('button');
      _oadd.type = 'button'; _oadd.textContent = 'Add';
      _oadd.style.cssText = 'font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:20px;border:0;background:#1F699E;color:#fff;cursor:pointer;';
      _obx.appendChild(_oin); _obx.appendChild(_oadd);
      var _oAdd = function(){
        var v = String(_oin.value || '').trim(); if (!v) return;
        var known = (rd.unpaidWorkTypes || []).concat(Object.keys(_gpOtw.unpaid)).filter(function(k){ return k.toLowerCase() === v.toLowerCase(); })[0];
        if (known) { if (!_gpOtw.unpaid[known]) { _gpOtw.unpaid[known] = true; fill(); return; } }
        else { _up.add(v); _up.row.appendChild(_oth); }   // + Other stays last
        _oin.value = ''; _obx.style.display = 'none';
      };
      _oth.addEventListener('click', function(){ _obx.style.display = _obx.style.display === 'none' ? 'flex' : 'none'; if (_obx.style.display === 'flex') { try { _oin.focus(); } catch (e) {} } });
      _oadd.addEventListener('click', _oAdd);
      _oin.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); _oAdd(); } });
      _up.row.appendChild(_oth);
      var _upBody = document.createElement('div'); _upBody.appendChild(_up.row); _upBody.appendChild(_obx);
      w.appendChild(gpBlock('Which types of non-paid work?', 'Pick as many as fit.', _upBody));
      return true;
    };
    gpChoicesOr(w, fill);   // asked twice, then "The choices did not load" with Try again (see gpChoicesOr)
    return w;
  }

  function gpChipLabel(word){ var e = GP_EMOJI[word]; return e ? (e + ' ' + word) : word; }

  // A tapped chip writes its word into the box, so a person sees the answer they just gave and
  // can keep typing after it. It is also kept in _gpChipsPicked, which is what a later change
  // will store as a tag rather than as a sentence.
  function gpChipBtn(key, word, ta){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = gpChipLabel(word);
    var paint = function(){
      b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + (_gpChipsPicked[key] && _gpChipsPicked[key][word]
            ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    };
    paint();
    b.addEventListener('click', function(){
      if (!_gpChipsPicked[key]) _gpChipsPicked[key] = {};
      var on = !_gpChipsPicked[key][word];
      _gpChipsPicked[key][word] = on;
      var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
      var at = -1;
      for (var pi = 0; pi < parts.length; pi++) {
        if (parts[pi].toLowerCase() === String(word).toLowerCase()) { at = pi; break; }
      }
      if (on && at === -1) parts.push(word);
      if (!on && at > -1) parts.splice(at, 1);
      ta.value = parts.join(', ');
      paint();
    });
    return b;
  }

  // A quiet pill that opens the rest of a list. It removes itself once pressed, because a
  // control that has already done its work is one more thing to read past.
  function gpMoreBtn(label, onOpen){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + gpOtherStyle();
    b.addEventListener('click', function(){ b.parentNode.removeChild(b); onOpen(); });
    return b;
  }

  // so there is one list of words on this site rather than two that drift.
  //
  // Choosing from the search IS the tag: the reference tree already knows that yoga is Movement
  // & Performance. Only a genuinely new word has to be asked about, which is what Other does.
  var GP_PICK = {
    // 2026-08-31, Jessie: needing and offering are the same shape, so they ask the same way.
    // Pick the kind, then say what it is. The stored word is "massage therapy:skill", which is
    // the format a need is already saved and read in.
    introNeed: {
      examples: ['A skill', 'A thing', 'A space'],
      kinds: true,
      tagQ: 'Is that a person, a place or a thing?',
      tagOpts: ['Person', 'Place', 'Thing'], source: 'need'
    },
    introEnjoy: {
      examples: ['Pickleball', 'Karaoke', 'Gundam model kits', 'Walking', 'Board games'],
      tagQ: 'Which of these is it?',
      tagOpts: ['⚽ Sports', '\u{1F332} Outdoor & Nature', '\u{1F9F6} Making & Collecting',
                '\u{1F3AD} Movement & Performance', '\u{1F3B2} Games & Strategy'], source: 'recreation'
    },
    introSkills: {
      examples: ['Massage therapist', 'Hairstylist', 'Accountant', 'Nurse', 'AI specialist'],
      tagQ: 'Which category does it belong to?', tagOpts: null, source: 'skills'
    },
    // The three kinds of thing somebody can offer, the same three the reference sheet holds
    // under offeringTypes.
    introOffer: {
      examples: ['A skill', 'A thing', 'A space'],
      kinds: true,
      tagQ: 'Tag this to which categories?', tagOpts: null, source: 'resources'
    },
    introValues: {
      examples: ['\u{1F3D8}️ Housing and Shelter', '\u{1F372} Food Security', '\u{1F4A7} Clean Water',
                 '\u{1F32C}️ Clean Air', '⚡ Clean Energy', '\u{1F43F}️ Animal Welfare'],
      tagQ: 'Tag this to which categories?', tagOpts: null, source: 'values'
    }
  };
  // word -> the category it was filed under. Sent to the backend beside the sentence.
  var _gpTags = {};
  // The real columns hold more than a name: "Singing:Participant" carries a level, and
  // "Project Manager:Business & Finance:Expert Level" carries a category and a level too. The
  // screen shows the name alone, so saving the screen back would quietly throw the rest away.
  // What each name arrived as is remembered here and sent back untouched unless it was removed.
  var _gpOrig = {};

  var _gpRefP = null;
  function gpRefOnce(){
    if (_gpRefP) return _gpRefP;
    _gpRefP = fetch(GS_URL + '?action=getReferenceData')
      .then(function(r){ return r.json(); })
      // Kept where the tag options can read it, so a question can be tagged along its own axis.
      // An error answer is not kept over a good one, and a failed ask is not remembered, so the next ask goes again.
      .then(function(rd){ if (rd && Array.isArray(rd.skills)) { window._gpRd = rd; } else { _gpRefP = null; } return rd; })
      .catch(function(){ _gpRefP = null; return {}; });
    return _gpRefP;
  }
  // THE CHOICES NEVER SIT ON "LOADING" FOR EVER. Jessie, 2026-09-15, with a picture of Which sectors do you work in, or
  // want to? on intro rail v2: "didn't load". The list waited on one ask for the choices, which Apps Script answers in about
  // 30 seconds when nothing is kept, and a failed ask left the pill there with nothing coming. Now: asked twice, then it
  // says so with Try again. fill() draws the list into box and answers true once it could.
  function gpChoicesOr(box, fill){
    if (fill()) return;
    var loading = '<div style="padding:18px 0;"><span class="cw-loading" style="display:inline-flex;background:#1F699E;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;">Loading the choices</span></div>';
    var tries = 0;
    var go = function(){
      box.innerHTML = loading;
      gpRefOnce().then(function(){
        if (fill()) return;
        if (++tries < 2) { _gpRefP = null; setTimeout(go, 1500); return; }
        box.innerHTML = '<div style="padding:12px 0;font-size:14px;color:#1A2E42;">The choices did not load. '
          + '<button type="button" style="font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;margin-left:4px;">Try again</button></div>';
        box.querySelector('button').onclick = function(){ tries = 0; _gpRefP = null; go(); };
      });
    };
    go();
  }

  // One flat list of {word, cat} per question, which is all the search needs.
  function gpCorpus(source, rd){
    var out = [], seen = {};
    // The reference sheet carries an `associations` column of everyday words, so searching
    // "doctor" finds Physician. Without it the search only matches the formal name, which is
    // the one thing somebody looking for help does not know.
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      // The category comes from the sheet now, so Housing and Shelter arrives knowing it is
      // Social. It used to be filed as the flat word "Values", which told nobody anything.
      (rd.values || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Values', v && v.associations);
      });
      (rd.domains || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Domains', v && v.associations);
      });
      // The values list on the reference sheet is empty today, so the two lenses that have been
      // on this page since August are the corpus. Without this the search finds nothing at all.
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'resources') {
      // Things and spaces people can share. Without this branch the offer question had no words
      // at all, so its search found nothing and every answer went in untagged.
      (rd.resources || []).forEach(function(r){ push(r.item, r.category, r.associations); });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  // Adding a word writes it into the box, so somebody sees the answer they just gave and can
  // keep typing after it, and files the tag beside it.
  function gpAddWord(key, word, cat, ta){
    word = String(word || '').trim(); if (!word) return;
    if (!_gpTags[key]) _gpTags[key] = {};
    _gpTags[key][word] = cat || '';
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].toLowerCase() === word.toLowerCase()) return;
    }
    parts.push(word);
    ta.value = parts.join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpDropWord(key, word, ta){
    if (_gpTags[key]) delete _gpTags[key][word];
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    ta.value = parts.filter(function(p){ return p.toLowerCase() !== String(word).toLowerCase(); }).join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpHasWord(key, word){
    return !!(_gpTags[key] && _gpTags[key][word] !== undefined);
  }

  function gpPill(label, on){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    return b;
  }

  // ── Browse by category ─────────────────────────────────────────────────
  // The walk-down list the profile editor has, built here from getReferenceData rather than
  // typed into the page, and drawn in the intro's own colours. One level on screen at a time:
  // tapping a category replaces what is showing instead of expanding underneath it.
  function gpBuildTree(source, rd){
    var tree = {}, seen = {};
    var add = function(top, sub, item){
      top = String(top || '').trim(); sub = String(sub || '').trim(); item = String(item || '').trim();
      if (!top || !item) return;
      var k = (top + '|' + sub + '|' + item).toLowerCase();
      if (seen[k]) return; seen[k] = 1;
      if (!tree[top]) tree[top] = { subs:{}, items:[] };
      if (sub) { if (!tree[top].subs[sub]) tree[top].subs[sub] = []; tree[top].subs[sub].push(item); }
      else tree[top].items.push(item);
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ add(r.recType, r.category, r.item); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ add(s.category, '', s.item); });
    } else if (source === 'values') {
      var vs = (rd.values || []).filter(function(v){ return v && v.item; });
      if (vs.length) {
        // The sheet carries the category once the backend reads Eco Social Value beside
        // Eco Social Category. Then this is the whole list and the page holds none of it.
        vs.forEach(function(v){ add(v.category || 'Values', '', v.item); });
      } else {
        // Until that one line ships, the two lenses already on this page are the list.
        ((GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || []).forEach(function(l){
          (l.words || []).forEach(function(w){ add(l.label, '', w); });
          (l.more  || []).forEach(function(w){ add(l.label, '', w); });
        });
      }
    }
    return tree;
  }
  function gpLevel(tree, path){
    var alpha = function(x){ return x.slice().sort(function(a,b){ return a.localeCompare(b); }); };
    if (!path.length) return alpha(Object.keys(tree)).map(function(k){ return { name:k, drill:true }; });
    var node = tree[path[0]] || { subs:{}, items:[] };
    if (path.length === 1) {
      var out = alpha(Object.keys(node.subs)).map(function(k){ return { name:k, drill:true }; });
      alpha(node.items).forEach(function(i){ out.push({ name:i, drill:false }); });
      return out;
    }
    return alpha(node.subs[path[1]] || []).map(function(i){ return { name:i, drill:false }; });
  }

  // The joy screen, reshaped 2026-08-30. Five examples and Other, nothing else, because a
  // search box beside five buttons asks a question nobody had yet. Other opens the search.
  var GP_BARE_KEYS = { introEnjoy:1, introSkills:1, introValues:1, introNeed:1, introOffer:1 };
  // Where the card heading already asks the question, the second copy comes off. Needs and
  // haves keeps its headings, because two questions share that screen and they have to be
  // told apart.
  var GP_BARE_HEAD = { introEnjoy:1, introSkills:1, introValues:1 };
  // In the rail there is no header, so every question says itself, the same size as the rest.
  if (GP_RAIL) GP_BARE_HEAD = {};
  function gpBareKey(key){ return GP_BROWSE && !!GP_BARE_KEYS[key]; }

  // The appreciation question appears once somebody has said what their skills are, and goes
  // again if they take the last one off. One function so every path agrees.
  function gpRevealThanks(){
    var el = document.getElementById('gp-thanks-block');
    if (!el) return;
    // Only on its own screen. Setting display here on any other step overrode the step machinery
    // and put this question on every screen, which is what it did on the needs and haves one.
    if (GP_RAIL || _gpStep !== 2) return;   // on the rail it is a step of its own (Appreciation), shown by gpShowStep
    el.style.display = gpAnswered('introSkills') ? '' : 'none';
  }

  function gpPicker(key, ta){
    var cfg = GP_PICK[key];
    if (!GP_CHIPS_ON || !cfg) return null;
    var _bare = gpBareKey(key);
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:12px;';

    // What somebody has chosen, on screen. Without this the only sign that an answer landed was
    // the Next button turning on, because the box that used to show it is hidden now.
    var chosen = document.createElement('div');
    chosen.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;';
    box.appendChild(chosen);
    function gpPaintChosen(){
      chosen.innerHTML = '';
      String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean)
        .forEach(function(w){
          var c = document.createElement('span');
          c.style.cssText = 'display:inline-flex;align-items:center;gap:8px;font-size:13.5px;'
            + 'padding:7px 10px 7px 14px;border-radius:20px;background:#1F699E;color:#fff;font-weight:700;';
          var t2 = document.createElement('span');
          // Stored as "massage therapy:skill". Somebody reads the thing, not the colon.
          var _bits = String(w).split(':');
          var _kind = (_bits.length > 1) ? _bits[_bits.length - 1].toLowerCase() : '';
          if (_kind === 'skill' || _kind === 'thing' || _kind === 'space') {
            t2.textContent = _bits.slice(0, -1).join(':');
            var _k = document.createElement('span');
            _k.textContent = '· ' + _kind;
            _k.style.cssText = 'font-weight:600;opacity:.7;font-size:11.5px;margin-left:5px;';
            c.appendChild(t2); c.appendChild(_k);
            t2 = null;
          } else {
            t2.textContent = w;
          }
          var x = document.createElement('button');
          x.type = 'button';
          x.setAttribute('aria-label', 'Remove ' + w);
          x.textContent = '\u00D7';
          x.style.cssText = 'font:inherit;font-size:15px;line-height:1;border:0;background:transparent;'
            + 'color:#fff;cursor:pointer;padding:0 2px;';
          x.addEventListener('click', function(){ gpDropWord(key, w, ta); repaint(); });
          if (t2) c.appendChild(t2);
          c.appendChild(x);
          chosen.appendChild(c);
        });
    }

    if (!_bare) {
      var lead = document.createElement('div');
      lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
      lead.textContent = 'Search for something, or tap one below.';
      box.appendChild(lead);
    }

    var search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search';
    search.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
      + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var searchWrap = document.createElement('div');
    if (_bare) searchWrap.style.cssText = 'display:none;margin-bottom:10px;';
    searchWrap.appendChild(search);
    var results = document.createElement('div');
    results.style.cssText = 'margin-top:6px;';
    searchWrap.appendChild(results);
    box.appendChild(searchWrap);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
    box.appendChild(row);

    var corpus = [];
    var _browseOn = GP_BROWSE && !!GP_BROWSE_KEYS[key] && !_bare;
    var browseWrap = document.createElement('div');
    browseWrap.style.cssText = 'margin-top:14px;';
    if (_browseOn) {
      box.appendChild(browseWrap);
      // The list has not arrived yet, so say that rather than draw an empty row somebody
      // will read as "there is nothing here".
      var _wait = document.createElement('div');
      _wait.style.cssText = 'font-size:13px;color:#6B7A8D;';
      _wait.textContent = 'Looking up the list\u2026';
      browseWrap.appendChild(_wait);
    }
    gpRefOnce().then(function(rd){
      corpus = gpCorpus(cfg.source, rd);
      if (_browseOn) gpRenderBrowse(gpBuildTree(cfg.source, rd), []);
    });

    // The examples show at the top level and step aside once somebody is inside a category,
    // so there is one list on the screen rather than two.
    function gpRenderBrowse(tree, path){
      browseWrap.innerHTML = '';
      var atTop = !path.length;
      row.style.display = atTop ? 'flex' : 'none';
      if (atTop) {
        var lead2 = document.createElement('div');
        lead2.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        lead2.textContent = 'Or browse by category.';
        browseWrap.appendChild(lead2);
      } else {
        var trail = document.createElement('div');
        trail.style.cssText = 'font-size:13.5px;font-weight:700;color:#1A2E42;margin-bottom:10px;';
        var mkLink = function(text, to){
          var a = document.createElement('a');
          a.href = '#'; a.textContent = text;
          a.style.cssText = 'color:#1F699E;text-decoration:underline;cursor:pointer;';
          a.addEventListener('click', function(e){ e.preventDefault(); gpRenderBrowse(tree, to); });
          return a;
        };
        trail.appendChild(mkLink('All categories', []));
        path.forEach(function(seg, idx){
          var sep = document.createElement('span');
          sep.style.cssText = 'color:#6B7A8D;margin:0 6px;font-weight:400;';
          sep.textContent = '\u203A';
          trail.appendChild(sep);
          if (idx === path.length - 1) {
            var cur = document.createElement('span');
            cur.textContent = seg;
            trail.appendChild(cur);
          } else {
            trail.appendChild(mkLink(seg, path.slice(0, idx + 1)));
          }
        });
        browseWrap.appendChild(trail);
      }
      var lrow = document.createElement('div');
      lrow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
      gpLevel(tree, path).forEach(function(it){
        if (it.drill) {
          // A category opens, a word gets added, and the two are told apart by how they look
          // rather than by a glyph on the label.
          var d = document.createElement('button');
          d.type = 'button';
          d.textContent = it.name;
          d.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
            + 'background:#EDF4FA;border:1px solid #BBD4E8;color:#1A2E42;font-weight:700;';
          d.addEventListener('click', function(){ gpRenderBrowse(tree, path.concat(it.name)); });
          lrow.appendChild(d);
          return;
        }
        // The top of the path IS the tag, because the tree already knows where the word lives.
        var b = gpPill(it.name, gpHasWord(key, it.name));
        b.addEventListener('click', function(){
          if (gpHasWord(key, it.name)) gpDropWord(key, it.name, ta);
          else gpAddWord(key, it.name, path[0] || '', ta);
          gpRenderBrowse(tree, path);
          repaint();
        });
        lrow.appendChild(b);
      });
      browseWrap.appendChild(lrow);
    }

    function repaint(){
      gpPaintChosen();
      gpRevealThanks();
      // Every answer in the list above, by name, whether chosen this visit or saved before.
      var _inList = {};
      String(ta.value || '').split(',').forEach(function(x){
        var n = String(x).split(':')[0].replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase(); if (n) _inList[n] = 1;
      });
      Array.prototype.forEach.call(row.querySelectorAll('button[data-word]'), function(b){
        var on = gpHasWord(key, b.getAttribute('data-word'));
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
                : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
        // NO SECOND COPY OF A CHOSEN ANSWER. Jessie, 2026-09-13, on James Marohn's joy screen: "Duplicates showing". An
        // example already chosen is in the list above with its x, so it steps out of this row and comes back if removed.
        if (on || _inList[String(b.getAttribute('data-word') || '').toLowerCase()]) b.style.display = 'none';
      });
    }

    // The five examples. Emoji stay on screen and come off the stored word, so a tag matches
    // what the reference sheet holds rather than a decorated version of it.
    // When a question asks for a kind rather than a thing, tapping a kind opens a box for the
    // thing itself. "A skill" on its own tells nobody anything, and it is what was being stored.
    var kindBox = null;
    if (cfg.kinds) {
      kindBox = document.createElement('div');
      kindBox.style.cssText = 'display:none;margin-top:10px;gap:8px;align-items:center;';
      var kindInput = document.createElement('input');
      kindInput.type = 'text';
      kindInput.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;'
        + 'border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      var kindAdd = document.createElement('button');
      kindAdd.type = 'button';
      kindAdd.textContent = 'Add';
      kindAdd.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:10px 18px;'
        + 'border-radius:20px;border:0;background:#1F699E;color:#fff;cursor:pointer;';
      kindBox.appendChild(kindInput); kindBox.appendChild(kindAdd);
      box.appendChild(kindBox);
      var kindNow = '';
      var kindCommit = function(){
        var v = String(kindInput.value || '').trim();
        if (!v || !kindNow) return;
        gpAddWord(key, v + ':' + kindNow, '', ta);
        kindInput.value = '';
        kindBox.style.display = 'none';
        kindNow = '';
        repaint();
      };
      kindAdd.addEventListener('click', kindCommit);
      kindInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter') { e.preventDefault(); kindCommit(); }
      });
      cfg._openKind = function(kind, prompt){
        kindNow = kind;
        kindInput.placeholder = prompt;
        kindBox.style.display = 'flex';
        kindInput.focus();
      };
    }

    cfg.examples.forEach(function(label){
      var word = label.replace(/^[^A-Za-z0-9]+/, '').trim();
      var b = gpPill(label, gpHasWord(key, word));
      b.setAttribute('data-word', word);
      b.addEventListener('click', function(){
        if (cfg.kinds && cfg._openKind) {
          // "A skill" -> skill, and ask what kind of skill.
          var kind = word.toLowerCase().replace(/^a\s+/, '').trim();
          var asks = { skill: 'What skill?', thing: 'What thing?', space: 'What space?' };
          cfg._openKind(kind, asks[kind] || ('What ' + kind + '?'));
          return;
        }
        if (gpHasWord(key, word)) { gpDropWord(key, word, ta); }
        else {
          // An example is usually in the reference sheet too, so it takes that sheet's category
          // rather than arriving untagged. Pickleball files as Sports, not as nothing.
          var cat = '';
          for (var ci = 0; ci < corpus.length; ci++) {
            if (corpus[ci].word.toLowerCase() === word.toLowerCase()) { cat = corpus[ci].cat; break; }
          }
          gpAddWord(key, word, cat, ta);
        }
        repaint();
      });
      row.appendChild(b);
    });

    // Other, and the one question a genuinely new word has to answer.
    var other = document.createElement('button');
    other.type = 'button';
    other.textContent = '+ Other';
    other.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + gpOtherStyle();
    if (_browseOn) {
      // Its own row, below the browse, so it is still there when the examples have stepped aside.
      var otherRow = document.createElement('div');
      otherRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;';
      otherRow.appendChild(other);
      box.appendChild(otherRow);
    } else {
      row.appendChild(other);
    }

    var otherBox = document.createElement('div');
    otherBox.style.cssText = 'display:none;margin-top:10px;';
    box.appendChild(otherBox);

    other.addEventListener('click', function(){
      // Other opens the search and nothing else. The search now offers "Add this to my list"
      // when it finds nothing, so a second box asking for the same words was the same question
      // twice on one screen.
      if (_bare) {
        searchWrap.style.display = 'block';
        try { search.focus(); } catch (e) {}
        return;
      }
      otherBox.style.display = otherBox.style.display === 'none' ? 'block' : 'none';
      if (otherBox.style.display === 'none') { otherBox.innerHTML = ''; return; }
      otherBox.innerHTML = '';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'In your own words';
      inp.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
        + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      otherBox.appendChild(inp);
      var ask = document.createElement('div');
      ask.style.cssText = 'margin-top:8px;';
      otherBox.appendChild(ask);
      inp.focus();

      var commit = function(){
        var word = String(inp.value || '').trim();
        if (!word) return;
        // Already in the reference sheet? Then it is not new and it keeps that sheet's category.
        var hit = null;
        for (var i = 0; i < corpus.length; i++) {
          if (corpus[i].word.toLowerCase() === word.toLowerCase()) { hit = corpus[i]; break; }
        }
        if (hit) {
          gpAddWord(key, hit.word, hit.cat, ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        if (!cfg.tagQ) {
          gpAddWord(key, word, '', ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        ask.innerHTML = '';
        var q = document.createElement('div');
        q.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        q.textContent = cfg.tagQ;
        ask.appendChild(q);
        var opts = cfg.tagOpts;
        if (!opts) {
          // Skills and values take their categories from the reference sheet itself.
          var seen = {}; opts = [];
          corpus.forEach(function(c){ if (c.cat && !seen[c.cat]) { seen[c.cat] = 1; opts.push(c.cat); } });
        }
        var orow = document.createElement('div');
        orow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
        opts.forEach(function(o){
          var ob = gpPill(o, false);
          ob.addEventListener('click', function(){
            gpAddWord(key, word, o.replace(/^[^A-Za-z0-9]+/, '').trim(), ta);
            otherBox.style.display = 'none'; otherBox.innerHTML = '';
          });
          orow.appendChild(ob);
        });
        ask.appendChild(orow);
      };
      inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
      var add = document.createElement('button');
      add.type = 'button';
      add.textContent = 'Add';
      add.style.cssText = 'margin-top:8px;font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;'
        + 'border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;';
      add.addEventListener('click', commit);
      otherBox.insertBefore(add, ask);
    });

    // Nothing matched, so the search becomes the way in rather than a dead end pointing at
    // another button. A word nobody has used before still has to be filed, which is the one
    // question Other asks, and it is asked right here instead.
    function gpAddNew(word, mount, done){
      word = String(word || '').trim(); if (!word) return;
      // Typed something the sheet already knows? Then it is not new and it keeps that category.
      for (var i = 0; i < corpus.length; i++) {
        if (corpus[i].word.toLowerCase() === word.toLowerCase()) {
          gpAddWord(key, corpus[i].word, corpus[i].cat, ta); repaint(); if (done) done(); return;
        }
      }
      // 2026-08-30. The tag question is gone. It asked somebody to do taxonomy work that was
      // unwanted and modelled the wrong thing, and it only ever fired on a word nobody had used
      // before, which is exactly where a person's guess is worst. A word the sheet already knows
      // still arrives with its category, because the sheet knows it. A new word is saved as it
      // was typed. See design/data-direction-edges-not-categories.md.
      gpAddWord(key, word, '', ta);
      repaint();
      if (done) done();
      if (typeof gpStepPaint === 'function') gpStepPaint();
    }

    // Search. Filters as you type, because pressing a button to search reads as broken.
    search.addEventListener('input', function(){
      var t = String(search.value || '').trim().toLowerCase();
      results.innerHTML = '';
      if (t.length < 2) return;
      var hits = corpus.filter(function(c){
        return c.word.toLowerCase().indexOf(t) > -1 || (c.assoc && c.assoc.indexOf(t) > -1);
      }).slice(0, 6);
      hits.forEach(function(h){
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.style.cssText = 'border:1px solid #DDE3EA;border-radius:10px;padding:10px 12px;margin-top:6px;cursor:pointer;background:#fff;';
        r.innerHTML = '<div style="font-size:14.5px;font-weight:700;color:#1A2E42;">' + h.word + '</div>'
          + (h.cat ? '<div style="font-size:13px;color:#6B7A8D;">' + h.cat + '</div>' : '');
        r.addEventListener('click', function(){
          gpAddWord(key, h.word, h.cat, ta);
          search.value = ''; results.innerHTML = ''; repaint();
        });
        results.appendChild(r);
      });
      if (!hits.length) {
        var typed = String(search.value || '').trim();
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.style.cssText = 'border:1px solid #C9DFF3;border-radius:10px;padding:10px 12px;margin-top:6px;'
          + 'cursor:pointer;background:#F7FBFF;';
        var rt = document.createElement('div');
        rt.style.cssText = 'font-size:14.5px;font-weight:700;color:#1F699E;';
        rt.textContent = 'Add this to my list';
        var rw = document.createElement('div');
        rw.style.cssText = 'font-size:13px;color:#6B7A8D;';
        rw.textContent = typed;
        r.appendChild(rt); r.appendChild(rw);
        var ask = document.createElement('div');
        r.addEventListener('click', function(){
          gpAddNew(typed, ask, function(){ search.value = ''; results.innerHTML = ''; });
        });
        results.appendChild(r);
        results.appendChild(ask);
      }
    });

    // WHAT YOU CAN PICK COMES FIRST, WHAT YOU PICKED SITS UNDER IT. Jessie, 2026-09-15: "for What do you enjoy? put the
    // options above the selections" and, of A skill / A thing / A space / + Other, "above the selections made". The chosen
    // words are built first so everything can draw into them; this moves them to the foot of the block.
    box.appendChild(chosen);
    chosen.style.marginBottom = '0';
    chosen.style.marginTop = '26px';
    // Anything already answered shows the moment the screen is built, not on the first tap.
    repaint();
    return box;
  }

  function gpChipRow(key, ta){

      row.appendChild(gpMoreBtn('More', function(){

  // ---- A face, before the words -------------------------------------------
  // This lives here rather than on the sign-up page on purpose. Somebody who gives up on
  // sign-up was never here; somebody who gives up on this page is already in and can come back
  // to it whenever they like. So the optional things belong on this side of the door.
  var PHOTO_URL = 'https://cw-photos.jessieupp.workers.dev';
  var _gpPhotoToken = '';

  // The same session the profile editor asks for. Signing up wrote it under both names, so
  // either will do and neither means asking somebody for a second code.
  function gpToken(){
    if (_gpPhotoToken) return _gpPhotoToken;
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.t && (!o.exp || o.exp > Date.now())) { _gpPhotoToken = o.t; return _gpPhotoToken; }
      }
      var t2 = localStorage.getItem('cw-token') || '';
      var who = String(localStorage.getItem('cw-id') || '').split('.').join('').toLowerCase();
      if (t2 && who && who === norm) {
        var exp = parseInt(String(t2).split('.')[1], 10);
        if (exp && Date.now() <= exp - 60000) { _gpPhotoToken = t2; return _gpPhotoToken; }
      }
    } catch (e) {}
    return '';
  }

  var GP_REGIONS = ['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];

  var GP_US = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _gpLoc = { region:'', country:'', state:'' };
  // COUNTY AND CITY, optional, on the rail (2026-09-15). Jessie: "add location fields to welcome". Picked from the site's own
  // lists for the state (getPlaces, held at the edge), saved to Info.county and Info.city.
  var _gpPlace = { county: '', city: '', postal: '' }, _gpPlaces = null, _gpPlacesP = null;
  var GP_US_ABBR = {"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};
  function gpPlacesOnce(){
    if (!_gpPlacesP) _gpPlacesP = fetch(GS_URL + '?action=getPlaces').then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.counties) { _gpPlaces = d; gpRenderLoc(); } else { _gpPlacesP = null; } })
      .catch(function(){ _gpPlacesP = null; });
    return _gpPlacesP;
  }
  // The place is held as one plain string, so it has to be read back into the three levels the
  // picker draws. Without this it was saved on every visit and asked for on every visit.
  function gpLocFrom(str){
    var v = String(str || '').trim();
    if (!v) return;
    var parts = v.split(',').map(function(x){ return x.trim(); });
    if (parts.length > 1 && parts[parts.length - 1] === 'United States') {
      var st = parts[0];
      if (GP_US.indexOf(st) > -1) { _gpLoc = { region:'North America', country:'United States', state:st }; return; }
    }
    if (GP_NA.indexOf(v) > -1) { _gpLoc = { region:'North America', country:v, state:'' }; return; }
    if (GP_REGIONS.indexOf(v) > -1) { _gpLoc = { region:v, country:'', state:'' }; return; }
  }
  // A part-made choice stores nothing. "North America" on its own says less than a blank does.
  function gpLocString(l){
    if (l.state) return l.state + ', United States';
    if (l.country && l.country !== 'United States') return l.country;
    if (l.region && l.region !== 'North America') return l.region;
    return '';
  }

    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    // Jessie, 2026-09-15, for the rail: "So the people, events, and opportunities near you can reach you."
    h.innerHTML = GP_RAIL ? 'So the people, events, and/or opportunities near you can reach you.' : 'So the people and events near you can reach you.';
    var box = document.createElement('div');
    box.id = 'gp-loc-box';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';

    // WHAT IS SHARED IS THEIRS TO SET, said where the worry arrives. Jessie, 2026-09-15: "Maybe explain how they ahve
    // the ability to control their level of engagement and info shared (such as name, photo, location, and profile
    // info) within the permissions tab." It sits between the question and the pickers, because the moment somebody is
    // asked where they live is the moment they wonder who will see it.
    if (GP_RAIL) {
      var note = document.createElement('div');
      note.style.cssText = 'font-size:13px;color:#4B5A6D;line-height:1.55;background:#F7FBFF;border:1px solid #C9DFF3;border-radius:10px;padding:10px 12px;margin:0 0 14px;';
      note.innerHTML = 'You decide how much of this anyone sees. Your name, your photo, your location, and your profile '

  function gpRenderLoc(){
    var box = document.getElementById('gp-loc-box');

    var l = _gpLoc, ss = 'font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #DDE3EA;border-radius:10px;background:#F7FBFF;color:#1A2E42;';
    var sel = function(id, list, val, ph){
      var h = '<select id="' + id + '" style="' + ss + '"><option value="">' + ph + '</option>';
      list.forEach(function(x){ h += '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>'; });
      return h + '</select>';
    };
    var html = sel('gp-loc-region', GP_REGIONS, l.region, 'Select region…');
    if (l.region === 'North America') html += sel('gp-loc-country', GP_NA, l.country, 'Select country…');
    if (l.region === 'North America' && l.country === 'United States') html += sel('gp-loc-state', GP_US, l.state, 'Select state…');
    var _ab = GP_RAIL && l.state ? GP_US_ABBR[l.state] : '';
    if (_ab) {
      if (_gpPlaces) {
        var cs = (_gpPlaces.counties[_ab] || []).slice().sort();
        var ci = (_gpPlaces.cities[_ab] || []).slice().filter(function(x, i, a){ return a.indexOf(x) === i; }).sort();
        if (_gpPlace.county && cs.indexOf(_gpPlace.county) < 0) cs.push(_gpPlace.county);
        if (cs.length) html += sel('gp-loc-county', cs, _gpPlace.county, 'County (optional)');
        html += '<input id="gp-loc-city" list="gp-loc-cities" placeholder="City (optional)" value="' + _gpEsc(_gpPlace.city || '') + '" style="' + ss + 'min-width:180px;">'
          + '<datalist id="gp-loc-cities">' + ci.map(function(c){ return '<option value="' + _gpEsc(c) + '">'; }).join('') + '</datalist>';
      } else { gpPlacesOnce(); }
    }
    // A POSTAL CODE, row 206, 2026-09-15. Jessie: "do we have zip code on location too for intro and account?" My account
    // has asked for one for months and this page did not, so the two pages asked for different parts of one place. It is
    // its own answer: the site's place list holds no postal codes, so it can never fill county or city.
    if (GP_RAIL && gpLocString(l)) {
      html += '<input id="gp-loc-postal" inputmode="text" autocomplete="postal-code" placeholder="Postal code (optional)" value="'
        + _gpEsc(_gpPlace.postal || '') + '" style="' + ss + 'min-width:150px;max-width:180px;">';

    var ct = box.querySelector('#gp-loc-country');

    var st = box.querySelector('#gp-loc-state');

  }

  // ACTUAL FACES, NOT SHAPES (row 204, 2026-09-15). Jessie, of the shapes I drew: "I don't like the avatars at all you

  //
  // Looked at gobrunch.com: what it shows are PHOTOGRAPHS of real people, in circles, seated in a drawn room. There is
  // no way to get a photograph of somebody who has not given us one, and a Creative Commons photo of a real stranger
  // used as somebody else's face is showing one person as another. So that door is closed, and it should stay closed.
  //
  // What is open is illustrated people, which is what every platform that does this actually uses. Checked on
  // dicebear.com, 2026-09-15, licence by licence:
  //
  //   open-peeps   Pablo Stanley,          CC0 1.0      hand-drawn, diverse, mix-and-match hair and expressions
  //   notionists   Zoish,                  CC0 1.0      hand-drawn black line, half body, small props
  //   personas     Draftbit,               CC BY 4.0    flat, skin shading, varied hair, facial hair, glasses
  //
  // CC0 needs no attribution at all. CC BY 4.0 needs a credit line somewhere on the site.
  //
  // THIS PREVIEW CALLS api.dicebear.com so the real artwork can be looked at today. That is a third-party call and it
  // is not how this would ship: the library is self-hosted if any of it is adopted, so no viewer's address ever reaches
  // another company. Nobody sees any of this without ?avatar=1.
  var GP_AV_STYLES = [
    ['open-peeps', 'Open Peeps', 'Pablo Stanley, CC0 — no credit needed'],
    ['notionists', 'Notionists', 'Zoish, CC0 — no credit needed'],
    ['personas',   'Personas',   'Draftbit, CC BY 4.0 — needs a credit line']
  ];
  function gpAvatarUrl(style, seed, size){
    return 'https://api.dicebear.com/10.x/' + style + '/svg?seed=' + encodeURIComponent(seed) + '&size=' + (size || 76);
  }
  function gpAvatarBlock(wrap){
    var box = wrap.querySelector('#gp-avatar-box'); if (!box) return;
    var esc = _gpEsc, seed = String(meId || 'somebody');
    var others = ['Kristi', 'Doug', 'Karin', 'Lowell'];
    box.innerHTML =
      '<div style="border:1.5px solid #C9DFF3;background:#F7FBFF;border-radius:12px;padding:14px 16px;">'
      + '<div style="font-size:14px;font-weight:800;color:#1A2E42;margin-bottom:4px;">Or use an avatar</div>'
      + '<div style="font-size:13px;color:#6B7A8D;line-height:1.55;margin-bottom:14px;">Drawn people, not photographs. '
      + 'A photograph of a real stranger standing in for you would be showing one person as another, so that is out. '
      + 'Each of these is worked out from your own id, so the same person always gets the same face.</div>'
      + GP_AV_STYLES.map(function(st){
          return '<div style="margin-bottom:16px;">'
            + '<div style="font-size:13px;font-weight:800;color:#1A2E42;">' + esc(st[1]) + '</div>'
            + '<div style="font-size:12px;color:#6B7A8D;margin-bottom:8px;">' + esc(st[2]) + '</div>'
            + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
            + '<div style="width:76px;height:76px;border-radius:50%;overflow:hidden;border:1.5px solid #DDE3EA;background:#fff;">'
            +   '<img alt="Your avatar" src="' + gpAvatarUrl(st[0], seed, 76) + '" style="width:100%;height:100%;display:block;">'
            + '</div>'

  // Shrunk here, in the browser, so a photo straight off a phone camera never crosses the wire
  // at full size. An 8.4MB source came out at 6KB in testing.
  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

    if (!_who && meId) {

    box.innerHTML = '';
    // Step 0. The photo, and the promise that goes with asking for it.

    _s0.appendChild(gpPhotoBlock());
    var _pn = document.createElement('div');

    _pn.textContent = 'Your photo is only shown inside groups you join or start. It is not on the open web '

    if (!GP_BROWSE) _s0.appendChild(_pn);
    var _lg = gpLanguagesBlock(); _lg.id = 'gp-langs-block'; _s0.appendChild(_lg);

    GP_INTRO_Q.forEach(function(q, i){
      var wrap = document.createElement('div');

      (function(){

        if (!already.length) return;
        var conf = GP_CHIPS[q.key]; if (!conf) return;
        var all = [];
        (conf.words || []).forEach(function(w){ all.push(w); });
        (conf.more  || []).forEach(function(w){ all.push(w); });
        (conf.lenses|| []).forEach(function(l){

        all.forEach(function(w){

      // Enjoy, skills, values each get a screen. Needs and haves share the last question screen,

  function gpSaveIntro(){
    var stat = document.getElementById('gp-intro-status');
    if (gpViewingSomebodyElse()) {
      if (stat) {
        stat.style.color = '#6B7A8D';
        stat.textContent = 'You are looking as somebody else, so nothing is saved.';
      }
      gpBuildPreview();
      gpShowStep(GP_LAST);
      return;
    }
    if (!window._gpLoaded) { gpLoadNote(); return; }   // 2026-09-13: never a save of empty boxes over saved answers
    // 2026-08-30: this was gp-intro-go until the footer became a step bar. A null here threw
    // before the fetch, so pressing save did nothing at all and said nothing either.
    var btn = document.getElementById('gp-step-next');
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    // Nothing is refused. This page invites, and the gate lives on joining a group, where an
    // empty profile actually costs the other people in the room something. Decided 2026-08-30.
    btn.disabled = true;
    stat.style.color = '#6B7A8D';
    stat.textContent = 'Loading your profile…';
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      // Taking a word off with the cross has to take it off the sheet too, and it only can when
      // the page is holding the whole list. It says so here, and only after a load that worked.
      + (window._gpLoaded ? '&tagsMode=replace' : '')
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages=' + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods=' + encodeURIComponent(picked(_gpMethodPicked, '|'));
    // THE LISTS ARE THE RECORD; THE SENTENCE COLUMNS ARE LEFT AS THEY WERE WRITTEN (2026-09-15). ikigai.introNeed and the
    // other four held a copy of the same answers, rebuilt from the lists on every save, which is where stale words hid: the
    // work values got into Jessie's Needs sentence that way (n124, n126). On the rail the tags are sent and these are not, so
    // somebody's own words stay exactly as they typed them and the lists are the live answer.
    GP_INTRO_Q.forEach(function(q){
      if (GP_RAIL) return;
      qs += '&' + q.key + '=' + encodeURIComponent(q.key === 'introOffer' ? gpOfferParts().introOffer : val(q.key));
    });
    // The tags, beside the sentence rather than instead of it. Without these somebody can answer
    // every question and stay invisible to matching, because matching reads these columns and
    // never reads the sentence. Pipe separated, which is how every other list on ikigai is held.
    // Everything showing on the screen, not only what was tapped in this visit. A word loaded
    // from the sheet and left alone has to come back, or replacing would drop it.
    var tagFor = function(k){
      var el = document.getElementById('gp-intro-' + k);
      var orig = _gpOrig[k] || {};
      return String((el && el.value) || '').split(',').map(function(x){ return x.trim(); })
        .filter(Boolean)
        // Send back exactly what arrived, level and all, unless it is a word added just now.
        .map(function(w){ return orig[w.toLowerCase()] || w; })
        .join('|');
    };
    qs += '&needsTags='     + encodeURIComponent(gpRailNeeds(tagFor('introNeed')))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(gpSkillsWithOffers(tagFor('introSkills')))
        + '&valuesTags='    + encodeURIComponent(gpSplitCare(tagFor('introValues')).values)
        + '&domainsTags='   + encodeURIComponent(gpRailSectors(gpSplitCare(tagFor('introValues')).domains))
        + gpRailExtraQs()
        + '&location='      + encodeURIComponent(gpLocString(_gpLoc));
    if (window._gpLoaded) qs += '&havesTags=' + encodeURIComponent(gpOfferParts().havesTags)
      + '&openToPaidWork=' + encodeURIComponent(gpOtwList('paid').join('|'))
      + '&openToUnpaidTime=' + encodeURIComponent(gpOtwList('unpaidTime').join('|'))
      + '&openToUnpaidWork=' + encodeURIComponent(gpOtwList('unpaid').join('|'))
      + '&servesWho=' + encodeURIComponent(Object.keys(_gpServe).filter(function(k){ return _gpServe[k]; }).join('|'));
    fetch(GS_URL + '?' + qs)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || (d.status !== 'ok' && d.ok !== true)) {
          btn.disabled = false;
          stat.style.color = '#7A2410';
          stat.textContent = (d && d.message) || 'Could not save just now. Try again in a moment.';
          return;
        }
        stat.textContent = '';
        if (window._gpJoinNow && /\/group/.test(_next)) { _introDone(); return; }   // Join now (?req=1)
        gpBuildPreview();
        gpShowStep(GP_LAST);
      })
      .catch(function(){
        btn.disabled = false;
        stat.style.color = '#7A2410';
        stat.textContent = 'Could not reach the server. Try again in a moment.';
      });
  }


  // Back goes back one screen. It used to leave the intro entirely and drop somebody on the
  // group they were joining, which looked like being thrown out halfway through. Doug did that
  // on 2026-08-31 and could not carry on. It only leaves from the first screen, where there is
  // nothing behind it.
  document.getElementById('intro-back').addEventListener('click', function(){
    if (_gpStep > 0) { gpShowStep(_gpStep - 1); return; }
    window.location.href = _next;
  });
  // The last screen. Somebody has just answered six questions and has never once seen what any
  // of it looks like from the outside, which is the only view that matters to anybody else.
  // YOUR ANSWERS ON THE RAIL. Jessie, 2026-09-15: "put needs at the very top", "put speaks IN skills with a Speaks:", "What
  // work gives me to Work experience I'm creating" and "show Open to work above Work experience I'm creating".
  function gpRailPreviewRows(row, val, esc, langs, show){
    if (!show) show = function(){ return true; };
    var picked = function(m){ return Object.keys(m || {}).filter(function(k){ return m[k]; }); };
    var skills = val('introSkills');
    var skillsHtml = (skills ? esc(skills) : '')
      + (langs ? '<div style="' + (skills ? 'margin-top:4px;' : '') + '"><b>Speaks:</b> ' + esc(langs) + '</div>' : '');
    var otw = [
      picked(_gpOtw.paid).length ? 'Paid: ' + picked(_gpOtw.paid).join(', ') : '',
      picked(_gpOtw.unpaidTime).length ? 'Non-paid time: ' + picked(_gpOtw.unpaidTime).join(', ') : '',
      picked(_gpOtw.unpaid).length ? 'Non-paid: ' + picked(_gpOtw.unpaid).join(', ') : ''
    ].filter(Boolean);
    var otwHtml = window._gpOTW ? otw.map(function(l){ return '<div>' + esc(l) + '</div>'; }).join('') : '';
    var r = function(k, html){ return show(k) ? html : ''; };
    return r('needs', row('Needs', val('introNeed')))
      + r('enjoy', row('Enjoys', val('introEnjoy')))
      + r('skills', row('Skills', '', skillsHtml))
      + r('offers', row('Offerings', gpOfferNames('space').concat(gpOfferNames('thing')).join(', ')))
      + (GP_V2
          ? r('care', row('What I care about', gpSplitCare(val('introValues').split(',').map(function(x){ return x.trim(); }).filter(Boolean).join('|')).values.split('|').join(', ')))
            + r('sectors', row('Sectors', picked(_gpSectors).join(', ')))
          : r('care', row('Cares about', val('introValues'))))
      + r('otw', row('Open to work', '', otwHtml))
      + r('work', row('Work experience I\u2019m creating', picked(_gpWork).join(', ')))
      + (GP_V2 ? r('purpose', row('My purpose', gpRailPurpose())) : '');
  }
  function gpBuildPreview(){
    var el = document.getElementById('gp-preview');
    if (!el) return;
    var who = '';
    try { who = String(localStorage.getItem('cw-first') || '').trim(); } catch (e) {}
    var photo = '';
    var img = document.querySelector('#gp-photo-face img');
    if (img) photo = img.getAttribute('src') || '';
    var val = function(k){ var t = document.getElementById('gp-intro-' + k); return t ? String(t.value || '').trim() : ''; };
    var esc = function(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    var row = function(label, text, html){
      if (!text && !html) return '';
      return '<div style="padding:14px 0;border-top:1px solid #f0f1f5;">'
        + '<div style="font-size:12px;font-weight:800;color:#6B7A8D;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;">' + label + '</div>'
        + '<div style="font-size:14.5px;color:#1A2E42;line-height:1.55;">' + (html || esc(text)) + '</div></div>';
    };
    var langs = Object.keys(_gpLangPicked || {}).filter(function(k){ return _gpLangPicked[k]; }).join(', ');
    el.innerHTML =
      // One line where it fits. Jessie, 2026-09-15: "is wrapping funny - make it right": it stopped at 60 characters.
      '<div style="font-size:13.5px;color:#6B7A8D;margin-bottom:16px;line-height:1.55;">'
      + 'This is how you look to somebody in a group you join. You can change any of it later from '
      + 'your profile.</div>'
      + '<div style="display:flex;align-items:center;gap:16px;">'
      + (photo
          ? '<img src="' + photo + '" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:1.5px solid #DDE3EA;">'
          : '<div style="width:76px;height:76px;border-radius:50%;background:#EDF3F9;border:1.5px solid #DDE3EA;"></div>')
      + '<div><div style="font-size:22px;font-weight:800;color:#1A2E42;">' + esc(who || 'You') + '</div>'
      + (gpLocString(_gpLoc) ? '<div style="font-size:14px;color:#6B7A8D;">' + esc(gpLocString(_gpLoc)) + '</div>' : '')
      + '</div></div>'
      + '<div style="margin-top:14px;">'
      + (GP_RAIL ? gpRailPreviewRows(row, val, esc, langs)
         : row('Enjoys', val('introEnjoy'))
           + row('Skills', val('introSkills'))
           + row('Cares about', val('introValues'))
           + row('Needs', val('introNeed'))
           + row('Has to offer', val('introOffer'))
           + row('Speaks', langs))
      + '</div>'
      // Go in takes somebody where they were headed, which for a person arriving from a group
      // link is that group. The other doors are on one page already, so this points at it
      // rather than printing a second copy of the same six choices.
      + (GP_BROWSE
          ? '<div style="margin-top:18px;font-size:14px;color:#6B7A8D;">Or '
            + '<a id="gp-where-start" href="/welcome/" style="color:#1F699E;font-weight:700;">'
            + 'pick somewhere to start</a>.</div>'
          : '');
