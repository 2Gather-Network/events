    f.innerHTML = '<img src="' + url + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    var b = document.getElementById('gp-photo-btn'); if (b) b.textContent = 'Change photo';
    // Step 0 will not let anybody past without one, so the moment a face lands the door opens.
    window._gpPhotoUp = true;
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }

  // ── Location, 2026-08-30 ──────────────────────────────────────────────────
  // Ported from My account rather than invented again, so somebody meets the same picker in both
  // places and a stored value reads the same way. Held as one plain string, "Washington, United
  // States", so anything showing a profile can print it without knowing the three levels.
  var GP_REGIONS = ['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var GP_NA = ['United States','Canada','Mexico'];
  var GP_US = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _gpLoc = { region:'', country:'', state:'' };
  // The place is held as one plain string, so it has to be read back into the three levels the
  // picker draws. Without this it was saved on every visit and asked for on every visit.
  function gpLocFrom(str){
    var v = String(str || '').trim();
    if (!v) return;
    var parts = v.split(',').map(function(x){ return x.trim(); });
    if (parts.length > 1 && parts[parts.length - 1] === 'United States') {
      var st = parts[0];
      if (GP_US.indexOf(st) > -1) { _gpLoc = { region:'North America', country:'United States', state:st }; return; }
    }
    if (GP_NA.indexOf(v) > -1) { _gpLoc = { region:'North America', country:v, state:'' }; return; }
    if (GP_REGIONS.indexOf(v) > -1) { _gpLoc = { region:v, country:'', state:'' }; return; }
  }
  // A part-made choice stores nothing. "North America" on its own says less than a blank does.
  function gpLocString(l){
    if (l.state) return l.state + ', United States';
    if (l.country && l.country !== 'United States') return l.country;
    if (l.region && l.region !== 'North America') return l.region;
    return '';
  }
  function gpLocationBlock(){
    var wrap = document.createElement('div');
    wrap.setAttribute('data-gp-loc','1');
    wrap.style.cssText = 'padding:18px 0 0;border-top:1px solid #f0f1f5;margin-top:18px;';
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = 'Where are you?';
    var h = document.createElement('div');
    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    h.textContent = 'So the people and events near you can reach you.';
    var box = document.createElement('div');
    box.id = 'gp-loc-box';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
    wrap.appendChild(t); wrap.appendChild(h); wrap.appendChild(box);
    gpRenderLoc();
    return wrap;
  }
  function gpRenderLoc(){
    var box = document.getElementById('gp-loc-box');
    if (!box) { setTimeout(gpRenderLoc, 0); return; }
    var l = _gpLoc, ss = 'font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #DDE3EA;border-radius:10px;background:#F7FBFF;color:#1A2E42;';
    var sel = function(id, list, val, ph){
      var h = '<select id="' + id + '" style="' + ss + '"><option value="">' + ph + '</option>';
      list.forEach(function(x){ h += '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>'; });
      return h + '</select>';
    };
    var html = sel('gp-loc-region', GP_REGIONS, l.region, 'Select region…');
    if (l.region === 'North America') html += sel('gp-loc-country', GP_NA, l.country, 'Select country…');
    if (l.region === 'North America' && l.country === 'United States') html += sel('gp-loc-state', GP_US, l.state, 'Select state…');
    box.innerHTML = html;
    var rg = box.querySelector('#gp-loc-region');
    if (rg) rg.onchange = function(){
      _gpLoc = { region: rg.value, country: '', state: '' };
      if (rg.value === 'North America') _gpLoc.country = 'United States';
      gpRenderLoc(); gpStepPaint();
    };
    var ct = box.querySelector('#gp-loc-country');
    if (ct) ct.onchange = function(){ _gpLoc.country = ct.value; _gpLoc.state = ''; gpRenderLoc(); gpStepPaint(); };
    var st = box.querySelector('#gp-loc-state');
    if (st) st.onchange = function(){ _gpLoc.state = st.value; gpRenderLoc(); gpStepPaint(); };
  }

  function gpPhotoBlock(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:16px;padding:0 0 18px;flex-wrap:wrap;';
    wrap.innerHTML =
      '<div id="gp-photo-face" style="width:76px;height:76px;border-radius:50%;overflow:hidden;'
      + 'background:#EDF3F9;border:1.5px solid #DDE3EA;flex-shrink:0;display:flex;align-items:center;'
      + 'justify-content:center;font-size:26px;">\u{1F331}</div>'
      + '<div style="min-width:0;">'
      + '<div style="font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;">Your photo</div>'
      + '<div id="gp-photo-hint" style="font-size:13.5px;color:#6B7A8D;line-height:1.5;margin-bottom:8px;">'
      + (GP_BROWSE ? 'A professional photo helps members recognize you when you show up.</div>'
                   : 'A professional photo helps people recognize you when you show up.</div>')
      + (GP_BROWSE
          ? '<div style="font-size:13.5px;color:#6B7A8D;line-height:1.5;margin-bottom:8px;">'
            + (GP_FOR === 'event'
                ? 'Your photo is needed to register for an event that has a bulletin board.'
                : 'Your photo is needed to join a group.')
            + '</div>'
          : '')
      + '<button type="button" id="gp-photo-btn" style="font:inherit;font-size:13.5px;font-weight:700;'
      + 'padding:8px 16px;border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;'
      + 'cursor:pointer;">Add a photo</button>'
      + '<div id="gp-photo-stat" style="font-size:13px;color:#6B7A8D;margin-top:6px;"></div>'
      + '</div>';
    var btn = wrap.querySelector('#gp-photo-btn');
    btn.addEventListener('click', gpChoosePhoto);
    // Already have one? Show it rather than inviting them to add what they have.
    //
    // "Add a photo" beside an empty circle is a claim that somebody has no photo, and until the
    // lookup lands that claim is a guess. lookupProfile has been measured at 39 seconds, so the
    // guess was on screen for most of a minute and it was wrong for anybody who has one.
    //
    // Three things now happen instead. The face the photo Worker holds is asked for first,
    // because it answers in about a tenth of a second with no backend in the way. The slow
    // lookup still runs, for a photo stored somewhere other than R2. And until one of them
    // answers, the button says nothing at all.
    if (GP_BROWSE && meId) {
      var _face = wrap.querySelector('#gp-photo-face');
      var _btn2 = wrap.querySelector('#gp-photo-btn');
      var _hint = wrap.querySelector('#gp-photo-hint');
      _face.innerHTML = '';
      _btn2.style.display = 'none';
      if (_hint) _hint.textContent = 'Looking for your photo\u2026';
      var _settled = false;
      // A photo that lands after we have given up still gets shown. Saying "add a photo" and
      // then quietly showing the one they have is better than never showing it.
      var _late = function(url){
        if (!url) return;
        try { localStorage.setItem('cw-photo-' + meId, url); } catch (e) {}
        gpPhotoShow(url);
      };
      var _settle = function(url){
        if (_settled) { _late(url); return; }
        _settled = true;
        _btn2.style.display = '';
        if (_hint) _hint.textContent = 'A professional photo helps members recognize you when you show up.';
        window._gpPhotoKnown = true;
        if (url) {
          try { localStorage.setItem('cw-photo-' + meId, url); } catch (e) {}
          gpPhotoShow(url);
        } else {
          _face.innerHTML = '\u{1F331}';
          if (typeof gpStepPaint === 'function') gpStepPaint();
        }
      };
      // A photo seen before paints at once, so a return visit never waits at all.
      var _seen = '';
      try { _seen = localStorage.getItem('cw-photo-' + meId) || ''; } catch (e) {}
      // On the next tick, because gpPhotoShow finds the circle by id and this block is not on
      // the page yet. Painting straight away looked instant and drew nothing at all.
      if (_seen) setTimeout(function(){ _settle(_seen); }, 0);

      var _direct = PHOTO_URL + '/p/' + encodeURIComponent(meId) + '?v=' + Date.now();
      var _probe = new Image();
      _probe.onload  = function(){ _settle(_direct); };
      _probe.onerror = function(){
        // Not in R2. The slow lookup is the only thing left that could know, so wait for it.
        fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(meId))
          .then(function(r){ return r.json(); })
          .then(function(d){ _settle((d && d.photo) || ''); })
          .catch(function(){ _settle(''); });
      };
      _probe.src = _direct;
      // Nobody waits forever. After eight seconds we say we do not have one, which is at worst
      // an invitation to add a photo they already have.
      setTimeout(function(){ _settle(''); }, 6000);
    } else if (meId) {
      fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.photo) gpPhotoShow(d.photo); })
        .catch(function(){});
    }
    return wrap;
  }

  function gpChoosePhoto(){
    if (!meId) { gpPhotoStat('This device does not know who you are yet.'); return; }
    if (!gpToken()) { gpPhotoStat('Sign in again and your photo will go straight up.'); return; }
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){ var f = inp.files && inp.files[0]; if (f) gpShrinkPhoto(f); };
    inp.click();
  }

  // Shrunk here, in the browser, so a photo straight off a phone camera never crosses the wire
  // at full size. An 8.4MB source came out at 6KB in testing.
  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

  function gpSendPhoto(blob){
    gpPhotoStat('Sending\u2026');
    fetch(PHOTO_URL + '/upload?id=' + encodeURIComponent(meId), {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg', 'x-cw-token': gpToken() },
      body: blob
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || d.status !== 'ok' || !d.url) { gpPhotoStat((d && d.message) || 'That did not go through.'); return; }
      gpPhotoShow(d.url + '?v=' + Date.now());
      gpPhotoStat('');
      // Only photoURL is sent, and saveIntake leaves alone anything it was not given, so this
      // cannot touch an answer somebody has already written.
      fetch(GS_URL + '?action=saveIntake&appearId=' + encodeURIComponent(meId)
            + '&secure=1&editToken=' + encodeURIComponent(gpToken())
            + '&photoURL=' + encodeURIComponent(d.url)).catch(function(){});
    }).catch(function(){ gpPhotoStat('That did not go through.'); });
  }

  // ── One thing at a time, 2026-08-30 ───────────────────────────────────────
  // Five questions in a column is a form. One question on a screen is a conversation, and it is
  // the difference between somebody answering three of them and answering all of them.
  //
  // Step 0 is the only wall on the site: a photo, a language and a place. Everything after it is
  // asked properly and can be left, because the gate that matters is joining a group.
  var GP_STEP_TITLES = [
    'First, so people can recognise you',
    (typeof GP_BROWSE !== 'undefined' && GP_BROWSE) ? 'What brings you joy?' : 'What do you enjoy?',
    (typeof GP_BROWSE !== 'undefined' && GP_BROWSE)
      ? 'What skills pay the bills and how do you like helping others?'
      : 'What skills pay the bills?',
    'What do you care about?',
    'Anything you need, or have to offer?'
  ].concat((typeof GP_BROWSE !== 'undefined' && GP_BROWSE)
    // How do you like to be thanked has moved, so it is not a screen here any more and the
    // profile is what comes after the last question.
    ? ['This is your profile']
    : ['How do you like to be thanked?', 'This is your profile']);
  var _gpStep = 0;
  var GP_LAST = GP_STEP_TITLES.length - 1;
  var GP_LEDE_BASE = 'Other ' + (GP_FOR === 'event' ? 'event attendees' : 'group members')
    + ' would like to get to know you! Your answers help others find you and puts the right '
    + 'people in front of you. Everything saves as you go.';
  // Needs and haves, and how you like to be thanked. The two nobody has to answer.
  var GP_OPTIONAL_STEPS = { 4:1, 5:1 };

  // What counts as an answer: a tapped word, or something typed. Either half is an answer,
  // so somebody who wrote in prose is never told they have answered nothing.
  var GP_REQUIRED_STEPS = { 1:{ key:'introEnjoy',  miss:'one thing you enjoy' },
                            2:{ key:'introSkills', miss:'one skill' },
                            3:{ key:'introValues', miss:'one thing you care about' } };
  function gpAnswered(key){
    var tags = (_gpTags && _gpTags[key]) ? Object.keys(_gpTags[key]).length : 0;
    if (tags) return true;
    var el = document.getElementById('gp-intro-' + key);
    return !!(el && String(el.value || '').trim());
  }
  function gpStepOK(n){
    if (GP_BROWSE && GP_REQUIRED_STEPS[n]) return gpAnswered(GP_REQUIRED_STEPS[n].key);
    if (n !== 0) return true;
    // The three that step 0 asks for. The photo is the strongest ask on the site and it is made
    // here, once, while somebody is still arriving.
    var hasPhoto = !!(window._gpPhotoUp || document.querySelector('#gp-photo-face img'));
    var hasLang  = Object.keys(_gpLangPicked || {}).some(function(k){ return _gpLangPicked[k]; });
    var hasLoc   = !!gpLocString(_gpLoc);
    return hasPhoto && hasLang && hasLoc;
  }
  function gpStepMissing(){
    var out = [];
    if (!(window._gpPhotoUp || document.querySelector('#gp-photo-face img'))) out.push('a photo');
    if (!Object.keys(_gpLangPicked || {}).some(function(k){ return _gpLangPicked[k]; })) out.push('a language');
    if (!gpLocString(_gpLoc)) out.push('where you are');
    return out;
  }

  function gpStepPaint(){
    var next = document.getElementById('gp-step-next');
    var back = document.getElementById('gp-step-back');
    var note = document.getElementById('gp-step-note');
    var count = document.getElementById('gp-step-count');
    var title = document.getElementById('gp-intro-title');
    // Coming back to the first screen used to leave the last question's heading up there, so
    // the photo screen introduced itself as whatever somebody had just answered.
    if (title) title.textContent = (_gpStep > 0)
      ? GP_STEP_TITLES[_gpStep]
      : (window._gpWelcome || GP_STEP_TITLES[0]);
    if (count) count.textContent = (_gpStep < GP_LAST) ? ((_gpStep + 1) + ' of ' + GP_LAST) : '';
    if (back) back.style.display = _gpStep === 0 ? 'none' : '';
    var skip = document.getElementById('gp-step-skip');
    // Skipping needs and haves is a choice somebody makes, not a thing they miss, so it is a
    // control on the screen rather than an absence of one.
    if (skip) skip.style.display = (_gpStep === 4) ? '' : 'none';
    if (!next) return;
    if (_gpStep === GP_LAST) { next.textContent = 'Go in'; next.disabled = false; }
    else if (_gpStep === GP_LAST - 1) {
      next.textContent = GP_BROWSE ? 'View my profile' : 'Save and see my profile';
      next.disabled = false;
    }
    else { next.textContent = 'Next'; next.disabled = !gpStepOK(_gpStep); }
    next.style.opacity = next.disabled ? '.55' : '1';
    next.style.cursor = next.disabled ? 'default' : 'pointer';
    if (note) {
      var miss = (_gpStep === 0) ? gpStepMissing() : [];
      // Do not list a photo as missing before we have looked for one.
      if (GP_BROWSE && _gpStep === 0 && !window._gpPhotoKnown && !window._gpPhotoUp) {
        miss = miss.filter(function(m){ return m !== 'a photo'; });
        miss.unshift('looking for your photo');
      }
      var _req = GP_BROWSE ? GP_REQUIRED_STEPS[_gpStep] : null;
      if (_req && !gpAnswered(_req.key)) miss = [_req.miss];
      note.textContent = miss.length ? ('Still to add: ' + miss.join(', ') + '.') : '';
      // 6. What is left to add is a reminder, not a telling-off, so it is grey like the count.
      if (GP_BROWSE) note.style.color = '#6B7A8D';
    }
    if (GP_BROWSE) {
      // One thing at a time. The next block is not on screen until the one before it has been
      // answered, so nobody meets four questions stacked up at once.
      var _picked = function(m){ return Object.keys(m || {}).some(function(k){ return m[k]; }); };
      var reveal = function(id, ok){
        var el = document.getElementById(id); if (!el) return;
        // gpShowStep owns anything that is a step of its own, so never fight it.
        var st = el.getAttribute('data-gp-step');
        if (st !== null && String(st) !== String(_gpStep)) return;
        el.style.display = ok ? '' : 'none';
      };
      // Step 0 shows all three at once. Chaining them there was mine and not asked for.
      reveal('gp-methods-block', gpAnswered('introSkills'));

      // The welcome is said once, on the way in. On a question screen the question is the
      // whole of it, and the only thing worth adding is on the two nobody has to answer.
      var lede = document.getElementById('gp-intro-lede');
      if (lede) {
        if (_gpStep === 0) { lede.style.display = ''; lede.innerHTML = GP_LEDE_BASE; }
        else { lede.style.display = 'none'; lede.innerHTML = ''; }
      }
    }
  }

  function gpShowStep(n){
    _gpStep = Math.max(0, Math.min(GP_LAST, n));
    var all = document.querySelectorAll('[data-gp-step]');
    Array.prototype.forEach.call(all, function(el){
      el.style.display = (String(el.getAttribute('data-gp-step')) === String(_gpStep)) ? '' : 'none';
    });
    gpStepPaint();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function gpRenderIntro(prefill){
    var box = document.getElementById('gp-intro-qs');
    if (!box) return;
    // Everybody is greeted by name, not only somebody arriving straight from signing up.
    // This page invites, it does not gate, so nothing here tells anyone they must.
    var _t0 = document.getElementById('gp-intro-title');
    var _l0 = document.getElementById('gp-intro-lede');
    var _who = '';
    try { _who = String(localStorage.getItem('cw-first') || '').trim(); } catch (err) {}
    window._gpWelcome = _who ? ('Welcome, ' + _who + ' \u{1F389}') : 'Welcome \u{1F389}';
    if (_t0) _t0.textContent = window._gpWelcome;
    // A device that does not hold a name asks for one and drops it in when it lands. The
    // heading is already on screen either way, so nobody waits on this.
    if (!_who && meId) {
      fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(d){
          var nm = String((d && d.name) || '').trim().split(' ')[0];
          if (!nm) return;
          try { localStorage.setItem('cw-first', nm); } catch (err) {}
          window._gpWelcome = 'Welcome, ' + nm + ' \u{1F389}';
          var el = document.getElementById('gp-intro-title');
          if (el && _gpStep === 0) el.textContent = window._gpWelcome;
        })
        .catch(function(){});
    }
    // Somebody arriving here is on their way into a group, so the reason is the group. The
    // "answer what you like" line is not said here, because it is only true of the optional
    // questions and gpStepPaint adds it on those screens.
    if (_l0 && GP_BROWSE) _l0.innerHTML = GP_LEDE_BASE;
    else if (_l0) _l0.innerHTML = window._gpAlreadyIn
      ? 'Nothing changes about your place here. These answers are what let people find you and '
        + 'what puts the right people in front of you, and we never asked for them. Answer what '
        + 'you like now and add the rest whenever.'
      : 'Write as much or as little as you like, in your own words. These answers are what let '
        + 'people find you and what puts the right people in front of you. Answer what you like '
        + 'now and add the rest whenever.';
    box.innerHTML = '';
    // Step 0. The photo, and the promise that goes with asking for it.
    var _s0 = document.createElement('div');
    _s0.setAttribute('data-gp-step', '0');
    _s0.appendChild(gpPhotoBlock());
    var _pn = document.createElement('div');
    _pn.style.cssText = 'font-size:13px;color:#6B7A8D;margin:-6px 0 0;max-width:60ch;line-height:1.5;';
    _pn.textContent = 'Your photo is only shown inside groups you join or start. It is not on the open web '
      + 'and it is not shown to people outside your groups.';
    if (!GP_BROWSE) _s0.appendChild(_pn);
    var _lg = gpLanguagesBlock(); _lg.id = 'gp-langs-block'; _s0.appendChild(_lg);
    var _lc = gpLocationBlock();  _lc.id = 'gp-loc-block';   _s0.appendChild(_lc);
    box.appendChild(_s0);
    GP_INTRO_Q.forEach(function(q, i){
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:18px 0;' + (i ? 'border-top:1px solid #f0f1f5;' : 'padding-top:0;');
      var t = document.createElement('div');
      t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
      t.textContent = q.q;
      var h = document.createElement('div');
      h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
      h.textContent = q.hint;
      var ta = document.createElement('textarea');
      ta.id = 'gp-intro-' + q.key;
      ta.rows = 3;
      ta.placeholder = q.ph;
      ta.value = (prefill && prefill[q.key]) || '';
      // A chip whose word is already in the box has plainly been chosen, so show it chosen.
      // Matching ignores case, because saved answers were not always stored the way the chip
      // spells it: "Community health" and "Community Health" are one answer, not two.
      (function(){
        var already = String(ta.value || '').split(',').map(function(x){
          return x.trim().toLowerCase();
        }).filter(Boolean);
        if (!already.length) return;
        var conf = GP_CHIPS[q.key]; if (!conf) return;
        var all = [];
        (conf.words || []).forEach(function(w){ all.push(w); });
        (conf.more  || []).forEach(function(w){ all.push(w); });
        (conf.lenses|| []).forEach(function(l){
          (l.words || []).forEach(function(w){ all.push(w); });
          (l.more  || []).forEach(function(w){ all.push(w); });
        });
        all.forEach(function(w){
          if (already.indexOf(String(w).toLowerCase()) > -1) {
            if (!_gpChipsPicked[q.key]) _gpChipsPicked[q.key] = {};
            _gpChipsPicked[q.key][w] = true;
          }
        });
      })();
      ta.className = 'cw-intro-box';
      ta.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
        + 'padding:12px 14px;font:inherit;font-size:14.5px;color:#1A2E42;line-height:1.5;resize:vertical;';
      // On the joy screen the card heading already asks the question, so asking it again two
      // lines down was the same words twice. The box goes with it: what somebody picks is what
      // gets saved, and the box stays in the page, unseen, as the thing that holds it.
      var _bare = gpBareKey(q.key);
      if (_bare) {
        ta.style.display = 'none';
        if (!GP_BARE_HEAD[q.key]) { wrap.appendChild(t); wrap.appendChild(h); }
        wrap.appendChild(ta);
      } else {
        wrap.appendChild(t); wrap.appendChild(h); wrap.appendChild(ta);
      }
      var chipRow = gpPicker(q.key, ta) || gpChipRow(q.key, ta);
      if (chipRow) wrap.appendChild(chipRow);
      // Enjoy, skills, values each get a screen. Needs and haves share the last question screen,
      // because they are two halves of one thought and neither is required.
      var _map = { introEnjoy:'1', introSkills:'2', introValues:'3', introNeed:'4', introOffer:'4' };
      wrap.setAttribute('data-gp-step', _map[q.key] || '4');
      box.appendChild(wrap);
      if (q.key === 'introSkills') {
        // What comes most naturally to you sits with the skills, which is what it is about.
        var _m = gpMethodsBlock();
        _m.id = 'gp-methods-block';
        _m.setAttribute('data-gp-step', '2');
        box.appendChild(_m);
      }
    });
    // Appreciation last, then the profile as everybody else sees it.
    if (!GP_BROWSE) {
      var _th = gpThanksBlock();
      _th.id = 'gp-thanks-block';
      _th.setAttribute('data-gp-step', '5');
      box.appendChild(_th);
    }
    var _pv = document.createElement('div');
    _pv.setAttribute('data-gp-step', GP_BROWSE ? '5' : '6');
    _pv.id = 'gp-preview';
    box.appendChild(_pv);
    gpShowStep(0);
  }

  function gpThanksBlock(){
    var tw = document.createElement('div');
    tw.style.cssText = 'padding:18px 0 0;border-top:1px solid #f0f1f5;';
    var tt = document.createElement('div');
    tt.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    tt.textContent = 'How do you like to get appreciated? \u{1F381}';
    var th = document.createElement('div');
    th.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    th.textContent = 'When somebody wants to give something back, this is where it lands. Pick as many as you are happy to receive.';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    GP_THANKS.forEach(function(opt){
      var b = document.createElement('button');
      b.type = 'button';
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (_gpThanksPicked[opt.value]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      b.textContent = opt.label;
      paint();
      b.addEventListener('click', function(){
        _gpThanksPicked[opt.value] = !_gpThanksPicked[opt.value];
        paint();
      });
      row.appendChild(b);
    });
    tw.appendChild(tt); tw.appendChild(th); tw.appendChild(row);
    return tw;
  }

  function gpSaveIntro(){
    var stat = document.getElementById('gp-intro-status');
    if (gpViewingSomebodyElse()) {
      if (stat) {
        stat.style.color = '#6B7A8D';
        stat.textContent = 'You are looking as somebody else, so nothing is saved.';
      }
      gpBuildPreview();
      gpShowStep(GP_LAST);
      return;
    }
    // 2026-08-30: this was gp-intro-go until the footer became a step bar. A null here threw
    // before the fetch, so pressing save did nothing at all and said nothing either.
    var btn = document.getElementById('gp-step-next');
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    // Nothing is refused. This page invites, and the gate lives on joining a group, where an
    // empty profile actually costs the other people in the room something. Decided 2026-08-30.
    btn.disabled = true;
    stat.style.color = '#6B7A8D';
    stat.textContent = 'Loading your profile…';
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      // Taking a word off with the cross has to take it off the sheet too, and it only can when
      // the page is holding the whole list. It says so here, and only after a load that worked.
      + (window._gpLoaded ? '&tagsMode=replace' : '')
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages=' + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods=' + encodeURIComponent(picked(_gpMethodPicked, '|'));
    GP_INTRO_Q.forEach(function(q){ qs += '&' + q.key + '=' + encodeURIComponent(val(q.key)); });
    // The tags, beside the sentence rather than instead of it. Without these somebody can answer
    // every question and stay invisible to matching, because matching reads these columns and
    // never reads the sentence. Pipe separated, which is how every other list on ikigai is held.
    // Everything showing on the screen, not only what was tapped in this visit. A word loaded
    // from the sheet and left alone has to come back, or replacing would drop it.
    var tagFor = function(k){
      var el = document.getElementById('gp-intro-' + k);
      var orig = _gpOrig[k] || {};
      return String((el && el.value) || '').split(',').map(function(x){ return x.trim(); })
        .filter(Boolean)
        // Send back exactly what arrived, level and all, unless it is a word added just now.
        .map(function(w){ return orig[w.toLowerCase()] || w; })
        .join('|');
    };
    qs += '&needsTags='     + encodeURIComponent(tagFor('introNeed'))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(tagFor('introSkills'))
        + '&valuesTags='    + encodeURIComponent(tagFor('introValues'))
        + '&location='      + encodeURIComponent(gpLocString(_gpLoc));
    fetch(GS_URL + '?' + qs)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || (d.status !== 'ok' && d.ok !== true)) {
          btn.disabled = false;
          stat.style.color = '#7A2410';
          stat.textContent = (d && d.message) || 'Could not save just now. Try again in a moment.';
          return;
        }
        stat.textContent = '';
        gpBuildPreview();
        gpShowStep(GP_LAST);
      })
      .catch(function(){
        btn.disabled = false;
        stat.style.color = '#7A2410';
        stat.textContent = 'Could not reach the server. Try again in a moment.';
      });
  }


  document.getElementById('intro-back').addEventListener('click', function(){ window.location.href = _next; });
  // The last screen. Somebody has just answered six questions and has never once seen what any
  // of it looks like from the outside, which is the only view that matters to anybody else.
  function gpBuildPreview(){
    var el = document.getElementById('gp-preview');
    if (!el) return;
    var who = '';
    try { who = String(localStorage.getItem('cw-first') || '').trim(); } catch (e) {}
    var photo = '';
    var img = document.querySelector('#gp-photo-face img');
    if (img) photo = img.getAttribute('src') || '';
    var val = function(k){ var t = document.getElementById('gp-intro-' + k); return t ? String(t.value || '').trim() : ''; };
    var esc = function(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    var row = function(label, text){
      if (!text) return '';
      return '<div style="padding:14px 0;border-top:1px solid #f0f1f5;">'
        + '<div style="font-size:12px;font-weight:800;color:#6B7A8D;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;">' + label + '</div>'
        + '<div style="font-size:14.5px;color:#1A2E42;line-height:1.55;">' + esc(text) + '</div></div>';
    };
    var langs = Object.keys(_gpLangPicked || {}).filter(function(k){ return _gpLangPicked[k]; }).join(', ');
    el.innerHTML =
      '<div style="font-size:13.5px;color:#6B7A8D;margin-bottom:16px;max-width:60ch;line-height:1.55;">'
      + 'This is how you look to somebody in a group you join. You can change any of it later from '
      + 'your profile.</div>'
      + '<div style="display:flex;align-items:center;gap:16px;">'
      + (photo
          ? '<img src="' + photo + '" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:1.5px solid #DDE3EA;">'
          : '<div style="width:76px;height:76px;border-radius:50%;background:#EDF3F9;border:1.5px solid #DDE3EA;"></div>')
      + '<div><div style="font-size:22px;font-weight:800;color:#1A2E42;">' + esc(who || 'You') + '</div>'
      + (gpLocString(_gpLoc) ? '<div style="font-size:14px;color:#6B7A8D;">' + esc(gpLocString(_gpLoc)) + '</div>' : '')
      + '</div></div>'
      + '<div style="margin-top:14px;">'
      + row('Enjoys', val('introEnjoy'))
      + row('Skills', val('introSkills'))
      + row('Cares about', val('introValues'))
      + row('Needs', val('introNeed'))
      + row('Has to offer', val('introOffer'))
      + row('Speaks', langs)
      + '</div>'
      // Go in takes somebody where they were headed, which for a person arriving from a group
      // link is that group. The other doors are on one page already, so this points at it
      // rather than printing a second copy of the same six choices.
      + (GP_BROWSE
          ? '<div style="margin-top:18px;font-size:14px;color:#6B7A8D;">Or '
            + '<a id="gp-where-start" href="/welcome/" style="color:#1F699E;font-weight:700;">'
            + 'pick somewhere to start</a>.</div>'
          : '');
  }

  // Next does one of three things: move on, save, or leave. Back never saves, because going
  // back to look at something should not write anything.
  // Every move forward writes what is on the screen. Nobody should be able to answer four
  // questions, close the tab, and find out none of it was kept because they never reached a
  // button at the end. Quiet on purpose: it takes nothing over and says nothing unless it fails.
  // Looking as somebody else is looking, never writing. identity.js sets `viewing` and says
  // every page that writes is expected to check it. This one did not, so pressing Next while
  // viewing as another member would have written this screen onto their row.
  function gpViewingSomebodyElse(){
    try { return !!(window.CW && CW.me && CW.me().viewing); } catch (e) { return false; }
  }

  function gpQuietSave(){
    if (!GP_BROWSE || !meId) return;
    if (gpViewingSomebodyElse()) return;
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var tagFor = function(k){
      var el = document.getElementById('gp-intro-' + k);
      var orig = _gpOrig[k] || {};
      return String((el && el.value) || '').split(',').map(function(x){ return x.trim(); })
        .filter(Boolean)
        // Send back exactly what arrived, level and all, unless it is a word added just now.
        .map(function(w){ return orig[w.toLowerCase()] || w; })
        .join('|');
    };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      + (window._gpLoaded ? '&tagsMode=replace' : '')
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages='    + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods='      + encodeURIComponent(picked(_gpMethodPicked, '|'));
    GP_INTRO_Q.forEach(function(q){ qs += '&' + q.key + '=' + encodeURIComponent(val(q.key)); });
    qs += '&needsTags='     + encodeURIComponent(tagFor('introNeed'))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(tagFor('introSkills'))
        + '&valuesTags='    + encodeURIComponent(tagFor('introValues'))
        + '&location='      + encodeURIComponent(gpLocString(_gpLoc));
    fetch(GS_URL + '?' + qs).catch(function(){});
  }

  document.getElementById('gp-step-next').addEventListener('click', function(){
    if (_gpStep === GP_LAST) { window.location.href = _next; return; }
    if (_gpStep === GP_LAST - 1) { gpSaveIntro(); return; }
    if (!gpStepOK(_gpStep)) { gpStepPaint(); return; }
    gpQuietSave();
    gpShowStep(_gpStep + 1);
  });
  document.getElementById('gp-step-back').addEventListener('click', function(){ gpShowStep(_gpStep - 1); });
  document.getElementById('gp-step-skip').addEventListener('click', function(){ gpQuietSave(); gpShowStep(_gpStep + 1); });
  // Show somebody what they already said before asking them to say it again.
  // saveIntro writes whatever is in a box, blank included, so a page that opens
  // empty quietly erases the answers of anybody who has been here before. Only
  // enjoy and skills are required, which is exactly how need and values used to
  // disappear. Draw the empty form first so a slow or failed lookup never leaves
  // somebody staring at nothing, then fill it in when their answers arrive.
  gpRenderIntro(null);
  // Most people answered these long before the intro* columns existed, and their words
  // sit one column away under the older names. Asking somebody to type out again what
  // we already hold is how a form earns a reputation for not listening, so fall back to
  // the older field wherever the newer one is empty.
  var GP_OLDER = {
    introNeed:   'needs',
    introEnjoy:  'interests',
    introSkills: 'skills',
    introValues: 'values',
    introOffer:  'offers'
  };

  if (meId) {
    fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var have = (d && d.data) || {};
        var use = {}, any = false;
        GP_INTRO_Q.forEach(function(q){
          // The real column holds tags, not sentences: items split by | and each one
          // carrying its type and level after a colon, as in "Ping Pong:Participant".
          // Shown raw that reads as gibberish, so keep the names only. An older picker also
          // stored the emoji with the word, and the picture was always decoration.
          var clean = function(part){
            var name = String(part).split(':')[0].trim();
            return name.replace(/^[^\p{L}\p{N}]+/u, '').trim();
          };
          // Both, not one or the other. This used to fall back to the real column only when the
          // intro's own field was empty, so a single word typed here hid a list somebody had
          // spent months building. Nobody loses what they already said.
          var seenW = {}, all = [];
          _gpOrig[q.key] = _gpOrig[q.key] || {};
          // Each list has its own separator and only its own. The real column is pipe
          // separated and a single item may hold commas of its own, as "Kayaking:Fan,Participant"
          // does. Splitting it on commas too tore that in half and invented a person who enjoys
          // "Participant".
          [[String(have[GP_OLDER[q.key]] || ''), '|'],
           [String(have[q.key] || ''), ',']].forEach(function(pair){
            pair[0].split(pair[1]).forEach(function(part){
              var w = clean(part);
              if (!w) return;
              var kw = w.toLowerCase();
              // Remember the fullest version seen, so a level or a category survives the trip.
              var raw = String(part).trim();
              if (raw && (!_gpOrig[q.key][kw] || raw.length > _gpOrig[q.key][kw].length)) {
                _gpOrig[q.key][kw] = raw;
              }
              if (seenW[kw]) return;
              seenW[kw] = 1; all.push(w);
            });
          });
          var v = all.join(', ');
          if (v) { use[q.key] = v; any = true; }
        });
        // Anything already chosen shows as chosen, so nobody picks their own languages twice.
        String(have.languages || '').split(/[|,]/).forEach(function(l){
          var v = String(l).trim(); if (v) { _gpLangPicked[v] = true; any = true; }
        });
        String(have.methods || '').split('|').forEach(function(m){
          var v = String(m).trim(); if (v) { _gpMethodPicked[v] = true; any = true; }
        });
        GP_INTRO_Q.forEach(function(q){
          var el = document.getElementById('gp-intro-' + q.key);
          var typed = el ? String(el.value || '').trim() : '';
          if (typed) { use[q.key] = typed; any = true; }
        });
        gpLocFrom(have.location);
        if (gpLocString(_gpLoc)) any = true;
        window._gpLoaded = true;
        if (any) { gpRenderIntro(use); }
      })
      .catch(function(){});
  }
</script>
