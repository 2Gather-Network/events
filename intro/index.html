      <button type="button" id="gp-step-back" style="display:none;font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:24px;border:1.5px solid #C9DFF3;background:#fff;color:#1F699E;cursor:pointer;">Back</button>

</div>
<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var params = new URLSearchParams(window.location.search);
  var meId = CW.me().id;
  // Where to send somebody once they are through. Only our own two hosts are accepted, so a
  // crafted link cannot use this page to bounce anybody somewhere else.
  var _next = (function(){
    var raw = params.get('next') || '';
    try {
      var u = new URL(raw, 'https://2gather.network');
      if (u.host === '2gather.network' || u.host === 'gather.2gather.network'
          || u.host === 'creating.works') return u.toString();
    } catch(err){}
    return 'https://2gather.network/mygroups' + (meId ? '?CWid=' + encodeURIComponent(meId) : '');
  })();
  window._gpAlreadyIn = (params.get('already') || '') === '1';
  window._gpFirstTime = (params.get('first') || '') === '1';
  // The group bundle is cached for a minute, and the answer just changed. Without this the
  // page somebody lands on could still believe they had not answered and ask again.
  function _introDone(){
    var u = _next + (_next.indexOf('?') > -1 ? '&' : '?') + 'nocache=1';
    window.location.href = u;
  }

  var GP_INTRO_Q = [
    { key:'introNeed',   need:false, q:'What do you need?',
      hint:'Something you are looking for right now. Leave it blank if there is nothing.',
      ph:'A cat sitter for the last week of September, a massage therapist local to Seattle, and someone who can help me get a PT nursing job where I can travel anywhere.' },
    { key:'introEnjoy',  need:true,  q:'What do you enjoy?',
      hint:'What you love doing.',
      ph:'Pickleball, kayaking, singing badly in a group, anything on the water.' },
    { key:'introSkills', need:true,  q:'What skills pay the bills and/or how do you like helping others?',
      hint:'Name whatever you’re good at. You are multi-dimensional so please shine your light! ✨',
      ph:'Facilitating a room full of people who disagree. Experience design. Cutting short hair, helping people move (I’m great at finding ways to make small spaces very functional!)' },
    { key:'introValues', need:false, q:'What do you care about?',
      hint:'What matters to you, and what you want more of in the world. Leave it blank if you would rather not say.',
      ph:'Housing, food security, keeping the lake swimmable…' },
    { key:'introOffer',  need:false, q:'Do you have a thing you want to offer right now?',
      hint:'A thing, a space, or a resource you can share. Leave it blank if there is nothing right now.',
      ph:'A spare room for the month of September, a truck for moving stuff, a meeting space to meet each week, and gardening tools.' }
  ];
  // Shown to a person, stored as the category that already exists on the giving page.
  var GP_THANKS = [
    { label:'\u{1F48E} Money',                        value:'Money' },
    { label:'\u{1F49B} Say thank you',                value:'Say thank you' },
    { label:'✨ Acts of service',                 value:'Acts of service' },
    { label:'\u{1F4E6} Something from my gift list',  value:'Physical goods' },
    { label:'\u{1F331} Pass it on to somebody else',  value:'Pass it on' }
  ];
  var _gpThanksPicked = {};

  // Chips under every question. Somebody in a hurry taps and moves on, somebody with something
  // specific to say still types it. The words come from the reference sheet, so a tap produces
  // something matching already knows.
  //
  //   need + offer  three pills, a person, a place, a thing
  //   enjoy         the five kinds of recreation, which is all of them
  //   skills        five categories, More opens the other thirteen
  //   care about    social or ecological first, then that side's values, and you can flip
  // Published 2026-08-26. Everybody gets the chips. ?chips=0 turns them off, which is only
  // there so the two versions can be put side by side.
  var GP_CHIPS_ON = (params.get('chips') || '') !== '0';
  var GP_CHIPS = {
    introEnjoy:  { words: ['Sports', 'Outdoor & Nature', 'Making & Collecting', 'Movement & Performance', 'Games & Strategy'] },
    introSkills: { lead: 'And/or tap any category below...',
                   words: ['Home & Construction', 'Business & Finance', 'Physical Wellbeing', 'Arts & Culture', 'Technology & Communications'],
                   more:  ['Community & Civic', 'Mechanical & Manufacturing', 'Food & Drink', 'Transportation', 'Family Wellbeing',
                           'Self-Expression & Beauty', 'Mental Wellbeing', 'Nature & Outdoors', 'Pets & Animal Care',
                           'Events & Gatherings', 'Making & Collecting', 'Recreation & Hobbies', 'Basic needs and security'] },
    introValues: { lenses: [
                     { label:'Social',
                       words:['Housing and Shelter', 'Food Security', 'Safety and Peace', 'Community Health', 'Economic Opportunity'],
                       more: ['Physical Wellbeing', 'Mental Wellbeing', 'Urgent Medical Care', 'Clothing and Supplies',
                              'Empowerment and Resilience', 'Freedom and Autonomy', 'Personal Expression', 'Local Economic Vitality',
                              'Wealth Equity', 'Quality Goods and Services', 'Information Access', 'Social and Civic Engagement',
                              'Cultural Vitality', 'Shared Community Resources', 'Transportation Access', 'Reliable Utilities',
                              'Digital Connectivity'] },
                     { label:'Ecological',
                       words:['Clean Water', 'Clean Air', 'Climate Stability', 'Biodiversity', 'Clean Energy'],
                       more: ['Clean Soil', 'Clean Food', 'Animal Welfare', 'Water Security', 'Land Security', 'Eco Values'] }
                   ] },
  };
  var _gpChipsPicked = {};
  var _gpLangPicked = {}, _gpMethodPicked = {};
  var GP_LANGS = ['English','Mandarin','Cantonese','Hindi','Spanish','Arabic','Bengali','Portuguese','French','Urdu',
    'Russian','Indonesian','German','Japanese','Swahili','Marathi','Telugu','Turkish','Tamil','Vietnamese','Korean',
    'Italian','Thai','Persian (Farsi)','Polish','Pashto','Punjabi','Ukrainian','Malayalam','Kannada','Romanian','Dutch',
    'Greek','Czech','Hungarian','Gujarati','Somali','Swedish','Norwegian','Hebrew','Danish','Finnish','Albanian',
    'Croatian','Lithuanian','Nepali','Khmer (Cambodian)','Hmong','Estonian','Laotian','Sign Language'];
  // The short form, spelled exactly as the profile stores it, so the two pages never disagree
  // about what somebody said.
  var GP_METHODS = ['\u{1F5C2} Organizing and planning','\u{1F527} Repairing and fixing',
    '\u{1F4DA} Demonstrating what I know','\u{1F9ED} Consulting and advising',
    '\u{1F300} Facilitating and coaching','\u{1F3A8} Making and designing','\u{1F33F} Caring and healing'];

  function gpPickRow(all, picked, firstN){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){
        picked[word] = !picked[word]; paint();
        // A language chosen here is what unlocks step 0, so the footer is told.
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

  function gpBlock(title, hint, body){
    var w = document.createElement('div');
    w.style.cssText = 'padding:18px 0;border-top:1px solid #f0f1f5;';
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = title;
    var h = document.createElement('div');
    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    h.textContent = hint;
    w.appendChild(t); w.appendChild(h); w.appendChild(body);
    return w;
  }

  function gpLanguagesBlock(){
    var picker = gpPickRow(GP_LANGS, _gpLangPicked, 8);
    var wrap = document.createElement('div');
    wrap.appendChild(picker.row);
    var line = document.createElement('div');
    line.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Another language';
    inp.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
      + 'padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var add = document.createElement('button');
    add.type = 'button';
    add.textContent = 'Add';
    add.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:20px;'
      + 'border:0;background:#1F699E;color:#fff;cursor:pointer;';
    function commit(){ var v = inp.value.trim(); if (!v) return; picker.add(v); inp.value = ''; inp.focus(); }
    add.addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    line.appendChild(inp); line.appendChild(add);
    wrap.appendChild(line);
    return gpBlock('Which languages do you speak?', 'So people know they can talk to you in theirs.', wrap);
  }

  function gpMethodsBlock(){
    return gpBlock('What comes most naturally to you?',
      'How you like to help, rather than what you know.',
      gpPickRow(GP_METHODS, _gpMethodPicked, 0).row);
  }

  // Faces on the chips. The reference sheet carries an emoji for exactly one list, the seven
  // ways of helping, and nothing else, so these are picked here for now. When an emoji column
  // exists on the reference tabs this map goes and the sheet decides.
  // No people and no hands, so nothing here carries a skin tone.
  // The emoji is decoration only. What lands in the box, and what a tap is stored as, stays the
  // plain word, so nothing downstream has to strip a picture back off.
  var GP_EMOJI = {
    'A service':'\u{1F464}', 'A place':'\u{1F3E0}', 'A thing':'\u{1F4E6}',
    'Sports':'\u26BD', 'Outdoor & Nature':'\u{1F332}', 'Making & Collecting':'\u{1F9F6}',
    'Movement & Performance':'\u{1F3AD}', 'Games & Strategy':'\u{1F3B2}',
    'Home & Construction':'\u{1F528}', 'Business & Finance':'\u{1F4BC}', 'Physical Wellbeing':'\u{1FA7A}',
    'Arts & Culture':'\u{1F5BC}\uFE0F', 'Technology & Communications':'\u{1F4BB}', 'Community & Civic':'\u{1F3DB}\uFE0F',
    'Mechanical & Manufacturing':'\u2699\uFE0F', 'Food & Drink':'\u{1F37D}\uFE0F', 'Transportation':'\u{1F697}',
    'Family Wellbeing':'\u{1F9F8}', 'Self-Expression & Beauty':'\u{1F484}', 'Mental Wellbeing':'\u{1F9E0}',
    'Nature & Outdoors':'\u{1F33F}', 'Pets & Animal Care':'\u{1F43E}', 'Events & Gatherings':'\u{1F389}',
    'Recreation & Hobbies':'\u{1F3AF}', 'Basic needs and security':'\u{1F6DF}',
    'Housing and Shelter':'\u{1F3D8}\uFE0F', 'Food Security':'\u{1F372}', 'Safety and Peace':'\u{1F6E1}\uFE0F',
    'Community Health':'\u{1F3E5}', 'Economic Opportunity':'\u{1F4C8}', 'Urgent Medical Care':'\u{1F691}',
    'Clothing and Supplies':'\u{1F9E5}', 'Empowerment and Resilience':'\u{1F31F}', 'Freedom and Autonomy':'\u{1F54A}\uFE0F',
    'Personal Expression':'\u{1F3A4}', 'Local Economic Vitality':'\u{1F3EA}', 'Wealth Equity':'\u2696\uFE0F',
    'Quality Goods and Services':'\u{1F3F7}\uFE0F', 'Information Access':'\u{1F4F0}', 'Social and Civic Engagement':'\u{1F5F3}\uFE0F',
    'Cultural Vitality':'\u{1F3B6}', 'Shared Community Resources':'\u{1F9FA}', 'Transportation Access':'\u{1F68C}',
    'Reliable Utilities':'\u{1F4A1}', 'Digital Connectivity':'\u{1F4F6}',
    'Clean Water':'\u{1F4A7}', 'Clean Air':'\u{1F32C}\uFE0F', 'Climate Stability':'\u{1F321}\uFE0F',
    'Biodiversity':'\u{1F98B}', 'Clean Energy':'\u26A1', 'Clean Soil':'\u{1FAB1}', 'Clean Food':'\u{1F96C}',
    'Animal Welfare':'\u{1F43F}\uFE0F', 'Water Security':'\u{1F6B0}', 'Land Security':'\u{1F5FA}\uFE0F', 'Eco Values':'\u267B\uFE0F'
  };
  function gpChipLabel(word){ var e = GP_EMOJI[word]; return e ? (e + ' ' + word) : word; }

  // A tapped chip writes its word into the box, so a person sees the answer they just gave and
  // can keep typing after it. It is also kept in _gpChipsPicked, which is what a later change
  // will store as a tag rather than as a sentence.
  function gpChipBtn(key, word, ta){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = gpChipLabel(word);
    var paint = function(){
      b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + (_gpChipsPicked[key] && _gpChipsPicked[key][word]
            ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    };
    paint();
    b.addEventListener('click', function(){
      if (!_gpChipsPicked[key]) _gpChipsPicked[key] = {};
      var on = !_gpChipsPicked[key][word];
      _gpChipsPicked[key][word] = on;
      var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
      var at = -1;
      for (var pi = 0; pi < parts.length; pi++) {
        if (parts[pi].toLowerCase() === String(word).toLowerCase()) { at = pi; break; }
      }
      if (on && at === -1) parts.push(word);
      if (!on && at > -1) parts.splice(at, 1);
      ta.value = parts.join(', ');
      paint();
    });
    return b;
  }

  // A quiet pill that opens the rest of a list. It removes itself once pressed, because a
  // control that has already done its work is one more thing to read past.
  function gpMoreBtn(label, onOpen){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + 'background:#EEF1F5;border:1px dashed #C4CDD8;color:#6B7A8D;font-weight:600;';
    b.addEventListener('click', function(){ b.parentNode.removeChild(b); onOpen(); });
    return b;
  }

  // ── The picker, 2026-08-30 ────────────────────────────────────────────────
  // Five concrete examples, a keyword search over the reference sheet, and Other for a word
  // nobody has thought of. The same shape as /profile-edit/, reading the same getReferenceData,
  // so there is one list of words on this site rather than two that drift.
  //
  // Choosing from the search IS the tag: the reference tree already knows that yoga is Movement
  // & Performance. Only a genuinely new word has to be asked about, which is what Other does.
  var GP_PICK = {
    introNeed: {
      examples: ['A massage therapist', 'A hairstylist', 'A plumber', 'A mechanic', 'A career mentor'],
      tagQ: 'Is that a person, a place or a thing?',
      tagOpts: ['Person', 'Place', 'Thing'], source: 'need'
    },
    introEnjoy: {
      examples: ['Pickleball', 'Karaoke', 'Gundam model kits', 'Walking', 'Board games'],
      tagQ: 'Which of these is it?',
      tagOpts: ['⚽ Sports', '\u{1F332} Outdoor & Nature', '\u{1F9F6} Making & Collecting',
                '\u{1F3AD} Movement & Performance', '\u{1F3B2} Games & Strategy'], source: 'recreation'
    },
    introSkills: {
      examples: ['Massage therapist', 'Hairstylist', 'Accountant', 'Nurse', 'AI specialist'],
      tagQ: 'Which category does it belong to?', tagOpts: null, source: 'skills'
    },
    introValues: {
      examples: ['\u{1F3D8}️ Housing and Shelter', '\u{1F372} Food Security', '\u{1F4A7} Clean Water',
                 '\u{1F32C}️ Clean Air', '⚡ Clean Energy', '\u{1F43F}️ Animal Welfare'],
      tagQ: '', tagOpts: null, source: 'values'
    }
  };
  // word -> the category it was filed under. Sent to the backend beside the sentence.
  var _gpTags = {};

  var _gpRefP = null;
  function gpRefOnce(){
    if (_gpRefP) return _gpRefP;
    _gpRefP = fetch(GS_URL + '?action=getReferenceData')
      .then(function(r){ return r.json(); })
      .catch(function(){ return {}; });
    return _gpRefP;
  }

  // One flat list of {word, cat} per question, which is all the search needs.
  function gpCorpus(source, rd){
    var out = [], seen = {};
    // The reference sheet carries an `associations` column of everyday words, so searching
    // "doctor" finds Physician. Without it the search only matches the formal name, which is
    // the one thing somebody looking for help does not know.
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      (rd.values || []).forEach(function(v){ push((v && v.item !== undefined) ? v.item : v, 'Values', v && v.associations); });
      (rd.domains || []).forEach(function(v){ push((v && v.item !== undefined) ? v.item : v, 'Domains', v && v.associations); });
      // The values list on the reference sheet is empty today, so the two lenses that have been
      // on this page since August are the corpus. Without this the search finds nothing at all.
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  // Adding a word writes it into the box, so somebody sees the answer they just gave and can
  // keep typing after it, and files the tag beside it.
  function gpAddWord(key, word, cat, ta){
    word = String(word || '').trim(); if (!word) return;
    if (!_gpTags[key]) _gpTags[key] = {};
    _gpTags[key][word] = cat || '';
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].toLowerCase() === word.toLowerCase()) return;
    }
    parts.push(word);
    ta.value = parts.join(', ');
  }
  function gpDropWord(key, word, ta){
    if (_gpTags[key]) delete _gpTags[key][word];
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    ta.value = parts.filter(function(p){ return p.toLowerCase() !== String(word).toLowerCase(); }).join(', ');
  }
  function gpHasWord(key, word){
    return !!(_gpTags[key] && _gpTags[key][word] !== undefined);
  }

  function gpPill(label, on){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    return b;
  }

  function gpPicker(key, ta){
    var cfg = GP_PICK[key];
    if (!GP_CHIPS_ON || !cfg) return null;
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:12px;';

    var lead = document.createElement('div');
    lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
    lead.textContent = 'Search for something, or tap one below.';
    box.appendChild(lead);

    var search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search';
    search.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
      + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    box.appendChild(search);

    var results = document.createElement('div');
    results.style.cssText = 'margin-top:6px;';
    box.appendChild(results);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
    box.appendChild(row);

    var corpus = [];
    gpRefOnce().then(function(rd){ corpus = gpCorpus(cfg.source, rd); });

    function repaint(){
      Array.prototype.forEach.call(row.querySelectorAll('button[data-word]'), function(b){
        var on = gpHasWord(key, b.getAttribute('data-word'));
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
                : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      });
    }

    // The five examples. Emoji stay on screen and come off the stored word, so a tag matches
    // what the reference sheet holds rather than a decorated version of it.
    cfg.examples.forEach(function(label){
      var word = label.replace(/^[^A-Za-z0-9]+/, '').trim();
      var b = gpPill(label, gpHasWord(key, word));
      b.setAttribute('data-word', word);
      b.addEventListener('click', function(){
        if (gpHasWord(key, word)) { gpDropWord(key, word, ta); }
        else {
          // An example is usually in the reference sheet too, so it takes that sheet's category
          // rather than arriving untagged. Pickleball files as Sports, not as nothing.
          var cat = '';
          for (var ci = 0; ci < corpus.length; ci++) {
            if (corpus[ci].word.toLowerCase() === word.toLowerCase()) { cat = corpus[ci].cat; break; }
          }
          gpAddWord(key, word, cat, ta);
        }
        repaint();
      });
      row.appendChild(b);
    });

    // Other, and the one question a genuinely new word has to answer.
    var other = document.createElement('button');
    other.type = 'button';
    other.textContent = '+ Other';
    other.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + 'background:#EEF1F5;border:1px dashed #C4CDD8;color:#6B7A8D;font-weight:600;';
    row.appendChild(other);

    var otherBox = document.createElement('div');
    otherBox.style.cssText = 'display:none;margin-top:10px;';
    box.appendChild(otherBox);

    other.addEventListener('click', function(){
      otherBox.style.display = otherBox.style.display === 'none' ? 'block' : 'none';
      if (otherBox.style.display === 'none') { otherBox.innerHTML = ''; return; }
      otherBox.innerHTML = '';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'In your own words';
      inp.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
        + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      otherBox.appendChild(inp);
      var ask = document.createElement('div');
      ask.style.cssText = 'margin-top:8px;';
      otherBox.appendChild(ask);
      inp.focus();

      var commit = function(){
        var word = String(inp.value || '').trim();
        if (!word) return;
        // Already in the reference sheet? Then it is not new and it keeps that sheet's category.
        var hit = null;
        for (var i = 0; i < corpus.length; i++) {
          if (corpus[i].word.toLowerCase() === word.toLowerCase()) { hit = corpus[i]; break; }
        }
        if (hit) {
          gpAddWord(key, hit.word, hit.cat, ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        if (!cfg.tagQ) {
          gpAddWord(key, word, '', ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        ask.innerHTML = '';
        var q = document.createElement('div');
        q.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        q.textContent = cfg.tagQ;
        ask.appendChild(q);
        var opts = cfg.tagOpts;
        if (!opts) {
          // Skills and values take their categories from the reference sheet itself.
          var seen = {}; opts = [];
          corpus.forEach(function(c){ if (c.cat && !seen[c.cat]) { seen[c.cat] = 1; opts.push(c.cat); } });
        }
        var orow = document.createElement('div');
        orow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
        opts.forEach(function(o){
          var ob = gpPill(o, false);
          ob.addEventListener('click', function(){
            gpAddWord(key, word, o.replace(/^[^A-Za-z0-9]+/, '').trim(), ta);
            otherBox.style.display = 'none'; otherBox.innerHTML = '';
          });
          orow.appendChild(ob);
        });
        ask.appendChild(orow);
      };
      inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
      var add = document.createElement('button');
      add.type = 'button';
      add.textContent = 'Add';
      add.style.cssText = 'margin-top:8px;font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;'
        + 'border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;';
      add.addEventListener('click', commit);
      otherBox.insertBefore(add, ask);
    });

    // Search. Filters as you type, because pressing a button to search reads as broken.
    search.addEventListener('input', function(){
      var t = String(search.value || '').trim().toLowerCase();
      results.innerHTML = '';
      if (t.length < 2) return;
      var hits = corpus.filter(function(c){
        return c.word.toLowerCase().indexOf(t) > -1 || (c.assoc && c.assoc.indexOf(t) > -1);
      }).slice(0, 6);
      hits.forEach(function(h){
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.style.cssText = 'border:1px solid #DDE3EA;border-radius:10px;padding:10px 12px;margin-top:6px;cursor:pointer;background:#fff;';
        r.innerHTML = '<div style="font-size:14.5px;font-weight:700;color:#1A2E42;">' + h.word + '</div>'
          + (h.cat ? '<div style="font-size:13px;color:#6B7A8D;">' + h.cat + '</div>' : '');
        r.addEventListener('click', function(){
          gpAddWord(key, h.word, h.cat, ta);
          search.value = ''; results.innerHTML = ''; repaint();
        });
        results.appendChild(r);
      });
      if (!hits.length) {
        var none = document.createElement('div');
        none.style.cssText = 'font-size:13px;color:#6B7A8D;margin-top:6px;';
        none.textContent = 'Nothing matches. Use + Other to add it in your own words.';
        results.appendChild(none);
      }
    });

    return box;
  }

  function gpChipRow(key, ta){
    var cfg = GP_CHIPS[key];
    if (!GP_CHIPS_ON || !cfg) return null;
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:10px;';
    var lead = document.createElement('div');
    lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
    lead.textContent = cfg.lead || 'And/or tap any below...';
    box.appendChild(lead);

    // Social or ecological is asked first, and the other side stays on screen so somebody can
    // flip without going back. Anything already tapped stays tapped when the list changes.
    if (cfg.lenses) {
      var lensRow = document.createElement('div');
      lensRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
      var wordRow = document.createElement('div');
      wordRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
      var current = null;
      var lensBtns = [];
      var paintLenses = function(){
        lensBtns.forEach(function(pair){
          pair.btn.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 16px;border-radius:20px;cursor:pointer;'
            + (current === pair.lens
                ? 'background:#1A2E42;border:1px solid #1A2E42;color:#fff;font-weight:700;'
                : 'background:#F7FBFF;border:1px solid #C9DFF3;color:#1A2E42;font-weight:700;');
        });
      };
      var showLens = function(lens){
        current = lens;
        paintLenses();
        wordRow.innerHTML = '';
        lens.words.forEach(function(w){ wordRow.appendChild(gpChipBtn(key, w, ta)); });
        if (lens.more && lens.more.length) {
          wordRow.appendChild(gpMoreBtn('More', function(){
            lens.more.forEach(function(w){ wordRow.appendChild(gpChipBtn(key, w, ta)); });
          }));
        }
      };
      cfg.lenses.forEach(function(lens){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = lens.label;
        b.addEventListener('click', function(){ showLens(lens); });
        lensBtns.push({ btn:b, lens:lens });
        lensRow.appendChild(b);
      });
      paintLenses();
      box.appendChild(lensRow);
      box.appendChild(wordRow);
      return box;
    }

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    cfg.words.forEach(function(w){ row.appendChild(gpChipBtn(key, w, ta)); });
    if (cfg.more && cfg.more.length) {
      row.appendChild(gpMoreBtn('More', function(){
        cfg.more.forEach(function(w){ row.appendChild(gpChipBtn(key, w, ta)); });
      }));
    }
    box.appendChild(row);
    return box;
  }


  // ---- A face, before the words -------------------------------------------
  // This lives here rather than on the sign-up page on purpose. Somebody who gives up on
  // sign-up was never here; somebody who gives up on this page is already in and can come back
  // to it whenever they like. So the optional things belong on this side of the door.
  var PHOTO_URL = 'https://cw-photos.jessieupp.workers.dev';
  var _gpPhotoToken = '';

  // The same session the profile editor asks for. Signing up wrote it under both names, so
  // either will do and neither means asking somebody for a second code.
  function gpToken(){
    if (_gpPhotoToken) return _gpPhotoToken;
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.t && (!o.exp || o.exp > Date.now())) { _gpPhotoToken = o.t; return _gpPhotoToken; }
      }
      var t2 = localStorage.getItem('cw-token') || '';
      var who = String(localStorage.getItem('cw-id') || '').split('.').join('').toLowerCase();
      if (t2 && who && who === norm) {
        var exp = parseInt(String(t2).split('.')[1], 10);
        if (exp && Date.now() <= exp - 60000) { _gpPhotoToken = t2; return _gpPhotoToken; }
      }
    } catch (e) {}
    return '';
  }

  function gpPhotoStat(msg){ var el = document.getElementById('gp-photo-stat'); if (el) el.textContent = msg || ''; }
  function gpPhotoShow(url){
    var f = document.getElementById('gp-photo-face'); if (!f) return;
    f.innerHTML = '<img src="' + url + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    var b = document.getElementById('gp-photo-btn'); if (b) b.textContent = 'Change photo';
    // Step 0 will not let anybody past without one, so the moment a face lands the door opens.
    window._gpPhotoUp = true;
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }

  // ── Location, 2026-08-30 ──────────────────────────────────────────────────
  // Ported from My account rather than invented again, so somebody meets the same picker in both
  // places and a stored value reads the same way. Held as one plain string, "Washington, United
  // States", so anything showing a profile can print it without knowing the three levels.
  var GP_REGIONS = ['North America','South America','Europe','Asia','Africa','Oceania','Antarctica'];
  var GP_NA = ['United States','Canada','Mexico'];
  var GP_US = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","Washington D.C."];
  var _gpLoc = { region:'', country:'', state:'' };
  // A part-made choice stores nothing. "North America" on its own says less than a blank does.
  function gpLocString(l){
    if (l.state) return l.state + ', United States';
    if (l.country && l.country !== 'United States') return l.country;
    if (l.region && l.region !== 'North America') return l.region;
    return '';
  }
  function gpLocationBlock(){
    var wrap = document.createElement('div');
    wrap.setAttribute('data-gp-loc','1');
    wrap.style.cssText = 'padding:18px 0 0;border-top:1px solid #f0f1f5;margin-top:18px;';
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = 'Where are you?';
    var h = document.createElement('div');
    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    h.textContent = 'So the people and events near you can reach you.';
    var box = document.createElement('div');
    box.id = 'gp-loc-box';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
    wrap.appendChild(t); wrap.appendChild(h); wrap.appendChild(box);
    gpRenderLoc();
    return wrap;
  }
  function gpRenderLoc(){
    var box = document.getElementById('gp-loc-box');
    if (!box) { setTimeout(gpRenderLoc, 0); return; }
    var l = _gpLoc, ss = 'font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #DDE3EA;border-radius:10px;background:#F7FBFF;color:#1A2E42;';
    var sel = function(id, list, val, ph){
      var h = '<select id="' + id + '" style="' + ss + '"><option value="">' + ph + '</option>';
      list.forEach(function(x){ h += '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>'; });
      return h + '</select>';
    };
    var html = sel('gp-loc-region', GP_REGIONS, l.region, 'Select region…');
    if (l.region === 'North America') html += sel('gp-loc-country', GP_NA, l.country, 'Select country…');
    if (l.region === 'North America' && l.country === 'United States') html += sel('gp-loc-state', GP_US, l.state, 'Select state…');
    box.innerHTML = html;
    var rg = box.querySelector('#gp-loc-region');
    if (rg) rg.onchange = function(){
      _gpLoc = { region: rg.value, country: '', state: '' };
      if (rg.value === 'North America') _gpLoc.country = 'United States';
      gpRenderLoc(); gpStepPaint();
    };
    var ct = box.querySelector('#gp-loc-country');
    if (ct) ct.onchange = function(){ _gpLoc.country = ct.value; _gpLoc.state = ''; gpRenderLoc(); gpStepPaint(); };
    var st = box.querySelector('#gp-loc-state');
    if (st) st.onchange = function(){ _gpLoc.state = st.value; gpRenderLoc(); gpStepPaint(); };
  }

  function gpPhotoBlock(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:16px;padding:0 0 18px;flex-wrap:wrap;';
    wrap.innerHTML =
      '<div id="gp-photo-face" style="width:76px;height:76px;border-radius:50%;overflow:hidden;'
      + 'background:#EDF3F9;border:1.5px solid #DDE3EA;flex-shrink:0;display:flex;align-items:center;'
      + 'justify-content:center;font-size:26px;">\u{1F331}</div>'
      + '<div style="min-width:0;">'
      + '<div style="font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;">Your photo</div>'
      + '<div style="font-size:13.5px;color:#6B7A8D;line-height:1.5;margin-bottom:8px;">'
      + 'A professional photo helps people recognize you when you show up.</div>'
      + '<button type="button" id="gp-photo-btn" style="font:inherit;font-size:13.5px;font-weight:700;'
      + 'padding:8px 16px;border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;'
      + 'cursor:pointer;">Add a photo</button>'
      + '<div id="gp-photo-stat" style="font-size:13px;color:#6B7A8D;margin-top:6px;"></div>'
      + '</div>';
    var btn = wrap.querySelector('#gp-photo-btn');
    btn.addEventListener('click', gpChoosePhoto);
    // Already have one? Show it rather than inviting them to add what they have.
    if (meId) {
      fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.photo) gpPhotoShow(d.photo); })
        .catch(function(){});
    }
    return wrap;
  }

  function gpChoosePhoto(){
    if (!meId) { gpPhotoStat('This device does not know who you are yet.'); return; }
    if (!gpToken()) { gpPhotoStat('Sign in again and your photo will go straight up.'); return; }
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){ var f = inp.files && inp.files[0]; if (f) gpShrinkPhoto(f); };
    inp.click();
  }

  // Shrunk here, in the browser, so a photo straight off a phone camera never crosses the wire
  // at full size. An 8.4MB source came out at 6KB in testing.
  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

  function gpSendPhoto(blob){
    gpPhotoStat('Sending\u2026');
    fetch(PHOTO_URL + '/upload?id=' + encodeURIComponent(meId), {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg', 'x-cw-token': gpToken() },
      body: blob
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || d.status !== 'ok' || !d.url) { gpPhotoStat((d && d.message) || 'That did not go through.'); return; }
      gpPhotoShow(d.url + '?v=' + Date.now());
      gpPhotoStat('');
      // Only photoURL is sent, and saveIntake leaves alone anything it was not given, so this
      // cannot touch an answer somebody has already written.
      fetch(GS_URL + '?action=saveIntake&appearId=' + encodeURIComponent(meId)
            + '&secure=1&editToken=' + encodeURIComponent(gpToken())
            + '&photoURL=' + encodeURIComponent(d.url)).catch(function(){});
    }).catch(function(){ gpPhotoStat('That did not go through.'); });
  }

  // ── One thing at a time, 2026-08-30 ───────────────────────────────────────
  // Five questions in a column is a form. One question on a screen is a conversation, and it is
  // the difference between somebody answering three of them and answering all of them.
  //
  // Step 0 is the only wall on the site: a photo, a language and a place. Everything after it is
  // asked properly and can be left, because the gate that matters is joining a group.
  var GP_STEP_TITLES = [
    'First, so people can recognise you',
    'What do you enjoy?',
    'What skills pay the bills?',
    'What do you care about?',
    'Anything you need, or have to offer?',
    'How do you like to be thanked?',
    'This is your profile'
  ];
  var _gpStep = 0;
  var GP_LAST = GP_STEP_TITLES.length - 1;

  function gpStepOK(n){
    if (n !== 0) return true;
    // The three that step 0 asks for. The photo is the strongest ask on the site and it is made
    // here, once, while somebody is still arriving.
    var hasPhoto = !!(window._gpPhotoUp || document.querySelector('#gp-photo-face img'));
    var hasLang  = Object.keys(_gpLangPicked || {}).some(function(k){ return _gpLangPicked[k]; });
    var hasLoc   = !!gpLocString(_gpLoc);
    return hasPhoto && hasLang && hasLoc;
  }
  function gpStepMissing(){
    var out = [];
    if (!(window._gpPhotoUp || document.querySelector('#gp-photo-face img'))) out.push('a photo');
    if (!Object.keys(_gpLangPicked || {}).some(function(k){ return _gpLangPicked[k]; })) out.push('a language');
    if (!gpLocString(_gpLoc)) out.push('where you are');
    return out;
  }

  function gpStepPaint(){
    var next = document.getElementById('gp-step-next');
    var back = document.getElementById('gp-step-back');
    var note = document.getElementById('gp-step-note');
    var count = document.getElementById('gp-step-count');
    var title = document.getElementById('gp-intro-title');
    if (title && _gpStep > 0) title.textContent = GP_STEP_TITLES[_gpStep];
    if (count) count.textContent = (_gpStep < GP_LAST) ? ((_gpStep + 1) + ' of ' + GP_LAST) : '';
    if (back) back.style.display = _gpStep === 0 ? 'none' : '';
    var skip = document.getElementById('gp-step-skip');
    // Skipping needs and haves is a choice somebody makes, not a thing they miss, so it is a
    // control on the screen rather than an absence of one.
    if (skip) skip.style.display = (_gpStep === 4) ? '' : 'none';
    if (!next) return;
    if (_gpStep === GP_LAST) { next.textContent = 'Go in'; next.disabled = false; }
    else if (_gpStep === GP_LAST - 1) { next.textContent = 'Save and see my profile'; next.disabled = false; }
    else { next.textContent = 'Next'; next.disabled = !gpStepOK(_gpStep); }
    next.style.opacity = next.disabled ? '.55' : '1';
    next.style.cursor = next.disabled ? 'default' : 'pointer';
    if (note) {
      var miss = (_gpStep === 0) ? gpStepMissing() : [];
      note.textContent = miss.length ? ('Still to add: ' + miss.join(', ') + '.') : '';
    }
  }

  function gpShowStep(n){
    _gpStep = Math.max(0, Math.min(GP_LAST, n));
    var all = document.querySelectorAll('[data-gp-step]');
    Array.prototype.forEach.call(all, function(el){
      el.style.display = (String(el.getAttribute('data-gp-step')) === String(_gpStep)) ? '' : 'none';
    });
    gpStepPaint();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function gpRenderIntro(prefill){
    var box = document.getElementById('gp-intro-qs');
    if (!box) return;
    // Everybody is greeted by name, not only somebody arriving straight from signing up.
    // This page invites, it does not gate, so nothing here tells anyone they must.
    var _t0 = document.getElementById('gp-intro-title');
    var _l0 = document.getElementById('gp-intro-lede');
    var _who = '';
    try { _who = String(localStorage.getItem('cw-first') || '').trim(); } catch (err) {}
    if (_t0) _t0.textContent = _who ? ('Welcome, ' + _who + ' \u{1F389}') : 'Welcome \u{1F389}';
    // A device that does not hold a name asks for one and drops it in when it lands. The
    // heading is already on screen either way, so nobody waits on this.
    if (!_who && meId) {
      fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(d){
          var nm = String((d && d.name) || '').trim().split(' ')[0];
          if (!nm) return;
          try { localStorage.setItem('cw-first', nm); } catch (err) {}
          var el = document.getElementById('gp-intro-title');
          if (el) el.textContent = 'Welcome, ' + nm + ' \u{1F389}';
        })
        .catch(function(){});
    }
    if (_l0) _l0.innerHTML = window._gpAlreadyIn
      ? 'Nothing changes about your place here. These answers are what let people find you and '
        + 'what puts the right people in front of you, and we never asked for them. Answer what '
        + 'you like now and add the rest whenever.'
      : 'Write as much or as little as you like, in your own words. These answers are what let '
        + 'people find you and what puts the right people in front of you. Answer what you like '
        + 'now and add the rest whenever.';
    box.innerHTML = '';
    // Step 0. The photo, and the promise that goes with asking for it.
    var _s0 = document.createElement('div');
    _s0.setAttribute('data-gp-step', '0');
    _s0.appendChild(gpPhotoBlock());
    var _pn = document.createElement('div');
    _pn.style.cssText = 'font-size:13px;color:#6B7A8D;margin:-6px 0 0;max-width:60ch;line-height:1.5;';
    _pn.textContent = 'Your photo is only shown inside groups you join or start. It is not on the open web '
      + 'and it is not shown to people outside your groups.';
    _s0.appendChild(_pn);
    _s0.appendChild(gpLanguagesBlock());
    _s0.appendChild(gpLocationBlock());
    box.appendChild(_s0);
    GP_INTRO_Q.forEach(function(q, i){
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:18px 0;' + (i ? 'border-top:1px solid #f0f1f5;' : 'padding-top:0;');
      var t = document.createElement('div');
      t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
      t.textContent = q.q;
      var h = document.createElement('div');
      h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
      h.textContent = q.hint;
      var ta = document.createElement('textarea');
      ta.id = 'gp-intro-' + q.key;
      ta.rows = 3;
      ta.placeholder = q.ph;
      ta.value = (prefill && prefill[q.key]) || '';
      // A chip whose word is already in the box has plainly been chosen, so show it chosen.
      // Matching ignores case, because saved answers were not always stored the way the chip
      // spells it: "Community health" and "Community Health" are one answer, not two.
      (function(){
        var already = String(ta.value || '').split(',').map(function(x){
          return x.trim().toLowerCase();
        }).filter(Boolean);
        if (!already.length) return;
        var conf = GP_CHIPS[q.key]; if (!conf) return;
        var all = [];
        (conf.words || []).forEach(function(w){ all.push(w); });
        (conf.more  || []).forEach(function(w){ all.push(w); });
        (conf.lenses|| []).forEach(function(l){
          (l.words || []).forEach(function(w){ all.push(w); });
          (l.more  || []).forEach(function(w){ all.push(w); });
        });
        all.forEach(function(w){
          if (already.indexOf(String(w).toLowerCase()) > -1) {
            if (!_gpChipsPicked[q.key]) _gpChipsPicked[q.key] = {};
            _gpChipsPicked[q.key][w] = true;
          }
        });
      })();
      ta.className = 'cw-intro-box';
      ta.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
        + 'padding:12px 14px;font:inherit;font-size:14.5px;color:#1A2E42;line-height:1.5;resize:vertical;';
      wrap.appendChild(t); wrap.appendChild(h); wrap.appendChild(ta);
      var chipRow = gpPicker(q.key, ta) || gpChipRow(q.key, ta);
      if (chipRow) wrap.appendChild(chipRow);
      // Enjoy, skills, values each get a screen. Needs and haves share the last question screen,
      // because they are two halves of one thought and neither is required.
      var _map = { introEnjoy:'1', introSkills:'2', introValues:'3', introNeed:'4', introOffer:'4' };
      wrap.setAttribute('data-gp-step', _map[q.key] || '4');
      box.appendChild(wrap);
      if (q.key === 'introSkills') {
        // What comes most naturally to you sits with the skills, which is what it is about.
        var _m = gpMethodsBlock();
        _m.setAttribute('data-gp-step', '2');
        box.appendChild(_m);
      }
    });
    // Appreciation last, then the profile as everybody else sees it.
    var _th = gpThanksBlock();
    _th.setAttribute('data-gp-step', '5');
    box.appendChild(_th);
    var _pv = document.createElement('div');
    _pv.setAttribute('data-gp-step', '6');
    _pv.id = 'gp-preview';
    box.appendChild(_pv);
    gpShowStep(0);
  }

  function gpThanksBlock(){
    var tw = document.createElement('div');
    tw.style.cssText = 'padding:18px 0 0;border-top:1px solid #f0f1f5;';
    var tt = document.createElement('div');
    tt.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    tt.textContent = 'How do you like to get appreciated? \u{1F381}';
    var th = document.createElement('div');
    th.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    th.textContent = 'When somebody wants to give something back, this is where it lands. Pick as many as you are happy to receive.';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    GP_THANKS.forEach(function(opt){
      var b = document.createElement('button');
      b.type = 'button';
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (_gpThanksPicked[opt.value]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      b.textContent = opt.label;
      paint();
      b.addEventListener('click', function(){
        _gpThanksPicked[opt.value] = !_gpThanksPicked[opt.value];
        paint();
      });
      row.appendChild(b);
    });
    tw.appendChild(tt); tw.appendChild(th); tw.appendChild(row);
    return tw;
  }

  function gpSaveIntro(){
    var stat = document.getElementById('gp-intro-status');
    var btn = document.getElementById('gp-intro-go');
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    // Nothing is refused. This page invites, and the gate lives on joining a group, where an
    // empty profile actually costs the other people in the room something. Decided 2026-08-30.
    btn.disabled = true;
    stat.style.color = '#6B7A8D';
    stat.textContent = 'Loading your profile…';
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages=' + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods=' + encodeURIComponent(picked(_gpMethodPicked, '|'));
    GP_INTRO_Q.forEach(function(q){ qs += '&' + q.key + '=' + encodeURIComponent(val(q.key)); });
    // The tags, beside the sentence rather than instead of it. Without these somebody can answer
    // every question and stay invisible to matching, because matching reads these columns and
    // never reads the sentence. Pipe separated, which is how every other list on ikigai is held.
    var tagFor = function(k){ return Object.keys(_gpTags[k] || {}).join('|'); };
    qs += '&needsTags='     + encodeURIComponent(tagFor('introNeed'))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(tagFor('introSkills'))
        + '&valuesTags='    + encodeURIComponent(tagFor('introValues'))
        + '&location='      + encodeURIComponent(gpLocString(_gpLoc));
    fetch(GS_URL + '?' + qs)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || (d.status !== 'ok' && d.ok !== true)) {
          btn.disabled = false;
          stat.style.color = '#7A2410';
          stat.textContent = (d && d.message) || 'Could not save just now. Try again in a moment.';
          return;
        }
        gpBuildPreview();
        gpShowStep(GP_LAST);
      })
      .catch(function(){
        btn.disabled = false;
        stat.style.color = '#7A2410';
        stat.textContent = 'Could not reach the server. Try again in a moment.';
      });
  }


  document.getElementById('intro-back').addEventListener('click', function(){ window.location.href = _next; });
  // The last screen. Somebody has just answered six questions and has never once seen what any
  // of it looks like from the outside, which is the only view that matters to anybody else.
  function gpBuildPreview(){
    var el = document.getElementById('gp-preview');
    if (!el) return;
    var who = '';
    try { who = String(localStorage.getItem('cw-first') || '').trim(); } catch (e) {}
    var photo = '';
    var img = document.querySelector('#gp-photo-face img');
    if (img) photo = img.getAttribute('src') || '';
    var val = function(k){ var t = document.getElementById('gp-intro-' + k); return t ? String(t.value || '').trim() : ''; };
    var esc = function(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    var row = function(label, text){
      if (!text) return '';
      return '<div style="padding:14px 0;border-top:1px solid #f0f1f5;">'
        + '<div style="font-size:12px;font-weight:800;color:#6B7A8D;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;">' + label + '</div>'
        + '<div style="font-size:14.5px;color:#1A2E42;line-height:1.55;">' + esc(text) + '</div></div>';
    };
    var langs = Object.keys(_gpLangPicked || {}).filter(function(k){ return _gpLangPicked[k]; }).join(', ');
    el.innerHTML =
      '<div style="font-size:13.5px;color:#6B7A8D;margin-bottom:16px;max-width:60ch;line-height:1.55;">'
      + 'This is how you look to somebody in a group you join. You can change any of it later from '
      + 'your profile.</div>'
      + '<div style="display:flex;align-items:center;gap:16px;">'
      + (photo
          ? '<img src="' + photo + '" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:1.5px solid #DDE3EA;">'
          : '<div style="width:76px;height:76px;border-radius:50%;background:#EDF3F9;border:1.5px solid #DDE3EA;"></div>')
      + '<div><div style="font-size:22px;font-weight:800;color:#1A2E42;">' + esc(who || 'You') + '</div>'
      + (gpLocString(_gpLoc) ? '<div style="font-size:14px;color:#6B7A8D;">' + esc(gpLocString(_gpLoc)) + '</div>' : '')
      + '</div></div>'
      + '<div style="margin-top:14px;">'
      + row('Enjoys', val('introEnjoy'))
      + row('Skills', val('introSkills'))
      + row('Cares about', val('introValues'))
      + row('Needs', val('introNeed'))
      + row('Has to offer', val('introOffer'))
      + row('Speaks', langs)
      + '</div>';
  }

  // Next does one of three things: move on, save, or leave. Back never saves, because going
  // back to look at something should not write anything.
  document.getElementById('gp-step-next').addEventListener('click', function(){
    if (_gpStep === GP_LAST) { window.location.href = _next; return; }
    if (_gpStep === GP_LAST - 1) { gpSaveIntro(); return; }
    if (!gpStepOK(_gpStep)) { gpStepPaint(); return; }
    gpShowStep(_gpStep + 1);
  });
  document.getElementById('gp-step-back').addEventListener('click', function(){ gpShowStep(_gpStep - 1); });
  document.getElementById('gp-step-skip').addEventListener('click', function(){ gpShowStep(_gpStep + 1); });
  // Show somebody what they already said before asking them to say it again.
  // saveIntro writes whatever is in a box, blank included, so a page that opens
  // empty quietly erases the answers of anybody who has been here before. Only
  // enjoy and skills are required, which is exactly how need and values used to
  // disappear. Draw the empty form first so a slow or failed lookup never leaves
  // somebody staring at nothing, then fill it in when their answers arrive.
  gpRenderIntro(null);
  // Most people answered these long before the intro* columns existed, and their words
  // sit one column away under the older names. Asking somebody to type out again what
  // we already hold is how a form earns a reputation for not listening, so fall back to
  // the older field wherever the newer one is empty.
  var GP_OLDER = {
    introNeed:   'needs',
    introEnjoy:  'interests',
    introSkills: 'skills',
    introValues: 'values',
    introOffer:  'offers'
  };

  if (meId) {
    fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var have = (d && d.data) || {};
        var use = {}, any = false;
        GP_INTRO_Q.forEach(function(q){
          var v = String(have[q.key] || '').trim();
          // The older columns hold tags, not sentences: items split by | and each one
          // carrying its type and level after a colon, as in "Ping Pong:Participant".
          // Shown raw that reads as gibberish, and saving would write the machine's
          // shorthand back as though the person had typed it. Keep the names only.
          if (!v) {
            var raw = String(have[GP_OLDER[q.key]] || '').trim();
            if (raw) {
              v = raw.split('|').map(function(part){
                var name = String(part).split(':')[0].trim();
                // An older picker stored the emoji along with the word, so some saved items
                // read "\u{1F3AD} Arts & Culture". The picture was always decoration, and it is
                // dropped here so nobody has to look at it or type around it.
                return name.replace(/^[^\p{L}\p{N}]+/u, '').trim();
              }).filter(function(name){ return name; }).join(', ');
            }
          }
          if (v) { use[q.key] = v; any = true; }
        });
        // Anything already chosen shows as chosen, so nobody picks their own languages twice.
        String(have.languages || '').split(/[|,]/).forEach(function(l){
          var v = String(l).trim(); if (v) { _gpLangPicked[v] = true; any = true; }
        });
        String(have.methods || '').split('|').forEach(function(m){
          var v = String(m).trim(); if (v) { _gpMethodPicked[v] = true; any = true; }
        });
        GP_INTRO_Q.forEach(function(q){
          var el = document.getElementById('gp-intro-' + q.key);
          var typed = el ? String(el.value || '').trim() : '';
          if (typed) { use[q.key] = typed; any = true; }
        });
        if (any) { gpRenderIntro(use); }
      })
      .catch(function(){});
  }
</script>
