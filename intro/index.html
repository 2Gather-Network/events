  // Next does one of three things: move on, save, or leave. Back never saves, because going
  // back to look at something should not write anything.
  // Every move forward writes what is on the screen. Nobody should be able to answer four
  // questions, close the tab, and find out none of it was kept because they never reached a
  // button at the end. Quiet on purpose: it takes nothing over and says nothing unless it fails.
  // Looking as somebody else is looking, never writing. identity.js sets `viewing` and says
  // every page that writes is expected to check it. This one did not, so pressing Next while
  // viewing as another member would have written this screen onto their row.
  function gpViewingSomebodyElse(){
    try { return !!(window.CW && CW.me && CW.me().viewing); } catch (e) { return false; }
  }

  // ── 2026-09-13, from the creating.works chat at Jessie's request ("Fix too if not"). The same three faults were
  // fixed in creating.works/work/, which was copied from this page. ─────────────────────────────────────────────
  // NOTHING SAVES BEFORE THE SAVED ANSWERS ARRIVE. Every save writes every box, blanks included, so a Next pressed
  // while they were still loading (up to 40 seconds) wrote empty boxes over real answers.
  function gpLoadNote(){
    var st = document.getElementById('gp-intro-status'); if (!st) return;
    st.style.color = window._gpLoadFailed ? '#7A2410' : '#6B7A8D';
    if (window._gpLoadFailed) {
      st.innerHTML = 'Your saved answers did not load, so nothing here saves. '
        + '<button type="button" onclick="location.reload()" style="font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;margin-left:4px;">Try again</button>';
    } else {
      st.textContent = 'Your saved answers are still loading and this saves as soon as they arrive.';
    }
  }
  // OFFERS GO WHERE THE PROFILE KEEPS THEM. An offer is a skill, a thing or a space (Jessie: "skills are one subset of
  // offers"). Things and spaces are ikigai.haves, My haves on the profile; a new skill offered here also joins
  // ikigai.skills. What was loaded goes back exactly as it arrived, kind and all, which the old save lost by sending
  // the box's cleaned names.
  // SECTORS GO TO SECTORS (row 176, 2026-09-15). "What do you care about?" offers the sector words too, and every pick was
  // saved among the care-about words in ikigai.values, the very words row 158 had just moved out. A pick that is on the
  // reference sectors list now goes to ikigai.domains (domainsTags, which the backend only ever adds to); the rest stay
  // care-about words. A sector written the values way ("Word:Value:level") drops the Value on the way across.
  function gpSplitCare(tags){
    var rd = window._gpRd || {}, sec = {};
    (rd.domains || []).forEach(function(v){ var w = String((v && v.item !== undefined) ? v.item : v).trim().toLowerCase(); if (w) sec[w] = 1; });
    var vals = [], doms = [];
    String(tags || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){
      var bits = t.split(':'), w = String(bits[0] || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
      if (!sec[w.toLowerCase()]) { vals.push(t); return; }
      var lvl = (bits[1] === 'Value') ? (bits[2] || '') : (bits[1] || '');
      doms.push(w + (lvl ? ':' + lvl : ''));
    });
    return { values: vals.join('|'), domains: doms.join('|') };
  }
  function gpOfferParts(){
    var el = document.getElementById('gp-intro-introOffer');
    var orig = _gpOrig.introOffer || {}, hn = window._gpHaveNames || {};
    var items = String((el && el.value) || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean)
      .map(function(w){ return orig[w.toLowerCase()] || w; });
    var haves = [], skills = [];
    items.forEach(function(raw){
      var bits = raw.split(':'), name = String(bits[0] || '').trim().replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase();
      var kind = bits.length > 1 ? String(bits[bits.length - 1]).trim().toLowerCase() : '';
      if (hn[name] || kind === 'thing' || kind === 'space') haves.push(raw);
      else if (kind === 'skill' && !orig[name]) skills.push(raw);
    });
    // The answer in words, the tags beside it. introOffer was written from the tag forms ("…:skill"), so a profile showed
    // "astrology and human design readings:skill" as somebody's own sentence (row 179). Words only now.

  // somebody staring at nothing, then fill it in when their answers arrive.
  gpRenderIntro(null);
  // NOTHING IS ASKED BEFORE THE SAVED ANSWERS ARE HERE (2026-09-13, from the creating.works chat at Jessie's request).
  // Empty questions claimed nothing had been said. Until getIntake answers, the card holds only the breathing pill.
  function gpWaiting(on){
    (function(){
      // ROW 212: whose answers, not just "information". Looking at somebody you have not opened before is the whole
      // backend read (12 to 120 seconds); the gate only keeps a person for 30 seconds once, so the first look pays it.
      var pill = document.querySelector('#gp-wait .cw-loading');
      if (!pill) return;
      var who = '';
      try { who = gpViewingSomebodyElse() ? String((CW.me() && CW.me().name) || '').trim() : ''; } catch (e) {}
      pill.textContent = who ? ('Loading ' + who + '\u2019s answers') : (gpViewingSomebodyElse() ? 'Loading their answers' : 'Loading your information');
    })();
    var w = document.getElementById('gp-wait'), q = document.getElementById('gp-intro-qs'), f = document.getElementById('gp-footer');
    if (w) w.style.display = on ? '' : 'none';
    if (q) q.style.display = on ? 'none' : '';
    if (f) f.style.display = on ? 'none' : 'flex';
  }
  if (meId) gpWaiting(true);
  // Most people answered these long before the intro* columns existed, and their words
  // sit one column away under the older names. Asking somebody to type out again what
  // we already hold is how a form earns a reputation for not listening, so fall back to
  // the older field wherever the newer one is empty.
  var GP_OLDER = {
    introNeed:   'needs',
    introEnjoy:  'interests',
    introSkills: 'skills',
    introValues: 'values',
    introOffer:  'offers'
  };

  // ASKED TWICE BEFORE SAYING IT DID NOT LOAD. Jessie, 2026-09-15, with a picture of "Your saved answers did not load": the
  // read had failed once, and the same read answered in 5 seconds a minute later. A failed or error answer is asked again two
  // seconds on (Cloudflare usually holds a copy by then); only a second failure is said, with Try again.
  function gpAskIntake(){
    var ask = function(){
      return fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(meId))
        .then(function(r){ return r.json(); })
        .then(function(d){ if (!d || d.status === 'error') throw new Error('no answer'); return d; });
    };
    return ask().catch(function(){ return new Promise(function(ok){ setTimeout(ok, 2000); }).then(ask); });
  }
  if (meId) {
    gpAskIntake()
      .then(function(d){
        var have = (d && d.data) || {};
        var use = {}, any = false;
        // The person's work picks (ikigai.workValues, and needs marked :work) never show in the Needs box (2026-09-15).
        var _workNames = {};
        if (GP_RAIL) {
          String(have.workValues || '').split('|').concat(String(have.needs || '').split('|').filter(function(x){ return /:work$/i.test(x); }))
            .forEach(function(x){ var n = String(x).split(':')[0].trim().toLowerCase(); if (n) _workNames[n] = 1; });
        }
        GP_INTRO_Q.forEach(function(q){
          // The real column holds tags, not sentences: items split by | and each one
          // carrying its type and level after a colon, as in "Ping Pong:Participant".
          // Shown raw that reads as gibberish, so keep the names only. An older picker also
          // stored the emoji with the word, and the picture was always decoration.
          var clean = function(part){
            var name = String(part).split(':')[0].trim();
            return name.replace(/^[^\p{L}\p{N}]+/u, '').trim();
          };
          // Both, not one or the other. This used to fall back to the real column only when the
          // intro's own field was empty, so a single word typed here hid a list somebody had
          // spent months building. Nobody loses what they already said.
          var seenW = {}, all = [];
          _gpOrig[q.key] = _gpOrig[q.key] || {};
          // Each list has its own separator and only its own. The real column is pipe
          // separated and a single item may hold commas of its own, as "Kayaking:Fan,Participant"
          // does. Splitting it on commas too tore that in half and invented a person who enjoys
          // "Participant".
          [[String(have[GP_OLDER[q.key]] || ''), '|'],
           [q.key === 'introOffer' ? String(have.haves || '') : '', '|'],   // My haves, from the profile
           [String(have[q.key] || ''), ',']].forEach(function(pair){
            pair[0].split(pair[1]).forEach(function(part){
              var w = clean(part);
              if (!w) return;
              var kw = w.toLowerCase();
              // Remember the fullest version seen, so a level or a category survives the trip.
              var raw = String(part).trim();
              if (raw && (!_gpOrig[q.key][kw] || raw.length > _gpOrig[q.key][kw].length)) {
                _gpOrig[q.key][kw] = raw;
              }
              if (seenW[kw]) return;
              if (q.key === 'introNeed' && (_workNames[kw] || /:work$/i.test(raw))) return;
              seenW[kw] = 1; all.push(w);
            });
          });
          var v = all.join(', ');
          if (v) { use[q.key] = v; any = true; }
        });
        // Anything already chosen shows as chosen, so nobody picks their own languages twice.
        String(have.languages || '').split(/[|,]/).forEach(function(l){
          var v = String(l).trim(); if (v) { _gpLangPicked[v] = true; any = true; }
        });
        String(have.methods || '').split('|').forEach(function(m){
          var v = String(m).trim(); if (v) { _gpMethodPicked[v] = true; any = true; }
        });
        // APPRECIATION IS READ BACK (2026-09-13). It never was, so this opened empty and every save erased it.
        String(have.appreciation || '').split('|').forEach(function(a){
          var v = String(a).trim(); if (v) { _gpThanksPicked[v] = true; any = true; }
        });
        // Open to work: the saved columns, or the kinds the old intake kept in ikigai.retired.
        var _ow = function(v){ return String(v || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean); };
        var _owPaid = _ow(have.openToPaidWork), _owTime = _ow(have.openToUnpaidTime), _owUnpaid = _ow(have.openToUnpaidWork);
        if (!_owPaid.length && !_owTime.length && !_owUnpaid.length) {
          _owPaid = _ow(have.retired).filter(function(x){ return x.indexOf('kind:') === 0; }).map(function(x){ return x.slice(5).trim(); }).filter(Boolean);
        }
        _owPaid.forEach(function(v){ _gpOtw.paid[v] = true; any = true; });
        _owTime.forEach(function(v){ _gpOtw.unpaidTime[v] = true; any = true; });
        _owUnpaid.forEach(function(v){ _gpOtw.unpaid[v] = true; any = true; });
        _ow(have.servesWho).forEach(function(v){ _gpServe[v] = true; any = true; });
        if (GP_RAIL) {
          // What work gives me: the needs marked :work (Money and the other kinds of thing) and ikigai.workValues.
          _ow(have.needs).filter(function(x){ return /:work$/i.test(x); }).map(function(x){ return x.replace(/:work$/i, ''); })
            .concat(_ow(have.workValues)).forEach(function(v){ _gpWork[v] = true; any = true; });
          window._gpOTW = _owPaid.length > 0 || _owTime.length > 0 || _owUnpaid.length > 0 || Object.keys(_gpWork).length > 0;
          _ow(have.domains || have.sectors).forEach(function(v){ var n = String(v).split(':')[0].trim(); if (n) { _gpSectors[n] = true; _gpSectorsRaw[n.toLowerCase()] = v; } });
          window._gpPurpose = String(have.purpose || '');
          _gpHaves = _ow(have.haves);
          _gpPlace = { county: String(have.county || '').trim(), city: String(have.city || '').trim(), postal: String(have.postal || '').trim() };
          var _bal = String(have.seekingBalance || '').trim().toLowerCase();
          window._gpBal = _bal === 'true' ? true : (_bal === 'false' ? false : null);
          try { if (window._gpPaintBalance) window._gpPaintBalance(); } catch (e) {}
          gpPermLoad(have.permissions || [], String(have.visPublic || '').trim().toLowerCase() === 'true');
        }
        window._gpHaveNames = {};
        String(have.haves || '').split('|').forEach(function(h){
          var n = String(h).split(':')[0].trim().replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase();
          if (n) window._gpHaveNames[n] = 1;
        });
        GP_INTRO_Q.forEach(function(q){
          var el = document.getElementById('gp-intro-' + q.key);
          var typed = el ? String(el.value || '').trim() : '';
          if (typed) { use[q.key] = typed; any = true; }
        });
        gpLocFrom(have.location);
        if (gpLocString(_gpLoc)) any = true;
        window._gpLoaded = true;
        if (any) { gpRenderIntro(use); }
        // A Next pressed while loading saves now, with the saved answers in.
        if (window._gpWantedSave) { window._gpWantedSave = false; var _st = document.getElementById('gp-intro-status'); if (_st) _st.textContent = ''; gpQuietSave(); }
        gpWaiting(false);
      })
      .catch(function(){ window._gpLoadFailed = true; gpWaiting(false); gpLoadNote(); });
  }
</script>
