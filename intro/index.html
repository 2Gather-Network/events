<body>
<div class="wrap">
  <a class="crumb" id="intro-back" role="link" tabindex="0">&lsaquo; Back</a>
  <div class="card">
    <div style="font-size:22px;font-weight:800;color:#1A2E42;margin:0 0 6px;" id="gp-intro-title">Before you go in</div>
    <p id="gp-intro-lede" style="font-size:14.5px;color:#6B7A8D;margin:0 0 22px;line-height:1.55;">
      Your answers below help others get to know you and will generate matches to the right people
      over time. Answer what you like now and add the rest whenever.</p>
    <div id="gp-intro-qs"></div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid #f0f1f5;flex-wrap:wrap;">
      <button type="button" id="gp-step-back" style="display:none;font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:24px;border:1.5px solid #C9DFF3;background:#fff;color:#1F699E;cursor:pointer;">Back</button>
      <span id="gp-step-count" style="font-size:13px;color:#6B7A8D;"></span>
      <span id="gp-step-note" style="font-size:13px;color:#7A2410;"></span>
      <span style="flex:1;"></span>
      <span id="gp-intro-status" style="font-size:13px;color:#6B7A8D;"></span>
      <button type="button" id="gp-step-skip" style="display:none;font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:24px;border:0;background:transparent;color:#6B7A8D;cursor:pointer;text-decoration:underline;">Skip this</button>
      <button class="btn" id="gp-step-next">Next</button>
    </div>
  </div>
</div>
<script>
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var params = new URLSearchParams(window.location.search);
  var meId = CW.me().id;
  // Where to send somebody once they are through. Only our own two hosts are accepted, so a
  // crafted link cannot use this page to bounce anybody somewhere else.
  var _next = (function(){
    var raw = params.get('next') || '';
    try {
      var u = new URL(raw, 'https://2gather.network');
      if (u.host === '2gather.network' || u.host === 'gather.2gather.network'
          || u.host === 'creating.works') return u.toString();
    } catch(err){}
    return 'https://2gather.network/mygroups' + (meId ? '?CWid=' + encodeURIComponent(meId) : '');
  })();
  // Somebody arriving on their way into a group is told about the group, and somebody on
  // their way to an event is told about the event. The link can say which with ?for=event,
  // and when it does not, where it is sending them says it instead.
  var GP_FOR = (function(){
    var said = String(params.get('for') || '').trim().toLowerCase();
    if (said === 'event' || said === 'group') return said;
    return /\/(events?|e)\//.test(_next) ? 'event' : 'group';
  })();
  // Nothing here can be saved by somebody the site does not know, so nobody is left filling in
  // a form that will quietly throw their answers away. They are sent to sign in and brought
  // straight back to this exact address. Jessie's rule, 2026-08-30: any page that writes sends a
  // signed-out person to sign in first.
  if (!meId) {
    var _here = encodeURIComponent(location.pathname + location.search);
    window.location.replace('/signin/?next=' + _here);
  }
  window._gpAlreadyIn = (params.get('already') || '') === '1';
  window._gpFirstTime = (params.get('first') || '') === '1';
  // The group bundle is cached for a minute, and the answer just changed. Without this the
  // page somebody lands on could still believe they had not answered and ask again.
  function _introDone(){
    var u = _next + (_next.indexOf('?') > -1 ? '&' : '?') + 'nocache=1';
    window.location.href = u;
  }

  var GP_INTRO_Q = [
    { key:'introNeed',   need:false, q:'What do you need?',
      hint:'Something you are looking for right now. Leave it blank if there is nothing.',
      ph:'A cat sitter for the last week of September, a massage therapist local to Seattle, and someone who can help me get a PT nursing job where I can travel anywhere.' },
    { key:'introEnjoy',  need:true,  q:'What do you enjoy?',
      hint:'What you love doing.',
      ph:'Pickleball, kayaking, singing badly in a group, anything on the water.' },
    { key:'introSkills', need:true,  q:'What skills pay the bills and/or how do you like helping others?',
      hint:'Name whatever you’re good at. You are multi-dimensional so please shine your light! ✨',
      ph:'Facilitating a room full of people who disagree. Experience design. Cutting short hair, helping people move (I’m great at finding ways to make small spaces very functional!)' },
    { key:'introValues', need:false, q:'What do you care about?',
      hint:'What matters to you, and what you want more of in the world. Leave it blank if you would rather not say.',
      ph:'Housing, food security, keeping the lake swimmable…' },
    { key:'introOffer',  need:false, q:'Do you have a thing you want to offer right now?',
      hint:'A thing, a space, or a resource you can share. Leave it blank if there is nothing right now.',
      ph:'A spare room for the month of September, a truck for moving stuff, a meeting space to meet each week, and gardening tools.' }
  ];
  // Shown to a person, stored as the category that already exists on the giving page.
  var GP_THANKS = [
    { label:'\u{1F48E} Money',                        value:'Money' },
    { label:'\u{1F49B} Say thank you',                value:'Say thank you' },
    { label:'✨ Acts of service',                 value:'Acts of service' },
    { label:'\u{1F4E6} Something from my gift list',  value:'Physical goods' },
    { label:'\u{1F331} Pass it on to somebody else',  value:'Pass it on' }
  ];
  var _gpThanksPicked = {};

  // Chips under every question. Somebody in a hurry taps and moves on, somebody with something
  // specific to say still types it. The words come from the reference sheet, so a tap produces
  // something matching already knows.
  //
  //   need + offer  three pills, a person, a place, a thing
  //   enjoy         the five kinds of recreation, which is all of them
  //   skills        five categories, More opens the other thirteen
  //   care about    social or ecological first, then that side's values, and you can flip
  // Published 2026-08-26. Everybody gets the chips. ?chips=0 turns them off, which is only
  // there so the two versions can be put side by side.
  var GP_CHIPS_ON = (params.get('chips') || '') !== '0';
  // Browse by category, behind ?browse=1 while Jessie looks at it. Off by default, so the live
  // page is untouched for everybody else.
  // Was the mockup, is now the intro. Jessie, 2026-08-30: go live on it. Turned around rather
  // than deleted, so ?browse=0 still reaches the older one if anything here turns out wrong.
  // The twenty-three forks below come out in one pass later; a deletion tonight is a deletion
  // nobody could check.
  var GP_BROWSE = (params.get('browse') || '') !== '0';
  var GP_BROWSE_KEYS = { introEnjoy:1, introSkills:1, introValues:1 };
  var GP_CHIPS = {
    introEnjoy:  { words: ['Sports', 'Outdoor & Nature', 'Making & Collecting', 'Movement & Performance', 'Games & Strategy'] },
    introSkills: { lead: 'And/or tap any category below...',
                   words: ['Home & Construction', 'Business & Finance', 'Physical Wellbeing', 'Arts & Culture', 'Technology & Communications'],
                   more:  ['Community & Civic', 'Mechanical & Manufacturing', 'Food & Drink', 'Transportation', 'Family Wellbeing',
                           'Self-Expression & Beauty', 'Mental Wellbeing', 'Nature & Outdoors', 'Pets & Animal Care',
                           'Events & Gatherings', 'Making & Collecting', 'Recreation & Hobbies', 'Basic needs and security'] },
    introValues: { lenses: [
                     { label:'Social',
                       words:['Housing and Shelter', 'Food Security', 'Safety and Peace', 'Community Health', 'Economic Opportunity'],
                       more: ['Physical Wellbeing', 'Mental Wellbeing', 'Urgent Medical Care', 'Clothing and Supplies',
                              'Empowerment and Resilience', 'Freedom and Autonomy', 'Personal Expression', 'Local Economic Vitality',
                              'Wealth Equity', 'Quality Goods and Services', 'Information Access', 'Social and Civic Engagement',
                              'Cultural Vitality', 'Shared Community Resources', 'Transportation Access', 'Reliable Utilities',
                              'Digital Connectivity'] },
                     { label:'Ecological',
                       words:['Clean Water', 'Clean Air', 'Climate Stability', 'Biodiversity', 'Clean Energy'],
                       more: ['Clean Soil', 'Clean Food', 'Animal Welfare', 'Water Security', 'Land Security', 'Eco Values'] }
                   ] },
  };
  var _gpChipsPicked = {};
  var _gpLangPicked = {}, _gpMethodPicked = {};
  var GP_LANGS = ['English','Mandarin','Cantonese','Hindi','Spanish','Arabic','Bengali','Portuguese','French','Urdu',
    'Russian','Indonesian','German','Japanese','Swahili','Marathi','Telugu','Turkish','Tamil','Vietnamese','Korean',
    'Italian','Thai','Persian (Farsi)','Polish','Pashto','Punjabi','Ukrainian','Malayalam','Kannada','Romanian','Dutch',
    'Greek','Czech','Hungarian','Gujarati','Somali','Swedish','Norwegian','Hebrew','Danish','Finnish','Albanian',
    'Croatian','Lithuanian','Nepali','Khmer (Cambodian)','Hmong','Estonian','Laotian','Sign Language'];
  // The short form, spelled exactly as the profile stores it, so the two pages never disagree
  // about what somebody said.
  var GP_METHODS = ['\u{1F5C2} Organizing and planning','\u{1F527} Repairing and fixing',
    '\u{1F4DA} Demonstrating what I know','\u{1F9ED} Consulting and advising',
    '\u{1F300} Facilitating and coaching','\u{1F3A8} Making and designing','\u{1F33F} Caring and healing'];

  function gpPickRow(all, picked, firstN){
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){
        picked[word] = !picked[word]; paint();
        // A language chosen here is what unlocks step 0, so the footer is told.
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

  function gpBlock(title, hint, body){
    var w = document.createElement('div');
    w.style.cssText = 'padding:18px 0;border-top:1px solid #f0f1f5;';
    var t = document.createElement('div');
    t.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    t.textContent = title;
    var h = document.createElement('div');
    h.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    h.textContent = hint;
    w.appendChild(t); w.appendChild(h); w.appendChild(body);
    return w;
  }

  // The search is for the long tail. It is not on screen until somebody has asked for more
  // than the eight in front of them, because a search box beside eight buttons is a question
  // nobody was asking. Picking a language out of the search lights the button that is already
  // there rather than adding a second one that says the same word.
  function gpLanguagesBlockBrowse(){
    var wrap = document.createElement('div');
    var btns = {};
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';

    function paint(word){
      var b = btns[word]; if (!b) return;
      b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + (_gpLangPicked[word]
            ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    }
    function chip(word){
      if (btns[word]) return btns[word];
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = word;
      btns[word] = b;
      b.addEventListener('click', function(){
        _gpLangPicked[word] = !_gpLangPicked[word];
        paint(word);
        if (typeof gpStepPaint === 'function') gpStepPaint();
      });
      paint(word);
      return b;
    }
    function turnOn(word){
      _gpLangPicked[word] = true;
      if (!btns[word]) row.appendChild(chip(word));
      paint(word);
      if (typeof gpStepPaint === 'function') gpStepPaint();
    }

    // The search, above the chips, and not on screen until More is pressed.
    var searchWrap = document.createElement('div');
    searchWrap.style.cssText = 'display:none;margin-bottom:10px;';
    var line = document.createElement('div');
    line.style.cssText = 'display:flex;gap:8px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Search languages';
    inp.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
      + 'padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var add = document.createElement('button');
    add.type = 'button';
    add.textContent = 'Add';
    add.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:20px;'
      + 'border:0;background:#1F699E;color:#fff;cursor:pointer;';
    line.appendChild(inp); line.appendChild(add);
    var hits = document.createElement('div');
    hits.style.cssText = 'margin-top:6px;';
    searchWrap.appendChild(line); searchWrap.appendChild(hits);

    function clearSearch(){ inp.value = ''; hits.innerHTML = ''; }
    inp.addEventListener('input', function(){
      var t = String(inp.value || '').trim().toLowerCase();
      hits.innerHTML = '';
      if (t.length < 2) return;
      GP_LANGS.filter(function(w){ return w.toLowerCase().indexOf(t) > -1; }).slice(0, 6)
        .forEach(function(w){
          var r = document.createElement('div');
          r.setAttribute('role', 'button');
          r.tabIndex = 0;
          r.style.cssText = 'border:1px solid #DDE3EA;border-radius:10px;padding:9px 12px;margin-top:6px;'
            + 'cursor:pointer;background:#fff;font-size:14.5px;font-weight:700;color:#1A2E42;';
          r.textContent = w;
          r.addEventListener('click', function(){
            turnOn(w);
            clearSearch();
            try { btns[w].scrollIntoView({ behavior:'smooth', block:'nearest' }); } catch (e) {}
          });
          hits.appendChild(r);
        });
    });
    function commit(){
      var v = inp.value.trim(); if (!v) return;
      // Typed a language that is already a button? Light that one instead of making a twin.
      var known = null;
      for (var i = 0; i < GP_LANGS.length; i++) {
        if (GP_LANGS[i].toLowerCase() === v.toLowerCase()) { known = GP_LANGS[i]; break; }
      }
      turnOn(known || v);
      clearSearch();
      inp.focus();
    }
    add.addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });

    var first = GP_LANGS.filter(function(w, i){ return i < 8 || _gpLangPicked[w]; });
    var rest  = GP_LANGS.filter(function(w){ return first.indexOf(w) === -1; });
    first.forEach(function(w){ row.appendChild(chip(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(chip(w)); });
        searchWrap.style.display = 'block';
        inp.focus();
      }));
    }
    wrap.appendChild(searchWrap);
    wrap.appendChild(row);
    return gpBlock('Which languages do you speak?', 'So people know they can talk to you in theirs.', wrap);
  }

  function gpLanguagesBlock(){
    if (GP_BROWSE) return gpLanguagesBlockBrowse();
    var picker = gpPickRow(GP_LANGS, _gpLangPicked, 8);
    var wrap = document.createElement('div');
    wrap.appendChild(picker.row);
    var line = document.createElement('div');
    line.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Another language';
    inp.style.cssText = 'flex:1;min-width:0;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
      + 'padding:9px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var add = document.createElement('button');
    add.type = 'button';
    add.textContent = 'Add';
    add.style.cssText = 'font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:20px;'
      + 'border:0;background:#1F699E;color:#fff;cursor:pointer;';
    function commit(){ var v = inp.value.trim(); if (!v) return; picker.add(v); inp.value = ''; inp.focus(); }
    add.addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    line.appendChild(inp); line.appendChild(add);
    wrap.appendChild(line);
    return gpBlock('Which languages do you speak?', 'So people know they can talk to you in theirs.', wrap);
  }

  function gpMethodsBlock(){
    return gpBlock('What comes most naturally to you?',
      'How you like to help, rather than what you know.',
      gpPickRow(GP_METHODS, _gpMethodPicked, 0).row);
  }

  // Faces on the chips. The reference sheet carries an emoji for exactly one list, the seven
  // ways of helping, and nothing else, so these are picked here for now. When an emoji column
  // exists on the reference tabs this map goes and the sheet decides.
  // No people and no hands, so nothing here carries a skin tone.
  // The emoji is decoration only. What lands in the box, and what a tap is stored as, stays the
  // plain word, so nothing downstream has to strip a picture back off.
  var GP_EMOJI = {
    'A service':'\u{1F464}', 'A place':'\u{1F3E0}', 'A thing':'\u{1F4E6}',
    'Sports':'\u26BD', 'Outdoor & Nature':'\u{1F332}', 'Making & Collecting':'\u{1F9F6}',
    'Movement & Performance':'\u{1F3AD}', 'Games & Strategy':'\u{1F3B2}',
    'Home & Construction':'\u{1F528}', 'Business & Finance':'\u{1F4BC}', 'Physical Wellbeing':'\u{1FA7A}',
    'Arts & Culture':'\u{1F5BC}\uFE0F', 'Technology & Communications':'\u{1F4BB}', 'Community & Civic':'\u{1F3DB}\uFE0F',
    'Mechanical & Manufacturing':'\u2699\uFE0F', 'Food & Drink':'\u{1F37D}\uFE0F', 'Transportation':'\u{1F697}',
    'Family Wellbeing':'\u{1F9F8}', 'Self-Expression & Beauty':'\u{1F484}', 'Mental Wellbeing':'\u{1F9E0}',
    'Nature & Outdoors':'\u{1F33F}', 'Pets & Animal Care':'\u{1F43E}', 'Events & Gatherings':'\u{1F389}',
    'Recreation & Hobbies':'\u{1F3AF}', 'Basic needs and security':'\u{1F6DF}',
    'Housing and Shelter':'\u{1F3D8}\uFE0F', 'Food Security':'\u{1F372}', 'Safety and Peace':'\u{1F6E1}\uFE0F',
    'Community Health':'\u{1F3E5}', 'Economic Opportunity':'\u{1F4C8}', 'Urgent Medical Care':'\u{1F691}',
    'Clothing and Supplies':'\u{1F9E5}', 'Empowerment and Resilience':'\u{1F31F}', 'Freedom and Autonomy':'\u{1F54A}\uFE0F',
    'Personal Expression':'\u{1F3A4}', 'Local Economic Vitality':'\u{1F3EA}', 'Wealth Equity':'\u2696\uFE0F',
    'Quality Goods and Services':'\u{1F3F7}\uFE0F', 'Information Access':'\u{1F4F0}', 'Social and Civic Engagement':'\u{1F5F3}\uFE0F',
    'Cultural Vitality':'\u{1F3B6}', 'Shared Community Resources':'\u{1F9FA}', 'Transportation Access':'\u{1F68C}',
    'Reliable Utilities':'\u{1F4A1}', 'Digital Connectivity':'\u{1F4F6}',
    'Clean Water':'\u{1F4A7}', 'Clean Air':'\u{1F32C}\uFE0F', 'Climate Stability':'\u{1F321}\uFE0F',
    'Biodiversity':'\u{1F98B}', 'Clean Energy':'\u26A1', 'Clean Soil':'\u{1FAB1}', 'Clean Food':'\u{1F96C}',
    'Animal Welfare':'\u{1F43F}\uFE0F', 'Water Security':'\u{1F6B0}', 'Land Security':'\u{1F5FA}\uFE0F', 'Eco Values':'\u267B\uFE0F'
  };
  function gpChipLabel(word){ var e = GP_EMOJI[word]; return e ? (e + ' ' + word) : word; }

  // A tapped chip writes its word into the box, so a person sees the answer they just gave and
  // can keep typing after it. It is also kept in _gpChipsPicked, which is what a later change
  // will store as a tag rather than as a sentence.
  function gpChipBtn(key, word, ta){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = gpChipLabel(word);
    var paint = function(){
      b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
        + (_gpChipsPicked[key] && _gpChipsPicked[key][word]
            ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    };
    paint();
    b.addEventListener('click', function(){
      if (!_gpChipsPicked[key]) _gpChipsPicked[key] = {};
      var on = !_gpChipsPicked[key][word];
      _gpChipsPicked[key][word] = on;
      var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
      var at = -1;
      for (var pi = 0; pi < parts.length; pi++) {
        if (parts[pi].toLowerCase() === String(word).toLowerCase()) { at = pi; break; }
      }
      if (on && at === -1) parts.push(word);
      if (!on && at > -1) parts.splice(at, 1);
      ta.value = parts.join(', ');
      paint();
    });
    return b;
  }

  // A quiet pill that opens the rest of a list. It removes itself once pressed, because a
  // control that has already done its work is one more thing to read past.
  function gpMoreBtn(label, onOpen){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + 'background:#EEF1F5;border:1px dashed #C4CDD8;color:#6B7A8D;font-weight:600;';
    b.addEventListener('click', function(){ b.parentNode.removeChild(b); onOpen(); });
    return b;
  }

  // ── The picker, 2026-08-30 ────────────────────────────────────────────────
  // Five concrete examples, a keyword search over the reference sheet, and Other for a word
  // nobody has thought of. The same shape as /profile-edit/, reading the same getReferenceData,
  // so there is one list of words on this site rather than two that drift.
  //
  // Choosing from the search IS the tag: the reference tree already knows that yoga is Movement
  // & Performance. Only a genuinely new word has to be asked about, which is what Other does.
  var GP_PICK = {
    introNeed: {
      // No article. "A massage therapist" matches nothing on the reference sheet, so it went in
      // untagged; "Massage therapist" is the word the sheet actually holds.
      examples: ['Massage therapist', 'Hairstylist', 'Plumber', 'Mechanic', 'Career mentor'],
      tagQ: 'Is that a person, a place or a thing?',
      tagOpts: ['Person', 'Place', 'Thing'], source: 'need'
    },
    introEnjoy: {
      examples: ['Pickleball', 'Karaoke', 'Gundam model kits', 'Walking', 'Board games'],
      tagQ: 'Which of these is it?',
      tagOpts: ['⚽ Sports', '\u{1F332} Outdoor & Nature', '\u{1F9F6} Making & Collecting',
                '\u{1F3AD} Movement & Performance', '\u{1F3B2} Games & Strategy'], source: 'recreation'
    },
    introSkills: {
      examples: ['Massage therapist', 'Hairstylist', 'Accountant', 'Nurse', 'AI specialist'],
      tagQ: 'Which category does it belong to?', tagOpts: null, source: 'skills'
    },
    // The three kinds of thing somebody can offer, the same three the reference sheet holds
    // under offeringTypes.
    introOffer: {
      examples: ['A skill', 'A thing', 'A space'],
      tagQ: 'Tag this to which categories?', tagOpts: null, source: 'resources'
    },
    introValues: {
      examples: ['\u{1F3D8}️ Housing and Shelter', '\u{1F372} Food Security', '\u{1F4A7} Clean Water',
                 '\u{1F32C}️ Clean Air', '⚡ Clean Energy', '\u{1F43F}️ Animal Welfare'],
      tagQ: 'Tag this to which categories?', tagOpts: null, source: 'values'
    }
  };
  // word -> the category it was filed under. Sent to the backend beside the sentence.
  var _gpTags = {};
  // The real columns hold more than a name: "Singing:Participant" carries a level, and
  // "Project Manager:Business & Finance:Expert Level" carries a category and a level too. The
  // screen shows the name alone, so saving the screen back would quietly throw the rest away.
  // What each name arrived as is remembered here and sent back untouched unless it was removed.
  var _gpOrig = {};

  var _gpRefP = null;
  function gpRefOnce(){
    if (_gpRefP) return _gpRefP;
    _gpRefP = fetch(GS_URL + '?action=getReferenceData')
      .then(function(r){ return r.json(); })
      // Kept where the tag options can read it, so a question can be tagged along its own axis.
      .then(function(rd){ window._gpRd = rd; return rd; })
      .catch(function(){ return {}; });
    return _gpRefP;
  }

  // One flat list of {word, cat} per question, which is all the search needs.
  function gpCorpus(source, rd){
    var out = [], seen = {};
    // The reference sheet carries an `associations` column of everyday words, so searching
    // "doctor" finds Physician. Without it the search only matches the formal name, which is
    // the one thing somebody looking for help does not know.
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      // The category comes from the sheet now, so Housing and Shelter arrives knowing it is
      // Social. It used to be filed as the flat word "Values", which told nobody anything.
      (rd.values || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Values', v && v.associations);
      });
      (rd.domains || []).forEach(function(v){
        push((v && v.item !== undefined) ? v.item : v, (v && v.category) || 'Domains', v && v.associations);
      });
      // The values list on the reference sheet is empty today, so the two lenses that have been
      // on this page since August are the corpus. Without this the search finds nothing at all.
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'resources') {
      // Things and spaces people can share. Without this branch the offer question had no words
      // at all, so its search found nothing and every answer went in untagged.
      (rd.resources || []).forEach(function(r){ push(r.item, r.category, r.associations); });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  // Adding a word writes it into the box, so somebody sees the answer they just gave and can
  // keep typing after it, and files the tag beside it.
  function gpAddWord(key, word, cat, ta){
    word = String(word || '').trim(); if (!word) return;
    if (!_gpTags[key]) _gpTags[key] = {};
    _gpTags[key][word] = cat || '';
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].toLowerCase() === word.toLowerCase()) return;
    }
    parts.push(word);
    ta.value = parts.join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpDropWord(key, word, ta){
    if (_gpTags[key]) delete _gpTags[key][word];
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    ta.value = parts.filter(function(p){ return p.toLowerCase() !== String(word).toLowerCase(); }).join(', ');
    if (typeof gpStepPaint === 'function') gpStepPaint();
  }
  function gpHasWord(key, word){
    return !!(_gpTags[key] && _gpTags[key][word] !== undefined);
  }

  function gpPill(label, on){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
            : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
    return b;
  }

  // ── Browse by category ─────────────────────────────────────────────────
  // The walk-down list the profile editor has, built here from getReferenceData rather than
  // typed into the page, and drawn in the intro's own colours. One level on screen at a time:
  // tapping a category replaces what is showing instead of expanding underneath it.
  function gpBuildTree(source, rd){
    var tree = {}, seen = {};
    var add = function(top, sub, item){
      top = String(top || '').trim(); sub = String(sub || '').trim(); item = String(item || '').trim();
      if (!top || !item) return;
      var k = (top + '|' + sub + '|' + item).toLowerCase();
      if (seen[k]) return; seen[k] = 1;
      if (!tree[top]) tree[top] = { subs:{}, items:[] };
      if (sub) { if (!tree[top].subs[sub]) tree[top].subs[sub] = []; tree[top].subs[sub].push(item); }
      else tree[top].items.push(item);
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ add(r.recType, r.category, r.item); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ add(s.category, '', s.item); });
    } else if (source === 'values') {
      var vs = (rd.values || []).filter(function(v){ return v && v.item; });
      if (vs.length) {
        // The sheet carries the category once the backend reads Eco Social Value beside
        // Eco Social Category. Then this is the whole list and the page holds none of it.
        vs.forEach(function(v){ add(v.category || 'Values', '', v.item); });
      } else {
        // Until that one line ships, the two lenses already on this page are the list.
        ((GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || []).forEach(function(l){
          (l.words || []).forEach(function(w){ add(l.label, '', w); });
          (l.more  || []).forEach(function(w){ add(l.label, '', w); });
        });
      }
    }
    return tree;
  }
  function gpLevel(tree, path){
    var alpha = function(x){ return x.slice().sort(function(a,b){ return a.localeCompare(b); }); };
    if (!path.length) return alpha(Object.keys(tree)).map(function(k){ return { name:k, drill:true }; });
    var node = tree[path[0]] || { subs:{}, items:[] };
    if (path.length === 1) {
      var out = alpha(Object.keys(node.subs)).map(function(k){ return { name:k, drill:true }; });
      alpha(node.items).forEach(function(i){ out.push({ name:i, drill:false }); });
      return out;
    }
    return alpha(node.subs[path[1]] || []).map(function(i){ return { name:i, drill:false }; });
  }

  // The joy screen, reshaped 2026-08-30. Five examples and Other, nothing else, because a
  // search box beside five buttons asks a question nobody had yet. Other opens the search.
  var GP_BARE_KEYS = { introEnjoy:1, introSkills:1, introValues:1, introNeed:1, introOffer:1 };
  // Where the card heading already asks the question, the second copy comes off. Needs and
  // haves keeps its headings, because two questions share that screen and they have to be
  // told apart.
  var GP_BARE_HEAD = { introEnjoy:1, introSkills:1, introValues:1 };
  function gpBareKey(key){ return GP_BROWSE && !!GP_BARE_KEYS[key]; }

  function gpPicker(key, ta){
    var cfg = GP_PICK[key];
    if (!GP_CHIPS_ON || !cfg) return null;
    var _bare = gpBareKey(key);
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:12px;';

    // What somebody has chosen, on screen. Without this the only sign that an answer landed was
    // the Next button turning on, because the box that used to show it is hidden now.
    var chosen = document.createElement('div');
    chosen.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;';
    box.appendChild(chosen);
    function gpPaintChosen(){
      chosen.innerHTML = '';
      String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean)
        .forEach(function(w){
          var c = document.createElement('span');
          c.style.cssText = 'display:inline-flex;align-items:center;gap:8px;font-size:13.5px;'
            + 'padding:7px 10px 7px 14px;border-radius:20px;background:#1F699E;color:#fff;font-weight:700;';
          var t2 = document.createElement('span');
          t2.textContent = w;
          var x = document.createElement('button');
          x.type = 'button';
          x.setAttribute('aria-label', 'Remove ' + w);
          x.textContent = '\u00D7';
          x.style.cssText = 'font:inherit;font-size:15px;line-height:1;border:0;background:transparent;'
            + 'color:#fff;cursor:pointer;padding:0 2px;';
          x.addEventListener('click', function(){ gpDropWord(key, w, ta); repaint(); });
          c.appendChild(t2); c.appendChild(x);
          chosen.appendChild(c);
        });
    }

    if (!_bare) {
      var lead = document.createElement('div');
      lead.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
      lead.textContent = 'Search for something, or tap one below.';
      box.appendChild(lead);
    }

    var search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search';
    search.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#F7FBFF;border-radius:10px;'
      + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
    var searchWrap = document.createElement('div');
    if (_bare) searchWrap.style.cssText = 'display:none;margin-bottom:10px;';
    searchWrap.appendChild(search);
    var results = document.createElement('div');
    results.style.cssText = 'margin-top:6px;';
    searchWrap.appendChild(results);
    box.appendChild(searchWrap);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;';
    box.appendChild(row);

    var corpus = [];
    var _browseOn = GP_BROWSE && !!GP_BROWSE_KEYS[key] && !_bare;
    var browseWrap = document.createElement('div');
    browseWrap.style.cssText = 'margin-top:14px;';
    if (_browseOn) {
      box.appendChild(browseWrap);
      // The list has not arrived yet, so say that rather than draw an empty row somebody
      // will read as "there is nothing here".
      var _wait = document.createElement('div');
      _wait.style.cssText = 'font-size:13px;color:#6B7A8D;';
      _wait.textContent = 'Looking up the list\u2026';
      browseWrap.appendChild(_wait);
    }
    gpRefOnce().then(function(rd){
      corpus = gpCorpus(cfg.source, rd);
      if (_browseOn) gpRenderBrowse(gpBuildTree(cfg.source, rd), []);
    });

    // The examples show at the top level and step aside once somebody is inside a category,
    // so there is one list on the screen rather than two.
    function gpRenderBrowse(tree, path){
      browseWrap.innerHTML = '';
      var atTop = !path.length;
      row.style.display = atTop ? 'flex' : 'none';
      if (atTop) {
        var lead2 = document.createElement('div');
        lead2.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        lead2.textContent = 'Or browse by category.';
        browseWrap.appendChild(lead2);
      } else {
        var trail = document.createElement('div');
        trail.style.cssText = 'font-size:13.5px;font-weight:700;color:#1A2E42;margin-bottom:10px;';
        var mkLink = function(text, to){
          var a = document.createElement('a');
          a.href = '#'; a.textContent = text;
          a.style.cssText = 'color:#1F699E;text-decoration:underline;cursor:pointer;';
          a.addEventListener('click', function(e){ e.preventDefault(); gpRenderBrowse(tree, to); });
          return a;
        };
        trail.appendChild(mkLink('All categories', []));
        path.forEach(function(seg, idx){
          var sep = document.createElement('span');
          sep.style.cssText = 'color:#6B7A8D;margin:0 6px;font-weight:400;';
          sep.textContent = '\u203A';
          trail.appendChild(sep);
          if (idx === path.length - 1) {
            var cur = document.createElement('span');
            cur.textContent = seg;
            trail.appendChild(cur);
          } else {
            trail.appendChild(mkLink(seg, path.slice(0, idx + 1)));
          }
        });
        browseWrap.appendChild(trail);
      }
      var lrow = document.createElement('div');
      lrow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
      gpLevel(tree, path).forEach(function(it){
        if (it.drill) {
          // A category opens, a word gets added, and the two are told apart by how they look
          // rather than by a glyph on the label.
          var d = document.createElement('button');
          d.type = 'button';
          d.textContent = it.name;
          d.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
            + 'background:#EDF4FA;border:1px solid #BBD4E8;color:#1A2E42;font-weight:700;';
          d.addEventListener('click', function(){ gpRenderBrowse(tree, path.concat(it.name)); });
          lrow.appendChild(d);
          return;
        }
        // The top of the path IS the tag, because the tree already knows where the word lives.
        var b = gpPill(it.name, gpHasWord(key, it.name));
        b.addEventListener('click', function(){
          if (gpHasWord(key, it.name)) gpDropWord(key, it.name, ta);
          else gpAddWord(key, it.name, path[0] || '', ta);
          gpRenderBrowse(tree, path);
          repaint();
        });
        lrow.appendChild(b);
      });
      browseWrap.appendChild(lrow);
    }

    function repaint(){
      gpPaintChosen();
      Array.prototype.forEach.call(row.querySelectorAll('button[data-word]'), function(b){
        var on = gpHasWord(key, b.getAttribute('data-word'));
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (on ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
                : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      });
    }

    // The five examples. Emoji stay on screen and come off the stored word, so a tag matches
    // what the reference sheet holds rather than a decorated version of it.
    cfg.examples.forEach(function(label){
      var word = label.replace(/^[^A-Za-z0-9]+/, '').trim();
      var b = gpPill(label, gpHasWord(key, word));
      b.setAttribute('data-word', word);
      b.addEventListener('click', function(){
        if (gpHasWord(key, word)) { gpDropWord(key, word, ta); }
        else {
          // An example is usually in the reference sheet too, so it takes that sheet's category
          // rather than arriving untagged. Pickleball files as Sports, not as nothing.
          var cat = '';
          for (var ci = 0; ci < corpus.length; ci++) {
            if (corpus[ci].word.toLowerCase() === word.toLowerCase()) { cat = corpus[ci].cat; break; }
          }
          gpAddWord(key, word, cat, ta);
        }
        repaint();
      });
      row.appendChild(b);
    });

    // Other, and the one question a genuinely new word has to answer.
    var other = document.createElement('button');
    other.type = 'button';
    other.textContent = '+ Other';
    other.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
      + 'background:#EEF1F5;border:1px dashed #C4CDD8;color:#6B7A8D;font-weight:600;';
    if (_browseOn) {
      // Its own row, below the browse, so it is still there when the examples have stepped aside.
      var otherRow = document.createElement('div');
      otherRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;';
      otherRow.appendChild(other);
      box.appendChild(otherRow);
    } else {
      row.appendChild(other);
    }

    var otherBox = document.createElement('div');
    otherBox.style.cssText = 'display:none;margin-top:10px;';
    box.appendChild(otherBox);

    other.addEventListener('click', function(){
      // Other opens the search and nothing else. The search now offers "Add this to my list"
      // when it finds nothing, so a second box asking for the same words was the same question
      // twice on one screen.
      if (_bare) {
        searchWrap.style.display = 'block';
        try { search.focus(); } catch (e) {}
        return;
      }
      otherBox.style.display = otherBox.style.display === 'none' ? 'block' : 'none';
      if (otherBox.style.display === 'none') { otherBox.innerHTML = ''; return; }
      otherBox.innerHTML = '';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'In your own words';
      inp.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;background:#fff;border-radius:10px;'
        + 'padding:10px 12px;font:inherit;font-size:14px;color:#1A2E42;outline:none;';
      otherBox.appendChild(inp);
      var ask = document.createElement('div');
      ask.style.cssText = 'margin-top:8px;';
      otherBox.appendChild(ask);
      inp.focus();

      var commit = function(){
        var word = String(inp.value || '').trim();
        if (!word) return;
        // Already in the reference sheet? Then it is not new and it keeps that sheet's category.
        var hit = null;
        for (var i = 0; i < corpus.length; i++) {
          if (corpus[i].word.toLowerCase() === word.toLowerCase()) { hit = corpus[i]; break; }
        }
        if (hit) {
          gpAddWord(key, hit.word, hit.cat, ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        if (!cfg.tagQ) {
          gpAddWord(key, word, '', ta);
          otherBox.style.display = 'none'; otherBox.innerHTML = '';
          return;
        }
        ask.innerHTML = '';
        var q = document.createElement('div');
        q.style.cssText = 'font-size:13px;color:#6B7A8D;margin-bottom:8px;';
        q.textContent = cfg.tagQ;
        ask.appendChild(q);
        var opts = cfg.tagOpts;
        if (!opts) {
          // Skills and values take their categories from the reference sheet itself.
          var seen = {}; opts = [];
          corpus.forEach(function(c){ if (c.cat && !seen[c.cat]) { seen[c.cat] = 1; opts.push(c.cat); } });
        }
        var orow = document.createElement('div');
        orow.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
        opts.forEach(function(o){
          var ob = gpPill(o, false);
          ob.addEventListener('click', function(){
            gpAddWord(key, word, o.replace(/^[^A-Za-z0-9]+/, '').trim(), ta);
            otherBox.style.display = 'none'; otherBox.innerHTML = '';
          });
          orow.appendChild(ob);
        });
        ask.appendChild(orow);
      };
      inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
      var add = document.createElement('button');
      add.type = 'button';
      add.textContent = 'Add';
      add.style.cssText = 'margin-top:8px;font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;'
        + 'border-radius:20px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;';
      add.addEventListener('click', commit);
      otherBox.insertBefore(add, ask);
    });

    // Nothing matched, so the search becomes the way in rather than a dead end pointing at
    // another button. A word nobody has used before still has to be filed, which is the one
    // question Other asks, and it is asked right here instead.
    function gpAddNew(word, mount, done){
      word = String(word || '').trim(); if (!word) return;
      // Typed something the sheet already knows? Then it is not new and it keeps that category.
      for (var i = 0; i < corpus.length; i++) {
        if (corpus[i].word.toLowerCase() === word.toLowerCase()) {
          gpAddWord(key, corpus[i].word, corpus[i].cat, ta); repaint(); if (done) done(); return;
        }
      }
      // 2026-08-30. The tag question is gone. It asked somebody to do taxonomy work that was
      // unwanted and modelled the wrong thing, and it only ever fired on a word nobody had used
      // before, which is exactly where a person's guess is worst. A word the sheet already knows
      // still arrives with its category, because the sheet knows it. A new word is saved as it
      // was typed. See design/data-direction-edges-not-categories.md.
      gpAddWord(key, word, '', ta);
      repaint();
      if (done) done();
      if (typeof gpStepPaint === 'function') gpStepPaint();
    }

    // Search. Filters as you type, because pressing a button to search reads as broken.
    search.addEventListener('input', function(){
      var t = String(search.value || '').trim().toLowerCase();
      results.innerHTML = '';
      if (t.length < 2) return;
      var hits = corpus.filter(function(c){
        return c.word.toLowerCase().indexOf(t) > -1 || (c.assoc && c.assoc.indexOf(t) > -1);
      }).slice(0, 6);
      hits.forEach(function(h){
        var r = document.createElement('div');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;

  // ---- A face, before the words -------------------------------------------
  // This lives here rather than on the sign-up page on purpose. Somebody who gives up on
  // sign-up was never here; somebody who gives up on this page is already in and can come back
  // to it whenever they like. So the optional things belong on this side of the door.
  var PHOTO_URL = 'https://cw-photos.jessieupp.workers.dev';
  var _gpPhotoToken = '';

  // The same session the profile editor asks for. Signing up wrote it under both names, so
  // either will do and neither means asking somebody for a second code.
  function gpToken(){
    if (_gpPhotoToken) return _gpPhotoToken;
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.t && (!o.exp || o.exp > Date.now())) { _gpPhotoToken = o.t; return _gpPhotoToken; }
      }
      var t2 = localStorage.getItem('cw-token') || '';
      var who = String(localStorage.getItem('cw-id') || '').split('.').join('').toLowerCase();
      if (t2 && who && who === norm) {
        var exp = parseInt(String(t2).split('.')[1], 10);
        if (exp && Date.now() <= exp - 60000) { _gpPhotoToken = t2; return _gpPhotoToken; }
      }
    } catch (e) {}
    return '';
  }

  function gpPhotoStat(msg){ var el = document.getElementById('gp-photo-stat'); if (el) el.textContent = msg || ''; }
  function gpPhotoShow(url){
