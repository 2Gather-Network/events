  function gpPickRow(all, picked, firstN, label, onChange){
    var row = document.createElement('div');

    function btn(word){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label ? label(word) : word;
      b.setAttribute('data-find', (word + ' ' + (label ? label(word) : '')).toLowerCase());
      if (label && label(word) !== word) b.title = word;
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (picked[word]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      paint();
      b.addEventListener('click', function(){ picked[word] = !picked[word]; paint(); if (onChange) onChange(); });
      return b;
    }
    var shown = all.filter(function(w, i){ return !firstN || i < firstN || picked[w]; });
    var rest  = all.filter(function(w){ return shown.indexOf(w) === -1; });
    shown.forEach(function(w){ row.appendChild(btn(w)); });
    if (rest.length) {
      row.appendChild(gpMoreBtn('More', function(){
        rest.forEach(function(w){ row.appendChild(btn(w)); });
      }));
    }
    return { row: row, add: function(w){ picked[w] = true; row.appendChild(btn(w)); } };
  }

  function gpHandleOk(v){ return /^[a-z0-9-]{2,30}$/.test(v); }

  function gpHandleFree(v){
    return fetch(GS_URL + '?action=checkVanity&slug=' + encodeURIComponent(v)).then(function(r){ return r.json(); }).then(function(d){ return !!(d && d.available); }).catch(function(){ return null; });
  }
  function gpHandleInit(d, wrap){

    if (!el || !holder) return;
    var have = gpHandleClean(d && d.vanity), nm = String((d && d.name) || '').trim();
    var sug = have || gpHandleFromName(nm);
    if (!sug) return;
    _gpHandle.have = have; _gpHandle.auto = !have; _gpHandle.ready = true;
    el.value = sug; holder.style.display = '';
    var timer = null;
    el.addEventListener('input', function(){
      _gpHandle.auto = false;
      var v = gpHandleClean(el.value);
      if (timer) clearTimeout(timer);
      if (v === _gpHandle.have) { gpHandleSay(''); return; }
      if (!gpHandleOk(v)) { gpHandleSay(v ? 'Use 2 to 30 letters, numbers or dashes.' : '', true); return; }
      gpHandleSay('Checking…');
      timer = setTimeout(function(){ gpHandleFree(v).then(function(ok){ if (gpHandleClean(el.value) !== v) return; if (ok === null) gpHandleSay('Could not check that just now.', true); else gpHandleSay(ok ? v + ' is free.' : 'Somebody already has that name.', !ok); }); }, 450);
    });
    if (!have) gpHandleFree(sug).then(function(ok){ if (ok === false && _gpHandle.auto) gpHandleSay('That one is taken. A number is added when you continue.'); });
  }
  function gpHandleSave(){

    return gp.then(function(g){
      var has = !!(g && ['joys', 'cares', 'skills'].some(function(x){ return gpJoinList(g, x).length; }));
      if (g && g.name) {
        window._ioGroupName = g.name;
        var cb = document.getElementById('intro-back'); if (cb && params.get('next') && !params.get('groupName')) cb.textContent = '\u2039 Back to ' + g.name;
      }
      if (has && done) {
        STEPS.splice(1, 0, { slug: 'interests', rail: 'Interests', keys: ['groupInterests'] });
        ix = -1; STEPS.forEach(function(s, i){ if (s.slug === want) ix = i; });
      }
      if (done && window.GP_JOINING && (ix < 0 || (STEPS[ix] && (STEPS[ix].slug === 'interests' || STEPS[ix].slug === 'start')))) {
        if (!has && backTo) { ioWait.textContent = 'Joining the group'; _introDone(); return; }
        if (has && STEPS.some(function(s){ return s.slug === 'interests'; })) {
          window._ioJoinOnly = true;
          if (ioWait.parentNode) ioWait.parentNode.removeChild(ioWait);
          view = 'interests';
          show();
          return;
        }
      }
      if (done && backTo) { ioWait.textContent = forGroup ? 'Joining the group' : 'Opening the event'; _introDone(); return; }
      if (ioWait.parentNode) ioWait.parentNode.removeChild(ioWait);
      view = STEPS[ix > -1 ? ix : 0].slug;
      show();
    });
  }).catch(function(){
    if (ioWait.parentNode) ioWait.parentNode.removeChild(ioWait); title.style.display = '';
    title.textContent = 'Your saved answers did not load';
    var p = document.createElement('p'); p.style.cssText = 'font-size:14.5px;color:#7A2410;';
    p.textContent = 'Nothing here can save until they do, so your real answers are safe. ';
    var a = document.createElement('a'); a.href = location.href; a.textContent = 'Try again'; p.appendChild(a);
    title.parentNode.insertBefore(p, title.nextSibling);
  });
})();
</script>
