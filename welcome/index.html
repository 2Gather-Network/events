<!-- Version: V1.00 | Date: 2026-08-28 | LAST CHANGE: Finishing the questions is an arrival, not a hand-off. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="You are in · 2Gather">
<title>You are in · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{display:flex;justify-content:center;padding:40px 18px 70px;}
  .card{background:#fff;border-radius:16px;padding:34px 34px 30px;max-width:640px;width:100%;}
  h1{font-size:24px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  p.lede{font-size:15px;color:var(--soft);line-height:1.6;margin:0 0 26px;}
  .door{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--panel);
        border:1.5px solid var(--panel-line);border-radius:14px;padding:16px 18px;margin-bottom:12px;
        font:inherit;color:var(--ink);cursor:pointer;}
  .door:hover{border-color:var(--brand);background:#fff;}
  .door .face{font-size:24px;flex-shrink:0;width:32px;text-align:center;}
  .door .say{min-width:0;}
  .door .top{display:block;font-size:16px;font-weight:800;margin-bottom:3px;}
  .door .sub{display:block;font-size:13.5px;color:var(--soft);line-height:1.5;}
  .beta{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:10px;background:var(--brand);
        color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;vertical-align:2px;}
  .quiet{margin-top:22px;font-size:13.5px;color:var(--soft);line-height:1.6;}
  .quiet a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none;}
</style>
  <script src="/nav/identity.js?v=4"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="hello">You are in</h1>
    <p class="lede">What would you like to do first? You can change your mind about any of it
      later.</p>

    <button class="door" data-go="/profile-edit/">
      <span class="face">&#127793;</span>
      <span class="say"><span class="top">Read my own profile</span>
        <span class="sub">What somebody reads when they find you.</span></span>
    </button>

    <button class="door" data-go="/events">
      <span class="face">&#128197;</span>
      <span class="say"><span class="top">Find something happening</span>
        <span class="sub">What is on near you, and who else is going.</span></span>
    </button>

    <button class="door" data-go="/mygroups?join=1">
      <span class="face">&#128273;</span>
      <span class="say"><span class="top">Join a group</span>
        <span class="sub">Somebody gave you a passcode, or invited you. Use it here.</span></span>
    </button>

    <button class="door" data-go="/groups/create/">
      <span class="face">&#127968;</span>
      <span class="say"><span class="top">Start a group</span>
        <span class="sub">Make a place for the people you already know.</span></span>
    </button>

    <button class="door" data-go="/">
      <span class="face">&#128064;</span>
      <span class="say"><span class="top">Look around first</span>
        <span class="sub">Read what other people put up. Take your time.</span></span>
    </button>

    <button class="door" data-go="/giving/">
      <span class="face">&#127873;</span>
      <span class="say"><span class="top">Make a gift list<span class="beta">BETA</span></span>
        <span class="sub">What you would like, so somebody who wants to give you something knows what.</span></span>
    </button>

    <p class="quiet">The menu at the top brings you back here, under More.</p>
  </div>
</div>

<script>
(function () {
  // The name they gave at sign-up is on the device, because somebody who joined tonight has no
  // Glide row to read one from. No name is not a problem worth a fetch on this page.
  try {
    var who = String(localStorage.getItem('cw-first') || '').trim();
    if (who) { document.getElementById('hello').textContent = 'You are in, ' + who; }
  } catch (e) {}

  // Every door is a plain navigation. No ids travel in the address: the device already knows
  // who this is, and an id in a link is a credential.
  var doors = document.querySelectorAll('.door');
  for (var i = 0; i < doors.length; i++) {
    doors[i].addEventListener('click', function () {
      window.location.href = this.getAttribute('data-go');
    });
  }
})();
</script>
<script src="/nav/topbar.js?v=5.55" defer></script>
</body>
