<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);overflow-x:clip;overflow-wrap:break-word;
       font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{display:flex;justify-content:center;padding:48px 16px 70px;}
  .card{background:#fff;border-radius:16px;padding:34px 34px 30px;max-width:440px;width:100%;}
  h1{font-size:23px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  p{font-size:15px;color:var(--soft);line-height:1.6;margin:0;}
  a.btn{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:24px;padding:14px 24px;
        font-weight:700;text-decoration:none;margin-top:22px;}
  @media(max-width:768px){.card{padding:28px 22px 24px;}}
</style>
<script src="https://2gather.network/nav/identity.js?v=34"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="t">Signing you out</h1>
    <p id="s">One moment.</p>
    <a class="btn" id="b" href="/signin/?out=1" style="display:none">Go to sign in</a>
  </div>
</div>
<script>
(function () {
  var SITES = { gather: 'https://2gather.network', appear: 'https://2appear.network' };
  var MAX_HOPS = 6;

  function hereSite() {
    var o = location.protocol + '//' + location.host;
    for (var k in SITES) { if (SITES[k] === o) { return k; } }
    return '';
  }
  function frag() {
    var out = {};
    String(location.hash || '').replace(/^#/, '').split('&').forEach(function (p) {
      if (!p) { return; }
      var i = p.indexOf('=');
      var k = i < 0 ? p : p.slice(0, i);
      var v = i < 0 ? '' : p.slice(i + 1);
      try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) {}
    });
    return out;
  }
  function names(v) {
    var seen = {}, list = [];
    String(v || '').split(',').forEach(function (n) {
      n = n.trim();
      if (SITES[n] && !seen[n]) { seen[n] = true; list.push(n); }
    });
    return list.slice(0, MAX_HOPS);
  }

  var here = hereSite();
  var f = frag();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  if (here && window.CW && CW.forget) { try { CW.forget(); } catch (e) {} }

  var rest = names(f.then).filter(function (n) { return n !== here; });
  var end = SITES[f.end] ? f.end : (here || 'gather');

  if (rest.length) {
    var next = rest[0];
    location.replace(SITES[next] + '/signout/#then=' + encodeURIComponent(rest.slice(1).join(',')) +
      '&end=' + encodeURIComponent(end));
    return;
  }
  location.replace(SITES[end] + '/signin/?out=1');
})();
</script>
</body>
</html>
