<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Sign in · 2Gather">
<title>Sign in · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;
        --ok:#1E6B3A;--bad:#7A2410;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{display:flex;justify-content:center;padding:48px 18px 70px;}
  .card{background:#fff;border-radius:16px;padding:34px 34px 30px;max-width:440px;width:100%;}
  h1{font-size:23px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  p.lede{font-size:15px;color:var(--soft);line-height:1.6;margin:0 0 24px;}
  label{display:block;font-size:14px;font-weight:700;margin:0 0 6px;}
  input{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
        border-radius:10px;padding:13px 15px;}
  input:focus{outline:none;border-color:var(--brand);}
  input.code{letter-spacing:8px;font-size:22px;font-weight:800;text-align:center;}
  button{width:100%;background:var(--brand);color:#fff;border:0;border-radius:24px;padding:14px 24px;
         font:inherit;font-weight:700;cursor:pointer;margin-top:18px;}
  button[disabled]{opacity:.55;cursor:default;}
  .say{margin-top:16px;font-size:14.5px;line-height:1.55;padding:12px 14px;border-radius:10px;
       background:var(--panel);border:1px solid var(--panel-line);display:none;}
  .say.bad{color:var(--bad);}
  .say.ok{color:var(--ok);}
  .quiet{margin-top:22px;font-size:13.5px;color:var(--soft);line-height:1.6;}
  .quiet a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none;}
  .step2{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div class="step1" id="step1">
      <h1>Sign in</h1>
      <p class="lede">One profile across all tools.<br><span style="color:var(--ink);font-weight:700;font-size:15px;">DayBalancer &middot; Appear &middot; 2Gather</span></p>
      <label for="email">Your email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      <button id="send">Send my code</button>
      <div class="say" id="say1"></div>
      <p class="quiet">New here? <a role="link" tabindex="0" data-nav="https://appear.network/"
        onclick="return _safeNavGo(this)">Create your account first.</a></p>
    </div>

    <div class="step2" id="step2">
      <h1>Check your email</h1>
      <p class="lede" id="sentTo">We sent a six digit code. It expires in fifteen minutes.</p>
      <label for="code">Your code</label>
      <input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="000000">
      <button id="verify">Sign me in</button>
      <div class="say" id="say2"></div>
      <p class="quiet">Nothing arrived? Check the spam folder, or
        <a role="link" tabindex="0" id="again">send another code</a>.</p>
    </div>

  </div>
</div>

<script>
window._safeNavGo = window._safeNavGo || function (el) {
  try { var u = el && el.getAttribute && el.getAttribute('data-nav'); if (u) { window.location.href = u; } }
  catch (e) {}
  return false;
};

(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var params = new URLSearchParams(location.search);

  // Where they were headed before we asked who they were. Only our own paths are
  // accepted, so this cannot be used to bounce somebody off to another site.
  var next = String(params.get('next') || '/mygroups/');
  if (next.charAt(0) !== '/' || next.indexOf('//') === 0) { next = '/mygroups/'; }

  var email = '';

  function tell(which, msg, good) {
    var el = document.getElementById(which);
    el.style.display = 'block';
    el.className = 'say ' + (good ? 'ok' : 'bad');
    el.textContent = msg;
  }

  function sendCode(againBtn) {
    var v = document.getElementById('email').value.trim();
    if (!v || v.indexOf('@') === -1) { tell('say1', 'Put in the email you use here.', false); return; }
    email = v;
    var btn = document.getElementById('send');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch(GS_URL + '?action=sendSigninPin&email=' + encodeURIComponent(email))
      .then(function (r) { return r.json(); })
      .then(function () {
        btn.disabled = false;
        btn.textContent = 'Send my code';
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('sentTo').textContent =
          'We sent a six digit code to ' + email + '. It expires in fifteen minutes.';
        document.getElementById('code').focus();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Send my code';
        tell('say1', 'That did not send. Check your connection and try once more.', false);
      });
  }

  document.getElementById('send').addEventListener('click', function () { sendCode(); });
  document.getElementById('email').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sendCode(); }
  });

  document.getElementById('again').addEventListener('click', function () {
    fetch(GS_URL + '?action=sendSigninPin&email=' + encodeURIComponent(email));
    tell('say2', 'Another code is on its way.', true);
  });

  function verify() {
    var code = document.getElementById('code').value.trim();
    if (code.length < 6) { tell('say2', 'The code is six digits.', false); return; }
    var btn = document.getElementById('verify');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    fetch(GS_URL + '?action=verifySigninPin&email=' + encodeURIComponent(email) +
          '&code=' + encodeURIComponent(code))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.status === 'ok' && d.appearId) {
          // This device now knows them, which is what stops links having to carry an id.
          try {
            localStorage.setItem('cw-id', d.appearId);
            localStorage.setItem('appear-id', d.appearId);
            if (d.editToken) { localStorage.setItem('cw-token', d.editToken); }
          } catch (e) {}
          btn.textContent = 'Signed in';
          // The id rides along once so the next page knows them even if it only reads the URL.
          var sep = next.indexOf('?') > -1 ? '&' : '?';
          window.location.href = next + sep + 'CWid=' + encodeURIComponent(d.appearId);
        } else {
          btn.disabled = false;
          btn.textContent = 'Sign me in';
          tell('say2', (d && d.message) || 'That code did not work. Ask for another.', false);
        }
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Sign me in';
        tell('say2', 'That did not go through. Try once more.', false);
      });
  }

  document.getElementById('verify').addEventListener('click', verify);
  document.getElementById('code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); verify(); }
  });
})();
</script>
<script src="/nav/topbar.js?v=5.30" defer></script>
</body>
