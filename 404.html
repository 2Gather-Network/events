<!doctype html>
<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Gather</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1F699E;color:#fff;font-family:'DM Sans','Inter',system-ui,-apple-system,sans-serif;}
  .m{font-size:17px;padding:0 24px;text-align:center;line-height:1.55;max-width:34ch;}
  a{color:#fff;}
  
  .look{display:inline-block;background:#fff;color:#1A2E42;border-radius:999px;
        padding:12px 22px;font-size:16px;font-weight:700;animation:cw-breathe 1.9s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.6}}
</style>
</head>
<body>
  <div class="m" id="say">&nbsp;</div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  function say(t) { document.getElementById('say').innerHTML = t; }
  var p = String(location.pathname || '');

  var st = p.match(/^\/ikigai\/([^\/]+)\/?$/i);
  if (st && st[1]) {
    var q = '';
    try {
      var u = new URLSearchParams(location.search);
      u.set('step', decodeURIComponent(st[1]));
      q = u.toString();
    } catch (e) { q = 'step=' + encodeURIComponent(st[1]); }
    location.replace('/ikigai/?' + q + String(location.hash || ''));
    return;
  }

  var m = p.match(/^\/hi\/(.+?)\/?$/i);
  if (!m || !m[1]) {
    say('We could not find that page.<br><br><a href="/events/">Go to 2Gather</a>');
    return;
  }
  var name = '';
  try { name = decodeURIComponent(m[1]).trim().toLowerCase(); } catch (e) { name = m[1].toLowerCase(); }
  say('<span class="look">\uD83D\uDD0D ' + name.replace(/[&<>]/g, '') + '</span>');

  fetch(GS + '?action=vanity&slug=' + encodeURIComponent(name))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.found && d.code) {
        var carry = '';
        try {
          var q = new URLSearchParams(location.search);
          q.delete('v'); q.delete('hi');
          q.forEach(function (val, key) { carry += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(val); });
        } catch (e) {}
        location.replace('/me/?v=' + encodeURIComponent(d.code) + '&hi=' + encodeURIComponent(name) + carry);
        return;
      }
      say('We could not find <strong>' + name.replace(/[&<>]/g, '') + '</strong>.');
    })
    .catch(function () {
      say('We could not reach the server just now.<br><br><a href="' + p + '">Try again</a>');
    });
})();
</script>
</body>
</html>
