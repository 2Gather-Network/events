<!doctype html>
<!-- Version: NF1.00 | Date: 2026-09-19 | LAST CHANGE: /hi/<name> is answered here, because this site is GitHub Pages. Jessie, 2026-09-19, seeing a GitHub 404 on 2gather.network/hi/jessie-upp. I had put the routing in a _redirects file, which is a CLOUDFLARE Pages feature - GitHub Pages ignores it completely, so the rewrite never existed. GitHub Pages has no server-side rewriting at all; what it does have is this page, which it serves for any address it has no file for. So this reads the address, and if it is /hi/<name> it hands it to /hi/ with the name as a parameter. Everything else gets a plain not-found. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Gather</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1F699E;color:#fff;font-family:'DM Sans','Inter',system-ui,-apple-system,sans-serif;}
  .m{font-size:17px;padding:0 24px;text-align:center;line-height:1.55;max-width:34ch;}
  a{color:#fff;}
</style>
</head>
<body>
  <div class="m" id="say">&nbsp;</div>
<script>
/* THE ONE PLACE A PATH CAN BE ANSWERED ON GITHUB PAGES. There is no rewriting, no _redirects and
   no Worker in front of it - GitHub serves this file for anything it has no file for, and this is
   the only hook there is.

   A NAME IS NOT AN ADDRESS. Her goal is that /hi/<name> moves to appear.network by a switch on the
   domain, so the name is passed along and only /hi/ itself knows what to do with it. */
(function () {
  /* NO QUESTION MARK ANYWHERE. Jessie, 2026-09-19: "or if you can swing it - no ?".
     GitHub serves THIS file for /hi/jessie-upp, so the lookup happens here and the address in the
     bar stays /hi/jessie-upp the whole way. There is no hop through /hi/?name= and no hop through
     /hi/?jessie-upp either - the only address anybody sees is the one they typed, until it becomes
     the profile.
     /hi/index.html is kept for /hi/ on its own and for any ?name= link already sent. */
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  function say(t) { document.getElementById('say').innerHTML = t; }
  var p = String(location.pathname || '');
  var m = p.match(/^\/hi\/(.+?)\/?$/i);
  if (!m || !m[1]) {
    say('We could not find that page.<br><br><a href="/events/">Go to 2Gather</a>');
    return;
  }
  var name = '';
  try { name = decodeURIComponent(m[1]).trim().toLowerCase(); } catch (e) { name = m[1].toLowerCase(); }
  // IT NAMES WHO IT IS LOOKING FOR. Jessie, 2026-09-19: "Looking up this person to Looking up
  // jerry-michalski...". Saying the name back is also the fastest way to see a typo.
  say('Looking up ' + name.replace(/[&<>]/g, '') + '&hellip;');

  fetch(GS + '?action=vanity&slug=' + encodeURIComponent(name))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // THE NAME TRAVELS WITH THE CODE, so the profile page can put /hi/<name> back in the bar.
      // Jessie, 2026-09-19: "reverted back to the ID so it shows which defeats teh purpose". The
      // code is not an id - it is one-way and means nothing on its own - but a name people say out
      // loud is the entire point of this address, so it should be what stays on screen.
      if (d && d.found && d.code) {
        location.replace('/ikigai/?v=' + encodeURIComponent(d.code) + '&hi=' + encodeURIComponent(name));
        return;
      }
      say('We could not find <strong>' + name.replace(/[&<>]/g, '') + '</strong>.<br><br>'
        + 'Check the spelling, or <a href="/events/">go to 2Gather</a>.');
    })
    .catch(function () {
      say('We could not reach the server just now.<br><br><a href="' + p + '">Try again</a>');
    });
})();
</script>
</body>
</html>
