<!doctype html>
<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Gather</title>
<script src="/nav/identity.js?v=52"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1F699E;color:#fff;font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,sans-serif;}
  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1F699E;font-size:14px;font-weight:700;padding:10px 20px;border-radius:22px;white-space:nowrap;animation:cw-breathe 1.6s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.55}}
  .m{font-size:17px;padding:0 24px;text-align:center;line-height:1.55;max-width:34ch;}
  a{color:#fff;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="https://2gather.network/images/2gather_logo.png">
</head>
<body>
  <div class="m" id="say"><span class="cw-loading" id="lookfor"></span></div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  function say(t) { document.getElementById('say').innerHTML = t; }
  var name = '';
  try {
    var q = String(location.search || '').replace(/^\?/, '');
    if (q && q.indexOf('=') === -1) { name = decodeURIComponent(q).trim().toLowerCase(); }
    else { name = String(new URLSearchParams(location.search).get('name') || '').trim().toLowerCase(); }
  } catch (e) {}
  name = name.replace(/\/+$/, '');
  if (!name) { location.replace('/events/'); return; }
  document.getElementById('lookfor').textContent = '\uD83D\uDD0D ' + name;

  var from = '';
  try {
    var r = String(document.referrer || '');
    if (r.indexOf('https://2gather.network') === 0) { from = new URL(r).pathname; }
  } catch (e) {}

  try { if (history && history.replaceState) { history.replaceState({}, '', '/hi/' + name); } } catch (e) {}

  fetch(GS + '?action=vanity&slug=' + encodeURIComponent(name))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.found && d.code) {
        location.replace('/me/?v=' + encodeURIComponent(d.code)
          + '&hi=' + encodeURIComponent(name)
          + (from ? '&from=' + encodeURIComponent(from) : ''));
        return;
      }
      say('We could not find <strong>' + name.replace(/[&<>]/g, '') + '</strong>.<br><br>'
        + 'Check the spelling, or <a href="/events/">go to 2Gather</a>.');
    })
    .catch(function () {
      say('We could not reach the server just now.<br><br><a href="/hi/' + encodeURIComponent(name) + '">Try again</a>');
    });
})();
</script>
<script src="/nav/waiting-words.js?v=13"></script>
</body>
</html>
