<!doctype html>
<!-- Version: H1.00 | Date: 2026-09-19 | LAST CHANGE: it says Looking up this person while it waits, her words. /hi/<name> opens that person's 2Gather profile. Jessie, 2026-09-19: "2gather.network/hi/jessie-upp instead as format", and the reason - "that way when we turn over to appear, it will be able to move over to appear.network/hi/jessie-upp easily". The name is looked up and the page forwards to the profile by CODE, never by id. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Gather</title>
<script src="/nav/identity.js?v=22"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1F699E;color:#fff;font-family:'DM Sans','Inter',system-ui,-apple-system,sans-serif;}
  .m{font-size:17px;padding:0 24px;text-align:center;line-height:1.55;max-width:34ch;}
  a{color:#fff;}
</style>
</head>
<body>
  <div class="m" id="say">Looking up this personLooking up that name&hellip;hellip;</div>
<script>
/* WHAT THIS PAGE IS. A person's own address - 2gather.network/hi/jessie-upp - turned into the
   profile it names. The name arrives as ?name=, put there by the rewrite in _redirects, so the
   address in the bar stays the one they typed.

   IT FORWARDS BY CODE, NEVER BY ID. The backend answers with the same six characters every profile
   link on this site carries, and an id never travels in an address here - that rule was written on
   2026-09-18 after one did.

   AND IT HOLDS NO ADDRESS OF ITS OWN BEYOND THIS FILE. Her goal is to move this to appear.network
   by a switch on the domain, so the sheet holds the NAME and only this page and the rewrite know
   what it becomes. */
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  function say(t) { document.getElementById('say').innerHTML = t; }
  var name = '';
  /* THE NAME IS THE WHOLE QUERY. Jessie, 2026-09-19: "don't put name=". So /hi/?jessie-upp, not
     /hi/?name=jessie-upp. name= is still read, because links made in the last ten minutes carry it
     and an address already sent should never stop working. */
  try {
    var q = String(location.search || '').replace(/^\?/, '');
    if (q && q.indexOf('=') === -1) { name = decodeURIComponent(q).trim().toLowerCase(); }
    else { name = String(new URLSearchParams(location.search).get('name') || '').trim().toLowerCase(); }
  } catch (e) {}
  name = name.replace(/\/+$/, '');
  if (!name) { location.replace('/events/'); return; }

  /* THE ADDRESS GOES BACK TO THE ONE THEY TYPED. GitHub Pages cannot rewrite a path, so getting
     here at all means 404.html handed the name over as ?name= - and the bar was left showing
     /hi/?name=jessie-upp, which is not a name anybody would say out loud. This puts it back
     without loading anything, so what is in the bar is what they came for and what they can
     copy. 2026-09-19, her "https://2gather.network/hi/?name=jessie-upp". */
  try { if (history && history.replaceState) { history.replaceState({}, '', '/hi/' + name); } } catch (e) {}

  fetch(GS + '?action=vanity&slug=' + encodeURIComponent(name))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.found && d.code) { location.replace('/ikigai/?v=' + encodeURIComponent(d.code)); return; }
      // A NAME NOBODY HOLDS IS NOT AN ERROR ANYBODY CAUSED. It says so plainly and offers the way
      // on, rather than a dead end or a blank blue screen.
      say('We could not find <strong>' + name.replace(/[&<>]/g, '') + '</strong>.<br><br>'
        + 'Check the spelling, or <a href="/events/">go to 2Gather</a>.');
    })
    .catch(function () {
      say('We could not reach the server just now.<br><br><a href="/hi/' + encodeURIComponent(name) + '">Try again</a>');
    });
})();
</script>
</body>
</html>
