    var sf = document.getElementById('mp-search'); if (sf) { sf.focus(); var v = sf.value; sf.value = ''; sf.value = v; }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || S.busy) return;
    var a = t.getAttribute('data-act'), k = t.getAttribute('data-k'), v = t.getAttribute('data-v');
    if (a !== 'menu') S.menu = false;
    if (a === 'list') { setPath('/opportunities/'); S.screen = 'list'; S.note = ''; if (S.list === null) load(); }
    else if (a === 'menu') { S.menu = !S.menu; }
    else if (a === 'want') { S.want = v; }
    else if (a === 'showof') { S.showOf = v; }
    else if (a === 'kindof') { S.kindOf = v; }
    else if (a === 'statof') { S.statOf = S.statOf === v ? '' : v; }
    else if (a === 'reach' || a === 'notnow') {
      var cid = t.getAttribute('data-id'); S.busy = true;
      send(a === 'reach' ? 'reachOut57b' : 'fpNotNow57b', { card: cid }).then(function (y) {
        S.busy = false;
        var A = (S.mm && S.mm.anon) || [];
        if (a === 'notnow') S.mm.anon = A.filter(function (x) { return x.card !== cid; });
        else if (y && y.state === 'waiting') A.forEach(function (x) { if (x.card === cid) x.state = 'waiting'; });
        draw();
      }).catch(function () { S.busy = false; draw(); });
      return;
    }
    else if (a === 'add') { S.screen = 'add'; S.note = ''; window.scrollTo(0, 0); }
    else if (a === 'copylink') { var u = 'https://2appear.network/opportunities/' + myCode() + '/' + (S.person && S.person.dir === 'seek' ? 'seeking' : 'offering'); try { navigator.clipboard.writeText(u).then(function () { S.copied = true; draw(); }); } catch (e) {} return; }
    else if (a === 'addme') { startFlow(v === 'Offering it' ? 'offer' : 'seek'); return; }
    else if (a === 'share') { S.screen = 'add'; S.note = ''; window.scrollTo(0, 0); }
    else if (a === 'mine') { setPath('/opportunities/'); S.screen = 'mine'; S.note = ''; loadMine(); return; }
    else if (a === 'mail') { var want = !S.mailOff; S.busy = true; send('setOpportunityMail', { off: want ? '1' : '0' }).then(function (j) { S.busy = false; if (j && j.ok) S.mailOff = want; else S.note = 'That did not save. Please try again.'; draw(); }).catch(function () { S.busy = false; S.note = 'That did not save. Please try again.'; draw(); }); return; }
    else if (a === 'openmine') { if (S.mine === null) { S.mine = []; } openMine(t.getAttribute('data-id')); return; }
    else if (a === 'answer') { S.busy = true; send('answerOpportunityResponse', { responseId: t.getAttribute('data-id'), yes: v }).then(function (j) { S.busy = false; if (j && j.ok) { if (S.mp) openMine(S.mp.postId); } else { S.note = 'That did not save. Please try again.'; draw(); } }).catch(function () { S.busy = false; S.note = 'That did not save. Please try again.'; draw(); }); return; }
    else if (a === 'report') { S.busy = true; send('reportOpportunityQuestion', { questionId: t.getAttribute('data-id') }).then(function (j) { S.busy = false; if (j && j.ok) { S.qs = (S.qs || []).filter(function (x) { return x.questionId !== t.getAttribute('data-id'); }); S.note = 'Reported. It is hidden now.'; } else S.note = 'That did not send. Please try again.'; draw(); }).catch(function () { S.busy = false; S.note = 'That did not send. Please try again.'; draw(); }); return; }
    else if (a === 'delask') S.confirmDel = true;
    else if (a === 'delno') S.confirmDel = false;
    else if (a === 'del') { S.busy = true; send('deleteOpportunity', { postId: S.mp.postId }).then(function (j) { S.busy = false; if (j && j.ok) { S.screen = 'mine'; S.confirmDel = false; S.list = null; loadMine(); } else { S.note = 'That did not work. Please try again.'; draw(); } }).catch(function () { S.busy = false; S.note = 'That did not work. Please try again.'; draw(); }); return; }
    else if (a === 'withdraw') { S.busy = true; send('withdrawInterest', { postId: S.post.postId }).then(function (j) { S.busy = false; if (j && j.ok) { S.post.interested = false; S.post.both = false; S.note = 'Your interest is withdrawn.'; } else S.note = 'That did not work. Please try again.'; draw(); }).catch(function () { S.busy = false; S.note = 'That did not work. Please try again.'; draw(); }); return; }
    else if (a === 'cap') S.dir = v;
    else if (a === 'myonly') S.myOnly = !S.myOnly;
    else if (a === 'fo') S.open[k] = !S.open[k];
    else if (a === 'nextpage') S.pageN = (S.pageN || 12) + 12;
    else if (a === 'fall') S.fs[k] = [];
    else if (a === 'lped') { S.locEdit = k; S.locQ = ''; draw(); var lq = document.getElementById('lpq'); if (lq) lq.focus(); return; }
    else if (a === 'lpcancel') { S.locEdit = ''; S.locQ = ''; }
    else if (a === 'lpx') { if (k === 'state') S.fs.state = []; else if (k === 'country') { S.fs.country = []; S.fs.state = []; } S.locEdit = ''; try { localStorage.setItem('ao-state-cleared', '1'); } catch (e) {} }
    else if (a === 'lppick') { if (k === 'region') { S.fs.region = v === 'North America' ? [] : [v]; S.fs.country = []; S.fs.state = []; } else if (k === 'country') { S.fs.country = [v]; S.fs.state = []; } else { S.fs.state = [v]; try { localStorage.removeItem('ao-state-cleared'); } catch (e) {} } S.locEdit = ''; S.locQ = ''; }
    else if (a === 'fc') { var ar = S.fs[k], i = ar.indexOf(v); if (i > -1) ar.splice(i, 1); else ar.push(v); }
    else if (a === 'reset') { for (var f in S.fs) S.fs[f] = []; S.myOnly = false; S.dir = 'All'; }
    else if (a === 'openpost') { openPost(t.getAttribute('data-id')); return; }
    else if (a === 'ask') S.asking = !S.asking;
    else if (a === 'interest') { S.busy = true; send('sendInterest', { postId: S.post.postId }).then(function (j) { S.busy = false; if (j && j.ok) { S.post.interested = true; S.post.both = !!j.both; if (j.both) openPost(S.post.postId); } else S.note = 'That did not send. Please try again.'; draw(); }).catch(function () { S.busy = false; S.note = 'That did not send. Please try again.'; draw(); }); return; }
    else if (a === 'sendq') { var q = (document.getElementById('qtext') || {}).value || ''; if (!q.trim()) return; S.busy = true; send('askOpportunityQuestion', { postId: S.post.postId, text: q }).then(function (j) { S.busy = false; S.asking = false; S.note = j && j.ok ? 'Sent without your name.' : 'That did not send. Please try again.'; draw(); }).catch(function () { S.busy = false; S.note = 'That did not send. Please try again.'; draw(); }); return; }
    else if (a === 'pubsaved') { if (S.busy) return; S.busy = true; S.note = ''; draw(); send('saveOpportunity', { postId: S.mp.postId }).then(function (j) { S.busy = false; if (j && j.ok) { var id = S.mp.postId; S.mp.status = 'open'; (S.mine || []).forEach(function (x) { if (x.postId === id) x.status = 'open'; }); S.list = null; openMine(id); S.note = 'Published. Matching has started.'; draw(); } else { S.note = 'That did not work. Please try again.'; draw(); } }).catch(function () { S.busy = false; S.note = 'That did not work. Please try again.'; draw(); }); return; }
    draw();
  });
  var PM = null;
  function fillHomeState() {
    try {
      if (!ME || S.fs.state.length || S.fs.country.length) return;
      if (localStorage.getItem('ao-state-cleared') === '1') return;
      var m = CW.me() || {}, t = localStorage.getItem('cw-token') || '';
      if (m.viewing || !t) return;
      fetch(GS_URL + '?action=getMyHomeState&appearId=' + encodeURIComponent(ME) + '&meToken=' + encodeURIComponent(t) + '&realMe=' + encodeURIComponent(m.realId && m.realId !== ME ? m.realId : ''), { cache: 'no-store', referrerPolicy: 'no-referrer' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var st = d && d.status === 'ok' ? String(d.state || '') : '';
          if (!st || STATES.indexOf(st) < 0 || S.fs.state.length || S.fs.country.length) return;
          try { if (localStorage.getItem('ao-state-cleared') === '1' || (CW.me() || {}).viewing) return; } catch (e) { return; }
          S.fs.region = []; S.fs.country = ['United States']; S.fs.state = [st]; draw();
        }).catch(function () {});
    } catch (e) {}
  }
  loadCats();
  fillHomeState();
  window.addEventListener('hashchange', function () { var hq = ME && window.CWAdd && CWAdd.fromHash && CWAdd.fromHash(); if (hq) startFlow(hq.dir); });
  if (ME && S.group) { S.screen = 'group'; draw(); loadGroup(); }
  else if (ME && new URLSearchParams(location.search).get('mine')) { S.screen = 'mine'; draw(); loadMine(); load(); }
  else if (ME && window.CWAdd && CWAdd.fromHash && CWAdd.fromHash()) { load(); startFlow(CWAdd.fromHash().dir); }
  else if (ME && (PM = location.pathname.match(/^\/opportunities\/([0-9a-z]{6})\/(seeking|offering)\/?$/) || (new URLSearchParams(location.search).get('person') || '').replace(/^me\//, myCode() + '/').match(/^([0-9a-z]{6})\/(seeking|offering)$/))) { openPerson(PM[1], PM[2] === 'offering' ? 'offer' : 'seek'); load(); }
  else if (ME && /^(need|offer)$/.test(new URLSearchParams(location.search).get('add') || '')) { load(); startFlow(new URLSearchParams(location.search).get('add') === 'offer' ? 'offer' : 'seek'); }
  else if (ME && /^(theyneed|theyoffer)$/.test(new URLSearchParams(location.search).get('add') || '')) { S.screen = 'add'; draw(); load(); }
  else { draw(); if (ME) load(); }
})();
</script>
