<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<title>1:1 Match — Creating Works</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#1F699E;color:#1a1a2e;min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.card{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:18px 18px 20px;box-shadow:0 6px 24px rgba(0,0,0,0.12);}
.code-card{text-align:center;}
.code-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
.code-sub{font-size:12.5px;color:#6b7280;font-weight:600;margin-bottom:14px;}
#qr{display:inline-flex;padding:12px;background:#fff;border:1.5px solid #e0e2ea;border-radius:12px;}
#qr img,#qr canvas{display:block;}
.code-fallback{font-size:12px;color:#6b7280;word-break:break-all;margin-top:10px;}
.pair{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:6px;}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 1.5px #e0e2ea;background:#4a6fa5;}
.avatar.b,.avatar-fb.b{margin-left:-14px;}
.avatar-fb{width:64px;height:64px;border-radius:50%;background:#2d5282;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;border:3px solid #fff;box-shadow:0 0 0 1.5px #e0e2ea;}
.pair-title{text-align:center;font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
.pair-sub{text-align:center;font-size:12.5px;color:#6b7280;font-weight:600;margin-bottom:14px;}
.section{margin-bottom:14px;}
.section:last-child{margin-bottom:0;}
.section-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#374151;margin-bottom:8px;}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.dot-green{background:#1a7f4b;}
.dot-blue{background:#2d5282;}
.tags{display:flex;flex-wrap:wrap;gap:7px;}
.tag{font-size:12.5px;font-weight:700;color:#fff;border-radius:16px;padding:6px 13px;}
.tag-green{background:#1a7f4b;}
.tag-blue{background:#2d5282;}
.none{font-size:13px;color:#6b7280;text-align:center;padding:8px 4px;line-height:1.5;}
.loading{font-size:13px;color:#6b7280;text-align:center;padding:20px;}
.hint{font-size:12px;color:#9ea3b8;text-align:center;font-weight:600;}
</style>
  <script src="/nav/identity.js?v=9"></script>
</head>
<body>

<div id="match-topnav" style="width:100%;max-width:440px;"></div>
<div class="card code-card" id="code-card" style="display:none;">
  <div class="code-title">Your code</div>
  <div class="code-sub">Have someone scan this to see how you two match</div>
  <div id="qr"></div>
  <div class="code-fallback" id="code-fallback"></div>
</div>

<div class="card" id="match-card" style="display:none;"></div>

<div class="hint" id="signin-hint" style="display:none;"></div>

<script>
var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
var BASE='https://2gather.network/match';

var params=new URLSearchParams(window.location.search);
// viewer id: from URL, else remembered on this device (seeded from a personalized link)
var _me=(window.CW&&CW.me)?CW.me().id:(params.get('me')||params.get('memberCard')||params.get('id')||'').trim();
if(_me){ try{ localStorage.setItem('gather-me',_me); }catch(e){} }
else{ try{ _me=localStorage.getItem('gather-me')||''; }catch(e){} }
var _with=(params.get('with')||params.get('them')||'').trim();
var _event=(params.get('event')||params.get('eventId')||'').trim();

function normId(id){return String(id||'').split('.').join('').toLowerCase();}
function escHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isCoach(x){ return /coach/i.test((x&&x.meta)||''); }

// ── Parsing (matches intake.html / attendees.html) ──
function parseTagStr(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var p=s.split(':');
    return {item:(p[0]||'').trim(), category:(p.length>=3?p[1]:'').trim(), meta:p.slice(1).join(':').trim()};
  }).filter(function(o){return o.item;});
}
function parseNeeds(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var tio=s.indexOf('~'); if(tio>-1) s=s.slice(0,tio);   // drop the ~detail suffix (intake owner-only field)
    var p=s.split(':');
    var local=p[1]==='local';
    var ntype=local?(p[2]||'skill'):(p[1]||'skill');
    var catParts=(local?p.slice(3):p.slice(2)).join(':').split(' / ');
    return {item:(p[0]||'').trim(), ntype:ntype, category:(catParts[0]||'').trim()};
  }).filter(function(n){return n.item;});
}

// GAS web apps can flake under concurrent load — retry once, tolerate failure
async function fetchJson(url){
  for(var i=0;i<2;i++){
    try{ var r=await fetch(url); return await r.json(); }catch(e){}
  }
  return {};
}
// ── ONE combined call for BOTH people. This GAS backend 404s under concurrent
//    requests (confirmed via console PM), so we never fire parallel calls. ──
async function loadPair(){
  var d=await fetchJson(GS_URL+'?action=getPairMatch&a='+encodeURIComponent(_me)+'&b='+encodeURIComponent(_with));
  return [personFromPair(d.a,_me), personFromPair(d.b,_with)];
}
function personFromPair(p,id){
  p=p||{};
  return {
    appearId:id,
    photo:p.photo||'',
    name:(p.first||p.initials||'').trim(),   // name lives in the ikigai row
    skills:parseTagStr(p.skills),
    interests:parseTagStr(p.interests),
    values:parseTagStr(p.values).concat(parseTagStr(p.domains)),
    needs:parseNeeds(p.needs)
  };
}

// ── Sets used for matching ──
function offerSet(m){ var s={}; ['skills','interests','values'].forEach(function(f){ (m[f]||[]).forEach(function(x){ if(x.item) s[x.item.toLowerCase()]=x.item; }); }); return s; }
function provideSet(m){ var s={};
  (m.skills||[]).forEach(function(x){ if(x.item) s[x.item.toLowerCase()]=x.item; });
  (m.interests||[]).forEach(function(x){ if(x.item && isCoach(x)) s[x.item.toLowerCase()]=x.item; });
  return s;
}
function needSet(m){ var s={}; (m.needs||[]).forEach(function(n){ if(n.item) s[n.item.toLowerCase()]=n.item; }); return s; }

function firstName(m){ return (m.name||m.appearId||'them').split(' ')[0]; }
function avatarHTML(m,cls){
  var initial=escHTML((m.name||m.appearId||'?').charAt(0).toUpperCase());
  var inner=m.photo
    ? '<img class="avatar '+cls+'" src="'+escHTML(m.photo)+'" alt="" data-initial="'+initial+'" data-cls="'+cls+'" onerror="avFallback(this)">'
    : '<div class="avatar-fb '+cls+'">'+initial+'</div>';
  // link to the EVENT profile (ikigai), not the Appear Network page
  var href='https://creating.works/profile?show='+encodeURIComponent(m.appearId||'');
  return '<a href="'+href+'" style="text-decoration:none;">'+inner+'</a>';
}
window.avFallback=function(img){
  var div=document.createElement('div');
  div.className='avatar-fb '+(img.getAttribute('data-cls')||'');
  div.textContent=img.getAttribute('data-initial')||'?';
  img.parentNode.replaceChild(div,img);
};
function tags(items,cls){
  return items.map(function(t){return '<span class="tag '+cls+'">'+escHTML(t)+'</span>';}).join('');
}

function renderMatch(me,them){
  var meOffer=offerSet(me), themOffer=offerSet(them);
  var meProvide=provideSet(me), themProvide=provideSet(them);
  var meNeed=needSet(me), themNeed=needSet(them);

  var inCommon=[], theyHelp=[], youHelp=[];
  Object.keys(themOffer).forEach(function(k){ if(meOffer[k]) inCommon.push(themOffer[k]); });     // both have it
  Object.keys(meNeed).forEach(function(k){ if(themProvide[k]) theyHelp.push(themProvide[k]); });   // they provide my need
  Object.keys(themNeed).forEach(function(k){ if(meProvide[k]) youHelp.push(meProvide[k]); });      // I provide their need

  var themName=firstName(them);
  var html=''
    +'<div class="pair">'+avatarHTML(me,'a')+avatarHTML(them,'b')+'</div>'
    +'<div class="pair-title">You & '+escHTML(them.name||themName)+'</div>'
    +'<div class="pair-sub">In the commons<br>Here\'s what\'s in common</div>';

  var any=inCommon.length||theyHelp.length||youHelp.length;
  if(!any){
    html+='<div class="none">No overlaps in your profiles yet — but you’re both here. Say hi!</div>';
  }else{
    if(inCommon.length) html+='<div class="section"><div class="section-label"><span class="dot dot-green"></span>In common</div><div class="tags">'+tags(inCommon,'tag-green')+'</div></div>';
    if(theyHelp.length)  html+='<div class="section"><div class="section-label"><span class="dot dot-blue"></span>'+escHTML(themName)+' can help you</div><div class="tags">'+tags(theyHelp,'tag-blue')+'</div></div>';
    if(youHelp.length)   html+='<div class="section"><div class="section-label"><span class="dot dot-blue"></span>You can help '+escHTML(themName)+'</div><div class="tags">'+tags(youHelp,'tag-blue')+'</div></div>';
  }
  var el=document.getElementById('match-card');
  el.innerHTML=html;
  el.style.display='block';
}

function showMyCode(){
  var card=document.getElementById('code-card');
  var url=BASE+'?with='+encodeURIComponent(_me);
  var box=document.getElementById('qr');
  var ok=false;
  try{
    if(typeof QRCode==='function'){ new QRCode(box,{text:url,width:212,height:212,correctLevel:QRCode.CorrectLevel.M}); ok=true; }
  }catch(e){}
  if(!ok){
    document.getElementById('code-fallback').innerHTML='Share this link: <a href="'+escHTML(url)+'">'+escHTML(url)+'</a>';
  }
  card.style.display='block';
}

(async function init(){
  var _mtn=document.getElementById('match-topnav');
  if(_mtn && _me){
    var _WB='text-decoration:none;color:#185FA5;background:#fff;font-size:14px;font-weight:600;padding:8px 15px;border-radius:20px;white-space:nowrap;display:inline-block;';
    var _nav='<a href="https://2gather.network/events?memberCard='+encodeURIComponent(_me)+'" style="'+_WB+'">All events</a>';
    if(_event) _nav+='<a href="https://2gather.network/attendees?id='+encodeURIComponent(_event)+'&memberCard='+encodeURIComponent(_me)+'" style="'+_WB+'">Event attendees</a>';
    _nav+='<a href="https://creating.works/profile?id='+encodeURIComponent(_me)+(_event?'&eventId='+encodeURIComponent(_event):'')+'" style="'+_WB+'">My event profile</a>';
    _mtn.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:8px;padding:0 2px;">'+_nav+'</div>';
  }
  if(!_me){
    var h=document.getElementById('signin-hint');
    h.textContent='Open this from your event or profile link so we know who you are.';
    h.style.display='block';
    return;
  }
  showMyCode();
  if(_with && normId(_with)!==normId(_me)){
    var card=document.getElementById('match-card');
    card.innerHTML='<div class="loading">Reviewing compatible matches…</div>';
    card.style.display='block';
    var pair=await loadPair();   // ONE request for both people (no concurrent GAS calls)
    renderMatch(pair[0],pair[1]);
  }
})();
</script>
</body>
