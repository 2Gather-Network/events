<!-- ONE CALENDAR. This was its own 1337-line page, version 3.52 dated 2026-08-26, and /events/
     was a different 6400-line page carrying everything built since. The root is where most
     people land and it was the one nobody updated, so it still had the design the events page
     replaced on it.

     It existed because Glide needed a signed-out version and a signed-in version. Jessie,
     2026-09-07: "we were in glide, we needed a version of signed out and a version of not signed
     out. So now we are good to go ahead and do this update."

     Before deleting it I compared the two: of every named element on the old page, exactly two
     were missing from /events/, and both belonged to the design it replaced. The old page is kept
     at design/frozen/2gather-home-2026-09-07.html in The-New-Build-Repository.

     What the front door should EVENTUALLY be is a different question, Doug's arrival screen and
     decision C9. When that lands, this one line changes and nothing else does. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Events · 2Gather</title>
<link rel="canonical" href="https://2gather.network/events/">
<!-- The query string and the hash come across, so an id, an event or a filter in an old link
     survives the hop. Same shape as /myevents.html, which has done this since it moved. -->
<script>location.replace('/events/' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0;url=/events/">
</head>
<body>
<p style="font:400 15px/1.5 system-ui,sans-serif;padding:24px;">
  The calendar is at <a href="/events/">2gather.network/events/</a>.
</p>
</body>
</html>
