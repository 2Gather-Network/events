<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Profile header mock-up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--brand:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;--line:#DDE6EF}
*{box-sizing:border-box}
body{margin:0;background:var(--brand);font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;color:#fff;font-size:13.5px}
.bar b{margin-right:4px}
.bar button{font:inherit;font-weight:700;font-size:13px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:18px;padding:5px 12px;cursor:pointer}
.bar button.on{background:#fff;color:var(--brand)}
.hdr{background:#fff;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo{width:104px;height:104px;border-radius:24px;flex:0 0 auto;background:#EAF3FB center/cover no-repeat;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.who{flex:1 1 220px;min-width:0}
.who h1{margin:0;font-size:26px;font-weight:800;line-height:1.2}
.who p{margin:4px 0 0;color:var(--soft);font-size:14px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;background:var(--brand);color:#fff;border:1.5px solid var(--brand);border-radius:20px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.pill.line{background:#fff;color:var(--brand)}
.ico{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--brand);color:var(--brand);cursor:pointer;padding:0;font-size:0}
.ico::before{content:"";width:20px;height:20px;background-color:currentColor;-webkit-mask:var(--i) no-repeat center/contain;mask:var(--i) no-repeat center/contain}
.ico.bm{--i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M18%207v14l-6%20-4l-6%204v-14a4%204%200%200%201%204%20-4h4a4%204%200%200%201%204%204z%22/%3E%3C/svg%3E")}
.ico.ms{--i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M21%2012a8%208%200%200%201-11.6%207.1L4%2020.5l1.4-4.9A8%208%200%201%201%2021%2012z%22/%3E%3C/svg%3E")}
.ico.sh svg{width:18px;height:18px}
.ico.sh::before{display:none}
.ico.sh{font-size:0}
.ico.bm.on{background:var(--brand);color:#fff}
.off{background:#fff;border-radius:20px;border-left:10px solid #F2B84B;padding:12px 16px;margin:12px 0 0;display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:center}
.off h2{margin:0;font-size:17px;font-weight:800;color:#000}
.off .sub{font-size:12.5px;color:var(--ink);margin-top:2px}
.cards{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.card{flex:0 1 230px;min-width:0;border:2px solid #F2B84B;border-radius:14px;padding:10px 12px;background:#fff}
.card .t{display:flex;justify-content:space-between;align-items:flex-start}
.card .e{font-size:24px;line-height:1}
.card .l{font-size:12.5px;font-weight:700;color:var(--brand)}
.card b{display:block;font-size:13.5px;color:#000}
.card .k{font-size:12.5px;color:var(--ink)}
.card i{display:block;font-size:12.5px;color:var(--brand);margin-top:4px}
.btnrow{display:flex;justify-content:flex-end;margin:12px 0 0}
.btnrow .pill{background:#fff;color:var(--ink);border:2px solid #F2B84B}
.more{background:none;border:0;color:var(--brand);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:0 0 0 10px}
.hint{color:#fff;font-size:13px;margin:16px 0 0;opacity:.9}
@media (max-width:640px){.off{grid-template-columns:1fr}.acts{margin-left:0}.photo{width:88px;height:88px}}
</style></head><body><div class="wrap">
<div class="bar"><b>Show as:</b><button type="button" id="v-own" class="on">You</button><button type="button" id="v-vis">Someone else</button><b style="margin-left:10px">Offerings:</b><button type="button" id="n-1">1</button><button type="button" id="n-2" class="on">2</button><button type="button" id="n-4">4</button></div>
<div class="hdr">
<div class="photo" id="photo"></div>
<div class="who"><h1 id="nm">Jessie Upp</h1><p id="pl">Snohomish County, Washington</p></div>
<div class="acts" id="acts"></div>
</div>
<div id="offer"></div>
<p class="hint">Mock-up for ux.44 option B. Name, photo and place are read from your public profile; the offerings are samples. Nothing here saves.</p>
</div>
<script>
var view='own', count=2, open1=false;
var CARDS=[
 ['\u{1FAB4}','Rosemary','Living thing',true,'From my garden!'],
 ['\u{1F381}','Massage Therapist','Something I\'m offering',false,''],
 ['\u{1F3E0}','Garage workshop','Workshop',false,'Saturday mornings'],
 ['\u{1F6B2}','Two cargo bikes','Physical good',false,'']
];
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function card(c){return '<div class="card"><div class="t"><span class="e">'+c[0]+'</span>'+(c[3]?'<span class="l">\u{1F4CD} Local</span>':'')+'</div><b>'+esc(c[1])+'</b><span class="k">'+esc(c[2])+'</span>'+(c[4]?'<i>Offering: '+esc(c[4])+'</i>':'')+'</div>';}
function draw(){
  var a=document.getElementById('acts');
  a.innerHTML = view==='own'
    ? '<a class="pill" href="#">Edit profile</a><button type="button" class="ico sh" aria-label="Share this profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>'
    : '<button type="button" class="pill line">Show our commonality</button><button type="button" class="ico ms" aria-label="Message"></button><button type="button" class="ico bm" id="bm" aria-label="Bookmark"></button>';
  var bm=document.getElementById('bm'); if(bm) bm.onclick=function(){ bm.classList.toggle('on'); };
  var list=CARDS.slice(0,count), o=document.getElementById('offer'), h='';
  if(count===1){
    h='<div class="btnrow"><button type="button" class="pill" id="o1">\u{1F381} What I\'m offering</button></div>'+(open1?'<div class="off"><div><h2>What I\'m offering</h2><div class="sub">Things you can use or have</div></div><div class="cards">'+card(list[0])+'</div></div>':'');
  } else {
    h='<div class="off"><div><h2>What I\'m offering'+(count>3?'<button type="button" class="more" id="more">More ('+(count-3)+')</button>':'')+'</h2><div class="sub">Things you can use or have</div></div><div class="cards" id="cards">'+list.slice(0,3).map(card).join('')+'<span id="rest" hidden style="display:contents">'+list.slice(3).map(card).join('')+'</span></div></div>';
  }
  o.innerHTML=h;
  var b=document.getElementById('o1'); if(b) b.onclick=function(){ open1=!open1; draw(); };
  var m=document.getElementById('more'); if(m) m.onclick=function(){ var r=document.getElementById('rest'); r.hidden=!r.hidden; r.style.display=r.hidden?'none':'contents'; m.textContent=r.hidden?'More ('+(count-3)+')':'Fewer'; };
  ['own','vis'].forEach(function(k){ document.getElementById('v-'+k).classList.toggle('on',(k==='own')===(view==='own')); });
  [1,2,4].forEach(function(n){ document.getElementById('n-'+n).classList.toggle('on',n===count); });
}
document.getElementById('v-own').onclick=function(){ view='own'; draw(); };
document.getElementById('v-vis').onclick=function(){ view='vis'; draw(); };
[1,2,4].forEach(function(n){ document.getElementById('n-'+n).onclick=function(){ count=n; open1=false; draw(); }; });
draw();
fetch('https://cw-api-gate.jessieupp.workers.dev?action=publicProfile&p=1ueze1').then(function(r){ return r.json(); }).then(function(d){
  var x=d&&d.data; if(!x) return;
  if(x.name) document.getElementById('nm').textContent=x.name;
  if(x.place) document.getElementById('pl').textContent=String(x.place).split(',').slice(0,2).join(',');
  if(x.photo) document.getElementById('photo').style.backgroundImage='url("'+x.photo+'")';
}).catch(function(){});
</script></body></html>
