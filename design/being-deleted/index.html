<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>This is being deleted · 2Gather</title>
<script src="/nav/identity.js?v=29"></script>
<style>
  :root{--ink:#1A2E42;--soft:#4B5A6D;--muted:#6B7A8D;--line:#DDE4EE;--brand:#1F699E;}
  *{box-sizing:border-box;}
  body{margin:0;background:#1F699E;font-family:"DM Sans","Inter",system-ui,-apple-system,sans-serif;color:var(--ink);}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 40px;}
  .band{background:#fff;border-radius:10px;padding:14px 16px;margin:0 0 12px;}
  .band h2{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;}
  .band .note{font-size:13px;color:var(--soft);line-height:1.5;margin:0 0 12px;}
  .bar{display:flex;align-items:center;justify-content:space-between;width:100%;background:#1F699E;color:#fff;border:0;border-radius:10px 10px 0 0;padding:11px 16px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:left;}
  .body{border:1.5px solid #C9DFF3;border-top:0;border-radius:0 0 12px 12px;padding:14px 16px 16px;background:#fff;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;background:#F7FBFF;transition:opacity .35s ease;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .nm{font-size:15px;font-weight:800;line-height:1.3;}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tools{display:flex;align-items:center;gap:9px;}
  .tools button{font:inherit;border:0;background:none;cursor:pointer;padding:0 2px;line-height:1;}
  .x{font-size:15px;color:#8A97A6;}
  .card.going .nm,.card.going .sub{color:#B4BEC9;}
  .card.going .tools{visibility:hidden;}
  .going-say{display:none;font-size:12.5px;font-weight:600;color:#9AA7B4;margin-top:6px;animation:breathe 1.8s ease-in-out infinite;}
  .card.going .going-say{display:block;}
  .card.gone{opacity:0;}
  .fail{display:none;font-size:12.5px;color:#7A2410;margin-top:6px;}
  .card.failed .fail{display:block;}
  @keyframes breathe{0%,100%{opacity:.35;}50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.going-say{animation:none;opacity:.8;}}
  .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .ctl button{font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:20px;border:1.5px solid #C9DFF3;background:#fff;color:var(--brand);cursor:pointer;}
  .ctl label{font-size:13.5px;color:var(--soft);display:flex;align-items:center;gap:6px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="band">
    <h2>Mockup, not the live questions page</h2>
    <p class="note">Press the x on any card. The card greys out and says it is being deleted while the save goes to the server, then it disappears once the save is confirmed. Tick the box to see what happens when a save fails.</p>
    <div class="ctl">
      <button type="button" id="reset">Put the cards back</button>
      <label><input type="checkbox" id="failIt"> Pretend the save fails</label>
    </div>
  </div>
  <div>
    <div class="bar">Offerings added (<span id="n">3</span>)<span aria-hidden="true">&#9650;</span></div>
    <div class="body"><div class="grid" id="grid"></div></div>
  </div>
</div>
<script>
(function(){
  var ITEMS = [
    { name: 'A spare room for September', sub: '\u{1F3E0} Space · Room' },
    { name: 'Boxes', sub: '\u{1F4E6} Thing · Physical goods' },
    { name: 'Sourdough starter', sub: '\u{1F4E6} Thing · Living things' }
  ];
  var grid = document.getElementById('grid');
  var count = function(){ document.getElementById('n').textContent = grid.querySelectorAll('.card:not(.gone)').length; };
  function draw(){
    grid.innerHTML = '';
    ITEMS.forEach(function(it){
      var c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<div class="top"><div><div class="nm"></div><div class="sub"></div></div>'
        + '<div class="tools"><button type="button" aria-label="Edit">✏️</button><button type="button" class="x" aria-label="Remove">×</button></div></div>'
        + '<div class="going-say">This is being deleted</div>'
        + '<div class="fail">That did not delete. Press the x to try again.</div>';
      c.querySelector('.nm').textContent = it.name;
      c.querySelector('.sub').textContent = it.sub;
      c.querySelector('.x').onclick = function(){
        c.classList.remove('failed');
        c.classList.add('going');
        var willFail = document.getElementById('failIt').checked;
        setTimeout(function(){
          if (willFail) { c.classList.remove('going'); c.classList.add('failed'); return; }
          c.classList.add('gone');
          setTimeout(function(){ c.remove(); count(); }, 350);
        }, 3500);
      };
      grid.appendChild(c);
    });
    count();
  }
  document.getElementById('reset').onclick = draw;
  draw();
})();
</script>
<script src="/nav/topbar.js?v=6.37" defer></script>
</body>
</html>
