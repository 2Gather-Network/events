<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interests first mockup · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#6B7A8D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--blue);color:var(--ink);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  html.cw-prail-on div.cw-prail{grid-template-columns:210px minmax(0,1fr);max-width:1560px;}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 16px 60px;}
  .note{background:#FFF4D6;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:14px;}
  .card{padding:18px 0 0;}
  h1{font-size:24px;margin:0 0 4px;}
  .lede{color:var(--grey);font-size:14px;margin:0 0 14px;line-height:1.5;}
  .ask{display:flex;gap:8px;}
  .ask input{flex:1;min-width:0;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);}
  .pill{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:20px;cursor:pointer;background:#fff;border:1px solid var(--pale);color:var(--blue);font-weight:600;}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .pill.big{font-size:14px;padding:9px 16px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;}
  .sub{font-size:12px;color:var(--grey);margin:14px 0 6px;font-weight:700;}
  .mine{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .mine .pill{background:#E6F1FB;}
  .mine .pill b{margin-left:6px;color:var(--grey);font-weight:400;}
  .next{margin-top:18px;}
  .w{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:16px 18px;}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;}
  .fold{margin-top:20px;}
  .fold-h{background:#1F699E;color:#fff;border-radius:10px 10px 0 0;padding:11px 16px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .fold .grid{border:1.5px solid #C9DFF3;border-top:0;border-radius:0 0 12px 12px;padding:14px 16px 16px;background:#fff;}
  .rule{border-top:1px solid var(--line);margin:12px 0 10px;}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:620px){.grid{grid-template-columns:1fr;}}
  .steps .ck{float:right;color:#3E9A5B;font-weight:800;}
  .steps button.on .ck{color:#fff;}
  .top{display:flex;align-items:flex-start;gap:8px;}
  .top h3{flex:1;}
  .ico{font:inherit;background:none;border:0;cursor:pointer;font-size:16px;color:var(--grey);padding:0 2px;line-height:1;}
  .w .row .pill{font-size:12px;padding:5px 11px;}
  .w h3{margin:0;font-size:17px;}
  .about{font-size:12.5px;color:var(--grey);margin:3px 0 10px;}
  .about button{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0;}
  .more{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;}
  .more .lab{font-size:12px;font-weight:700;color:var(--grey);margin-bottom:6px;}
  .more + .more{margin-top:8px;}
  .catbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 10px;}
  .catbox .lab{font-size:12px;font-weight:700;color:var(--grey);margin-bottom:6px;}
  .q{background:#FFF4ED;border:1px solid #F0C9AE;border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px;color:#7A2410;}
  .q .row{margin-top:8px;}
  .saves{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;}
  .saves .lab{font-size:12px;font-weight:700;color:var(--grey);}
  .saves pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 0;}
  .wait{color:var(--blue);font-size:13px;margin-top:8px;}
  .back{font:inherit;font-size:13px;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="note">A mockup to try. Nothing here is saved. Categories are guessed with simple word matching for now.</div>
  <div class="card" id="app"></div>
</div>
<script>
(function(){
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  var CATS = ['Food & Drink', 'Movement', 'Play', 'Travel', 'Community & Culture', 'Arts', 'Outdoors', 'Home Life', 'Animals', 'Technology', 'Style', 'Personal Care', 'Faith', 'Business', 'Finance', 'Communications', 'Science', 'Building & Repurposing', 'Medicine', 'Transportation'];
  var NEEDS = ['Survive', 'Connect', 'Create', 'Eat & Drink', 'Move', 'Play', 'Rest'];
  var OTHERS = ['Nature', 'Life', 'Ecology', 'Animals'];
  var THINGS = ['\u{1F4E6} Physical goods', '\u{1F372} Consumables', '\u{1FAB4} Living things'];
  var SPACES = ['\u{1F3E0} Home', '\u{1F6CF}️ Room', '\u{1F5E3}️ Meeting room', '\u{1F3AA} Venue', '\u{1F3A8} Studio', '\u{1F527} Workshop', '\u{1F4BB} Desk'];
  var PAID = ['Full-time', 'Part-time', 'One-time'];
  var GIG = ['House sitting', 'Pet sitting', 'Home care', 'Child care', 'Elder care'];
  var UNPAID = ['Mentor', 'Advisor', 'Board member', 'Tutor', 'Volunteer', 'Intern', 'Job shadowing'];
  var TAGS = [['interested', 'I’m interested in it'], ['enjoy', 'I enjoy it'], ['do', 'I can do it'], ['care', 'I care about it'], ['need', 'I’m seeking it'], ['offer', 'I can offer it']];
  var LEVELMAP = { 'fan':'Fan', 'beginner':'Beginner', 'learner':'Beginner', 'entry level':'Beginner', 'experienced':'Experienced', 'participant':'Experienced', 'practitioner':'Experienced', 'mid level':'Experienced', 'engaged':'Experienced', 'guide':'Guide', 'coach':'Guide', 'expert':'Guide' };
  var CUES = [['interested', /^(i'?m |i am )?(interested in|curious about|want to learn( about)?|want to hear about|into)\s+/], ['enjoy', /^(i )?(love|enjoy|like|adore)\s+/], ['do', /^(i )?(can|do|practice|play|make|am good at|'m good at)\s+/], ['do', /^(i'?m|i am) (a|an)\s+/], ['do', /^(i )?(volunteer|work|worked)( as| at| with| in)?\s+/], ['care', /^(i )?(care about|care for|value|believe in)\s+/], ['need', /^(i )?(need|seek|am seeking|'m seeking|am looking for|'m looking for|want|would like)\s+/], ['offer', /^(i )?(offer|can offer|can help with|could help with|give|lend|teach)\s+/]];
  var LEVELS = ['Beginner', 'Experienced', 'Guide'];
  var GUIDE_ROLES = ['Coach', 'Mentor', 'Consultant', 'Facilitator', 'Host'];
  var DO_ROLES = ['Volunteer', 'Service provider', 'Performer', 'Creator', 'Maker', 'Competitor', 'Player', 'Collector'];
  var SUGGEST = ['Cooking', 'Gardening', 'Hiking', 'Karaoke', 'Chess', 'Dogs', 'Bookkeeping', 'Piano', 'Yoga', 'Photography', 'Clean air', 'Babysitter'];
  var SKILLMAP = { 'arts & culture':'Arts', 'food & drink':'Food & Drink', 'physical wellbeing':'Medicine', 'mental wellbeing':'Medicine', 'family wellbeing':'Home Life', 'self-expression & beauty':'Personal Care', 'home & construction':'Building & Repurposing', 'transportation':'Transportation', 'mechanical & manufacturing':'Building & Repurposing', 'business & finance':'Business', 'community & civic':'Community & Culture', 'recreation & hobbies':'Play', 'technology & communications':'Technology', 'nature & outdoors':'Outdoors', 'social events & gatherings':'Community & Culture', 'events & gatherings':'Community & Culture', 'pets & animal care':'Animals', 'making & collecting':'Arts', 'basic needs and security':'Community & Culture' };
  var RECMAP = { 'sports':'Play', 'games & strategy':'Play', 'movement & performance':'Movement', 'outdoor & nature':'Outdoors', 'music':'Arts' };
  var SUBMAP = { 'visual art':'Arts', 'textile & fiber':'Arts', 'wood, metal & jewelry':'Building & Repurposing', 'paper & books':'Arts', 'photo, film & digital':'Arts', 'collecting':'Play' };
  var EXTRA = [
    ['heating repair', 'Building & Repurposing', 'heater furnace heating heat'], ['plumber', 'Building & Repurposing', 'plumbing leak sink toilet pipe'],
    ['car repair', 'Transportation', 'mechanic car repair brakes'], ['dog walker', 'Animals', 'dog walk walker'], ['food bank', 'Food & Drink', 'food bank groceries hungry meals'],
    ['piano lessons', 'Arts', 'piano lessons teach piano'], ['choir', 'Arts', 'choir sing singing chorus'], ['friends', 'Community & Culture', 'friends friend lonely company'],
    ['hiking', 'Outdoors', 'hike hiking trail trails'], ['babysitter', 'Home Life', 'babysitter sitter babysitting childcare'], ['coat', 'Style', 'coat jacket warm clothes'],
    ['doctor', 'Medicine', 'doctor clinic sick'], ['meditation', 'Faith', 'meditate meditation mindfulness'], ['bookkeeping', 'Finance', 'bookkeeping bookkeeper books accounting'],
    ['tree planting', 'Outdoors', 'trees planting plant restore'], ['clean air', 'Outdoors', 'air breathe smoke'],
    ['outdoor activities', 'Outdoors', 'outside outdoors fresh nature'],
    ['karaoke', 'Arts', 'karaoke'], ['photography', 'Arts', 'photography photos camera']
  ];
  var words = {}, loaded = false;
  var low = function(x){ return String(x || '').trim().toLowerCase(); };
  var addWord = function(name, cat, assoc){ var k = low(name); if (!k || k.length < 3) return; if (!words[k]) words[k] = { name: String(name).trim(), cat: cat, assoc: low(assoc) }; };
  var el = function(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  var pill = function(text, on){ var b = el('button', 'pill' + (on ? ' on' : ''), text); b.type = 'button'; return b; };
  var items = [], step = 1, confirmed = false, showCats = false, openCat = '';

  function guessCat(text){
    var t = ' ' + low(text).replace(/[^a-z0-9' ]+/g, ' ') + ' ', best = null;
    var exact = words[low(text)];
    if (exact) return exact.cat;
    var val = (RD.values || []).filter(function(v){ return v && low(v.item) === low(text); })[0];
    if (val) return /eco/i.test(val.category || '') ? 'Outdoors' : 'Community & Culture';
    Object.keys(words).forEach(function(k){
      var w = words[k], hit = t.indexOf(' ' + k + ' ') > -1 ? k.length + 100 : 0;
      if (!hit && w.assoc) { w.assoc.split(w.extra ? /[ ,]+/ : /\s*,\s*/).forEach(function(a){ a = a.trim(); if (a.length > 3 && t.indexOf(' ' + a + ' ') > -1) hit = Math.max(hit, a.length + (w.extra ? 50 : 0)); }); }
      if (hit && (!best || hit > best.hit)) best = { w: w, hit: hit };
    });
    return best ? best.w.cat : '';
  }

  function tsv(text){
    var rows = [[]], cell = '', q = false, t = String(text || '');
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) { if (ch === '"' && t[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
      else if (ch === '\n') { rows[rows.length - 1].push(cell); cell = ''; rows.push([]); }
      else if (ch !== '\r') cell += ch;
    }
    rows[rows.length - 1].push(cell);
    return rows;
  }
  function find(text){ for (var i = 0; i < items.length; i++) if (low(items[i].word) === low(text)) return items[i]; return null; }
  function add(text, tag, cat, level, quiet){
    text = String(text || '').trim().replace(/^[\s\-–•*]+|[\s.!?]+$/g, ''); if (!text || text.length < 2) return;
    text = text.charAt(0).toUpperCase() + text.slice(1);
    var it = find(text);
    if (!it) { it = { word: text, cat: '', catSure: false, tags: {}, level: '', roles: [], need: '', tend: '', work: '', open: '' }; items.push(it); }
    if (cat && !it.cat) { it.cat = cat; it.catSure = true; }
    if (!it.cat) it.cat = guessCat(text);
    if (tag) it.tags[tag] = 1;
    if (level) { if (level === 'Fan') it.fan = true; else { it.tags['do'] = 1; it.level = level; } }
    if (!quiet) paint();
  }
  function clauses(text){
    return String(text || '').replace(/\r/g, '').split(/[\n.;!?]+|,\s*|\s+and\s+|\s+&\s+|\s+as well as\s+/i).map(function(x){ return x.trim(); }).filter(String);
  }
  var STOP = ' a an the my our your their his her its us we i me you one another some more any this that these those very just really also of '.split(' ');
  var CUT = /\s(who|which|that|where|when|to|for|in|on|at|with|from|so|because|into|by|like|about)\s/;
  var RD = {};
  function known(list, w){ w = low(w); return (list || []).some(function(x){ return low(typeof x === 'string' ? x : (x && (x.item || x.label || x.name))) === w; }); }
  function isCatName(w){ w = low(w); return CATS.some(function(c){ return low(c) === w; }) || !!SKILLMAP[w] || !!RECMAP[w]; }
  function isJunk(c){
    c = String(c || '').trim();
    return !c || /^(true|false|yes|no)$/i.test(c) || /^\d{4}-\d\d-\d\d/.test(c) || /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(c)
      || /@/.test(c) || /^https?:/i.test(c) || /^[+\d][\d\s().-]{6,}$/.test(c) || (/^[A-Za-z0-9]{4,8}$/.test(c) && /[A-Z]/.test(c.slice(1)) && /[a-z]/.test(c));
  }
  function short(clause){
    var tag = '';
    var l = ' ' + low(clause).replace(/[^\p{L}\p{N}&' -]+/gu, ' ').replace(/\s+/g, ' ').trim() + ' ';
    l = l.replace(/\b(really|deeply|truly|also|very much|a lot|so much)\b/g, ' ').replace(/\s+/g, ' ');
    l = l.trim().replace(/^(and|or|but|also|then) /, '');
    CUES.forEach(function(cu){ var m = l.match(cu[1]); if (m) { tag = cu[0]; l = l.slice(m[0].length); } });
    l = l.replace(/^(an? )?(hour|hours|few hours|minutes|time|day|evening|afternoon|morning)s? (of |to )?/, '').replace(/^(helping|help) (us |people |others |you )?/, '');
    var hitWord = '';
    if (l.split(' ').length > 2) Object.keys(words).forEach(function(k){ if (k.length > 3 && k.split(' ').length <= 2 && (' ' + l + ' ').indexOf(' ' + k + ' ') > -1 && k.length > hitWord.length) hitWord = k; });
    if (hitWord) return { word: hitWord, tag: tag };
    var head = (' ' + l + ' ').split(CUT)[0].trim() || l;
    var ws = head.split(' ').filter(function(x){ return x && STOP.indexOf(x) < 0; });
    if (!ws.length) return null;
    return { word: ws.slice(0, 2).join(' '), tag: tag };
  }
  function clauses2(text){
    return String(text || '').replace(/\r/g, '').split(/[\n.;!?|]+|,\s*|\s+and\s+|\s+&\s+(?=[a-z])|\s+as well as\s+/i).map(function(x){ return x.trim(); }).filter(String);
  }
  function parseSentence(text, fallback){
    var tag = fallback || '';
    var LABELS = [[/skill|experience|expertise|work|job|role|certif/i, 'do'], [/interest|hobb|fun|love|enjoy/i, 'enjoy'], [/value|cause|care|passion/i, 'care'], [/need|looking|seek/i, 'need'], [/offer|can help|services/i, 'offer'], [/curious|learn|topic/i, 'interested']];
    String(text || '').split(/\n+/).forEach(function(line){
      var lt = fallback || '', lm = line.match(/^\s*([^:,.]{1,30}):\s+/);
      if (lm) { LABELS.some(function(L){ if (L[0].test(lm[1])) { lt = L[1]; return true; } return false; }); line = line.slice(lm[0].length); }
      tag = lt;
      clauses2(line).forEach(function(c){
      if (isCatName(c) || isJunk(c)) return;
      var sh = short(c); if (!sh || !sh.word || sh.word.length < 2) return;
      if (sh.tag) tag = sh.tag;
      add(sh.word, tag || guessTag(c, sh.word), '', '', true);
    }); });
  }
  function guessTag(whole, word){
    var w = low(whole);
    if (known(RD.values, word)) return 'care';
    if (/^(an? )(hour|few hours|time)\b/.test(w)) return 'offer';
    if (/\b\d+\+? years?\b|\b(years of|experience in|worked as|work as|volunteer)/.test(w)) return 'do';
    if (/^(an? )\w+( \w+)? (who|that) /.test(w)) return 'need';
    if (/^my /.test(w)) return 'enjoy';
    return 'interested';
  }
  function takeCell(raw, tag){
    String(raw || '').split('|').forEach(function(piece){
      piece = piece.trim(); if (!piece || isJunk(piece)) return;
      if (known(RD.languages, piece) || known(RD.appreciationTypes, piece) || /^(pass it on|physical goods|money)$/i.test(piece)) return;
      if (piece.indexOf(':') > -1 && piece.split(' ').length < 12 && !/,/.test(piece) && !/:\s/.test(piece)) {
        var parts = piece.split(':'), word = parts[0], old = low(parts[1]), lv = '', isSkill = false;
        parts.slice(1).forEach(function(x){ var m = LEVELMAP[low(x)]; if (m) lv = m; if (low(x) === 'skill') isSkill = true; });
        var cat = CATS.filter(function(c){ return low(c) === old; })[0] || SKILLMAP[old] || RECMAP[old] || SUBMAP[old] || '';
        var t = tag || ((lv && lv !== 'Fan') || isSkill ? 'do' : '');
        var sh = word.split(' ').length > 2 ? short(word) : { word: word };
        if (sh) add(sh.word, t || guessTag(word, sh.word), cat, t === 'do' ? lv : (lv === 'Fan' ? 'Fan' : ''), true);
      } else if (piece.split(' ').length > 2 || /[.,;]/.test(piece)) parseSentence(piece, tag);
      else if (!isCatName(piece)) { var sh2 = short(piece); if (sh2) add(sh2.word, tag || sh2.tag || guessTag(piece, sh2.word), '', '', true); }
    });
  }
  function takeRow(text){
    var rows = tsv(text).filter(function(r){ return r.some(function(c){ return String(c).trim(); }); });
    if (!rows.length) return 0;
    var boxes = [['interests', 'enjoy'], ['skills', 'do'], ['values', 'care'], ['needs', 'need'], ['haves', 'offer'], ['topics', 'interested']];
    var H = rows[0].map(function(h){ return low(h); }), got = 0;
    if (rows.length > 1 && boxes.some(function(b){ return H.indexOf(b[0]) > -1; })) {
      var R = rows[rows.length - 1];
      boxes.forEach(function(b){ var c = H.indexOf(b[0]); if (c > -1 && R[c]) { got++; takeCell(R[c], b[1]); } });
      return got;
    }
    if (rows.length > 1 && rows[0].length === 1 && /^[A-Z][\w'-]+( [A-Z][\w'.-]+){1,3}$/.test(String(rows[0][0]).trim())) rows = rows.slice(1);
    rows.forEach(function(r){ r.forEach(function(c, ix){
      c = String(c || '').trim();
      if (ix === 0 && r.length > 5 && /^[A-Z][\w'-]+( [A-Z][\w'-]+)+$/.test(c)) return;
      if (!c || isJunk(c)) return; got++; takeCell(c, '');
    }); });
    return got;
  }
  function doneRow(box, it, key, label, opts, isOn, pickIt, summary){
    it.done = it.done || {};
    var m = el('div', 'more');
    if (it.done[key]) {
      var line = el('div', 'about', label.split('?')[0] + '? ' + (summary() || 'none') + ' · ');
      var ch = el('button', '', 'change'); ch.type = 'button'; ch.onclick = function(){ it.done[key] = false; paint(); }; line.appendChild(ch);
      m.appendChild(line); box.appendChild(m); return;
    }
    m.appendChild(el('div', 'lab', label));

    m.appendChild(r);
    if (box._extra) { m.appendChild(box._extra); box._extra = null; }
    var dn = pill('Done', true); dn.style.marginTop = '10px'; dn.onclick = function(){ it.done[key] = true; paint(); }; m.appendChild(dn);
    box.appendChild(m);
  }
  function whoFor(w, it){
    it.forWho = it.forWho || []; it.forOther = it.forOther || [];
    var toggle = function(list, o){ var a = list.indexOf(o); if (a > -1) list.splice(a, 1); else list.push(o); };
    var summary = function(){ return it.forWho.map(function(x){ return x === 'Others' && it.forOther.length ? 'Others (' + it.forOther.join(', ') + ')' : x; }).join(', '); };
    if (it.forWho.indexOf('Others') > -1 && !(it.done && it.done.who)) {
      var ex = el('div'); ex.appendChild(el('div', 'lab', 'Which others?'));
      var r = el('div', 'row');
      OTHERS.concat(it.forOther.filter(function(x){ return OTHERS.indexOf(x) < 0; })).forEach(function(o){ var b = pill(o, it.forOther.indexOf(o) > -1); b.onclick = function(){ toggle(it.forOther, o); paint(); }; r.appendChild(b); });
      ex.appendChild(r);
      var inp = el('input'); inp.placeholder = 'Or add your own and press Enter'; inp.style.cssText = 'border:1.5px solid #DDE3EA;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;margin-top:8px;width:100%;';
      inp.onkeydown = function(e){ if (e.key === 'Enter' && inp.value.trim()) { var v = inp.value.trim(); v = v.charAt(0).toUpperCase() + v.slice(1); if (it.forOther.indexOf(v) < 0) it.forOther.push(v); paint(); } };
      ex.appendChild(inp); ex.style.marginTop = '8px';

    }
    doneRow(w, it, 'who', 'Who is it for? Pick one or both.', ['Myself', 'Others'], function(o){ return it.forWho.indexOf(o) > -1; }, function(o){ toggle(it.forWho, o); if (o === 'Others' && it.forWho.indexOf('Others') < 0) it.forOther = []; }, summary);
  }
  function pickRow(box, it, key, label, base){
    it.pick = it.pick || {}; var list = it.pick[key] = it.pick[key] || []; it.pickOther = it.pickOther || {};
    var m = el('div', 'more'); m.appendChild(el('div', 'lab', label));
    var r = el('div', 'row');
    base.concat(list.filter(function(x){ return base.indexOf(x) < 0; })).forEach(function(o){ var b = pill(o, list.indexOf(o) > -1); b.onclick = function(){ var a = list.indexOf(o); if (a > -1) list.splice(a, 1); else list.push(o); paint(); }; r.appendChild(b); });
    var ob = pill('+ Other', !!it.pickOther[key]); ob.onclick = function(){ it.pickOther[key] = !it.pickOther[key]; paint(); }; r.appendChild(ob);
    m.appendChild(r);
    if (it.pickOther[key]) {
      var inp = el('input'); inp.placeholder = 'What else? Press Enter to add'; inp.style.cssText = 'border:1.5px solid #DDE3EA;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;margin-top:8px;width:100%;';
      inp.onkeydown = function(e){ if (e.key === 'Enter' && inp.value.trim()) { var v = inp.value.trim(); v = v.charAt(0).toUpperCase() + v.slice(1); if (list.indexOf(v) < 0) list.push(v); it.pickOther[key] = false; paint(); } };
      m.appendChild(inp); setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 0);
    }
    box.appendChild(m);
  }
  function roleRow(box, it, label, base){
    var m = el('div', 'more'); m.appendChild(el('div', 'lab', label));
    var r = el('div', 'row');
    var toggle = function(o){ var a = it.roles.indexOf(o); if (a > -1) it.roles.splice(a, 1); else it.roles.push(o); paint(); };
    base.concat(it.roles.filter(function(x){ return base.indexOf(x) < 0; })).forEach(function(o){ var b = pill(o, it.roles.indexOf(o) > -1); b.onclick = function(){ toggle(o); }; r.appendChild(b); });
    var ob = pill('Other', !!it.roleOther); ob.onclick = function(){ it.roleOther = !it.roleOther; paint(); }; r.appendChild(ob);
    m.appendChild(r);
    if (it.roleOther) {
      var inp = el('input'); inp.placeholder = 'What else? Press Enter to add'; inp.style.cssText = 'border:1.5px solid #DDE3EA;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;margin-top:8px;width:100%;';
      inp.onkeydown = function(e){ if (e.key === 'Enter' && inp.value.trim()) { var v = inp.value.trim(); v = v.charAt(0).toUpperCase() + v.slice(1); if (it.roles.indexOf(v) < 0) it.roles.push(v); it.roleOther = false; paint(); } };
      m.appendChild(inp); setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 0);
    }
    box.appendChild(m);
  }
  function chipRow(box, label, opts, isOn, pickIt){
    var m = el('div', 'more');
    m.appendChild(el('div', 'lab', label));
    var r = el('div', 'row');
    opts.forEach(function(o){ var b = pill(o, isOn(o)); b.onclick = function(){ pickIt(o); paint(); }; r.appendChild(b); });
    m.appendChild(r); box.appendChild(m);
  }

  function stepOne(app){
    app.appendChild(el('h1', '', 'What are you interested in?'));
    app.appendChild(el('p', 'lede', 'Anything at all: things you love, things you are good at, things you care about or need. Add as many as you like. You will say how each one fits you next.'));
    var ask = el('div', 'ask'), inp = el('input'); inp.type = 'text'; inp.placeholder = 'gardening, bookkeeping, or a sentence: I love to sing and I can fix bikes'; inp.autocomplete = 'off';
    var go = pill('Add', true); go.classList.add('big');
    var take = function(){ var v = inp.value; if (/\t/.test(v)) { takeRow(v); if (items.length) step = 2; } else if (v.trim().split(/\s+/).length > 2) parseSentence(v, ''); else v.split(',').forEach(function(x){ add(x, '', '', '', true); }); inp.value = ''; paint(); setTimeout(function(){ var n = document.querySelector('.ask input'); if (n) n.focus(); }, 0); };
    go.onclick = take; inp.onkeydown = function(e){ if (e.key === 'Enter') { e.preventDefault(); take(); } };
    ask.appendChild(inp); ask.appendChild(go); app.appendChild(ask);
    app.appendChild(el('div', 'sub', 'Or tap some'));
    var r = el('div', 'row');
    SUGGEST.forEach(function(s){ if (find(s)) return; var b = pill(s); b.onclick = function(){ add(s); }; r.appendChild(b); });
    var sc = pill(showCats ? 'Hide categories' : 'Show me categories', showCats); sc.onclick = function(){ showCats = !showCats; openCat = ''; paint(); }; r.appendChild(sc);
    app.appendChild(r);
    if (showCats) {
      var cb = el('div', 'catbox'), cr = el('div', 'row');
      cb.appendChild(el('div', 'lab', openCat ? openCat + ': tap any to add' : 'Pick a category to see its words'));
      if (!openCat) CATS.forEach(function(c){ var b = pill(c); b.onclick = function(){ openCat = c; paint(); }; cr.appendChild(b); });
      else {
        var bk = pill('‹ All categories'); bk.onclick = function(){ openCat = ''; paint(); }; cr.appendChild(bk);
        var seen = {}, ws = [];
        Object.keys(words).forEach(function(k){ var x = words[k]; if (x.cat === openCat && !seen[low(x.name)]) { seen[low(x.name)] = 1; ws.push(x.name); } });
        ws.sort(function(a, b){ return a.localeCompare(b); }).forEach(function(n){ var b = pill(n, !!find(n)); b.onclick = function(){ if (!find(n)) add(n, '', openCat, '', true); paint(); }; cr.appendChild(b); });
        if (!ws.length) cb.appendChild(el('div', 'about', loaded ? 'No words here yet. Type your own above.' : 'Loading the words…'));
      }
      cb.appendChild(cr); app.appendChild(cb);
    }
    if (!loaded) app.appendChild(el('div', 'wait', 'Loading the words…'));
    var det = el('details'); det.style.cssText = 'margin-top:16px;font-size:13px;';
    var sm = el('summary', '', 'Try it pasting existing answers, like a resume or your own document of interests'); sm.style.cssText = 'cursor:pointer;color:var(--blue);font-weight:600;'; det.appendChild(sm);
    det.appendChild(el('p', 'lede', 'Paste anything: a resume, a list of interests, a bio, or a row copied from the ikigai tab. We pick out the words and guess how each one fits. It stays in this browser: nothing is sent or saved.'));
    var ta = el('textarea'); ta.rows = 4; ta.placeholder = 'Paste a resume, a list, or a row'; ta.style.cssText = 'width:100%;border:1.5px solid #DDE3EA;border-radius:8px;padding:8px;font:inherit;font-size:13px;'; det.appendChild(ta);
    var msg = el('div', 'wait'); det.appendChild(msg);
    var ld = pill('Load these answers', true); ld.classList.add('big'); ld.style.marginTop = '10px';
    ld.onclick = function(){
      items = [];
      if (!takeRow(ta.value) || !items.length) { msg.textContent = 'I could not find any answers in that paste.'; return; }
      step = 2; paint(); window.scrollTo(0, 0);
    };
    det.appendChild(ld); app.appendChild(det);
    if (items.length) {
      app.appendChild(el('div', 'sub', 'Your interests (' + items.length + ')'));
      var mine = el('div', 'mine');
      items.forEach(function(it, ix){ var b = pill(it.word); var x = el('b', '', '×'); b.appendChild(x); b.title = 'Remove'; b.onclick = function(){ items.splice(ix, 1); paint(); }; mine.appendChild(b); });
      app.appendChild(mine);
      var nx = pill('Next: how each one fits you', true); nx.classList.add('big', 'next');
      nx.onclick = function(){ step = 2; paint(); window.scrollTo(0, 0); };
      app.appendChild(nx);
    }
  }

  function wordCard(it){
    var w = el('div', 'w');
    var top = el('div', 'top'); top.appendChild(el('h3', '', it.word));
    var pen = el('button', 'ico', '\u270F\uFE0F'); pen.type = 'button'; pen.title = 'Edit'; pen.onclick = function(){ if (!it.editing) { it.snap = JSON.stringify(it); it.editing = true; } paint(); }; top.appendChild(pen);
    var xx = el('button', 'ico', '×'); xx.type = 'button'; xx.title = 'Remove'; xx.style.fontSize = '20px'; xx.onclick = function(){ items.splice(items.indexOf(it), 1); paint(); }; top.appendChild(xx);
    w.appendChild(top);
    var cats = [it.cat].concat(it.also || []).filter(String);
    var ab = el('div', 'about');
    ab.appendChild(document.createTextNode(!cats.length ? 'Category: pick one or more' : (it.catSure ? 'Category: ' : 'Possible category selected: ') + cats.join(', ')));
    if (it.catDone) { ab.appendChild(document.createTextNode(' · ')); var ch = el('button', '', 'change'); ch.type = 'button'; ch.onclick = function(){ it.catDone = false; paint(); }; ab.appendChild(ch); }
    w.appendChild(ab);
    if (it.editing === false) { w.appendChild(el('div', 'about', tagLine(it))); return w; }
    w.appendChild(el('div', 'rule'));
    if (!it.catDone) {
      var q = el('div', 'catbox'), r = el('div', 'row');
      q.appendChild(el('div', 'lab', cats.length ? 'Tap to add or remove. Pick as many as fit.' : 'We don’t know “' + it.word + '” yet. Which fit? Pick as many as you like.'));
      CATS.forEach(function(c){ var b = pill(c, cats.indexOf(c) > -1); b.onclick = function(){ var at = cats.indexOf(c); if (at > -1) cats.splice(at, 1); else cats.push(c); it.cat = cats[0] || ''; it.also = cats.slice(1); paint(); }; r.appendChild(b); });
      q.appendChild(r);
      var dn = pill('Done', true); dn.style.marginTop = '10px'; dn.onclick = function(){ if (!cats.length) return; it.catDone = true; it.catSure = true; paint(); }; q.appendChild(dn);
      w.appendChild(q);
    }
    var tr = el('div', 'row');
    TAGS.forEach(function(t){ var b = pill(t[1], !!it.tags[t[0]]); b.onclick = function(){ if (it.tags[t[0]]) delete it.tags[t[0]]; else it.tags[t[0]] = 1; paint(); }; tr.appendChild(b); });
    w.appendChild(tr);
    if (it.tags.enjoy) doneRow(w, it, 'fan', 'Do you do it, or are you a fan? Pick one or both.', ['Fan', 'I do it'], function(o){ return o === 'Fan' ? !!it.fan : !!it.tags['do']; }, function(o){ if (o === 'Fan') it.fan = !it.fan; else { if (it.tags['do']) delete it.tags['do']; else it.tags['do'] = 1; } }, function(){ return [it.fan ? 'Fan' : '', it.tags['do'] ? 'I do it' : ''].filter(String).join(', '); });
    if (it.tags.offer || it.tags.need) {
      chipRow(w, 'Is it a skill, a thing or a space?', ['Skill', 'Thing', 'Space'], function(o){ return it.kind === o; }, function(o){ it.kind = it.kind === o ? '' : o; it.pick = it.pick || {}; it.pick.kindOf = []; });
      if (it.kind === 'Thing') pickRow(w, it, 'kindOf', 'What kind of thing? Pick as many as fit.', THINGS);
      if (it.kind === 'Space') pickRow(w, it, 'kindOf', 'What kind of space? Pick as many as fit.', SPACES);
    }
    if (it.tags['do'] || (it.tags.offer && it.kind === 'Skill')) {
      chipRow(w, 'How far along are you?', LEVELS, function(o){ return it.level === o; }, function(o){ it.level = it.level === o ? '' : o; it.roles = []; });
      if (it.level === 'Guide') roleRow(w, it, 'How do you guide others?', GUIDE_ROLES);
      if (it.level === 'Experienced') roleRow(w, it, 'How do you do it?', DO_ROLES);
    }
    if (Object.keys(it.tags).length) whoFor(w, it);
    if (it.tags.need) chipRow(w, 'What would it give you? I need to…', NEEDS, function(o){ return it.need === o; }, function(o){ it.need = it.need === o ? '' : o; });
    if (it.tags.offer && it.kind === 'Skill') {
      chipRow(w, 'Are you open to paid work for this?', ['Yes', 'No'], function(o){ return it.work === o; }, function(o){ it.work = it.work === o ? '' : o; });
      if (it.work === 'Yes') {
        pickRow(w, it, 'paid', 'What type of paid work? Pick as many as fit.', PAID);
        if ((it.pick.paid || []).indexOf('Part-time') > -1) pickRow(w, it, 'gig', 'Are you interested in gig work?', GIG);
      }
      chipRow(w, 'Are you open to unpaid work for this?', ['Yes', 'No'], function(o){ return it.unpaid === o; }, function(o){ it.unpaid = it.unpaid === o ? '' : o; });
      if (it.unpaid === 'Yes') {
        pickRow(w, it, 'unpaidTime', 'What type of unpaid work? Pick as many as fit.', PAID);
        pickRow(w, it, 'unpaidKind', 'Which types of unpaid work?', UNPAID);
      }
    }
    var act = el('div', 'row'); act.style.marginTop = '14px';
    var sv = pill('Save', true); sv.classList.add('big'); sv.onclick = function(){ it.editing = false; if (it.cat) { it.catSure = true; it.catDone = true; } it.snap = ''; paint(); };
    var cn = pill('Cancel'); cn.classList.add('big'); cn.style.color = 'var(--grey)'; cn.style.borderColor = 'var(--line)';
    cn.onclick = function(){ if (it.snap) { var o = JSON.parse(it.snap); Object.keys(it).forEach(function(k){ delete it[k]; }); Object.assign(it, o); it.editing = false; it.snap = ''; } else it.editing = false; paint(); };
    act.appendChild(sv); act.appendChild(cn); w.appendChild(act);
    return w;
  }

  function saves(){
    var col = { topics: [], interests: [], skills: [], values: [], needs: [], haves: [] };
    items.forEach(function(it){
      var c = it.cat || '?';
      var fw = (it.forWho || []).filter(function(x){ return x !== 'Others' || !(it.forOther || []).length; }).concat((it.forWho || []).indexOf('Others') > -1 ? (it.forOther || []).map(function(x){ return OTHERS.indexOf(x) > -1 ? x : 'Other=' + x; }) : []);
      var mk = ((it.also || []).length ? ':alsoIn=' + it.also.join('+') : '') + (fw.length ? ':for=' + fw.join('+') : '');
      if (it.tags.interested) col.topics.push(it.word + ':' + c + mk);
      if (it.tags.enjoy) col.interests.push(it.word + ':' + c + (it.fan ? ':Fan' : '') + mk);
      if (it.tags['do']) { var roles = it.roles.map(function(r){ return r.replace(/ /g, ''); }).join('+'); col.skills.push(it.word + ':' + c + ':' + (it.level || '?') + mk + (roles ? (it.level === 'Guide' ? ':guideAs=' : ':practiceAs=') + roles : '')); }
      if (it.tags.care) col.values.push(it.word + ':' + c + mk);
      var plain = function(l){ return (l || []).map(function(x){ return x.replace(/^[^A-Za-z]+/, '').replace(/ /g, ''); }).join('+'); };
      var pk = it.pick || {};
      var kd = it.kind ? ':' + it.kind.toLowerCase() + ((pk.kindOf || []).length ? '=' + plain(pk.kindOf) : '') : '';
      var wk = (it.work === 'Yes' ? ':work' + ((pk.paid || []).length ? '=' + plain(pk.paid) : '') + ((pk.gig || []).length ? ':gig=' + plain(pk.gig) : '') : '') + (it.unpaid === 'Yes' ? ':unpaid' + ((pk.unpaidTime || []).concat(pk.unpaidKind || []).length ? '=' + plain((pk.unpaidTime || []).concat(pk.unpaidKind || [])) : '') : '');
      if (it.tags.need) col.needs.push(it.word + ':' + c + kd + mk + (it.need ? ':need=' + it.need : ''));
      if (it.tags.offer) col.haves.push(it.word + ':' + c + (it.kind === 'Skill' && it.level ? ':' + it.level : '') + kd + mk + wk);
    });
    var box = el('div', 'saves');
    box.appendChild(el('div', 'lab', 'Where this would save (nothing is saved in this mockup)'));
    var lines = ['topics', 'interests', 'skills', 'values', 'needs', 'haves'].map(function(k){ return 'ikigai.' + k + ':  ' + (col[k].join(' | ') || '—'); });
    box.appendChild(el('pre', '', lines.join('\n')));
    return box;
  }

  function stepTwo(app){
    var back = el('button', 'back', '‹ Add more interests'); back.type = 'button'; back.onclick = function(){ step = 1; paint(); }; app.appendChild(back);
    app.appendChild(el('h1', '', 'How does each one fit you?'));
    app.appendChild(el('p', 'lede', 'Tap every one that is true. A few short questions open only for what you tap.'));
    var fold = el('div', 'fold'); var bar = el('div', 'fold-h', 'Interests added (' + items.length + ')'); fold.appendChild(bar);
    var g = el('div', 'grid'); items.forEach(function(it){ g.appendChild(wordCard(it)); }); fold.appendChild(g); app.appendChild(fold);
    var rv = pill('Next: check everything', true); rv.classList.add('big', 'next'); rv.onclick = function(){ step = 3; paint(); window.scrollTo(0, 0); }; app.appendChild(rv);
  }
  function tagLine(it){
    var bits = [];
    TAGS.forEach(function(t){ if (!it.tags[t[0]]) return; var x = t[1];
      if (t[0] === 'enjoy' && it.fan) x += ' (fan)';
      if ((t[0] === 'offer' || t[0] === 'need') && it.kind) x += ' (' + (((it.pick || {}).kindOf || []).length ? it.pick.kindOf.join(', ') : it.kind) + ')';
      if ((t[0] === 'do' || (t[0] === 'offer' && it.kind === 'Skill')) && it.level) x += ' (' + it.level + (it.roles.length ? ': ' + it.roles.join(', ') : '') + ')';
      if (t[0] === 'need' && it.need) x += ' (to ' + it.need + ')';
      if (t[0] === 'offer' && it.work === 'Yes') x += ' · paid work' + (((it.pick || {}).paid || []).length ? ': ' + it.pick.paid.join(', ') : '');
      if (t[0] === 'offer' && it.unpaid === 'Yes') x += ' · unpaid work' + ((((it.pick || {}).unpaidTime || []).concat((it.pick || {}).unpaidKind || [])).length ? ': ' + (it.pick.unpaidTime || []).concat(it.pick.unpaidKind || []).join(', ') : '');
      bits.push(x); });
    var who = (it.forWho || []).map(function(x){ return x === 'Others' && (it.forOther || []).length ? it.forOther.join(', ') : x; }).join(', ');
    return (bits.join(' · ') || 'No tags yet') + (who ? ' · for ' + who : '');
  }
  function stepThree(app){
    var back = el('button', 'back', '‹ Back to your answers'); back.type = 'button'; back.onclick = function(){ step = 2; paint(); }; app.appendChild(back);
    app.appendChild(el('h1', '', 'Is this all right?'));
    app.appendChild(el('p', 'lede', 'Here is everything, with the categories we picked. Confirm it all at once, or tap a word to change it.'));
    items.forEach(function(it){
      var d = el('div', 'w'); d.style.cursor = 'pointer';
      d.appendChild(el('h3', '', it.word));
      var cats = [it.cat].concat(it.also || []).filter(String);
      d.appendChild(el('div', 'about', 'Category: ' + (cats.join(', ') || 'none yet') + (it.catSure ? '' : ' (not confirmed)')));
      d.appendChild(el('div', 'about', tagLine(it)));
      d.onclick = function(){ step = 2; it.catDone = false; paint(); };
      app.appendChild(d);
    });
    var ok = pill(confirmed ? 'All confirmed' : 'Confirm all', true); ok.classList.add('big', 'next');
    ok.onclick = function(){ items.forEach(function(it){ if (it.cat) { it.catSure = true; it.catDone = true; } }); confirmed = true; paint(); };
    app.appendChild(ok);
    app.appendChild(saves());
  }

  function railPaint(){
    var box = window._ifRail; if (!box) return;
    box.innerHTML = '';
    [[1, 'Your interests'], [2, 'How each one fits you'], [3, 'Check everything']].forEach(function(s){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = s[1];
      if (s[0] === step) b.className = 'on';
      var done = s[0] === 1 ? items.length > 0 : s[0] === 2 ? items.length > 0 && items.every(function(i){ return Object.keys(i.tags).length && i.catDone; }) : confirmed;
      if (done) { var ck = document.createElement('span'); ck.className = 'ck'; ck.textContent = '✓'; b.appendChild(ck); }
      b.onclick = function(){ if (s[0] > 1 && !items.length) return; step = s[0]; paint(); window.scrollTo(0, 0); };
      box.appendChild(b);
    });
  }
  window._ifPaint = function(){ paint(); };
  function paint(){
    railPaint();
    var app = document.getElementById('app'); app.innerHTML = '';
    if (step === 3 && items.length) stepThree(app); else if (step === 2 && items.length) stepTwo(app); else { step = 1; stepOne(app); }
  }

  paint();
  fetch(GS + '?action=getReferenceData').then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(rd){
    rd = rd || {}; RD = rd;
    (rd.recreation || []).forEach(function(r){
      var p = low(r.parent), t = low(r.recType), sb = low(r.category);
      var top = SUBMAP[sb] || RECMAP[t] || (p === 'arts & culture' ? 'Arts' : 'Play');
      if (low(r.item) === 'arts & culture') return;
      addWord(r.item, top, r.associations); if (r.category) addWord(r.category, top, '');
    });
    (rd.skills || []).forEach(function(s){ addWord(s.item, SKILLMAP[low(s.category)] || 'Business', s.associations); });
    EXTRA.forEach(function(x){ words[low(x[0])] = { name: x[0], cat: x[1], assoc: x[2], extra: true }; });
    loaded = true;
    items.forEach(function(it){ if (!it.catSure && !it.cat) it.cat = guessCat(it.word); });
    paint();
  });
})();
