<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in mockup · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#4B5A6D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;--green:#2E9E5B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--blue);color:var(--ink);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px;}
  .panel{background:#fff;border-radius:16px;padding:26px 28px;}
  .note{background:#FFF4D6;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
  h1{font-size:26px;margin:0 0 4px;}
  .lede{color:var(--grey);font-size:14.5px;margin:0 0 16px;line-height:1.5;}
  .prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .bar{flex:1;height:10px;background:#E6ECF2;border-radius:6px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s;}
  .prog b{font-size:14px;white-space:nowrap;}
  .band{background:var(--blue);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:10px 10px 0 0;}
  .grid{border:1.5px solid var(--pale);border-top:0;border-radius:0 0 12px 12px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;}
  .c{border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;position:relative;background:#fff;}
  .c h3{margin:0 0 3px 0;font-size:16px;word-break:break-word;}
  .cat{font-size:12.5px;color:var(--grey);margin-bottom:8px;}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:12px;background:#E6F1FB;color:var(--blue);margin:0 4px 4px 0;text-transform:lowercase;}
  .sum{font-size:13px;color:#33475B;line-height:1.45;margin-top:4px;}
  .c.ok{border-color:var(--green);}
  .mark{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;text-align:center;line-height:24px;font-size:14px;}
  .c.more{border:1.5px dashed var(--blue);}
  .flag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--blue);background:#E6F1FB;padding:4px 8px;border-radius:12px;}
  .need{font-size:12.5px;color:var(--grey);margin:6px 0 8px;}
  .need span{display:inline-block;border:1px solid var(--pale);border-radius:12px;padding:2px 8px;margin:2px 3px 0 0;color:var(--blue);background:#fff;}
  .btn{font:inherit;display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:18px;border:0;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .c.open{grid-column:1 / -1;border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:18px 22px;}
  .qhead{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;}
  .qq{font-size:15px;font-weight:800;}
  .qcount{font-size:12px;color:var(--grey);font-weight:700;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pill{font:inherit;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;background:#fff;border:1px solid var(--pale);color:var(--blue);font-weight:600;}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .qnav{display:flex;gap:10px;margin-top:14px;align-items:center;}
  .link{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;}
  .foot .btn{font-size:15px;padding:11px 22px;}
  .msg{font-size:13.5px;color:var(--grey);margin-top:12px;}
  .tr{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;}
  .tr .mark,.tr .flag{position:static;}
  .pen{font:inherit;background:none;border:0;cursor:pointer;font-size:15px;padding:2px;line-height:1;}
  .c h3{margin-right:120px;}
  .kvs{margin-top:8px;border-top:1px solid var(--line);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .kv span{color:var(--grey);}
  .kv b{font-weight:700;text-align:right;}
  .kv.miss span{color:var(--blue);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:14px;background:#EEF1F5;color:var(--ink);border:1px solid #EEF1F5;}
  .chip.add{background:#fff;border:1.5px dashed var(--blue);color:var(--blue);font-weight:700;cursor:pointer;}
  .foot-bar{font:inherit;display:block;width:calc(100% + 28px);margin:12px -14px -12px;padding:10px 14px;border:0;border-top:1px solid var(--pale);border-radius:0 0 11px 11px;background:#E6F1FB;color:var(--blue);font-weight:700;font-size:13px;text-align:left;cursor:pointer;}
  html.ao-editing .note,html.ao-editing h1,html.ao-editing .lede,html.ao-editing .prog,html.ao-editing .band,html.ao-editing .foot,html.ao-editing .msg{display:none;}
  html.ao-editing .grid{border:0;padding:0;display:block;}
  .c.edit{border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:20px 24px;}
  .ehead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
  .eq{font-size:14.5px;font-weight:800;margin-top:18px;}
  .det{width:100%;margin-top:8px;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;}
  @media(max-width:768px){.panel{padding:20px 16px;}.grid{grid-template-columns:1fr;}h1{font-size:22px;}}
  @media(min-width:769px) and (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="note">Look-only mockup. Nothing here saves.</div>
    <h1>You're in. Here's what we heard.</h1>
    <p class="lede">A green check means we have everything for that one. The rest are optional: a quick answer or two gets you better matches.</p>
    <div class="prog"><div class="bar"><i id="ao-bar"></i></div><b id="ao-count"></b></div>
    <div class="band" id="ao-band"></div>
    <div class="grid" id="ao-grid"></div>
    <div class="foot">
      <button class="btn" type="button" id="ao-go">See who and what fits me</button>
      <button class="btn ghost" type="button" id="ao-rest"></button>
    </div>
    <div class="msg" id="ao-msg"></div>
  </div>
</div>
<script>
(function(){
  var CATS = ['Food & Drink','Movement','Play','Travel','Community & Culture','Arts','Outdoors','Home Life','Animals','Technology','Style','Personal Care','Faith','Business','Communications','Building & Repurposing','Transportation','Finance','Science','Medicine'];
  var Q = {
    how:   { q: 'How is this of interest to you?', opts: ['Fan', 'I do it'], many: true },
    who:   { q: 'Is it for yourself, or in service to someone or something else?', opts: ['Tend to self', 'People', 'Nature'], many: true },
    level: { q: 'What is your level?', opts: ['Beginner', 'Experienced', 'Guide'] },
    gives: { q: 'What would it give you?', opts: ['Helps me create', 'Helps me connect', 'Helps me eat & drink', 'Helps me move', 'Helps me play', 'Helps me survive', 'Helps me rest'], many: true },
    kind:  { q: 'Is it a skill, a thing or a space?', opts: ['Skill', 'Thing', 'Space'] },
    lens:  { q: 'Is it social or ecological?', opts: ['Social', 'Ecological'], many: true },
    cat:   { q: 'Which category fits?', opts: CATS, many: true }
  };
  var SHORT = { how: 'Fan or I do it?', who: 'Who it’s for', level: 'Your level', gives: 'What would it give you?', kind: 'Skill, thing or space?', lens: 'Social or ecological?', cat: 'Which category?' };
  var TAG = { enjoy: 'joy', skill: 'skill', care: 'care', seek: 'seeking', offer: 'offering' };

  var SAMPLE = [
    { word: 'Clean Air', tag: 'care', cat: 'Ecological', a: { who: ['People', 'Nature'] } },
    { word: 'Accountant', tag: 'skill', cat: 'Finance', a: { level: ['Experienced'], who: ['People'] } },
    { word: 'Cooking', tag: 'enjoy', cat: 'Food & Drink', a: {} },
    { word: 'Karaoke', tag: 'enjoy', cat: 'Arts', a: { how: ['I do it'], who: ['Tend to self'] } },
    { word: 'Career mentor', tag: 'seek', cat: 'Business', a: { who: ['Tend to self'] } },
    { word: '\u{1F4E6} Physical goods', tag: 'seek', cat: '', thing: true, a: { gives: ['Helps me move'], who: ['People'] }, det: 'a used bike for my daughter' },
    { word: '\u{1F372} Sourdough starter', tag: 'offer', cat: 'Food & Drink', a: { kind: ['Thing'], who: ['People'] } },
    { word: 'Pickleball', tag: 'enjoy', cat: 'Play', guess: true, a: {} }
  ];

  function needs(it){
    var n = [];
    if (it.tag === 'enjoy') n.push('how');
    if (it.tag === 'skill') n.push('level');
    if (it.tag === 'seek') n.push('gives');
    if (it.tag === 'offer' && !it.thing) n.push('kind');
    if (it.tag === 'care' && !it.cat) n.push('lens');
    if (it.tag !== 'care' && !it.thing && (!it.cat || it.guess)) n.push('cat');
    n.push('who');
    return n;
  }
  function missing(it){ return needs(it).filter(function(k){ return !(it.a[k] && it.a[k].length); }); }

  var items = [];
  var fromOne = /[?&]from=onepage/.test(location.search), hand = null;
  if (fromOne) { try { hand = JSON.parse(sessionStorage.getItem('if-handoff') || 'null'); } catch (e) {} }
  if (hand) {
    var tags = hand.tags || {};
    var split = function(s){ return String(s || '').split(/[,\n;]+/).map(function(x){ return x.trim(); }).filter(Boolean); };
    [['introEnjoy', 'enjoy'], ['introValues', 'care'], ['introSkills', 'skill'], ['introOffer', 'offer'], ['introNeed', 'seek']].forEach(function(p){
      var t = tags[p[0]] || {};
      split(hand[p[0]]).forEach(function(w){
        var cat = t[w] || '';
        if (p[1] === 'care' && !/^(social|ecological)$/i.test(cat)) cat = '';
        if (p[1] !== 'care' && CATS.indexOf(cat) === -1) cat = '';
        items.push({ word: w, tag: p[1], cat: cat, a: {} });
      });
    });
    [['offerThings', 'offer', 'offerDetails'], ['seekThings', 'seek', 'seekDetails']].forEach(function(p){
      (hand[p[0]] || []).forEach(function(w){ items.push({ word: w, tag: p[1], cat: '', thing: true, det: hand[p[2]] || '', a: {} }); });
    });
  }
  if (!items.length) items = SAMPLE;

  var grid = document.getElementById('ao-grid');
  var openIx = -1, step = 0;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  var CARD = (location.search.match(/[?&]card=([abc])\b/) || [])[1] || 'a';
  document.documentElement.classList.add('card-' + CARD);
  var LAB = { how: 'Interest', who: 'For', level: 'Level', gives: 'Gives you', kind: 'Kind', lens: 'Lens' };
  var WHO = { 'Tend to self': 'yourself', 'People': 'people', 'Nature': 'nature' };
  var VERB = { enjoy: 'You enjoy it', skill: 'You can do it', care: 'You care about it', seek: 'You’re seeking it', offer: 'You’re offering it' };
  var editIx = -1, draft = null;
  function catLine(it){
    var c = (it.a.cat && it.a.cat.length) ? it.a.cat.join(', ') : it.cat;
    if (!c) return it.thing ? '' : 'Category: not sure yet';
    return (it.guess && !(it.a.cat && it.a.cat.length) ? 'Category, we think: ' : 'Category: ') + c;
  }
  function answered(it){ return needs(it).filter(function(k){ return k !== 'cat' && it.a[k] && it.a[k].length; }); }
  function sentence(it){
    var s = VERB[it.tag] || '';
    if (it.a.who && it.a.who.length) {
      var w = it.a.who.map(function(x){ return WHO[x] || x.toLowerCase(); });
      s += ' for ' + (w.length > 1 ? w.slice(0, -1).join(', ') + ' and ' + w[w.length - 1] : w[0]);
    }
    s += '.';
    var more = ['how', 'level', 'kind', 'lens', 'gives'].filter(function(k){ return it.a[k] && it.a[k].length; }).map(function(k){ return it.a[k].join(', '); });
    return more.length ? s + ' ' + more.join(' · ') + '.' : s;
  }
  function body(c, it, ix, miss){
    if (CARD === 'a') {
      var list = el('div', 'kvs');
      answered(it).forEach(function(k){ var r = el('div', 'kv'); r.appendChild(el('span', '', LAB[k])); r.appendChild(el('b', '', it.a[k].join(', '))); list.appendChild(r); });
      miss.filter(function(k){ return k !== 'cat'; }).forEach(function(k){ var r = el('div', 'kv miss'); r.appendChild(el('span', '', LAB[k])); var b = el('button', 'link', 'Add'); b.type = 'button'; b.addEventListener('click', function(){ openCard(ix); }); r.appendChild(b); list.appendChild(r); });
      if (miss.indexOf('cat') > -1) { var r2 = el('div', 'kv miss'); r2.appendChild(el('span', '', 'Category')); var b2 = el('button', 'link', 'Confirm'); b2.type = 'button'; b2.addEventListener('click', function(){ openCard(ix); }); r2.appendChild(b2); list.appendChild(r2); }
      if (list.children.length) c.appendChild(list);
    } else if (CARD === 'b') {
      var row = el('div', 'chips');
      answered(it).forEach(function(k){ it.a[k].forEach(function(v){ row.appendChild(el('span', 'chip', v)); }); });
      miss.forEach(function(k){ var b = el('button', 'chip add', '+ ' + SHORT[k]); b.type = 'button'; b.addEventListener('click', function(){ openCard(ix); }); row.appendChild(b); });
      if (row.children.length) c.appendChild(row);
    } else {
      c.appendChild(el('div', 'sum', sentence(it)));
      if (miss.length) {
        var f = el('button', 'foot-bar', 'Answer ' + miss.length + ' more ' + (miss.length === 1 ? 'question' : 'questions') + ' for a better match');
        f.type = 'button'; f.addEventListener('click', function(){ openCard(ix); }); c.appendChild(f);
      }
    }
  }

  function draw(){
    grid.innerHTML = '';
    document.documentElement.classList.toggle('ao-editing', editIx > -1);
    if (editIx > -1) { drawEdit(); return; }
    var done = 0;
    items.forEach(function(it, ix){
      var miss = missing(it), ok = !miss.length;
      if (ok) done++;
      var c = el('div', 'c ' + (ix === openIx ? 'open' : ok ? 'ok' : 'more'));
      var tr = el('div', 'tr');
      if (ix !== openIx) { var pen = el('button', 'pen', '✏️'); pen.type = 'button'; pen.title = 'Edit'; pen.addEventListener('click', function(){ startEdit(ix); }); tr.appendChild(pen); }
      if (ok) tr.appendChild(el('div', 'mark', '✓'));
      else if (ix !== openIx) tr.appendChild(el('div', 'flag', 'Add more'));
      c.appendChild(tr);
      c.appendChild(el('h3', '', it.word));
      var cl = catLine(it); if (cl) c.appendChild(el('div', 'cat', cl));
      c.appendChild(el('span', 'tag', TAG[it.tag]));
      if (it.det) c.appendChild(el('div', 'sum', 'Details: “' + it.det + '”'));
      if (ix === openIx) {
        var s0 = sentence(it); if (CARD === 'c') c.appendChild(el('div', 'sum', s0));
        drawQuestion(c, it);
      } else body(c, it, ix, miss);
      grid.appendChild(c);
    });
    document.getElementById('ao-band').textContent = 'Your answers (' + items.length + ')';
    document.getElementById('ao-count').textContent = done + ' of ' + items.length + ' complete';
    document.getElementById('ao-bar').style.width = (items.length ? Math.round(done * 100 / items.length) : 0) + '%';
    var left = items.length - done, rest = document.getElementById('ao-rest');
    rest.style.display = left ? '' : 'none';
    rest.textContent = 'Answer the rest now (' + left + ')';
  }

  function startEdit(ix){
    openIx = -1; restMode = false; editIx = ix;
    draft = JSON.parse(JSON.stringify(items[ix]));
    if (!draft.a.cat && draft.cat && !draft.thing && draft.tag !== 'care') draft.a.cat = [draft.cat];
    draw(); window.scrollTo(0, 0);
  }
  function pickRow(c, title, opts, cur, many, onPick){
    c.appendChild(el('div', 'eq', title));
    var row = el('div', 'row');
    opts.forEach(function(o){
      var val = o[0], lab = o[1];
      var b = el('button', 'pill' + (cur.indexOf(val) > -1 ? ' on' : ''), lab); b.type = 'button';
      b.addEventListener('click', function(){
        var at = cur.indexOf(val);
        if (many) { if (at > -1) cur.splice(at, 1); else cur.push(val); }
        else { cur.length = 0; cur.push(val); }
        onPick(cur.slice());
      });
      row.appendChild(b);
    });
    c.appendChild(row);
  }
  function drawEdit(){
    var it = draft;
    var c = el('div', 'c edit');
    c.appendChild(el('div', 'ehead', 'Editing'));
    c.appendChild(el('h3', '', it.word));
    var tagCur = [it.tag];
    pickRow(c, 'How does it fit you?', Object.keys(TAG).map(function(k){ return [k, TAG[k]]; }), tagCur, false, function(v){ it.tag = v[0]; draw(); });
    if (it.tag === 'care') {
      it.a.lens = it.a.lens || (it.cat ? [it.cat] : []);
      pickRow(c, Q.lens.q, Q.lens.opts.map(function(o){ return [o, o]; }), it.a.lens, true, function(){ draw(); });
    } else if (!it.thing) {
      it.a.cat = it.a.cat || [];
      pickRow(c, 'Category', CATS.map(function(o){ return [o, o]; }), it.a.cat, true, function(){ it.guess = false; draw(); });
    }
    needs(it).filter(function(k){ return k !== 'cat' && k !== 'lens'; }).forEach(function(k){
      it.a[k] = it.a[k] || [];
      pickRow(c, Q[k].q, Q[k].opts.map(function(o){ return [o, o]; }), it.a[k], !!Q[k].many, function(){ draw(); });
    });
    if (it.thing || it.det) {
      c.appendChild(el('div', 'eq', 'Details'));
      var ta = el('textarea', 'det'); ta.rows = 2; ta.value = it.det || '';
      ta.addEventListener('input', function(){ it.det = ta.value; });
      c.appendChild(ta);
    }
    var nav = el('div', 'qnav');
    var sv = el('button', 'btn', 'Save'); sv.type = 'button';
    sv.addEventListener('click', function(){
      if (draft.tag === 'care' && draft.a.lens && draft.a.lens.length) draft.cat = draft.a.lens[0];
      if (draft.tag !== 'care' && draft.a.cat && draft.a.cat.length) { draft.cat = draft.a.cat[0]; draft.guess = false; }
      items[editIx] = draft; editIx = -1; draft = null; draw();
    });
    var cn = el('button', 'link', 'Cancel'); cn.type = 'button';
    cn.addEventListener('click', function(){ editIx = -1; draft = null; draw(); });
    nav.appendChild(sv); nav.appendChild(cn);
    c.appendChild(nav);
    grid.appendChild(c);
  }

  var qs = [];
  function openCard(ix){
    openIx = ix; step = 0;
    qs = missing(items[ix]);
    draw();
    var c = grid.children[ix]; if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function drawQuestion(c, it){
    var k = qs[step], def = Q[k];
    if (k === 'cat' && !it.a.cat && it.cat) it.a.cat = [it.cat];
    var pick = (it.a[k] || []).slice();
    var h = el('div', 'qhead');
    h.appendChild(el('div', 'qq', def.q));
    h.appendChild(el('div', 'qcount', 'Question ' + (step + 1) + ' of ' + qs.length));
    c.appendChild(h);
    var row = el('div', 'row');
    def.opts.forEach(function(o){
      var b = el('button', 'pill' + (pick.indexOf(o) > -1 ? ' on' : ''), o); b.type = 'button';
      b.addEventListener('click', function(){
        if (def.many) {
          var at = pick.indexOf(o);
          if (at > -1) pick.splice(at, 1); else pick.push(o);
          b.className = 'pill' + (pick.indexOf(o) > -1 ? ' on' : '');
          it.a[k] = pick.slice();
        } else { it.a[k] = [o]; advance(); }
      });
      row.appendChild(b);
    });
    c.appendChild(row);
    var nav = el('div', 'qnav');
    if (def.many) {
      var nx = el('button', 'btn', step === qs.length - 1 ? 'Done' : 'Next'); nx.type = 'button';
      nx.addEventListener('click', function(){ if (!(it.a[k] && it.a[k].length)) return; advance(); });
      nav.appendChild(nx);
    }
    if (step > 0) { var bk = el('button', 'link', 'Back'); bk.type = 'button'; bk.addEventListener('click', function(){ step--; draw(); }); nav.appendChild(bk); }
    var later = el('button', 'link', 'Later'); later.type = 'button';
    later.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); });
    nav.appendChild(later);
    c.appendChild(nav);
  }
  var restMode = false;
  function advance(){
    if (step < qs.length - 1) { step++; draw(); return; }
    var was = openIx; openIx = -1;
    if (restMode) {
      for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { openCard(j); return; } }
      restMode = false;
    }
    draw();
  }

  document.getElementById('ao-rest').addEventListener('click', function(){
    for (var i = 0; i < items.length; i++) if (missing(items[i]).length) { restMode = true; openCard(i); return; }
  });
  document.getElementById('ao-go').addEventListener('click', function(){
    document.getElementById('ao-msg').textContent = 'This would open who and what fits you: people, events, groups and offers. That page is the next design.';
  });
  draw();
})();
</script>
<script src="https://2gather.network/nav/topbar.js?v=6.38" defer></script>
</body>
</html>
