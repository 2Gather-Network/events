  function flushSave(){ clearTimeout(_saveT); if (_saveMsg) { toParent(_saveMsg); _saveMsg = null; } }
  function finishEdit(){
    commitDraft(); flushSave();
    var was = editIx;
    editIx = -1; draft = null;
    if (restMode && was > -1) { for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { startEdit(j, true); return; } } restMode = false; onlyOpen = false; }
    draw();
  }
  var qs = [];
  function openCard(ix){
    if (ix > -1) { startEdit(ix, restMode); return; }
    openIx = ix; step = 0;
    qs = missing(items[ix]);
    draw();
    var c = grid.children[ix]; if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function drawQuestion(c, it){
    var k = qs[step], def = Q[k];
    if (k === 'cat' && !it.a.cat && it.cat) it.a.cat = [it.cat];
    var pick = (it.a[k] || []).slice();
    c.appendChild(el('div', 'rule'));
    if (k === 'who' || k === 'work' || k === 'cat' || k === 'with') {
      (k === 'with' ? withBlock : k === 'who' ? whoBlock : k === 'work' ? workBlock : tagBlock)(c, it, draw);
      var wn = el('div', 'qnav');
      var wd = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); wd.type = 'button';
      wd.addEventListener('click', function(){ if (k === 'work') it.a.workAsked = true; if (!(k === 'with' ? withDone(it) : k === 'who' ? whoDone(it) : k === 'cat' ? catDone(it) : workDone(it))) return; if (k === 'cat') it.guess = false; advance(); });
      wn.appendChild(wd);
      var wl = el('button', 'link', 'Later'); wl.type = 'button'; wl.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); }); wn.appendChild(wl);
      c.appendChild(wn);
      return;
    }
    var box = el('div', 'qbox');
    box.appendChild(el('div', 'qq', qText(k, it)));
    var row = el('div', 'row');
    def.opts.forEach(function(o){
      var b = el('button', 'pill' + (pick.indexOf(o) > -1 ? ' on' : ''), k === 'cat' ? catLab(o) : o); b.type = 'button';
      b.addEventListener('click', function(){
        if (def.many) {
          var at = pick.indexOf(o);
          if (at > -1) pick.splice(at, 1); else pick.push(o);
          b.className = 'pill' + (pick.indexOf(o) > -1 ? ' on' : '');
          it.a[k] = pick.slice();
        } else { it.a[k] = [o]; advance(); }
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    c.appendChild(box);
    var nav = el('div', 'qnav');
    if (def.many) {
      var nx = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); nx.type = 'button';
      nx.addEventListener('click', function(){ if (!(it.a[k] && it.a[k].length)) return; advance(); });
      nav.appendChild(nx);
    }
    var later = el('button', 'link', 'Later'); later.type = 'button';
    later.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); });
    nav.appendChild(later);
    c.appendChild(nav);
  }
  var restMode = false;
  function advance(){
    var still = missing(items[openIx]);
    if (still.length) { qs = still; step = 0; draw(); return; }
    var was = openIx; openIx = -1;
    if (restMode) {
      for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { openCard(j); return; } }
      restMode = false;
    }
    draw();
  }

  document.getElementById('ao-rest').addEventListener('click', function(){
    for (var i = 0; i < items.length; i++) if (missing(items[i]).length) { restMode = true; onlyOpen = true; openCard(i); return; }
  });
  document.getElementById('ao-all').addEventListener('click', function(){ onlyOpen = false; restMode = false; openIx = -1; draw(); });
  document.getElementById('ao-go').addEventListener('click', function(){
    document.getElementById('ao-msg').textContent = 'This would open who and what fits you: people, events, groups and offers. That page is the next design.';
  });
  draw();
  function startRest(){ told = true; onlyOpen = false; openIx = -1; restMode = false; document.getElementById('ao-rest').click(); }
  if (EMBED && !/[?&]wait=1\b/.test(location.search)) startRest();
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.ao === 'start') startRest();
    if (e.data.ao === 'wordSaved') {
      var wk = String(e.data.word || '').toLowerCase();
      wbBusy = false;
      wbMsg[wk] = e.data.ok ? { ok: true, text: e.data.added ? 'Added to the word table for everyone.' : 'Saved for everyone.' } : { ok: false, text: e.data.message || 'Not saved.' };
      if (e.data.ok) delete wbState[wk];
      if (editIx > -1) draw();
    }
    if (e.data.ao === 'items' && e.data.hand && editIx < 0) { var keep = {}; items.forEach(function(x){ keep[String(x.word).toLowerCase()] = x; }); items = fromHand(e.data.hand, keep); takeShared(); draw(); var ow = String(e.data.hand.openWord || '').toLowerCase(); if (ow) { for (var oi = 0; oi < items.length; oi++) { if (String(items[oi].word).toLowerCase() === ow) { startEdit(oi); break; } } } }
  });
  if (FITP) toParent({ ao: 'ready' });
  try { if (INPANE && window.ResizeObserver) new ResizeObserver(function(){ tellH(); }).observe(document.querySelector('.wrap')); } catch (e) {}
})();
</script>
