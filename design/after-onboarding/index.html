<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in mockup · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#4B5A6D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;--green:#2E9E5B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--blue);color:var(--ink);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px;}
  .panel{background:#fff;border-radius:16px;padding:26px 28px;}
  .note{background:#FFF4D6;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
  h1{font-size:26px;margin:0 0 4px;}
  .lede{color:var(--grey);font-size:14.5px;margin:0 0 16px;line-height:1.5;}
  .prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .bar{flex:1;height:10px;background:#E6ECF2;border-radius:6px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s;}
  .prog b{font-size:14px;white-space:nowrap;}
  .band{background:var(--blue);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:10px 10px 0 0;}
  .grid{border:1.5px solid var(--pale);border-top:0;border-radius:0 0 12px 12px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;}
  .c{border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;position:relative;background:#fff;}
  .c h3{margin:0 0 3px 0;font-size:16px;word-break:break-word;}
  .cat{font-size:12.5px;color:var(--grey);margin-bottom:8px;}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:12px;background:#E6F1FB;color:var(--blue);margin:0 4px 4px 0;text-transform:lowercase;}
  .sum{font-size:13px;color:#33475B;line-height:1.45;margin-top:4px;}
  .c.ok{border-color:var(--green);}
  .mark{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;text-align:center;line-height:24px;font-size:14px;}
  .c.more{border:1.5px dashed var(--blue);}
  .flag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--blue);background:#E6F1FB;padding:4px 8px;border-radius:12px;}
  .need{font-size:12.5px;color:var(--grey);margin:6px 0 8px;}
  .need span{display:inline-block;border:1px solid var(--pale);border-radius:12px;padding:2px 8px;margin:2px 3px 0 0;color:var(--blue);background:#fff;}
  .btn{font:inherit;display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:18px;border:0;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .c.open{grid-column:1 / -1;border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:18px 22px;}
  .qhead{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;}
  .qq{font-size:15px;font-weight:800;}
  .qcount{font-size:12px;color:var(--grey);font-weight:700;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pill{font:inherit;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;background:#fff;border:1px solid var(--pale);color:var(--blue);font-weight:600;}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .qnav{display:flex;gap:10px;margin-top:14px;align-items:center;}
  .link{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;}
  .foot .btn{font-size:15px;padding:11px 22px;}
  .msg{font-size:13.5px;color:var(--grey);margin-top:12px;}
  .tr{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;}
  .tr .mark,.tr .flag{position:static;}
  .pen{font:inherit;background:none;border:0;cursor:pointer;font-size:15px;padding:2px;line-height:1;}
  .c h3{margin-right:130px;}
  .c.ok h3{margin-right:60px;}
  .kvs{margin-top:8px;border-top:1px solid var(--line);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .kv span{color:var(--grey);}
  .kv b{font-weight:700;text-align:right;}
  .kv.miss span{color:var(--blue);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:14px;background:#EEF1F5;color:var(--ink);border:1px solid #EEF1F5;}
  .chip.add{background:#fff;border:1.5px dashed var(--blue);color:var(--blue);font-weight:700;cursor:pointer;}
  .foot-bar{font:inherit;display:block;width:calc(100% + 28px);margin:12px -14px -12px;padding:10px 14px;border:0;border-top:1px solid var(--pale);border-radius:0 0 11px 11px;background:#E6F1FB;color:var(--blue);font-weight:700;font-size:13px;text-align:left;cursor:pointer;}
  html.ao-editing .note,html.ao-editing h1,html.ao-editing .lede,html.ao-editing .prog,html.ao-editing .band,html.ao-editing .foot,html.ao-editing .msg,html.ao-editing .topbtns{display:none;}
  html.ao-editing .grid{border:0;padding:0;display:block;}
  .c.edit{border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:20px 24px;}
  .ehead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
  .eq{font-size:14.5px;font-weight:800;margin-top:18px;}
  .det{width:100%;margin-top:8px;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;}
  .c.open,.c.edit{background:var(--soft);border:1.5px solid var(--blue);box-shadow:none;border-radius:14px;padding:18px 22px;}
  .c.open h3,.c.edit h3{font-size:17px;}
  .pen.x{font-size:15px;color:var(--grey);}
  .rule{border-top:1px solid var(--line);margin:12px 0 4px;}
  .qhead{justify-content:flex-end;}
  .qbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;}
  .qbox .qq{font-size:13px;font-weight:700;color:var(--ink);}
  .qbox .row{margin-top:8px;}
  .qq.sub{margin-top:14px;}
  .pill.other{border:1.5px solid var(--blue);font-weight:700;}
  .oline{display:flex;gap:8px;margin-top:8px;max-width:420px;}
  .oinp{flex:1;min-width:0;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);}
  .topbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .topbtns .btn{font-size:14px;padding:9px 18px;}
  .topbtns:empty{display:none;}
  .tabs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
  .tabs-lab{font-size:13px;font-weight:700;color:var(--grey);margin-right:4px;}
  .tab{font:inherit;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 12px 7px 14px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:3px solid transparent;background:#fff;color:var(--blue);cursor:pointer;}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 0 var(--blue);}
  .tab.on .tdone{background:#fff;color:var(--green);}
  .tab.on .tleft{background:#fff;color:var(--blue);}
  .tabpanel{border:2px solid var(--blue);border-radius:0 12px 12px 12px;padding:4px 12px 12px;background:#fff;margin-top:-1px;}
  .tabpanel-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:8px 0 0;}
  .tabpanel .qbox{border-color:var(--line);}
  .tleft{min-width:20px;height:20px;border-radius:10px;background:var(--blue);color:#fff;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
  .tdone{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;}
  .wait{font-size:13px;color:var(--grey);align-self:center;}
  .qhead2{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .btn.small{font-size:12.5px;padding:6px 14px;}
  .opanel{background:var(--soft);border:1px solid var(--pale);border-radius:10px;padding:10px 12px;margin-top:8px;max-width:560px;}
  .opanel .oinp{width:100%;}
  .glab.plain{text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px;}
  .glab.plain::after{display:none;}
  .glab{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:16px 0 0;}
  .glab::after{content:'';flex:1;height:1px;background:var(--pale);}
  html.ao-embed body{background:#fff;}
  html.ao-embed .wrap{padding:0;max-width:none;}
  html.ao-embed .panel{padding:4px;border-radius:0;}
  html.ao-embed .note,html.ao-embed h1,html.ao-embed .lede,html.ao-embed .prog,html.ao-embed .band,html.ao-embed .foot,html.ao-embed .msg,html.ao-embed .topbtns{display:none;}
  html.ao-embed .grid{border:0;padding:0;}
  @media(max-width:768px){.panel{padding:20px 16px;}.grid{grid-template-columns:1fr;}h1{font-size:22px;}}
  @media(min-width:769px) and (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="note">Look-only mockup. Nothing here saves.</div>
    <h1>You're in. Here's what we heard.</h1>
    <p class="lede">A green check means we have everything for that one. The rest are optional: a quick answer or two gets you better matches.</p>
    <div class="prog"><div class="bar"><i id="ao-bar"></i></div><b id="ao-count"></b></div>
    <div class="topbtns"><button class="btn" type="button" id="ao-rest"></button><button class="btn ghost" type="button" id="ao-all">Show all answers</button></div>
    <div class="band" id="ao-band"></div>
    <div class="grid" id="ao-grid"></div>
    <div class="foot">
      <button class="btn" type="button" id="ao-go">See who and what fits me</button>
    </div>
    <div class="msg" id="ao-msg"></div>
  </div>
</div>
<script>
(function(){
  var CATS = ['Food & Drink','Movement','Play','Travel','Community & Culture','Arts','Outdoors','Home Life','Animals','Technology','Style','Personal Care','Faith','Business','Communications','Building & Repurposing','Transportation','Finance','Science','Medicine'];
  var EMO = {}, SKILLSET = {};
  function tagQ(it){ return 'Tag ' + String(it.word).replace(/^[^A-Za-z0-9]+/, '').trim() + ':'; }
  function catLab(c){ return EMO[c] ? EMO[c] + ' ' + c : c; }
  fetch('https://cw-api-gate.jessieupp.workers.dev?action=getReferenceData')
    .then(function(r){ return r.json(); })
    .then(function(rd){ (rd && rd.topicCategories || []).forEach(function(t){ if (t && t.label) EMO[t.label] = t.emoji || ''; }); (rd && rd.skills || []).forEach(function(x){ if (x && x.item) SKILLSET[String(x.item).trim().toLowerCase()] = 1; }); items.forEach(function(x){ x.kAuto = false; }); var RDK = ['whoSeason', 'whoHousehold', 'whoWorkStage', 'whoAccommodation']; RDK.forEach(function(k, gi){ var l = rd && rd[k]; if (Array.isArray(l) && l.length && SERVE_GROUPS[gi]) SERVE_GROUPS[gi][1] = l.map(String); }); ECO = (rd && rd.values || []).filter(function(v){ return v && String(v.category || '').trim().toLowerCase() === 'ecological'; }).map(function(v){ return String(v.item).trim(); }).filter(Boolean); draw(); })
    .catch(function(){});
  var Q = {
    how:   { q: 'How is this of interest to you?', opts: ['Fan', 'I do it myself'], many: true },
    who:   { q: 'Is it for yourself, or in service to someone or something else?', opts: ['Tending to self', 'People', 'Other'], many: true },
    level: { q: 'What is your level?', opts: ['Beginner', 'Experienced', 'Guide'] },
    gives: { q: 'What would it give you? Tag how this nourishes you.', opts: ['Create', 'Connect', 'Eat & Drink', 'Move', 'Play', 'Survive', 'Rest'], many: true },
    kind:  { q: 'Is it a skill, a thing or a space?', opts: ['Skill', 'Thing', 'Space'] },
    lens:  { q: 'Is it social or ecological?', opts: ['Social', 'Ecological'], many: true },
    cat:   { q: 'Tags:', opts: CATS, many: true }
  };
  var SHORT = { with: 'Solo or with others?', how: 'Fan or I do it?', who: 'In service to', level: 'Your level', gives: 'What would it give you?', kind: 'Skill, thing or space?', work: 'Open to work?', lens: 'Social or ecological?', cat: 'Tags' };
  var FIT = { enjoy: 'I enjoy it', skill: 'I can do it', care: 'I care about it', seek: 'I\u2019m seeking it', offer: 'I can offer it' };
  var TAG = { enjoy: 'joy', skill: 'skill', care: 'care', seek: 'seeking', offer: 'offering' };

  var SAMPLE = [
    { word: 'Clean Air', tags: ['care'], cat: 'Ecological', a: { who: ['In service to another'], serveWhat: ['People', 'Other'] } },
    { word: 'Accountant', tags: ['skill', 'offer'], cat: 'Finance', a: { level: ['Experienced'], paid: ['Part-time'], unpaidKind: ['Mentor'], who: ['In service to another'], serveWhat: ['People'], serveWho: ['Early career'] } },
    { word: 'Cooking', tags: ['enjoy'], cat: 'Food & Drink', a: {} },
    { word: 'Karaoke', tags: ['enjoy'], cat: 'Arts', a: { how: ['I do it myself'], enjoyWith: ['With others'], enjoyWho: ['Adults'] } },
    { word: 'Career mentor', tags: ['seek'], cat: 'Business', a: { who: ['Tending to self'] } },
    { word: '\u{1F4E6} Physical goods', tags: ['seek'], cat: '', thing: true, a: { gives: ['Move'], who: ['In service to another'], serveWhat: ['People'], serveWho: ['Kids'] }, det: 'a used bike for my daughter' },
    { word: '\u{1F372} Sourdough starter', tags: ['offer'], cat: 'Food & Drink', a: { kind: ['Thing'], who: ['In service to another'], serveWhat: ['People'] } },
    { word: 'Pickleball', tags: ['enjoy'], cat: 'Play', guess: true, a: {} }
  ];

  function isSkill(it){ return has(it, 'skill') || (it.a.kind || []).indexOf('Skill') > -1 || !!SKILLSET[String(it.word).replace(/^[^A-Za-z0-9]+/, '').trim().toLowerCase()]; }
  function has(it, t){ return (it.tags || []).indexOf(t) > -1; }
  function tagNeeds(it, t){
    if (t === 'enjoy') return isSkill(it) ? ['how'] : ['how', 'with'];
    if (t === 'skill') return ['level'];
    if (t === 'care') return ['who'];
    if (t === 'seek') return ['gives'];
    if (t === 'offer') return ((it.a.kind || []).indexOf('Skill') > -1 ? ['work'] : []).concat(['who']);
    return [];
  }
  function needs(it){
    var n = [], other = (it.tags || []).some(function(t){ return t !== 'care'; });
    if (has(it, 'enjoy')) n.push('how');
    if (has(it, 'skill')) n.push('level');
    if (has(it, 'seek')) n.push('gives');
    if (has(it, 'offer') && (it.a.kind || []).indexOf('Skill') > -1) n.push('work');
    if (has(it, 'care') && !other && !it.cat) n.push('lens');
    if ((other && !it.thing && (!it.cat || it.guess)) || (has(it, 'offer') && !it.thing)) n.push('cat');
    if (has(it, 'enjoy') && !isSkill(it)) n.push('with');
    if (has(it, 'care') || has(it, 'offer')) n.push('who');
    return n;
  }
  function wq(it){ return '\u201C' + String(it.word).replace(/^[^A-Za-z0-9]+/, '').trim().toLowerCase() + '\u201D'; }
  function qText(k, it){
    var w = wq(it);
    if (k === 'how') return 'How is ' + w + ' of interest to you?';
    if (k === 'gives') return 'What would ' + w + ' give you? Tag how this nourishes you.';
    if (k === 'kind') return 'Is ' + w + ' a skill, a thing or a space?';
    if (k === 'cat' || k === 'lens') return tagQ(it);
    return Q[k].q;
  }

  var PAID = ['Full-time', 'Part-time', 'One-time'];
  var UNPAID = ['Mentor', 'Advisor', 'Board member', 'Tutor', 'Volunteer', 'Intern', 'Job shadowing'];
  function workDone(it){ return !!it.a.workAsked || (it.a.paid || []).length > 0 || (it.a.unpaidTime || []).length > 0 || (it.a.unpaidKind || []).length > 0; }
  function workRows(it){
    var r = [], u = (it.a.unpaidTime || []).concat(it.a.unpaidKind || []);
    if ((it.a.paid || []).length) r.push(['Paid work', it.a.paid.join(', ')]);
    if (u.length) r.push(['Unpaid work', u.join(', ')]);
    if (!r.length && workDone(it)) r.push(['Open to work', 'Not right now']);
    return r;
  }
  function workParts(it){ return workRows(it).map(function(x){ return x[0] === 'Open to work' ? x[1] : x[0] + ': ' + x[1]; }); }
  function workBlock(c, it, redraw){
    ['paid', 'unpaidTime', 'unpaidKind'].forEach(function(k){ it.a[k] = it.a[k] || []; });
    var pb = el('div', 'qbox'); pb.appendChild(el('div', 'qq', 'Are you open to paid work for ' + wq(it) + '? Pick as many as fit, or none.'));
    var r1 = el('div', 'row'); pb.appendChild(r1); c.appendChild(pb);
    chipsInto(r1, PAID, it.a.paid, false, null, redraw);
    var ub = el('div', 'qbox'); ub.appendChild(el('div', 'qq', 'Are you open to unpaid work for ' + wq(it) + '? Pick as many as fit, or none.'));
    var r2 = el('div', 'row'); ub.appendChild(r2);
    chipsInto(r2, PAID, it.a.unpaidTime, false, null, redraw);
    ub.appendChild(el('div', 'qq sub', 'Which types of unpaid work?'));
    var r3 = el('div', 'row'); ub.appendChild(r3); c.appendChild(ub);
    chipsInto(r3, UNPAID, it.a.unpaidKind, false, null, redraw, true);
  }
  function serves(it){ return has(it, 'offer') || has(it, 'skill'); }
  function withDone(it){ return (it.a.enjoyWith || []).length > 0; }
  function withParts(it){ return (it.a.enjoyWith || []).map(function(x){ return x === 'With others' && (it.a.enjoyWho || []).length ? 'With others (' + it.a.enjoyWho.join(', ') + ')' : x; }); }
  function withBlock(c, it, redraw){
    it.a.enjoyWith = it.a.enjoyWith || []; it.a.enjoyWho = it.a.enjoyWho || [];
    var b = el('div', 'qbox');
    b.appendChild(el('div', 'qq', 'Do you enjoy ' + wq(it) + ' solo or with others? Pick one or both.'));
    var r = el('div', 'row'); b.appendChild(r);
    chipsInto(r, ['Solo', 'With others'], it.a.enjoyWith, false, function(){ if (it.a.enjoyWith.indexOf('With others') < 0) it.a.enjoyWho.length = 0; }, redraw);
    if (it.a.enjoyWith.indexOf('With others') > -1) {
      b.appendChild(el('div', 'qq sub', 'Who with? Pick any that fit, or none for anyone.'));
      SERVE_GROUPS.slice(0, 3).forEach(function(g){
        b.appendChild(el('div', 'glab', g[0]));
        var rr = el('div', 'row'); b.appendChild(rr);
        chipsInto(rr, g[1], it.a.enjoyWho, false, null, redraw);
      });
    }
    c.appendChild(b);
  }
  function whoDone(it){ if (serves(it)) return (it.a.serveWhat || []).length > 0; var w = it.a.who || []; return w.length > 0 && (w.indexOf('In service to another') < 0 || (it.a.serveWhat || []).length > 0); }
  function catDone(it){
    var other = (it.tags || []).some(function(t){ return t !== 'care'; });
    var catOk = !(other && !it.thing && (!it.cat || it.guess)) || (it.a.cat || []).length > 0;
    var kindOk = !(has(it, 'offer') && !it.thing) || (it.a.kind || []).length > 0;
    return catOk && kindOk;
  }
  function tagBlock(c, it, redraw){
    var b = el('div', 'qbox'); b.appendChild(el('div', 'qq', tagQ(it)));
    var other = (it.tags || []).some(function(t){ return t !== 'care'; });
    if (has(it, 'offer') && !it.thing) {
      it.a.kind = it.a.kind || [];
      var rk = el('div', 'row'); b.appendChild(rk);
      chipsInto(rk, ['Skill', 'Thing', 'Space'], it.a.kind, true, null, redraw);
    }
    if (!other) {
      it.a.lens = it.a.lens || (it.cat ? [it.cat] : []);
      var rl = el('div', 'row'); b.appendChild(rl);
      chipsInto(rl, ['Social', 'Ecological'], it.a.lens, false, null, redraw);
    } else if (!it.thing) {
      if (!it.a.cat && it.cat) it.a.cat = [it.cat];
      it.a.cat = it.a.cat || [];
      var rc = el('div', 'row'); b.appendChild(rc);
      CATS.forEach(function(o){
        var p = el('button', 'pill' + (it.a.cat.indexOf(o) > -1 ? ' on' : ''), catLab(o)); p.type = 'button';
        p.addEventListener('click', function(){ var at = it.a.cat.indexOf(o); if (at > -1) it.a.cat.splice(at, 1); else it.a.cat.push(o); it.guess = false; if (it.gAutoSet) it.a.gives = []; it.gAuto = false; redraw(); });
        rc.appendChild(p);
      });
    }
    c.appendChild(b);

          if (at > -1) pick.splice(at, 1); else pick.push(o);
          b.className = 'pill' + (pick.indexOf(o) > -1 ? ' on' : '');
          it.a[k] = pick.slice();
        } else { it.a[k] = [o]; advance(); }
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    c.appendChild(box);
    var nav = el('div', 'qnav');
    if (def.many) {
      var nx = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); nx.type = 'button';
      nx.addEventListener('click', function(){ if (!(it.a[k] && it.a[k].length)) return; advance(); });
      nav.appendChild(nx);
    }
    var later = el('button', 'link', 'Later'); later.type = 'button';
    later.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); });
    nav.appendChild(later);
    c.appendChild(nav);
  }
  var restMode = false;
  function advance(){
    var still = missing(items[openIx]);
    if (still.length) { qs = still; step = 0; draw(); return; }
    var was = openIx; openIx = -1;
    if (restMode) {
      for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { openCard(j); return; } }
      restMode = false;
    }
    draw();
  }

  document.getElementById('ao-rest').addEventListener('click', function(){
    for (var i = 0; i < items.length; i++) if (missing(items[i]).length) { restMode = true; onlyOpen = true; openCard(i); return; }
  });
  document.getElementById('ao-all').addEventListener('click', function(){ onlyOpen = false; restMode = false; openIx = -1; draw(); });
  document.getElementById('ao-go').addEventListener('click', function(){
    document.getElementById('ao-msg').textContent = 'This would open who and what fits you: people, events, groups and offers. That page is the next design.';
  });
  draw();
  if (EMBED) { told = true; document.getElementById('ao-rest').click(); }
})();
</script>
