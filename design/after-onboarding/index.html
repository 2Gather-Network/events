<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in mockup · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#4B5A6D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;--green:#2E9E5B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--blue);color:var(--ink);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px;}
  .panel{background:#fff;border-radius:16px;padding:26px 28px;}
  .note{background:#FFF4D6;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
  h1{font-size:26px;margin:0 0 4px;}
  .lede{color:var(--grey);font-size:14.5px;margin:0 0 16px;line-height:1.5;}
  .prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .bar{flex:1;height:10px;background:#E6ECF2;border-radius:6px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s;}
  .prog b{font-size:14px;white-space:nowrap;}
  .band{background:var(--blue);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:10px 10px 0 0;}
  .grid{border:1.5px solid var(--pale);border-top:0;border-radius:0 0 12px 12px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;}
  .c{border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;position:relative;background:#fff;}
  .c h3{margin:0 0 3px 0;font-size:16px;word-break:break-word;}
  .cat{font-size:12.5px;color:var(--grey);margin-bottom:8px;}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:12px;background:#E6F1FB;color:var(--blue);margin:0 4px 4px 0;text-transform:lowercase;}
  .sum{font-size:13px;color:#33475B;line-height:1.45;margin-top:4px;}
  .c.ok{border-color:var(--green);}
  .mark{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;text-align:center;line-height:24px;font-size:14px;}
  .c.more{border:1.5px dashed var(--blue);}
  .flag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--blue);background:#E6F1FB;padding:4px 8px;border-radius:12px;}
  .need{font-size:12.5px;color:var(--grey);margin:6px 0 8px;}
  .need span{display:inline-block;border:1px solid var(--pale);border-radius:12px;padding:2px 8px;margin:2px 3px 0 0;color:var(--blue);background:#fff;}
  .btn{font:inherit;display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:18px;border:0;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .c.open{grid-column:1 / -1;border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:18px 22px;}
  .qhead{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;}
  .qq{font-size:15px;font-weight:800;}
  .qcount{font-size:12px;color:var(--grey);font-weight:700;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pill{font:inherit;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;background:#fff;border:1px solid var(--pale);color:var(--blue);font-weight:600;}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .qnav{display:flex;gap:10px;margin-top:14px;align-items:center;}
  .link{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;}
  .foot .btn{font-size:15px;padding:11px 22px;}
  .msg{font-size:13.5px;color:var(--grey);margin-top:12px;}
  .tr{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;}
  .tr .mark,.tr .flag{position:static;}
  .pen{font:inherit;background:none;border:0;cursor:pointer;font-size:15px;padding:2px;line-height:1;}
  .c h3{margin-right:130px;}
  .c.ok h3{margin-right:60px;}
  .kvs{margin-top:8px;border-top:1px solid var(--line);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .kv span{color:var(--grey);}
  .kv b{font-weight:700;text-align:right;}
  .kv.miss span{color:var(--blue);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:14px;background:#EEF1F5;color:var(--ink);border:1px solid #EEF1F5;}
  .chip.add{background:#fff;border:1.5px dashed var(--blue);color:var(--blue);font-weight:700;cursor:pointer;}
  .foot-bar{font:inherit;display:block;width:calc(100% + 28px);margin:12px -14px -12px;padding:10px 14px;border:0;border-top:1px solid var(--pale);border-radius:0 0 11px 11px;background:#E6F1FB;color:var(--blue);font-weight:700;font-size:13px;text-align:left;cursor:pointer;}
  html.ao-editing .note,html.ao-editing h1,html.ao-editing .lede,html.ao-editing .prog,html.ao-editing .band,html.ao-editing .foot,html.ao-editing .msg{display:none;}
  html.ao-editing .grid{border:0;padding:0;display:block;}
  .c.edit{border:1.5px solid var(--blue);box-shadow:0 0 0 1px var(--blue);padding:20px 24px;}
  .ehead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
  .eq{font-size:14.5px;font-weight:800;margin-top:18px;}
  .det{width:100%;margin-top:8px;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;}
  .c.open,.c.edit{background:var(--soft);border:1.5px solid var(--blue);box-shadow:none;border-radius:14px;padding:18px 22px;}
  .c.open h3,.c.edit h3{font-size:17px;}
  .pen.x{font-size:15px;color:var(--grey);}
  .rule{border-top:1px solid var(--line);margin:12px 0 4px;}
  .qhead{justify-content:flex-end;}
  .qbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;}
  .qbox .qq{font-size:13px;font-weight:700;color:var(--ink);}
  .qbox .row{margin-top:8px;}
  .qq.sub{margin-top:14px;}
  .pill.other{border:1.5px solid var(--blue);font-weight:700;}
  .oline{display:flex;gap:8px;margin-top:8px;max-width:420px;}
  .oinp{flex:1;min-width:0;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);}
  .glab{font-size:12px;font-weight:700;color:var(--grey);margin:10px 0 0;}
  html.ao-embed body{background:#fff;}
  html.ao-embed .wrap{padding:0;max-width:none;}
  html.ao-embed .panel{padding:4px;border-radius:0;}
  html.ao-embed .note,html.ao-embed h1,html.ao-embed .lede,html.ao-embed .prog,html.ao-embed .band,html.ao-embed .foot,html.ao-embed .msg{display:none;}
  html.ao-embed .grid{border:0;padding:0;}
  @media(max-width:768px){.panel{padding:20px 16px;}.grid{grid-template-columns:1fr;}h1{font-size:22px;}}
  @media(min-width:769px) and (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="note">Look-only mockup. Nothing here saves.</div>
    <h1>You're in. Here's what we heard.</h1>
    <p class="lede">A green check means we have everything for that one. The rest are optional: a quick answer or two gets you better matches.</p>
    <div class="prog"><div class="bar"><i id="ao-bar"></i></div><b id="ao-count"></b></div>
    <div class="band" id="ao-band"></div>
    <div class="grid" id="ao-grid"></div>
    <div class="foot">
      <button class="btn" type="button" id="ao-go">See who and what fits me</button>
      <button class="btn ghost" type="button" id="ao-rest"></button>
    </div>
    <div class="msg" id="ao-msg"></div>
  </div>
</div>
<script>
(function(){
  var CATS = ['Food & Drink','Movement','Play','Travel','Community & Culture','Arts','Outdoors','Home Life','Animals','Technology','Style','Personal Care','Faith','Business','Communications','Building & Repurposing','Transportation','Finance','Science','Medicine'];
  var EMO = {};
  function tagQ(it){ return 'Tag ' + String(it.word).replace(/^[^A-Za-z0-9]+/, '').trim() + ':'; }
  function catLab(c){ return EMO[c] ? EMO[c] + ' ' + c : c; }
  fetch('https://cw-api-gate.jessieupp.workers.dev?action=getReferenceData')
    .then(function(r){ return r.json(); })
    .then(function(rd){ (rd && rd.topicCategories || []).forEach(function(t){ if (t && t.label) EMO[t.label] = t.emoji || ''; }); draw(); })
    .catch(function(){});
  var Q = {
    how:   { q: 'How is this of interest to you?', opts: ['Fan', 'I do it'], many: true },
    who:   { q: 'Is it for yourself, or in service to someone or something else?', opts: ['Tending to self', 'People', 'Nature'], many: true },
    level: { q: 'What is your level?', opts: ['Beginner', 'Experienced', 'Guide'] },
    gives: { q: 'What would it give you? Tag how this nourishes you.', opts: ['Create', 'Connect', 'Eat & Drink', 'Move', 'Play', 'Survive', 'Rest'], many: true },
    kind:  { q: 'Is it a skill, a thing or a space?', opts: ['Skill', 'Thing', 'Space'] },
    lens:  { q: 'Is it social or ecological?', opts: ['Social', 'Ecological'], many: true },
    cat:   { q: 'Tags:', opts: CATS, many: true }
  };
  var SHORT = { how: 'Fan or I do it?', who: 'In service to', level: 'Your level', gives: 'What would it give you?', kind: 'Skill, thing or space?', work: 'Open to work?', lens: 'Social or ecological?', cat: 'Tags' };
  var FIT = { enjoy: 'I enjoy it', skill: 'I can do it', care: 'I care about it', seek: 'I\u2019m seeking it', offer: 'I can offer it' };
  var TAG = { enjoy: 'joy', skill: 'skill', care: 'care', seek: 'seeking', offer: 'offering' };

  var SAMPLE = [
    { word: 'Clean Air', tag: 'care', cat: 'Ecological', a: { who: ['In service to another'], serveWhat: ['People', 'Nature'] } },
    { word: 'Accountant', tag: 'skill', cat: 'Finance', a: { level: ['Experienced'], paid: ['Part-time'], unpaidKind: ['Mentor'], who: ['In service to another'], serveWhat: ['People'], serveWho: ['Early career'] } },
    { word: 'Cooking', tag: 'enjoy', cat: 'Food & Drink', a: {} },
    { word: 'Karaoke', tag: 'enjoy', cat: 'Arts', a: { how: ['I do it'], who: ['Tending to self'] } },
    { word: 'Career mentor', tag: 'seek', cat: 'Business', a: { who: ['Tending to self'] } },
    { word: '\u{1F4E6} Physical goods', tag: 'seek', cat: '', thing: true, a: { gives: ['Move'], who: ['In service to another'], serveWhat: ['People'], serveWho: ['Kids'] }, det: 'a used bike for my daughter' },
    { word: '\u{1F372} Sourdough starter', tag: 'offer', cat: 'Food & Drink', a: { kind: ['Thing'], who: ['In service to another'], serveWhat: ['People'] } },
    { word: 'Pickleball', tag: 'enjoy', cat: 'Play', guess: true, a: {} }
  ];

  function needs(it){
    var n = [];
    if (it.tag === 'enjoy') n.push('how');
    if (it.tag === 'skill') n.push('level');
    if (it.tag === 'seek') n.push('gives');
    if (it.tag === 'offer' && !it.thing) n.push('kind');
    if (it.tag === 'skill' || (it.tag === 'offer' && (it.a.kind || []).indexOf('Skill') > -1)) n.push('work');
    if (it.tag === 'care' && !it.cat) n.push('lens');
    if (it.tag !== 'care' && !it.thing && (!it.cat || it.guess)) n.push('cat');
    n.push('who');
    return n;
  }
  var PAID = ['Full-time', 'Part-time', 'One-time'];
  var UNPAID = ['Mentor', 'Advisor', 'Board member', 'Tutor', 'Volunteer', 'Intern', 'Job shadowing'];
  function workDone(it){ return !!it.a.workAsked || (it.a.paid || []).length > 0 || (it.a.unpaidTime || []).length > 0 || (it.a.unpaidKind || []).length > 0; }
  function workRows(it){
    var r = [], u = (it.a.unpaidTime || []).concat(it.a.unpaidKind || []);
    if ((it.a.paid || []).length) r.push(['Paid work', it.a.paid.join(', ')]);
    if (u.length) r.push(['Unpaid work', u.join(', ')]);
    if (!r.length && workDone(it)) r.push(['Open to work', 'Not right now']);
    return r;
  }
  function workParts(it){ return workRows(it).map(function(x){ return x[0] === 'Open to work' ? x[1] : x[0] + ': ' + x[1]; }); }
  function workBlock(c, it, redraw){
    ['paid', 'unpaidTime', 'unpaidKind'].forEach(function(k){ it.a[k] = it.a[k] || []; });
    var pb = el('div', 'qbox'); pb.appendChild(el('div', 'qq', 'Are you open to paid work for this? Pick as many as fit, or none.'));
    var r1 = el('div', 'row'); pb.appendChild(r1); c.appendChild(pb);
    chipsInto(r1, PAID, it.a.paid, false, null, redraw);
    var ub = el('div', 'qbox'); ub.appendChild(el('div', 'qq', 'Are you open to unpaid work for this? Pick as many as fit, or none.'));
    var r2 = el('div', 'row'); ub.appendChild(r2);
    chipsInto(r2, PAID, it.a.unpaidTime, false, null, redraw);
    ub.appendChild(el('div', 'qq sub', 'Which types of unpaid work?'));
    var r3 = el('div', 'row'); ub.appendChild(r3); c.appendChild(ub);
    chipsInto(r3, UNPAID, it.a.unpaidKind, false, null, redraw, true);
  }
  function whoDone(it){ var w = it.a.who || []; return w.length > 0 && (w.indexOf('In service to another') < 0 || (it.a.serveWhat || []).length > 0); }
  function missing(it){ return needs(it).filter(function(k){ return k === 'who' ? !whoDone(it) : k === 'work' ? !workDone(it) : !(it.a[k] && it.a[k].length); }); }
  var SERVE_GROUPS = [['By life stage', ['Babies', 'Toddlers', 'Kids', 'Teens', 'Young adults', 'Adults', 'Seniors']], ['By household', ['Singles', 'Families', 'Parents', 'Couples', 'Caregivers', 'Transplants']], ['By career stage', ['Students', 'Early career', 'Mid-career', 'Professionals', 'Senior professionals', 'Pre-retired', 'Retired']]];
  function whoParts(it){
    var out = [];
    if ((it.a.who || []).indexOf('Tending to self') > -1) out.push('Tending to self');
    (it.a.serveWhat || []).forEach(function(x){ out.push(x === 'People' && (it.a.serveWho || []).length ? 'People (' + it.a.serveWho.join(', ') + ')' : x); });
    return out;
  }
  function otherPill(row, list, redraw){
    var o = el('button', 'pill other', '+ Other'); o.type = 'button';
    o.addEventListener('click', function(){
      var line = el('div', 'oline');
      var inp = el('input', 'oinp'); inp.type = 'text'; inp.placeholder = 'Type your own';
      var add = el('button', 'btn', 'Add'); add.type = 'button';
      var go = function(){ var v = String(inp.value || '').trim(); if (v && list.indexOf(v) < 0) list.push(v); redraw(); };
      add.addEventListener('click', go);
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); go(); } });
      line.appendChild(inp); line.appendChild(add);
      row.parentNode.insertBefore(line, row.nextSibling);
      o.style.display = 'none';
      setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 0);
    });
    row.appendChild(o);
  }
  function chipsInto(row, opts, list, one, after, redraw, other){
    var all = opts.slice();
    if (other) list.forEach(function(v){ if (all.indexOf(v) < 0) all.push(v); });
    all.forEach(function(o){
      var p = el('button', 'pill' + (list.indexOf(o) > -1 ? ' on' : ''), o); p.type = 'button';
      p.addEventListener('click', function(){ var at = list.indexOf(o); if (one) { list.length = 0; list.push(o); } else if (at > -1) list.splice(at, 1); else list.push(o); if (after) after(); redraw(); });
      row.appendChild(p);
    });
    if (other) otherPill(row, list, redraw);
  }
  function whoBlock(c, it, redraw){
    it.a.who = it.a.who || []; it.a.serveWhat = it.a.serveWhat || []; it.a.serveWho = it.a.serveWho || [];
    var b = el('div', 'qbox');
    var word = String(it.word).replace(/^[^A-Za-z0-9]+/, '').trim().toLowerCase();
    b.appendChild(el('div', 'qq', 'Is “' + word + '” helping tend to yourself and/or in service to someone/something else? Pick one or both.'));
    var r1 = el('div', 'row'); b.appendChild(r1);
    chipsInto(r1, ['Tending to self', 'In service to another'], it.a.who, false, function(){ if (it.a.who.indexOf('In service to another') < 0) { it.a.serveWhat.length = 0; it.a.serveWho.length = 0; } }, redraw);
    if (it.a.who.indexOf('In service to another') > -1) {
      b.appendChild(el('div', 'qq sub', 'In service to who or what?'));
      var r2 = el('div', 'row'); b.appendChild(r2);
      chipsInto(r2, ['People', 'Nature'], it.a.serveWhat, false, function(){ if (it.a.serveWhat.indexOf('People') < 0) it.a.serveWho.length = 0; }, redraw, true);
      if (it.a.serveWhat.indexOf('People') > -1) {
        b.appendChild(el('div', 'qq sub', 'Which people? Pick any that fit, or none for anyone.'));
        var known = [];
        SERVE_GROUPS.forEach(function(g){
          b.appendChild(el('div', 'glab', g[0]));
          var r3 = el('div', 'row'); b.appendChild(r3);
          chipsInto(r3, g[1], it.a.serveWho, false, null, redraw);
          known = known.concat(g[1]);
        });
        var extra = it.a.serveWho.filter(function(v){ return known.indexOf(v) < 0; });
        var r4 = el('div', 'row'); b.appendChild(r4);
        chipsInto(r4, extra, it.a.serveWho, false, null, redraw);
        otherPill(r4, it.a.serveWho, redraw);
      }
    }
    c.appendChild(b);
  }

  var items = [];
  var fromOne = /[?&]from=onepage/.test(location.search), hand = null;
  if (fromOne) { try { hand = JSON.parse(sessionStorage.getItem('if-handoff') || 'null'); } catch (e) {} }
  if (hand) {
    var tags = hand.tags || {};
    var split = function(s){ return String(s || '').split(/[,\n;]+/).map(function(x){ return x.trim(); }).filter(Boolean); };
    [['introEnjoy', 'enjoy'], ['introValues', 'care'], ['introSkills', 'skill'], ['introOffer', 'offer'], ['introNeed', 'seek']].forEach(function(p){
      var t = tags[p[0]] || {};
      split(hand[p[0]]).forEach(function(w){
        var cat = t[w] || '';
        if (p[1] === 'care' && !/^(social|ecological)$/i.test(cat)) cat = '';
        if (p[1] !== 'care' && CATS.indexOf(cat) === -1) cat = '';
        items.push({ word: w, tag: p[1], cat: cat, a: {} });
      });
    });
    [['offerThings', 'offer', 'offerDetails'], ['seekThings', 'seek', 'seekDetails']].forEach(function(p){
      (hand[p[0]] || []).forEach(function(w){ items.push({ word: w, tag: p[1], cat: '', thing: true, det: hand[p[2]] || '', a: {} }); });
    });
  }
  if (!items.length) items = SAMPLE;

  var grid = document.getElementById('ao-grid');
  var openIx = -1, step = 0;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  var CARD = (location.search.match(/[?&]card=([abc])\b/) || [])[1] || 'a';
  document.documentElement.classList.add('card-' + CARD);
  var LAB = { work: 'Open to work', how: 'Interest', who: 'In service to', level: 'Level', gives: 'Gives you', kind: 'Kind', lens: 'Lens' };
  var WHO = { 'Tending to self': 'yourself' };
  var VERB = { enjoy: 'You enjoy it', skill: 'You can do it', care: 'You care about it', seek: 'You’re seeking it', offer: 'You’re offering it' };
  var editIx = -1, draft = null;
  var EMBED = /[?&]embed=1\b/.test(location.search);
  if (EMBED) document.documentElement.classList.add('ao-embed');
  var told = false;
  function tell(){ if (!EMBED || !told || openIx > -1 || editIx > -1) return; var left = items.filter(function(x){ return missing(x).length; }).length; try { parent.postMessage({ ao: 'done', left: left, total: items.length }, location.origin); } catch (e) {} }
  function catLine(it){
    var c = (it.a.cat && it.a.cat.length) ? it.a.cat.join(', ') : it.cat;
    if (!c) return it.thing ? '' : 'Not tagged yet';
    return c + (it.guess && !(it.a.cat && it.a.cat.length) ? ', we think' : '');
  }
  function answered(it){ return needs(it).filter(function(k){ return k !== 'cat' && (k === 'who' ? whoDone(it) : k === 'work' ? workDone(it) : it.a[k] && it.a[k].length); }); }
  function val(it, k){ return k === 'who' ? whoParts(it) : k === 'work' ? workParts(it) : it.a[k]; }
  function sentence(it){
    var s = VERB[it.tag] || '';
    if (whoDone(it)) {
      var w = whoParts(it).map(function(x){ return WHO[x] || x.toLowerCase(); });
      s += (it.a.who.indexOf('In service to another') > -1 ? ' in service to ' : ' for ') + (w.length > 1 ? w.slice(0, -1).join(', ') + ' and ' + w[w.length - 1] : w[0]);
    }
    s += '.';
    var more = ['how', 'level', 'kind', 'lens', 'gives'].filter(function(k){ return it.a[k] && it.a[k].length; }).map(function(k){ return it.a[k].join(', '); }).concat(workParts(it));
    return more.length ? s + ' ' + more.join(' · ') + '.' : s;
  }
  function body(c, it, ix, miss){
    if (CARD === 'a') {
      var list = el('div', 'kvs');
      answered(it).forEach(function(k){ if (k === 'work') { workRows(it).forEach(function(w){ var rw = el('div', 'kv'); rw.appendChild(el('span', '', w[0])); rw.appendChild(el('b', '', w[1])); list.appendChild(rw); }); return; } var r = el('div', 'kv'); r.appendChild(el('span', '', LAB[k])); r.appendChild(el('b', '', val(it, k).join(', '))); list.appendChild(r); });
      miss.filter(function(k){ return k !== 'cat'; }).forEach(function(k){ var r = el('div', 'kv miss'); r.appendChild(el('span', '', LAB[k])); var b = el('button', 'link', 'Add'); b.type = 'button'; b.addEventListener('click', function(){ openCard(ix); }); r.appendChild(b); list.appendChild(r); });
      if (miss.indexOf('cat') > -1) { var r2 = el('div', 'kv miss'); r2.appendChild(el('span', '', 'Tags')); var b2 = el('button', 'link', 'Confirm'); b2.type = 'button'; b2.addEventListener('click', function(){ openCard(ix); }); r2.appendChild(b2); list.appendChild(r2); }
      if (list.children.length) c.appendChild(list);
    } else if (CARD === 'b') {
      var row = el('div', 'chips');
      answered(it).forEach(function(k){ val(it, k).forEach(function(v){ row.appendChild(el('span', 'chip', v)); }); });
      miss.forEach(function(k){ var b = el('button', 'chip add', '+ ' + SHORT[k]); b.type = 'button'; b.addEventListener('click', function(){ openCard(ix); }); row.appendChild(b); });
      if (row.children.length) c.appendChild(row);
    } else {
      c.appendChild(el('div', 'sum', sentence(it)));
      if (miss.length) {
        var f = el('button', 'foot-bar', 'Answer ' + miss.length + ' more ' + (miss.length === 1 ? 'question' : 'questions') + ' for a better match');
        f.type = 'button'; f.addEventListener('click', function(){ openCard(ix); }); c.appendChild(f);
      }
    }
  }

  var NOURISH = { 'Food & Drink': 'Eat & Drink', 'Movement': 'Move', 'Play': 'Play', 'Arts': 'Create', 'Building & Repurposing': 'Create', 'Community & Culture': 'Connect', 'Communications': 'Connect' };
  function autoGives(it){
    if (it.tag !== 'seek' || it.gAuto) return;
    it.gAuto = true;
    if ((it.a.gives || []).length) return;
    var g = [];
    ((it.a.cat && it.a.cat.length) ? it.a.cat : [it.cat]).forEach(function(c){ var n = NOURISH[c]; if (n && g.indexOf(n) < 0) g.push(n); });
    if (g.length) { it.a.gives = g; it.gAutoSet = true; }
  }
  function draw(){
    items.forEach(autoGives);
    if (draft) autoGives(draft);
    grid.innerHTML = '';
    document.documentElement.classList.toggle('ao-editing', editIx > -1);
    if (editIx > -1) { drawEdit(); return; }
    var done = 0;
    items.forEach(function(it, ix){
      var miss = missing(it), ok = !miss.length;
      if (ok) done++;
      if (EMBED && ok && ix !== openIx) return;
      var c = el('div', 'c ' + (ix === openIx ? 'open' : ok ? 'ok' : 'more'));
      var tr = el('div', 'tr');
      if (ix === openIx) { var xo = el('button', 'pen x', '\u2715'); xo.type = 'button'; xo.title = 'Later'; xo.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); }); tr.appendChild(xo); }
      if (ix !== openIx) { var pen = el('button', 'pen', '✏️'); pen.type = 'button'; pen.title = 'Edit'; pen.addEventListener('click', function(){ startEdit(ix); }); tr.appendChild(pen); }
      if (ok) tr.appendChild(el('div', 'mark', '✓'));
      c.appendChild(tr);
      c.appendChild(el('h3', '', it.word));
      var cl = catLine(it); if (cl) c.appendChild(el('div', 'cat', cl));
      c.appendChild(el('span', 'tag', TAG[it.tag]));
      if (it.det) c.appendChild(el('div', 'sum', 'Details: “' + it.det + '”'));
      if (ix === openIx) {
        var s0 = sentence(it); if (CARD === 'c') c.appendChild(el('div', 'sum', s0));
        drawQuestion(c, it);
      } else body(c, it, ix, miss);
      grid.appendChild(c);
    });
    document.getElementById('ao-band').textContent = 'Your answers (' + items.length + ')';
    document.getElementById('ao-count').textContent = done + ' of ' + items.length + ' complete';
    document.getElementById('ao-bar').style.width = (items.length ? Math.round(done * 100 / items.length) : 0) + '%';
    var left = items.length - done, rest = document.getElementById('ao-rest');
    rest.style.display = left ? '' : 'none';
    rest.textContent = 'Answer the rest now (' + left + ')';
    tell();
  }

  function startEdit(ix){
    openIx = -1; restMode = false; editIx = ix;
    draft = JSON.parse(JSON.stringify(items[ix]));
    if (!draft.a.cat && draft.cat && !draft.thing && draft.tag !== 'care') draft.a.cat = [draft.cat];
    draw(); window.scrollTo(0, 0);
  }
  function pickRow(c, title, opts, cur, many, onPick){
    var box = el('div', 'qbox');
    box.appendChild(el('div', 'qq', title));
    var row = el('div', 'row');
    opts.forEach(function(o){
      var val = o[0], lab = o[1];
      var b = el('button', 'pill' + (cur.indexOf(val) > -1 ? ' on' : ''), lab); b.type = 'button';
      b.addEventListener('click', function(){
        var at = cur.indexOf(val);
        if (many) { if (at > -1) cur.splice(at, 1); else cur.push(val); }
        else { cur.length = 0; cur.push(val); }
        onPick(cur.slice());
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    c.appendChild(box);
  }
  function drawEdit(){
    var it = draft;
    var c = el('div', 'c edit');
    var tr = el('div', 'tr');
    var xb = el('button', 'pen x', '\u2715'); xb.type = 'button'; xb.title = 'Cancel';
    xb.addEventListener('click', function(){ editIx = -1; draft = null; draw(); });
    tr.appendChild(xb); c.appendChild(tr);
    c.appendChild(el('div', 'ehead', 'Editing'));
    c.appendChild(el('h3', '', it.word));
    var ecl = catLine(it); if (ecl) c.appendChild(el('div', 'cat', ecl));
    c.appendChild(el('div', 'rule'));
    var tagCur = [it.tag];
    pickRow(c, 'How does it fit you?', Object.keys(TAG).map(function(k){ return [k, FIT[k]]; }), tagCur, false, function(v){ it.tag = v[0]; draw(); });
    if (it.tag === 'care') {
      it.a.lens = it.a.lens || (it.cat ? [it.cat] : []);
      pickRow(c, tagQ(it), Q.lens.opts.map(function(o){ return [o, o]; }), it.a.lens, true, function(){ draw(); });
    } else if (!it.thing) {
      it.a.cat = it.a.cat || [];
      pickRow(c, tagQ(it), CATS.map(function(o){ return [o, catLab(o)]; }), it.a.cat, true, function(){ it.guess = false; if (it.gAutoSet) { it.a.gives = []; } it.gAuto = false; draw(); });
    }
    needs(it).filter(function(k){ return k !== 'cat' && k !== 'lens'; }).forEach(function(k){
      if (k === 'who') { whoBlock(c, it, draw); return; }
      if (k === 'work') { it.a.workAsked = true; workBlock(c, it, draw); return; }
      it.a[k] = it.a[k] || [];
      pickRow(c, Q[k].q, Q[k].opts.map(function(o){ return [o, o]; }), it.a[k], !!Q[k].many, function(){ if (k === 'gives') it.gAutoSet = false; draw(); });
    });
    if (it.thing || it.det) {
      var dbx = el('div', 'qbox'); dbx.appendChild(el('div', 'qq', 'Details')); c.appendChild(dbx);
      var ta = el('textarea', 'det'); ta.rows = 2; ta.value = it.det || '';
      ta.addEventListener('input', function(){ it.det = ta.value; });
      dbx.appendChild(ta);
    }
    var nav = el('div', 'qnav');
    var sv = el('button', 'btn', 'Save'); sv.type = 'button';
    sv.addEventListener('click', function(){
      if (draft.tag === 'care' && draft.a.lens && draft.a.lens.length) draft.cat = draft.a.lens[0];
      if (draft.tag !== 'care' && draft.a.cat && draft.a.cat.length) { draft.cat = draft.a.cat[0]; draft.guess = false; }
      items[editIx] = draft; editIx = -1; draft = null; draw();
    });
    var cn = el('button', 'link', 'Cancel'); cn.type = 'button';
    cn.addEventListener('click', function(){ editIx = -1; draft = null; draw(); });
    nav.appendChild(sv); nav.appendChild(cn);
    c.appendChild(nav);
    grid.appendChild(c);
  }

  var qs = [];
  function openCard(ix){
    openIx = ix; step = 0;
    qs = missing(items[ix]);
    draw();
    var c = grid.children[ix]; if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function drawQuestion(c, it){
    var k = qs[step], def = Q[k];
    if (k === 'cat' && !it.a.cat && it.cat) it.a.cat = [it.cat];
    var pick = (it.a[k] || []).slice();
    c.appendChild(el('div', 'rule'));
    if (k === 'who' || k === 'work') {
      (k === 'who' ? whoBlock : workBlock)(c, it, draw);
      var wn = el('div', 'qnav');
      var wd = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); wd.type = 'button';
      wd.addEventListener('click', function(){ if (k === 'work') it.a.workAsked = true; if (!(k === 'who' ? whoDone(it) : workDone(it))) return; advance(); });
      wn.appendChild(wd);
      var wl = el('button', 'link', 'Later'); wl.type = 'button'; wl.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); }); wn.appendChild(wl);
      c.appendChild(wn);
      return;
    }
    var box = el('div', 'qbox');
    box.appendChild(el('div', 'qq', (k === 'cat' || k === 'lens') ? tagQ(it) : def.q));
    var row = el('div', 'row');
    def.opts.forEach(function(o){
      var b = el('button', 'pill' + (pick.indexOf(o) > -1 ? ' on' : ''), k === 'cat' ? catLab(o) : o); b.type = 'button';
      b.addEventListener('click', function(){
        if (def.many) {
          var at = pick.indexOf(o);
          if (at > -1) pick.splice(at, 1); else pick.push(o);
          b.className = 'pill' + (pick.indexOf(o) > -1 ? ' on' : '');
          it.a[k] = pick.slice();
        } else { it.a[k] = [o]; advance(); }
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    c.appendChild(box);
    var nav = el('div', 'qnav');
    if (def.many) {
      var nx = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); nx.type = 'button';
      nx.addEventListener('click', function(){ if (!(it.a[k] && it.a[k].length)) return; advance(); });
      nav.appendChild(nx);
    }
    var later = el('button', 'link', 'Later'); later.type = 'button';
    later.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); });
    nav.appendChild(later);
    c.appendChild(nav);
  }
  var restMode = false;
  function advance(){
    var still = missing(items[openIx]);
    if (still.length) { qs = still; step = 0; draw(); return; }
    var was = openIx; openIx = -1;
    if (restMode) {
      for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { openCard(j); return; } }
      restMode = false;
    }
    draw();
  }

  document.getElementById('ao-rest').addEventListener('click', function(){
    for (var i = 0; i < items.length; i++) if (missing(items[i]).length) { restMode = true; openCard(i); return; }
  });
  document.getElementById('ao-go').addEventListener('click', function(){
    document.getElementById('ao-msg').textContent = 'This would open who and what fits you: people, events, groups and offers. That page is the next design.';
  });
  draw();
  if (EMBED) { told = true; document.getElementById('ao-rest').click(); }
})();
</script>
