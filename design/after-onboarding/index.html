<body>
<div class="wrap">
  <div class="panel">
    <div class="note">Look-only mockup. Nothing here saves.</div>
    <h1>You're in. Here's what we heard.</h1>
    <p class="lede">A green check means we have everything for that one. The rest are optional: a quick answer or two gets you better matches.</p>
    <div class="prog"><div class="bar"><i id="ao-bar"></i></div><b id="ao-count"></b></div>
    <div class="topbtns"><button class="btn" type="button" id="ao-rest"></button><button class="btn ghost" type="button" id="ao-all">Show all answers</button></div>
    <div class="band" id="ao-band"></div>
    <div class="grid" id="ao-grid"></div>
    <div class="foot">
      <button class="btn" type="button" id="ao-go">See who and what fits me</button>
    </div>
    <div class="msg" id="ao-msg"></div>
  </div>
</div>
<script>
(function(){
  var CATS = ['Food & Drink','Movement','Play','Travel','Community & Culture','Arts & Expression','Outdoors','Home Life','Animals','Technology','Rest & Recovery','Personal Care','Faith','Business','Communications','Building & Repurposing','Transportation','Finance','Science','Medicine'];
  var EMO = {}, SKILLSET = {}, VALCAT = {}, WORDS = [];

        sft.appendChild(sbt); c.appendChild(sft);
      }
    }
    if (!picPlaced && (it.focus === 'offer' || it.focus === 'seek')) picBlock(c, it);
    if (it.thing || it.det) {
      var dbx = el('div', 'qbox'); dbx.appendChild(el('div', 'qq', 'Do you have details to describe this ' + wq(it) + '?')); c.appendChild(dbx);
      var ta = el('textarea', 'det'); ta.rows = 2; ta.value = it.det || '';
      ta.addEventListener('input', function(){ it.det = ta.value; commitDraft(); });
      dbx.appendChild(ta);
    }
    if (WORDBOX && !it.thing) wordBox(c, it);
    var nav = el('div', 'qnav qend');
    var sv = el('button', 'btn', 'Done'); sv.type = 'button';
    sv.addEventListener('click', function(){ finishEdit(); });
    nav.appendChild(sv);
    c.appendChild(nav);
    grid.appendChild(c);
    commitDraft();
    setTimeout(tellH, 0);
  }

  function sharedAll(){ try { return JSON.parse(sessionStorage.getItem('ao-details') || '{}') || {}; } catch (e) { return {}; } }
  function shareDetails(it){
    try { it.a = it.a || {}; var nowD = new Date().toISOString(); it.a.editedDate = nowD; if (!it.a.addedDate) it.a.addedDate = nowD; } catch (e) {}
    try { var all = sharedAll(); var a = JSON.parse(JSON.stringify(it.a || {})); delete a.cat; all[String(it.word).toLowerCase()] = a; sessionStorage.setItem('ao-details', JSON.stringify(all)); } catch (e) {}
    if (INPANE) toParent({ ao: 'details', word: it.word, a: slimDetails(it.a) });
  }
  var KEPT = ['img', 'enjoyWith', 'enjoyWho', 'who', 'whoAdded', 'serveWhat', 'serveWho', 'serveNature', 'gives', 'paid', 'unpaidKind', 'unpaidTime', 'workAsked', 'workOpen', 'careWays', 'addedDate', 'editedDate'];
  function slimDetails(a){
    var out = {}, any = false;
    KEPT.forEach(function(k){
      var v = (a || {})[k];
      if (Array.isArray(v) ? v.length : (v === true || (typeof v === 'string' && v))) { out[k] = JSON.parse(JSON.stringify(v)); any = true; }
    });
    return any ? out : null;
  }
  function takeShared(){
    var all = sharedAll();
    items.forEach(function(x){ var a = all[String(x.word).toLowerCase()]; if (!a) return; Object.keys(a).forEach(function(k){ x.a[k] = a[k]; }); });
  }
  window.addEventListener('storage', function(e){ if (e.key !== 'ao-details' || editIx > -1) return; takeShared(); draw(); });
  var _saveT = null, _saveMsg = null;
  function commitDraft(){
    if (!draft || editIx < 0 || !draft.tags.length) return;
    if (!draft.tags.some(function(t){ return t !== 'care'; }) && draft.a.lens && draft.a.lens.length) draft.cat = draft.a.lens[0];
    if (draft.tags.some(function(t){ return t !== 'care'; }) && draft.a.cat && draft.a.cat.length) { draft.cat = draft.a.cat[0]; draft.guess = false; }
    items[editIx] = JSON.parse(JSON.stringify(draft));
    shareDetails(draft);
    if (!FITP && !INPANE) return;
    _saveMsg = { ao: 'save', all: !FITP, key: FITP ? FITKEY[FITP] : (draft.tags.indexOf('skill') > -1 ? 'introSkills' : (FITKEY[draft.tags[0]] || 'introEnjoy')), word: draft.word, tags: draft.tags.slice(), cat: (draft.a.cat && draft.a.cat.length) ? draft.a.cat.slice() : (draft.cat ? [draft.cat] : []), how: (draft.a.how || []).slice(), level: (draft.a.level || []).slice(), roles: (draft.a.roles || []).slice(), learned: (draft.a.learned || []).slice(), workOpen: wantsWork(draft) ? 'yes' : (draft.a.workOpen || []).length ? 'no' : '', offerCat: (draft.a.offerCat || []).slice(), where: (draft.a.where || []).slice(), det: String(draft.det || '') };
    clearTimeout(_saveT);
    _saveT = setTimeout(flushSave, 600);
  }
  function flushSave(){ clearTimeout(_saveT); if (_saveMsg) { toParent(_saveMsg); _saveMsg = null; } }
  function finishEdit(){
    commitDraft(); flushSave();
    var was = editIx;
    editIx = -1; draft = null;
    if (restMode && was > -1) { for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { startEdit(j, true); return; } } restMode = false; onlyOpen = false; }
    draw();
  }
  var qs = [];
  function openCard(ix){
    if (ix > -1) { startEdit(ix, restMode); return; }
    openIx = ix; step = 0;
    qs = missing(items[ix]);
    draw();
    var c = grid.children[ix]; if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function drawQuestion(c, it){
    var k = qs[step], def = Q[k];
    if (k === 'cat' && !it.a.cat && it.cat) it.a.cat = [it.cat];
    var pick = (it.a[k] || []).slice();
    c.appendChild(el('div', 'rule'));
    if (k === 'who' || k === 'work' || k === 'cat' || k === 'with') {
      (k === 'with' ? withBlock : k === 'who' ? whoBlock : k === 'work' ? workBlock : tagBlock)(c, it, draw);
      var wn = el('div', 'qnav');
      var wd = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); wd.type = 'button';
      wd.addEventListener('click', function(){ if (k === 'work') it.a.workAsked = true; if (!(k === 'with' ? withDone(it) : k === 'who' ? whoDone(it) : k === 'cat' ? catDone(it) : workDone(it))) return; if (k === 'cat') it.guess = false; advance(); });
      wn.appendChild(wd);
      var wl = el('button', 'link', 'Later'); wl.type = 'button'; wl.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); }); wn.appendChild(wl);
      c.appendChild(wn);
      return;
    }
    var box = el('div', 'qbox');
    box.appendChild(el('div', 'qq', qText(k, it)));
    var row = el('div', 'row');
    def.opts.forEach(function(o){
      var b = el('button', 'pill' + (pick.indexOf(o) > -1 ? ' on' : ''), k === 'cat' ? catLab(o) : o); b.type = 'button';
      b.addEventListener('click', function(){
        if (def.many) {
          var at = pick.indexOf(o);
          if (at > -1) pick.splice(at, 1); else pick.push(o);
          b.className = 'pill' + (pick.indexOf(o) > -1 ? ' on' : '');
          it.a[k] = pick.slice();
        } else { it.a[k] = [o]; advance(); }
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    c.appendChild(box);
    var nav = el('div', 'qnav');
    if (def.many) {
      var nx = el('button', 'btn', qs.length > 1 ? 'Next' : 'Done'); nx.type = 'button';
      nx.addEventListener('click', function(){ if (!(it.a[k] && it.a[k].length)) return; advance(); });
      nav.appendChild(nx);
    }
    var later = el('button', 'link', 'Later'); later.type = 'button';
    later.addEventListener('click', function(){ openIx = -1; restMode = false; draw(); });
    nav.appendChild(later);
    c.appendChild(nav);
  }
  var restMode = false;
  function advance(){
    var still = missing(items[openIx]);
    if (still.length) { qs = still; step = 0; draw(); return; }
    var was = openIx; openIx = -1;
    if (restMode) {
      for (var i = 1; i <= items.length; i++) { var j = (was + i) % items.length; if (missing(items[j]).length) { openCard(j); return; } }
      restMode = false;
    }
    draw();
  }

  document.getElementById('ao-rest').addEventListener('click', function(){
    for (var i = 0; i < items.length; i++) if (missing(items[i]).length) { restMode = true; onlyOpen = true; openCard(i); return; }
  });
  document.getElementById('ao-all').addEventListener('click', function(){ onlyOpen = false; restMode = false; openIx = -1; draw(); });
  document.getElementById('ao-go').addEventListener('click', function(){
    document.getElementById('ao-msg').textContent = 'This would open who and what fits you: people, events, groups and offers. That page is the next design.';
  });
  draw();
  function startRest(){ told = true; onlyOpen = false; openIx = -1; restMode = false; document.getElementById('ao-rest').click(); }
  if (EMBED && !/[?&]wait=1\b/.test(location.search)) startRest();
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.ao === 'start') startRest();
    if (e.data.ao === 'finish' && editIx > -1) finishEdit();
    if (e.data.ao === 'wordSaved') {
      var wk = String(e.data.word || '').toLowerCase();
      wbBusy = false;
      wbMsg[wk] = e.data.ok ? { ok: true, text: e.data.added ? 'Added to the word table for everyone.' : 'Saved for everyone.' } : { ok: false, text: e.data.message || 'Not saved.' };
      if (e.data.ok) delete wbState[wk];
      if (editIx > -1) draw();
    }
    if (e.data.ao === 'items' && e.data.hand && editIx < 0) { var keep = {}; items.forEach(function(x){ keep[String(x.word).toLowerCase()] = x; }); HAND_PLACE = e.data.hand.place || {}; items = fromHand(e.data.hand, keep); takeShared(); if (Object.keys(keep).length) items.forEach(function(x){ if (!keep[String(x.word).toLowerCase()] && !(x.a || {}).addedDate) shareDetails(x); }); draw(); var ow = String(e.data.hand.openWord || '').toLowerCase(); if (ow) { for (var oi = 0; oi < items.length; oi++) { if (String(items[oi].word).toLowerCase() === ow) { startEdit(oi); break; } } } }
  });
  if (FITP) toParent({ ao: 'ready' });
  try { if (INPANE && window.ResizeObserver) new ResizeObserver(function(){ tellH(); }).observe(document.querySelector('.wrap')); } catch (e) {}
})();
</script>
