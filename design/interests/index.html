<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interests · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#4B5A6D;--muted:#6B7A8D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:transparent;font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{padding:2px 2px 6px;}
  .lede{font-size:13.5px;line-height:1.5;color:var(--grey);margin:0 0 12px;}
  .search{width:100%;font:inherit;font-size:14px;padding:11px 14px;border:1.5px solid var(--pale);border-radius:12px;color:var(--ink);background:#fff;}
  .search:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0 8px;font-size:13px;font-weight:700;color:var(--muted);}
  .crumbs button{font:inherit;font-weight:700;color:var(--blue);background:none;border:0;padding:2px 3px;cursor:pointer;text-decoration:underline;}
  .crumbs .now{color:var(--ink);padding:2px 3px;}
  .fg{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff;}
  .fgh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 12px;cursor:pointer;font:inherit;text-align:left;}
  .fgh .ch{color:var(--blue);font-size:12px;width:12px;}
  .fgn{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);white-space:nowrap;}
  .fgs{flex:1;min-width:0;font-size:13px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fgc{font-size:12px;font-weight:700;color:var(--blue);background:#E6F1FB;border-radius:10px;padding:1px 8px;}
  .fg.open .fgh{background:var(--blue);border-radius:9px 9px 0 0;}
  .fg.open .fgh .fgn,.fg.open .fgh .ch{color:#fff;}
  .fgb{padding:10px 12px 12px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .sub{margin-top:12px;}
  .sub.deep{margin:10px 0 0 4px;padding-left:12px;border-left:3px solid var(--pale);}
  .pick.open{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue) inset;}
  .subh{font-size:13px;font-weight:700;color:var(--ink);}
  .grid{display:flex;flex-wrap:wrap;gap:8px;}
  .tile,.pick{font:inherit;font-size:13px;font-weight:600;border-radius:20px;padding:7px 14px;cursor:pointer;line-height:1.25;text-align:left;}
  .tile{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .pick{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .pick.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pick.other{border:1.5px solid var(--blue);color:var(--blue);}
  .pick .sub{display:block;font-size:11.5px;font-weight:600;opacity:.8;margin-top:1px;}
  .pastelink{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:none;border:0;padding:8px 2px 0;cursor:pointer;}
  .pastebox{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px 12px;margin-top:8px;}
  .pastebox textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;font-size:14px;line-height:1.45;padding:9px 12px;border:1.5px solid var(--pale);border-radius:12px;resize:vertical;background:#fff;}
  .pastehint{font-size:12.5px;color:var(--grey);margin:0 0 8px;line-height:1.45;}
  .pastebtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .recs{margin-top:12px;}
  .otherbox{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .otherbox input{flex:1 1 200px;font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--pale);border-radius:12px;}
  .btn{font:inherit;font-size:14px;font-weight:700;border-radius:20px;padding:8px 16px;border:0;background:var(--blue);color:#fff;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .none{font-size:13.5px;color:var(--grey);margin:8px 0 0;}
  h3{font-size:17px;font-weight:800;margin:22px 0 4px;color:var(--ink);}
  .fold{margin-top:20px;}
  .foldbar{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:#1F699E;color:#fff;border:0;border-radius:10px 10px 0 0;padding:11px 16px;cursor:pointer;text-align:left;font:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .fold.shut .foldbar{border-radius:10px;}
  .foldar{font-size:13px;padding:0 2px;}
  .foldbody{border:1.5px solid #C9DFF3;border-top:0;border-radius:0 0 12px 12px;padding:14px 16px 16px;background:#fff;}
  .privacy{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;background:var(--soft);}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .nm{font-size:16px;font-weight:800;line-height:1.3;}
  .path{font-size:12.5px;font-weight:700;color:var(--blue);margin:3px 0 0;}
  .x{font:inherit;font-size:17px;line-height:1;border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;}
  .cap{font-size:12px;font-weight:800;color:var(--ink);margin:12px 0 6px;}
  .lv{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--blue);border:1.5px solid var(--line);border-radius:18px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .pill.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pill.fixed{background:var(--blue);color:#fff;border-color:var(--blue);cursor:default;}
  .way{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.35;margin:0 0 6px;cursor:pointer;}
  .way input{margin:2px 0 0;accent-color:var(--blue);}
  .show{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;margin-top:12px;color:var(--ink);}
  .sw{flex-shrink:0;width:48px;height:28px;border-radius:14px;border:0;cursor:pointer;position:relative;background:#C9D3DE;padding:0;}
  .sw.on{background:#1F699E;}
  .sw .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;}
  .sw.on .knob{left:23px;}
  .wait{font-size:14px;color:var(--grey);}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="wait">Looking for your interests…</div></div>
<script>
(function(){
  var FITS = [['enjoy', 'I enjoy it'], ['skill', 'I can do it'], ['care', 'I care about it'], ['seek', 'I’m seeking it']];
  var WAYS = [['connect:meet', 'Meet others interested in it'], ['connect:offer', 'I can share experience or help'], ['connect:seek', 'I’m looking for information or support'], ['connect:events', 'Events or groups about it']];
  var st = { byId: {}, byName: {}, roots: [], mine: [], fits: {}, path: [], q: '', other: false, ready: false };
  var app = document.getElementById('app');
  var els = {};

  function lc(s){ return String(s || '').trim().toLowerCase(); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
  function toParent(m){ try { window.parent.postMessage(m, location.origin); } catch (e) {} }
  function clean(s){ return String(s || '').replace(/[:|,]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function build(rows){
    st.byId = {}; st.byName = {}; st.roots = [];
    var list = [], extra = [];
    st.extra = [];
    (rows || []).forEach(function(r){
      if (!r || !r[0] || !r[1]) return;
      var isInt = String(r[4] || '').toLowerCase().indexOf('interest') > -1;
      if (!isInt) { extra.push(r); return; }
      var n = { id: String(r[0]), word: String(r[1]).trim(), parentIds: String(r[2] || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean), kids: [], parents: [],
        names: [String(r[1]).trim()].concat(String(r[5] || '').split(',')).map(function(x){ return x.trim(); }).filter(Boolean) };
      st.byId[n.id] = n; list.push(n);
    });
    list.forEach(function(n){
      n.parents = n.parentIds.filter(function(p){ return st.byId[p] && p !== n.id; }).map(function(p){ return st.byId[p]; });
      n.parents.forEach(function(p){ p.kids.push(n); });
      n.names.forEach(function(nm){ if (!st.byName[lc(nm)]) st.byName[lc(nm)] = n; });
    });
    st.roots = list.filter(function(n){ return !n.parents.length; });
    st.roots.sort(function(a, b){ return (lc(b.word) === 'work transitions') - (lc(a.word) === 'work transitions'); });
    extra.forEach(function(r){
      var w = String(r[1]).trim(), k = lc(w);
      if (st.byName[k]) return;
      var n = { id: 'x' + String(r[0]), word: w, extra: true, kids: [], parents: [], names: [w].concat(String(r[5] || '').split(',')).map(function(x){ return x.trim(); }).filter(Boolean) };
      st.extra.push(n);
      n.names.forEach(function(nm){ if (!st.byName[lc(nm)]) st.byName[lc(nm)] = n; });
    });
  }
  function pathOf(n){
    var out = [], seen = {}, at = n, guard = 0;
    while (at && !seen[at.id] && guard++ < 12) { seen[at.id] = 1; out.unshift(at); at = at.parents[0]; }
    return out;
  }
  function areaOf(n){ if (n.extra) return 'Other'; var p = pathOf(n); return p.length ? p[0].word : 'Other'; }
  function current(){ return st.path.length ? st.byId[st.path[st.path.length - 1]] : null; }
  function mineIx(word){ for (var i = 0; i < st.mine.length; i++) { if (lc(st.mine[i].word) === lc(word)) return i; } return -1; }
  function has(word){ return mineIx(word) > -1; }

  function emit(){ toParent({ ao: 'ints', list: st.mine.map(function(m){ return m.word + ':' + m.area; }) }); }
  function allD(){ try { return JSON.parse(sessionStorage.getItem('ao-details') || '{}') || {}; } catch (e) { return {}; } }
  function getA(word){ var a = allD()[lc(word)]; return (a && typeof a === 'object' && !Array.isArray(a)) ? a : {}; }
  function putA(word, a){
    var all = allD(), k = lc(word), filled = !!Object.keys(a || {}).length;
    if (filled) all[k] = a; else delete all[k];
    try { sessionStorage.setItem('ao-details', JSON.stringify(all)); } catch (e) {}
    toParent({ ao: 'details', word: word, a: filled ? a : null });
  }

  function pick(word, area){
    var ix = mineIx(word);
    if (ix > -1) { dropMine(ix); return; }
    addMine(word, area);
    emit(); drawAll();
  }
  function addMine(word, area){
    st.mine.push({ word: word, area: area });
    var a = getA(word); a.showOnProfile = true; putA(word, a);
  }
  function dropMine(ix){
    var m = st.mine.splice(ix, 1)[0];
    var a = getA(m.word);
    var ways = (a.careWays || []).filter(function(c){ return c.indexOf('connect:') !== 0; });
    if (ways.length) a.careWays = ways; else delete a.careWays;
    delete a.showOnProfile;
    putA(m.word, a);
    emit(); drawAll();
  }

  function pillFor(n){
    var on = has(n.word), b = el('button', 'pick' + (on ? ' on' : ''), n.word);
    b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', function(){ pick(n.word, areaOf(n)); });
    return b;
  }

  function drawSearch(){
    var box = els.results; box.innerHTML = '';
    var q = lc(st.q);
    if (q.length < 2) { box.style.display = 'none'; els.browse.style.display = ''; return; }
    els.browse.style.display = 'none'; box.style.display = '';
    var hits = [];
    Object.keys(st.byId).map(function(id){ return st.byId[id]; }).concat(st.extra || []).forEach(function(n){
      if (n.names.some(function(nm){ return lc(nm).indexOf(q) > -1; })) hits.push(n);
    });
    hits.sort(function(a, b){ var x = (lc(a.word).indexOf(q) === 0 ? 0 : 1) + (a.extra ? 2 : 0), y = (lc(b.word).indexOf(q) === 0 ? 0 : 1) + (b.extra ? 2 : 0); return x - y || a.word.localeCompare(b.word); });
    if (!hits.length) {
      box.appendChild(el('p', 'none', 'Nothing matches “' + st.q.trim() + '” yet.'));
    } else {
      var g = el('div', 'grid');
      hits.slice(0, 40).forEach(function(n){
        var b = pillFor(n);
        g.appendChild(b);
      });
      box.appendChild(g);
    }
    box.appendChild(otherRow(null, q));
  }

  function otherRow(node, preset){
    var wrap = el('div', ''), key = node ? node.id : '_';
    var open = st.other === key || !!preset;
    if (!open) {
      var ob = el('button', 'pick other', '+ Other'); ob.type = 'button';
      ob.addEventListener('click', function(){ st.other = key; drawBrowse(); var i = els.browse.querySelector('.otherbox input'); if (i) i.focus(); });
      return ob;
    }
    var row = el('div', 'otherbox'), inp = el('input'); inp.type = 'text'; inp.maxLength = 60; inp.placeholder = 'Type an interest'; inp.setAttribute('aria-label', 'Type an interest');
    if (preset) inp.value = cap(clean(st.q));
    var add = el('button', 'btn', 'Add'); add.type = 'button';
    var go = function(){
      var w = cap(clean(inp.value)); if (!w) return;
      var hit = st.byName[lc(w)];
      var area = hit ? areaOf(hit) : (node ? areaOf(node) : 'Other');
      var name = hit ? hit.word : w;
      st.other = false; st.q = ''; els.search.value = '';
      if (!has(name)) { addMine(name, area); emit(); }
      drawAll();
    };
    add.addEventListener('click', go);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); go(); } });
    row.appendChild(inp); row.appendChild(add);
    wrap.appendChild(row);
    return wrap;
  }

  function areaPicks(root){
    var out = [];
    st.mine.forEach(function(m){ if (lc(m.area) === lc(root.word)) out.push(m.word); });
    return out;
  }
  function under(n){ return n.kids.some(function(k){ return has(k.word) || under(k); }); }
  function kidsInto(box, node, depth){
    st.drill = st.drill || {};
    var r = el('div', 'row'), openKid = null, oth = null;
    if (depth) { var all = pillFor(node); all.textContent = 'All of ' + node.word; r.appendChild(all); }
    node.kids.forEach(function(n){
      if (!n.kids.length) { r.appendChild(pillFor(n)); return; }
      var on = st.drill[node.id] === n.id, lit = has(n.word) || under(n);
      var b = el('button', 'pick' + (lit ? ' on' : '') + (on ? ' open' : ''), n.word);
      b.type = 'button'; b.setAttribute('aria-expanded', on ? 'true' : 'false');
      b.addEventListener('click', function(){ st.drill[node.id] = on ? null : n.id; drawBrowse(); });
      r.appendChild(b);
      if (on) openKid = n;
    });
    oth = otherRow(node, '');
    if (oth.className === 'pick other') r.appendChild(oth);
    box.appendChild(r);
    if (oth.className !== 'pick other') box.appendChild(oth);
    if (openKid) { var sub = el('div', 'sub deep'); kidsInto(sub, openKid, depth + 1); box.appendChild(sub); }
  }
  function drawBrowse(){
    var box = els.browse; box.innerHTML = '';
    st.open = st.open || {};
    st.roots.forEach(function(root){
      var on = !!st.open[root.id], mine = areaPicks(root);
      var g = el('div', 'fg' + (on ? ' open' : ''));
      var h = el('button', 'fgh'); h.type = 'button'; h.setAttribute('aria-expanded', on ? 'true' : 'false');
      h.appendChild(el('span', 'ch', on ? '\u25BE' : '\u25B8'));
      h.appendChild(el('span', 'fgn', root.word));
      h.appendChild(el('span', 'fgs', on ? '' : (mine.length ? mine.join(', ') : 'Nothing picked')));
      if (mine.length) h.appendChild(el('span', 'fgc', String(mine.length)));
      h.addEventListener('click', function(){ st.open[root.id] = !st.open[root.id]; drawBrowse(); });
      g.appendChild(h);
      if (on) { var inner = el('div', 'fgb'); kidsInto(inner, root, 0); g.appendChild(inner); }
      box.appendChild(g);
    });
    var o = otherRow(null, ''); if (o.className === 'pick other') { var gw = el('div', 'grid'); gw.style.marginTop = '10px'; gw.appendChild(o); box.appendChild(gw); } else box.appendChild(o);
  }

  function setFit(word, tag, on){
    var k = lc(word), cur = (st.fits[k] || []).slice(), at = cur.indexOf(tag);
    if (on && at < 0) cur.push(tag);
    if (!on && at > -1) cur.splice(at, 1);
    st.fits[k] = cur;
    toParent({ ao: 'intfit', word: word, tags: cur.slice() });
  }

  function card(m){
    var c = el('div', 'card'), top = el('div', 'top'), left = el('div', '');
    left.appendChild(el('div', 'nm', m.word));
    var node = st.byName[lc(m.word)];
    var path = node ? pathOf(node).slice(0, -1).map(function(x){ return x.word; }) : [];
    if (!path.length && m.area && lc(m.area) !== lc(m.word)) path = [m.area];
    if (path.length) left.appendChild(el('div', 'path', path.join(' › ')));
    var x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Remove ' + m.word);
    x.addEventListener('click', function(){ var i = mineIx(m.word); if (i > -1) dropMine(i); });
    top.appendChild(left); top.appendChild(x); c.appendChild(top);

    c.appendChild(el('div', 'cap', 'How does it fit you?'));
    var lv = el('div', 'lv'), me = el('span', 'pill fixed', 'I’m interested in it'); lv.appendChild(me);
    FITS.forEach(function(f){
      var on = (st.fits[lc(m.word)] || []).indexOf(f[0]) > -1, b = el('button', 'pill' + (on ? ' on' : ''), f[1]);
      b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.addEventListener('click', function(){ var now = !b.classList.contains('on'); b.classList.toggle('on', now); b.setAttribute('aria-pressed', now ? 'true' : 'false'); setFit(m.word, f[0], now); });
      lv.appendChild(b);
    });
    c.appendChild(lv);

    c.appendChild(el('div', 'cap', 'How would you like to connect around it?'));
    var a0 = getA(m.word);
    WAYS.forEach(function(w){
      var lab = el('label', 'way'), cb = document.createElement('input'); cb.type = 'checkbox';
      cb.checked = (a0.careWays || []).indexOf(w[0]) > -1;
      cb.addEventListener('change', function(){
        var a = getA(m.word), list = (a.careWays || []).slice(), at = list.indexOf(w[0]);
        if (cb.checked && at < 0) list.push(w[0]);
        if (!cb.checked && at > -1) list.splice(at, 1);
        if (list.length) a.careWays = list; else delete a.careWays;
        putA(m.word, a);
      });
      lab.appendChild(cb); lab.appendChild(el('span', '', w[1])); c.appendChild(lab);
    });
    var sl = el('div', 'show'), son = a0.showOnProfile === true, sw = el('button', 'sw' + (son ? ' on' : ''));
    sw.type = 'button'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', son ? 'true' : 'false'); sw.setAttribute('aria-label', 'Show ' + m.word + ' on my profile');
    sw.appendChild(el('span', 'knob'));
    sw.addEventListener('click', function(){
      var a = getA(m.word), now = a.showOnProfile !== true;
      if (now) a.showOnProfile = true; else delete a.showOnProfile;
      putA(m.word, a);
      sw.classList.toggle('on', now); sw.setAttribute('aria-checked', now ? 'true' : 'false');
    });
    sl.appendChild(el('span', '', 'Show on my profile')); sl.appendChild(sw); c.appendChild(sl);
    return c;
  }

  function drawCards(){
    var box = els.cards; box.innerHTML = '';
    if (!st.mine.length) return;
    var wrap = el('div', 'fold'), shut = !!st.cardsShut;
    var bar = el('button', 'foldbar'); bar.type = 'button'; bar.setAttribute('aria-expanded', shut ? 'false' : 'true');
    bar.appendChild(el('span', '', 'Interests added (' + st.mine.length + ')'));
    var ar = el('span', 'foldar', shut ? '\u25BC' : '\u25B2'); ar.setAttribute('aria-hidden', 'true'); bar.appendChild(ar);
    bar.addEventListener('click', function(){ st.cardsShut = !st.cardsShut; drawCards(); });
    wrap.appendChild(bar);
    if (!shut) {
      var body = el('div', 'foldbody');
      var g = el('div', 'cards');
      st.mine.forEach(function(m){ g.appendChild(card(m)); });
      body.appendChild(g);
      wrap.appendChild(body);
    } else wrap.classList.add('shut');
    box.appendChild(wrap);
  }

  var PASTE = /[?&]paste=1/.test(location.search);
  var LEAD = /^(and|also|so|care about|caring about|learning about|getting into|about|i|i'm|im|i am|i've|ive|been|really|like|love|enjoy|into|interested in|interest in|my|the|a|an|some|lots of|things like|stuff like|especially)\s+/i;
  function esc(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function parsePaste(text){
    var t = ' ' + lc(text).replace(/\s+/g, ' ') + ' ', found = [], seen = {};
    Object.keys(st.byName).forEach(function(nm){
      if (nm.length < 3) return;
      if (new RegExp('(^|[^a-z0-9])' + esc(nm) + '([^a-z0-9]|$)').test(t)) { var n = st.byName[nm]; if (!seen[n.id]) { seen[n.id] = 1; found.push(n); } }
    });
    var fresh = [], seenF = {};
    String(text).split(/[,;\n\r\u2022|\/]+|\s+and\s+|\.\s+/i).forEach(function(piece){
      var w = clean(piece).replace(/[.!?"\u201C\u201D()]+/g, '').trim(), prev = null;
      while (prev !== w) { prev = w; w = w.replace(LEAD, '').replace(/\s+(lately|recently|too|as well|a lot|stuff|things|etc)$/i, '').trim(); }
      if (w.length < 3 || w.split(' ').length > 4) return;
      var k = lc(w);
      if (st.byName[k] || seenF[k]) return;
      if (found.some(function(n){ return n.names.some(function(nm){ return lc(nm) === k; }); })) return;
      seenF[k] = 1; fresh.push(cap(w));
    });
    return { found: found, fresh: fresh };
  }
  function drawPaste(){
    var box = els.paste; if (!box) return; box.innerHTML = '';
    if (!st.pasteOpen) {
      var l = el('button', 'pastelink', 'Paste a list or notes instead'); l.type = 'button';
      l.addEventListener('click', function(){ st.pasteOpen = true; drawPaste(); var a = box.querySelector('textarea'); if (a) a.focus(); });
      box.appendChild(l); return;
    }
    var w = el('div', 'pastebox');
    w.appendChild(el('p', 'pastehint', 'Paste anything: a list with commas, a few sentences, or a transcript. We\u2019ll suggest interests from it, and nothing is added until you tap it.'));
    var ta = el('textarea'); ta.value = st.pasteText || ''; ta.setAttribute('aria-label', 'Paste a list or notes'); ta.placeholder = 'pickleball, gardening, foster parenting, I\u2019ve been getting into pottery\u2026';
    w.appendChild(ta);
    var bs = el('div', 'pastebtns'), go = el('button', 'btn', 'Suggest interests'), cl = el('button', 'btn ghost', 'Close');
    go.type = 'button'; cl.type = 'button';
    go.addEventListener('click', function(){ st.pasteText = ta.value; st.recs = parsePaste(ta.value); drawPaste(); });
    cl.addEventListener('click', function(){ st.pasteOpen = false; st.recs = null; st.pasteText = ''; drawPaste(); });
    bs.appendChild(go); bs.appendChild(cl); w.appendChild(bs);
    if (st.recs) {
      var r = el('div', 'recs');
      if (!st.recs.found.length && !st.recs.fresh.length) r.appendChild(el('p', 'none', 'No interests found in that yet.'));
      if (st.recs.found.length) {
        r.appendChild(el('div', 'subh', 'Interests we found'));
        var g1 = el('div', 'row'); st.recs.found.forEach(function(n){ g1.appendChild(pillFor(n)); }); r.appendChild(g1);
      }
      if (st.recs.fresh.length) {
        var h2 = el('div', 'subh', 'New ones to add'); h2.style.marginTop = '12px'; r.appendChild(h2);
        var g2 = el('div', 'row');
        st.recs.fresh.forEach(function(word){
          var on = has(word), b = el('button', 'pick' + (on ? ' on' : ''), word); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
          b.addEventListener('click', function(){ pick(word, 'Other'); });
          g2.appendChild(b);
        });
        r.appendChild(g2);
      }
      w.appendChild(r);
    }
    box.appendChild(w);
  }
  function drawAll(){ drawSearch(); drawPaste(); drawBrowse(); drawCards(); }

  function skeleton(){
    app.innerHTML = '';
    var s = el('input', 'search'); s.type = 'search'; s.placeholder = 'Search interests'; s.setAttribute('aria-label', 'Search interests'); s.autocomplete = 'off';
    s.addEventListener('input', function(){ st.q = s.value; drawSearch(); });
    els.search = s; app.appendChild(s);
    if (PASTE) { els.paste = el('div', ''); app.appendChild(els.paste); }
    els.results = el('div', ''); els.browse = el('div', ''); els.cards = el('div', '');
    app.appendChild(els.results); app.appendChild(els.browse); app.appendChild(els.cards);
  }

  function takeMine(list){
    st.mine = [];
    (list || []).forEach(function(s){
      s = String(s || ''); var at = s.lastIndexOf(':');
      var word = (at > -1 ? s.slice(0, at) : s).trim(), area = (at > -1 ? s.slice(at + 1) : '').trim() || 'Other';
      if (word && mineIx(word) < 0) st.mine.push({ word: word, area: area });
    });
  }

  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.ao !== 'ints') return;
    if (e.data.fitsOnly) { st.fits = e.data.fits || {}; if (st.ready) { drawCards(); } return; }
    build(e.data.rows);
    takeMine(e.data.mine);
    st.fits = e.data.fits || {};
    if (!st.ready) { st.ready = true; skeleton(); }
    drawAll();
  });

  var lastH = 0;
  function reportH(){
    var h = Math.ceil(document.body.getBoundingClientRect().height + 8);
    if (h !== lastH) { lastH = h; toParent({ ao: 'h', h: h }); }
  }
  if (window.ResizeObserver) { new ResizeObserver(reportH).observe(document.body); }
  window.addEventListener('load', reportH);
  window.addEventListener('resize', reportH);
  toParent({ ao: 'iready' });
})();
</script>
