<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interests · 2Gather</title>
<style>
  :root{--blue:#1F699E;--ink:#1A2E42;--grey:#4B5A6D;--muted:#6B7A8D;--line:#DDE4EE;--soft:#F7FBFF;--pale:#C9DFF3;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:transparent;font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{padding:2px 2px 6px;}
  .lede{font-size:13.5px;line-height:1.5;color:var(--grey);margin:0 0 12px;}
  .search{width:100%;font:inherit;font-size:14px;padding:11px 14px;border:1.5px solid var(--pale);border-radius:12px;color:var(--ink);background:#fff;}
  .search:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0 8px;font-size:13px;font-weight:700;color:var(--muted);}
  .crumbs button{font:inherit;font-weight:700;color:var(--blue);background:none;border:0;padding:2px 3px;cursor:pointer;text-decoration:underline;}
  .crumbs .now{color:var(--ink);padding:2px 3px;}
  .fg{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff;}
  .fgh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 12px;cursor:pointer;font:inherit;text-align:left;}
  .fgh .ch{color:var(--blue);font-size:20px;width:18px;line-height:0;text-align:center;position:relative;top:-1px;}
  .fgn{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);white-space:nowrap;}
  .fgs{flex:1;min-width:0;font-size:13px;color:var(--grey);line-height:1.35;}
  @media (max-width:560px){ .fgh{flex-wrap:wrap;row-gap:2px;} .fgn{white-space:normal;} .fgs{flex-basis:100%;padding-left:22px;order:3;} }
  .fgc{font-size:12px;font-weight:700;color:var(--blue);background:#E6F1FB;border-radius:10px;padding:1px 8px;}
  .fg.open .fgh{background:var(--blue);border-radius:9px 9px 0 0;}
  .fg.open .fgh .fgn,.fg.open .fgh .ch{color:#fff;}
  .fgb{padding:10px 12px 12px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .sub{margin-top:12px;}
  .sub.deep{margin:10px 0 0 4px;padding-left:12px;border-left:3px solid var(--pale);}
  .pick.open{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue) inset;}
  .subh{font-size:13px;font-weight:700;color:var(--ink);}
  .grid{display:flex;flex-wrap:wrap;gap:8px;}
  .tile,.pick{font:inherit;font-size:13px;font-weight:600;border-radius:20px;padding:7px 14px;cursor:pointer;line-height:1.25;text-align:left;}
  .tile{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .pick{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .pick.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pick.other{border:1.5px solid var(--blue);color:var(--blue);}
  .pick.addsel{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pick.addsel[hidden]{display:none;}
  .tagask{background:#fff;border:1.5px solid var(--pale);border-radius:14px;padding:10px 12px;margin:0 0 10px;}
  .tagq{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink);}
  .ideasbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;}
  .gsearch{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:8px 14px;border:1.5px solid var(--pale);border-radius:20px;background:#fff;color:var(--ink);}
  .addedmsg{margin:4px 0 8px;font-size:13px;font-weight:600;color:var(--blue);}
  .pick .sub{display:block;font-size:11.5px;font-weight:600;opacity:.8;margin-top:1px;}
  .pastelink{display:block;margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:none;border:0;padding:10px 2px 14px;cursor:pointer;text-decoration:underline;}
  .grid{row-gap:12px;}
  .btn.ideas{margin:0;}
  .ibar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 8px;}
  .btn.notes{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.notes .dn{font-size:20px;line-height:0;vertical-align:-1px;position:relative;top:-1px;}
  .rw{display:flex;align-items:flex-start;gap:10px;}
  .rw .row{flex:1;min-width:0;}
  .rw .pastelink{margin:0;padding:8px 2px 0;white-space:nowrap;flex-shrink:0;}
  .pastelink .dn{font-size:22px;line-height:0;vertical-align:-1px;position:relative;top:-1px;}
  .pw{display:inline-flex;align-items:stretch;border:1.5px solid var(--pale);border-radius:20px;background:#fff;overflow:hidden;}
  .pw.hid{opacity:.6;border-style:dashed;}
  .pw .pick{border:0;border-radius:0;background:none;padding:7px 10px 7px 14px;}
  .hidebtn{font:inherit;font-size:12px;font-weight:600;color:var(--grey);background:none;border:0;border-left:1px solid var(--pale);padding:0 12px 0 10px;cursor:pointer;}
  .pastebox{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px 12px;margin-top:8px;}
  .pastebox textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;font-size:14px;line-height:1.45;padding:9px 12px;border:1.5px solid var(--pale);border-radius:12px;resize:vertical;background:#fff;}
  .pastehint{font-size:12.5px;color:var(--grey);margin:0 0 8px;line-height:1.45;}
  .pastebtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:flex-end;}
  .recs{margin-top:12px;}
  .otherbox{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .lnk{margin-top:10px;}
  .lnkt{font:inherit;font-size:13px;font-weight:700;color:var(--blue);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;}
  .lnkr{margin-top:8px;}
  .lnkl{display:block;font-size:13px;font-weight:700;color:var(--ink,#1A2E42);margin-bottom:4px;}
  .lnki{display:flex;gap:8px;flex-wrap:wrap;}
  .lnki input{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border:1.5px solid var(--pale);border-radius:12px;}
  .lnkm{font-size:13px;color:var(--grey);margin-top:4px;}
  .dym{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
  .dyml{font-size:13px;font-weight:700;color:var(--grey);margin-right:2px;}
  .otherbox input{flex:1 1 200px;font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--pale);border-radius:12px;}
  .btn{font:inherit;font-size:14px;font-weight:700;border-radius:20px;padding:8px 16px;border:0;background:var(--blue);color:#fff;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--pale);}
  .none{font-size:13.5px;color:var(--grey);margin:8px 0 0;}
  h3{font-size:17px;font-weight:800;margin:22px 0 4px;color:var(--ink);}
  .vrow{display:flex;justify-content:flex-end;margin-top:20px;}
  .vtog{display:inline-flex;border:1.5px solid var(--blue);border-radius:20px;overflow:hidden;}
  .vtog button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;white-space:nowrap;}
  .vtog button.on{background:var(--blue);color:#fff;}
  .vrow + .fold{margin-top:10px;}
  .ctools{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .cxl{font:inherit;font-size:12.5px;font-weight:700;color:var(--blue);background:#fff;border:1.5px solid var(--pale);border-radius:14px;padding:3px 10px;cursor:pointer;}
  .cdone{margin-top:14px;width:100%;}
  .cmhint{font-size:12.5px;color:var(--grey);margin:0 0 8px;}
  .foldbody > .vrow:first-child{margin:0 0 10px;}
  .cmb{position:relative;}
  .cmv{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--blue);font-size:16px;}
  .cmlist{grid-template-columns:minmax(0,1fr);gap:6px;}
  .cm{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--soft);min-height:52px;}
  .cmb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;font:inherit;background:none;border:0;padding:8px 26px 8px 12px;text-align:left;cursor:pointer;}
  .catlnk{color:var(--blue) !important;font-weight:700;text-decoration:underline;cursor:pointer;}
  .misslnk{color:#C4501A !important;font-weight:700;text-decoration:underline;cursor:pointer;}
  .cmwrap{margin-bottom:8px;}
  .cm.emo .cmb{flex-direction:row;align-items:center;gap:10px;padding:8px 12px;}
  .cmq{width:28px;height:28px;box-sizing:border-box;flex:none;border:1px solid #1F699E;border-radius:50%;color:#1F699E;background:#fff;font-weight:700;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;margin:0 1px;}
  .cmemo{font-size:24px;line-height:1;min-width:30px;text-align:center;flex:none;color:var(--grey);white-space:nowrap;}
  .cmemo.multi{font-size:16px;letter-spacing:1px;}
  .cmt{display:flex;flex-direction:column;align-items:flex-start;flex:1 1 0;min-width:0;gap:1px;}
  .cmn{font-size:15px;font-weight:700;color:var(--ink);max-width:100%;overflow-wrap:anywhere;white-space:normal;text-align:left;}
  .cmp{font-size:12px;color:var(--grey);max-width:100%;overflow-wrap:anywhere;white-space:normal;text-align:left;}
  .catrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
  .catarr{color:var(--grey);font-size:14.5px;}
  .subcat{font:inherit;font-size:14.5px;font-weight:700;color:var(--blue);background:none;border:0;padding:3px 0 0;cursor:pointer;text-decoration:underline;}
  .subplain{font-size:14.5px;font-weight:700;color:var(--grey);padding-top:3px;}
  .subbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;}
  .subbox .qq{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .subbox .row{display:flex;flex-wrap:wrap;gap:6px;}
  .subbox .link{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .subbox .cbtns{margin-top:8px;}
  .fitsum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;}
  .fitchip{font-size:12px;font-weight:700;color:var(--blue);background:#E6F1FB;border-radius:20px;padding:3px 10px;}
  .tagsub{margin-top:14px;}
  .tagsec{margin-top:14px;}
  .tagsec:first-child{margin-top:0;}
  .tagsub .oline,.subbox .oline{display:flex;gap:8px;margin-top:8px;max-width:420px;}
  .tagsub .oinp,.subbox .oinp{flex:1;min-width:0;border:1.5px solid #DDE3EA;background:var(--soft);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);}
  .tagsub .pill.other,.subbox .pill.other{border:1.5px solid var(--blue);font-weight:700;}
  .catx{display:inline-block;margin-right:14px;white-space:nowrap;}
  .catx:last-child{margin-right:0;}
  .catx.plain{margin-right:0;}
  .catlink .catx:first-child{text-decoration:underline;}
  .catemo{display:inline-block;text-decoration:none;margin-right:.45em;}
  .cmsy{margin-left:auto;display:inline-flex;gap:6px;flex:none;}
  .cms{cursor:pointer;width:26px;height:26px;border-radius:50%;background:#EEF1F4;color:#A9B4C0;display:inline-flex;align-items:center;justify-content:center;}
  .cms.on{background:var(--blue);color:#fff;}
  .cms svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .cmsy + .cmopen{margin-left:8px;}
  .cmopen{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);border-radius:20px;padding:3px 12px;background:#fff;}
  @media (max-width:560px){
    .lrow1{flex-wrap:wrap;}
    .ltsearch{flex:1 1 100%;}
    .tagbox2{padding:10px;}
    .tagp{gap:5px;}
    .tagp .pill{font-size:13px;padding:6px 11px;}
    .ibar{flex-wrap:nowrap;gap:6px;}
    .ibar .btn{font-size:13px;padding:8px 11px;white-space:nowrap;flex:0 1 auto;min-width:0;}
    .cm.emo .cmb{flex-wrap:wrap;row-gap:8px;}
    .cm.emo .cmt{flex:1 1 calc(100% - 44px);}
    .cm.emo .cmsy{margin-left:auto;}
  }
  .cmx{flex-shrink:0;font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--muted);padding:12px 14px;cursor:pointer;}
  .fold{margin-top:20px;}
  .foldbar{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:#1F699E;color:#fff;border:0;border-radius:10px 10px 0 0;padding:11px 16px;cursor:pointer;text-align:left;font:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .fold.shut .foldbar{border-radius:10px;}
  .foldar{font-size:13px;padding:0 2px;}
  .foldbody{border:1.5px solid #C9DFF3;border-top:0;border-radius:0 0 12px 12px;padding:14px 16px 16px;background:#fff;}
  .privacy{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px;}
  .cards > .card.more,.cmlist > .card{grid-column:1 / -1;}
  .card{min-width:0;}
  @media (max-width:560px){ .foldbody{padding:12px 12px 14px;} }
  .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;background:var(--soft);}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .nm{font-size:16px;font-weight:800;line-height:1.3;}
  .path{font-size:12.5px;font-weight:700;color:var(--blue);margin:3px 0 0;}
  .x{font:inherit;font-size:17px;line-height:1;border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;}
  .cap{font-size:12px;font-weight:800;color:var(--ink);margin:12px 0 6px;}
  .lv{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--blue);border:1.5px solid var(--line);border-radius:18px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .pill.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pill.fixed{background:var(--blue);color:#fff;border-color:var(--blue);cursor:default;}
  .way{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.35;margin:0 0 6px;cursor:pointer;}
  .way input{margin:2px 0 0;accent-color:var(--blue);}
  .show{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;margin-top:12px;color:var(--ink);}
  .sw{flex-shrink:0;width:38px;height:22px;border-radius:11px;border:0;cursor:pointer;position:relative;background:#C9D3DE;padding:0;}
  .sw.on{background:#1F699E;}
  .sw .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .sw.on .knob{left:19px;}
  .wait{font-size:14px;color:var(--grey);}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .cs{margin-top:10px;}
  .cs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0;}
  .mstrip{margin-top:12px;}
  .mstrip .cs{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;}
  .mstrip .cs-ic{align-self:center;}
  .mstrip .cs-pills{flex:1 0 100%;margin:0;}
  .mstrip .cs-row{flex:1 1 0;min-width:0;border:1px solid var(--pale);border-radius:12px;background:#fff;padding:8px 10px;}
  .mstrip .cs-t b{font-size:12.5px;color:var(--blue);}
  .cs-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;}
  .cs-t b{display:block;font-size:14px;color:#1A2E42;}
  .cs-sw{flex:0 0 auto;width:40px;height:22px;border-radius:11px;border:0;cursor:pointer;position:relative;background:#C5CED9;padding:0;margin-top:2px;}
  .cs-sw.on{background:#1F699E;}
  .cs-k{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .cs-sw.on .cs-k{left:21px;}
  .cs-priv{background:#FBF2DC;color:#7A5A10;font-size:13px;font-weight:700;border-radius:8px;padding:7px 10px;margin:8px 0 4px;}
  .cs-tag{display:inline-block;background:#C4501A;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-right:6px;letter-spacing:.03em;}
  .cs-note{font-size:13px;color:#4B5A6D;padding:8px 0;}
  .cs-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:50%;border:1.5px solid #C9DFF3;background:#fff;color:#1F699E;cursor:pointer;flex:0 0 auto;}
  .cs-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .cbtns{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;}
  .btn.small{font-size:13px;padding:5px 14px;}
  .btn.donesym{height:30px;padding:0 14px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
  .btn.donesym svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;}
  .tagq{width:100%;box-sizing:border-box;font:inherit;font-size:14.5px;border:1.5px solid var(--pale);border-radius:10px;padding:9px 12px;margin:0 0 8px;background:var(--soft);-webkit-appearance:none;appearance:none;}
  .catlink{font:inherit;font-size:14.5px;font-weight:700;color:var(--blue);background:none;border:0;padding:3px 0 0;cursor:pointer;text-decoration:none;display:block;text-align:left;}
  .morelink.inline{display:inline-block;padding:5px 6px;margin-left:auto;}
  .rmicon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:50%;border:1.5px solid var(--pale);background:#fff;color:var(--blue);cursor:pointer;}
  .rmicon.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .mtools{display:flex;gap:6px;align-items:center;}
  .rmicon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .misscat{font:inherit;font-size:14.5px;font-weight:700;color:#C4501A;background:none;border:0;padding:3px 0 0;cursor:pointer;text-decoration:underline;display:block;}
  .tagbox2{border:1.5px solid var(--pale);border-radius:12px;padding:10px;margin-top:10px;background:#fff;}
  .tagh{font-weight:800;font-size:13px;margin-bottom:8px;}
  .tagp{display:flex;flex-wrap:wrap;gap:6px;}
  .tagn{font-size:12px;color:var(--grey);margin-top:8px;}
  .tagn.nomatch{flex:0 0 100%;font-size:13px;font-weight:700;color:var(--ink);margin:2px 0 4px;}
  .morelink{font:inherit;font-size:13px;font-weight:700;color:#C4501A;background:none;border:0;padding:8px 0 0;cursor:pointer;text-decoration:underline;display:block;}
  .cmhint2{font-size:12.5px;color:var(--grey);flex:1 1 180px;min-width:0;}
  .vtog{flex:0 0 auto;margin-left:auto;}
  .mtabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:0;border-bottom:2px solid var(--line);margin:12px 0;}
  .mtab{font:inherit;font-size:12.5px;font-weight:700;color:var(--grey);background:none;border:0;padding:7px 2px;flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;border-radius:8px 8px 0 0;cursor:pointer;}
  .mtab:not(.on){border:1px solid #7F96AE;border-bottom:0;}
  .mtab.on{background:var(--blue);color:#fff;}
  .ltools{margin:0 0 12px;}
  .lrow1{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .ltsearch{flex:1 1 auto;min-width:0;box-sizing:border-box;font:inherit;font-size:14.5px;border:1.5px solid var(--pale);border-radius:10px;padding:9px 12px;background:var(--soft);}
  .ltsort{flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:700;color:var(--blue);border:1.5px solid var(--pale);border-radius:10px;padding:9px 10px;background:#fff;}
  .lchips{display:flex;flex-wrap:wrap;gap:8px;}

<script>
(function(){
  var FITS = [['enjoy', 'I enjoy it'], ['skill', 'I can do it'], ['care', 'I care about it'], ['seek', 'I’m seeking it'], ['offer', 'I can offer it']];

  var st = { byId: {}, byName: {}, roots: [], mine: [], fits: {}, path: [], q: '', other: false, ready: false };
  var app = document.getElementById('app');
  var els = {};

  function lc(s){ return String(s || '').trim().toLowerCase(); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }

  function build(rows){
    st.byId = {}; st.byName = {}; st.roots = [];
    var list = [], extra = [];
    st.extra = [];
    (rows || []).forEach(function(r){
      if (!r || !r[0] || !r[1]) return;
      var isInt = String(r[4] || '').toLowerCase().indexOf('interest') > -1;
      if (!isInt) { extra.push(r); return; }
      var n = { cats: String(r[3] || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean), id: String(r[0]), word: String(r[1]).trim(), parentIds: String(r[2] || '').split('|').map(function(x){ return x.trim(); }).filter(Boolean), kids: [], parents: [],
        names: [String(r[1]).trim()].concat(String(r[5] || '').split(',')).map(function(x){ return x.trim(); }).filter(Boolean) };
      st.byId[n.id] = n; list.push(n);
    });
    list.forEach(function(n){
      n.parents = n.parentIds.filter(function(p){ return st.byId[p] && p !== n.id; }).map(function(p){ return st.byId[p]; });
      n.parents.forEach(function(p){ p.kids.push(n); });
      n.names.forEach(function(nm){ if (!st.byName[lc(nm)]) st.byName[lc(nm)] = n; });
    });
    var catSeen = {}; st.mainCats = []; st.rowById = {}; st.rowByName = {};
    (rows || []).forEach(function(r){ if (r && r[0] && r[1]) { st.rowById[String(r[0])] = r; if (!st.rowByName[lc(String(r[1]).trim())]) { st.rowByName[lc(String(r[1]).trim())] = r; } } });
    (rows || []).forEach(function(r){ if (r && r[0] && r[1] && r[5]) { String(r[5]).split(',').forEach(function(nm){ nm = lc(nm.trim()); if (nm && !st.rowByName[nm]) { st.rowByName[nm] = r; } }); } });
    (rows || []).forEach(function(r){ String((r && r[3]) || '').split('|').forEach(function(c){ c = c.trim(); if (c && !catSeen[c]) { catSeen[c] = 1; st.mainCats.push(c); } }); });
    st.roots = list.filter(function(n){ return !n.parents.length; });
    st.roots.sort(function(a, b){ return (lc(b.word) === 'work transitions') - (lc(a.word) === 'work transitions'); });
    extra.forEach(function(r){
      var w = String(r[1]).trim(), k = lc(w);
      if (st.byName[k]) return;
      var n = { id: 'x' + String(r[0]), word: w, extra: true, kids: [], parents: [], names: [w].concat(String(r[5] || '').split(',')).map(function(x){ return x.trim(); }).filter(Boolean) };
      st.extra.push(n);

    });
  }
  function pathOf(n){

    return out;
  }
  function areaOf(n){ if (n.extra) return 'Other'; var p = pathOf(n); return p.length ? p[0].word : 'Other'; }

      var k = lc(m.word), cur = (st.fits[k] || []).slice();

      if (cur.length) { st.fits[k] = cur; }
    });
  }
  function listItems(){ return st.all ? st.all : st.mine; }
  function canRemove(m){ if (!m.tags) { return true; } return m.tags.some(function(t){ return t === 'interest' || t === 'enjoy' || t === 'skill' || t === 'care' || t === 'seek'; }); }
  function mineIx(word){ for (var i = 0; i < st.mine.length; i++) { if (lc(st.mine[i].word) === lc(word)) return i; } return -1; }
  function has(word){ return mineIx(word) > -1; }

  function emit(){ toParent({ ao: 'ints', list: st.mine.map(function(m){ return m.word + ':' + m.area; }) }); }
  function allD(){ try { return JSON.parse(sessionStorage.getItem('ao-details') || '{}') || {}; } catch (e) { return {}; } }
  function mergeA(word, a){ var cur = getA(word); Object.keys(a).forEach(function(k){ cur[k] = a[k]; }); putA(word, cur); }
  function getA(word){ var a = allD()[lc(word)]; return (a && typeof a === 'object' && !Array.isArray(a)) ? a : {}; }
  function putA(word, a){
    var all = allD(), k = lc(word), filled = !!Object.keys(a || {}).length;
    if (filled) all[k] = a; else delete all[k];
    try { sessionStorage.setItem('ao-details', JSON.stringify(all)); } catch (e) {}
    toParent({ ao: 'details', word: word, a: filled ? a : null });
  }

  function below(n){ var out = []; (n.kids || []).forEach(function(k){ out.push(k); out = out.concat(below(k)); }); return out; }
  function above(n){ var out = [], at = n.parents && n.parents[0], g = 0; while (at && g++ < 12) { out.push(at); at = at.parents[0]; } return out; }
  function dropQuiet(word){
    var ix = mineIx(word); if (ix < 0) return;
    var m = st.mine.splice(ix, 1)[0], a = getA(m.word);
    var ways = (a.careWays || []).filter(function(c){ return c.indexOf('connect:') !== 0; });
    if (ways.length) a.careWays = ways; else delete a.careWays;
    delete a.showOnProfile; delete a.show; delete a.match; delete a.cats;
    putA(m.word, a);
  }
  function pick(word, area){
    var ix = mineIx(word);
    if (ix > -1) { dropMine(ix); return; }
    var node = st.byName[lc(word)];
    if (node && !node.extra) {
      if (node.kids.length) below(node).forEach(function(k){ dropQuiet(k.word); });
      above(node).forEach(function(p){ dropQuiet(p.word); });

  }
  function addMine(word, area){
    st.mine.push({ word: word, area: area }); st.lastPicked = lc(word);
    try { window.sessionStorage.setItem('int-lastpick', lc(word)); } catch (e) {}
     cwSensLoad(function(){ var a1 = getA(word); if (csSeedSensitive(a1, word)) { putA(word, a1); } }); return; 
  }
  function dropMine(ix){
    var m = st.mine.splice(ix, 1)[0];
    var a = getA(m.word);
    var ways = (a.careWays || []).filter(function(c){ return c.indexOf('connect:') !== 0; });
    if (ways.length) a.careWays = ways; else delete a.careWays;
    delete a.showOnProfile; delete a.show; delete a.match; delete a.cats;

    emit(); drawAll();
  }

  function isSel(word){ return !!(st.sel && st.sel[lc(word)]); }
  function setSel(n, on){ st.msg = ''; st.sel = st.sel || {}; if (on) { st.sel[lc(n.word)] = { word: n.word, area: areaOf(n) }; } else { delete st.sel[lc(n.word)]; } }
  function pillFor(n){

  }
  function tagPanel(t){

    var confirm = function(){
      if (!has(t.word)) { addMine(t.word, t.area); if (t.teach) { teach({ text: t.word, kindOf: t.teach, askedIn: 'interest' }); } }
      if (st.sel) { delete st.sel[lc(t.word)]; }

    };
    var ix2 = mineIx(t.word);
    ask.appendChild(tagBox(t.added && ix2 > -1 ? st.mine[ix2] : { word: t.word, area: t.area }, t.added ? closeAll : confirm, function(){}, t.added ? { title: 'Tag \u201C' + t.word + '\u201D', noSubs: true, doneLabel: 'Done', doneNote: 'Interest added' } : { title: 'Tag \u201C' + t.word + '\u201D', noSubs: true, doneLabel: 'Looks good', doneNote: 'Do the tagged categories look good?' }));
    if (!t.added) {
      var dr = ask.querySelector('.cwtp-done');
      if (dr) {
        var cx = el('button', 'btn ghost', 'Cancel'); cx.type = 'button'; cx.style.marginLeft = '10px';
        cx.addEventListener('click', function(){ st.tagging = (st.tagging || []).filter(function(x){ return x !== t; }); if (st.sel) { delete st.sel[lc(t.word)]; } st.msg = ''; drawAll(); });
        dr.appendChild(cx);

  }
  function rmPanel(rw){

  }
  function askRemove(word){
    st.rmAsk = word; st.msg = ''; drawAll();
  }
  function addBtn(nodes){
    var ready = [], seen = {};
    nodes.forEach(function(n){ var k = lc(n.word); if (!seen[k] && isSel(n.word) && !has(n.word)) { seen[k] = 1; ready.push(n); } });
    var b = el('button', 'pick addsel', 'Add' + (ready.length > 1 ? ' ' + ready.length : '')); b.type = 'button';

  }

  var STOPW = { a:1, an:1, and:1, are:1, as:1, at:1, be:1, for:1, i:1, im:1, in:1, is:1, it:1, my:1, of:1, on:1, or:1, that:1, the:1, to:1, with:1, about:1, like:1, love:1, into:1 };
  function qTokens(q){ return String(q || '').split(/[^a-z0-9]+/).filter(function(t){ return t.length > 1 && !STOPW[t]; }); }
  function tokMatch(name, toks){ var l = lc(name); return toks.every(function(t){ return l.indexOf(t) > -1; }); }
  function fuzzyFor(toks){

    var care = Object.keys(st.careWords || {}).map(function(k){ return st.careWords[k]; }).filter(function(c){ return tokMatch(c.word, toks); }).slice(0, 12);

  }
  function drawSearch(){

    els.browse.style.display = 'none'; box.style.display = ''; box.style.marginTop = '12px';
    var hits = [];
    Object.keys(st.byId).map(function(id){ return st.byId[id]; }).concat(st.extra || []).forEach(function(n){
      if (n.names.some(function(nm){ return lc(nm).indexOf(q) > -1; })) hits.push(n);
    });
    hits.sort(function(a, b){ var x = (lc(a.word).indexOf(q) === 0 ? 0 : 1) + (a.extra ? 2 : 0), y = (lc(b.word).indexOf(q) === 0 ? 0 : 1) + (b.extra ? 2 : 0); return x - y || a.word.localeCompare(b.word); });
    var careHits = careHitsFor(q, hits), fuzzy = null, qt = qTokens(q);

    if (!hits.length && careHits.length) {
      var cg = el('div', 'grid'); careHits.slice(0, 40).forEach(function(c){ cg.appendChild(carePill(c)); }); box.appendChild(cg);
    } else if (!hits.length && fuzzy && fuzzy.any) {

      var g = el('div', 'grid'), clearQ = function(){ st.q = ''; els.search.value = ''; drawAll(); }, shownIds = {};

        var b = pillFor(n); shownIds[n.id] = 1;

    var t = ' ' + lc(text).replace(/\s+/g, ' ') + ' ', found = [], seen = {};
    Object.keys(st.byName).forEach(function(nm){
      if (nm.length < 3) return;
      if (new RegExp('(^|[^a-z0-9])' + esc(nm) + '([^a-z0-9]|$)').test(t)) { var n = st.byName[nm]; if (!seen[n.id]) { seen[n.id] = 1; found.push(n); } }
    });
    var fresh = [], seenF = {};
    String(text).split(/[,;\n\r\u2022|\/]+|\s+and\s+|\.\s+/i).forEach(function(piece){
      var w = clean(piece).replace(/[.!?"\u201C\u201D()]+/g, '').trim(), prev = null;
      while (prev !== w) { prev = w; w = w.replace(LEAD, '').replace(/\s+(lately|recently|too|as well|a lot|stuff|things|etc)$/i, '').trim(); }
      if (w.length < 3 || w.split(' ').length > 4) return;
      var k = lc(w);
      if (st.byName[k] || seenF[k]) return;
      if (found.some(function(n){ return n.names.some(function(nm){ return lc(nm) === k; }); })) return;
      seenF[k] = 1; fresh.push(cap(w));
    });
    return { found: found, fresh: fresh };
  }
  function drawPaste(){
    var box = els.paste; if (!box) return; box.innerHTML = '';
    if (!st.pasteOpen) { return; }
    var w = el('div', 'pastebox');
    w.appendChild(el('p', 'pastehint', 'Paste anything: a list with commas, a few sentences, a resume, or a full transcript of you talking about yourself. We\u2019ll parse interests from it and nothing is added until you tap it.'));
    var ta = el('textarea'); ta.value = st.pasteText || ''; ta.setAttribute('aria-label', 'Add notes'); ta.placeholder = 'pickleball, gardening, foster parenting, I\u2019ve been getting into pottery\u2026';
    w.appendChild(ta);
    var bs = el('div', 'pastebtns'), go = el('button', 'btn', 'Parse interests'), cl = el('button', 'btn ghost', 'Close');
    go.type = 'button'; cl.type = 'button';
    go.addEventListener('click', function(){ st.pasteText = ta.value; st.recs = parsePaste(ta.value); drawPaste(); });
    cl.addEventListener('click', function(){ st.pasteOpen = false; st.recs = null; st.pasteText = ''; drawPaste(); drawBrowse(); });
    bs.appendChild(go); bs.appendChild(cl); w.appendChild(bs);
    if (st.recs) {
      var r = el('div', 'recs');
      if (!st.recs.found.length && !st.recs.fresh.length) r.appendChild(el('p', 'none', 'No interests found in that yet.'));
      if (st.recs.found.length) {
        r.appendChild(el('div', 'subh', 'Interests we found'));
        var g1 = el('div', 'row'); st.recs.found.forEach(function(n){ g1.appendChild(pillFor(n)); }); r.appendChild(g1);
      }
      if (st.recs.fresh.length) {
        var h2 = el('div', 'subh', 'New ones to add'); h2.style.marginTop = '12px'; r.appendChild(h2);
        var g2 = el('div', 'row');
        st.recs.fresh.forEach(function(word){
          var on = has(word), b = el('button', 'pick' + (on ? ' on' : ''), word); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
          b.addEventListener('click', function(){ pick(word, 'Other'); });
          g2.appendChild(b);
        });
        r.appendChild(g2);
      }
      w.appendChild(r);
    }
    box.appendChild(w);
  }
  function drawAll(){ drawSearch(); drawPaste(); drawBrowse(); drawCards(); }

  function skeleton(){
    app.innerHTML = '';
    var s = el('input', 'search'); s.type = 'search'; s.placeholder = '\u{1F50D} Search or add an interest'; s.setAttribute('aria-label', 'Search or add an interest'); s.autocomplete = 'off';
    s.addEventListener('input', function(){ st.q = s.value; drawSearch(); });
    s.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') { return; }
      e.preventDefault();
      var w = cap(clean(st.q)); if (!w) { return; }
      var hit = st.byName[lc(w)], name = hit ? hit.word : w;
      st.q = ''; s.value = '';
      if (!has(name)) { if (hit && !hit.extra) { pick(name, areaOf(hit)); return; } addMine(name, hit ? areaOf(hit) : 'Other'); emit(); }
      drawAll();
    });
    els.search = s; app.appendChild(s);
     els.paste = el('div', ''); app.appendChild(els.paste); 
    els.pend = el('div', 'pendwrap'); app.appendChild(els.pend);
    els.results = el('div', ''); els.browse = el('div', ''); els.cards = el('div', '');
    app.appendChild(els.results); app.appendChild(els.browse); app.appendChild(els.cards);
    if (PART) { document.body.classList.add('part-' + PART); }
  }

  function takeMine(list){
    var prev = {}, had = (st.mine || []).length;
    (st.mine || []).forEach(function(m){ prev[lc(m.word)] = 1; });
    st.mine = [];
    (list || []).forEach(function(s){
      s = String(s || ''); var at = s.lastIndexOf(':');
      var word = (at > -1 ? s.slice(0, at) : s).trim(), area = (at > -1 ? s.slice(at + 1) : '').trim() || 'Other';
      if (word && mineIx(word) < 0) st.mine.push({ word: word, area: area });
    });
    if (had) {
      var old = st.mine.filter(function(m){ return prev[lc(m.word)]; }), fresh = st.mine.filter(function(m){ return !prev[lc(m.word)]; });
      st.mine = old.concat(fresh);
      if (fresh.length && !(st.lastPicked && mineIx(st.lastPicked) > -1)) { st.lastPicked = lc(fresh[fresh.length - 1].word); }
    } else if (!st.lastPicked) {
      try { var lp = window.sessionStorage.getItem('int-lastpick') || ''; if (lp && mineIx(lp) > -1) { st.lastPicked = lp; } } catch (e) {}
    }
  }

  function openJoyWord(w){
    w = String(w || '').trim(); if (!w || PART === 'top') { return; }
    var k = lc(w);
    setCompact(false); st.openCard = {}; st.lkind = 'all'; st.lq = ''; st.lsort = 'new'; st.cardLimit = 12; st.cardsShut = false;
    st.lastPicked = k; try { sessionStorage.setItem('int-lastpick', k); } catch (x) {}
    st.more = ''; st.pend = k; st.moreTab = 'enjoy';
    st.joyNote = '\u201C' + w + '\u201D was added to your joys. Choose its category, then press Done.';
    if (!catListOf(w).length) { st.tagOpen = st.tagOpen || {}; st.tagOpen[k] = true; }
    toParent({ ao: 'openedword' });
  }
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.ao !== 'ints') return;
    if (e.data.fitsOnly) { st.fits = e.data.fits || {}; if (e.data.all) { st.all = e.data.all; } mergeTagFits(); if (e.data.mine) { takeMine(e.data.mine); } if (e.data.openWord) { openJoyWord(e.data.openWord); } if (st.ready) { drawCards(); if (e.data.mine && PART !== 'list') { drawSearch(); drawBrowse(); } } return; }
    st.marks = e.data.marks || st.marks || {};
    if (e.data.howList) { st.howList = e.data.howList; }
    if (e.data.place) { HAND_PLACE = e.data.place; }
    if (e.data.all) { st.all = e.data.all; }
    build(e.data.rows);
    takeMine(e.data.mine);
    st.fits = e.data.fits || {}; mergeTagFits();
    if (e.data.openWord) { openJoyWord(e.data.openWord); }
    if (!st.ready) {
      st.ready = true; skeleton();
      var qp = new URLSearchParams(location.search), io = lc(qp.get('iopen') || ''), iq = qp.get('iq') || '';
      if (io) {
        var want = io.split('>').map(function(x){ return x.trim(); });
        st.ideas = true; st.open = st.open || {}; st.drill = st.drill || {};
        st.roots.forEach(function(root){
          if (lc(root.word) !== want[0]) return;
          st.open[root.id] = true;
          var at = root;
          want.slice(1).forEach(function(w){ var k = (at.kids || []).filter(function(x){ return lc(x.word) === w; })[0]; if (k) { st.drill[at.id] = k.id; at = k; } });
        });
      }
      if (iq) { st.q = iq; els.search.value = iq; }
      var fw = qp.get('focus'); if (fw) { setCompact(false); st.lq = fw; st.lkind = 'all'; }
      var im = qp.get('imore'); if (im && has(im)) { setCompact(false); st.more = lc(im); st.moreTab = ''; }
    }
    drawAll();
  });

  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.ao !== 'shared') return;
    if (st.ready) { drawCards(); }
  });
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.ao !== 'focusword') return;
    setCompact(false); st.openCard = {}; st.lkind = 'all'; st.lq = String(e.data.word || ''); st.cardLimit = 12; st.cardsShut = false;
    if (st.ready) { drawCards(); }
  });
  var lastH = 0;
  function reportH(){
    var h = Math.ceil(document.body.getBoundingClientRect().height + 8);
    if (h !== lastH) { lastH = h; toParent({ ao: 'h', h: h }); }
  }
  if (window.ResizeObserver) { new ResizeObserver(reportH).observe(document.body); }
  window.addEventListener('load', reportH);
  window.addEventListener('resize', reportH);
  toParent({ ao: 'iready' });
})();
</script>
