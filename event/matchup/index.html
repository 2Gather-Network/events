<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Match up · 2Gather</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans','DM Sans',sans-serif;background:#1F699E;color:#1A2E42;min-height:100vh;}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0;padding:0 14px;font-size:14px;font-weight:500;color:#fff;}
#crumbs a{color:#fff;text-decoration:none;}
#crumbs a:hover{text-decoration:underline;}
#crumbs .now{font-weight:800;}
#crumbs .sep{opacity:.6;}
.box{background:#fff;border-radius:12px;padding:22px 26px;max-width:560px;margin:24px auto 20px;box-shadow:0 24px 64px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.12);}
@media(max-width:620px){.box{margin:14px;padding:18px 16px;}}
.h{font-size:17px;font-weight:700;margin-bottom:6px;}
.box p{font-size:14px;color:#2F3D4F;line-height:1.5;margin-top:8px;}
.ed-h{font-size:14px;font-weight:700;margin-top:18px;}
.cap{font-size:13px;font-weight:700;margin-top:14px;}
.inp{display:block;width:100%;margin-top:8px;padding:10px 12px;border:1.5px solid #DDE4EE;border-radius:10px;font-size:14px;font-family:inherit;color:#1A2E42;}
.inp:focus{outline:none;border-color:#1F699E;}
.inp.bad{border-color:#B42318;}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer;}
.fine{font-size:13px;color:#2F3D4F;margin-top:14px;}
.err{font-size:13px;color:#B42318;font-weight:700;margin-top:12px;min-height:1em;}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px;}
.btn{background:#1F699E;color:#fff;border:1.5px solid #1F699E;border-radius:24px;padding:9px 20px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover{background:#185A88;}
.btn[disabled]{opacity:.6;cursor:default;}
.mp-btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:24px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;text-decoration:none;display:inline-block;}
.tlink{background:none;border:0;padding:0;font:inherit;font-size:14px;font-weight:700;color:#1F699E;cursor:pointer;text-decoration:underline;}
.box a{color:#1F699E;font-weight:700;}
.box .btn{color:#fff;}
.wait{font-size:14px;font-weight:700;color:#1F699E;}
</style>
</head>
<body>
<div id="crumbs"><a href="https://2gather.network/myevents/">My events</a> <span class="sep" aria-hidden="true">/</span> <a id="crumb-ev" href="#">Event</a> <span class="sep" aria-hidden="true">/</span> <span class="now">My Match up</span></div>
<div class="box" id="box"><p class="wait">Looking for your Match up</p></div>
<script src="/nav/identity.js?v=61"></script>
<script>
(function () {
  var GS = "https://cw-api-gate.jessieupp.workers.dev";
  var q = new URLSearchParams(location.search);
  var id = String(q.get("id") || "").trim();
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function me() {
    var m = "";
    try { if (window.CW && typeof window.CW.me === "function") { m = String(window.CW.me().id || "").trim(); } } catch (e) {}
    if (!m) { try { m = localStorage.getItem("appear-id") || ""; } catch (e) {} }
    return m;
  }
  function viewing() { try { return !!(window.CW && typeof window.CW.me === "function" && window.CW.me().viewing); } catch (e) { return false; } }
  function token() { try { return localStorage.getItem("cw-token") || ""; } catch (e) { return ""; } }
  var EV_URL = "https://2gather.network/event/?id=" + encodeURIComponent(id);
  var MATCHES = "https://2gather.network/event/matches/?id=" + encodeURIComponent(id);
  var st = { s: null, edit: false };

  function interestInputs(list) {
    return [0, 1, 2].map(function (i) {
      return '<input class="inp" type="text" maxlength="40" id="int' + (i + 1) + '" aria-label="Interest ' + (i + 1) + '" placeholder="Interest ' + (i + 1) + '" value="' + esc(list[i] || "") + '">';
    }).join("");
  }
  function shareRadios(shared) {
    return '<label class="opt"><input type="radio" name="sh" value="true"' + (shared ? " checked" : "") + '> Share them with the people at this event</label>'
      + '<label class="opt"><input type="radio" name="sh" value="false"' + (shared ? "" : " checked") + '> Keep them private</label>';
  }
  function draw() {
    var s = st.s;
    if (!s.matchUp && !st.edit) {
      $("box").innerHTML = '<div class="h">Your top three interests for this event</div>'
        + '<p>These help match you with people here. Add up to three.</p>'
        + interestInputs(s.matchInterests || []) + '<p class="cap">Who sees them</p>' + shareRadios(s.matchInterestsShared !== false)
        + '<p class="fine">You can always change your mind later.</p><p class="err" id="err" role="alert"></p>'
        + '<div class="act"><button type="button" class="btn" data-go="on">Turn on Match up</button><a class="mp-btn" href="' + esc(EV_URL) + '">Not now</a></div>';
      return;
    }
    if (!s.matchUp && st.edit === "off") {
      $("box").innerHTML = '<div class="h">Match up is off</div>'
        + '<p>People at this event will no longer see you in Match up, and you will no longer see your matches.</p>'
        + '<p>What you wrote is kept, so you can turn it on again any time before the end of the event day.</p>'
        + '<div class="act"><button type="button" class="btn" data-go="again">Turn on Match up again</button><a class="mp-btn" href="' + esc(EV_URL) + '">Back to the event</a></div>';
      return;
    }
    $("box").innerHTML = '<div class="h">Edit my Match up</div>'
      + '<p>Choose what people at this event who turned on Match up can see. Your profile stays as it is.</p>'
      + '<div class="ed-h">My top three interests for this event</div>' + interestInputs(s.matchInterests || []) + shareRadios(s.matchInterestsShared !== false)
      + '<div class="ed-h">A line for this event</div><input class="inp" type="text" maxlength="120" id="line" aria-label="A line for this event" placeholder="Ex: Looking for a co-founder who knows soil" value="' + esc(s.matchLine || "") + '">'
      + '<div class="ed-h">How to find me during the event</div><input class="inp" type="text" maxlength="80" id="where" aria-label="How to find me during the event" placeholder="Ex: Near the seed table" value="' + esc(s.matchWhere || "") + '">'
      + '<p class="fine">Languages spoken show from your account. <a href="https://2gather.network/account/" target="_blank" rel="noopener">Edit on my account</a> (opens a new tab)</p>'
      + '<p class="fine">You can always change your mind later. Match up closes at the end of the event day.</p><p class="err" id="err" role="alert"></p>'
      + '<div class="act"><button type="button" class="tlink" data-go="off">Turn off Match up</button><a class="mp-btn" href="' + esc(MATCHES) + '">Cancel</a><button type="button" class="btn" data-go="save">Save</button></div>';
  }
  function val(i) { var el = $(i); return el ? String(el.value || "").trim() : ""; }
  function save(on, btn) {
    var s = st.s, ints = $("int1") ? [val("int1"), val("int2"), val("int3")] : (s.matchInterests || []).concat(["", "", ""]).slice(0, 3);
    var shEl = document.querySelector('input[name="sh"]:checked');
    var shared = shEl ? shEl.value !== "false" : s.matchInterestsShared !== false;
    var line = $("line") ? val("line") : (s.matchLine || ""), where = $("where") ? val("where") : (s.matchWhere || "");
    if (viewing()) { var ve = $("err"); if (ve) ve.textContent = "Stop viewing as someone else first."; return; }
    if (btn) btn.disabled = true;
    var err = $("err"); if (err) err.textContent = "";
    Array.prototype.forEach.call(document.querySelectorAll(".inp.bad"), function (x) { x.classList.remove("bad"); });
    var url = GS + "?action=saveEventShare&matchCard=1&appearId=" + encodeURIComponent(me()) + "&meToken=" + encodeURIComponent(token()) + "&eventId=" + encodeURIComponent(id)
      + "&matchUp=" + (on ? "true" : "false") + "&shareInterests=" + (shared ? "true" : "false")
      + "&interest1=" + encodeURIComponent(ints[0] || "") + "&interest2=" + encodeURIComponent(ints[1] || "") + "&interest3=" + encodeURIComponent(ints[2] || "")
      + "&matchLine=" + encodeURIComponent(line) + "&matchWhere=" + encodeURIComponent(where);
    fetch(url).then(function (r) { return r.json(); }).then(function (r) {
      if (!r || r.status !== "ok") {
        if (btn) btn.disabled = false;
        var m = (r && r.message) || "That did not save. Try again.";
        if (r && r.code === "lobby") { $("box").innerHTML = '<p>' + esc(m) + ' <a href="' + esc(EV_URL + "&choices=1") + '">Open Your choices for this event</a></p>'; return; }
        var bad = r && r.code ? { interest1: "int1", interest2: "int2", interest3: "int3", line: "line", where: "where" }[r.code] : "";
        if (bad && $(bad)) { $(bad).classList.add("bad"); $(bad).focus(); }
        if (err) err.textContent = m; else alert(m);
        return;
      }
      s.matchUp = r.matchUp; s.matchInterests = r.interests || []; s.matchInterestsShared = r.shareInterests; s.matchLine = r.line || ""; s.matchWhere = r.where || "";
      if (on) { location.href = MATCHES; return; }
      st.edit = "off"; draw();
    }).catch(function () { if (btn) btn.disabled = false; if (err) err.textContent = "That did not save. Try again."; });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-go]") : null; if (!b || !st.s) return;
    var g = b.getAttribute("data-go");
    if (g === "on" || g === "save") save(true, b);
    else if (g === "off") save(false, b);
    else if (g === "again") { st.edit = false; draw(); }
  });
  function say(h) { $("box").innerHTML = '<p>' + h + '</p>'; }
  if (!id) { $("crumbs").style.display = "none"; say('This page needs an event. <a href="https://2gather.network/myevents/">Go to My events</a>'); return; }
  $("crumb-ev").href = EV_URL;
  fetch(GS + "?action=getEventById&id=" + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) { var t = d && d.event && d.event.title; if (t) { $("crumb-ev").textContent = t; document.title = "My Match up · " + t + " · 2Gather"; } })
    .catch(function () {});
  function run(tries) {
    var who = me();
    if (viewing()) { say("You are viewing as someone else. Stop viewing as them first to use Match up."); return; }
    if (!who) {
      if (tries < 12) { setTimeout(function () { run(tries + 1); }, 500); return; }
      say('Sign in and register for this event to use Match up. <a href="' + esc(EV_URL) + '">Go to the event</a>');
      return;
    }
    fetch(GS + "?action=getEventSeen&nocache=1&appearId=" + encodeURIComponent(who) + "&meToken=" + encodeURIComponent(token()) + "&eventId=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (!s || s.status !== "ok") { say('Sign in again to use Match up. <a href="' + esc(EV_URL) + '">Go to the event</a>'); return; }
        if (!s.registered) { say('Register for this event to use Match up. <a href="' + esc(EV_URL) + '">Go to the event</a>'); return; }
        if (!Array.isArray(s.matchInterests)) { say("Match up opens soon. Check back later."); return; }
        if (!s.inLobby) { say('To use Match up, join the lobby first. The lobby needs at least your first name and last initial and your photo. <a href="' + esc(EV_URL + "&choices=1") + '">Open Your choices for this event</a>'); return; }
        st.s = s; draw();
      })
      .catch(function () { say("Match up could not load just now. Reload the page to try again."); });
  }
  run(0);
})();
</script>
<script src="/nav/topbar.js?v=7.01" defer></script>
</body>
</html>
