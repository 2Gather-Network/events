<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Match up mockup · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;--line:#DDE4EE;--panel:#F7FBFF;--panel-line:#C9DFF3;--tint:#E8F2F9;}
*{box-sizing:border-box}
body{margin:0;background:var(--brand);color:var(--ink);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;padding:0 16px 60px}
button{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding-top:24px}
.mock{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;color:var(--ink);font-size:13.5px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 16px}
.mock b{font-weight:800;margin-right:2px}
.mock button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:16px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.mock button.on{background:var(--brand);color:#fff}
.mock .note{flex-basis:100%;color:var(--soft);font-size:12.5px}
.card{background:#fff;border-radius:14px;padding:22px 24px 24px}
h1{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;margin:0 0 2px}
h2{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:800;margin:22px 0 4px}
.evt{color:var(--soft);font-weight:700;font-size:14.5px;margin:0 0 14px}
.lead{font-size:14.5px;color:var(--soft);margin:0 0 12px;line-height:1.5}
.help{font-size:13.5px;color:var(--soft);margin:0 0 10px}
.mp-btn{font-family:'Nunito Sans','DM Sans',sans-serif;font-size:13px;font-weight:700;padding:7px 14px;border-radius:24px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.mp-btn:hover{background:#F1F7FC}
.mp-btn.primary{background:#1F699E;color:#fff}
.mp-btn.primary:hover{background:#185A88;border-color:#185A88}
.mp-btn.big{font-size:15px;padding:10px 20px}
.tlink{color:var(--brand);font-weight:700;font-size:13.5px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.seg{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.tab{flex:1 1 0;min-width:140px;background:#fff;color:var(--brand);border:1.5px solid #C9D6E2;border-radius:10px;font-size:14px;font-weight:800;padding:9px 10px;cursor:pointer;line-height:1.25;text-align:center}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab span{display:block;font-size:12px;font-weight:600;opacity:.85}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.pill{border:1.5px solid #C9D6E2;background:#fff;color:var(--ink);border-radius:22px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.person{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px}
.person.mine{background:var(--panel);border-color:var(--panel-line)}
.av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#EEF4FA;color:var(--brand);font-weight:800;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.nm{font-family:'DM Sans',sans-serif;font-weight:800;font-size:17px;color:var(--ink)}
.lbl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#fff;color:var(--soft);border:1px solid var(--panel-line);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.meta{font-size:13.5px;color:var(--soft);margin-top:2px}
.line{font-size:14px;margin:8px 0 0;font-style:italic}
.where{font-size:13px;color:var(--soft);margin:4px 0 0}
.cap{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:3px 10px;line-height:1.2}
.chip small{font-size:10.5px;font-weight:600;color:var(--soft)}
.chip.hit{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.hit small{color:#E8F2F9}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fitbox{background:var(--tint);border-radius:10px;padding:10px 12px}
.fitbox p{margin:0 0 6px;font-size:13px;font-weight:800}
.fitbox .none{font-size:13px;font-weight:400;color:var(--soft);margin:0}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.state{font-size:13.5px;color:var(--soft)}
.state.found{color:var(--brand);font-weight:800}
.count{font-size:14px;font-weight:700;margin:0 0 14px}
.empty{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:14px 16px;font-size:14px}
@media (max-width:768px){.card{padding:18px 16px 20px}.fit{grid-template-columns:1fr}.person{grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px}.av{width:44px;height:44px;font-size:15px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock" id="mock">
    <b>Mockup with sample people.</b>
    <button type="button" data-v="before">Before I enable</button>
    <button type="button" data-v="after">After I enable</button>
    <button type="button" data-v="closed">After it closes</button>
    <span class="note">Nothing here is saved. Say hi is step 3 and closing is step 4. They show here so you can see where they sit.</span>
  </div>
  <div class="card" id="page"></div>
</div>
<script src="https://2gather.network/nav/identity.js?v=60"></script>
<script>
(function () {
  var EVENT = "Saturday Seed Swap · Sat, Nov 15";
  var ME = { name: "You", city: "Edmonds", langs: ["English", "Spanish"],
    needs: [["Soil testing", "skill"], ["Rides to the farm", "thing"]],
    offers: [["Seed saving", "skill"], ["Spanish", "skill"], ["Garden space", "place"]],
    likes: ["Native plants", "Composting"],
    line: "Looking for someone to share a plot with next spring.", where: "Near the seed table" };
  var PEOPLE = [
    { id: "maya", name: "Maya R.", host: true, city: "Lynnwood", langs: ["English"],
      needs: [["Seed saving", "skill"], ["Volunteers on the day", "skill"]],
      offers: [["Soil testing", "skill"], ["Meeting room", "place"]], likes: ["Native plants"],
      line: "Ask me about the community plot.", where: "At the welcome table", hi: "" },
    { id: "tomas", name: "Tomas G.", city: "Everett", langs: ["English", "Spanish"],
      needs: [["Garden space", "place"]], offers: [["Rides to the farm", "thing"], ["Fence building", "skill"]],
      likes: ["Composting"], line: "I have a truck and Saturdays free.", where: "", hi: "both" },
    { id: "priya", name: "Priya K.", city: "Edmonds", langs: ["English", "Hindi"],
      needs: [["Canning tips", "skill"]], offers: [["Soil testing", "skill"], ["Pressure canner", "thing"]],
      likes: ["Native plants"], line: "", where: "", hi: "me" },
    { id: "dana", name: "Dana W.", city: "Bothell", langs: ["English"],
      needs: [["Seed saving", "skill"]], offers: [["Web design", "skill"]], likes: [],
      line: "Starting a seed library at my church.", where: "", hi: "" },
    { id: "lee", name: "Lee H.", city: "Mill Creek", langs: ["English", "Korean"],
      needs: [["Childcare swap", "skill"]], offers: [["Beekeeping", "skill"]], likes: ["Composting"],
      line: "", where: "", hi: "" }
  ];
  var st = { view: "before", sort: "me", filters: {} };
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function words(list) { return list.map(function (x) { return x[0]; }); }
  function overlap(a, b) { var B = words(b); return a.filter(function (x) { return B.indexOf(x[0]) >= 0; }); }
  function shared(a, b) { return a.filter(function (x) { return b.indexOf(x) >= 0; }); }
  function fit(p) {
    return { give: overlap(p.needs, ME.offers), get: overlap(p.offers, ME.needs),
      likes: shared(p.likes, ME.likes), langs: shared(p.langs, ME.langs).filter(function (l) { return l !== "English"; }) };
  }
  function chips(list, hits) {
    var H = words(hits || []);
    return '<div class="chips">' + list.map(function (x) {
      return '<span class="chip' + (H.indexOf(x[0]) >= 0 ? " hit" : "") + '">' + esc(x[0]) + '<small>' + esc(x[1]) + '</small></span>';
    }).join("") + '</div>';
  }
  function plain(list) { return '<div class="chips">' + list.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join("") + '</div>'; }
  function initial(n) { return esc(String(n || "?").charAt(0)); }

  function myCard() {
    return '<div class="person mine"><div class="av">' + initial("Y") + '</div><div>'
      + '<div class="top"><div><span class="nm">My Match up card</span><div class="meta">' + esc(ME.city) + ' · ' + esc(ME.langs.join(", ")) + '</div></div>'
      + '<button type="button" class="mp-btn">Edit</button></div>'
      + (ME.line ? '<p class="line">' + esc(ME.line) + '</p>' : "")
      + (ME.where ? '<p class="where">On the day, find me: ' + esc(ME.where) + '</p>' : "")
      + '<p class="cap">What I need</p>' + chips(ME.needs)
      + '<p class="cap">What I offer</p>' + chips(ME.offers)
      + '<div class="acts"><button type="button" class="tlink">Turn off Match up</button></div>'
      + '</div></div>';
  }
  function hiRow(p) {
    if (p.hi === "both") return '<span class="state found">You found each other</span><button type="button" class="mp-btn primary">Write</button>';
    if (p.hi === "me") return '<span class="state">You said hi. ' + esc(p.name.split(" ")[0]) + ' sees it only after saying hi to you too.</span>';
    return '<button type="button" class="mp-btn primary" data-hi="' + p.id + '">Say hi</button>';
  }
  function personCard(p) {
    var f = fit(p);
    var give = f.give.length ? chips(f.give, f.give) : '<p class="none">Nothing from what you each shared yet.</p>';
    var get = f.get.length ? chips(f.get, f.get) : '<p class="none">Nothing from what you each shared yet.</p>';
    var also = [];
    if (f.likes.length) also.push("You both care about " + f.likes.join(" and ") + ".");
    if (f.langs.length) also.push("You both speak " + f.langs.join(" and ") + ".");
    return '<div class="person"><div class="av">' + initial(p.name) + '</div><div>'
      + '<div class="top"><div><span class="nm">' + esc(p.name) + '</span>' + (p.host ? '<span class="lbl">Host</span>' : "")
      + '<div class="meta">' + esc(p.city) + ' · ' + esc(p.langs.join(", ")) + '</div></div>'
      + '<button type="button" class="tlink">Profile</button></div>'
      + (p.line ? '<p class="line">' + esc(p.line) + '</p>' : "")
      + (p.where ? '<p class="where">On the day, find ' + esc(p.name.split(" ")[0]) + ': ' + esc(p.where) + '</p>' : "")
      + '<p class="cap">Needs</p>' + chips(p.needs, f.give)
      + '<p class="cap">Offers</p>' + chips(p.offers, f.get)
      + '<div class="fit"><div class="fitbox"><p>You could offer them</p>' + give + '</div>'
      + '<div class="fitbox"><p>They could offer you</p>' + get + '</div></div>'
      + (also.length ? '<p class="help" style="margin:10px 0 0">' + esc(also.join(" ")) + '</p>' : "")
      + '<div class="acts">' + hiRow(p) + '</div>'
      + '</div></div>';
  }
  var FILTERS = [["give", "Needs I can meet"], ["get", "Offers I need"], ["likes", "Shared interests"], ["langs", "Language"]];
  function list() {
    var ppl = PEOPLE.slice();
    if (st.sort === "me") {
      ppl.sort(function (a, b) {
        var fa = fit(a), fb = fit(b);
        var sa = Math.min(fa.give.length, fa.get.length) * 10 + fa.give.length + fa.get.length + fa.likes.length * 0.5 + fa.langs.length * 0.5;
        var sb = Math.min(fb.give.length, fb.get.length) * 10 + fb.give.length + fb.get.length + fb.likes.length * 0.5 + fb.langs.length * 0.5;
        return sb - sa;
      });
    } else {
      var on = FILTERS.filter(function (x) { return st.filters[x[0]]; }).map(function (x) { return x[0]; });
      if (on.length) ppl = ppl.filter(function (p) { var f = fit(p); return on.some(function (k) { return f[k].length > 0; }); });
    }
    if (!ppl.length) return '<div class="empty">No one matches these filters yet. Turn one off to see more people.</div>';
    return ppl.map(personCard).join("");
  }
  function draw() {
    var h = '<h1>Match up</h1><p class="evt">' + esc(EVENT) + '</p>';
    if (st.view === "before") {
      h += '<p class="lead">See who else is coming and what they need and offer. Only people who enable Match up see each other.</p>'
        + '<p class="count">' + (PEOPLE.length) + ' people have enabled Match up so far.</p>'
        + '<button type="button" class="mp-btn primary big" id="enable">Enable Match up</button>'
        + '<p class="help" style="margin-top:12px">You choose what your card shows. You can change it or turn it off until Match up closes at the end of the event day.</p>';
    } else if (st.view === "closed") {
      h += '<div class="empty">Match up for this event has closed. It closed at the end of the event day. People you found each other with are still in your Messages.</div>'
        + '<h2>Keep meeting</h2><p class="help">Anyone who registered can start a group from this event, at any time.</p>'
        + '<button type="button" class="mp-btn primary">Start a group</button>';
    } else {
      h += '<p class="help">Only people who enable Match up see each other. ' + (PEOPLE.length + 1) + ' people have enabled it, you included. Match up closes at the end of the event day.</p>'
        + myCard()
        + '<h2>How should we sort?</h2><p class="help">Choose each time. Nothing is decided for you.</p>'
        + '<div class="seg"><button type="button" class="tab' + (st.sort === "me" ? " on" : "") + '" data-sort="me">Sort for me<span>Strongest fit both ways first</span></button>'
        + '<button type="button" class="tab' + (st.sort === "own" ? " on" : "") + '" data-sort="own">My own filters<span>You pick what to look for</span></button></div>';
      if (st.sort === "own") {
        h += '<div class="pills">' + FILTERS.map(function (x) { return '<button type="button" class="pill" data-f="' + x[0] + '" aria-pressed="' + (st.filters[x[0]] ? "true" : "false") + '">' + esc(x[1]) + '</button>'; }).join("") + '</div>';
      }
      h += '<h2>People who enabled Match up</h2><p class="help">Filled chips are where you fit. Offers can be a skill, a thing, or a place.</p>' + list();
    }
    $("page").innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll("#mock button"), function (b) { b.classList.toggle("on", b.getAttribute("data-v") === st.view); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null; if (!t) return;
    if (t.getAttribute("data-v")) { st.view = t.getAttribute("data-v"); draw(); return; }
    if (t.id === "enable") { st.view = "after"; draw(); return; }
    if (t.getAttribute("data-sort")) { st.sort = t.getAttribute("data-sort"); draw(); return; }
    if (t.getAttribute("data-f")) { var k = t.getAttribute("data-f"); st.filters[k] = !st.filters[k]; draw(); return; }
    if (t.getAttribute("data-hi")) { PEOPLE.forEach(function (p) { if (p.id === t.getAttribute("data-hi")) p.hi = "me"; }); draw(); return; }
  });
  draw();
})();
</script>
</body>
</html>
