<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Match up mockup · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1F699E;--ink:#1A2E42;--soft:#2F3D4F;--line:#DDE4EE;--panel:#F7FBFF;--panel-line:#C9DFF3;--tint:#E8F2F9;}
*{box-sizing:border-box}
body{margin:0;background:var(--brand);color:var(--ink);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;padding:0 16px 60px}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-top:24px}
.mock{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;font-size:13.5px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 16px}
.mock b{font-weight:800;margin-right:2px}
.mock button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:16px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.mock button.on{background:var(--brand);color:#fff}
.mock .note{flex-basis:100%;color:var(--soft);font-size:12.5px}
.head{background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin:0 0 14px}
.cover{width:48px;height:48px;border-radius:10px;background:#E8F2F9;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.head .t{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:800}
.head .d{font-size:13px;color:var(--soft)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.title{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px}
.title .h{font-size:20px;font-weight:800}
.title .s{font-size:13px;color:var(--soft);margin-top:4px}
.sortrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.seg{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.seg.on{background:var(--brand);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:1.5px solid #C9D6E2;background:#fff;color:var(--ink);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feed-card{background:#fff;border-radius:14px;padding:18px 20px}
.feed-card{border-left:5px solid transparent}.feed-card.comp{border-left-color:#D9781A}.feed-card.coseek{border-left-color:#7F77DD}.feed-card.share{border-left-color:#2E9E7A}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}.dot.comp{background:#D9781A}.dot.coseek{background:#7F77DD}.dot.share{background:#2E9E7A}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--soft);margin-top:12px}.key span{display:inline-flex;align-items:center;gap:6px}
.feed-card .kicker{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.feed-card .body{font-size:15px;line-height:1.5}
.feed-card .body b{font-weight:800}
.who-row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;background:#F7F9FC;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.who.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ph{width:26px;height:26px;border-radius:50%;background:#B7C4D6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.open{grid-column:1/-1;background:#fff;border-radius:14px;padding:20px 22px;border:2px solid var(--brand)}
.open .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.open .nm{font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px}
.lbl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);border:1px solid var(--panel-line);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.meta{font-size:13.5px;color:var(--soft);margin-top:2px}
.line{font-size:14px;margin:8px 0 0;font-style:italic}
.where{font-size:13px;color:var(--soft);margin:4px 0 0}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fitbox{background:var(--tint);border-radius:10px;padding:10px 12px}
.fitbox p{margin:0 0 6px;font-size:13px;font-weight:800}
.why{font-size:13.5px;line-height:1.45;margin:0 0 6px}.why:last-child{margin-bottom:0}.why b{font-weight:800}mark{background:var(--brand);color:#fff;font-weight:800;border-radius:6px;padding:0 6px}.fix{display:block;font-size:13px;margin-top:4px;color:var(--soft)}.fix a{color:var(--brand);font-weight:700}
.said{display:block;color:var(--soft);font-style:italic;margin-top:2px}
.fitbox .none{font-size:13px;font-weight:400;color:var(--soft);margin:0}
.cap{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:3px 10px;line-height:1.2}
.chip small{font-size:10.5px;font-weight:600;color:var(--soft)}
.chip.hit{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.hit small{color:#E8F2F9}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.mp-btn{font-size:13px;font-weight:700;padding:7px 14px;border-radius:24px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;white-space:nowrap}
.mp-btn.primary{background:var(--brand);color:#fff}
.tlink{color:var(--brand);font-weight:700;font-size:13.5px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.state{font-size:13.5px;color:var(--soft)}
.state.found{color:var(--brand);font-weight:800}
.help{font-size:13.5px;color:var(--soft);margin:10px 0 0}
.side{background:#fff;border-radius:14px;padding:16px 18px}
.sec{margin-bottom:20px}
.sec:last-child{margin-bottom:0}
.rs-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scap{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.rs-pill{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.rs-txt{font-size:13.5px;margin-top:6px;line-height:1.45}
.rs-link{color:var(--brand);font-size:13.5px;margin-top:6px;line-height:1.45}
.faces{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.faces .ph{width:32px;height:32px;font-size:12px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;cursor:pointer}
.box{background:#fff;border-radius:14px;padding:24px 28px}
.box .h{font-size:17px;font-weight:800}
.box p{font-size:14px;color:var(--soft);margin:6px 0 0}
.inp{display:block;width:100%;max-width:420px;border:1.5px solid #C9D6E2;border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;margin:8px 0 0;color:var(--ink);background:#fff}.opt{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 0}.fine{font-size:12.5px;color:var(--soft);margin:10px 0 0}.empty{background:#fff;border-radius:14px;padding:18px 22px;font-size:14px;grid-column:1/-1}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
@media (max-width:820px){.grid-2,.fit{grid-template-columns:1fr}}
@media (max-width:768px){.box{padding:20px 18px}.title,.open{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock" id="mock">
    <b>Mockup with sample people.</b>
    <button type="button" data-v="before">Before I turn it on</button>
    <button type="button" data-v="setup">Turning it on</button>
    <button type="button" data-v="after">After I turn it on</button>
    <button type="button" data-v="closed">After it closes</button>
    <span class="note">Nothing here is saved. The group feed on 2Appear, for one event. It always opens on your own matches, never the full list of people, even at an event of 1,000. Tap a person on a card to see how you fit both ways and Say hi.</span>
  </div>
  <div class="head"><div class="cover"></div><div><div class="t">Event: Saturday Seed Swap</div><div class="d">Sat, Nov 15 · Edmonds</div></div></div>
  <div class="cols">
    <div id="main"></div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<script src="https://2gather.network/nav/identity.js?v=60"></script>
<script>
(function () {
  var ME = { needs: [["Soil testing", "skill"], ["Rides to the farm", "thing"], ["Composting", "skill"]],
    offers: [["Seed saving", "skill"], ["Spanish", "skill"], ["Garden space", "place"]],
    said: { "Seed saving": "I save tomato and bean seed every fall and can show you how.", "Spanish": "Conversation practice, any level.", "Garden space": "A 10 by 20 foot bed in my back yard, sunny all afternoon.", "Soil testing": "My beds grow nothing and I want to know why.", "Rides to the farm": "I have no car on Saturdays.", "Composting": "Starting my first pile." },
    likes: ["Native plants"], langs: ["English", "Spanish"],
    line: "Looking for someone to share a plot with next spring.", where: "Near the seed table" };
  var P = {
    Maya: { name: "Maya R.", host: true, city: "Lynnwood", langs: ["English"], needs: [["Seed saving", "skill"], ["Volunteers on the day", "skill"]], offers: [["Soil testing", "skill"], ["Meeting room", "place"]], likes: ["Native plants"], line: "Ask me about the community plot.", where: "At the welcome table", hi: "" },
    Tomas: { name: "Tomas G.", city: "Everett", langs: ["English", "Spanish"], needs: [["Garden space", "place"]], offers: [["Rides to the farm", "thing"], ["Fence building", "skill"]], likes: [], line: "I have a truck and Saturdays free.", where: "", hi: "both" },
    Priya: { name: "Priya K.", city: "Edmonds", langs: ["English", "Hindi"], needs: [["Canning tips", "skill"]], offers: [["Soil testing", "skill"], ["Pressure canner", "thing"]], likes: ["Native plants"], line: "", where: "", hi: "me" },
    Dana: { name: "Dana W.", city: "Bothell", langs: ["English"], needs: [["Seed saving", "skill"]], offers: [["Web design", "skill"]], likes: ["Native plants"], line: "Starting a seed library at my church.", where: "", hi: "" },
    Lee: { name: "Lee H.", city: "Mill Creek", langs: ["English", "Korean"], needs: [["Childcare swap", "skill"], ["Composting", "skill"]], offers: [["Beekeeping", "skill"]], likes: [], line: "", where: "", hi: "" }
  };
  var CARDS = [
    { f: "get", k: "comp", kind: "MATCH", topic: "Soil testing", body: "You need <b>Soil testing</b>. Maya and Priya offer it", who: ["Maya", "Priya"] },
    { f: "give", k: "comp", kind: "MATCH", topic: "Garden space", body: "You offer <b>Garden space</b>: a 10 by 20 foot bed in my back yard. Tomas is looking for it", who: ["Tomas"] },
    { f: "give", k: "comp", kind: "MATCH", topic: "Seed saving", body: "You offer <b>Seed saving</b>. Maya and Dana are looking for it", who: ["Maya", "Dana"] },
    { f: "get", k: "comp", kind: "MATCH", topic: "Rides to the farm", body: "You need <b>Rides to the farm</b>. Tomas offers it", who: ["Tomas"] },
    { f: "likes", k: "coseek", kind: "SEEKING", topic: "Composting", body: "You and Lee are looking for <b>Composting</b>", who: ["Lee"] },
    { f: "likes", k: "share", kind: "IN COMMON", topic: "Native plants", body: "You and Maya, Priya and 1 more care about <b>Native plants</b>", who: ["Maya", "Priya", "Dana"] },
    { f: "langs", k: "share", kind: "IN COMMON", topic: "Spanish", body: "You and Tomas speak <b>Spanish</b>", who: ["Tomas"] }
  ];
  var FILTERS = [["give", "Needs I can meet"], ["get", "Offers I need"], ["likes", "Shared interests"], ["langs", "Language"]];
  var st = { view: "after", sort: "me", filters: {}, open: null };
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function first() {
    try { if (window.CW && typeof window.CW.me === "function") { var m = window.CW.me() || {}; var n = String(m.first || m.name || "").trim().split(" ")[0]; if (n) return n; } } catch (e) {}
    return "";
  }
  function words(l) { return l.map(function (x) { return x[0]; }); }
  function overlap(a, b) { var B = words(b); return a.filter(function (x) { return B.indexOf(x[0]) >= 0; }); }
  function chips(list, hits) {
    var H = words(hits || []);
    return '<div class="chips">' + list.map(function (x) { return '<span class="chip' + (H.indexOf(x[0]) >= 0 ? " hit" : "") + '">' + esc(x[0]) + '<small>' + esc(x[1]) + '</small></span>'; }).join("") + '</div>';
  }
  function chip(k, ci) {
    var on = st.open && st.open.k === k && st.open.ci === ci;
    return '<button type="button" class="who' + (on ? " on" : "") + '" data-k="' + k + '" data-ci="' + ci + '"><span class="ph">' + k.charAt(0) + '</span>' + k + (P[k].host ? " · host" : "") + '</button>';
  }
  function hiRow(k, p) {
    if (p.hi === "both") return '<span class="state found">You found each other</span><button type="button" class="mp-btn primary">Write</button>';
    if (p.hi === "me") return '<span class="state">You said hi. ' + k + ' sees it only after saying hi to you too.</span>';
    return '<button type="button" class="mp-btn primary" data-hi="' + k + '">Say hi</button>';
  }
  function fixLink(word, step) {
    return '<span class="fix">Incorrect? <a href="https://2gather.network/ikigai/' + step + '/?open=' + encodeURIComponent(word) + '" target="_blank" rel="noopener">Fix it on my profile</a> (opens a new tab)</span>';
  }
  function why(list, side, k) {
    return list.map(function (x) {
      var mine = ME.said[x[0]] ? '<span class="said">You wrote: ' + esc(ME.said[x[0]]) + '</span>' : "";
      return side === "you"
        ? '<div class="why">You said you offer <mark>' + esc(x[0]) + '</mark> (' + esc(x[1]) + '). ' + k + ' needs <mark>' + esc(x[0]) + '</mark>.' + mine + fixLink(x[0], "offerings") + '</div>'
        : '<div class="why">You said you need <mark>' + esc(x[0]) + '</mark>. ' + k + ' offers <mark>' + esc(x[0]) + '</mark> (' + esc(x[1]) + ').' + mine + fixLink(x[0], "needs") + '</div>';
    }).join("");
  }
  function person(k) {
    var p = P[k];
    var give = overlap(p.needs, ME.offers), get = overlap(p.offers, ME.needs);
    var none = '<p class="none">Nothing from what you each shared yet.</p>';
    var also = [];
    var likes = p.likes.filter(function (x) { return ME.likes.indexOf(x) >= 0; });
    if (likes.length) also.push("You both care about " + likes.join(" and ") + ".");
    var langs = p.langs.filter(function (x) { return x !== "English" && ME.langs.indexOf(x) >= 0; });
    if (langs.length) also.push("You both speak " + langs.join(" and ") + ".");
    return '<div class="open"><div class="top"><div><span class="nm">' + esc(p.name) + '</span>' + (p.host ? '<span class="lbl">Host</span>' : "")
      + '<div class="meta">' + esc(p.city) + ' · ' + esc(p.langs.join(", ")) + '</div></div>'
      + '<div style="display:flex;gap:12px;align-items:center"><button type="button" class="tlink">Profile</button><button type="button" class="mp-btn" data-close="1">Close</button></div></div>'
      + (p.line ? '<p class="line">' + esc(p.line) + '</p>' : "")
      + (p.where ? '<p class="where">On the day, find ' + k + ': ' + esc(p.where) + '</p>' : "")
      + '<div class="fit"><div class="fitbox"><p>You could offer them</p>' + (give.length ? why(give, "you", k) : none) + '</div>'
      + '<div class="fitbox"><p>They could offer you</p>' + (get.length ? why(get, "them", k) : none) + '</div></div>'
      + (also.length ? '<p class="help">' + esc(also.join(" ")) + '</p>' : "")
      + '<p class="cap">Needs</p>' + chips(p.needs, give)
      + '<p class="cap">Offers</p>' + chips(p.offers, get)
      + '<div class="acts">' + hiRow(k, p) + '</div></div>';
  }
  function side() {
    var mine = st.view === "after"
      ? '<div class="sec"><div class="rs-head"><span class="scap">My Match up</span><button type="button" class="rs-pill">Edit</button></div>'
        + '<div class="rs-txt" style="font-style:italic">' + esc(ME.line) + '</div>'
        + '<div class="rs-txt" style="color:var(--soft)">On the day, find me: ' + esc(ME.where) + '</div>'
        + '<p class="cap">What I need</p>' + chips(ME.needs) + '<p class="cap">What I offer</p>' + chips(ME.offers)
        + '<div class="rs-txt"><button type="button" class="tlink">Turn off Match up</button></div>'
        + '<div class="rs-txt" style="color:var(--soft)">Only people who turn on Match up see matches with each other. It closes at the end of the event day.</div></div>'
      : '<div class="sec"><span class="scap">Match up</span><div class="rs-txt">' + (st.view === "closed" ? "Closed at the end of the event day." : "Off for you.") + '</div></div>';
    return mine
      + '<div class="sec"><div class="rs-head"><span class="scap">The lobby</span><button type="button" class="rs-pill">View the lobby</button></div>'
      + '<div class="rs-link">14 skills · 11 interests · 6 things we can share · 4 requests</div></div>'
      + '<div class="sec"><div class="rs-head"><span class="rs-txt" style="margin:0">8 people at this event · hosted by Maya</span><button type="button" class="rs-pill">View people</button></div>'
      + '<div class="faces">' + ["M", "T", "P", "D", "L", "A", "K", "S"].map(function (n) { return '<span class="ph">' + n + '</span>'; }).join("") + '</div></div>';
  }
  function feed() {
    var list = CARDS.map(function (c, i) { return { c: c, i: i }; });
    if (st.sort === "own") {
      var on = FILTERS.filter(function (x) { return st.filters[x[0]]; }).map(function (x) { return x[0]; });
      if (on.length) list = list.filter(function (x) { return on.indexOf(x.c.f) >= 0; });
    }
    if (!list.length) return '<div class="empty">No matches with these filters yet. Turn one off to see more.</div>';
    var h = "";
    list.forEach(function (x, n) {
      var c = x.c, cnt = c.who.length;
      h += '<div class="feed-card ' + c.k + '"><div class="kicker"><span class="dot ' + c.k + '"></span>' + c.kind + " · " + esc(c.topic.toUpperCase()) + " · " + cnt + (cnt === 1 ? " PERSON" : " PEOPLE") + '</div>'
        + '<div class="body">' + c.body + '</div><div class="who-row">' + c.who.map(function (k) { return chip(k, x.i); }).join("") + '</div></div>';
      var rowEnd = (n % 2 === 1) || n === list.length - 1;
      if (st.open && rowEnd) {
        var inRow = list.slice(n - (n % 2), n + 1).some(function (y) { return y.i === st.open.ci; });
        if (inRow) h += person(st.open.k);
      }
    });
    return h;
  }
  function main() {
    if (st.view === "before") {
      return '<div class="box"><div class="h">See your matches at this event</div>'
        + '<p>Turn on Match up to see who here needs what you offer and offers what you need. Only people who turn it on see matches with each other.</p>'
        + '<p>5 people at this event have turned it on.</p>'
        + '<div style="margin-top:16px"><button type="button" class="btn" data-setup="1">Turn on Match up</button></div></div>';
    }
    if (st.view === "setup") {
      return '<div class="box"><div class="h">Your top three interests for this event</div>'
        + '<p>These help match you with people here. Add up to three.</p>'
        + '<input class="inp" type="text" placeholder="Interest 1" aria-label="Interest 1"><input class="inp" type="text" placeholder="Interest 2" aria-label="Interest 2"><input class="inp" type="text" placeholder="Interest 3" aria-label="Interest 3">'
        + '<p class="cap">Who sees them</p>'
        + '<label class="opt"><input type="radio" name="sh" checked> Share them with the people at this event</label>'
        + '<label class="opt"><input type="radio" name="sh"> Keep them private</label>'
        + '<p class="fine">You can always change your mind later.</p>'
        + '<div style="margin-top:16px"><button type="button" class="btn" id="on">Turn on Match up</button></div></div>';
    }
    if (st.view === "closed") {
      return '<div class="box"><div class="h">Match up has closed</div>'
        + '<p>It closed at the end of the event day. People you found each other with are still in your Messages.</p>'
        + '<p>Anyone who registered can start a group from this event, at any time.</p>'
        + '<div style="margin-top:16px"><button type="button" class="btn">Start a group</button></div></div>';
    }
    var nm = first();
    var t = '<div class="title"><div class="h">' + (nm ? esc(nm) + ", " : "") + '5 matches</div>'
      + '<div class="s">' + (st.sort === "me" ? "Ranked by strongest overlap with what you shared." : "Showing only what you picked.") + '</div>'
      + '<div class="sortrow"><button type="button" class="seg' + (st.sort === "me" ? " on" : "") + '" data-sort="me">Sort for me</button>'
      + '<button type="button" class="seg' + (st.sort === "own" ? " on" : "") + '" data-sort="own">My own filters</button></div>'
      + '<div class="key"><span><span class="dot comp"></span>Offer/need match</span><span><span class="dot coseek"></span>You both need this</span><span><span class="dot share"></span>In common</span></div>'
      + (st.sort === "own" ? '<div class="pills">' + FILTERS.map(function (x) { return '<button type="button" class="pill" data-f="' + x[0] + '" aria-pressed="' + (st.filters[x[0]] ? "true" : "false") + '">' + x[1] + '</button>'; }).join("") + '</div>' : "")
      + '</div>';
    return t + '<div class="grid-2">' + feed() + '</div>';
  }
  function draw() {
    $("main").innerHTML = main();
    $("side").innerHTML = side();
    Array.prototype.forEach.call(document.querySelectorAll("#mock button"), function (b) { b.classList.toggle("on", b.getAttribute("data-v") === st.view); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null; if (!t) return;
    if (t.getAttribute("data-v")) { st.view = t.getAttribute("data-v"); st.open = null; draw(); return; }
    if (t.getAttribute("data-setup")) { st.view = "setup"; draw(); return; }
    if (t.id === "on") { st.view = "after"; draw(); return; }
    if (t.getAttribute("data-sort")) { st.sort = t.getAttribute("data-sort"); st.open = null; draw(); return; }
    if (t.getAttribute("data-f")) { var f = t.getAttribute("data-f"); st.filters[f] = !st.filters[f]; st.open = null; draw(); return; }
    if (t.getAttribute("data-k")) {
      var k = t.getAttribute("data-k"), ci = Number(t.getAttribute("data-ci"));
      st.open = (st.open && st.open.k === k && st.open.ci === ci) ? null : { k: k, ci: ci }; draw(); return;
    }
    if (t.getAttribute("data-close")) { st.open = null; draw(); return; }
    if (t.getAttribute("data-hi")) { P[t.getAttribute("data-hi")].hi = "me"; draw(); return; }
  });
  draw();
  setTimeout(draw, 1500);
})();
</script>
</body>
</html>
