<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Event guest profile mockup · 2Gather</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1F699E;color:#1A2E42;font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.5}
.mockbar{background:#F7FBFF;border-bottom:1px solid #C9DFF3;color:#2F3D4F;font-size:12.5px;padding:8px 16px}.mockbar a{color:#1F699E;font-weight:700;margin-right:12px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;color:#fff;margin:0 0 24px}
.crumbs a{color:#fff;text-decoration:none;font-weight:500;opacity:.92}.crumbs .sep{opacity:.6}.crumbs .now{font-weight:800}
.card{background:#fff;border-radius:14px;padding:22px 24px;margin:0 0 14px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.av{width:72px;height:72px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex-shrink:0}
.nm{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:800;line-height:1.2}
.kick{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#2F3D4F;border:1px solid #C9DFF3;border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.meta{font-size:14px;color:#2F3D4F;margin-top:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:24px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer}.btn.p{background:#1F699E;color:#fff}
h2{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2F3D4F;margin:0 0 10px}
.line{font-size:15px;font-style:italic;margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#F7FBFF;border:1px solid #C9DFF3;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700}
.fine{font-size:12.5px;color:#5A6473;margin:0}
</style>
</head>
<body>
<div class="mockbar"><b>Mockup with sample people.</b> Nothing is saved. Only signed-in members can open an Event guest profile. <a href="../">Back to Match up</a></div>
<div class="wrap">
<div class="crumbs" id="crumbs"></div>
<div id="out"></div>
</div>
<script>
(function(){
var P=[{n:'Maya R.',c:'Lynnwood',l:['English'],line:'Ask me about the seed library.',w:'Near the seed table',need:['Seed saving','Volunteers on the day'],off:['Soil testing','Meeting room'],int:['Native plants','Seed saving','Composting'],host:1},
{n:'Tomas G.',c:'Everett',l:['English','Spanish'],line:'I have a truck and Saturdays free.',w:'By the front gate',need:['Garden space'],off:['Rides to the farm','Fence building'],int:['Walking','Pickleball','Gardening']},
{n:'Priya K.',c:'Edmonds',l:['English','Hindi'],line:'',w:'',need:['Canning tips'],off:['Soil testing','Pressure canner'],int:['Native plants','Cooking','Foraging']},
{n:'Dana W.',c:'Bothell',l:['English'],line:'Starting a seed library at my church.',w:'',need:['Seed saving'],off:['Web design'],int:['Native plants','Birdwatching']},
{n:'Lee H.',c:'Mill Creek',l:['English','Korean'],line:'',w:'',need:['Childcare swap','Composting'],off:['Beekeeping'],int:['Walking','Board games']},
{n:'Ana S.',c:'Seattle',l:['English'],line:'',w:'',need:[],off:['Grafting fruit trees'],int:['Gardening','Pottery']},
{n:'Ken B.',c:'Shoreline',l:['English'],line:'',w:'',need:['Bike repair'],off:[],int:['Hiking']},
{n:'Sofia L.',c:'Kirkland',l:['English','Spanish'],line:'',w:'',need:[],off:['Photography','Event planning'],int:['Hiking','Kayaking']}];
var C=['#B7C4D6','#9DB3CB','#C7B8D9','#A9CDB8','#E3C39E','#B7C4D6','#9DB3CB','#C7B8D9'];
var q=new URLSearchParams(location.search),re=q.get('re')||'lobby',i=Math.max(0,Math.min(7,Number(q.get('p'))||0)),p=P[i];
var back={lobby:['Lobby','../lobby/'],matches:['My matches','../matches/'],guests:['Guests','../guests/'],matchup:['Match up','../']}[re]||['Lobby','../lobby/'];
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})};
var chips=function(a){return a.length?'<div class="chips">'+a.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>':'<p class="fine">Nothing shared for this event.</p>'};
document.getElementById('crumbs').innerHTML='<a href="../">My events</a><span class="sep">/</span><a href="../">Saturday Seed Swap</a><span class="sep">/</span><a href="'+back[1]+'">'+back[0]+'</a><span class="sep">/</span><span class="now">Event guest profile</span>';
document.getElementById('out').innerHTML='<div class="card"><div class="top"><div class="av" style="background:'+C[i]+'">'+esc(p.n.charAt(0))+'</div><div><div class="nm">'+esc(p.n)+(p.host?'<span class="kick">Host</span>':'')+'</div><div class="meta">'+esc(p.c)+' · Languages spoken: '+esc(p.l.join(', '))+'</div></div><div class="acts"><button class="btn p" type="button">Say hi</button><button class="btn" type="button">Bookmark</button></div></div>'
+(p.line?'<p class="line" style="margin-top:14px">'+esc(p.line)+'</p>':'')
+(p.w?'<p class="meta">How to find '+esc(p.n.split(' ')[0])+' during the event: '+esc(p.w)+'</p>':'')+'</div>'
+'<div class="card"><h2>Top three interests for this event</h2>'+chips(p.int)+'</div>'
+'<div class="card"><h2>What '+esc(p.n.split(' ')[0])+' needs</h2>'+chips(p.need)+'<h2 style="margin-top:16px">What '+esc(p.n.split(' ')[0])+' offers</h2>'+chips(p.off)+'</div>'
+'<p class="fine" style="color:#fff">Only members who are signed in can see this page. It shows what this guest chose to share for this event.</p>';
})();
</script>
</body>
</html>
