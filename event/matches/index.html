<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My matches · 2Gather</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans','DM Sans',sans-serif;background:#1F699E;color:#1a1a2e;min-height:100vh;}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0;padding:0 14px;font-size:14px;font-weight:500;color:#fff;}
#crumbs a{color:#fff;text-decoration:none;}
#crumbs a:hover{text-decoration:underline;}
#crumbs .now{font-weight:800;}
#crumbs .sep{opacity:.6;}
.event-header{background:#fff;border-radius:14px;margin:24px 14px 14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
@media(max-width:700px){.event-header{margin-top:14px;}}
.event-title{font-size:17px;font-weight:700;color:#1a1a2e;line-height:1.2;}
.event-meta{font-size:12.5px;color:#2F3D4F;font-weight:600;margin-top:3px;}
.btn-lobby{background:#2d5282;color:#fff;border:1.5px solid #2d5282;border-radius:24px;padding:7px 14px;font-size:13px;font-weight:700;font-family:inherit;text-decoration:none;white-space:nowrap;}
.btn-lobby:hover{background:#1e3a5f;border-color:#1e3a5f;}
#panel{background:#fff;border-radius:12px;padding:22px 26px;max-width:660px;margin:0 auto 20px;box-shadow:0 24px 64px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.12);}
@media(max-width:700px){#panel{margin:0 14px 20px;padding:18px 16px;}}
.mp-title{font-size:16px;font-weight:700;color:#1A2E42;}
.mp-sub{font-size:13px;color:#2F3D4F;margin-top:2px;}
.mp-key{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#2F3D4F;padding:10px 0 14px;margin-bottom:4px;border-bottom:1px solid #DDE4EE;}
.mp-key span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.dot.share{background:#2E9E7A;}.dot.comp{background:#D9781A;}.dot.coseek{background:#7F77DD;}
.mp-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid #DDE4EE;}
.mp-key + .mp-row,.mp-search-wrap + .mp-row{border-top:none;padding-top:6px;}
.mp-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#EBF3FA;color:#185FA5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;overflow:hidden;}
.mp-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.mp-body{flex:1;min-width:0;}
.mp-name{font-size:14px;font-weight:700;color:#1A2E42;margin:0 0 4px;}
.mp-name a{color:inherit;text-decoration:none;}
.mp-name .host{font-size:11px;font-weight:700;color:#1F699E;margin-left:6px;}
.mp-line{font-size:13px;color:#2F3D4F;font-style:italic;margin-bottom:4px;overflow-wrap:anywhere;}
.mp-where{font-size:12px;color:#2F3D4F;margin-bottom:6px;overflow-wrap:anywhere;}
.mp-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.mp-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#1A2E42;}
.mp-item .dot{margin-top:6px;}
.mp-item-text{display:flex;flex-direction:column;overflow-wrap:anywhere;}
.mp-note{font-size:11px;color:#2F3D4F;margin-top:2px;}
.mp-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.mp-btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:24px;border:1.5px solid #1F699E;background:#fff;color:#1F699E;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center;line-height:1.3;}
.mp-btn:hover{background:#F1F7FC;}
.mp-btn.primary{background:#1F699E;color:#fff;}
.mp-btn.primary:hover{background:#185A88;border-color:#185A88;}
.mp-btn[disabled]{opacity:.6;cursor:default;}
.mp-search-wrap{padding:0 0 12px;}
.mp-search{width:100%;padding:10px 14px;border:1px solid #DDE4EE;border-radius:20px;font-size:14px;font-family:inherit;background:#F7F9FC;color:#1A2E42;}
.mp-search:focus{outline:none;border-color:#1F699E;background:#fff;}
.box .h{font-size:16px;font-weight:700;color:#1A2E42;margin-bottom:8px;}
.box p{font-size:14px;color:#2F3D4F;line-height:1.5;margin-top:8px;}
.box a{color:#1F699E;font-weight:700;}
.box .act{margin-top:16px;}
.box .act a{display:inline-block;background:#1F699E;color:#fff;border-radius:24px;padding:9px 18px;font-size:14px;font-weight:700;text-decoration:none;}
.wait{font-size:14px;font-weight:700;color:#1F699E;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1a2433;color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .3s ease;z-index:2000;max-width:92vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
@media(max-width:520px){.mp-row{flex-wrap:wrap;}.mp-actions{flex-direction:row;width:100%;padding-left:56px;}}
</style>
</head>
<body>
<div id="crumbs"><a href="https://2gather.network/myevents/">My events</a> <span class="sep" aria-hidden="true">/</span> <a id="crumb-ev" href="#">Event</a> <span class="sep" aria-hidden="true">/</span> <span class="now">My matches</span></div>
<div class="event-header">
  <div><div class="event-title" id="evt">My matches</div><div class="event-meta" id="evmeta"></div></div>
  <a class="btn-lobby" id="lobby" href="#">Back to lobby</a>
</div>
<div id="panel"><p class="wait">Looking for your matches</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/nav/identity.js?v=60"></script>
<script>
(function () {
  var GS = "https://cw-api-gate.jessieupp.workers.dev";
  var q = new URLSearchParams(location.search);
  var id = String(q.get("id") || "").trim();
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function me() {
    var m = "";
    try { if (window.CW && typeof window.CW.me === "function") { m = String(window.CW.me().id || "").trim(); } } catch (e) {}
    if (!m) { try { m = localStorage.getItem("appear-id") || ""; } catch (e) {} }
    return m;
  }
  function viewing() { try { return !!(window.CW && typeof window.CW.me === "function" && window.CW.me().viewing); } catch (e) { return false; } }
  function token() { try { return localStorage.getItem("cw-token") || ""; } catch (e) { return ""; } }
  var EV_URL = "https://2gather.network/event/?id=" + encodeURIComponent(id);
  var LOBBY = "https://2gather.network/attendees/?id=" + encodeURIComponent(id);
  var CHOICES = "https://2gather.network/event/matchup/?id=" + encodeURIComponent(id);
  var OFFER = ["skills", "values", "waysOfBeing", "interests", "hobbies", "domains", "professionalServices", "advocating", "openToWork"];
  var NEED = ["needs"];
  var IK = { skills: "ikigaiSkills", values: "ikigaiValues", interests: "ikigaiInterests", domains: "ikigaiDomains", needs: "ikigaiNeeds" };
  var st = { d: null, rows: [], q: "", marked: {} };

  function tokens(p, fields) {
    var out = {};
    fields.forEach(function (f) {
      (String(p[f] || "") + "|" + String(IK[f] ? p[IK[f]] || "" : "")).split(/[|,]/).forEach(function (t) {
        var w = String(t || "").split("~")[0].split(":")[0].trim(), low = w.toLowerCase();
        if (w.length > 1 && !out[low]) out[low] = w;
      });
    });
    return out;
  }
  function tops(p) { var o = {}; (p.topInterests || []).forEach(function (w) { w = String(w || "").trim(); if (w) o[w.toLowerCase()] = w; }); return o; }
  function both(a, b) { return Object.keys(a).filter(function (k) { return b[k]; }).map(function (k) { return a[k]; }); }
  function first(p) { return String(p.first || p.name || "Someone").trim().split(" ")[0]; }

  function compute(meP, people) {
    var mO = tokens(meP, OFFER), mN = tokens(meP, NEED), mT = tops(meP);
    var rows = [];
    people.forEach(function (p) {
      var pO = tokens(p, OFFER), pN = tokens(p, NEED), pT = tops(p);
      var get = both(pO, mN), give = both(mO, pN), co = both(mN, pN);
      var seen = {}, sh = [];
      both(mO, pO).concat(both(mT, pT), both(mT, pO), both(mO, pT)).forEach(function (w) { var k = w.toLowerCase(); if (!seen[k]) { seen[k] = 1; sh.push(w); } });
      if (!get.length && !give.length && !co.length && !sh.length) return;
      rows.push({ p: p, get: get, give: give, co: co, sh: sh });
    });
    rows.sort(function (a, b) {
      var ca = a.get.length + a.give.length, cb = b.get.length + b.give.length;
      return (cb - ca) || (b.co.length - a.co.length) || (b.sh.length - a.sh.length);
    });
    return rows;
  }
  function photo(p) {
    var ini = esc(first(p).charAt(0).toUpperCase());
    return '<div class="mp-photo">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : ini) + '</div>';
  }
  function profileUrl(p) { return p.code ? "https://2gather.network/hi/?v=" + encodeURIComponent(p.code) : ""; }
  function item(kind, word, note) {
    return '<div class="mp-item"><span class="dot ' + kind + '"></span><div class="mp-item-text"><span>' + esc(word) + '</span>' + (note ? '<span class="mp-note">' + esc(note) + '</span>' : "") + '</div></div>';
  }
  function row(r) {
    var p = r.p, nm = first(p), url = profileUrl(p);
    var items = r.get.map(function (w) { return item("comp", w, "you need it, " + nm + " offers it"); })
      .concat(r.give.map(function (w) { return item("comp", w, nm + " needs it, you offer it"); }))
      .concat(r.co.map(function (w) { return item("coseek", w, ""); }))
      .concat(r.sh.map(function (w) { return item("share", w, ""); })).join("");
    var name = url ? '<a href="' + esc(url) + '">' + esc(p.name || nm) + '</a>' : esc(p.name || nm);
    var marked = st.marked[p.code];
    return '<div class="mp-row">' + photo(p)
      + '<div class="mp-body"><div class="mp-name">' + name + (p.host ? '<span class="host">Host</span>' : "") + '</div>'
      + (p.line ? '<div class="mp-line">' + esc(p.line) + '</div>' : "")
      + (p.where ? '<div class="mp-where">How to find me during the event: ' + esc(p.where) + '</div>' : "")
      + '<div class="mp-list">' + items + '</div></div>'
      + '<div class="mp-actions">' + (url ? '<a class="mp-btn primary" href="' + esc(url) + '">Visit profile</a>' : "")
      + (p.code ? '<button type="button" class="mp-btn" data-bm="' + esc(p.code) + '"' + (marked ? " disabled" : "") + '>' + (marked ? "Bookmarked" : "Bookmark") + '</button>' : "")
      + '</div></div>';
  }
  function matchesWord(r, s) {
    var hay = [r.p.name, r.p.line, r.p.where].concat(r.get, r.give, r.co, r.sh).join(" ").toLowerCase();
    return hay.indexOf(s) > -1;
  }
  var KEY = '<div class="mp-key"><span><span class="dot comp"></span>Offer/need match</span><span><span class="dot coseek"></span>You both need this</span><span><span class="dot share"></span>In common</span></div>';
  function draw() {
    var d = st.d, total = st.rows.length;
    if (!d.on && !d.host) {
      $("panel").innerHTML = '<div class="box"><div class="h">See your matches at this event</div>'
        + '<p>Turn on Match up to see who here needs what you offer and offers what you need. Only people who turn it on see each other.</p>'
        + '<p>' + d.count + (d.count === 1 ? " person at this event has" : " people at this event have") + ' turned it on.</p>'
        + '<div class="act"><a href="' + esc(CHOICES) + '">Turn on Match up</a></div></div>';
      return;
    }
    if (!total) {
      $("panel").innerHTML = '<div class="box"><div class="h">You have no matches yet</div>'
        + '<p>A match is someone at this event who offers what you need, needs what you offer, or cares about what you care about.</p>'
        + '<p>Add what you need and offer to your profile and your matches show up here.</p>'
        + (d.host && !d.on ? '<p>You host this event. Turn on Match up so guests can match with you too. <a href="' + esc(CHOICES) + '">Turn on Match up</a></p>' : "")
        + '<div class="act"><a href="https://2gather.network/ikigai/">Fill in my profile</a></div>'
        + (d.on ? '<p><a href="' + esc(CHOICES) + '">Edit my Match up</a></p>' : "") + '</div>';
      return;
    }
    var s = st.q, list = s ? st.rows.filter(function (r) { return matchesWord(r, s); }) : st.rows;
    var title = s ? list.length + " of " + total + (total === 1 ? " match" : " matches") : total + (total === 1 ? " person matches you" : " people match you");
    var search = total > 5 ? '<div class="mp-search-wrap"><input type="text" class="mp-search" id="mp-search" placeholder="Search your matches" aria-label="Search your matches" value="' + esc(st.q) + '"></div>' : "";
    $("panel").innerHTML = '<div class="mp-title">' + esc(title) + '</div><div class="mp-sub">Most matches first' + (d.on ? ' · <a href="' + esc(CHOICES) + '" style="color:#1F699E;font-weight:700">Edit my Match up</a>' : "") + '</div>'
      + (d.host && !d.on ? '<p class="mp-sub">You host this event. <a href="' + esc(CHOICES) + '" style="color:#1F699E;font-weight:700">Turn on Match up</a> so guests can match with you too.</p>' : "")
      + KEY + search + (list.length ? list.map(row).join("") : '<p class="mp-sub" style="padding:20px 0">No matches for "' + esc(st.q) + '".</p>');
    var sf = $("mp-search");
    if (sf && st.q) { sf.focus(); var v = sf.value; sf.value = ""; sf.value = v; }
  }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(function () { el.classList.remove("show"); }, 2600); }
  document.addEventListener("input", function (e) { if (e.target && e.target.id === "mp-search") { st.q = String(e.target.value || "").toLowerCase().trim(); draw(); } });
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-bm]") : null; if (!b) return;
    var code = b.getAttribute("data-bm"); b.disabled = true;
    fetch(GS + "?action=saveBookmark&from=" + encodeURIComponent(me()) + "&meToken=" + encodeURIComponent(token()) + "&toCode=" + encodeURIComponent(code) + "&sourceKind=Event&sourceID=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r && r.status === "error") { b.disabled = false; toast(r.message || "That did not save. Try again."); return; }
        st.marked[code] = 1; b.textContent = "Bookmarked"; toast("Bookmarked");
      })
      .catch(function () { b.disabled = false; toast("That did not save. Try again."); });
  });
  function say(h) { $("panel").innerHTML = '<div class="box"><p>' + h + '</p></div>'; }
  if (!id) { $("crumbs").style.display = "none"; $("lobby").style.display = "none"; say('This page needs an event. <a href="https://2gather.network/myevents/">Go to My events</a>'); return; }
  $("crumb-ev").href = EV_URL; $("lobby").href = LOBBY;
  fetch(GS + "?action=getEventById&id=" + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) { var t = d && d.event && d.event.title; if (t) { $("evt").textContent = "Event: " + t; $("crumb-ev").textContent = t; document.title = "My matches · " + t + " · 2Gather"; } })
    .catch(function () {});
  function run(tries) {
    var who = me();
    if (viewing()) { say("You are viewing as someone else. Stop viewing as them first to use your matches."); return; }
    if (!who) {
      if (tries < 12) { setTimeout(function () { run(tries + 1); }, 500); return; }
      say('Sign in and register for this event to see your matches. <a href="' + esc(EV_URL) + '">Go to the event</a>');
      return;
    }
    fetch(GS + "?action=getEventPeople&matchup=1&nocache=1&appearId=" + encodeURIComponent(who) + "&meToken=" + encodeURIComponent(token()) + "&eventId=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || typeof d.on !== "boolean") { say("My matches opens soon. Check back later."); return; }
        if (!d.on && !d.host && !d.me) { say('Register for this event to see your matches. <a href="' + esc(EV_URL) + '">Go to the event</a>'); return; }
        st.d = d;
        if (d.on || d.host) $("evmeta").textContent = d.count + (d.count === 1 ? " person has" : " people have") + " turned on Match up";
        st.rows = compute(d.me || {}, d.people || []);
        draw();
      })
      .catch(function () { say("Your matches could not load just now. Reload the page to try again."); });
  }
  run(0);
})();
</script>
<script src="/nav/topbar.js?v=7.01" defer></script>
</body>
</html>
