<!-- Version: V1.00 | Date: 2026-09-05 | LAST CHANGE: first build, the public status page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Status · 2Gather">
<title>Status · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;
        --ok:#2E9E6B;--work:#B36A0F;--found:#1F699E;--muted:#8A94A3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  .card{background:#fff;border-radius:16px;padding:26px 28px;}
  h1{font-size:26px;font-weight:800;margin:0 0 8px;}
  .lede{font-size:15.5px;line-height:1.6;color:var(--soft);margin:0 0 4px;}

  /* The headline. It says nothing at all until the answer has arrived, because a page that
     claims everything is fine before it has looked is worse than a page that says nothing. */
  .head{display:flex;gap:12px;align-items:flex-start;margin:22px 0 4px;padding:16px 18px;
        border-radius:13px;background:var(--panel);border:1px solid var(--panel-line);}
  .head .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--muted);}
  .head .t{font-size:16.5px;font-weight:800;line-height:1.35;}
  .head .s{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.5;}
  .head.ok .dot{background:var(--ok);}
  .head.work .dot{background:var(--work);}

  h2.sec{font-size:15px;font-weight:800;margin:28px 0 10px;color:var(--ink);}
  .item{border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:10px;}
  .item .top{display:flex;gap:9px;align-items:baseline;}
  .item .name{font-size:15.5px;font-weight:800;line-height:1.35;flex:1;min-width:0;}
  .state{flex-shrink:0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
         color:#fff;border-radius:10px;padding:3px 9px;white-space:nowrap;}
  .state.looking{background:var(--work);}
  .state.found{background:var(--found);}
  .state.fixed{background:var(--ok);}
  .item .what{font-size:14px;line-height:1.6;color:var(--soft);margin-top:8px;}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:9px;font-weight:600;}
  .item .area{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brand);
              background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;padding:2px 8px;}
  .quiet{font-size:14.5px;color:var(--soft);line-height:1.6;}
  .tell{font-size:14px;line-height:1.65;color:var(--soft);margin-top:26px;padding-top:18px;
        border-top:1px solid var(--line);}
  .tell a{color:var(--brand);font-weight:700;text-decoration:none;}
  .foot{font-size:13px;color:rgba(255,255,255,.85);text-align:center;margin-top:18px;line-height:1.6;}
  .foot a{color:#fff;font-weight:700;text-decoration:none;}
  @media(max-width:700px){ .card{padding:22px 19px;} h1{font-size:23px;} }
</style>
<script src="/nav/identity.js?v=12"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Status</h1>
    <p class="lede">What is working, what is not, and what we are doing about it. Updated by the
      people who answer support, not automatically.</p>

    <div class="head" id="head">
      <span class="dot"></span>
      <div>
        <div class="t" id="headT">Checking...</div>
        <div class="s" id="headS">Reading the current list.</div>
      </div>
    </div>

    <div id="open"></div>
    <div id="recent"></div>

    <p class="tell">Something broken that is not here?
      <a href="/support/">Tell us</a> and it gets looked at. Every message reaches a person.</p>
  </div>
  <p class="foot"><a href="/">Back to 2Gather</a></p>
</div>

<script src="/nav/topbar.js?v=5.67" defer></script>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

  var STATES = {
    looking: { label: 'Looking into it', cls: 'looking' },
    found:   { label: 'Found the cause', cls: 'found' },
    fixed:   { label: 'Fixed',           cls: 'fixed' }
  };

  function when(v) {
    if (!v) return '';
    // T00:00:00 on purpose. A bare "2026-09-04" is read as UTC and then drawn in the reader's own
    // timezone, which puts every date a day early for anybody west of London.
    var d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v).trim()) ? String(v).trim() + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  }

  function draw(list) {
    var open   = list.filter(function (x) { return x.state !== 'fixed'; });
    var closed = list.filter(function (x) { return x.state === 'fixed'; });

    var h = $('head');
    h.className = 'head ' + (open.length ? 'work' : 'ok');
    if (open.length) {
      $('headT').textContent = open.length === 1
        ? 'One thing is being worked on'
        : open.length + ' things are being worked on';
      $('headS').textContent = 'Everything not listed below is working normally.';
    } else {
      $('headT').textContent = 'Everything is working';
      $('headS').textContent = closed.length
        ? 'Nothing open. What was recently fixed is below.'
        : 'Nothing open and nothing reported recently.';
    }

    var card = function (x) {
      var st = STATES[x.state] || STATES.looking;
      return '<div class="item">'
        + '<div class="top"><div class="name">' + esc(x.title) + '</div>'
        + '<span class="state ' + st.cls + '">' + st.label + '</span></div>'
        + (x.what ? '<div class="what">' + esc(x.what) + '</div>' : '')
        + '<div class="meta">'
          + (x.area ? '<span class="area">' + esc(x.area) + '</span> &nbsp;' : '')
          + (x.started ? 'Started ' + esc(when(x.started)) : '')
          + (x.updated ? ' &middot; updated ' + esc(when(x.updated)) : '')
        + '</div></div>';
    };

    $('open').innerHTML = open.length
      ? '<h2 class="sec">Open</h2>' + open.map(card).join('')
      : '';
    $('recent').innerHTML = closed.length
      ? '<h2 class="sec">Recently fixed</h2>' + closed.map(card).join('')
      : '';
  }

  // Design preview only. ?demo=1 draws example entries so the page can be looked at before
  // anything real has been published to it. It fetches nothing and is never the default.
  if (/[?&]demo=1(&|$)/.test(location.search)) {
    draw([
      { title: 'Cancelled events filled the calendar', state: 'fixed', area: 'Events',
        what: 'Twenty-six events cancelled on one day each drew a full card, so the calendar read as though the site were down. They now collapse into one line per venue.',
        started: '2026-09-04', updated: '2026-09-05' },
      { title: 'Sharing an event could hand out a broken link', state: 'fixed', area: 'Events',
        what: 'A link copied from the events page sometimes pointed at an address that did not exist, so whoever received it saw a page-not-found.',
        started: '2026-09-04', updated: '2026-09-05' },
      { title: 'Support messages were not reaching anybody', state: 'fixed', area: 'Support',
        what: 'Messages sent through the support page were saved but never passed on, so nobody answered them. Every one of them has been recovered.',
        started: '2026-08-30', updated: '2026-09-05' },
      { title: 'Events you posted may not appear under Hosting', state: 'looking', area: 'Events',
        what: 'If you did not tick the box linking your Appear page when you posted, your event does not show in My events. It is still live and people can still find it. We are changing how an event remembers who made it.',
        started: '2026-09-04', updated: '2026-09-05' },
      { title: 'The group stats line can take a long time', state: 'found', area: 'Groups',
        what: 'On My groups, "Synthesizing group stats..." can sit for a while before finishing. It does finish. We are making it say something honest while it waits.',
        started: '2026-09-03', updated: '2026-09-05' }
    ]);
    return;
  }

  fetch(GS + '?action=getStatusItems&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.status !== 'ok') { throw new Error('refused'); }
      draw(d.items || []);
    })
    .catch(function () {
      // Says what it does not know rather than claiming everything is fine.
      $('head').className = 'head';
      $('headT').textContent = 'We cannot read the list right now';
      $('headS').textContent = 'That is a fault with this page rather than with anything it reports. Try again in a minute.';
    });
})();
</script>
</body>
</html>
