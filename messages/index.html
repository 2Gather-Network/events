<div class="wrap">
  <div id="gp-tile-msg-sub" style="display:none;"></div>
  <div class="card" id="gp-messages"><span class="cw-loading">Opening your messages…</span></div>
</div>
<script>
(function(){
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  var box = document.getElementById('gp-messages');
  var meId = '';
  try { meId = (window.CW && CW.me && CW.me().id) || ''; } catch (e) {}
  if (!meId) {
    box.innerHTML = '';
    var p = document.createElement('div');
    p.style.cssText = 'font-size:16px;line-height:1.5;margin-bottom:14px;';
    p.textContent = 'Sign in to see your messages.';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = 'Sign in';
    b.onclick = function(){ window.location.href = 'https://2gather.network/signin/?next=' + encodeURIComponent(location.pathname + location.search); };
    box.appendChild(p); box.appendChild(b);
    return;
  }
  function token(){
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) { var o = JSON.parse(raw); if (o && o.t) return o.t; }
      return localStorage.getItem('cw-token') || '';
    } catch (e) { return ''; }
  }
  var to = '';
  try { to = new URLSearchParams(location.search).get('to') || ''; } catch (e) {}
  window.cwGroupMessages.init({ groupId: '', meId: meId, token: token, group: function(){ return {}; }, people: function(){ return []; }, iHost: function(){ return false; }, groupName: function(){ return ''; }, boxId: 'gp-messages' });
  window.cwGroupMessages.open(to);
})();
</script>
