<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;--line:#DDE4EE;--brand:#1F699E;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}
  .card{background:#fff;border-radius:14px;padding:24px 28px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:500;margin-bottom:16px;opacity:.92;}
  .breadcrumb .now{font-weight:800;}
  .breadcrumb a{color:#fff;text-decoration:none;cursor:pointer;}
  .cw-loading{display:inline-flex;align-items:center;gap:8px;background:#1F699E;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;white-space:nowrap;animation:cw-breathe 1.6s ease-in-out infinite;}
  @keyframes cw-breathe{0%,100%{opacity:1}50%{opacity:.62}}
  .btn{font:inherit;font-size:14px;font-weight:700;border-radius:22px;padding:8px 18px;cursor:pointer;border:1.5px solid #1F699E;background:#1F699E;color:#fff;}

</head>
<body>
<div class="wrap">
  <div id="gp-tile-msg-sub" style="display:none;"></div>
  <div class="breadcrumb" id="crumbs" style="display:none;"></div>
  <div class="card" id="gp-messages"><span class="cw-loading">Opening your messages…</span></div>
</div>
<script>
(function(){
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  var box = document.getElementById('gp-messages');
  var meId = '';
  try { meId = (window.CW && CW.me && CW.me().id) || ''; } catch (e) {}
  if (!meId) {
    box.innerHTML = '';
    var p = document.createElement('div');
    p.style.cssText = 'font-size:16px;line-height:1.5;margin-bottom:14px;';
    p.textContent = 'Sign in to see your messages.';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = 'Sign in';
    b.onclick = function(){ window.location.href = 'https://2gather.network/signin/?next=' + encodeURIComponent(location.pathname + location.search); };
    box.appendChild(p); box.appendChild(b);
    return;
  }
  function token(){
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) { var o = JSON.parse(raw); if (o && o.t) return o.t; }
      return localStorage.getItem('cw-token') || '';
    } catch (e) { return ''; }
  }
  var to = '';
  try { to = new URLSearchParams(location.search).get('to') || ''; } catch (e) {}
  var gid = '';
  try { gid = new URLSearchParams(location.search).get('group') || ''; } catch (e) {}
  var grp = {}, folks = [];
  function go(){
    window.cwGroupMessages.init({ groupId: '', meId: meId, token: token, group: function(){ return grp; }, people: function(){ return folks; }, iHost: function(){ return false; }, groupName: function(){ return String(grp.name || ''); }, boxId: 'gp-messages' });
    window.cwGroupMessages.open(to);
  }
  if (!gid) { go(); return; }
  var done = false;
  var once = function(){ if (done) return; done = true; go(); };
  setTimeout(once, 4000);
  fetch('https://cw-api-gate.jessieupp.workers.dev?action=getGroupBundle&groupId=' + encodeURIComponent(gid) + '&me=' + encodeURIComponent(meId))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.group) { grp = d.group; folks = (d.attendees || []).filter(function(p){ return p && p.code; }); }
      try {
        var cr = document.getElementById('crumbs');
        if (cr && d && d.group && d.group.name) {
          var sl = String(d.group.slug || '').split(',')[0].trim();
          var gh = sl ? 'https://2gather.network/group/' + encodeURIComponent(sl) : 'https://2gather.network/group/?id=' + encodeURIComponent(gid);
          cr.innerHTML = '';
          var a1 = document.createElement('a'); a1.textContent = 'My groups'; a1.href = 'https://2gather.network/mygroups/';
          var a2 = document.createElement('a'); a2.textContent = d.group.name; a2.href = gh;
          var nw = document.createElement('span'); nw.className = 'now'; nw.textContent = 'Direct messages';
          cr.appendChild(a1); cr.appendChild(document.createTextNode(' / ')); cr.appendChild(a2); cr.appendChild(document.createTextNode(' / ')); cr.appendChild(nw);
          cr.style.display = '';
        }
      } catch (e) {}
    }).catch(function(){}).then(once);
})();
</script>
<script>try{localStorage.removeItem('cw-super')}catch(e){}</script>
<script src="/nav/waiting-words.js?v=12"></script>

</body>
</html>
