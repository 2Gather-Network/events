<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in log</title>
<style>
html,body{background:#1F699E}
body{margin:0;min-height:100vh;font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,sans-serif;color:#1A2E42}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 60px}
.card{background:#fff;border-radius:14px;padding:22px 24px}
h1{font-size:22px;font-weight:800;margin:0 0 6px}
p{margin:0 0 14px;color:#2F3D4F;font-size:15px}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #DDE4EE;border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5;margin:0 0 14px;color:#1A2E42}
button{background:#1F699E;color:#fff;border:0;border-radius:24px;padding:11px 18px;min-height:44px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid #1F699E;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Sign-in log</h1>
<p>The last steps this browser took about your sign-in, newest last. It holds only times and steps, no names or passes.</p>
<pre id="log">Reading the log…</pre>
<button id="cp" type="button">Copy the log</button>
</div></div>
<script>
(function(){
  var lines=[];
  try{lines=JSON.parse(localStorage.getItem('cw-jump-log')||'[]');}catch(e){}
  var pre=document.getElementById('log');
  var now='Opened '+new Date().toLocaleString()+' on '+location.hostname;
  var token='';try{token=localStorage.getItem('cw-token')||'';}catch(e){}
  var exp=parseInt(token.split('.')[1],10);
  var state=token?(exp?('Signed in here, sign-in ends '+new Date(exp).toLocaleString()):'Signed in here'):'Not signed in here';
  var text=now+'\n'+state+'\n\n'+(lines.length?lines.join('\n'):'Nothing recorded yet.');
  pre.textContent=text;
  document.getElementById('cp').onclick=function(){
    var b=this;
    function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy the log';},1500);}
    try{navigator.clipboard.writeText(text).then(ok,function(){pre.focus();var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r);});}
    catch(e){var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r);}
  };
})();
</script>
</body>
</html>
