<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);overflow-x:clip;overflow-wrap:break-word;
       font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{display:flex;justify-content:center;padding:48px 16px 70px;}
  .card{background:#fff;border-radius:16px;padding:34px 34px 30px;max-width:440px;width:100%;}
  h1{font-size:23px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  p{font-size:15px;color:var(--soft);line-height:1.6;margin:0;}
  a.btn{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:24px;padding:14px 24px;
        font-weight:700;text-decoration:none;margin-top:22px;}
  a.quiet{display:block;text-align:center;color:var(--brand);font-weight:700;text-decoration:none;margin-top:14px;font-size:14px;}
  .hide{display:none;}
  @media(max-width:768px){.card{padding:28px 22px 24px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="t">One moment</h1>
    <p id="s">Bringing your sign-in with you.</p>
    <a class="btn hide" id="b" href="/signin/">Sign in</a>
    <a class="quiet hide" id="q" href="/">Go to the front page</a>
  </div>
</div>
<script>
(function () {
  var GATE = 'https://cw-api-gate.jessieupp.workers.dev';
  var SITES = { gather: 'https://2gather.network', appear: 'https://2appear.network' };
  var NAMES = { gather: '2Gather', appear: '2Appear' };
  var STATE_KEY = 'cw-carry-state';

  function $(id) { return document.getElementById(id); }
  function hereSite() {
    var o = location.protocol + '//' + location.host;
    for (var k in SITES) { if (SITES[k] === o) { return k; } }
    return '';
  }
  function safeNext(v) {
    v = String(v || '');
    if (v.charAt(0) !== '/' || v.charAt(1) === '/' || /[\\\u0000-\u001f\u007f]/.test(v) || v.length > 500) { return '/'; }
    return v;
  }
  function frag() {
    var out = {};
    String(location.hash || '').replace(/^#/, '').split('&').forEach(function (p) {
      if (!p) { return; }
      var i = p.indexOf('=');
      var k = i < 0 ? p : p.slice(0, i);
      var v = i < 0 ? '' : p.slice(i + 1);
      try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) {}
    });
    return out;
  }
  function wipeHash() { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  function ss(fn) { try { return fn(); } catch (e) { return null; } }
  function randomState() {
    var a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  function say(title, text, signinNext) {
    document.title = title;
    $('t').textContent = title;
    $('s').textContent = text;
    if (signinNext) {
      $('b').href = '/signin/?next=' + encodeURIComponent(signinNext);
      $('b').classList.remove('hide');
    }
    $('q').classList.remove('hide');
  }
  function signedInHere() {
    try {
      var t = String(localStorage.getItem('cw-token') || '');
      var id = String(localStorage.getItem('cw-id') || localStorage.getItem('appear-id') || '');
      var exp = parseInt(t.split('.')[1], 10);
      return !!(t && id && exp && Date.now() < exp - 60000);
    } catch (e) { return false; }
  }
  function post(path, body) {
    return fetch(GATE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      referrerPolicy: 'no-referrer'
    }).then(function (r) { return r.json(); });
  }
  function keep(d) {
    localStorage.setItem('cw-id', d.appearId);
    localStorage.setItem('appear-id', d.appearId);
    if (d.firstName) { localStorage.setItem('cw-first', d.firstName); }
    localStorage.setItem('cw-token', d.editToken);
    var norm = String(d.appearId).split('.').join('').toLowerCase();
    var exp = parseInt(String(d.editToken).split('.')[1], 10) || Date.parse(d.expiresAt) || 0;
    localStorage.setItem('cw-edit-' + norm, JSON.stringify({ t: d.editToken, exp: exp }));
  }

  var f = frag();
  var here = hereSite();
  var next = safeNext(f.next);
  wipeHash();

  if (!here) { say('This page only works on our sites', 'Open the link again from the page you were on.'); return; }

  if (f.code) {
    var kept = ss(function () { return sessionStorage.getItem(STATE_KEY); });
    ss(function () { sessionStorage.removeItem(STATE_KEY); });
    if (!kept || !f.state || kept !== f.state) {
      say('Please sign in here', 'We could not bring your sign-in across this time, so ' + NAMES[here] + ' needs you to sign in once.', next);
      return;
    }
    post('/carry/redeem', { code: f.code, state: f.state }).then(function (d) {
      if (!d || d.status !== 'ok' || !d.editToken || !d.appearId) { throw new Error('refused'); }
      keep(d);
      location.replace(next);
    }).catch(function () {
      say('Please sign in here', 'We could not bring your sign-in across this time, so ' + NAMES[here] + ' needs you to sign in once.', next);
    });
    return;
  }

  if (f.to) {
    if (!SITES[f.to] || f.to === here || !/^[0-9a-f]{32,}$/.test(String(f.state || ''))) {
      say('This link did not work', 'Go back and tap the link again.');
      return;
    }
    if (!signedInHere()) {
      say('You are not signed in on ' + NAMES[here], 'Sign in here first, then tap the link again.', next);
      return;
    }
    var readyKey = 'cw-carry-ready-' + f.to;
    var ready = ss(function () { return sessionStorage.getItem(readyKey); });
    ss(function () { sessionStorage.removeItem(readyKey); });
    var token = localStorage.getItem('cw-token') || '';
    var me = localStorage.getItem('cw-id') || localStorage.getItem('appear-id') || '';
    var getReady = ready
      ? Promise.resolve(ready)
      : (say('One moment', 'Getting your sign-in ready for ' + NAMES[f.to] + '. This can take up to half a minute.'),
         fetch(GATE + '?action=carryReady&appearId=' + encodeURIComponent(me) + '&site=' + encodeURIComponent(f.to) +
               '&meToken=' + encodeURIComponent(token), { referrerPolicy: 'no-referrer' })
           .then(function (r) { return r.json(); })
           .then(function (d) {
             if (!d || d.status !== 'ok' || !d.pass) { throw new Error('refused'); }
             return post('/carry/ready', { pass: d.pass, appearId: d.appearId, firstName: d.firstName || '', expiresAt: d.expiresAt, site: d.site || f.to });
           })
           .then(function (d) {
             if (!d || !d.readyId) { throw new Error('refused'); }
             return d.readyId;
           }));
    getReady.then(function (readyId) {
      return post('/carry/issue', { readyId: readyId, to: f.to, state: f.state });
    }).then(function (d) {
      if (!d || d.status !== 'ok' || !d.code) { throw new Error('refused'); }
      location.replace(SITES[f.to] + '/carry/#code=' + encodeURIComponent(d.code) +
        '&state=' + encodeURIComponent(f.state) + '&next=' + encodeURIComponent(next));
    }).catch(function () {
      say('We could not bring your sign-in across', 'You can still sign in on ' + NAMES[f.to] + ' yourself.');
      $('b').href = SITES[f.to] + '/signin/?next=' + encodeURIComponent(next);
      $('b').textContent = 'Sign in on ' + NAMES[f.to];
      $('b').classList.remove('hide');
    });
    return;
  }

  if (f.from && SITES[f.from] && f.from !== here) {
    if (signedInHere()) { location.replace(next); return; }
    var st = randomState();
    if (!ss(function () { sessionStorage.setItem(STATE_KEY, st); return true; })) {
      say('Please sign in here', NAMES[here] + ' needs you to sign in once.', next);
      return;
    }
    location.replace(SITES[f.from] + '/carry/#to=' + here + '&state=' + st + '&next=' + encodeURIComponent(next));
    return;
  }

  location.replace(next);
})();
</script>
</body>
</html>
