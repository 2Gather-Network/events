<html>
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Are you the host? · 2Gather">
<title>Are you the host? · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{ --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#2F3D4F; --line:#DDE4EE; --brand:#1F699E; --info:#E8F2F9; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:620px;margin:0 auto;padding:24px 16px 60px;}
  .card{background:var(--card);border-radius:16px;padding:24px 22px;}
  h1{font-size:22px;font-weight:800;margin:0 0 6px;line-height:1.3;}
  .lede{font-size:15px;color:var(--soft);margin:6px 0 16px;line-height:1.55;}
  .info{background:var(--info);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);margin:0 0 16px;}
  .opt{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;margin:0 0 10px;cursor:pointer;}
  .opt input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--brand);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:22px;padding:11px 20px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;border:1.5px solid var(--brand);}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);}
  .btn[disabled]{opacity:.6;cursor:default;}
  .status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;display:none;}
  .status.err{display:block;background:#FBE9E7;border:1px solid #E8B0A5;color:#7A2410;}
</style>
  <script src="/nav/identity.js?v=60"></script>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><p class="lede">Looking up this event\u2026</p></div>
</div>
<script>
(function(){
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var q = new URLSearchParams(location.search);
  var hp = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
  var eid = String(q.get('e') || '').trim(), key = String(hp.get('k') || q.get('k') || '').trim();
  try { history.replaceState(null, '', location.pathname + (eid ? '?e=' + encodeURIComponent(eid) : '')); } catch (e) {}
  var card = document.getElementById('card');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };
  var evUrl = 'https://2gather.network/event/?id=' + encodeURIComponent(eid);
  var say = function(h, p, btns){ card.innerHTML = '<h1>' + h + '</h1>' + (p ? '<p class="lede">' + p + '</p>' : '') + (btns ? '<div class="actions">' + btns + '</div>' : ''); };
  if (!eid || !key) { say('This link is missing a piece', 'Open the link from your email again, all of it.'); return; }
  var me = (window.CW && CW.me) ? CW.me() : { id: '' };
  if (me.viewing) { say('You are viewing as someone else', 'Stop viewing as them first. Only the person this email went to can answer it.'); return; }
  var id = (window.CW && CW.realMe) ? CW.realMe().id : '';
  var pass = (window.CW && CW.passParam) ? CW.passParam() : '';
  if (!id || !pass) {
    say('Are you the host of this event?', 'Sign in with the address this email came to. If you have no 2Gather account, sign up with that address in the same step. Then open the link in your email again.',
      '<a class="btn primary" href="https://2gather.network/signin/">Sign in or sign up</a>');
    return;
  }
  fetch(GS_URL + '?action=getEventSeen&hostInvite=1&eventId=' + encodeURIComponent(eid) + '&key=' + encodeURIComponent(key) + '&appearId=' + encodeURIComponent(id) + pass + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.status !== 'ok') {
        if (d && d.code === 'signin') { say('Sign in again', 'Your sign-in ended. Sign in, then open the link in your email again.', '<a class="btn primary" href="https://2gather.network/signin/">Sign in</a>'); return; }
        if (d && d.code === 'otherAddress') { say('Sign in with the address we wrote to', esc(d.message)); return; }
        say('This link does not work', esc((d && d.message) || 'Ask the person who shared the event to send it again.'));
        return;
      }
      if (d.state === 'confirmed') { say('This was already answered', 'The host confirmed.', '<a class="btn primary" href="' + esc(evUrl) + '">See the event</a>'); return; }
      if (d.state !== 'pending') { say('This link was already answered', 'If you meant to answer differently, ask the person who shared the event to send it again.'); return; }
      if (d.youSharedIt) { say('You shared this event', 'This link is for the person you named as host. Send them the email, or ask again from the event page.', '<a class="btn ghost" href="' + esc(evUrl) + '">Back to the event</a>'); return; }
      var who = esc(d.sharedBy), first = esc(String(d.sharedBy || '').split(/\s+/)[0]);
      card.innerHTML = '<h1>Are you the host of ' + esc(d.title) + '?</h1>'
        + '<p class="lede">' + who + ' shared it on 2Gather and named ' + esc(d.host || 'you') + ' as its host.</p>'
        + '<div class="info">Say yes and the event is yours: you edit it, turn on registration and write to your guests.</div>'
        + '<p style="font-size:15px;font-weight:700;margin:0 0 8px;">Keep ' + first + ' as a co-host?</p>'
        + '<label class="opt"><input type="radio" name="keep" value="1"> Yes, ' + first + ' helps run it</label>'
        + '<label class="opt"><input type="radio" name="keep" value="0" checked> No, ' + first + ' keeps socializing it only</label>'
        + '<div class="actions"><button type="button" class="btn ghost" id="no">Not me</button><button type="button" class="btn primary" id="yes">Yes, I\u2019m the host</button></div>'
        + '<div class="status" id="st"></div>';
      var send = function(ans){
        var y = document.getElementById('yes'), n = document.getElementById('no'), st = document.getElementById('st');
        var keep = (document.querySelector('input[name=keep]:checked') || {}).value === '1' ? '1' : '0';
        y.disabled = n.disabled = true; st.className = 'status'; st.textContent = '';
        (ans === 'yes' ? y : n).textContent = 'Saving\u2026';
        fetch(GS_URL + '?action=socialize&hostAnswer=' + ans + '&id=' + encodeURIComponent(eid) + '&key=' + encodeURIComponent(key) + '&keep=' + keep + '&appearId=' + encodeURIComponent(id) + pass + '&t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(a){
            if (a && a.status === 'ok') {
              try { sessionStorage.setItem('cw-wrote-at', String(Date.now())); } catch (e) {}
              if (ans === 'yes') { say('You\u2019re the host of ' + esc(d.title), 'It\u2019s yours to edit now. We told ' + who + '.', '<a class="btn primary" href="' + esc('https://2gather.network/event/?id=' + encodeURIComponent(a.eventId || eid)) + '">Go to my event</a>'); }
              else { say('Thanks for telling us', 'We told ' + who + ' you are not the host. Nothing changed on your account.'); }
              return;
            }
            y.disabled = n.disabled = false; y.textContent = 'Yes, I\u2019m the host'; n.textContent = 'Not me';
            st.className = 'status err'; st.textContent = (a && a.message) || 'That did not go through. Try again.';
          })
          .catch(function(){ y.disabled = n.disabled = false; y.textContent = 'Yes, I\u2019m the host'; n.textContent = 'Not me'; st.className = 'status err'; st.textContent = 'Could not reach the server. Try again in a moment.'; });
      };
      document.getElementById('yes').onclick = function(){ send('yes'); };
      document.getElementById('no').onclick = function(){ send('no'); };
    })
    .catch(function(){ say('Could not reach the server', 'Try again in a moment.'); });
})();
</script>
<script src="/nav/topbar.js?v=6.98" defer></script>
</body>
</html>
