<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function _hiAddress(name){
    var q = '';
    try {
      var u = new URLSearchParams(window.CW_Q0 !== undefined ? window.CW_Q0 : location.search);
      ['v','p','hi'].forEach(function(k){ u.delete(k); });
      q = u.toString();
    } catch (e) {}
    return '/hi/' + encodeURIComponent(name) + (q ? '?' + q : '');
  }
  function _param(k){ try{ return new URLSearchParams(window.CW_Q0 !== undefined ? window.CW_Q0 : location.search).get(k)||''; }catch(e){ return ''; } }
  var _pubCode = (_param('p')||'').trim().toLowerCase();
  var _viewCode = (_param('v')||'').trim().toLowerCase();
  var _idFromUrl = _param('id')||_param('show')||_param('CWid')||_param('me')||_param('memberCard')||_param('appearId')||'';
  var _id = _idFromUrl;
  if(!_id && !(window.CW && CW.signedOutView && CW.signedOutView())){ try{ _id = String(localStorage.getItem('appear-id')||localStorage.getItem('cw-id')||'').trim(); }catch(e){ _id=''; } }
  var _viewing = false;
  try {
    if (window.CW && CW.me) {
      var _who = CW.me();
      if (_who.viewing && _who.id) { _id = _who.id; _viewing = true; }
    }
  } catch(e){}
  var _profilePhoto='', _profileName='', _loaded={}, _pageLink='', _said={};
  function _pvTidy(v){
    return String(v || '')
      .replace(/\.\s*,/g, ',')      
      .replace(/\.\s+/g, ', ')      
      .replace(/\.\s*$/, '')        
      .replace(/,\s*,/g, ',')
      .replace(/\s{2,}/g, ' ')
      .replace(/,\s*$/, '')
      .trim();
  }
  var _TAG_TYPES='(?:skill|space|thing|person|work|stuff|money|time|care|local)';
  function _untag(v){
    var t=String(v||'');
    if(t.indexOf(':')<0) return t;
    return t.split('|').map(function(x){ return x.replace(new RegExp('(?::'+_TAG_TYPES+')+(?::[^|]*)?$','i'),'').trim(); })
            .filter(Boolean).join(', ');
  }
  function _tagShaped(v){
    var parts=String(v||'').split('|').filter(Boolean);
    return parts.length>0 && parts.every(function(x){ return new RegExp(':'+_TAG_TYPES+'(?::|$)','i').test(x); });
  }
  var PV_SAID_ON = (function(){ try { return new URLSearchParams(window.CW_Q0 !== undefined ? window.CW_Q0 : location.search).get('said') === '1'; } catch (e) { return false; } })();
  function pvSaid(key, pills){
    if(!PV_SAID_ON) return '';
    var v=_pvTidy(_untag(_said&&_said[key]));
    if(!v) return '';
    if(pills && pills.length){
      var have={}; pills.forEach(function(n){ have[String(n||'').toLowerCase().replace(/^📍\s*/,'').trim()]=1; });
      var bits=v.split(/\s*,\s*/).filter(Boolean);
      if(bits.length && bits.every(function(b){ return have[b.toLowerCase()]; })) return '';
    }
    return '<div class="pv-said">'+esc(v)+'</div>';
  }
  function _capFirst(v){ v=String(v||''); return v ? v.charAt(0).toUpperCase()+v.slice(1) : v; }
  var EXPRESSION_ADDED = [''];
  function parseNeedsStr(str){
    if(!str) return [];
    return String(str).split('|').filter(Boolean).map(function(s){
      var detail=''; var tio=s.indexOf('~');
      if(tio>-1){ try{ detail=decodeURIComponent(s.slice(tio+1)); }catch(e){ detail=s.slice(tio+1); } s=s.slice(0,tio); }
      var p=s.split(':'); var item=p[0]; var local=false, ntype='skill', category='';
      if(p[1]==='local'){ local=true; ntype=p[2]||'skill'; category=p.slice(3).join(':'); }
      else { ntype=p[1]||'skill'; category=p.slice(2).join(':'); }
      return {item:item, category:category, local:local, ntype:ntype, detail:detail};
    });
  }
  function parseTagStr(str,lk){
    if(!str) return [];
    return String(str).split('|').filter(Boolean).map(function(s){
      var p=s.split(':'); var o={item:p[0],category:p.length>=3?p[1]:''}; o[lk]=p.length>=3?(p[2]||''):(p[1]||''); return o;
    });
  }
  function loadProfile(d){
    window._profRaw = d; window._profFound = true;
    NEEDS_ADDED = []; ENJOY_ADDED = []; SKILLS_ADDED = []; SKILL_METHODS_ON = [];
    VALUES_ADDED = []; DOMAINS_ADDED = []; WORK_VALUES_ADDED = []; EXPRESSION_ADDED = ['']; SECTIONS[4].data = [];
    try{
      _loaded={ postal:d.postal||'', retired:d.retired||'', bringType:d.bringType||'', wantsSignupList:d.wantsSignupList||'', languages:d.languages||'', photoURL:d.photoURL||'' };
      if(!_profilePhoto && d.photoURL) _profilePhoto=String(d.photoURL);
      _said={ need:String(d.introNeed||'').trim(), enjoy:String(d.introEnjoy||'').trim(),
              skills:String(d.introSkills||'').trim(), values:String(d.introValues||'').trim(),
              offer:String(d.introOffer||'').trim() };
      WORK_VALUES_ADDED = String(d.workValues||'').split('|').map(function(x){ return x.trim(); }).filter(Boolean);
      var _thingKinds = {'money':1,'physical goods':1,'consumables':1,'living things':1};
      NEEDS_ADDED = parseNeedsStr(d.needs||'').filter(function(n){
        if (n.ntype === 'work' && !_thingKinds[String(n.item||'').trim().toLowerCase()]) {
          if (WORK_VALUES_ADDED.map(function(x){ return x.toLowerCase(); }).indexOf(String(n.item).trim().toLowerCase()) < 0) WORK_VALUES_ADDED.push(String(n.item).trim());
          return false;
        }
        return true;
      }).map(function(n){ return { item:n.item, type:(n.ntype==='skill'?'person':n.ntype==='space'?'space':'thing'), category:n.category||'', level:'', local:!!n.local, detail:n.detail||'', work:(n.ntype==='work') }; });
      ENJOY_ADDED = parseTagStr(d.interests||'','level').map(function(x){ return { t:x.item, sel:(x.level?String(x.level).split(',').map(function(s){return s.trim();}).filter(Boolean):[]) }; });
      SKILLS_ADDED = parseTagStr(d.skills||'','level').map(function(x){ return { t:x.item, cat:x.category||'', level:x.level||'' }; });
      SKILL_METHODS_ON = (d.methods||'').split('|').filter(Boolean);
      VALUES_ADDED = parseTagStr(d.values||'','level').map(function(x){ return { t:x.item, lvl:x.level||'' }; });
      DOMAINS_ADDED = parseTagStr(d.domains||'','level').map(function(x){ return { t:x.item, lvl:x.level||'' }; });
      var ea=(d.expression||'').split('|').filter(Boolean); EXPRESSION_ADDED = ea.length?ea:[''];
      SECTIONS[4].data = (d.haves||'').split('|').filter(Boolean).map(function(t){ var p=t.split(':'); return { text:p[0]||'', cats:(p.length>1?[p.slice(1).join(':')]:[]), level:'', aud:'' }; });
    }catch(e){
      window._loadError = String((e && e.stack) || e);
      try { console.error('loadProfile failed:', e); } catch (e2) {}
    }
  }

  var CORE_CATS = ['Home & Transportation','Business & Finance','Skills & Services','Food & Drink'];
  var MORE_CATS = ['Nature & Outdoors','Events & Gatherings','Arts & Media','Pets & Animal Care','Health & Wellness','Education & Learning','Environment','Housing & Land'];

  var SECTIONS = [
    { tab:'Needs', base:'My needs', custom:'needs', data:[] },
    { tab:'Enjoy', base:'What I enjoy', custom:'enjoy', data:[] },
    { tab:'Skills', base:'My skills', custom:'skills', data:[] },

  function wireSearch(inp, results, poolFn, onPick, onOther){
    inp.addEventListener('input', function(){
      results.innerHTML='';
      var raw=inp.value.trim();
      var q=raw.toLowerCase();
      if(q.length<2){ results.style.display='none'; return; }
      var seen={}, hits=[], exact=false;
      poolFn().forEach(function(p){ var n=p.name.toLowerCase(); if(n===q) exact=true; if(n.indexOf(q)===-1||seen[n]) return; seen[n]=1; hits.push(p); });
      hits=hits.slice(0,10);
      if(!hits.length && (!onOther || exact)){ results.style.display='none'; return; }
      results.style.display='block';
      hits.forEach(function(h){ var row=document.createElement('div'); row.className='search-hit'; var nm=document.createElement('div'); nm.className='sh-name'; nm.textContent=h.name+(h.drill?' \u203A':''); row.appendChild(nm); if(h.tag){ var tg=document.createElement('div'); tg.className='sh-tag'; tg.textContent=h.tag+(h.drill?' \u00b7 open this list':''); row.appendChild(tg); } row.onclick=function(){ onPick(h); if(!h.drill) inp.value=''; results.innerHTML=''; results.style.display='none'; }; results.appendChild(row); });

  // WHAT TWO PEOPLE SHARE, worked out in the browser from the two answer rows rather than by the
  // backend, so nothing new has to be kept in step and no column is added. The viewer's own row is
  // read ONLY when they press the button, so an ordinary visit to a profile costs exactly what it
  // cost before. Every list-shaped ikigai column is compared: Jessie, 2026-09-21, asked for "all of
  // the fields we have".
  var IC_KIND = { skills:'offer', professionalServices:'offer', haves:'offer', methods:'offer',
                  interests:'enjoy', hobbies:'enjoy', expression:'enjoy',
                  values:'value', domains:'value', sectors:'value', careAbout:'value',
                  workValues:'value', advocating:'value',
                  needs:'need' };
  // A LANGUAGE IS OFFERED AND IT IS ALSO SPOKEN. Jessie, 2026-09-21: "You and kendall both offer
  // English - change to You and kendall both speak English". It stays an offering, because somebody
  // can need Spanish and you can be the person who has it, and it gets its own kind as well so the
  // line under it reads the way a person would say it.
  function icWords(row, field){
    var v = row ? row[field] : '';
    return String(v == null ? '' : v).split(/[|,]/)
      .map(function(x){ return String(x).split('~')[0].split(':')[0].trim(); })
      .filter(Boolean);
  }
  function icBuckets(row){
    var out = { offer:{}, enjoy:{}, value:{}, need:{}, speak:{} };
    Object.keys(IC_KIND).forEach(function(f){
      icWords(row, f).forEach(function(w){ out[IC_KIND[f]][w.toLowerCase()] = w; });
    });
    icWords(row, 'languages').forEach(function(w){
      out.speak[w.toLowerCase()] = w; out.offer[w.toLowerCase()] = w;
    });
    return out;
  }
  // THE SAME THREE COLOURS THE GROUP MATCH VIEW USES, and the same words for them: orange is an
  // offer meeting a need, purple is a need you both have, green is something you share. Jessie,
  // 2026-09-21, with the attendees screen open: "make it look liek this - we have hte code already
  // in groups". The LOOK is that screen's, lifted whole. The MATCHING is not the same code and
  // cannot be: attendees asks a group-wide question - does anybody ELSE here need this - across
  // every member at once, and this asks about two people. Same answer shape, different question.
  function icRows(A, B){
    var rows = [], seen = {};
    var add = function(kind, item, note){
      var k = String(item).toLowerCase();
      if (seen[k]) return; seen[k] = 1;
      rows.push({ kind: kind, item: item, note: note });
    };
    var cross = function(a, b, fn){ Object.keys(a).forEach(function(k){ if (b[k]) fn(a[k]); }); };
    cross(B.offer, A.need,  function(w){ add('comp',   w, 'they offer / you need'); });
    cross(A.offer, B.need,  function(w){ add('comp',   w, 'you offer / they need'); });
    cross(A.need,  B.need,  function(w){ add('coseek', w, 'you are both looking for this'); });
    cross(A.enjoy, B.enjoy, function(w){ add('share',  w, 'you both enjoy this'); });
    cross(A.value, B.value, function(w){ add('share',  w, 'you both care about this'); });
    // A language is an offering too, so it would be claimed here as "you both offer this" and
    // never reach the line below. Skipped, so the language keeps the words a person would use.
    cross(A.offer, B.offer, function(w){
      if (A.speak[String(w).toLowerCase()]) return;
      add('share', w, 'you both offer this');
    });
    // LANGUAGES LAST, her word, 2026-09-21: "make English / you both speak this the last one".
    cross(A.speak, B.speak, function(w){ add('share',  w, 'you both speak this'); });
    return rows;
  }

  function showInCommon(btn){

    var mine = '';

            + '<div class="ic-list">' + rows.map(icItemHtml).join('') + '</div>');
        }

      .catch(function(){

        icOpen(btn);
      });

  _bootNote.innerHTML = '<span class="pe-loading">Loading information…</span>';
  if(!_pubCode){ (document.getElementById('pe-shell') || document.body).appendChild(_bootNote); }
  function _bootDone(){
    var n = document.getElementById('pe-booting');
    if (n && n.parentNode) { n.parentNode.removeChild(n); }
  }
  Promise.all([_pRef,_pProf]).then(function(){
    if(_pubCode) return;
    if (window._profFetchFailed) {
      var n = document.getElementById('pe-booting');
      if (n) { n.textContent = (_viewingSomeoneElse ? 'This information did not load. Reload the page to try again.' : 'Your information did not load. Reload the page to try again.'); }
      return;
    }
    _bootDone();
    if(_manageParam){ var _mk=(['groups','events','permissions','data'].indexOf(_manageParam)>-1)?_manageParam:'data'; showManage(_mk); }
    else if(_viewingSomeoneElse && _showParam){
      setBreadcrumb('view'); renderProfileView();
    }
    else if(_id){
      if (_param('edit') === '1') { requestEdit(_stepParam || 0); }
      else { setBreadcrumb('view'); renderProfileView(); }
    }
    else { showView(); }
  }).catch(function(){
    var n = document.getElementById('pe-booting');
    if (n) { n.textContent = 'Your profile could not be loaded. Reload the page to try again.'; }
  });
</script>

  html.cw-pub .wrap{max-width:820px;}

  .cw-pub-empty{background:#fff;border-radius:14px;padding:28px 24px;font-size:15.5px;color:var(--ink);line-height:1.55;}
</style>
<script>
(function(){
  if(!_pubCode) return;
  document.documentElement.classList.add('cw-pub');
  var pv=document.getElementById('profile-view');
  pv.innerHTML='<div style="padding:8px 2px;"><span class="pe-loading">Loading this profile…</span></div>';

  function tag(text,sub){
    return '<div class="pv-tag">'+esc(text)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>';
  }
  function tags(list){
    list=(list||[]).filter(Boolean);
    return list.length?list.map(function(t){ return tag(t); }).join(''):'';
  }
  function wrap(inner,subHead){
    if(!inner) return '';
    return (subHead?'<div class="pv-sub-h">'+esc(subHead)+'</div>':'')+'<div class="pv-tags">'+inner+'</div>';
  }
  function section(label,inner){
    if(!inner) return '';
    return '<div class="pv-section"><div class="pv-section-header"><div class="pv-section-label">'+esc(label)+'</div></div>'+inner+'</div>';
  }
  function face(d){
    if(d.photo) return '<div class="pv-face"><img src="'+esc(String(d.photo))+'" alt=""></div>';
    var nm=String(d.name||'').trim();
    if(!nm) return '';
    var ini=nm.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
    return ini?'<div class="pv-face">'+esc(ini)+'</div>':'';
  }

  function draw(d){
    var nm=String(d.name||'').trim();
    if(nm && nm===nm.toLowerCase()) nm=nm.replace(/(^|\s)(\S)/g,function(m,a,b){ return a+b.toUpperCase(); });
    document.title=(nm||'A profile')+' · 2Gather';
    var skills=tags((d.skills||[]).concat(d.languages||[]));
    var care=tags(d.careAbout);
    var sectors=tags(d.sectors);
    var work=tags(d.workExperience);
    var purpose=String(d.purpose||'').trim();
    var careInner=wrap(care,'')+wrap(sectors,'Sectors')+wrap(work,'Work values')
      +(purpose?'<div class="pv-sub-h">My purpose</div><div class="pv-said" style="font-style:normal;">'+esc(purpose).split('\n').join('<br>')+'</div>':'');
    var haves=tags(d.offerings);
    var openTo=tags(d.openToWork);
    var havesInner=wrap(haves,'')+wrap(openTo,'Open to work');
    pv.innerHTML=_trailHTML(nm)+'<div class="pv-card">'
      +'<div class="pv-head"><div><h2 class="pv-title">'+(nm?esc(nm):'A profile')+' 🌱</h2>'
      +(d.place?'<p class="cw-pub-place">'+esc(d.place)+'</p>':'')+'</div>'
      +'<div class="pv-head-right">'+face(d)+'</div></div>'
      +section("What I'm seeking",wrap(tags(d.needs),''))
      +section('What I enjoy',wrap(tags(d.enjoy),''))
      +section('My skills',wrap(skills,''))
      +section('What I care about',careInner)
      +section('My haves',havesInner)
      +'</div>';
  }

  function _trailPrev(){
    var raw='';
    try { raw=sessionStorage.getItem('cw-prev-page')||''; } catch(e){}
    if(!raw) return null;
    var got=null; try{ got=JSON.parse(raw); }catch(e){ return null; }
    if(!got||!got.href) return null;
    if(Date.now()-Number(got.at||0) > 30*60*1000) return null;
    var u=null; try{ u=new URL(String(got.href)); }catch(e){ return null; }
    if(u.hostname!=='2gather.network') return null;
    var path=String(u.pathname||'').toLowerCase();
    if(path.indexOf('/ikigai')===0) return null;
    var named='';
    try { named=String(u.searchParams.get('name')||'').trim(); } catch(e){}
    var label=named
      || (path.indexOf('/groups')===0 ? 'Groups'
      : path.indexOf('/group')===0 ? 'Group'
      : path.indexOf('/mygroups')===0 ? 'My groups'
      : path.indexOf('/myevents')===0 ? 'My events'
      : path.indexOf('/events')===0 ? 'Calendar'
      : path.indexOf('/event')===0 ? 'Event'
      : '');
    if(!label) return null;
    return { href:String(got.href), label:label };
  }
  function _trailHTML(nm){
    try {
      var prev=_trailPrev();
      var first=prev||{ href:'https://2gather.network/events/', label:'2Gather' };
      return '<div class="pv-trail">'
        + '<a role="link" tabindex="0" data-nav="'+esc(first.href)+'" onclick="return _safeNavGo(this)">'+esc(first.label)+'</a>'
        + '<span class="pv-trail-sep">/</span>'
        + '<span class="pv-trail-here">'+esc(nm||'A profile')+'</span>'
        + '</div>';
    } catch(e){ return ''; }
  }

  function notShared(){
    document.title='A profile · 2Gather';
    pv.innerHTML='<div class="cw-pub-empty"><strong>This profile is not being shared.</strong><br>'
      +'The link works, but the person it belongs to has not turned their public profile on. '
      +'If it is yours, open <a href="https://2gather.network/me/">your profile</a> and turn it on under My permissions.</div>';
  }
  function didNotLoad(){
    pv.innerHTML='<div class="cw-pub-empty"><strong>This profile did not load.</strong><br>'
      +'That is us, not the link. Reload the page to try again.</div>';
  }

  fetch(GS_URL+'?action=publicProfile&p='+encodeURIComponent(_pubCode))
    .then(function(r){ return r.json(); })
    .then(function(resp){
      if(resp && resp.found===true && resp.data){ draw(resp.data); return; }
      if(resp && resp.found===false && resp.status==='ok'){ notShared(); return; }
      didNotLoad();
    })
    .catch(function(){ didNotLoad(); });
})();
</script>
