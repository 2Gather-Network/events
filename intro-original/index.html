      return b;

  function gpCorpus(source, rd){
    var out = [], seen = {};
    
    
    
    var push = function(w, c, a){
      w = String(w || '').trim(); if (!w) return;
      var k = w.toLowerCase(); if (seen[k]) return;
      seen[k] = 1; out.push({ word: w, cat: String(c || '').trim(), assoc: String(a || '').toLowerCase() });
    };
    if (source === 'recreation') {
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    } else if (source === 'skills') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
    } else if (source === 'values') {
      (rd.values || []).forEach(function(v){ push((v && v.item !== undefined) ? v.item : v, 'Values', v && v.associations); });
      (rd.domains || []).forEach(function(v){ push((v && v.item !== undefined) ? v.item : v, 'Domains', v && v.associations); });
      
      
      var lens = (GP_CHIPS.introValues && GP_CHIPS.introValues.lenses) || [];
      lens.forEach(function(l){
        (l.words || []).forEach(function(w){ push(w, l.label, ''); });
        (l.more  || []).forEach(function(w){ push(w, l.label, ''); });
      });
    } else if (source === 'need') {
      (rd.skills || []).forEach(function(s){ push(s.item, s.category, s.associations); });
      (rd.recreation || []).forEach(function(r){ push(r.item, r.recType, r.associations); });
    }
    return out;
  }

  
  
  function gpAddWord(key, word, cat, ta){
    word = String(word || '').trim(); if (!word) return;
    if (!_gpTags[key]) _gpTags[key] = {};
    _gpTags[key][word] = cat || '';
    var parts = String(ta.value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].toLowerCase() === word.toLowerCase()) return;
    }
    parts.push(word);
    ta.value = parts.join(', ');

  function gpToken(){
    if (_gpPhotoToken) return _gpPhotoToken;
    try {
      var norm = String(meId || '').split('.').join('').toLowerCase();
      var raw = localStorage.getItem('cw-edit-' + norm);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.t && (!o.exp || o.exp > Date.now())) { _gpPhotoToken = o.t; return _gpPhotoToken; }
      }
      var t2 = localStorage.getItem('cw-token') || '';
      var who = String(localStorage.getItem('cw-id') || '').split('.').join('').toLowerCase();
      if (t2 && who && who === norm) {
        var exp = parseInt(String(t2).split('.')[1], 10);
        if (exp && Date.now() <= exp - 60000) { _gpPhotoToken = t2; return _gpPhotoToken; }
      }

  function gpShrinkPhoto(file){
    gpPhotoStat('Getting it ready\u2026');
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = 600; c.height = 600;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 600, 600);
        c.toBlob(function(blob){
          if (!blob) { gpPhotoStat('That picture could not be read.'); return; }
          gpSendPhoto(blob);
        }, 'image/jpeg', 0.85);
      } catch (e) { gpPhotoStat('That picture could not be read.'); }
      finally { try { URL.revokeObjectURL(img.src); } catch (e) {} }
    };
    img.onerror = function(){ gpPhotoStat('That picture could not be read.'); };
    img.src = URL.createObjectURL(file);
  }

    }).catch(function(){ gpPhotoStat('That did not go through.'); });
  }

      b.style.paddingTop = i ? '18px' : '0';
      b.style.paddingBottom = '18px';
      var head = null, all = b.querySelectorAll('div');
      for (var k = 0; k < all.length; k++) { if (/font-weight:\s*800/.test(all[k].getAttribute('style') || '')) { head = all[k]; break; } }
      if (head) {
        var tag = document.createElement('span');
        var req = o[1] !== 'Optional';
        tag.textContent = o[1];
        tag.style.cssText = 'display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:12px;'
          + (req ? 'background:#E6F1FB;color:#1F699E;' : 'background:#EEF0F3;color:#6B7A8D;');
        head.appendChild(tag);
      }
      box.appendChild(b);
    });
  }

  function gpThanksBlock(){
    var tw = document.createElement('div');
    tw.style.cssText = 'padding:18px 0 0;border-top:1px solid #f0f1f5;';
    var tt = document.createElement('div');
    tt.style.cssText = 'font-size:17px;font-weight:800;color:#1A2E42;margin-bottom:2px;';
    tt.textContent = 'How do you like to get appreciated? \u{1F381}';
    var th = document.createElement('div');
    th.style.cssText = 'font-size:13.5px;color:#6B7A8D;margin-bottom:12px;';
    th.textContent = 'When somebody wants to give something back, this is where it lands. Pick as many as you are happy to receive.';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px;';
    GP_THANKS.forEach(function(opt){
      var b = document.createElement('button');
      b.type = 'button';
      var paint = function(){
        b.style.cssText = 'font:inherit;font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;'
          + (_gpThanksPicked[opt.value]
              ? 'background:#1F699E;border:1px solid #1F699E;color:#fff;font-weight:700;'
              : 'background:#fff;border:1px solid #C9DFF3;color:#1F699E;font-weight:600;');
      };
      b.textContent = opt.label;
      paint();
      b.addEventListener('click', function(){
        _gpThanksPicked[opt.value] = !_gpThanksPicked[opt.value];
        paint();
      });
      row.appendChild(b);
    });
    tw.appendChild(tt); tw.appendChild(th); tw.appendChild(row);
    return tw;
  }

  function gpSaveIntro(){
    var stat = document.getElementById('gp-intro-status');
    var btn = document.getElementById('gp-intro-go');
    var val = function(k){ var el = document.getElementById('gp-intro-' + k); return el ? String(el.value || '').trim() : ''; };
    
    
    btn.disabled = true;
    stat.style.color = '#6B7A8D';
    stat.textContent = 'Loading your profile…';
    var picked = function(map, sep){ return Object.keys(map).filter(function(k){ return map[k]; }).join(sep); };
    var qs = 'action=saveIntro&appearId=' + encodeURIComponent(meId)
      + '&appreciation=' + encodeURIComponent(picked(_gpThanksPicked, '|'))
      + '&languages=' + encodeURIComponent(picked(_gpLangPicked, ', '))
      + '&methods=' + encodeURIComponent(picked(_gpMethodPicked, '|'));
    GP_INTRO_Q.forEach(function(q){ qs += '&' + q.key + '=' + encodeURIComponent(val(q.key)); });
    
    
    
    var tagFor = function(k){ return Object.keys(_gpTags[k] || {}).join('|'); };
    qs += '&needsTags='     + encodeURIComponent(tagFor('introNeed'))
        + '&interestsTags=' + encodeURIComponent(tagFor('introEnjoy'))
        + '&skillsTags='    + encodeURIComponent(tagFor('introSkills'))
        + '&valuesTags='    + encodeURIComponent(tagFor('introValues'));
    fetch(GS_URL + '?' + qs)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || (d.status !== 'ok' && d.ok !== true)) {
          btn.disabled = false;
          stat.style.color = '#7A2410';
          stat.textContent = (d && d.message) || 'Could not save just now. Try again in a moment.';
          return;
        }
        _introDone();
      })
      .catch(function(){
        btn.disabled = false;
        stat.style.color = '#7A2410';
        stat.textContent = 'Could not reach the server. Try again in a moment.';
      });
  }


  document.getElementById('intro-back').addEventListener('click', function(){ window.location.href = _next; });
  document.getElementById('gp-intro-go').addEventListener('click', gpSaveIntro);
  
  
  
  
  
  
  gpRenderIntro(null);
  
  
  
  
  var GP_OLDER = {
    introNeed:   'needs',
    introEnjoy:  'interests',
    introSkills: 'skills',
    introValues: 'values',
    introOffer:  'offers'
  };

  if (meId) {
    fetch(GS_URL + '?action=getIntake&appearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var have = (d && d.data) || {};
        var use = {}, any = false;
        GP_INTRO_Q.forEach(function(q){
          var v = String(have[q.key] || '').trim();
          
          
          
          
          if (!v) {
            var raw = String(have[GP_OLDER[q.key]] || '').trim();
            if (raw) {
              v = raw.split('|').map(function(part){
                var name = String(part).split(':')[0].trim();
                
                
                
                return name.replace(/^[^\p{L}\p{N}]+/u, '').trim();
              }).filter(function(name){ return name; }).join(', ');
            }
          }
          if (v) { use[q.key] = v; any = true; }
        });
        
        String(have.languages || '').split(/[|,]/).forEach(function(l){
          var v = String(l).trim(); if (v) { _gpLangPicked[v] = true; any = true; }
        });
        String(have.methods || '').split('|').forEach(function(m){
          var v = String(m).trim(); if (v) { _gpMethodPicked[v] = true; any = true; }
        });
        GP_INTRO_Q.forEach(function(q){
          var el = document.getElementById('gp-intro-' + q.key);
          var typed = el ? String(el.value || '').trim() : '';
          if (typed) { use[q.key] = typed; any = true; }
        });
        if (any) { gpRenderIntro(use); }
      })
      .catch(function(){});
  }
</script>
