<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="My groups · 2Gather">
<title>My groups · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{color:#fff;font-size:14px;font-weight:500;margin-bottom:24px;opacity:.92;}
  .breadcrumb .now{font-weight:800;}
  .breadcrumb a{color:#fff;text-decoration:none;cursor:pointer;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  h1{font-size:26px;font-weight:800;margin:0;color:#fff;}
  .btn{background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn.solid{background:var(--brand);color:#fff;}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.sm{padding:7px 14px;font-size:13px;}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:16px;}
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}
  .rail{background:#fff;border-radius:14px;padding:8px;height:fit-content;}
  /* The folded bar replaces the list on a phone once a group is picked, so the group you chose
     is the first thing on screen instead of sitting below a screenful of list. */
  .rail-folded{display:none;width:100%;align-items:center;gap:10px;background:#fff;border:0;
    border-radius:14px;padding:14px 16px;font:inherit;font-size:14.5px;font-weight:700;
    color:var(--brand);cursor:pointer;text-align:left;margin-bottom:14px;}
  .rail-folded .chev{font-size:13px;line-height:1;opacity:.75;}
  .railtools{display:flex;gap:8px;align-items:center;margin:6px 6px 10px;}
  .railtools .search{flex:1;min-width:0;margin:0;}
  .railsort{border:1px solid var(--line);border-radius:18px;background:#fff;font:inherit;
    font-size:13px;color:var(--ink);padding:8px 10px;cursor:pointer;max-width:44%;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 6px 10px;}
  .seg-btn{flex:1;background:#fff;color:var(--ink);border:0;font:inherit;font-size:13.5px;font-weight:700;padding:9px 6px;cursor:pointer;}
  .seg-btn.on{background:var(--brand);color:#fff;}
  .rail .search{display:flex;align-items:center;background:#F7F9FC;border-radius:18px;padding:2px 6px 2px 12px;margin:6px 6px 10px;}
  .rail .search input{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;padding:8px 4px;outline:none;}
  .rail .item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .rail .item:hover{background:var(--panel);}
  .rail .item.on{background:#EEF6FF;}
  .rail .item .img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#DDE4EE;}
  .rail .item .nm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.15;flex:1;min-width:0;}
  .rail .item .dot{background:var(--brand);color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;font-weight:800;}
  .detail{background:#fff;border-radius:14px;padding:24px 28px;min-height:200px;}
  .detail .cover{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#DDE4EE;display:block;margin-bottom:16px;}
  .detail h2{font-size:22px;font-weight:800;margin:0 0 4px;}
  .badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;}
  .badge.host{background:#E7F5EA;color:#1A5A2C;}
  .badge.cohost{background:#EEF6FF;color:#154F74;}
  .badge.member{background:#F7FBFF;color:#4B5A6D;border:1px solid #C9DFF3;}
  .detail .stats{font-size:14px;color:var(--soft);margin:14px 0;line-height:1.6;}
  .detail .stats b{color:var(--ink);}
  .detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .status{padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.5;}
  .status.err{background:#FBE9E7;border:1px solid #E8B0A5;color:#7A2410;}
  .status.info{background:var(--panel);border:1px solid var(--panel-line);color:var(--soft);}
</style>
</head>
<body>
<div class="wrap">
  <div class="breadcrumb" id="crumb-wrap" style="display:none;"></div>

  <div class="head">
    <h1>My groups</h1>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <button type="button" class="btn" id="join-btn">Join a group</button>
      <a class="btn" role="link" tabindex="0" id="new-group-btn" onclick="return _safeNavGo(this)">Create a group</a>
    </div>
  </div>

  <div class="card" id="invited-card" style="display:none;background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px;">
    <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px;">You're invited</div>
    <p style="font-size:14px;color:var(--soft);line-height:1.55;margin:0 0 14px;">
      Joining is up to you. Nothing changes on your profile until you do.</p>
    <div id="invited-list"></div>
  </div>

  <div class="card" id="join-card" style="display:none;background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px;">
    <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px;">Join a group</div>
    <p style="font-size:14px;color:var(--soft);line-height:1.55;margin:0 0 14px;">
      Every group has a passcode. Ask the host for theirs and enter it here.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <input type="text" id="join-code" maxlength="10" placeholder="Example: SEAHOUSE"
        style="flex:1;min-width:180px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;">
      <button type="button" class="btn solid" id="join-go">Join</button>
      <button type="button" class="btn ghost" id="join-cancel">Cancel</button>
    </div>
    <div id="join-status" style="font-size:14px;margin-top:12px;"></div>
  </div>

  <div class="layout">
    <button type="button" id="rail-folded" class="rail-folded">
      <span class="chev">&#8964;</span>
      <span id="rail-folded-label">View all groups</span>
    </button>
    <div class="rail" id="rail">
      <div class="seg" id="rail-seg">
        <button type="button" class="seg-btn on" id="seg-member">Member</button>
        <button type="button" class="seg-btn" id="seg-hosted">Host</button>
      </div>
      <div class="railtools">
        <div class="search"><input type="text" id="rail-filter" placeholder="&#128269; Search"></div>
        <select id="rail-sort" class="railsort" aria-label="Sort groups"></select>
      </div>
      <div id="rail-items"></div>
    </div>
    <div class="detail" id="detail">
      <div class="status info">Loading your groups…</div>
    </div>
  </div>
</div>

<script>
(function(){
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
  var params = new URLSearchParams(window.location.search);
  var meId = (params.get('CWid') || params.get('appearId') || params.get('memberCard') || params.get('me') || '').trim();

  var rail = document.getElementById('rail-items');
  var detail = document.getElementById('detail');
  var filterInput = document.getElementById('rail-filter');

  // The back-crumb only shows when the visitor actually arrived from their profile, so the
  // chevron never claims a history that is not there. ref=profile is the marker; from=profile
  // is accepted too, so any link already shared keeps working.
  (function(){
    var cameFromProfile = (params.get('ref') === 'profile' || params.get('from') === 'profile');
    var wrap = document.getElementById('crumb-wrap');
    // This is the top of the groups section, so on its own the crumb just repeated the heading.
    // It shows only when the person came from somewhere and there is a way back.
    if (!wrap || !cameFromProfile) return;
    wrap.style.display = '';
    wrap.innerHTML = '\u2039 <a role="link" tabindex="0" id="crumb-back" onclick="return _safeNavGo(this)">My profile</a> / <span class="now">My groups</span>';
    var back = document.getElementById('crumb-back');
    if (back) back.setAttribute('data-nav', 'https://creating.works/profile' + (meId ? '?CWid=' + encodeURIComponent(meId) : ''));
  })();
  document.getElementById('new-group-btn').setAttribute('data-nav', 'https://2gather.network/groups/create' + (meId ? '?CWid=' + encodeURIComponent(meId) : ''));

  // Joining a group. The passcode is the only credential a group has, so the person types the
  // code the host gave them and the backend finds the one group it belongs to. Codes are not
  // guaranteed unique across groups, so an ambiguous code is refused rather than guessed at.
  var joinCard = document.getElementById('join-card');
  var joinCode = document.getElementById('join-code');
  var joinStat = document.getElementById('join-status');
  function joinSay(msg, kind){
    joinStat.textContent = msg || '';
    joinStat.style.color = kind === 'err' ? '#7A2410' : (kind === 'ok' ? '#1E6B3A' : 'var(--soft)');
  }
  // Arriving from the Groups menu with ?join=1 opens the panel straight away.
  try {
    if (new URLSearchParams(location.search).get('join') === '1') {
      setTimeout(function(){ var b = document.getElementById('join-btn'); if (b) b.click(); }, 300);
    }
  } catch(e){}
  document.getElementById('join-btn').addEventListener('click', function(){
    if (!meId){ joinSay('Sign in first, then you can join a group.', 'err'); joinCard.style.display=''; return; }
    joinCard.style.display = '';
    joinSay('');
    joinCode.value = '';
    joinCode.focus();
  });
  document.getElementById('join-cancel').addEventListener('click', function(){
    joinCard.style.display = 'none';
  });
  joinCode.addEventListener('keydown', function(e){ if (e.key === 'Enter') doJoin(); });
  document.getElementById('join-go').addEventListener('click', doJoin);

  // Invitations waiting for this person. The emailed link carries no identity, so an invitation
  // that arrives while they are signed out has to be findable after they sign in. It waits here.
  function loadInvites(){
    if (!meId) return;
    fetch(GS_URL + '?action=getMyInvites&appearId=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var list = (d && d.ok && d.invites) || [];
        if (!list.length) return;
        var box = document.getElementById('invited-list');
        box.innerHTML = '';
        list.forEach(function(iv){
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);';
          var who = document.createElement('div');
          who.style.cssText = 'flex:1;min-width:170px;';
          var nm = document.createElement('div');
          nm.style.cssText = 'font-weight:700;color:var(--ink);font-size:15px;';
          nm.textContent = iv.name || 'A group';
          var sub = document.createElement('div');
          sub.style.cssText = 'font-size:13px;color:var(--soft);margin-top:2px;';
          sub.textContent = (iv.invitedByName ? 'Invited by ' + iv.invitedByName : 'Invited')
            + (iv.dateInvited ? ' \u00b7 ' + fmtInviteDate(iv.dateInvited) : '');
          who.appendChild(nm); who.appendChild(sub);
          var go = document.createElement('button');
          go.type = 'button'; go.className = 'btn solid sm'; go.textContent = 'Join';
          go.addEventListener('click', function(){ acceptInvite(iv, go, sub); });
          var look = document.createElement('a');
          look.className = 'btn ghost sm'; look.setAttribute('role','link'); look.setAttribute('tabindex','0');
          look.setAttribute('data-nav', 'https://2gather.network/group?id=' + encodeURIComponent(iv.groupId) + '&CWid=' + encodeURIComponent(meId));
          look.setAttribute('onclick','return _safeNavGo(this)');
          look.textContent = 'Take a look first';
          row.appendChild(who); row.appendChild(go); row.appendChild(look);
          box.appendChild(row);
        });
        document.getElementById('invited-card').style.display = '';
      })
      .catch(function(){});
  }
  // Joining is a write, and the list of groups is about to be cached at the edge. Coming back
  // to a copy taken a moment before the join would hide the group that was just joined.
  // Joining ends inside the group, not back at the list. Reloading My groups dropped the
  // person on whichever group sorts first, which is not the one they just joined.
  function goToGroup(groupId){
    try { sessionStorage.setItem('cw-just-joined', '1'); } catch(err){}
    location.href = 'https://2gather.network/group?id=' + encodeURIComponent(groupId)
      + (meId ? '&CWid=' + encodeURIComponent(meId) : '');
  }
  function fmtInviteDate(v){
    var t = new Date(v);
    if (isNaN(t.getTime())) return '';
    return t.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function acceptInvite(iv, btn, sub){
    btn.disabled = true; btn.textContent = 'Joining\u2026';
    fetch(GS_URL + '?action=acceptInvite&appearId=' + encodeURIComponent(meId)
      + '&groupId=' + encodeURIComponent(iv.groupId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.ok !== true){
          btn.disabled = false; btn.textContent = 'Join';
          sub.textContent = (d && d.message) || 'Could not join just now. Try again in a moment.';
          sub.style.color = '#7A2410';
          return;
        }
        btn.textContent = 'Joined';
        setTimeout(function(){ goToGroup(iv.groupId); }, 700);
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Join';
        sub.textContent = 'Could not reach the server. Try again in a moment.';
        sub.style.color = '#7A2410';
      });
  }
  loadInvites();

  function doJoin(){
    var code = String(joinCode.value || '').trim();
    if (!code){ joinSay('Enter the passcode the host gave you.', 'err'); return; }
    if (!meId){ joinSay('Sign in first, then you can join a group.', 'err'); return; }
    var _goBtn = document.getElementById('join-go');
    _goBtn.disabled = true;
    joinSay('Checking\u2026');
    var _reEnable = function(){ _goBtn.disabled = false; };
    fetch(GS_URL + '?action=joinByPasscode&appearId=' + encodeURIComponent(meId)
      + '&passcode=' + encodeURIComponent(code))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.ok !== true){
          _reEnable();
          joinSay((d && d.message) || 'That passcode did not match any group.', 'err');
          return;
        }
        if (d.already){
          _reEnable();
          joinSay('You are already in ' + (d.name || 'that group') + '. Taking you in\u2026', 'ok');
          setTimeout(function(){ goToGroup(d.groupId); }, 700);
          return;
        }
        joinSay('You joined ' + (d.name || 'the group') + '. Taking you in\u2026', 'ok');
        setTimeout(function(){ goToGroup(d.groupId); }, 700);
      })
      .catch(function(){ _reEnable(); joinSay('Could not reach the server. Try again in a moment.', 'err'); });
  }

  if (!meId) {
    // Signed out, this page used to be a dead end: it said "sign in from your group page" and
    // offered no way to do it. Two doors, both to Appear, matching the group page.
    detail.innerHTML =
      '<div style="max-width:520px;">'
      + '<h2 style="font-size:20px;font-weight:800;color:var(--ink);margin:0 0 8px;">Your groups live here</h2>'
      + '<p style="font-size:15px;color:var(--soft);line-height:1.55;margin:0 0 18px;">'
      + 'Sign in to see the groups you belong to and the ones you host.</p>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
      + '<a class="btn solid" role="link" tabindex="0" data-nav="' + (window.CW_SIGNIN||'https://appear.network/') + '" onclick="return _safeNavGo(this)" style="text-decoration:none;cursor:pointer;">Sign in</a>'
      + '<a class="btn ghost" href="https://appear.network/" style="text-decoration:none;">Sign up</a>'
      + '</div></div>';
    var seg = document.getElementById('rail-seg'); if (seg) seg.style.display = 'none';
    var rl = document.getElementById('rail'); if (rl) rl.style.display = 'none';
    return;
  }

  var _coverStyle = (params.get('cover') || '').trim().toLowerCase();
  var DEFAULT_GROUP_IMG = 'https://raw.githubusercontent.com/2Gather-Network/events/main/images/2gather_logo.png';
  function groupImg(g){ return String((g && g.image) || '').trim() || DEFAULT_GROUP_IMG; }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function groupUrl(g, page){
    var base = 'https://2gather.network/';
    if (page === 'group') return base + 'group.html?id=' + encodeURIComponent(g.groupId) + '&CWid=' + encodeURIComponent(meId);
    // The name rides along so the admin page can title itself without a heavy extra call.
    return base + 'groups/' + page + '.html?id=' + encodeURIComponent(g.groupId)
      + '&CWid=' + encodeURIComponent(meId) + '&name=' + encodeURIComponent(g.name || '');
  }

  function renderDetail(g){
    var _r = String(g.role || '').toLowerCase();
    var roleLabel = _r === 'cohost' ? 'Co-host' : (_r === 'host' ? 'Host' : 'Member');
    var pending = g.pending || 0;
    var html = '';
    // Option B, behind ?cover=tile while it is being compared against the live wide band.
    // Most group pictures are square, and a 16:5 band cuts a square photo's head off.
    var _badge = '<span class="badge ' + (_r === 'cohost' ? 'cohost' : (_r === 'host' ? 'host' : 'member')) + '">' + roleLabel + '</span>';
    var _stats = '<div class="stats">' + esc(g.intro || '') + (g.intro ? '<br>' : '')
      + '<span id="detail-counts">Counting…</span>'
      + (pending ? ' · <b style="color:var(--brand);">' + pending + ' pending requests</b>' : '') + '</div>';

    if (_coverStyle === 'tile') {
      html += '<div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:4px;">'
        + '<img src="' + esc(groupImg(g)) + '" alt="" style="width:104px;height:104px;border-radius:14px;object-fit:cover;background:#DDE4EE;flex-shrink:0;">'
        + '<div style="min-width:0;flex:1;">'
        + '<h2 style="margin:0 0 4px;">' + esc(g.name || 'Group') + '</h2>'
        + _badge + _stats
        + '</div></div>';
    } else {
      html += '<img class="cover" src="' + esc(groupImg(g)) + '" alt="">';
      html += '<h2>' + esc(g.name || 'Group') + '</h2>';
      html += _badge;
      html += _stats;
    }
    var _runsIt = _isHosted(g);
    html += '<div class="acts">'
      + '<a class="btn solid sm" role="link" tabindex="0" data-nav="' + groupUrl(g,'group') + '" onclick="return _safeNavGo(this)">Open group</a>'
      + (_runsIt
          ? '<a class="btn ghost sm" role="link" tabindex="0" data-nav="' + groupUrl(g,'admin') + '" onclick="return _safeNavGo(this)">Manage</a>'
            + '<a class="btn ghost sm" role="link" tabindex="0" data-nav="' + groupUrl(g,'invite') + '" onclick="return _safeNavGo(this)">Invite people</a>'
          : '')
      + (_runsIt && pending ? '<a class="btn sm" role="link" tabindex="0" data-nav="' + groupUrl(g,'admin') + '" onclick="return _safeNavGo(this)">View requests (' + pending + ')</a>' : '')
      + '</div>';
    detail.innerHTML = html;
    _countSeq++;
    loadCounts(g, _countSeq);
  }

  // getMyGroups reports zero offers and zero needs for every group, so this panel was stating
  // something that was never true while the group page showed real numbers for the same group.
  // They are counted here exactly the way the group page counts them, from the group's own data,
  // so the two can never disagree again. One call per group, remembered so coming back is instant.
  var _counts = {}, _countSeq = 0;
  function _countTokens(v){ return String(v || '').split('|').filter(Boolean).length; }
  function loadCounts(g, seq){
    if (_counts[g.groupId]) { paintCounts(g, seq); return; }
    fetch(GS_URL + '?action=getGroupBundle&groupId=' + encodeURIComponent(g.groupId) + '&me=' + encodeURIComponent(meId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var people = ((d && d.attendees) || []).filter(function(p){ return p.photo || p.first || p.name; });
        var offers = 0, needs = 0;
        people.forEach(function(p){
          offers += _countTokens(p.skills) + _countTokens(p.interests) + _countTokens(p.values);
          needs  += _countTokens(p.needs);
        });
        // A host is a member of their own group. 5 Corners has a host and nobody on the
        // member side, so it reported nought people while its host was reading the page.
        var _hosts = ((d && d.group && d.group.hostIds) || []).concat((d && d.group && d.group.coHostIds) || []);
        var _seen = {};
        people.forEach(function(p){ _seen[String(p.appearId||'').split('.').join('').toLowerCase()] = 1; });
        var _meK = String(meId||'').split('.').join('').toLowerCase();
        var _extraHosts = 0;
        _hosts.forEach(function(h){
          var k = String(h||'').split('.').join('').toLowerCase();
          if (!k || _seen[k]) return;
          _seen[k] = 1;
          _extraHosts++;
          // Counting the host as a person but not counting what they offer left a group with one
          // member and nought offers, while their profile was full of them.
          if (k === _meK && d && d.me) {
            offers += _countTokens(d.me.skills) + _countTokens(d.me.ikigaiSkills)
                    + _countTokens(d.me.interests) + _countTokens(d.me.ikigaiInterests)
                    + _countTokens(d.me.values) + _countTokens(d.me.ikigaiValues);
            needs  += _countTokens(d.me.needs) + _countTokens(d.me.ikigaiNeeds);
          }
        });
        _counts[g.groupId] = { people: people.length + _extraHosts, offers: offers, needs: needs };
        paintCounts(g, seq);
      })
      .catch(function(){ paintCounts(g, seq, true); });
  }
  function paintCounts(g, seq, failed){
    // Another group may have been clicked while this was in flight, so a late answer is dropped
    // rather than painted over the group now on screen.
    if (seq !== _countSeq) return;
    var el = document.getElementById('detail-counts');
    if (!el) return;
    var c = _counts[g.groupId];
    if (!c) { el.textContent = failed ? 'Could not load the numbers.' : ''; return; }
    el.innerHTML = '<b>' + c.people + '</b> people · <b>' + c.offers + '</b> offers · <b>' + c.needs + '</b> needs';
  }

  var _groups = [], _pane = 'member', _sort = 'newest';
  // Declared as data so another page can reuse the same control by changing this list alone.
  //
  // "Needs me first" was removed rather than shipped: it sorted on a pending-requests count that
  // the backend returns as 0 for every group, because nothing stores a join request yet. A label
  // promising "someone is waiting for you" that quietly gives you alphabetical order is worse
  // than not offering it. It comes back the day requests are actually recorded.
  //
  // Dates are compared as time, not as text. The sheet stores them like
  // "Mon Jul 28 2025 00:00:00 GMT-0700", so comparing the strings would sort by the weekday name.
  function _time(g){
    var t = new Date(String(g.dateCreated || '')).getTime();
    return isNaN(t) ? null : t;
  }
  var SORTS = [
    { key: 'newest', label: 'Newest first', needsDate: true, cmp: function(a, b){
        var ta = _time(a), tb = _time(b);
        // A group with no recorded date sits at the bottom rather than pretending to be oldest.
        if (ta === null && tb === null) return String(a.name||'').localeCompare(String(b.name||''));
        if (ta === null) return 1;
        if (tb === null) return -1;
        return tb - ta;
      } },
    { key: 'oldest', label: 'Oldest first', needsDate: true, cmp: function(a, b){
        var ta = _time(a), tb = _time(b);
        if (ta === null && tb === null) return String(a.name||'').localeCompare(String(b.name||''));
        if (ta === null) return 1;
        if (tb === null) return -1;
        return ta - tb;
      } },
    { key: 'name', label: 'Name A to Z', cmp: function(a, b){
        return String(a.name||'').localeCompare(String(b.name||''));
      } }
  ];
  function _haveDates(){ return _groups.some(function(g){ return _time(g) !== null; }); }
  function renderSort(){
    var sel = document.getElementById('rail-sort'); if (!sel) return;
    var dates = _haveDates();
    var opts = SORTS.filter(function(o){ return !o.needsDate || dates; });
    if (!opts.some(function(o){ return o.key === _sort; })) _sort = opts[0].key;
    sel.innerHTML = opts.map(function(o){
      return '<option value="' + o.key + '"' + (o.key === _sort ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }
  // Hosting a group and belonging to one are different relationships, so they get their own
  // lists rather than one pile. A group you host is never also listed under Member.
  function _isHosted(g){ var r = String(g.role || '').toLowerCase(); return r === 'host' || r === 'cohost'; }
  // Hosting a group means belonging to it, so Member is every group you are in and Host is the
  // subset you run. They overlap on purpose: a host is not a different kind of person.
  function _inPane(g){ return _pane === 'hosted' ? _isHosted(g) : true; }
  function renderRail(){
    var q = (filterInput.value || '').trim().toLowerCase();
    // The tab carries the count, the way Attending and Hosting do on My events.
    var nHost = _groups.filter(_isHosted).length;
    var nMember = _groups.length;
    var segH = document.getElementById('seg-hosted');
    var segM = document.getElementById('seg-member');
    if (segH) { segH.textContent = 'Host (' + nHost + ')'; segH.classList.toggle('on', _pane === 'hosted'); }
    if (segM) { segM.textContent = 'Member (' + nMember + ')'; segM.classList.toggle('on', _pane === 'member'); }
    rail.innerHTML = '';
    var shown = _groups.filter(function(g){
      if (!_inPane(g)) return false;
      return !q || String(g.name||'').toLowerCase().indexOf(q) !== -1;
    });
    renderSort();
    var _s = SORTS.filter(function(o){ return o.key === _sort; })[0] || SORTS[0];
    shown.sort(_s.cmp);
    if (!shown.length) {
      // An empty Member list is usually not a filter miss, it is that the backend does not
      // return joined groups yet, so say which it is rather than "no groups match".
      var _msg = q ? 'No groups match.'
        : (_pane === 'member' ? 'You are not in a group yet.' : 'You are not hosting a group yet.');
      rail.innerHTML = '<div style="padding:12px;color:#6B7A8D;font-size:13px;line-height:1.5;">' + _msg + '</div>';
      detail.innerHTML = '<div class="status info">Nothing to show here.</div>';
      return;
    }
    shown.forEach(function(g, i){
      var it = document.createElement('div'); it.className = 'item' + (i===0?' on':'');
      it.innerHTML = '<img class="img" src="' + esc(groupImg(g)) + '" alt="">'
        + '<span class="nm">' + esc(g.name || 'Group') + '</span>'
        + (g.pending ? '<span class="dot">' + g.pending + '</span>' : '');
      it.addEventListener('click', function(){
        rail.querySelectorAll('.item').forEach(function(x){ x.classList.remove('on'); });
        it.classList.add('on'); renderDetail(g); foldRail(true);
      });
      rail.appendChild(it);
    });
    renderDetail(shown[0]);
  }
  // On a phone the list and the group stack, so after picking a group you were left staring at
  // the same list with no sign the group was far below. Picking one folds the list away; the bar
  // brings it back. A laptop shows both side by side already, so nothing folds there.
  function _isPhone(){
    return (window.innerWidth || document.documentElement.clientWidth || 1024) < 760;
  }
  function foldRail(folded){
    var bar = document.getElementById('rail-folded');
    // The whole panel folds, tabs and filter included. `rail` is the item list inside it, so
    // hiding that alone left the tabs and the filter box stranded on their own.
    var panel = document.getElementById('rail');
    if (!bar || !panel) return;
    var on = folded && _isPhone();
    bar.style.display = on ? 'flex' : 'none';
    panel.style.display = on ? 'none' : '';
    if (on) { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){} }
  }
  (function(){
    var bar = document.getElementById('rail-folded');
    if (bar) bar.addEventListener('click', function(){ foldRail(false); });
    var t; window.addEventListener('resize', function(){
      clearTimeout(t);
      t = setTimeout(function(){ if (!_isPhone()) foldRail(false); }, 120);
    });
  })();

  filterInput.addEventListener('input', renderRail);
  (function(){
    var sel = document.getElementById('rail-sort');
    if (sel) sel.addEventListener('change', function(){ _sort = sel.value; renderRail(); });
  })();
  ['hosted','member'].forEach(function(pane){
    var b = document.getElementById('seg-' + pane);
    if (b) b.addEventListener('click', function(){ _pane = pane; foldRail(false); renderRail(); });
  });

  // Straight after a join the cached list is a minute out of date, and a minute is exactly how
  // long it takes to look at the group and come back for it. That one load skips the cache.
  var _fresh = '';
  try {
    if (sessionStorage.getItem('cw-just-joined')) { _fresh = '&nocache=1'; sessionStorage.removeItem('cw-just-joined'); }
  } catch(err){}
  fetch(GS_URL + '?action=getMyGroups&appearId=' + encodeURIComponent(meId) + _fresh)
    .then(function(r){ return r.json(); })
    .then(function(d){
      // A deployed getMyGroups always returns a `groups` array (possibly empty).
      // No `groups` key at all = the action isn't live yet.
      if (!d || !Array.isArray(d.groups)) {
        detail.innerHTML = '<div class="status err">Backend not live yet. This page needs the <b>getMyGroups</b> action pasted into the Gather Events script (drafted in the Bulletin 2.5 handoff). Once it\'s deployed, your hosted groups appear here.</div>';
        return;
      }
      if (!d.groups.length) {
        detail.innerHTML = '<div class="status info">You don\'t host any groups yet. Start one and it\'ll show up here.</div>';
        return;
      }
      _groups = d.groups;
      renderRail();
    })
    .catch(function(){
      detail.innerHTML = '<div class="status err">Backend not live yet — this page needs the <b>getMyGroups</b> action pasted into the Gather Events script. Once it\'s deployed, your hosted groups appear here.</div>';
    });
})();
</script>
