<script>
var GS_URL='https://cw-api-gate.jessieupp.workers.dev';
function _cwCodeFor(id){
  var v = String(id || '').split('.').join('').toLowerCase();
  if (!v) return '';
  var h = 5381;
  for (var i = 0; i < v.length; i++) { h = ((h * 33) ^ v.charCodeAt(i)) >>> 0; }
  return ('000000' + h.toString(36)).slice(-6);
}
var PROFILE_URL='https://2gather.network/me/?v=';
function _profileUrl(appearId){
  var c=_cwCodeFor(appearId||'');
  if(!c) return '';
  return PROFILE_URL+encodeURIComponent(c)
    +(_eventId?'&hubEventId='+encodeURIComponent(_eventId):'');
}
function _profileUrlFor(m){
  var vn = m && m.vanity ? String(m.vanity).trim() : '';
  if (vn) return 'https://2gather.network/hi/'+encodeURIComponent(vn);
  return _profileUrl(m && m.appearId);
}

var params=new URLSearchParams(window.location.search);
var _eventId=(params.get('id')||params.get('eventId')||params.get('event')||'').trim();
var _groupId=(params.get('group')||window.CW_GROUP_ID||'').trim();
if(_groupId){ _eventId=''; }
var _myId=(window.CW&&CW.me)?CW.me().id:(params.get('memberCard')||params.get('appearId')||params.get('me')||'').trim();
var _matchMode=false;
var _searchQ='';
var _expanded=null;   
var _expandedCat=null;    
var _expandedLang=null;   
var SECTION_META={
  skills:{title:'Skills represented',needsMode:false},
  interests:{title:'Recreational interests of our bulletin board',needsMode:false},
  values:{title:'What people here care about',needsMode:false},
  needs:{title:'What are bulletin board needs',needsMode:true}
};
if(_groupId){
  SECTION_META.interests.title='Recreational interests of our group';
  SECTION_META.values.title='What our group cares about';
  SECTION_META.needs.title='What our group needs';
}

var _members=[];
var _myData=null;
var _meRegistered=false;          
var _photoMap={};                 
var _catMap={};                   
var _parentCats={};               
var _collapsed={skills:false,interests:false,values:false,needs:false};
var _chips={skills:[],interests:[],values:[],needs:[]};   
var _myOffer={};                  
var _myNeed={};                   
var _offerersByItem={};           
var _needersByItem={};            
var _providersByItem={};          
var _myProvide={};                

function normId(id){return String(id||'').split('.').join('').toLowerCase();}
function escHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
window._safeNavGo=function(el){try{var u=el&&el.getAttribute&&el.getAttribute('data-nav');if(u){window.location.href=u;}}catch(e){}return false;};
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var t=e.target;if(t&&t.tagName==='A'&&!t.hasAttribute('href')&&t.hasAttribute('data-nav')){e.preventDefault();_safeNavGo(t);}});
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function parseTagStr(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var p=s.split(':');
    return {item:(p[0]||'').trim(), category:(p.length>=3?p[1]:'').trim(), meta:p.slice(1).join(':').trim()};
  }).filter(function(o){return o.item;});
}
function titleCase(s){
  var small={and:1,or:1,of:1,the:1,a:1,an:1,'in':1,on:1,'for':1,to:1,'with':1};
  var n=0;
  return String(s||'').split(/(\s+)/).map(function(w){
    if(!w || !w.trim()) return w;
    if(n++ && small[w.toLowerCase()]) return w.toLowerCase();
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join('');
}
function parseNeeds(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var detail=''; var tio=s.indexOf('~'); if(tio>-1){ try{detail=decodeURIComponent(s.slice(tio+1));}catch(e){detail=s.slice(tio+1);} s=s.slice(0,tio); }
    var p=s.split(':');
    var local=p[1]==='local';
    var ntype=local?(p[2]||'skill'):(p[1]||'skill');
    var catParts=(local?p.slice(3):p.slice(2)).join(':').split(' / ');
    return {item:(p[0]||'').trim(), ntype:ntype, category:(catParts[0]||'').trim(), detail:detail};
  }).filter(function(n){return n.item;});
}

var NEED_THING_KINDS = { 'money':1, 'physical goods':1, 'consumables':1, 'living things':1 };
function dropWorkValues(list){
  return (list || []).filter(function(n){
    if (String(n && n.ntype || '').toLowerCase() !== 'work') { return true; }
    return !!NEED_THING_KINDS[String(n.item || '').trim().toLowerCase()];
  });
}

function _viewParams(){
  var q = new URLSearchParams(location.search);
  ['view','cat','lang'].forEach(function(k){ q.delete(k); });
  if(_matchMode){ q.set('view','matches'); }
  else if(_expanded){
    q.set('view', _expanded);
    if(_expandedCat) q.set('cat', _expandedCat);
    if(_expandedLang) q.set('lang', _expandedLang);
  }
  return q.toString();
}
var _viewAddr='';
function _writeAddr(push){
  try{
    var q=_viewParams(), url=location.pathname+(q?'?'+q:'');
    if(url===location.pathname+location.search){ _viewAddr=url; return; }
    if(push && _viewAddr){ history.pushState({v:1}, '', url); } else { history.replaceState({v:1}, '', url); }
    _viewAddr=url;
  }catch(e){}
}
function _readAddr(){
  try{
    var q=new URLSearchParams(location.search);
    var v=String(q.get('view')||window.CW_GROUP_VIEW||'').trim();
    _matchMode = (v==='matches');
    _expanded = (v && v!=='matches') ? v : null;
    _expandedCat = _expanded ? (q.get('cat')||null) : null;
    _expandedLang = _expanded ? (q.get('lang')||null) : null;
    var btn=document.getElementById('matches-btn');
    if(btn){ btn.classList.toggle('active',_matchMode); btn.textContent=_matchMode?'Back to bulletin board':'My matches'; }
  }catch(e){}
}
window.addEventListener('popstate', function(){
  _readAddr();
  try{ paintCrumbs(); }catch(e){}
  try{ renderAll(); }catch(e){}
  try{ window.scrollTo(0,0); }catch(e){}
});

function paintCrumbs(){
  var el=document.getElementById('hub-crumbs'); if(!el) return;
  if(!_groupId){ el.innerHTML=''; return; }
  var name=String(window._groupName||'').trim()||'This group';
  var gh='https://2gather.network/group/?id='+encodeURIComponent(_groupId)+'&look=board';
  var sep='<span aria-hidden="true">\u203A</span>';
  var parts=['<a href="'+gh+'">'+escHTML(name)+'</a>'];
  var hub=location.pathname+'?group='+encodeURIComponent(_groupId);
  if(_matchMode || _expanded){
    parts.push('<a href="'+hub+'" onclick="return goHub(event)">Bulletin board</a>');
    parts.push('<span class="now">'+escHTML(_matchMode?'My matches':(SECTION_META[_expanded]&&SECTION_META[_expanded].title)||_expanded)+'</span>');
  } else {
    parts.push('<span class="now">Bulletin board</span>');
  }
  el.innerHTML=parts.join(' '+sep+' ');
}

function refFor(item){
  return _catMap[String(item||'').toLowerCase()]||{category:'',associations:''};
}
async function loadRefData(){
  try{
    var res=await fetch(GS_URL+'?action=getReferenceData');
    var d=await res.json();
    ['skills','recreation','values','domains'].forEach(function(k){
      (d[k]||[]).forEach(function(r){
        if(!r.item) return;
        _catMap[String(r.item).toLowerCase()]={category:r.category||'',associations:r.associations||''};
      });
    });
  }catch(e){}
}
async function loadCategories(){
  try{
    var res=await fetch(GS_URL+'?action=getCategories');
    var d=await res.json();
    (d.categories||[]).forEach(function(c){ if(c.label) _parentCats[String(c.label).toLowerCase()]=true; });
  }catch(e){}
}

function fmtDate(d){
  if(!d) return '';
  if(String(d)==='TBD') return 'Date and time to be announced';
  var s=String(d).split('T')[0];         
  var dt=new Date(s+'T00:00:00');        
  if(!isNaN(dt.getTime())) return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  return String(d);
}
async function loadEvent(){
  if(!_eventId) return;
  try{
    var res=await fetch(GS_URL+'?action=getEventById&id='+encodeURIComponent(_eventId));
    var d=await res.json();
    if(!d.found||!d.event) return;
    var ev=d.event;
    window._hostEmail=ev.hostEmail||ev.contactEmail||'';
    var _hb=document.getElementById('hub-help-btn'); if(_hb) _hb.style.display=window._hostEmail?'':'none';
    var titleEl=document.getElementById('event-title');
    var metaEl=document.getElementById('event-meta');
    if(titleEl) titleEl.textContent = ev.title ? ('Event: ' + ev.title) : 'Event';
    var bits=[];
    var when=[fmtDate(ev.date),String(ev.time||'').trim()].filter(Boolean).join(' · ');
    var where=[String(ev.venue||'').trim(),String(ev.location||'').trim()].filter(Boolean).join(', ');
    if(when)  bits.push('📅 '+escHTML(when));
    if(where) bits.push('📍 '+escHTML(where));
    if(metaEl) metaEl.innerHTML=bits.join('');
  }catch(e){}
}

function _boardKey(){ return 'cw-board-'+_groupId+'-'+normId(_myId||''); }
function _boardAsk(){
  return fetch(GS_URL+'?action=getGroupBundle&groupId='+encodeURIComponent(_groupId)+(_myId?'&me='+encodeURIComponent(_myId):'')+'&t='+Date.now())
    .then(function(r){ return r.json(); });
}
function _boardKeep(d){ try{ localStorage.setItem(_boardKey(), JSON.stringify({at:Date.now(), d:d})); }catch(e){} }
function _boardQuietRefresh(before){
  var reKey='cw-board-re-'+_groupId;
  _boardAsk().then(function(d){
    if(!d || !d.group) return;
    var now=JSON.stringify(d);
    if(now===before){ try{ sessionStorage.removeItem(reKey); }catch(e){} return; }
    var meIn=!!(d.me && (d.attendees||[]).some(function(p){ return normId(p.appearId)===normId(d.me.appearId); }));
    if(meIn || d.meIsHost===true || d.meIsOperator===true) _boardKeep(d);
    else { try{ localStorage.removeItem(_boardKey()); }catch(e){} }
    try{ if(sessionStorage.getItem(reKey)) return; sessionStorage.setItem(reKey,'1'); }catch(e){}
    location.reload();
  }).catch(function(){});
}
async function loadGroupMembers(){
  if(_myId && !loadGroupMembers._again){
    var kept=null;
    try{ kept=JSON.parse(localStorage.getItem(_boardKey())||'null'); }catch(e){}
    if(kept && kept.d && kept.d.group && (Date.now()-Number(kept.at||0)) < 7*24*60*60*1000){
      try{
        if(_boardApply(kept.d)){ _boardQuietRefresh(JSON.stringify(kept.d)); return; }

function unionByItem(mainArr, ikArr){
  var out=[]; var seen={};
  (ikArr||[]).forEach(function(x){
    if(!x||!x.item) return;
    var k=String(x.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(x);
  });
  (mainArr||[]).forEach(function(x){
    if(!x||!x.item) return;
    var k=String(x.item).toLowerCase().trim();
    if(seen[k]) return;
    seen[k]=true; out.push(x);
  });
  return out;
}
function parseIkigaiInterests(str){
  if(!str) return [];
  return String(str).split('|').filter(Boolean).map(function(s){
    var p=s.split(':');
    return {item:(p[0]||'').trim(), category:(p.length>=3?p[1]:'').trim(), meta:p.slice(1).join(':').trim()};
  }).filter(function(o){return o.item;});
}
function processRow(data, appearId){
  if(_members.some(function(m){return normId(m.appearId)===normId(appearId);})) return;
  var pm=_photoMap[normId(appearId)]||{};
  var extra=String([data.first,data.name,data.languages,data.location,data.searchText].filter(Boolean).join(' | ')).toLowerCase();
  var search=String([data.first,data.name,data.languages,data.advocating,data.location,data.searchText,
    data.skills,data.interests,data.values,data.waysOfBeing,data.domains,data.needs,data.hobbies,data.professionalServices,
    data.ikigaiSkills,data.ikigaiInterests,data.ikigaiValues,data.ikigaiDomains,data.ikigaiNeeds
  ].filter(Boolean).join(' ')).toLowerCase();
  var mainSkills        = parseTagStr(data.skills);
  var mainCommunityType = parseTagStr(data.interests);   
  var mainProfSvc       = data.professionalServices ? parseTagStr(data.professionalServices) : [];   
  var mainHobbies       = data.hobbies
    ? parseTagStr(data.hobbies)
        .filter(function(h){ return h.item.split(/\s+/).length <= 2; })
        .map(function(h){ if(!h.meta) h.meta='Participant'; return h; })
    : [];
  var mainValues        = parseTagStr(data.values).concat(parseTagStr(data.domains)).concat(parseTagStr(data.waysOfBeing));
  var mainNeeds         = dropWorkValues(parseNeeds(data.needs));
  var ikSkills          = data.ikigaiSkills    ? parseTagStr(data.ikigaiSkills)    : [];
  var ikInterests       = data.ikigaiInterests ? parseIkigaiInterests(data.ikigaiInterests) : [];
  var ikValues          = data.ikigaiValues    ? parseTagStr(data.ikigaiValues).concat(data.ikigaiDomains?parseTagStr(data.ikigaiDomains):[]) : (data.ikigaiDomains?parseTagStr(data.ikigaiDomains):[]);
  var ikNeeds           = data.ikigaiNeeds     ? dropWorkValues(parseNeeds(data.ikigaiNeeds)) : [];
  var member={
    appearId:appearId,
    photo:pm.photo||'',
    pageLink:pm.pageLink||'',
    name:data.first||data.name||appearId,   
    search:search,
    extra:extra,
    skills:        ikSkills.length
                   ? unionByItem(mainSkills, ikSkills)
                   : unionByItem(mainSkills, mainProfSvc),
    interests:     (ikInterests.length
                   ? unionByItem(mainHobbies, ikInterests)
                   : unionByItem(mainHobbies, mainCommunityType))
                   .map(function(x){ if(!x.meta) x.meta='Participant'; return x; }),
    communityType: mainCommunityType,
    values:        unionByItem(mainValues, ikValues),
    needs:         unionByItem(mainNeeds, ikNeeds),
    languages:String(data.languages||'').split('|').map(function(s){return s.trim();}).filter(Boolean)
  };
  _members.push(member);
  if(normId(appearId)===normId(_myId)) _myData=member;
}

function addTo(map, item, id){
  var k=String(item||'').toLowerCase(); if(!k) return;
  if(!map[k]) map[k]={};
  map[k][normId(id)]=true;
}
function isCoach(x){ return /coach/i.test((x&&x.meta)||''); }
function computeGlobals(){
  _myOffer={}; _myNeed={}; _offerersByItem={}; _needersByItem={}; _providersByItem={}; _myProvide={};
  _members.forEach(function(m){
    ['skills','interests','values'].forEach(function(f){
      (m[f]||[]).forEach(function(x){ addTo(_offerersByItem, x.item, m.appearId); });
    });
    (m.skills||[]).forEach(function(x){ addTo(_providersByItem, x.item, m.appearId); });
    (m.interests||[]).forEach(function(x){ if(isCoach(x)) addTo(_providersByItem, x.item, m.appearId); });
    (m.needs||[]).forEach(function(n){ addTo(_needersByItem, n.item, m.appearId); });
  });
  if(_myData){
    ['skills','interests','values'].forEach(function(f){
      (_myData[f]||[]).forEach(function(x){ if(x.item) _myOffer[x.item.toLowerCase()]=true; });
    });
    (_myData.skills||[]).forEach(function(x){ if(x.item) _myProvide[x.item.toLowerCase()]=true; });
    (_myData.interests||[]).forEach(function(x){ if(x.item && isCoach(x)) _myProvide[x.item.toLowerCase()]=true; });
    (_myData.needs||[]).forEach(function(n){ if(n.item) _myNeed[n.item.toLowerCase()]=true; });
  }
}
function someoneElse(map){
  if(!map) return false;
  var mine=normId(_myId);
  for(var k in map){ if(k!==mine) return true; }
  return false;
}

function memberChips(field){
  var byPerson={};
  var pids=[];
  _members.forEach(function(m){
    var pid=normId(m.appearId);
    var seen={};
    (m[field]||[]).forEach(function(it){
      var label=(it.item||'').trim(); if(!label) return;
      var low=label.toLowerCase();
      if(_parentCats[low]) return;
      if(seen[low]) return; seen[low]=true;
      if(!byPerson[pid]){ byPerson[pid]=[]; pids.push(pid); }
      byPerson[pid].push({item:label, category:it.category||'', meta:it.meta||'', detail:it.detail||'', member:{appearId:m.appearId, photo:m.photo, pageLink:m.pageLink}});
    });
  });
  pids=shuffle(pids);
  pids.forEach(function(pid){ byPerson[pid]=shuffle(byPerson[pid]); });
  var out=[]; var maxLen=0;
  pids.forEach(function(pid){ if(byPerson[pid].length>maxLen) maxLen=byPerson[pid].length; });
  for(var i=0;i<maxLen;i++){
    pids.forEach(function(pid){ if(byPerson[pid][i]) out.push(byPerson[pid][i]); });
  }
  if (field === 'needs') {
    var withCat = out.filter(function(c){ return c.category; });
    var bare    = out.filter(function(c){ return !c.category; });
    return withCat.concat(bare);
  }
  return out;
}
function allLanguages(){
  var seen={};
  _members.forEach(function(m){
    (m.languages||[]).forEach(function(l){
      var k=l.toLowerCase(); if(!seen[k]) seen[k]=l;
    });
  });
  return Object.keys(seen).sort().map(function(k){ return seen[k]; });
}
function buildChips(){
  _chips.skills   =memberChips('skills');
  _chips.interests=memberChips('interests');
  _chips.values   =memberChips('values');
  _chips.needs    =memberChips('needs');
  renderGuestPhotos();
}

function matchOfferingChip(entry){
  var x=entry.item.toLowerCase();
  var mNorm=normId(entry.member.appearId), mine=normId(_myId);
  if((mNorm!==mine && _myNeed[x] && _providersByItem[x] && _providersByItem[x][mNorm])
     || (mNorm===mine && _myProvide[x] && someoneElse(_needersByItem[x]))) return 'orange';
  if(_myOffer[x] && someoneElse(_offerersByItem[x])) return 'green';
  return '';
}
function matchNeedChip(entry){
  var x=entry.item.toLowerCase();
  var mNorm=normId(entry.member.appearId), mine=normId(_myId);
  if((mNorm!==mine && _myProvide[x]) || (mNorm===mine && someoneElse(_providersByItem[x]))) return 'orange';
  if(_myNeed[x] && someoneElse(_needersByItem[x])) return 'green';
  return '';
}

function computeMyMatches(){
  if(!_myData) return [];
  var mine=normId(_myId);
  var byPerson={};
  function slotFor(mem){
    var mid=normId(mem.appearId);
    if(!byPerson[mid]) byPerson[mid]={appearId:mem.appearId,photo:mem.photo||'',pageLink:mem.pageLink||'',shared:{},comp:{},coseek:{}};
    return byPerson[mid];
  }
  ['skills','interests','values'].forEach(function(field){
    (_chips[field]||[]).forEach(function(en){
      if(normId(en.member.appearId)===mine) return;
      var mt=matchOfferingChip(en); if(!mt) return;
      var slot=slotFor(en.member);
      var key=en.item.toLowerCase();
      if(mt==='green'){ slot.shared[key]={item:en.item}; }
      else if(mt==='orange'){ slot.comp[key]={item:en.item, direction:'they offer / you need'}; }
    });
  });
  (_chips.needs||[]).forEach(function(en){
    if(normId(en.member.appearId)===mine) return;
    var mt=matchNeedChip(en); if(!mt) return;
    var slot=slotFor(en.member);
    var key=en.item.toLowerCase();
    if(mt==='green'){ slot.coseek[key]={item:en.item}; }
    else if(mt==='orange'){ slot.comp[key]={item:en.item, direction:'you offer / they need'}; }
  });
  var out=[];
  Object.keys(byPerson).forEach(function(mid){
    var s=byPerson[mid];
    var mem=_members.find(function(m){return normId(m.appearId)===mid;});
    if(!mem) return;
    s.name=mem.name||mem.appearId;
    s.sharedList=Object.keys(s.shared).map(function(k){return s.shared[k];});
    s.compList=Object.keys(s.comp).map(function(k){return s.comp[k];});
    s.coseekList=Object.keys(s.coseek).map(function(k){return s.coseek[k];});
    out.push(s);
  });
  out.sort(function(a,b){
    if(b.compList.length!==a.compList.length) return b.compList.length-a.compList.length;
    if(b.coseekList.length!==a.coseekList.length) return b.coseekList.length-a.coseekList.length;
    return b.sharedList.length-a.sharedList.length;
  });
  return out;
}

var _matchesQ='';
function renderMatchesPanel(){

    for(var i=0;i<m.sharedList.length;i++){ if(m.sharedList[i].item.toLowerCase().indexOf(q)>-1) return true; }
    for(var j=0;j<m.compList.length;j++){ if(m.compList[j].item.toLowerCase().indexOf(q)>-1) return true; }
    for(var k=0;k<m.coseekList.length;k++){ if(m.coseekList[k].item.toLowerCase().indexOf(q)>-1) return true; }
    return false;
  }) : matches;
  var n=filtered.length;
  var titleLine=q ? n+' of '+total+' '+(total===1?'match':'matches') : total+' '+(total===1?'person':'people')+' match you';

function _countChipsHTML(list, needsMode, key){

function _commonAndMatches(list, needsMode){

function _fitRows(body, total){

  if(!chips.length) return;
  var tops=chips.map(function(c){ return c.offsetTop; });
  var rows=tops.slice().sort(function(a,b){return a-b;}).filter(function(t,i,a){ return i===0 || t!==a[i-1]; });
  var hidden=0;
  chips.forEach(function(c,i){ if(rows.indexOf(tops[i])>=4){ c.style.display='none'; hidden++; } });
  var pill=body.querySelector('.show-all-pill-wrap');
  if(pill) pill.style.display=(hidden>0 || total>chips.length)?'':'none';
}

      primary='<button onclick="hubRegisterPrompt()" style="'+BTNB+'">Sign up to register</button>';
    } else {                                                
      primary='<button onclick="hubRegister()" style="'+BTNB+'">Register for this event</button>';
    }
  } else if(!_myData){                                      
    var url='https://creating.works/profile?id='+encodeURIComponent(_myId)+(_eventId?'&eventId='+encodeURIComponent(_eventId):'')+'&intro=1';
    primary='<a href="'+url+'" style="'+BTN+'">Create my profile</a>';
  }                                                         
  var cantMakeIt=!_meRegistered?'<a class="hub-cant" onclick="toggleCantMakeIt()" style="font-size:13px;color:#fff;text-decoration:underline;cursor:pointer;">Can\'t make it?</a>':'';
  var cantMakeItPanel=!_meRegistered?'<div id="cant-make-it-panel" style="display:none;background:#fff;border-radius:10px;padding:16px 18px;margin:10px auto 0;max-width:420px;position:relative;font-size:14px;color:#1a1a2e;line-height:1.5;text-align:left;">'
    +'<button onclick="toggleCantMakeIt()" aria-label="Close" style="position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;color:#9ca3af;cursor:pointer;line-height:1;">×</button>'
    +'This is for people who live here, or who call this place home. Register to come in person, or register to engage online after the event completes.'
    +'</div>':'';
  el.innerHTML=(learnMore||primary)?'<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:14px 0 0;">'+learnMore+primary+cantMakeIt+'</div>'+cantMakeItPanel:'';
}
window.toggleCantMakeIt=function(){
  var p=document.getElementById('cant-make-it-panel'); if(!p) return;
  p.style.display=(p.style.display==='none')?'block':'none';
};

function toggleSection(key){
  _collapsed[key]=!_collapsed[key];
  var body=document.getElementById(key+'-body');
  var arrow=document.getElementById(key+'-arrow');
  if(body) body.classList.toggle('collapsed',_collapsed[key]);
  if(body && body.parentNode) body.parentNode.classList.toggle('q-closed',!!_collapsed[key]);
  if(arrow) arrow.classList.toggle('open',!_collapsed[key]);
  if(!_collapsed[key]) renderAll();
}
function toggleMatches(){
  _matchMode=!_matchMode;
  var btn=document.getElementById('matches-btn');
  var legend=document.getElementById('match-legend');
  if(btn){ btn.classList.toggle('active',_matchMode); btn.textContent=_matchMode?'Back to bulletin board':'My matches'; }
  _writeAddr(true);
  try{ paintCrumbs(); }catch(e){}
  if(legend) legend.style.display='none';
  try{window.scrollTo(0,0);}catch(e){}
  renderAll();
}

    links+='<a role="link" tabindex="0" data-nav="https://2gather.network/me/'+(_eventId?'&hubEventId='+encodeURIComponent(_eventId):'')+'" title="My profile" onclick="return _safeNavGo(this)" style="'+WB+'display:inline-flex;align-items:center;gap:8px;">My profile'+_pic+'</a>';

}

})();
async function loadContributions(){
  var el=document.getElementById('contrib-section'); if(!el) return;
  if(!_myData){ el.innerHTML=''; return; }                 
  var claims=[], typeMap={}, catMap={}, rawList='';
  try{
    var res=await fetch(GS_URL+'?action=getPotluckList&eventId='+encodeURIComponent(_eventId));
    var d=await res.json();
    claims=(d&&d.claims)||[];
    rawList=(d&&d.signupPotluck)?String(d.signupPotluck).trim():'';
    var sp=[]; try{ sp=JSON.parse(d.signupPotluck||'[]'); }catch(e){ sp=[]; }
    if(Array.isArray(sp)) sp.forEach(function(it){ if(it&&it.item){ typeMap[it.item]=(it.potluckType||''); catMap[it.item]=(it.category||''); } });
  }catch(e){}
  if(!claims.length && !rawList){ el.innerHTML=''; return; }   
  var experiences=[], _held=[];
  claims.forEach(function(c){
    var t=(typeMap[c.item]||c.potluckType||'').trim().toLowerCase();
    (t==='experience'?experiences:_held).push(c);
  });
  function chip(c){
    var initial=escHTML((c.name||'?').charAt(0).toUpperCase());
    var ph=c.photo
      ?'<img class="chip-photo" src="'+escHTML(c.photo)+'" alt="" data-initial="'+initial+'" onerror="imgFallback(this)">'
      :'<div class="chip-photo-fallback">'+initial+'</div>';
    var sub=(catMap[c.item]||c.category||'');
    var link=_profileUrl(c.appearId);
    var subEl=sub?'<span class="chip-cat">'+escHTML(sub)+'</span>':'';
    return '<a class="chip" role="link" tabindex="0" data-nav="'+link+'" title="'+escHTML(c.name||c.appearId||'View profile')+'" onclick="return _safeNavGo(this)" style="text-decoration:none;"><span>'+ph+'</span><span class="chip-text"><span class="chip-label">'+escHTML(c.item)+'</span>'+subEl+'</span></a>';
  }
  function col(title, list){
    var body=list.length?list.map(function(c){return chip(c);}).join(''):'<span class="empty">Nothing here yet.</span>';
    return '<div class="quadrant"><div class="q-header"><div><div class="q-title">'+title+'</div></div></div><div class="q-body">'+body+'</div></div>';
  }
  var cols=col('Experiences',experiences);
  el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 14px 0;flex-wrap:wrap;"><div style="font-size:18px;font-weight:800;color:#fff;">🎁 Who\'s bringing what</div>'
    +'</div>'   
    +'<div class="grid" style="grid-template-columns:minmax(240px,1fr);">'+cols+'</div>';
}
</script>
