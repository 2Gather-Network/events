<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Code of Conduct mockup · 2Gather</title>
<link rel="icon" type="image/png" href="https://2gather.network/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A2E42;--soft:#2F3D4F;--bg:#F4F7FA;--line:#DDE4EE;--brand:#1F699E}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
button{font:inherit}
.mock{background:#FBF2DC;color:#5A420B;font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.mock b{font-weight:800;margin-right:4px}
.mock button{border:1px solid #E1C98C;background:#fff;color:#5A420B;border-radius:14px;padding:3px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.mock button.on{background:#5A420B;color:#fff;border-color:#5A420B}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;font-weight:800;font-size:18px;color:var(--brand)}
.page{max-width:720px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--soft);font-size:14.5px}
</style>
</head>
<body>
<div class="mock"><b>Mockup.</b><span>Nothing here saves.</span>
<button type="button" id="m-a" class="on">A: first time on 2Gather</button>
<button type="button" id="m-a2">A on 2Appear</button>
<button type="button" id="m-b">B: reminder on 2Appear</button>
</div>
<div class="bar" id="m-site">2Gather</div>
<div class="page">
<div class="card"><h3>Coffee and conversation</h3><p>Saturday 10 am, Lake Ballinger Center</p></div>
<div class="card"><h3>Emerging leaders night</h3><p>Wednesday 6 pm, Edmonds Waterfront Center</p></div>
<div class="card"><h3>Community walk</h3><p>Sunday 9 am, Mountlake Terrace</p></div>
</div>
<script>
(function () {
  var realFetch = window.fetch.bind(window);
  window.fetch = function (u, o) {
    if (String(u).indexOf('ackConduct=1') > -1) {
      return new Promise(function (done) { setTimeout(function () { done({ json: function () { return Promise.resolve({ status: 'ok', conductOk: true }); } }); }, 600); });
    }
    return realFetch(u, o);
  };
  var realGet = Storage.prototype.getItem;
  Storage.prototype.getItem = function (k) {
    var v = realGet.call(this, k);
    if (!v && k === 'cw-id') { return 'mockup'; }
    if (!v && k === 'cw-token') { return 'mockup'; }
    return v;
  };
  function clear() { ['cw-coc', 'cw-coc-carry'].forEach(function (id) { var e = document.getElementById(id); if (e) { e.remove(); } }); }
  function pick(btn, site, mode, from) {
    clear();
    ['m-a', 'm-a2', 'm-b'].forEach(function (id) { document.getElementById(id).classList.toggle('on', id === btn); });
    document.getElementById('m-site').textContent = '2' + site;
    window.CW_conduct(site, mode, from);
  }
  document.getElementById('m-a').onclick = function () { pick('m-a', 'Gather', 'ask', ''); };
  document.getElementById('m-a2').onclick = function () { pick('m-a2', 'Appear', 'ask', ''); };
  document.getElementById('m-b').onclick = function () { pick('m-b', 'Appear', 'carry', 'Gather'); };
  window.addEventListener('load', function () { pick('m-a', 'Gather', 'ask', ''); });
})();
</script>
<script src="/nav/conduct.js?v=1"></script>
</body>
</html>
