<script>
  // ── Phase 3.3a: load a real profile (read-only). Escaping + intake's exact parsers. ──
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function _param(k){ try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } }
  // Six parameters open somebody's profile, and every one of them has to count as "not mine"
  // when deciding whether to offer Edit. Keeping WHETHER the address named anybody is what
  // makes that decision safe: with no parameter at all the id came off this device, so it is
  // this device's person whichever key happens to hold it. Jessie, 2026-09-02.
  // THE PUBLIC PROFILE (row 195, 2026-09-15). ?p=<code> is somebody's shared profile: six characters
  // worked out from their id, never the id itself. It is its own page, drawn further down this file
  // from the backend's publicProfile answer, so everything the signed-in page does is skipped.
  var _pubCode = (_param('p')||'').trim().toLowerCase();
  // ?v=<code> IS HOW YOU OPEN SOMEBODY. Jessie, 2026-09-18: "if I go to a URL with the ID exposed in
  // the domain, I don't ever want to see that again." Six characters worked out FROM the id, never
  // the id. nav/identity.js turns any old ?show=<id> into this before this file runs, so a link
  // already in somebody's history or in a screenshot arrives here in the new shape too.
  //
  // It is not ?p=: that one is the PUBLIC profile, which only answers for somebody who switched it
  // on and only the fields they chose. This is the same person asked for by somebody who may be
  // allowed more - and the backend decides that, from who is asking, never from the address.
  var _viewCode = (_param('v')||'').trim().toLowerCase();
  var _idFromUrl = _param('id')||_param('show')||_param('CWid')||_param('me')||_param('memberCard')||_param('appearId')||'';
  var _id = _idFromUrl;
  // Ids are stripped from the address now, so arriving with a clean one is normal rather than
  // exceptional. profile/ has always fallen back to what the device remembers and this page
  // never did, which is why a clean address landed on the placeholder content built into this
  // file instead of on somebody's own profile.
  // Asked of CW rather than read out of storage here. This page read appear-id first and
  // identity.js reads cw-id first, so a device holding both could answer two different people
  // depending on which file was asking. One source now, and identity.js owns it.
  // REVERTED 2026-09-02. This read appear-id first for months. I changed it to ask CW.realMe(),
  // which reads cw-id first, to make one source of truth. On a device holding both keys with
  // different ids that resolves to a different person, and Jessie's clean address stopped
  // finding her while /profile-edit/, which still reads appear-id first, found her instantly.
  // The two pages disagreeing is a real problem and it is NOT fixed by changing the page that
  // was working. Back to the order that works, and the disagreement goes in the queue.
  if(!_id && !(window.CW && CW.signedOutView && CW.signedOutView())){ try{ _id = String(localStorage.getItem('appear-id')||localStorage.getItem('cw-id')||'').trim(); }catch(e){ _id=''; } }
  // Somebody running the site can stand in another person's shoes to see what they see. It is
  // a look and never a write: nothing on this page saves while it is on.
  var _viewing = false;
  try {
    if (window.CW && CW.me) {
      var _who = CW.me();
      if (_who.viewing && _who.id) { _id = _who.id; _viewing = true; }
    }
  } catch(e){}
  var _profilePhoto='', _profileName='', _loaded={}, _pageLink='', _said={};
  // What a person wrote in their own words, shown under the heading it answers.
  // THE SENTENCE UNDER THE CHIPS, TIDIED FOR READING ONLY. What people typed arrives with the
  // punctuation of whatever box it came from: "Aikido, cooking." and "Pitch review. Facilitation.
  // Strategerizing., Technology & Communications". Jessie, 2026-09-07: "strip periods out of the
  // synopsis in all sections."
  //
  // A full stop between items becomes a comma, a stop before a comma goes, and a trailing one goes.
  // NOTHING IS REWRITTEN IN THE SHEET. This changes what is drawn and not what anybody said.
  function _pvTidy(v){
    return String(v || '')
      .replace(/\.\s*,/g, ',')      // "Strategerizing., Technology" -> "Strategerizing, Technology"
      .replace(/\.\s+/g, ', ')      // "Pitch review. Facilitation" -> "Pitch review, Facilitation"
      .replace(/\.\s*$/, '')        // "Aikido, cooking." -> "Aikido, cooking"
      .replace(/,\s*,/g, ',')
      .replace(/\s{2,}/g, ' ')
      .replace(/,\s*$/, '')
      .trim();
  }
  // WORDS SAVED IN TAG FORM READ AS WORDS (2026-09-15). Jessie, on kendall patterson's profile: "My haves/what i'm
  // seeking not showing up correctly in pills: astrology and human design readings:skill, workshop space:space". An intro
  // page saved the answer in the shape of a tag list, type and all, and this printed it as it came. The type words come
  // off ("item:skill", "item:local:space", "massage therapy:work:skill"), the list reads with commas, and a line that
  // only repeats the pills above it is not drawn at all.
  var _TAG_TYPES='(?:skill|space|thing|person|work|stuff|money|time|care|local)';
  function _untag(v){
    var t=String(v||'');
    if(t.indexOf(':')<0) return t;
    return t.split('|').map(function(x){ return x.replace(new RegExp('(?::'+_TAG_TYPES+')+(?::[^|]*)?$','i'),'').trim(); })
            .filter(Boolean).join(', ');
  }
  function _tagShaped(v){
    var parts=String(v||'').split('|').filter(Boolean);
    return parts.length>0 && parts.every(function(x){ return new RegExp(':'+_TAG_TYPES+'(?::|$)','i').test(x); });

  // THE FROZEN SENTENCE IS NOT THE ANSWER. Jessie, 2026-09-16, after deleting Caterer from her needs:
  // "i deleted caterer from need ... and nothing sticks". It had stuck - ikigai.needs no longer held
  // Caterer - but this line did, because it comes from ikigai.introNeed, a sentence deliberately frozen
  // on 2026-09-15 so that words somebody typed could not be quietly destroyed. Frozen means it stops
  // matching the lists the moment anybody edits one, and it drifts further with every edit after that.
  //
  // So the profile shows the LISTS, which are the live answer, and not the sentence. The sentence is
  // still on the sheet, still frozen, still the record of what was typed at intake; ?said=1 prints it
  // again for anybody who needs to look at it. The one place it is still trusted is where there is no
  // live list at all to show (see _haveList below), which is not a contradiction but an absence.
  var PV_SAID_ON = (function(){ try { return new URLSearchParams(location.search).get('said') === '1'; } catch (e) { return false; } })();
  function pvSaid(key, pills){
    if(!PV_SAID_ON) return '';
    var v=_pvTidy(_untag(_said&&_said[key]));
    if(!v) return '';
    if(pills && pills.length){
      var have={}; pills.forEach(function(n){ have[String(n||'').toLowerCase().replace(/^📍\s*/,'').trim()]=1; });
      var bits=v.split(/\s*,\s*/).filter(Boolean);
      if(bits.length && bits.every(function(b){ return have[b.toLowerCase()]; })) return '';
    }
    return '<div class="pv-said">'+esc(v)+'</div>';
  }

    if(!str) return [];

      var p=s.split(':'); var item=p[0]; var local=false, ntype='skill', category='';
      if(p[1]==='local'){ local=true; ntype=p[2]||'skill'; category=p.slice(3).join(':'); }
      else { ntype=p[1]||'skill'; category=p.slice(2).join(':'); }
      return {item:item, category:category, local:local, ntype:ntype, detail:detail};
    });
  }
  function parseTagStr(str,lk){
    if(!str) return [];

      var p=s.split(':'); var o={item:p[0],category:p.length>=3?p[1]:''}; o[lk]=p.length>=3?(p[2]||''):(p[1]||''); return o;

      var _thingKinds = {'money':1,'physical goods':1,'consumables':1,'living things':1};

  // Live "did you mean" search for every add-your-own panel: as the person types, surface

  function matchExisting(inp, results, poolFn, onPick){
    inp.addEventListener('input', function(){
      results.innerHTML='';
      var q=inp.value.trim().toLowerCase();
      if(q.length<2) return;
      var seen={}, hits=[];
      poolFn().forEach(function(p){ var n=p.name.toLowerCase(); if(n.indexOf(q)===-1||seen[n]) return; seen[n]=1; hits.push(p); });
      hits=hits.slice(0,8);
      if(!hits.length) return;
      var note=document.createElement('div'); note.className='addown-note'; note.textContent='Did you mean one of these?'; results.appendChild(note);
      hits.forEach(function(h){ var row=document.createElement('div'); row.className='addown-hit'; row.textContent=h.name; if(h.tag){ var t=document.createElement('span'); t.className='tag'; t.textContent=h.tag; row.appendChild(t); } row.onclick=function(){ onPick(h); }; results.appendChild(row); });
    });

  // Live search box (icon + input + results dropdown), mirroring the intake search.
  // A heading in a list is a real word somebody will type, so the search offers it as a way in
  // rather than pretending it does not exist. Picking a heading opens that level; picking an
  // item adds it. And whatever was typed can always be kept as Other, so a phrase the list has
  // no name for is not simply lost.
  function wireSearch(inp, results, poolFn, onPick, onOther){
    inp.addEventListener('input', function(){
      results.innerHTML='';
      var raw=inp.value.trim();
      var q=raw.toLowerCase();
      if(q.length<2){ results.style.display='none'; return; }
      var seen={}, hits=[], exact=false;
      poolFn().forEach(function(p){ var n=p.name.toLowerCase(); if(n===q) exact=true; if(n.indexOf(q)===-1||seen[n]) return; seen[n]=1; hits.push(p); });
      hits=hits.slice(0,10);
      if(!hits.length && (!onOther || exact)){ results.style.display='none'; return; }
      results.style.display='block';
      hits.forEach(function(h){ var row=document.createElement('div'); row.className='search-hit'; var nm=document.createElement('div'); nm.className='sh-name'; nm.textContent=h.name+(h.drill?' \u203A':''); row.appendChild(nm); if(h.tag){ var tg=document.createElement('div'); tg.className='sh-tag'; tg.textContent=h.tag+(h.drill?' \u00b7 open this list':''); row.appendChild(tg); } row.onclick=function(){ onPick(h); if(!h.drill) inp.value=''; results.innerHTML=''; results.style.display='none'; }; results.appendChild(row); });
      if(onOther && !exact){
        var orow=document.createElement('div'); orow.className='search-hit';
        var onm=document.createElement('div'); onm.className='sh-name'; onm.textContent='Add \u201C'+raw+'\u201D'; orow.appendChild(onm);
        var otg=document.createElement('div'); otg.className='sh-tag'; otg.textContent='Other'; orow.appendChild(otg);

      function(h){ if(h.tag==='Value') addCard(vSec,h.name,'Value',''); else addCard(dSec,h.name,'Domain',''); },
      function(v){ if(mode==='domains') addCard(dSec,v,'Domain',''); else addCard(vSec,v,'Value',''); }));

    var mode='';
    var toggle=document.createElement('div'); toggle.className='cat-row'; listEl.appendChild(toggle);
    var ideasZone=document.createElement('div'); listEl.appendChild(ideasZone);

    function addedSection(title, arrowId){
      var hdr=document.createElement('div'); hdr.className='added-header-row';

      hdr.appendChild(lbl); hdr.appendChild(right); listEl.appendChild(hdr);

    }
    // Same rule as the other pickers: a lit idea means it is in the list, and it goes out again
    // when the card does.
    // ONE LIST PER HEADING. Jessie, 2026-09-14, with Agriculture and Food lit under Domains and nothing under Added
    // domains: "the domains that I selected are not showing up under the bar". Values and domains shared one list of
    // what was already added, so a word already among somebody's values (older answers hold sector words there) showed
    // lit as a domain and could not be added as one. Each heading keeps its own list now: v| for values, d| for domains.
    var VAL_ON={};
    function valKey(typeLabel, name){ return (typeLabel==='Domain'?'d|':typeLabel==='Work value'?'w|':'v|')+String(name).trim().toLowerCase(); }
    function syncValChips(){
      ideasZone.querySelectorAll('.cat').forEach(function(el){
        if(el.classList.contains('more')) return;
        if(VAL_ON[valKey(mode==='domains'?'Domain':'Value', el.textContent)]) el.classList.add('on'); else el.classList.remove('on');
      });
    }
    function addCard(sectn, name, typeLabel, level){
      var key=valKey(typeLabel, name);
      if(VAL_ON[key]) return;
      VAL_ON[key]=1;
      var card=document.createElement('div'); card.className='practice-item';
      var head=document.createElement('div'); head.className='practice-item-header';
      var nm=document.createElement('div'); nm.className='practice-item-name'; nm.textContent=name;
      var x=document.createElement('button'); x.className='practice-item-x'; x.innerHTML='&times;'; x.onclick=function(){ delete VAL_ON[key]; card.remove(); sectn.refresh(); syncValChips(); };
      head.appendChild(nm); head.appendChild(x); card.appendChild(head);
      var cat=document.createElement('div'); cat.className='practice-item-cat'; cat.textContent=typeLabel; card.appendChild(cat);
      // A work value has no Exploring, Engaged or Leading: it is what somebody wants from work, not how far along they are.
      if (typeLabel === 'Work value') { sectn.grid.appendChild(card); sectn.refresh(); syncValChips(); return; }
      var opts=document.createElement('div'); opts.className='practice-options';
      ['Exploring','Engaged','Leading'].forEach(function(lv){ var b=document.createElement('button'); b.className='practice-btn'+(level===lv?' selected':''); b.textContent=lv; b.onclick=function(){ var was=b.classList.contains('selected'); opts.querySelectorAll('.practice-btn').forEach(function(z){z.classList.remove('selected');}); if(!was){ b.classList.add('selected'); level=lv; } else { level=''; } }; opts.appendChild(b); });
      card.appendChild(opts);
      sectn.grid.appendChild(card); sectn.refresh(); syncValChips();
    }

    var vSec=addedSection('Added values','val-arrow');
    var dSec=addedSection('Added domains','dom-arrow');
    VALUES_ADDED.forEach(function(it){ addCard(vSec, it.t, 'Value', it.lvl); });
    DOMAINS_ADDED.forEach(function(it){ addCard(dSec, it.t, 'Domain', it.lvl); });
    // Work values, under their own heading, only for somebody who has some (see WORK VALUES).
    if (WORK_VALUES_ADDED.length) {
      var wSec=addedSection('Work values','wv-arrow');
      WORK_VALUES_ADDED.forEach(function(t){ addCard(wSec, t, 'Work value', ''); });
      wSec.refresh();
    }
    // A HEADING WITH NOTHING UNDER IT STILL SAYS WHAT IT IS. Jessie, 2026-09-14, with a picture of the Values step and
    // a blank blue bar under Added values: "for some reason the domains subheading is not showing up correctly". A
    // heading was only written when a card went in, so somebody with no domains got a bar with no words.
    vSec.refresh(); dSec.refresh();

    function valueIdeaPool(){ var list=(mode==='values'?VALUE_IDEAS:DOMAIN_IDEAS), typ=(mode==='values'?'Value':'Domain'); return list.map(function(n){ return {name:n, tag:typ}; }); }
    function showAddOwn(){
      var ex=ideasZone.querySelector('.addown'); if(ex) ex.remove();
      var panel=document.createElement('div'); panel.className='addown';
      var line=document.createElement('div'); line.className='addown-line';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='What would you like to add?';
      var add=document.createElement('button'); add.className='addown-btn'; add.textContent='Add';
      line.appendChild(inp); line.appendChild(add);
      var results=document.createElement('div'); results.className='addown-results';
      var acts=document.createElement('div'); acts.className='addown-actions';
      var done=document.createElement('button'); done.className='addown-cancel'; done.textContent='Done';
      acts.appendChild(done);
      panel.appendChild(line); panel.appendChild(results); panel.appendChild(acts);
      ideasZone.appendChild(panel); inp.focus();
      function put(v){ if(mode==='domains') addCard(dSec, v, 'Domain', ''); else addCard(vSec, v, 'Value', ''); }
      matchExisting(inp, results, valueIdeaPool, function(hit){ put(hit.name); inp.value=''; results.innerHTML=''; inp.focus(); });
      function commit(){ var v=_capFirst(inp.value.trim()); if(!v) return; put(v); inp.value=''; results.innerHTML=''; inp.focus(); }
      add.onclick=commit;
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      done.onclick=function(){ panel.remove(); };
    }
    function renderIdeas(){
      ideasZone.innerHTML='';
      if (!mode){ return; }
      var pool = (mode==='values'?VALUE_IDEAS:DOMAIN_IDEAS);
      var idea=document.createElement('div'); idea.className='ideas';
      idea.textContent = pool.length ? 'Here are some ideas to get you started.' : 'Looking up the list\u2026';
      ideasZone.appendChild(idea);
      var row=document.createElement('div'); row.className='cat-row';
      (mode==='values'?VALUE_IDEAS:DOMAIN_IDEAS).forEach(function(name){
        var el=chip(name, !!VAL_ON[valKey(mode==='domains'?'Domain':'Value', name)]);
        el.addEventListener('click', function(){ if(mode==='values') addCard(vSec, name, 'Value', ''); else addCard(dSec, name, 'Domain', ''); });
        row.appendChild(el);
      });
      var other=chip('+ Other',false,'more'); other.addEventListener('click', function(){ showAddOwn(); }); row.appendChild(other);
      ideasZone.appendChild(row);
    }
    var vChip=chip('Values',false); vChip.addEventListener('click', function(){ mode='values'; toggle.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on');}); vChip.classList.add('on'); renderIdeas(); });
    var dChip=chip('Domains',false); dChip.addEventListener('click', function(){ mode='domains'; toggle.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on');}); dChip.classList.add('on'); renderIdeas(); });
    toggle.appendChild(vChip); toggle.appendChild(dChip);
    // The sheet answers after this has drawn, so buildTreesFromRefData calls this to draw the
    // chips the moment the words arrive. Without it somebody who opened the section early would
    // sit looking at "Looking up the list" forever.
    window._valRenderIdeas = renderIdeas;
    renderIdeas();
  }

  // Needs section — mirrors the intake "What are you seeking right now?"
  // Person / Space / Thing. Person drills sub-type > (skills or recreation);
  // Space and Thing collect a free-text detail + a local flag. Added items are grouped
  // into Person / Space / Thing lists, each card showing Type: Item, category, an optional
  // "Seeking:" detail, and edit / 📍 Local / remove controls.
  var PERSON_SUBS = ['Skills/services','Recreation buddy','Accountability buddy'];
  var THING_SUBS = {
    'Physical goods':{emoji:'📦',placeholder:'Examples: a book, gear or equipment, art supplies, a tool I need'},
    'Consumables':{emoji:'🍲',placeholder:'Examples: coffee, a homemade meal, local ingredients, food for the week'},
    'Money':{emoji:'💙',placeholder:'Examples: help with medical, rent, household bills, funding a project'},
    'Living things':{emoji:'🪴',placeholder:'Examples: a cucumber plant, a bouquet of flowers, a clipping from your garden'}
  };
  // Nobody's profile starts as somebody else's. Every one of these arrays used to hold the
  // mockup's persona: Cooking, Collaboration, 20 acres open for camping, a truck to lend, a 2.5
  // pickleball game. That fiction showed on screen whenever a real profile had not loaded, and
  // pressing Save would have written it into that person's row as though they had typed it.
  // Jessie saw her own page offering Karina's truck. 2026-09-01.
  var NEEDS_ADDED = [];

  function recFlatPool(){ var out=[]; ENJOY_CATS.forEach(function(c){ var n=ENJOY_TREE[c]||{subs:{},items:[]}; Object.keys(n.subs||{}).forEach(function(sc){ (n.subs[sc]||[]).forEach(function(l){ out.push(l); }); }); (n.items||[]).forEach(function(it){ out.push(it); }); }); return out; }

  function renderNeeds(){
    listEl.className='list flow'; listEl.innerHTML='';
    var eq=document.createElement('div'); eq.className='enjoy-q'; eq.textContent='What are you seeking right now?'; listEl.appendChild(eq);
    // Your own words come first. What kind of thing it is, and which category it sits in, are
    // asked after it has a name rather than before you are allowed to say anything.
    var ownLine=document.createElement('div'); ownLine.className='addown-line'; ownLine.style.margin='4px 0 6px';
    var ownInp=document.createElement('input'); ownInp.type='text'; ownInp.className='need-own'; ownInp.placeholder='Write it in your own words';
    var ownBtn=document.createElement('button'); ownBtn.className='addown-btn'; ownBtn.textContent='Add';
    ownLine.appendChild(ownInp); ownLine.appendChild(ownBtn); listEl.appendChild(ownLine);
    // What you write IS the thing you are seeking, so it goes in as the name. It used to be put
    // in `detail` with the name left empty: the card showed it, because the card falls back to
    // detail, and the save wrote the name, which was blank. Jessie typed "test add", saw it on
    // the screen, and the sheet received a need with no name at all. 2026-09-01.
    function ownCommit(){ var v=_capFirst(ownInp.value.trim()); if(!v) return; ownInp.value=''; openAddEditor({item:v,type:'person',category:'',level:'',detail:'',local:true}); }
    ownBtn.onclick=ownCommit;
    ownInp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); ownCommit(); } });
    var orSub=document.createElement('div'); orSub.className='enjoy-sub'; orSub.textContent='Or browse by what kind of thing it is.'; listEl.appendChild(orSub);
    var typeRow=document.createElement('div'); typeRow.className='cat-row'; typeRow.style.margin='4px 0 8px'; listEl.appendChild(typeRow);
    var flow=document.createElement('div'); listEl.appendChild(flow);
    var added=document.createElement('div'); added.style.marginTop='22px'; listEl.appendChild(added);

    var type='', personSub='', thingSub='', skillPath=[];

    function crumb(){
      var c=document.createElement('div'); c.className='needs-crumb';
      var root=document.createElement('a'); root.textContent="What I'm seeking"; root.onclick=function(){ type=''; personSub=''; thingSub=''; skillPath=[]; syncTypeChips(); renderFlow(); }; c.appendChild(root);
      function seg(label, link, onclick){ var s=document.createElement('span'); s.className='sep'; s.textContent='›'; c.appendChild(s); if(link){ var a=document.createElement('a'); a.textContent=label; a.onclick=onclick; c.appendChild(a); } else { var t=document.createTextNode(label); c.appendChild(t); } }
      var typeLabel=type==='person'?'Person':type==='space'?'Space':'Thing';
      if(type==='person' && personSub){ seg('Person', true, function(){ personSub=''; skillPath=[]; renderFlow(); }); seg(personSub, false); }
      else if(type==='thing' && thingSub){ seg('Thing', true, function(){ thingSub=''; renderFlow(); }); seg(thingSub, false); }
      else { seg(typeLabel, false); }
      return c;
    }

    function detailBox(placeholderText){
      var box=document.createElement('div'); box.className='needs-detail-box';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder=placeholderText||'Please share some details'; box.appendChild(inp);
      var ll=document.createElement('label'); ll.className='local-line'; var ck=document.createElement('input'); ck.type='checkbox'; ck.checked=true; ll.appendChild(ck); ll.appendChild(document.createTextNode('📍 This is a local request')); box.appendChild(ll);
      var add=document.createElement('button'); add.className='needs-add-btn'; add.textContent='Add to list'; box.appendChild(add);
      return {box:box, inp:inp, ck:ck, add:add};
    }

    function renderFlow(){
      flow.innerHTML='';
      if(!type) return;
      flow.appendChild(crumb());
      if(type==='person'){
        if(!personSub){
          var row=document.createElement('div'); row.className='cat-row';
          PERSON_SUBS.forEach(function(sub){ var el=chip(sub,false); el.onclick=function(){ personSub=sub; skillPath=[]; renderFlow(); }; row.appendChild(el); });
          var other=chip('+ Other',false,'more'); other.onclick=function(){ personSub='Other'; skillPath=[]; renderFlow(); }; row.appendChild(other);
          flow.appendChild(row);
        } else if(personSub==='Recreation buddy'){
          var idea=document.createElement('div'); idea.className='ideas'; idea.textContent='Here are some ideas to get you started.'; flow.appendChild(idea);
          var rrow=document.createElement('div'); rrow.className='cat-row';
          recFlatPool().slice(0,28).forEach(function(name){ var el=chip(name,false); el.onclick=function(){ if(el.classList.contains('on'))return; el.classList.add('on'); openAddPerson(name,'Recreation buddy',''); }; rrow.appendChild(el); });
          var ro=chip('+ Other',false,'more'); ro.onclick=function(){ showNeedAddOwn(flow, function(v){ openAddPerson(v,'Recreation buddy',''); }, 'Recreation buddy'); }; rrow.appendChild(ro);
          flow.appendChild(rrow);
        } else {
          flow.appendChild(makeSearchBox('Search to add…',
            function(){ var out=[]; SKILL_CATS.forEach(function(c){ (SKILL_TREE[c]||[]).forEach(function(it){ out.push({name:it,cat:c,tag:c}); }); }); return out; },
            function(h){ openAddPerson(h.name, h.cat, ''); }));
          renderSkillDrill(flow);
        }
      } else if(type==='space'){
        var d=detailBox('A home, a meeting room, a venue, studio, workshop, or desk.');
        d.add.onclick=function(){ var v=d.inp.value.trim(); if(v) addSpace(v, d.ck.checked); };
        flow.appendChild(d.box);
      } else if(type==='thing'){
        var trow=document.createElement('div'); trow.className='cat-row';
        Object.keys(THING_SUBS).forEach(function(k){ var el=chip(THING_SUBS[k].emoji+' '+k, thingSub===k); el.onclick=function(){ thingSub=k; renderFlow(); }; trow.appendChild(el); });
        flow.appendChild(trow);
        if(thingSub){
          var d2=detailBox(THING_SUBS[thingSub].placeholder);
          d2.add.onclick=function(){ var v=d2.inp.value.trim(); if(v) addThing(thingSub, v, d2.ck.checked); };
          flow.appendChild(d2.box);
        }
      }
    }

    function renderSkillDrill(host){
      var zone=document.createElement('div'); host.appendChild(zone);
      function items(path){ if(path.length===0) return sortAlpha(SKILL_CATS).map(function(c){return {name:c,drill:true};}); return (SKILL_TREE[path[0]]||[]).map(function(l){return {name:l,drill:false};}); }
      function nav(path){
        zone.innerHTML='';
        if(path.length){ var idea=document.createElement('div'); idea.className='ideas'; idea.textContent='Here are some ideas to get you started.'; zone.appendChild(idea); }
        var row=document.createElement('div'); row.className='cat-row';
        items(path).forEach(function(it){ var el=chip(it.name,false); el.onclick=function(){ if(it.drill){ nav(path.concat(it.name)); } else { openAddPerson(it.name, path[0], ''); } }; row.appendChild(el); });
        var other=chip('+ Other',false,'more'); other.onclick=function(){ showNeedAddOwn(host, function(v){ openAddPerson(v, path[0]||'', ''); }, path[0]||'your list'); }; row.appendChild(other);
        zone.appendChild(row);
      }
      nav(skillPath);
    }

    function showNeedAddOwn(host, onAdd, where){
      var ex=host.querySelector('.addown'); if(ex) ex.remove();
      var panel=document.createElement('div'); panel.className='addown';
      var line=document.createElement('div'); line.className='addown-line';
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='What would you like to add?';
      var add=document.createElement('button'); add.className='addown-btn'; add.textContent='Add';
      line.appendChild(inp); line.appendChild(add);
      var results=document.createElement('div'); results.className='addown-results';
      var acts=document.createElement('div'); acts.className='addown-actions';
      var done=document.createElement('button'); done.className='addown-cancel'; done.textContent='Done';
      acts.appendChild(done);
      panel.appendChild(line); panel.appendChild(results); panel.appendChild(acts);
      host.appendChild(panel); inp.focus();
      matchExisting(inp, results, function(){ var out=[]; SKILL_CATS.forEach(function(c){ (SKILL_TREE[c]||[]).forEach(function(it){ out.push({name:it, tag:c}); }); }); return out; }, function(hit){ panel.remove(); onAdd(hit.name); });
      function commit(){ var v=_capFirst(inp.value.trim()); if(!v) return; panel.remove(); onAdd(v); }
      add.onclick=commit;
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      done.onclick=function(){ panel.remove(); };
    }

    // scheduleSave marks the page changed and saves shortly after. Without it, adding a need
    // drew on the screen and was never written: autoSave and Done both return early unless the
    // page is marked changed, so Jessie added a sixth need, saw it, left, and it was gone.
    // Every one of these four touches the list, so every one of them has to say so. 2026-09-01.
    function addNeed(obj){ NEEDS_ADDED.unshift(obj); renderAdded(); scheduleSave(); }
    // Person adds go through the confirm editor first (ask local / level / more context).
    function openAddPerson(item, category){ openAddEditor({item:item,type:'person',category:category||'',level:'',detail:'',local:true}); }
    function addSpace(detail, local){ addNeed({item:detail,type:'space',category:'',level:'',local:!!local,detail:''}); }
    function addThing(sub, detail, local){ addNeed({item:detail,type:'thing',category:sub,level:'',local:!!local,detail:''}); }

    // Shared editor form (screenshot): name, type, category, optional level, "what exactly",
    // local. Used both as a confirm step before adding and when editing via the pencil.
    function buildNeedEditor(src, onSave, onCancel){
      var d={item:src.item||'',type:src.type||'person',category:src.category||'',level:src.level||'',detail:src.detail||'',local:!!src.local};
      var box=document.createElement('div'); box.className='need-editor';
      var itemInp=document.createElement('input'); itemInp.type='text'; itemInp.placeholder='Name it (optional)'; itemInp.value=d.item; box.appendChild(itemInp);
      var typeSel=document.createElement('select');
      [['person','👤 Person'],['space','🏡 Space'],['thing','📦 Thing']].forEach(function(p){ var o=document.createElement('option'); o.value=p[0]; o.textContent=p[1]; typeSel.appendChild(o); });
      typeSel.value=d.type; box.appendChild(typeSel);
      var catSel=document.createElement('select'); box.appendChild(catSel);
      function fillCats(){
        var t=typeSel.value; catSel.innerHTML='';
        var opts=t==='thing'?Object.keys(THING_SUBS):t==='space'?[]:sortAlpha(SKILL_CATS);
        catSel.style.display=(t==='space')?'none':'';
        var o0=document.createElement('option'); o0.value=''; o0.textContent='Choose a category (optional)'; catSel.appendChild(o0);
        opts.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });
        catSel.value=d.category;
      }
      typeSel.onchange=fillCats; fillCats();
      var detailInp=document.createElement('input'); detailInp.type='text'; detailInp.placeholder='What exactly are you seeking? (e.g. A baker for my wedding party)'; detailInp.value=d.detail; box.appendChild(detailInp);
      var ll=document.createElement('label'); ll.className='ne-local'; var ck=document.createElement('input'); ck.type='checkbox'; ck.checked=d.local; ll.appendChild(ck); ll.appendChild(document.createTextNode('📍 Local')); box.appendChild(ll);
      var acts=document.createElement('div'); acts.className='ne-actions';
      var save=document.createElement('button'); save.className='ne-save'; save.textContent='Save';
      var cancel=document.createElement('button'); cancel.className='ne-cancel'; cancel.textContent='Cancel';
      acts.appendChild(save); acts.appendChild(cancel); box.appendChild(acts);
      save.onclick=function(){ d.item=itemInp.value.trim(); d.type=typeSel.value; d.category=(typeSel.value==='space')?'':catSel.value; d.detail=detailInp.value.trim(); d.local=ck.checked; onSave(d); };
      cancel.onclick=function(){ onCancel(); };
      return box;
    }
    function openAddEditor(draft){
      var ex=flow.querySelector('.need-editor'); if(ex) ex.remove();
      var editor=buildNeedEditor(draft, function(d){ addNeed({item:d.item,type:d.type,category:d.category,level:d.level,detail:d.detail,local:d.local}); editor.remove(); }, function(){ editor.remove(); });
      flow.appendChild(editor); editor.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function needCard(obj){
      var card=document.createElement('div'); card.className='need-item';
      var left=document.createElement('div'); left.className='need-item-left';
      var nm=document.createElement('div'); nm.className='need-item-name'; nm.textContent=obj.item||obj.detail||'Untitled'; left.appendChild(nm);
      if(obj.category){ var cat=document.createElement('div'); cat.className='need-item-cat'; cat.textContent=obj.category; left.appendChild(cat); }
      if(obj.detail&&obj.item){ var detEl=document.createElement('div'); detEl.className='need-item-detail'; detEl.textContent='Seeking: '+obj.detail; left.appendChild(detEl); }
      card.appendChild(left);
      var right=document.createElement('div'); right.className='need-item-right';
      var edit=document.createElement('button'); edit.className='need-icon-btn'; edit.title='Edit'; edit.textContent='✏️';
      edit.onclick=function(){ var editor=buildNeedEditor(obj, function(d){ obj.item=d.item; obj.type=d.type; obj.category=d.category; obj.level=d.level; obj.detail=d.detail; obj.local=d.local; renderAdded(); scheduleSave(); }, function(){ renderAdded(); }); card.replaceWith(editor); };
      var lt=document.createElement('label'); lt.className='local-toggle'+(obj.local?' active':''); var lck=document.createElement('input'); lck.type='checkbox'; lck.checked=!!obj.local; lt.appendChild(lck); lt.appendChild(document.createTextNode(' 📍 Local'));
      lck.onchange=function(){ obj.local=lck.checked; lt.classList.toggle('active', lck.checked); scheduleSave(); };
      var x=document.createElement('button'); x.className='need-x'; x.innerHTML='&times;'; x.onclick=function(){ var k=NEEDS_ADDED.indexOf(obj); if(k>-1) NEEDS_ADDED.splice(k,1); renderAdded(); scheduleSave(); };
      right.appendChild(edit); right.appendChild(lt); right.appendChild(x);
      card.appendChild(right);
      return card;
    }

    function groupRender(label, items){
      if(!items.length) return;
      var g=document.createElement('div'); g.className='needs-group';
      var h=document.createElement('div'); h.className='needs-group-header';
      h.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;';
      var ht=document.createElement('span'); ht.textContent=label+' ('+items.length+')'; h.appendChild(ht);
      var car=document.createElement('span'); car.textContent='\u25B2';
      car.style.cssText='font-size:11px;opacity:.85;flex-shrink:0;';
      car.setAttribute('aria-hidden','true');
      h.appendChild(car); g.appendChild(h);
      var grid=document.createElement('div'); grid.className='needs-grid';
      items.forEach(function(o){ grid.appendChild(needCard(o)); });
      // A long list of one kind should be foldable without losing the others.
      h.addEventListener('click', function(){
        var open = grid.style.display !== 'none';
        grid.style.display = open ? 'none' : '';
        car.textContent = open ? '\u25BC' : '\u25B2';
      });
      g.appendChild(grid); added.appendChild(g);

    function renderAdded(){

  // ── Shared profile view ("This is me") — the main screen others see ──
  // A HEADING, rather than a thing somebody does. The list is built from the reference data at
  // load rather than typed here, so it follows the sheet instead of becoming a second list to
  // keep in step with it. Compared with the emoji and the punctuation taken off, so
  // "\u{1F332} Nature & Outdoors" and "Nature & Outdoors" are one name. Jessie, 2026-09-02.
  var CAT_NAMES = {};
  function _catKey(s){ return String(s==null?'':s).replace(/[^\p{L}\p{N}]+/gu,' ').trim().toLowerCase(); }
  function _isCat(s){ var k=_catKey(s); return !!(k && CAT_NAMES[k]); }
  function _noCats(list, get){ return (list||[]).filter(function(x){ return !_isCat(get(x)); }); }
  function pvTag(name, opts){
    opts=opts||{};
    name=_capFirst(name);   // "baking" reads Baking; the stored word is not changed (2026-09-15)
    // A type word saved where a level goes ("item:skill") is not a level, so it is not shown as one.
    var lv=(opts.level && !new RegExp('^'+_TAG_TYPES+'$','i').test(String(opts.level).trim()))?'<span class="lv">'+esc(opts.level)+'</span>':'';
    var sb=opts.sub?'<span class="sub">'+esc(opts.sub)+'</span>':'';
    return '<div class="pv-tag'+(opts.cls?' '+opts.cls:'')+'">'+esc(name)+lv+sb+'</div>';
  }
  // Somebody who signed up through our own door has no Glide row, so there is nowhere for a
  // picture to come from and no way to make one. This gives them one.
  //
  // The shrinking happens here rather than on a server: a phone photo is four megabytes and a
  // round avatar is never more than six hundred pixels, so the browser does the only work that
  // was ever needed and about a hundred kilobytes leaves the device.
  var PHOTO_URL = 'https://cw-photos.jessieupp.workers.dev';
  function photoStat(msg){ var el=document.getElementById('pv-photo-stat'); if(el) el.textContent=msg||''; }
  function choosePhoto(){
    if(_viewing){ photoStat('Looking, not editing.'); return; }
    if(!_id){ return; }
    if(!_editToken){ requestEdit(0); return; }
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(f) shrinkPhoto(f); };
    inp.click();
  }
  function shrinkPhoto(file){
    photoStat('Getting it ready…');
    var img=new Image();
    img.onload=function(){
      try{
        // Square from the middle, which is the crop a round frame makes anyway.
        var side=Math.min(img.width, img.height);
        var c=document.createElement('canvas'); c.width=600; c.height=600;
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,600,600);
        c.toBlob(function(blob){
          if(!blob){ photoStat('That picture could not be read.'); return; }
          sendPhoto(blob);
        },'image/jpeg',0.85);
      }catch(e){ photoStat('That picture could not be read.'); }
      finally { try{ URL.revokeObjectURL(img.src); }catch(e){} }
    };
    img.onerror=function(){ photoStat('That picture could not be read.'); };
    img.src=URL.createObjectURL(file);
  }
  function sendPhoto(blob){
    photoStat('Sending…');
    fetch(PHOTO_URL+'/upload?id='+encodeURIComponent(_id), {
      method:'POST',
      headers:{ 'Content-Type':'image/jpeg', 'x-cw-token':_editToken },
      body:blob
    }).then(function(r){ return r.json(); }).then(function(d){
      if(!d || d.status!=='ok' || !d.url){ photoStat((d&&d.message)||'That did not go through.'); return; }
      // Cache-busted so the new face shows at once rather than after the edge forgets the old one.
      _profilePhoto = d.url + '?v=' + Date.now();
      _loaded.photoURL = d.url;
      photoStat('');
      scheduleSave();
      renderProfileView();
    }).catch(function(){ photoStat('That did not go through.'); });
  }

  function pvSection(label, step, tagsHtml, extra){
    var canEdit = !(_viewingSomeoneElse || _param('edit') !== '1');
    if(!tagsHtml && !extra && !canEdit) return '';
    return '<div class="pv-section"><div class="pv-section-header"><div class="pv-section-label">'+label+'</div>'
      +(canEdit?'<button class="pv-edit" data-step="'+step+'">✏️ Edit</button>':'')+'</div>'

      +'<div class="pv-tags"'+(style?' style="'+style+'"':'')+'>'+inner+'</div>';

  function renderProfileView(){
    paintShellHeader();
    var pv=document.getElementById('profile-view');
    var seeking=NEEDS_ADDED.map(function(n){ return pvTag((n.local?'📍 ':'')+n.item, {sub:n.category||''}); }).join('');

    var _ex=EXPRESSION_ADDED.filter(Boolean);

    // Making and designing, Repairing and fixing, Consulting and advising. These were drawn small

    var methods=pvWrap(SKILL_METHODS_ON.map(function(m){ return pvTag(m); }).join(''), '', 'margin-bottom:10px;');

    var vals=pvWrap(_noCats(VALUES_ADDED,function(x){return x.t;}).map(function(v){ return pvTag(v.t,{level:v.lvl}); }).join(''), '');
    // Sectors on the screen. The stored column is still called domains and is not touched here,
    // so this is a heading change and nothing else. Jessie, 2026-09-02.
    var doms=pvWrap(_noCats(DOMAINS_ADDED,function(x){return x.t;}).map(function(v){ return pvTag(v.t,{level:v.lvl}); }).join(''), 'Sectors');
    var _haveList=SECTIONS[4].data.map(function(h){ return {t:h.text||'A have', sub:(h.cats&&h.cats[0])||''}; });
    // Nothing in the haves list but an answer written as tags: those are the haves, drawn as pills (display only).

    var _pillsEnjoy=_noCats(ENJOY_ADDED,function(x){return x.t;}).map(function(x){ return x.t; });
    var _pillsSkills=_noCats(SKILLS_ADDED,function(x){return x.t;}).map(function(x){ return x.t; }).concat(SKILL_METHODS_ON, _langs);
    var _pillsHaves=_haveList.map(function(h){ return h.t; });
    var _pillsNeeds=NEEDS_ADDED.map(function(n){ return n.item; });
    // MY PURPOSE, shown for the first time (row 185). It is ikigai.purpose, in the person's own sentences, written by
    // creating.works/work and by the intro's Purpose step. Drawn as words, not as a pill.
    var _purpose=String((_loaded&&_loaded.purpose)||'').trim();
    var purposeHtml=_purpose ? '<div class="pv-sub-h">My purpose</div><div class="pv-said" style="font-style:normal;">'+esc(_purpose).split('\n').join('<br>')+'</div>' : '';
    pv.innerHTML='<div class="pv-card">'
      // The whole name, and nothing to press. This is the page somebody else sees, so there is no

      // THE NAME, AND "THIS IS" ONLY FOR A VISITOR. Jessie, 2026-09-15: "said &quot;This is Kendell&quot; when I was look AS her -
      // shouldn't read like that - just name". Your own profile, and anybody's you are viewing AS, reads as the name alone;
      // somebody else's profile you are visiting reads "This is" and the name. A name typed in lower case reads with capitals.
      +'<div class="pv-head"><h2 class="pv-title">'+(function(){
          var nm=String(_profileName||'').trim();
          if(nm && nm===nm.toLowerCase()) nm=nm.replace(/(^|\s)(\S)/g,function(m,a,b){ return a+b.toUpperCase(); });
          if(!nm) return 'This is me';
          return (!_viewing && _viewingSomeoneElse) ? 'This is '+esc(nm) : esc(nm);
        })()+' 🌱</h2>'

      // Their face, on the right of the heading. Jessie asked for it on 2026-09-03. Their

      +pvFace()

      +(_viewingSomeoneElse?'':'<div id="pv-share" class="pv-share"></div>')

      // What somebody is seeking sits at the FOOT of the profile, not the head. Jessie asked for

      +pvSection('What I care about',3,'',vals+doms+pvWrap((WORK_VALUES_ADDED||[]).map(function(t){ return pvTag(t); }).join(''), 'Work values')+purposeHtml+pvSaid('values',_noCats(VALUES_ADDED,function(x){return x.t;}).map(function(x){return x.t;}).concat(_noCats(DOMAINS_ADDED,function(x){return x.t;}).map(function(x){return x.t;}),WORK_VALUES_ADDED||[])))

    pv.querySelectorAll('.pv-edit').forEach(function(b){ if(b.id==='pv-photo-btn'||b.id==='pv-bookmark'||b.id==='pv-edit-mine') return; b.onclick=function(){ requestEdit(parseInt(b.getAttribute('data-step'),10)); }; });
    var _em=document.getElementById('pv-edit-mine');

    var _pp=document.getElementById('pv-photo'); if(_pp) _pp.onclick=choosePhoto;
    var _pm=document.getElementById('pv-manage'); if(_pm) _pm.onclick=function(){ window.location.href='https://creating.works/profile'+(_id?'?CWid='+encodeURIComponent(_id):''); };
    var _pg=document.getElementById('pv-groups'); if(_pg) _pg.onclick=function(){ showManage('groups'); };
  }
  // THE LINK YOU HAND OUT, row 195, 2026-09-15. Jessie: "the profile URL should be shareable and is
  // identifiable to that person, even when signed out ... but should uphold our privacy concerns".
  //
  // The address is 2gather.network/ikigai/?p=<code>, six characters worked out here FROM the id, the
  // same six the event page's share links carry as r= and the same six the backend works out. Nothing
  // is stored and nothing has to be asked for, so the button works the instant the page has a person,
  // and a link handed out today still resolves in a year.
  function _pubCodeFor(id){
    var v=String(id||'').split('.').join('').toLowerCase();
    var h=5381;
    for(var i=0;i<v.length;i++){ h=((h*33)^v.charCodeAt(i))>>>0; }
    return ('000000'+h.toString(36)).slice(-6);
  }
  function _myPublicLink(){
    var code=_pubCodeFor(_id);
    return code?('https://2gather.network/ikigai/?p='+code):'';
  }
  function drawShare(){
    var box=document.getElementById('pv-share');
    if(!box) return;
    var url=_myPublicLink();
    if(!url){ box.style.display='none'; return; }
    box.innerHTML='<button type="button" id="pv-copy">🔗 Copy link</button>'
      +(navigator.share?'<button type="button" id="pv-share-btn">Share</button>':'')
      +'<button type="button" id="pv-qr-btn">QR code</button>'
      +'<div class="pv-share-note" id="pv-share-note"></div>'
      +'<div class="pv-qr" id="pv-qr" style="display:none;"><canvas id="pv-qr-canvas"></canvas><div class="pv-qr-url">'+esc(url)+'</div></div>';
    // WHETHER THE LINK ACTUALLY SHOWS ANYTHING. A page must not claim this before it knows, so the
    // line is drawn only once the profile has come back and said so. visPublic rides on getProfile
    // already, through Info, so this costs no second request.
    var raw=window._profRaw||null;
    var note=document.getElementById('pv-share-note');
    if(raw && String(raw.visPublic||'').trim().toUpperCase()!=='TRUE'){
      note.innerHTML='Your public profile is off, so anybody opening this link is told it is not being shared. '
        +'Turn it on, and choose what shows, under <a href="https://2gather.network/intro/?perm=1&step=permissions">My permissions</a>.';
    }
    var copy=function(btn,done){
      var ok=function(){ var was=btn.textContent; btn.textContent=done; setTimeout(function(){ btn.textContent=was; },2000); };
      // Brave and an insecure page both refuse the clipboard, so there is a way that always works.
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(ok).catch(function(){ _copyFallback(url,ok); });
      } else { _copyFallback(url,ok); }
    };
    document.getElementById('pv-copy').onclick=function(){ copy(this,'Link copied'); };
    var sb=document.getElementById('pv-share-btn');
    if(sb) sb.onclick=function(){
      var btn=this;
      navigator.share({ title:(_profileName||'My profile')+' on 2Gather', url:url })
        .catch(function(){ copy(btn,'Link copied'); });
    };
    document.getElementById('pv-qr-btn').onclick=function(){
      var qr=document.getElementById('pv-qr');
      if(qr.style.display!=='none'){ qr.style.display='none'; this.textContent='QR code'; return; }
      qr.style.display='block'; this.textContent='Hide QR code';
      _drawQr(url);
    };
  }
  function _copyFallback(text,ok){
    try{
      var t=document.createElement('textarea');
      t.value=text; t.style.cssText='position:fixed;opacity:0;';
      document.body.appendChild(t); t.select(); document.execCommand('copy');
      document.body.removeChild(t); ok();
    }catch(e){}
  }
  // The same library and the same call the event page and the group invitation use, loaded only
  // when somebody actually asks for a QR code.
  function _drawQr(url){
    if(!window.QRious){
      var sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js';
      sc.onload=function(){ _drawQr(url); };
      sc.onerror=function(){ var q=document.getElementById('pv-qr'); if(q) q.innerHTML='<div class="pv-qr-url">The QR code did not load. The link above still works.</div>'; };
      document.head.appendChild(sc);
      return;
    }
    new QRious({ element:document.getElementById('pv-qr-canvas'), value:url, size:220, foreground:'#1A2E42', background:'#ffffff', level:'H', padding:14 });
  }

  // ── WHAT WE HAVE IN COMMON, on a profile (row 192, 2026-09-16) ────────────────────────────────
  // Jessie: "what we have in common is a button that reads 2 profiles (visitor and profile being
  // visited) to create commonalities which we had at one point or antoher." We do have it: the
  // group page and the attendees board have crossed one person's answers against another's since
  // August. What it has never had is a place on a profile, comparing exactly two people.
  //
  // The rules are the group page's own. A word knows which field it came from, and the sentence
  // says only what that field supports: a skill is something somebody can actually do for you, what
  // they enjoy or care about is worth asking about and is not an offer, and a need on both sides is
  // two people looking for the same thing. The group page's frequency damping is left out on
  // purpose: it exists to stop a word half the group shares forming a card, and with two people
  // there is no group to measure against.
  //
  // It is drawn only on somebody else's profile, and only once both profiles are actually here.
  // A viewer whose own profile does not load sees nothing at all rather than a wrong answer.
  var IC_KIND = { skills:'offer', professionalServices:'offer', haves:'offer',
                  interests:'enjoy', hobbies:'enjoy',
                  values:'value', domains:'value',
                  needs:'need' };
  function icWords(row, field){
    var v = row ? row[field] : '';
    return String(v == null ? '' : v).split(/[|,]/)
      .map(function(x){ return String(x).split(':')[0].trim(); })
      .filter(Boolean);
  }
  function icBuckets(row){
    var out = { offer:{}, enjoy:{}, value:{}, need:{} };
    Object.keys(IC_KIND).forEach(function(f){
      icWords(row, f).forEach(function(w){ out[IC_KIND[f]][w.toLowerCase()] = w; });
    });
    return out;
  }
  function drawInCommon(){
    if (!_viewingSomeoneElse) return;
    var theirs = window._profRaw; if (!theirs) return;
    // THE VIEWER IS WHOEVER THE PAGE IS BEING VIEWED AS. Jessie, 2026-09-16, looking at Doug's own
    // profile while viewing as Doug: "viewing as self it shows What we have in common ... why?" This
    // read CW.realMe(), her own id, so it compared HER with Doug and drew two things they share on
    // his own profile. While somebody is being looked at, they are the viewer; a page showing what
    // they would see must compare from where they stand.
    //
    // And nobody has anything in common with themselves, so on your own profile it draws nothing at
    // all - which is what stops it the moment the id is right.
    var mine = '';
    try { mine = (window.CW && CW.me) ? String(CW.me().id || '') : ''; } catch(e){}
    if (!mine) { try { mine = (window.CW && CW.realMe) ? String(CW.realMe().id || '') : ''; } catch(e2){} }
    if (!mine) return;                       // signed out: nothing to compare against
    var _same = function(a, b){ return String(a||'').split('.').join('').toLowerCase() === String(b||'').split('.').join('').toLowerCase(); };
    if (_same(mine, _id)) return;            // your own profile: there is no "we"
    try { if (theirs && theirs.appearId && _same(mine, theirs.appearId)) return; } catch(e3){}
    var pv = document.getElementById('profile-view'); if (!pv) return;
    fetch(GS_URL + '?action=getProfile&appearId=' + encodeURIComponent(mine))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if (!resp || !resp.found || !resp.data) return;   // say nothing rather than guess
        var A = icBuckets(resp.data), B = icBuckets(theirs);
        var nm = String(_profileName || 'they').trim().split(/\s+/)[0] || 'they';
        var esc2 = esc, rows = [], seen = {};
        var add = function(pri, mark, text){
          var k = String(text).toLowerCase();
          if (seen[k]) return; seen[k] = 1;
          rows.push({ pri: pri, mark: mark, text: text });
        };
        var cross = function(a, b, fn){
          Object.keys(a).forEach(function(k){ if (b[k]) fn(a[k]); });
        };
        // A real offer first, then two people looking for the same thing, then common ground.
        cross(B.offer, A.need,  function(w){ add(1, '✨', esc2(nm) + ' can help with <b>' + esc2(w) + '</b>'); });
        cross(A.offer, B.need,  function(w){ add(1, '✨', 'You can help ' + esc2(nm) + ' with <b>' + esc2(w) + '</b>'); });
        cross(A.need,  B.need,  function(w){ add(2, '💡', 'You and ' + esc2(nm) + ' are both looking for <b>' + esc2(w) + '</b>'); });
        cross(A.enjoy, B.enjoy, function(w){ add(3, '✨', 'You and ' + esc2(nm) + ' enjoy <b>' + esc2(w) + '</b>'); });
        cross(A.value, B.value, function(w){ add(3, '✨', 'You and ' + esc2(nm) + ' both care about <b>' + esc2(w) + '</b>'); });
        cross(A.offer, B.offer, function(w){ add(4, '✨', 'You and ' + esc2(nm) + ' both work in <b>' + esc2(w) + '</b>'); });
        if (!rows.length) return;            // nothing shared is not a section, it is silence
        rows.sort(function(x, y){ return x.pri - y.pri; });
        var html = '<div class="pv-section" id="pv-incommon"><div class="pv-section-header">'
          + '<div class="pv-section-label">What we have in common</div></div>'
          + '<div style="display:flex;flex-direction:column;gap:8px;">'
          + rows.slice(0, 12).map(function(r){
              return '<div style="font-size:14.5px;color:var(--ink);line-height:1.5;">' + r.mark + ' ' + r.text + '</div>';
            }).join('')
          + '</div>'
          + (rows.length > 12 ? '<div style="font-size:12.5px;color:var(--muted);margin-top:8px;">and ' + (rows.length - 12) + ' more</div>' : '')
          + '</div>';
        var card = pv.querySelector('.pv-card');
        var first = card ? card.querySelector('.pv-section') : null;
        if (card && first) first.insertAdjacentHTML('beforebegin', html);
        else if (card) card.insertAdjacentHTML('beforeend', html);
      })
      .catch(function(){});
  }

  var GS_URL='https://cw-api-gate.jessieupp.workers.dev';

// The cache is trusted now, and nothing here skips it.
//
// History, because this line has moved twice in three days. On 2026-08-30 the page began adding
// nocache=1 to every read about you, since a save cleared nothing at the gate and a profile could
// show pre-save answers for six hours. That cost the whole wait on every visit. On 2026-09-01 the
// gate learned to clear a person's cached reads the moment they write, so the bypass was cut down
// to twenty seconds after a save.
//
// Twenty seconds was still wrong, and Jessie found it within minutes: the editor autosaves, so
// every save restamped the clock and kept her in the slow path the entire time she was editing,
// and for twenty seconds after every keystroke that triggered a save. She saved, moved pages, came
// back, and everything took five seconds again.
//
// It is gone. Every read this page makes carries appearId and nothing else, which is exactly the
// key the gate's purge rebuilds, so a save clears them all and the next read is fresh. The thirty
// second life on those entries is the backstop if a purge ever misses.

  var LANG_LIST=['English','Mandarin','Cantonese','Hindi','Spanish','Arabic','Bengali','Portuguese','French','Urdu',
    'Russian','Indonesian','German','Japanese','Swahili','Marathi','Telugu','Turkish','Tamil','Vietnamese','Korean',
    'Italian','Thai','Persian (Farsi)','Polish','Pashto','Punjabi','Ukrainian','Malayalam','Kannada','Romanian','Dutch',
    'Greek','Czech','Hungarian','Gujarati','Somali','Swedish','Norwegian','Hebrew','Danish','Finnish','Albanian',
    'Croatian','Lithuanian','Nepali','Khmer (Cambodian)','Hmong','Estonian','Laotian','Sign Language'];
  function buildTreesFromRefData(rd){
    try{
      LANG_LIST=(rd.languages||[]).map(function(x){ return String(x).trim(); }).filter(Boolean);
      // Recreation → Enjoy tree (recType > category > item)
      var recOrder=['Movement & Performance','Sports','Outdoor & Nature','Games & Strategy','Making & Collecting'];
      var etree={};
      (rd.recreation||[]).forEach(function(r){
        var rt=String(r.recType||'').trim(), cat=String(r.category||'').trim(), it=String(r.item||'').trim();
        if(!rt||!it) return;
        if(!etree[rt]) etree[rt]={subs:{},items:[]};
        if(cat){ if(!etree[rt].subs[cat]) etree[rt].subs[cat]=[]; if(etree[rt].subs[cat].indexOf(it)<0) etree[rt].subs[cat].push(it); }
        else { if(etree[rt].items.indexOf(it)<0) etree[rt].items.push(it); }
      });
      var ecats=recOrder.filter(function(c){return etree[c];}).concat(Object.keys(etree).filter(function(c){return recOrder.indexOf(c)<0;}));
      if(ecats.length){ ENJOY_CATS=ecats; ENJOY_TREE=etree; }
      // Skills → per parent-category lists (16 fixed parent cats)
      var scats=['Arts & Culture','Food & Drink','Physical Wellbeing','Mental Wellbeing','Family Wellbeing','Self-Expression & Beauty','Home & Construction','Transportation','Mechanical & Manufacturing','Business & Finance','Community & Civic','Recreation & Hobbies','Technology & Communications','Nature & Outdoors','Social Events & Gatherings','Pets & Animal Care'];
      var stree={}, sseen={}; scats.forEach(function(c){ stree[c]=[]; sseen[c]={}; });
      (rd.skills||[]).forEach(function(s){
        var cat=String(s.category||'').trim(), it=String(s.item||'').trim();
        if(stree[cat]!==undefined && it && !sseen[cat][it.toLowerCase()]){ sseen[cat][it.toLowerCase()]=1; stree[cat].push(it); }
      });
      SKILL_CATS=scats; SKILL_TREE=stree;
      // Values / Domains
      var vi=(rd.values||[]).map(function(v){return String((v&&v.item!==undefined)?v.item:v||'').trim();}).filter(Boolean);
      var di=(rd.domains||[]).map(function(v){return String((v&&v.item!==undefined)?v.item:v||'').trim();}).filter(Boolean);
      if(vi.length) VALUE_IDEAS=vi;
      if(di.length) DOMAIN_IDEAS=di;
      // Draw them, in case the values section was opened before the sheet answered.
      try{ if((vi.length||di.length) && window._valRenderIdeas) window._valRenderIdeas(); }catch(e){}
      // Methods (display strings) and Person sub-types
      var md=(rd.methodsDisplay||[]).map(function(m){return String(m||'').trim();}).filter(Boolean);
      if(md.length) METHODS=md;
      var pt=(rd.personTypes||[]).map(function(p){return String(p||'').trim();}).filter(function(p){return p && p.toLowerCase()!=='other';});
      if(pt.length) PERSON_SUBS=pt;
      // Every name the sheet uses as a heading, gathered in one place so the profile can leave
      // them off. Jessie asked for the top level categories off this page, 2026-09-02.
      function _mark(v){ var k=_catKey(v); if(k) CAT_NAMES[k]=1; }

  // 2026-09-03, on ?show= for another person.
  // A BREATHING PILL, IN THE PANEL. Jessie, 2026-09-15: "Make loading info a breathing pill". The rail moves it into the
  // white panel (below). The wait itself is the backend: the profile comes from Apps Script reading Info and ikigai.
  _bootNote.innerHTML = '<span class="pe-loading">' + (_viewingSomeoneElse ? 'Loading information…' : 'Loading your information…') + '</span>';
  if(!_pubCode){ (document.getElementById('pe-shell') || document.body).appendChild(_bootNote); }
  function _bootDone(){
    var n = document.getElementById('pe-booting');
    if (n && n.parentNode) { n.parentNode.removeChild(n); }
  }
  Promise.all([_pRef,_pProf]).then(function(){
    if(_pubCode) return;
    // A call that failed used to be swallowed by an empty catch, so the page drew a card with
    // nothing in it. An empty profile and a profile that did not load look identical on screen
    // and mean opposite things, and Apps Script answers with an HTML error page often enough
    // that this is not rare. Say it instead of drawing a blank. Jessie, 2026-09-02, whose page
    // came up empty after fifteen seconds and was fine on a reload.
    if (window._profFetchFailed) {
      var n = document.getElementById('pe-booting');
      if (n) { n.textContent = (_viewingSomeoneElse ? 'This information did not load. Reload the page to try again.' : 'Your information did not load. Reload the page to try again.'); }
      return;
    }
    _bootDone();
    if(_manageParam){ var _mk=(['groups','events','permissions','data'].indexOf(_manageParam)>-1)?_manageParam:'data'; showManage(_mk); }
    // This used to send somebody else's profile to /profile/, back when /profile/ was the page
    // that read a profile and this one only changed it. /profile/ was retired on 2026-09-02 and
    // now forwards every parameter straight back here, so the two pages threw the same address
    // at each other for ever: Jessie clicked a person from a group on 2026-09-03 and the screen
    // blinked on "Loading your information..." and never stopped.
    //
    // This page already resolves ?show= into _id and already hides Edit while _viewingSomeoneElse
    // is on, so it can simply draw the profile. Same two lines the branch below uses for your own.
    else if(_viewingSomeoneElse && _showParam){
      setBreadcrumb('view'); renderProfileView();
    }
    // This page shows your answers. It opens on the pills rather than the editor, because that
    // is what Jessie asked for: one page, every category, nothing to fill in. The editor is
    // still at /profile-edit/ and the whole stacked version is one step behind ?edit=1.
    else if(_id){
      if (_param('edit') === '1') { requestEdit(_stepParam || 0); }
      else { setBreadcrumb('view'); renderProfileView(); }
    }
    else { showView(); }
  }).catch(function(){
    var n = document.getElementById('pe-booting');
    if (n) { n.textContent = 'Your profile could not be loaded. Reload the page to try again.'; }
  });
</script>
<!-- THE PROFILE IN THE TEMPLATE, A LIVE MOCKUP. Jessie, 2026-09-14: "https://2gather.network/ikigai/ Can we use our

     The rail is nav/profile-rail.js, the same one My account draws ("the rail should stay the same when toggling to my

  // The public page is its own thing: no rail, because every button on the rail belongs to the

  if (_pubCode || _param('look') === 'list' || !window.cwProfileRail) return;
  // NO RAIL OVER SOMEBODY ELSE'S PROFILE, row 192. Jessie, 2026-09-18, opening a face in a group:
  // "when clicking a person's face here it goes to what looks like their account?" It did, and this

  //
  // The reason is already written three lines up for the public page: every button on the rail
  // belongs to the person whose profile it is, and somebody looking is not that person. That was
  // true for a visitor and it is just as true for a member looking at another member.
  if (_viewingSomeoneElse) return;
  document.documentElement.classList.add('cw-own');
  var main = cwProfileRail({ active: 'profile', wrap: document.querySelector('.wrap'), viewingSomeoneElse: _viewingSomeoneElse });
  // "Loading your information..." is written for the blue; in the template it sits in the panel.

<!-- ─────────────────────────────────────────────────────────────────────────────────────────────
     THE PUBLIC PROFILE, row 195, 2026-09-15. Jessie: "the profile URL should be shareable and is
     identifiable to that person, even when signed out ... but should uphold our privacy concerns".

     2gather.network/ikigai/?p=<code>. The code is six characters worked out FROM the id, the same
     six the share links carry as r=, so the address names one person and cannot be turned back into
     an id. Nothing here asks who is looking, and nothing here is drawn unless that person turned
     their public profile on and said, section by section, what a stranger may see.

     It draws only what the backend sends. A section the person kept back arrives as an empty list
     and is not drawn at all, so an empty heading can never imply there is something behind it.
     ───────────────────────────────────────────────────────────────────────────────────────────── -->
<style>
  html.cw-pub .wrap{max-width:820px;}
  html.cw-pub #pe-shell,html.cw-pub #edit-mode,html.cw-pub #manage-mode,html.cw-pub .breadcrumb{display:none !important;}
  .cw-pub-place{font-size:14.5px;font-weight:600;color:var(--soft);margin:2px 0 0;}
  .cw-pub-empty{background:#fff;border-radius:14px;padding:28px 24px;font-size:15.5px;color:var(--ink);line-height:1.55;}
</style>
<script>
(function(){
  if(!_pubCode) return;
  document.documentElement.classList.add('cw-pub');
  var pv=document.getElementById('profile-view');
  // A page that has not heard back says it is looking. It never says "not shared" until the
  // backend has actually answered that.
  pv.innerHTML='<div style="padding:8px 2px;"><span class="pe-loading">Loading this profile…</span></div>';

  function tag(text,sub){
    return '<div class="pv-tag">'+esc(text)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>';
  }
  function tags(list){
    list=(list||[]).filter(Boolean);
    return list.length?list.map(function(t){ return tag(t); }).join(''):'';
  }
  function wrap(inner,subHead){
    if(!inner) return '';
    return (subHead?'<div class="pv-sub-h">'+esc(subHead)+'</div>':'')+'<div class="pv-tags">'+inner+'</div>';
  }
  function section(label,inner){
    if(!inner) return '';
    return '<div class="pv-section"><div class="pv-section-header"><div class="pv-section-label">'+esc(label)+'</div></div>'+inner+'</div>';
  }
  function face(d){
    if(d.photo) return '<div class="pv-face"><img src="'+esc(String(d.photo))+'" alt=""></div>';
    var nm=String(d.name||'').trim();
    if(!nm) return '';
    var ini=nm.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
    return ini?'<div class="pv-face">'+esc(ini)+'</div>':'';
  }

  function draw(d){
    var nm=String(d.name||'').trim();
    // A name typed in lower case reads with capitals, the same as everywhere else on this page.
    if(nm && nm===nm.toLowerCase()) nm=nm.replace(/(^|\s)(\S)/g,function(m,a,b){ return a+b.toUpperCase(); });
    document.title=(nm||'A profile')+' · 2Gather';
    var skills=tags((d.skills||[]).concat(d.languages||[]));
    var care=tags(d.careAbout);
    var sectors=tags(d.sectors);
    var work=tags(d.workExperience);
    var purpose=String(d.purpose||'').trim();
    var careInner=wrap(care,'')+wrap(sectors,'Sectors')+wrap(work,'Work values')
      +(purpose?'<div class="pv-sub-h">My purpose</div><div class="pv-said" style="font-style:normal;">'+esc(purpose).split('\n').join('<br>')+'</div>':'');
    var haves=tags(d.offerings);
    var openTo=tags(d.openToWork);
    var havesInner=wrap(haves,'')+wrap(openTo,'Open to work');
    pv.innerHTML=_trailHTML(nm)+'<div class="pv-card">'
      +'<div class="pv-head"><div><h2 class="pv-title">'+(nm?esc(nm):'A profile')+' 🌱</h2>'
      +(d.place?'<p class="cw-pub-place">'+esc(d.place)+'</p>':'')+'</div>'
      +'<div class="pv-head-right">'+face(d)+'</div></div>'
      +section("What I'm seeking",wrap(tags(d.needs),''))
      +section('What I enjoy',wrap(tags(d.enjoy),''))
      +section('My skills',wrap(skills,''))
      +section('What I care about',careInner)
      +section('My haves',havesInner)
      +'</div>';
    // NO FOOTER UNDER A SHARED PROFILE. Jessie, 2026-09-18: 'remove This is what Jessie Upp chose to
    // show. 2Gather'. It said out loud that the person had picked what was on the page, which is the
    // one thing the page cannot help saying anyway, and then put a second 2Gather mark under a page
    // that already carries the bar at the top. The way back to 2Gather is that bar.
  }

  // ── A TRAIL ON A PROFILE SOMEBODY IS VISITING, ?bc=1, a live mockup ─────────────────────────
  // Jessie, 2026-09-18: "Add breadcrumbs to this page for people visiting profiles". Every other
  // page inside a group has one and this page, which people reach FROM those pages, had none.
  //
  // WHERE THE FIRST CRUMB COMES FROM. The bar already writes the address of every page as it is
  // left (cw-prev-page, sessionStorage, topbar.js), because Brave leaves document.referrer empty
  // and the trail on Support and FAQ needed the same thing. So this asks the site, not the browser.
  //
  // It only ever names a page of ours, and a group link carries its own name, so the crumb can read
  // "Climate Group" rather than "Group". Nothing known, or nothing in the last half hour, falls back
  // to 2Gather, which is always true. It never guesses, and a profile is never a profile's parent.
  function _trailPrev(){
    var raw='';
    try { raw=sessionStorage.getItem('cw-prev-page')||''; } catch(e){}
    if(!raw) return null;
    var got=null; try{ got=JSON.parse(raw); }catch(e){ return null; }
    if(!got||!got.href) return null;
    if(Date.now()-Number(got.at||0) > 30*60*1000) return null;
    var u=null; try{ u=new URL(String(got.href)); }catch(e){ return null; }
    if(u.hostname!=='2gather.network') return null;
    var path=String(u.pathname||'').toLowerCase();
    if(path.indexOf('/ikigai')===0) return null;
    var named='';
    try { named=String(u.searchParams.get('name')||'').trim(); } catch(e){}
    var label=named
      || (path.indexOf('/groups')===0 ? 'Groups'
      : path.indexOf('/group')===0 ? 'Group'
      : path.indexOf('/mygroups')===0 ? 'My groups'
      : path.indexOf('/myevents')===0 ? 'My events'
      : path.indexOf('/events')===0 ? 'Calendar'
      : path.indexOf('/event')===0 ? 'Event'
      : '');
    if(!label) return null;
    return { href:String(got.href), label:label };
  }
  // NEVER LET THE TRAIL TAKE THE PAGE DOWN WITH IT. This function is called from inside draw(), and
  // draw() runs inside a promise whose catch says "This profile did not load." So anything thrown in
  // here would hide the whole profile behind a message about the backend, which is a lie and is
  // exactly what happened on 2026-09-18 when this function was called before it had been written.
  // A trail is decoration; it fails to nothing.
  function _trailHTML(nm){
    try {
      // LIVE FOR EVERYBODY since 2026-09-18. Jessie, of the ?bc=1 mockup: "1 yes works".
      var prev=_trailPrev();
      var first=prev||{ href:'https://2gather.network/events/', label:'2Gather' };
      return '<div class="pv-trail">'
        + '<a role="link" tabindex="0" data-nav="'+esc(first.href)+'" onclick="return _safeNavGo(this)">'+esc(first.label)+'</a>'
        + '<span class="pv-trail-sep">/</span>'
        + '<span class="pv-trail-here">'+esc(nm||'A profile')+'</span>'
        + '</div>';
    } catch(e){ return ''; }
  }

  function notShared(){
    document.title='A profile · 2Gather';
    pv.innerHTML='<div class="cw-pub-empty"><strong>This profile is not being shared.</strong><br>'
      +'The link works, but the person it belongs to has not turned their public profile on. '
      +'If it is yours, open <a href="https://2gather.network/ikigai/">your profile</a> and turn it on under My permissions.</div>';
  }
  function didNotLoad(){
    pv.innerHTML='<div class="cw-pub-empty"><strong>This profile did not load.</strong><br>'
      +'That is us, not the link. Reload the page to try again.</div>';
  }

  fetch(GS_URL+'?action=publicProfile&p='+encodeURIComponent(_pubCode))
    .then(function(r){ return r.json(); })
    .then(function(resp){
      // A request that failed is never an answer. Only found:false, actually sent back, means
      // the profile is not shared.
      if(resp && resp.found===true && resp.data){ draw(resp.data); return; }
      // Only an answer that actually says found:false means "not shared". Anything else — an error,
      // an HTML page from Apps Script, the backend answering a different action because this one is
      // not deployed yet — is a request that did not work, and a page never turns that into a fact.
      if(resp && resp.found===false && resp.status==='ok'){ notShared(); return; }
      didNotLoad();
    })
    .catch(function(){ didNotLoad(); });
})();
</script>
