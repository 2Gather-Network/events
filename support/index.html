<!-- Version: V1.00 | Date: 2026-08-26 | LAST CHANGE: it stops sitting on Sending when the backend has no such action. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Give feedback or make a request · 2Gather">
<title>Support · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;
        --ok:#1E6B3A;--bad:#7A2410;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  .card{background:#fff;border-radius:16px;padding:28px 30px;margin-bottom:16px;}
  h1{font-size:24px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  .lede{font-size:15px;line-height:1.6;color:var(--soft);margin:0 0 22px;}
  label{display:block;font-size:14px;font-weight:700;margin:0 0 6px;}
  .row{margin-bottom:18px;}
  input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
        border-radius:10px;padding:12px 14px;}
  textarea{min-height:150px;resize:vertical;line-height:1.55;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);}
  .hint{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.5;}
  button{background:var(--brand);color:#fff;border:0;border-radius:24px;padding:13px 26px;font:inherit;
         font-weight:700;cursor:pointer;}
  button[disabled]{opacity:.55;cursor:default;}
  .say{margin-top:14px;font-size:15px;line-height:1.55;padding:13px 15px;border-radius:10px;
       background:var(--panel);border:1px solid var(--panel-line);display:none;}
  .say.ok{color:var(--ok);} .say.bad{color:var(--bad);}

  .admin{display:none;}
  .admin h2{font-size:18px;font-weight:800;margin:0 0 4px;}
  .admin .sub{font-size:14px;color:var(--soft);margin:0 0 16px;}
  .ticket{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .ticket .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;}
  .ticket .who{font-weight:800;font-size:15px;}
  .ticket .when{font-size:12.5px;color:var(--soft);}
  .ticket .kind{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
        color:var(--brand);background:var(--panel);border:1px solid var(--panel-line);
        border-radius:20px;padding:2px 10px;}
  .ticket p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
  @media(max-width:700px){ .card{padding:22px 20px;} h1{font-size:21px;} }
</style>
  <script src="/nav/identity.js?v=10"></script>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Give feedback or make a request. We're listening.</h1>
    <p class="lede">Tell us what is missing, what went wrong, or what you wish this did. Every one of these
    reaches a person, and you will hear back at the address you leave.</p>

    <div class="row">
      <label for="kind">Category</label>
      <select id="kind">
        <option value="Feedback">Feedback</option>
        <option value="Request">A request</option>
        <option value="Problem">Something is broken</option>
      </select>
    </div>

    <div class="row" id="known" style="display:none;">
      <div class="hint" id="known-say"></div>
      <a role="link" tabindex="0" id="known-change" style="font-size:13.5px;color:#1F699E;font-weight:700;cursor:pointer;">Use a different name or address</a>
    </div>

    <div id="ask">
      <div class="row">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name">
      </div>

      <div class="row">
        <label for="email">Your email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Ex: you@example.com">
        <div class="hint">So somebody can answer you.</div>
      </div>
    </div>

    <div class="row">
      <label for="msg">How can we help?</label>
      <textarea id="msg" placeholder="Write as much or as little as you like."></textarea>
    </div>

    <button id="send">Send it</button>
    <div class="say" id="say"></div>
  </div>

  <div class="card admin" id="admin">
    <h2>Open requests</h2>
    <p class="sub" id="admin-sub">Loading…</p>
    <div id="tickets"></div>
  </div>

</div>

<script>
window._safeNavGo = window._safeNavGo || function (el) {
  try { var u = el && el.getAttribute && el.getAttribute('data-nav'); if (u) { window.location.href = u; } }
  catch (e) {}
  return false;
};

(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var params = new URLSearchParams(location.search);
  var who = CW.me().id;

  // Who sees the open list. The read action checks this again on its own side; this
  // only decides whether the panel is drawn.
  var KEEPERS = ['w.hss', 'whss'];

  // Asking somebody who is signed in for their name and address is the page not bothering to
  // look. It looks, and says what it found. The fields stay one press away, because somebody
  // may want an answer sent somewhere else.
  (function () {
    if (!who) { return; }
    var nameEl = document.getElementById('name');
    var mailEl = document.getElementById('email');
    var known = document.getElementById('known');
    var knownSay = document.getElementById('known-say');
    var ask = document.getElementById('ask');
    document.getElementById('known-change').addEventListener('click', function () {
      known.style.display = 'none';
      ask.style.display = '';
    });
    function settle() {
      if (!nameEl.value || !mailEl.value) { return; }
      knownSay.textContent = 'We will reply to ' + nameEl.value + ' at ' + mailEl.value + '.';
      known.style.display = '';
      ask.style.display = 'none';
    }
    fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(who))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.name) { nameEl.value = d.name; settle(); } })
      .catch(function () {});
    var tok = '';
    try {
      var key = 'cw-edit-' + String(who).split('.').join('').toLowerCase();
      var raw = localStorage.getItem(key);
      if (raw) { var o = JSON.parse(raw); if (o && o.t) { tok = o.t; } }
      if (!tok) { tok = localStorage.getItem('cw-token') || ''; }
    } catch (e) {}
    if (tok) {
      fetch(GS_URL + '?action=getAccount&appearId=' + encodeURIComponent(who)
            + '&editToken=' + encodeURIComponent(tok))
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.status === 'ok' && d.email) { mailEl.value = d.email; settle(); } })
        .catch(function () {});
    }
  })();

  var say = document.getElementById('say');
  function tell(msg, good) {
    say.style.display = 'block';
    say.className = 'say ' + (good ? 'ok' : 'bad');
    say.textContent = msg;
  }

  document.getElementById('send').addEventListener('click', function () {
    var kind = document.getElementById('kind').value;
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg').value.trim();

    if (!msg) { tell('Write something first, then send it.', false); return; }
    if (!email) { tell('Leave an email so somebody can answer you.', false); return; }

    var btn = document.getElementById('send');
    btn.disabled = true;
    tell('Sending…', true);

    var url = GS_URL + '?action=saveSupportTicket'
      + '&kind=' + encodeURIComponent(kind)
      + '&name=' + encodeURIComponent(name)
      + '&email=' + encodeURIComponent(email)
      + '&message=' + encodeURIComponent(msg)
      + '&appearId=' + encodeURIComponent(who)
      + '&page=' + encodeURIComponent(document.referrer || '');

    // An action the script does not know falls through to the events feed, which is
    // 364KB and about ten seconds. So say something at eight rather than sit on
    // "Sending" while a feed nobody asked for arrives.
    var answered = false;
    var giveUp = setTimeout(function () {
      if (answered) return;
      answered = true;
      btn.disabled = false;
      tell('This is not saving yet. The helpdesk tab and the saveSupportTicket action are not in the script. Email hello@creating.works and it will reach the same person.', false);
    }, 8000);

    fetch(url).then(function (r) { return r.text(); }).then(function (t) {
      if (answered) return;
      answered = true;
      clearTimeout(giveUp);
      btn.disabled = false;
      var parsed = null;
      try { parsed = JSON.parse(t); } catch (e) {}
      if (parsed && parsed.status === 'ok') {
        document.getElementById('msg').value = '';
        tell('Sent. Thank you, somebody will read this and answer you.', true);
      } else if (parsed && parsed.events) {
        tell('This is not saving yet. The saveSupportTicket action is not in the script. Email hello@creating.works and it will reach the same person.', false);
      } else {
        tell('That did not save. ' + ((parsed && parsed.message) || 'The backend refused it.'), false);
      }
    }).catch(function () {
      if (answered) return;
      answered = true;
      clearTimeout(giveUp);
      btn.disabled = false;
      tell('That did not send. Check your connection and try once more.', false);
    });
  });

  // The open list, for whoever keeps this
  if (KEEPERS.indexOf(who.toLowerCase()) === -1) return;
  var panel = document.getElementById('admin');
  panel.style.display = 'block';

  fetch(GS_URL + '?action=getSupportTickets&appearId=' + encodeURIComponent(who))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = (d && d.tickets) || [];
      var open = list.filter(function (t) { return String(t.status || '').toLowerCase() !== 'resolved'; });
      // 2026-08-30. The bar draws "N support tickets waiting" from this key and nothing ever
      // wrote it, so that line could never appear. Written here, where the real count is known.
      try { localStorage.setItem('cw-tickets', String(open.length)); } catch (e) {}
      document.getElementById('admin-sub').textContent = open.length
        ? open.length + (open.length === 1 ? ' request waiting on you.' : ' requests waiting on you.')
        : 'Nothing waiting. Everything has been answered.';
      var html = '';
      for (var i = 0; i < open.length; i++) {
        var t = open[i];
        html += '<div class="ticket"><div class="top">'
          + '<span class="who">' + (t.name || 'Someone') + '</span>'
          + '<span class="kind">' + (t.kind || 'Feedback') + '</span>'
          + '<span class="when">' + (t.date || '') + (t.email ? ' · ' + t.email : '') + '</span>'
          + '</div><p>' + String(t.message || '').replace(/</g, '&lt;') + '</p></div>';
      }
      document.getElementById('tickets').innerHTML = html;
    })
    .catch(function () {
      document.getElementById('admin-sub').textContent =
        'The list cannot load yet. The getSupportTickets action is not in the script.';
    });
})();
</script>
<script src="/nav/topbar.js?v=5.63" defer></script>
</body>
