<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="2Gather">
<meta property="og:title" content="Give feedback or make a request · 2Gather">
<title>Support · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;
        --ok:#1E6B3A;--bad:#7A2410;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  .card{background:#fff;border-radius:16px;padding:28px 30px;margin-bottom:16px;}
  h1{font-size:24px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  .lede{font-size:15px;line-height:1.6;color:var(--soft);margin:0 0 22px;}
  label{display:block;font-size:14px;font-weight:700;margin:0 0 6px;}
  .row{margin-bottom:18px;}
  input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
        border-radius:10px;padding:12px 14px;}
  textarea{min-height:150px;resize:vertical;line-height:1.55;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);}
  .hint{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.5;}
  button{background:var(--brand);color:#fff;border:0;border-radius:24px;padding:13px 26px;font:inherit;
         font-weight:700;cursor:pointer;}
  button[disabled]{opacity:.55;cursor:default;}
  .say{margin-top:14px;font-size:15px;line-height:1.55;padding:13px 15px;border-radius:10px;
       background:var(--panel);border:1px solid var(--panel-line);display:none;}
  .say.ok{color:var(--ok);} .say.bad{color:var(--bad);}

  .ticket{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .ticket .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;}
  .ticket .who{font-weight:800;font-size:15px;}
  .ticket .when{font-size:12.5px;color:var(--soft);}
  .ticket .kind{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
        color:var(--brand);background:var(--panel);border:1px solid var(--panel-line);
        border-radius:20px;padding:2px 10px;}
  .ticket p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
  @media(max-width:700px){ .card{padding:22px 20px;} h1{font-size:21px;} }
  .statuslink{font-size:13.5px;color:var(--soft);margin:14px 0 0;line-height:1.6;}
  .statuslink a{color:var(--brand);font-weight:700;text-decoration:none;}
  .statuslink a:hover{text-decoration:underline;}
  .hide{display:none !important;}
  h2{font-size:19px;font-weight:800;margin:0 0 8px;line-height:1.3;}
  
  .faq-btn{background:#fff;color:var(--brand);border:0;padding:11px 20px;border-radius:26px;font-family:inherit;
           font-size:15px;font-weight:700;text-decoration:none;display:inline-block;}
  
  #claim-back{background:#fff;color:var(--brand);padding:11px 20px;border-radius:26px;font-size:15px;}
  #claim-cancel{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand);margin-left:10px;}
  
  .cw-trail{color:#fff;font-size:14px;font-weight:500;margin:0 0 16px;opacity:.92;}
  .cw-trail a{color:#fff;text-decoration:none;cursor:pointer;}
  .cw-trail .sep{color:rgba(255,255,255,.55);padding:0 6px;}
  .cw-trail .now{font-weight:800;}
</style>
  <script src="/nav/identity.js?v=22"></script>
</head>
<body>
<div class="wrap">
  <div class="cw-trail" id="cw-trail" hidden></div>

  <div style="display:flex;align-items:center;margin:0 0 12px;">
    <button type="button" id="claim-back" hidden>Back</button>
    <a class="faq-btn" href="https://2gather.network/faq/" style="margin-left:auto;">FAQs</a>
  </div>

  <div class="card">
    <h1>Give feedback or make a request. We're listening.</h1>
    <p class="lede" id="lede">Tell us what is missing, what went wrong, or what you wish this did.</p>

    <div class="row">
      <label for="kind">Category</label>
      <select id="kind">
        <option value="Feedback">Feedback</option>
        <option value="Request">A request</option>
        <option value="Problem">Something is broken</option>
        <option value="Claim event">Request to claim event as host</option>
      </select>
    </div>

    <div class="row" id="known" style="display:none;">
      <div class="hint" id="known-say"></div>
      <a role="link" tabindex="0" id="known-change" style="font-size:13.5px;color:#1F699E;font-weight:700;cursor:pointer;">Use a different name or address</a>
    </div>

    <div id="ask">
      <div class="row">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name">
        <div class="hint">So we know who we are answering.</div>
      </div>

      <div class="row">
        <label for="email">Your email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Ex: you@example.com">
        <div class="hint">So somebody can answer you.</div>
      </div>
    </div>

    <div class="row">
      <label for="msg">How can we help?</label>
      <textarea id="msg" placeholder="Write as much or as little as you like."></textarea>
    </div>

    <button id="send">Send it</button><button type="button" id="claim-cancel" hidden>Cancel</button>
    <div class="say" id="say"></div>
    <p class="statuslink hide" id="statuslink">Already reported something?
      <a href="https://2gather.network/status/">See what we are working on.</a></p>
  </div>



</div>

<script>
var FROM_PAGE = (function () {
  try { return new URLSearchParams(window.location.search).get('from') || ''; } catch (e) { return ''; }
})();

window._safeNavGo = window._safeNavGo || function (el) {
  try { var u = el && el.getAttribute && el.getAttribute('data-nav'); if (u) { window.location.href = u; } }
  catch (e) {}
  return false;
};

(function () {
  var GS_URL = 'https://cw-api-gate.jessieupp.workers.dev';
  var params = new URLSearchParams(location.search);
  var who = CW.me().id;


  (function () {
    if (!who) { return; }
    var nameEl = document.getElementById('name');
    var mailEl = document.getElementById('email');
    var known = document.getElementById('known');
    var knownSay = document.getElementById('known-say');
    var ask = document.getElementById('ask');
    document.getElementById('known-change').addEventListener('click', function () {
      known.style.display = 'none';
      ask.style.display = '';
    });
    function settle() {
      if (!nameEl.value || !mailEl.value) { return; }
      knownSay.textContent = 'We will reply to ' + nameEl.value + ' at ' + mailEl.value + '.';
      known.style.display = '';
      ask.style.display = 'none';
    }
    fetch(GS_URL + '?action=lookupProfile&appearId=' + encodeURIComponent(who))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.name) { nameEl.value = d.name; settle(); } })
      .catch(function () {});
    var tok = '';
    try {
      var key = 'cw-edit-' + String(who).split('.').join('').toLowerCase();
      var raw = localStorage.getItem(key);
      if (raw) { var o = JSON.parse(raw); if (o && o.t) { tok = o.t; } }
      if (!tok) { tok = localStorage.getItem('cw-token') || ''; }
    } catch (e) {}
    if (tok) {
      fetch(GS_URL + '?action=getAccount&appearId=' + encodeURIComponent(who)
            + '&editToken=' + encodeURIComponent(tok))
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.status === 'ok' && d.email) { mailEl.value = d.email; settle(); } })
        .catch(function () {});
    }
  })();

  var SENT_UI = params.get('sent') === '1';
  if (SENT_UI) { var _sl = document.getElementById('statuslink'); if (_sl) { _sl.classList.remove('hide'); } }

  var CLAIM_EVENT = '';
  if (params.get('topic') === 'claim-event') {
    CLAIM_EVENT = String(params.get('event') || '').replace(/\s+/g, '').slice(0, 200);
    var kindEl = document.getElementById('kind');
    if (kindEl) { kindEl.value = 'Claim event'; }
    if (CLAIM_EVENT) {
      var claimTitle = '';
      try {
        var handed = JSON.parse(sessionStorage.getItem('cw-claim-event') || 'null');
        if (handed && String(handed.id) === CLAIM_EVENT) { claimTitle = String(handed.title || '').trim(); }
      } catch (e) {}
      var msgEl = document.getElementById('msg');
      if (msgEl && !msgEl.value) {
        msgEl.value = 'I would like to claim this event as its host.\n'
          + (claimTitle ? 'Event: ' + claimTitle + '\n' : '')
          + 'Event id: ' + CLAIM_EVENT + '\n'
          + 'https://2gather.network/event/?id=' + encodeURIComponent(CLAIM_EVENT) + '\n\n';
      }
    }
  }

  if (CLAIM_EVENT) {
    var _toEvent = function () { window.location.href = 'https://2gather.network/event/?id=' + encodeURIComponent(CLAIM_EVENT); };
    ['claim-back', 'claim-cancel'].forEach(function (bid) {
      var b = document.getElementById(bid);
      if (b) { b.hidden = false; b.addEventListener('click', _toEvent); }
    });
  }

  var say = document.getElementById('say');
  function tell(msg, good) {
    say.style.display = 'block';
    say.className = 'say ' + (good ? 'ok' : 'bad');
    say.textContent = msg;
  }

  document.getElementById('send').addEventListener('click', function () {
    var kind = document.getElementById('kind').value;
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg').value.trim();

    if (!msg) { tell('Write something first, then send it.', false); return; }
    if (!name) { tell('Leave your name so we know who we are answering.', false); return; }
    if (!email) { tell('Leave an email so somebody can answer you.', false); return; }

    var btn = document.getElementById('send');
    btn.disabled = true;
    tell('Sending. You can close this page, it will still arrive.', true);

    var url = GS_URL + '?action=saveSupportTicket'
      + '&kind=' + encodeURIComponent(kind)
      + '&name=' + encodeURIComponent(name)
      + '&email=' + encodeURIComponent(email)
      + '&message=' + encodeURIComponent(msg)
      + '&appearId=' + encodeURIComponent(who)
      + ((kind === 'Claim event' && CLAIM_EVENT) ? '&eventId=' + encodeURIComponent(CLAIM_EVENT) : '')
      + '&page=' + encodeURIComponent(FROM_PAGE || document.referrer || '');

    fetch(url, { keepalive: true }).then(function (r) { return r.text(); }).then(function (t) {
      var parsed = null;
      try { parsed = JSON.parse(t); } catch (e) {}
      if (parsed && parsed.status === 'ok') {
        document.getElementById('msg').value = '';
        if (SENT_UI) {
          btn.textContent = 'Sent!';
          btn.disabled = true;
          tell('Sent and thank you. Somebody will respond to your message to ' + email + '.', true);
        } else {
          btn.disabled = false;
          tell('Sent and thank you. Somebody will read this and answer you.', true);
        }
      } else {
        btn.disabled = false;
        tell('That did not save. ' + ((parsed && parsed.message) || 'The backend refused it.'), false);
      }
    }).catch(function () {
      btn.disabled = false;
      tell('That did not send. Check your connection and try once more.', false);
    });
  });

})();
</script>
<script src="/nav/topbar.js?v=6.19" defer></script>
<script>
(function () {
  var ref = ''; try { ref = String(document.referrer || ''); } catch (e) {}
  if (!/^https:\/\/2gather\.network\//.test(ref)) {
    try {
      var kept = JSON.parse(sessionStorage.getItem('cw-prev-page') || 'null');
      if (kept && kept.href && Date.now() - Number(kept.at || 0) < 120000) { ref = String(kept.href); }
    } catch (e) {}
  }
  if (!/^https:\/\/2gather\.network\//.test(ref)) {
    try {
      var ev0 = new URLSearchParams(location.search).get('event');
      if (ev0) { ref = 'https://2gather.network/event/?id=' + encodeURIComponent(ev0); }
    } catch (e) {}
  }
  var m = ref.match(/^https:\/\/2gather\.network(\/[^?#]*)/);
  if (!m) return;
  var path = m[1], label = '';
  [['/events', 'Calendar'], ['/event/', 'Event'], ['/myevents', 'My events'], ['/mygroups', 'My groups'],
   ['/group/', 'Group'], ['/support', 'Support'], ['/faq', 'FAQ'], ['/ikigai', 'My profile'], ['/profile', 'My profile']]
    .forEach(function (n) { if (!label && path.indexOf(n[0]) === 0) { label = n[1]; } });
  if (!label || label === 'Support') return;
  var t = document.getElementById('cw-trail');
  if (!t) return;
  var a = document.createElement('a');
  a.setAttribute('role', 'link'); a.setAttribute('tabindex', '0'); a.textContent = label;
  a.onclick = function () { window.location.href = ref; return false; };
  a.onkeydown = function (e) { if (e.key === 'Enter') { window.location.href = ref; } };
  var sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '/';
  var now = document.createElement('span'); now.className = 'now'; now.textContent = 'Support';
  t.appendChild(a); t.appendChild(sep); t.appendChild(now);
  t.hidden = false;
})();
</script>
</body>
</html>
