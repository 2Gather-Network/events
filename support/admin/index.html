<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Support tickets · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;--bad:#7A2410;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'Nunito Sans','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px;}
  .card{background:#fff;border-radius:16px;padding:26px 28px;margin-bottom:16px;}
  h1{font-size:24px;font-weight:800;margin:0 0 6px;line-height:1.3;}
  .lede{font-size:15px;line-height:1.6;color:var(--soft);margin:0 0 18px;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
  .tools select,.tools input{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;}
  .tools input{flex:1;min-width:180px;}
  .say{font-size:15px;line-height:1.55;padding:13px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--panel-line);margin:0 0 12px;}
  .say.bad{color:var(--bad);}
  .say a{color:var(--brand);font-weight:700;}
  .ticket{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
  .ticket.focus{border:2px solid var(--brand);}
  .ticket .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;}
  .ticket .who{font-weight:800;font-size:15px;}
  .ticket .when,.ticket .mail,.ticket .from{font-size:12.5px;color:var(--soft);}
  .ticket .mail a,.ticket .from a{color:var(--brand);font-weight:700;text-decoration:none;}
  .ticket .kind,.ticket .state{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
        color:var(--brand);background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:2px 10px;}
  .ticket .state{color:var(--soft);}
  .ticket .act{margin-left:auto;background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:20px;
        padding:5px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .ticket .act[disabled]{opacity:.55;cursor:default;}
  .ticket .err{font-size:12.5px;color:var(--bad);margin-top:6px;}
  .ticket p{margin:6px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;}
  .ticket .pic{margin-top:10px;font-size:12.5px;color:var(--soft);}
  .ticket .pic img{max-width:220px;max-height:160px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;}
  .ticket .pic img.big{max-width:100%;max-height:none;cursor:zoom-out;}
  .hide{display:none !important;}
  @media(max-width:700px){ .card{padding:20px 18px;} h1{font-size:21px;} .ticket .pic img{max-width:100%;} }
  .ticket .notes{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .ticket .note{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px 12px;}
  .ticket .note p{font-size:14px;margin:2px 0 0;}
  .ticket .addrow{margin-top:10px;}
  .pill{background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:20px;padding:6px 14px;
        font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .addbox{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
  .addbox textarea{width:100%;box-sizing:border-box;min-height:110px;resize:vertical;font:inherit;font-size:14.5px;line-height:1.55;
        color:var(--ink);border:1.5px solid #DDE4EE;border-radius:10px;padding:10px 12px;}
  .addbox textarea:focus{outline:none;border-color:var(--brand);}
  .pic-box{display:flex;align-items:center;gap:10px;background:#F5F7FA;border:1.5px solid #DDE4EE;border-radius:12px;padding:8px 10px;}
  .pic-box .thumb{width:44px;height:44px;border-radius:10px;background:#DDE4EE;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .pic-box .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pic-box input[type=url]{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;font:inherit;font-size:14px;color:var(--ink);outline:none;}
  .pic-up{font-size:13px;font-weight:700;color:var(--brand);border:1.5px solid var(--brand);border-radius:20px;padding:8px 14px;cursor:pointer;background:#fff;white-space:nowrap;flex-shrink:0;}
  .addbox .actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;}
  .addbox .save{background:var(--brand);color:#fff;border:0;border-radius:26px;padding:11px 22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .addbox .save[disabled]{opacity:.55;cursor:default;}
  .addbox .cancel{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;font-weight:700;padding:12px 8px;cursor:pointer;}
  .addbox .cancel:hover,.addbox .cancel:focus{text-decoration:underline;}
  @media(max-width:520px){ .pic-box{flex-wrap:wrap;} .pic-box input[type=url]{flex:1 1 calc(100% - 54px);} .pic-box .pic-up{margin-left:auto;} }
</style>
<script src="/nav/identity.js?v=70"></script>
<link rel="icon" type="image/png" href="https://2gather.network/images/2gather_logo.png"><script src="/nav/tab-icon.js?v=1"></script><link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Support tickets</h1>
    <p class="lede">Tickets sent from every site, newest first. Only super admins can see them.</p>
    <div class="say" id="say">Looking for tickets.</div>
    <div class="tools hide" id="tools">
      <select id="state" aria-label="Which tickets">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="">All</option>
      </select>
      <input id="search" type="search" placeholder="Search tickets" aria-label="Search tickets">
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  var PHOTOS = 'https://cw-photos.jessieupp.workers.dev';
  var params = new URLSearchParams(location.search);
  var ONE = params.get('ticket') || '';
  var me = (window.CW && CW.realMe && CW.realMe().id) || '';
  var say = document.getElementById('say');
  var list = document.getElementById('list');
  var tools = document.getElementById('tools');
  var ROWS = [];

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tell(html, bad) { say.innerHTML = html; say.className = 'say' + (bad ? ' bad' : ''); say.classList.remove('hide'); }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function isOpen(st) { var s = String(st || 'open').toLowerCase(); return s !== 'resolved' && s !== 'closed'; }
  function token() { try { return localStorage.getItem('cw-token') || ''; } catch (e) { return ''; } }

  function picture(box, id) {
    box.textContent = 'Opening the picture.';
    fetch(PHOTOS + '/s/' + encodeURIComponent(id), { headers: { 'x-cw-id': me, 'x-cw-token': token() } })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.blob(); })
      .then(function (b) {
        box.textContent = '';
        var img = document.createElement('img');
        img.alt = 'Picture sent with this ticket';
        img.src = URL.createObjectURL(b);
        img.addEventListener('click', function () { img.classList.toggle('big'); });
        box.appendChild(img);
      })
      .catch(function () { box.textContent = 'The picture did not open. Refresh the page to try again.'; });
  }

  function setState(t, btn, el) {
    var to = isOpen(t.status) ? 'closed' : 'open';
    btn.disabled = true;
    btn.textContent = to === 'closed' ? 'Closing' : 'Reopening';
    var old = el.querySelector('.err'); if (old) old.remove();
    function ask(tries) {
      return fetch(GS + '?action=setSupportTicketStatus&ticketId=' + encodeURIComponent(t.id) + '&status=' + to
            + '&appearId=' + encodeURIComponent(me) + '&t=' + Date.now())
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          try { return JSON.parse(txt); } catch (e) {}
          if (tries > 0) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return ask(tries - 1); });
          throw new Error('The server did not answer.');
        });
    }
    ask(1)
      .then(function (d) {
        if (!d || d.status !== 'ok') throw new Error((d && d.message) || 'Nothing changed.');
        t.status = d.ticketStatus || to;
        draw();
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = isOpen(t.status) ? 'Close ticket' : 'Reopen';
        var n = document.createElement('div');
        n.className = 'err';
        n.textContent = 'That did not save. ' + ((err && err.message) || '') + ' Press the button again.';
        el.appendChild(n);
      });
  }

  function draw() {
    var st = document.getElementById('state').value;
    var q = String(document.getElementById('search').value || '').trim().toLowerCase();
    var rows = ROWS.filter(function (t) {
      if (ONE) return t.id === ONE;
      if (st === 'open' && !isOpen(t.status)) return false;
      if (st === 'closed' && isOpen(t.status)) return false;
      if (q) {
        var all = [t.name, t.email, t.kind, t.message, t.page].join(' ').toLowerCase();
        if (all.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.innerHTML = '';
    if (ONE && !rows.length) { tell('That ticket is not in this list. <a href="/support/admin/">Show all tickets</a>'); return; }
    if (ONE) { tell('One ticket. <a href="/support/admin/">Show all tickets</a>'); }
    else if (!rows.length) { tell(ROWS.length ? 'Nothing matches that.' : 'Nothing to show here.'); }
    else { tell(rows.length + (rows.length === 1 ? ' ticket' : ' tickets')); }
    rows.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'ticket' + (ONE ? ' focus' : '');
      el.innerHTML =
        '<div class="top"><span class="who">' + esc(t.name || 'No name') + '</span>'
        + '<span class="kind">' + esc(t.kind || 'Feedback') + '</span>'
        + (t.id ? '<span class="when">Ticket ' + esc(String(t.id).slice(0, 7)) + '</span>' : '')
        + '<span class="when">Owner: ' + ownerOf(t.page) + ' chat</span>'
        + '<span class="state">' + esc(t.status || 'open') + '</span>'
        + '<span class="when">' + esc(when(t.date)) + '</span>'
        + '<button type="button" class="act">' + (isOpen(t.status) ? 'Close ticket' : 'Reopen') + '</button></div>'
        + (t.email ? '<div class="mail"><a href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a></div>' : '')
        + (t.page ? '<div class="from">From <a href="' + esc(t.page) + '">' + esc(t.page) + '</a></div>' : '')
        + '<p>' + esc(t.message) + '</p>'
        + (t.imageId ? '<div class="pic"></div>' : '')
        + notesHtml(t.notes)
        + '<div class="addrow"><button type="button" class="pill add">Add info</button></div>';
      list.appendChild(el);
      if (t.imageId) picture(el.querySelector('.pic'), t.imageId);
      Array.prototype.forEach.call(el.querySelectorAll('.note .npic'), function (b) { picture(b, b.getAttribute('data-id')); });
      var add = el.querySelector('.add');
      add.addEventListener('click', function () { openAdd(t, el, add); });
      var btn = el.querySelector('.act');
      btn.addEventListener('click', function () { setState(t, btn, el); });
    });
  }

  var PICTURE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F699E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

  function notesHtml(notes) {
    if (!notes || !notes.length) return '';
    return '<div class="notes">' + notes.map(function (n) {
      return '<div class="note"><div class="when">Added ' + esc(when(n.at)) + '</div>'
        + (n.text ? '<p>' + esc(n.text) + '</p>' : '')
        + (n.imageId ? '<div class="pic npic" data-id="' + esc(n.imageId) + '"></div>' : '')
        + '</div>';
    }).join('') + '</div>';
  }

  function shrink(f) {
    return new Promise(function (ok, no) {
      if (!f || String(f.type || '').indexOf('image/') !== 0) { no('That is not a picture. Try a screenshot, a JPG or a PNG.'); return; }
      var reader = new FileReader();
      reader.onerror = function () { no('That picture could not be read. Try another one.'); };
      reader.onload = function () {
        var pic = new Image();
        pic.onerror = function () { no('That picture could not be read. Try another one.'); };
        pic.onload = function () {
          var max = 1600, w = pic.naturalWidth, h = pic.naturalHeight;
          var scale = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * scale); c.height = Math.round(h * scale);
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(pic, 0, 0, c.width, c.height);
          c.toBlob(function (b) { if (b) { ok(b); } else { no('That picture could not be read. Try another one.'); } }, 'image/jpeg', 0.85);
        };
        pic.src = reader.result;
      };
      reader.readAsDataURL(f);
    });
  }

  function openAdd(t, el, addBtn) {
    if (el.querySelector('.addbox')) return;
    addBtn.parentNode.classList.add('hide');
    var box = document.createElement('div');
    box.className = 'addbox';
    box.innerHTML = '<textarea aria-label="Add info to this ticket" placeholder="Write what you found or what happens next."></textarea>'
      + '<div class="pic-box"><div class="thumb">' + PICTURE + '</div>'
      + '<input type="url" aria-label="Picture link" placeholder="Paste an image, a link, or upload one">'
      + '<label class="pic-up">Upload<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>'
      + '<div class="actions"><button type="button" class="cancel">Cancel</button><button type="button" class="save">Save</button></div>';
    el.appendChild(box);
    var text = box.querySelector('textarea');
    var link = box.querySelector('input[type=url]');
    var file = box.querySelector('input[type=file]');
    var thumb = box.querySelector('.thumb');
    var save = box.querySelector('.save');
    var blob = null;
    function err(m) {
      var old = box.querySelector('.err'); if (old) old.remove();
      if (!m) return;
      var n = document.createElement('div'); n.className = 'err'; n.textContent = m; box.appendChild(n);
    }
    function showThumb(src) {
      thumb.innerHTML = '';
      if (!src) { thumb.innerHTML = PICTURE; return; }
      var im = document.createElement('img'); im.alt = ''; im.src = src; thumb.appendChild(im);
    }
    function take(f) {
      shrink(f).then(function (b) { blob = b; link.value = ''; showThumb(URL.createObjectURL(b)); err(''); })
        .catch(function (m) { err(String(m)); });
    }
    file.addEventListener('change', function () { if (file.files && file.files[0]) take(file.files[0]); });
    link.addEventListener('input', function () { blob = null; showThumb(''); });
    box.addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i] && String(items[i].type || '').indexOf('image/') === 0) {
          var f = items[i].getAsFile();
          if (f) { e.preventDefault(); take(f); return; }
        }
      }
    });
    box.querySelector('.cancel').addEventListener('click', function () { box.remove(); addBtn.parentNode.classList.remove('hide'); });
    save.addEventListener('click', function () {
      var words = String(text.value || '').trim();
      var url = String(link.value || '').trim();
      if (url && /^https?:\/\/\S+$/i.test(url)) { words += (words ? '\n\n' : '') + 'Picture link: ' + url; }
      if (!words && !blob) { err('Write something or add a picture first.'); return; }
      save.disabled = true; save.textContent = 'Saving'; err('');
      var up = blob
        ? fetch(PHOTOS + '/upload-support', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (d && d.status === 'ok' && d.id) return d.id; throw new Error('The picture did not go through.'); })
        : Promise.resolve('');
      up.then(function (imageId) {
        return fetch(GS + '?action=addSupportTicketNote&ticketId=' + encodeURIComponent(t.id)
          + '&note=' + encodeURIComponent(words.slice(0, 4000)) + (imageId ? '&imageId=' + encodeURIComponent(imageId) : '')
          + '&appearId=' + encodeURIComponent(me) + '&t=' + Date.now())
          .then(function (r) { return r.json(); });
      }).then(function (d) {
        if (!d || d.status !== 'ok') throw new Error((d && d.message) || 'Nothing changed.');
        t.notes = d.notes || [];
        draw();
      }).catch(function (e) {
        save.disabled = false; save.textContent = 'Save';
        err('That did not save. ' + ((e && e.message) || '') + ' Press Save again.');
      });
    });
    text.focus();
  }

  function ownerOf(page) {
    var h = String(page || '').toLowerCase();
    if (h.indexOf('2appear') > -1) { return 'Appear'; }
    if (h.indexOf('2balance') > -1) { return 'Balance'; }
    return 'Gather';
  }

  if (!me) {
    tell('Sign in as a super admin to see tickets. <a href="/signin/">Sign in</a>');
    return;
  }

  fetch(GS + '?action=getSupportTickets&appearId=' + encodeURIComponent(me) + '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.status !== 'ok') throw new Error('bad');
      ROWS = d.tickets || [];
      if (!ROWS.length) { tell('Nothing to show here.'); return; }
      if (!ONE) tools.classList.remove('hide');
      draw();
    })
    .catch(function () {
      tell('The tickets did not load. That is this page failing, not an empty list. Refresh to try again.', true);
    });

  document.getElementById('state').addEventListener('change', draw);
  document.getElementById('search').addEventListener('input', draw);
})();
</script>
