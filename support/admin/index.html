<html lang="en">
<head>
<script>try{var S='cw-signed-out-2026-09-20';if(localStorage.getItem(S)!=='1'){localStorage.setItem(S,'1');['cw-id','appear-id','cw-token','cw-super','cw-view-as','cw-view-as-name','cw-first','cw-photo','cw-photo-for','cw-photo-at','cw-lastEmail'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Support tickets · 2Gather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#6B7A8D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;--bad:#7A2410;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);
       font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px;}
  .card{background:#fff;border-radius:16px;padding:26px 28px;margin-bottom:16px;}
  h1{font-size:24px;font-weight:800;margin:0 0 6px;line-height:1.3;}
  .lede{font-size:15px;line-height:1.6;color:var(--soft);margin:0 0 18px;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
  .tools select,.tools input{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;}
  .tools input{flex:1;min-width:180px;}
  .say{font-size:15px;line-height:1.55;padding:13px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--panel-line);margin:0 0 12px;}
  .say.bad{color:var(--bad);}
  .say a{color:var(--brand);font-weight:700;}
  .ticket{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
  .ticket.focus{border:2px solid var(--brand);}
  .ticket .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;}
  .ticket .who{font-weight:800;font-size:15px;}
  .ticket .when,.ticket .mail,.ticket .from{font-size:12.5px;color:var(--soft);}
  .ticket .mail a,.ticket .from a{color:var(--brand);font-weight:700;text-decoration:none;}
  .ticket .kind,.ticket .state{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
        color:var(--brand);background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:2px 10px;}
  .ticket .state{color:var(--soft);}
  .ticket .act{margin-left:auto;background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:20px;
        padding:5px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .ticket .act[disabled]{opacity:.55;cursor:default;}
  .ticket .err{font-size:12.5px;color:var(--bad);margin-top:6px;}
  .ticket p{margin:6px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;}
  .ticket .pic{margin-top:10px;font-size:12.5px;color:var(--soft);}
  .ticket .pic img{max-width:220px;max-height:160px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;}
  .ticket .pic img.big{max-width:100%;max-height:none;cursor:zoom-out;}
  .hide{display:none !important;}
  @media(max-width:700px){ .card{padding:20px 18px;} h1{font-size:21px;} .ticket .pic img{max-width:100%;} }
</style>
<script src="/nav/identity.js?v=29"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Support tickets</h1>
    <p class="lede">Tickets sent from 2Gather pages, newest first. Only super admins can see them.</p>
    <div class="say" id="say">Looking for tickets.</div>
    <div class="tools hide" id="tools">
      <select id="state" aria-label="Which tickets">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="">All</option>
      </select>
      <input id="search" type="search" placeholder="Search tickets" aria-label="Search tickets">
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
(function () {
  var GS = 'https://cw-api-gate.jessieupp.workers.dev';
  var PHOTOS = 'https://cw-photos.jessieupp.workers.dev';
  var params = new URLSearchParams(location.search);
  var ONE = params.get('ticket') || '';
  var me = (window.CW && CW.realMe && CW.realMe().id) || '';
  var say = document.getElementById('say');
  var list = document.getElementById('list');
  var tools = document.getElementById('tools');
  var ROWS = [];

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tell(html, bad) { say.innerHTML = html; say.className = 'say' + (bad ? ' bad' : ''); say.classList.remove('hide'); }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function isOpen(st) { var s = String(st || 'open').toLowerCase(); return s !== 'resolved' && s !== 'closed'; }
  function token() { try { return localStorage.getItem('cw-token') || ''; } catch (e) { return ''; } }

  function picture(box, id) {
    box.textContent = 'Opening the picture.';
    fetch(PHOTOS + '/s/' + encodeURIComponent(id), { headers: { 'x-cw-id': me, 'x-cw-token': token() } })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.blob(); })
      .then(function (b) {
        box.textContent = '';
        var img = document.createElement('img');
        img.alt = 'Picture sent with this ticket';
        img.src = URL.createObjectURL(b);
        img.addEventListener('click', function () { img.classList.toggle('big'); });
        box.appendChild(img);
      })
      .catch(function () { box.textContent = 'The picture did not open. Refresh the page to try again.'; });
  }

  function setState(t, btn, el) {
    var to = isOpen(t.status) ? 'closed' : 'open';
    btn.disabled = true;
    btn.textContent = to === 'closed' ? 'Closing' : 'Reopening';
    var old = el.querySelector('.err'); if (old) old.remove();
    fetch(GS + '?action=setSupportTicketStatus&ticketId=' + encodeURIComponent(t.id) + '&status=' + to
          + '&appearId=' + encodeURIComponent(me) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.status !== 'ok') throw new Error((d && d.message) || 'Nothing changed.');
        t.status = d.ticketStatus || to;
        draw();
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = isOpen(t.status) ? 'Close ticket' : 'Reopen';
        var n = document.createElement('div');
        n.className = 'err';
        n.textContent = 'That did not save. ' + ((err && err.message) || '') + ' Try once more.';
        el.appendChild(n);
      });
  }

  function draw() {
    var st = document.getElementById('state').value;
    var q = String(document.getElementById('search').value || '').trim().toLowerCase();
    var rows = ROWS.filter(function (t) {
      if (ONE) return t.id === ONE;
      if (st === 'open' && !isOpen(t.status)) return false;
      if (st === 'closed' && isOpen(t.status)) return false;
      if (q) {
        var all = [t.name, t.email, t.kind, t.message, t.page].join(' ').toLowerCase();
        if (all.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.innerHTML = '';
    if (ONE && !rows.length) { tell('That ticket is not in this list. <a href="/support/admin/">Show all tickets</a>'); return; }
    if (ONE) { tell('One ticket. <a href="/support/admin/">Show all tickets</a>'); }
    else if (!rows.length) { tell(ROWS.length ? 'Nothing matches that.' : 'Nothing to show here.'); }
    else { tell(rows.length + (rows.length === 1 ? ' ticket' : ' tickets')); }
    rows.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'ticket' + (ONE ? ' focus' : '');
      el.innerHTML =
        '<div class="top"><span class="who">' + esc(t.name || 'No name') + '</span>'
        + '<span class="kind">' + esc(t.kind || 'Feedback') + '</span>'
        + '<span class="state">' + esc(t.status || 'open') + '</span>'
        + '<span class="when">' + esc(when(t.date)) + '</span>'
        + '<button type="button" class="act">' + (isOpen(t.status) ? 'Close ticket' : 'Reopen') + '</button></div>'
        + (t.email ? '<div class="mail"><a href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a></div>' : '')
        + (t.page ? '<div class="from">From <a href="' + esc(t.page) + '">' + esc(t.page) + '</a></div>' : '')
        + '<p>' + esc(t.message) + '</p>'
        + (t.imageId ? '<div class="pic"></div>' : '');
      list.appendChild(el);
      if (t.imageId) picture(el.querySelector('.pic'), t.imageId);
      var btn = el.querySelector('.act');
      btn.addEventListener('click', function () { setState(t, btn, el); });
    });
  }

  if (!me) {
    tell('Sign in as a super admin to see tickets. <a href="/signin/">Sign in</a>');
    return;
  }

  fetch(GS + '?action=getSupportTickets&site=2gather&appearId=' + encodeURIComponent(me) + '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.status !== 'ok') throw new Error('bad');
      ROWS = d.tickets || [];
      if (!ROWS.length) { tell('Nothing to show here.'); return; }
      if (!ONE) tools.classList.remove('hide');
      draw();
    })
    .catch(function () {
      tell('The tickets did not load. That is this page failing, not an empty list. Refresh to try again.', true);
    });

  document.getElementById('state').addEventListener('change', draw);
  document.getElementById('search').addEventListener('input', draw);
})();
</script>
<script src="/nav/topbar.js?v=6.38" defer></script>
</body>
</html>
