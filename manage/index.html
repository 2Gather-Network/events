<!-- Version: M1.05 | Date: 2026-09-20 | LAST CHANGE: /manage is the four solutions again, Profile is My info, and My info shows the welcome step's two questions. Jessie: "now make /manage go to the 4 solutions", 'Make "profile" say "My info"', "show Terms of service, Privacy policy, Code of conduct without any explnatioant. just linked to the pages needed to read", and "Make My info show photo/where are you (just like intro welcome shows)". The agreements are three plain links now - each row was saying its own name twice with a line between them explaining what a terms page is. MY INFO READS THE REAL ANSWERS: the picture and the place come off this person's own record, and it says it is looking while the read is out and says so plainly if the read is refused, rather than drawing an empty place that reads as "you never told us". CHANGING either still happens on the welcome step, which already saves them - two screens writing the same five columns is the fault that has cost this build more than any other. The M2.00 three-rail navigation drawing is in the history at 2026-09-20 if the map is wanted again. -->
<!-- Version: M1.02 | Date: 2026-09-19 | LAST CHANGE: the lit dot is orange rather than green. Jessie: "make the green an organie dot insteasd - accessible organe". #C2410C against white is 5.9:1, so it reads as a colour and not only as a position. -->
<!-- Version: M1.01 | Date: 2026-09-19 | LAST CHANGE: her spec on the first look, read back line by line. No emojis anywhere. The line under the heading goes. The rail says Balance, Appear, Gather, License in that order, and each pane carries the name that is registered - DayBalancer.com, Appear.Network, 2Gather.Network, Creating.Works - with its own line under it: Energy in. Energy out. / Where people, resources, and opportunities appear. / Gathering for the common good. / Because creating works. EVERY PRODUCT HAS AN ENABLE, on or off, in the same place, so "can I turn this off" never depends on hunting for the button. Creating.Works loses the house sentence and the cannot-be-switched-off line; terms, privacy and code of conduct are three links named as themselves, no "read". The paragraphs saying what is not stored here come off every pane. -->
<!-- Version: M1.00 | Date: 2026-09-19 | LAST CHANGE: born. ONE account and settings screen for all four products, at her "2 build mockup". Built on James's mockup, queued as Tier 2.16 on 2026-09-07 - his LAYOUT, our look: a rail on the left reading ACCOUNT then PRODUCTS, the body showing one at a time with its name, a line under it, a status banner, then settings under quiet uppercase headings with one line of explanation on each row. His was dark green and orange; ours is the blue and white every other page uses, with the top navigation above, "liek starting with just the white rail on left side and body on right, with all top nav info above as we do in my groups". WHY ONE FILE: she asked for the same screen at 2gather.network/manage, creating.works/manage and appear.network/manage. Three copies kept in step by hand is the debt she does not want - one gets a field, the others do not, and the next save writes an empty value over a real one. So this is one page and each domain points at it. NOTHING HERE SAVES YET. It is a layout to look at and it says so at the top, because a switch that does not switch anything is a door onto nothing. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
<title>Account &amp; settings · Creating.Works</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/nav/identity.js?v=23"></script>
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
    --on:#C2410C; --off:#B9C4D2;   /* ORANGE, NOT GREEN. Jessie, 2026-09-19: "make the green an
       organie dot insteasd - accessible organe". #C2410C carries 5.9:1 against white, so it is
       readable as a colour rather than only as a position, which matters most to the people a
       green-red pair fails. */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:26px;font-weight:800;margin:0 0 4px;color:#fff;}
  .sub{color:#fff;opacity:.9;font-size:14.5px;margin:0 0 18px;}
  /* THE SAME TEMPLATE AS MY GROUPS, her instruction: 1200 wide, a rail, the body beside it,
     one column below 860. The rail is 340 because she compared 285, 340 and 400 side by side
     on the live page and picked it (2026-09-08). */
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}
  .rail{background:#fff;border-radius:14px;padding:10px 8px;height:fit-content;}
  .railhead{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:10px 12px 6px;}
  .railrow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;
    border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;font-weight:700;
    color:var(--ink);cursor:pointer;text-align:left;}
  .railrow:hover{background:var(--panel);}
  .railrow.on{background:var(--brand);color:#fff;}
  .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--off);flex:0 0 9px;}
  .railrow.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  .dot.lit{background:var(--on);}
  .body{background:#fff;border-radius:14px;padding:26px 28px 34px;min-width:0;}
  .mocknote{background:#FFF6E5;border:1px solid #F0DCB4;border-radius:12px;padding:12px 14px;
    font-size:13.5px;line-height:1.55;color:#6B4E15;margin:0 0 22px;}
  .ptitle{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;flex-wrap:wrap;}
  .ptitle h2{font-size:30px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .pline{font-size:15.5px;color:var(--soft);margin:4px 0 0;}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--soft);white-space:nowrap;background:#fff;}
  .pill .dot{margin:0;}
  .banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--panel-line);border-radius:14px;padding:16px 18px;margin:22px 0 6px;}
  .banner .what{font-size:14.5px;color:var(--soft);min-width:0;}
  .banner .what strong{color:var(--ink);}
  .banner .btn{margin-left:auto;}
  .btn{background:var(--brand);color:#fff;border:0;padding:11px 20px;border-radius:26px;
    font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;
    display:inline-block;white-space:nowrap;}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .sect{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:30px 0 4px;}
  .row{display:flex;align-items:flex-start;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .rtext{min-width:0;flex:1 1 auto;}
  .rname{font-size:16px;font-weight:700;}
  .rwhy{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.5;}
  .rval{flex:0 0 auto;font-size:14px;color:var(--soft);max-width:46%;text-align:right;word-break:break-word;}
  .rval a{color:var(--brand);font-weight:700;text-decoration:none;}
  /* A switch that is drawn but cannot be pressed says so by being pale, rather than by doing
     nothing when it is pressed. */
  .sw{flex:0 0 46px;width:46px;height:26px;border-radius:999px;background:var(--off);position:relative;opacity:.55;}
  .sw.on{background:var(--on);}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;}
  .sw.on::after{left:23px;}
  .none{background:var(--panel);border:1px dashed var(--panel-line);border-radius:12px;
    padding:18px 20px;font-size:14.5px;color:var(--soft);line-height:1.6;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Account &amp; settings</h1>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
(function () {
  // WHAT THIS SCREEN IS. One account, four products. The rail names them; the body shows one at a
  // time. Her words on the shape, 2026-09-19: "editing profile/permissions/account should be the
  // same for 2gather.network/manage and creating.works/manage and appear.network/manage".
  //
  // EVERY ROW HERE IS A SETTING WE ACTUALLY HOLD, or it says plainly that we hold none. The mockup
  // it is drawn from is full of switches for things Appear stores and we do not, and copying those
  // would fill four screens with promises. Where a setting exists, the row says where it is edited
  // today, so nothing on this page is a door onto nothing.
  // HER SPEC, 2026-09-19, read back: no emojis anywhere; the rail says Balance, Appear, Gather,
  // License, in that order; each pane carries the product's REAL NAME and its own line; every
  // product has an enable on it. The rail is the short word people say and the pane is the name
  // that is registered - which is why License sits in the rail and Creating.Works heads the pane.
  var PANELS = [
    /* MY INFO, not Profile. Jessie, 2026-09-20: 'Make "profile" say "My info"' and "Make My info
       show photo/where are you (just like /intro/?perm=1&step=welcome shows)". So this pane is the
       welcome step's two questions, drawn the way that step draws them: the picture with Change
       photo beside it, then region, country, state, county and city across one line with the
       postal code beneath. */
    { key:'profile', group:'ACCOUNT', label:'My info', lit:true,
      title:'My info', line:'',
      state:null, welcome:true, sections:[]
    },
    { key:'balance', group:'PRODUCTS', label:'Balance', lit:false,
      title:'DayBalancer.com', line:'Energy in. Energy out.',
      state:{ on:false, says:'DayBalancer is not enabled on this account.' },
      sections:[]
    },
    { key:'appear', group:'PRODUCTS', label:'Appear', lit:false,
      title:'Appear.Network', line:'Where people, resources, and opportunities appear.',
      state:{ on:false, says:'Appear is not enabled on this account.' },
      sections:[
        { head:'YOUR PAGE', rows:[
          { name:'Appear page', why:'The page people land on when they look you up on Appear.',
            val:'<a href="https://appear.network/dl/page/">Edit it on Appear</a>' }
        ]}
      ]
    },
    { key:'gather', group:'PRODUCTS', label:'Gather', lit:true,
      title:'2Gather.Network', line:'Gathering for the common good.',
      state:{ on:true, says:'2Gather is enabled on this account.' },
      sections:[
        { head:'WHO SEES YOU', rows:[
          { name:'Profile open to', why:'Everybody signed in, or only people in a group with you.', sw:true, on:true },
          { name:'Show my photo', why:'Your picture on your profile and beside your name.', sw:true, on:true },
          { name:'Include me on the map', why:'Your place, at the level you chose, on the map.', sw:true, on:true },
          { name:'Findable in search', why:'Whether somebody can find you by name.', sw:true, on:true }
        ]},
        { head:'WHAT IS MINE', rows:[
          { name:'My events', why:'Everything you host, share or have said you are going to.',
            val:'<a href="/myevents/">Open</a>' },
          { name:'My groups', why:'The groups you are in and the ones you host.',
            val:'<a href="/mygroups/">Open</a>' },
          { name:'My profile', why:'What you are seeking, what you enjoy, your skills and what you have.',
            val:'<a href="/ikigai/">Open</a>' }
        ]}
      ]
    },
    { key:'license', group:'PRODUCTS', label:'License', lit:true,
      title:'Creating.Works', line:'Because creating works.',
      state:{ on:true, says:'Creating.Works is enabled on this account.' },
      sections:[
        /* NO EXPLANATIONS. Jessie, 2026-09-20: "show Terms of service, Privacy policy, Code of
           conduct without any explnatioant. just linked to the pages needed to read". Each row was
           saying its own name twice - once as the heading and once as the link beside it - with a
           line of explanation between them explaining what a terms page is. The name is the link. */
        { head:'AGREEMENTS', links:[
          ['Terms of service', 'https://creating.works/terms-of-service'],
          ['Privacy policy',   'https://creating.works/privacy-policy'],
          ['Code of conduct',  'https://creating.works/code-of-conduct']
        ]}
      ]
    }
  ];

  var here = 'profile';
  try { var q = new URLSearchParams(location.search).get('p'); if (q) { here = q; } } catch (e) {}

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function drawRail() {
    var h = '', group = '';
    PANELS.forEach(function (p) {
      if (p.group !== group) { group = p.group; h += '<div class="railhead">' + esc(group) + '</div>'; }
      h += '<button type="button" class="railrow' + (p.key === here ? ' on' : '') + '" data-go="' + esc(p.key) + '">'
        + esc(p.label)
        + (p.group === 'PRODUCTS' ? '<span class="dot' + (p.lit ? ' lit' : '') + '"></span>' : '')
        + '</button>';
    });
    document.getElementById('rail').innerHTML = h;
    document.getElementById('rail').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { here = b.getAttribute('data-go'); drawRail(); drawBody(); window.scrollTo({top:0,behavior:'smooth'}); };
    });
  }

  /* THE WELCOME STEP'S TWO QUESTIONS, ON THIS PAGE. Jessie, 2026-09-20: "Make My info show
     photo/where are you (just like https://2gather.network/intro/?perm=1&step=welcome shows)".

     WHAT IS REAL HERE AND WHAT IS NOT, said plainly because the difference matters: the picture and
     the place are READ from this person's own record, so they are their real answers. CHANGING
     either one still happens on the welcome step, which already saves them - one Change button
     opens it. Drawing a second set of controls that save would be two screens writing the same
     five columns, which is the fault that has cost this build more than any other.

     IT NEVER ASSERTS BEFORE IT KNOWS. While the read is out it says it is looking; if the read is
     refused it says so and offers to sign in again, rather than drawing an empty place that reads
     as "you never told us". */
  var _me = { photo:'', place:'', asked:false, failed:false };
  function welcomeHTML() {
    var face = _me.photo
      ? '<img src="' + esc(_me.photo) + '" alt="" style="width:74px;height:74px;border-radius:50%;object-fit:cover;flex:0 0 74px;">'
      : '<div style="width:74px;height:74px;border-radius:50%;background:var(--panel);border:1px solid var(--panel-line);flex:0 0 74px;"></div>';
    var place = _me.failed
      ? '<span style="color:#7A2410;">We could not read your place just now. '
        + '<a href="/signin/?next=%2Fmanage%2F" style="color:#1F699E;font-weight:700;">Sign in again</a> and it comes back.</span>'
      : (_me.asked ? (_me.place || 'Not set yet.') : 'Looking\u2026');
    return '<div class="sect">YOUR PHOTO</div>'
      + '<div class="row" style="align-items:center;">' + face
      + '<div class="rtext"><div class="rname">Your photo</div>'
      + '<div class="rwhy">A professional photo helps people recognize you when you show up.</div></div>'
      + '<div class="rval"><a class="btn ghost" href="/intro/?step=welcome">Change photo</a></div></div>'
      + '<div class="sect">WHERE ARE YOU?</div>'
      + '<div class="row"><div class="rtext"><div class="rname">' + place + '</div>'
      + '<div class="rwhy">So the people, events, and/or opportunities near you can reach you.</div></div>'
      + '<div class="rval"><a class="btn ghost" href="/intro/?step=welcome">Change</a></div></div>';
  }
  function loadMe() {
    var id = '', tok = '';
    try { id = (window.CW && CW.me) ? String(CW.me().id || '') : ''; } catch (e) {}
    try { tok = localStorage.getItem('cw-token') || ''; } catch (e) {}
    try { _me.photo = localStorage.getItem('cw-photo') || ''; } catch (e) {}
    if (!id) { _me.asked = true; _me.failed = true; drawBody(); return; }
    fetch('https://cw-api-gate.jessieupp.workers.dev?action=getProfile&appearId='
          + encodeURIComponent(id) + '&meToken=' + encodeURIComponent(tok) + '&nocache=1')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        _me.asked = true;
        if (!d || d.found !== true) { _me.failed = true; drawBody(); return; }
        var x = d.data || {};
        if (d.photo) { _me.photo = d.photo; }
        // The same five, in the order the welcome step asks them.
        var bits = [x.city, x.county, x.location, x.postal].filter(function (v) { return String(v || '').trim(); });
        _me.place = bits.join(', ');
        drawBody();
      })
      .catch(function () { _me.asked = true; _me.failed = true; drawBody(); });
  }

  function drawBody() {
    var p = null;
    PANELS.forEach(function (x) { if (x.key === here) { p = x; } });
    if (!p) { p = PANELS[0]; }
    var h = '<div class="mocknote"><strong>This is a layout to look at.</strong> Nothing on this page '
      + 'saves yet and the dots are not live. Everything is still changed where it is changed today, '
      + 'and each row says where that is.</div>';
    h += '<div class="ptitle"><div><h2>' + esc(p.title) + '</h2><p class="pline">' + esc(p.line) + '</p></div>';
    if (p.state) {
      h += '<span class="pill"><span class="dot' + (p.state.on ? ' lit' : '') + '"></span>'
        + (p.state.on ? 'On' : 'Off') + '</span>';
    }
    h += '</div>';
    if (p.state) {
      // AN ENABLE ON EVERY PRODUCT, her word. On or off, the control sits in the same place, so
      // "can I turn this off" never depends on hunting for where the button went.
      h += '<div class="banner"><div class="what">' + esc(p.state.says) + '</div>'
        + '<a class="btn' + (p.state.on ? ' ghost' : '') + '" href="#" data-none="1">'
        + (p.state.on ? 'Disable' : 'Enable') + '</a></div>';
    }
    if (p.welcome) { h += welcomeHTML(); }
    (p.sections || []).forEach(function (s) {
      h += '<div class="sect">' + esc(s.head) + '</div>';
      if (s.links) {
        s.links.forEach(function (l) {
          h += '<div class="row"><div class="rtext"><a href="' + l[1] + '" '
            + 'style="font-size:16px;font-weight:700;color:var(--brand);text-decoration:none;">'
            + esc(l[0]) + '</a></div></div>';
        });
        return;
      }
      s.rows.forEach(function (r) {
        h += '<div class="row"><div class="rtext"><div class="rname">' + esc(r.name) + '</div>'
          + '<div class="rwhy">' + esc(r.why) + '</div></div>'
          + (r.sw ? '<div class="sw' + (r.on ? ' on' : '') + '"></div>'
                  : '<div class="rval">' + (r.val || '') + '</div>')
          + '</div>';
      });
    });
    document.getElementById('body').innerHTML = h;
    // A button that cannot do anything yet says so when it is pressed, rather than doing nothing.
    document.getElementById('body').querySelectorAll('[data-none]').forEach(function (b) {
      b.onclick = function (ev) { ev.preventDefault();
        b.outerHTML = '<span class="rval">Connecting a product is not built yet.</span>'; return false; };
    });
  }

  drawRail();
  drawBody();
  loadMe();
})();
</script>
<script src="/nav/topbar.js?v=6.14" defer></script>
</body>
</html>
