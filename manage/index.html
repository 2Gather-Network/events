<!-- Version: M2.01 | Date: 2026-09-20 | LAST CHANGE: /manage/ is the account page. Jessie: "and i
     thought manage was supposed to be account", and "why is my info not look like /account - where
     you can update everything anymroe?"

     IT WAS SUPPOSED TO BE, and for one evening it was two things instead: /manage/ held the drawing
     and /account/ held the page where everything actually saves. By this morning the drawing had
     been shaped into the same screen twice over - My info, My profile, Global permissions, Support,
     Sign out, then Balance, Appear, Gather and License - and two pages with one purpose is the thing
     this build keeps paying for.

     So there is one page. This address opens it, every link anybody has to /manage/ keeps working,
     and the word on the screen stays "account" as she asked this morning ("le'ts not change the
     wrord manage quiet yet - just keep account since it seems more approrpriate").

     The drawing is not lost: every version of it is in the history of this file, M1.00 through
     M2.00, including the three-rail map of the whole navigation. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
<title>Account &amp; settings · 2Gather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // Straight through, and the query comes with it, so a link carrying a tab or an id still lands
  // where it meant to. replace, not assign: Back should return to the page before this one rather
  // than to a forward that sends you here again.
  (function () {
    try {
      var q = String(window.location.search || '');
      window.location.replace('https://2gather.network/account/' + q + String(window.location.hash || ''));
    } catch (e) {
      window.location.href = 'https://2gather.network/account/';
    }
  })();
</script>
</head>
<body style="margin:0;background:#1F699E;color:#fff;font-family:'DM Sans','Inter',system-ui,sans-serif;">
  <div style="padding:28px 20px;font-size:15px;">
    Opening your account… <a href="https://2gather.network/account/" style="color:#fff;font-weight:700;">Go there now</a>.
  </div>
</body>
</html>
