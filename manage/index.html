<!-- Version: M2.00 | Date: 2026-09-20 | LAST CHANGE: the whole NAVIGATION drawn end to end, at her "design all this in the mokcup link so you confirm you know what i'm talking aboaut". THREE RAILS AND HOW THEY CONNECT. (1) The ikigai rail, which is /intro/ renamed: Info while the first four steps are unanswered, then Joy down to Purpose, with SOLUTIONS at the foot as the way onward - and no Balance row, though Seeking balance? stays as a question inside Needs. (2) Solutions opens the four places: About you, Your answers, Who sees what, Solutions. (3) About you opens the rail that exists today - My events, My groups, My profile, My permissions, My account, Support, Sign out - where My profile goes back to ikigai/?step=joy and My permissions opens the global permissions, shaped like a group's. Her two keeps: My account stays exactly as it is, and the intro page stays exactly as it is. A switch at the top of the mockup shows the rail as somebody NEW meets it and as somebody FINISHED meets it, because the difference between those two is the whole point. -->
<!-- Version: M1.04 | Date: 2026-09-20 | LAST CHANGE: the first rail row is About you rather than You, her word after looking at it. You and Your answers sat next to each other and opened with the same word, so the pair read as one item twice; two words apart is the difference between scanning a rail and reading it. -->
<!-- Version: M1.03 | Date: 2026-09-19 | LAST CHANGE: four places on the rail instead of fifteen steps. Jessie: "Too many on rail yes" and "the rail should name places yes what do propose?" The rail reads You, Your answers, Who sees what, Solutions - each one a question somebody actually arrives with: who am I here, what did I say, who can see it, what am I using. The four solutions sit INSIDE Solutions rather than on the rail, which is what keeps it at four rows, and each has a way back. SOLUTIONS, not products, her word: closer to what somebody came here for. The rule underneath, from Don't Make Me Think: people scan a rail rather than read it, and eleven wizard steps are the right shape for a sequence you walk once and the wrong shape for somewhere you come back to three weeks later to change your photo. -->
<!-- Version: M1.02 | Date: 2026-09-19 | LAST CHANGE: the lit dot is orange rather than green. Jessie: "make the green an organie dot insteasd - accessible organe". #C2410C against white is 5.9:1, so it reads as a colour and not only as a position. -->
<!-- Version: M1.01 | Date: 2026-09-19 | LAST CHANGE: her spec on the first look, read back line by line. No emojis anywhere. The line under the heading goes. The rail says Balance, Appear, Gather, License in that order, and each pane carries the name that is registered - DayBalancer.com, Appear.Network, 2Gather.Network, Creating.Works - with its own line under it: Energy in. Energy out. / Where people, resources, and opportunities appear. / Gathering for the common good. / Because creating works. EVERY PRODUCT HAS AN ENABLE, on or off, in the same place, so "can I turn this off" never depends on hunting for the button. Creating.Works loses the house sentence and the cannot-be-switched-off line; terms, privacy and code of conduct are three links named as themselves, no "read". The paragraphs saying what is not stored here come off every pane. -->
<!-- Version: M1.00 | Date: 2026-09-19 | LAST CHANGE: born. ONE account and settings screen for all four products, at her "2 build mockup". Built on James's mockup, queued as Tier 2.16 on 2026-09-07 - his LAYOUT, our look: a rail on the left reading ACCOUNT then PRODUCTS, the body showing one at a time with its name, a line under it, a status banner, then settings under quiet uppercase headings with one line of explanation on each row. His was dark green and orange; ours is the blue and white every other page uses, with the top navigation above, "liek starting with just the white rail on left side and body on right, with all top nav info above as we do in my groups". WHY ONE FILE: she asked for the same screen at 2gather.network/manage, creating.works/manage and appear.network/manage. Three copies kept in step by hand is the debt she does not want - one gets a field, the others do not, and the next save writes an empty value over a real one. So this is one page and each domain points at it. NOTHING HERE SAVES YET. It is a layout to look at and it says so at the top, because a switch that does not switch anything is a door onto nothing. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="robots" content="noindex, nofollow">
<title>Account &amp; settings · Creating.Works</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/nav/identity.js?v=23"></script>
<style>
  :root{
    --bg:#1F699E; --card:#fff; --ink:#1A2E42; --soft:#4B5A6D; --muted:#6B7A8D;
    --line:#DDE4EE; --panel:#F7FBFF; --panel-line:#C9DFF3; --brand:#1F699E;
    --on:#C2410C; --off:#B9C4D2;   /* ORANGE, NOT GREEN. Jessie, 2026-09-19: "make the green an
       organie dot insteasd - accessible organe". #C2410C carries 5.9:1 against white, so it is
       readable as a colour rather than only as a position, which matters most to the people a
       green-red pair fails. */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);
    font-family:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:26px;font-weight:800;margin:0 0 4px;color:#fff;}
  .sub{color:#fff;opacity:.9;font-size:14.5px;margin:0 0 18px;}
  /* THE SAME TEMPLATE AS MY GROUPS, her instruction: 1200 wide, a rail, the body beside it,
     one column below 860. The rail is 340 because she compared 285, 340 and 400 side by side
     on the live page and picked it (2026-09-08). */
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}
  .rail{background:#fff;border-radius:14px;padding:10px 8px;height:fit-content;}
  .railhead{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:10px 12px 6px;}
  .railrow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;
    border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;font-weight:700;
    color:var(--ink);cursor:pointer;text-align:left;}
  .railrow:hover{background:var(--panel);}
  .railrow.on{background:var(--brand);color:#fff;}
  .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--off);flex:0 0 9px;}
  .railrow.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  .dot.lit{background:var(--on);}
  .body{background:#fff;border-radius:14px;padding:26px 28px 34px;min-width:0;}
  .mocknote{background:#FFF6E5;border:1px solid #F0DCB4;border-radius:12px;padding:12px 14px;
    font-size:13.5px;line-height:1.55;color:#6B4E15;margin:0 0 22px;}
  .ptitle{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;flex-wrap:wrap;}
  .ptitle h2{font-size:30px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .pline{font-size:15.5px;color:var(--soft);margin:4px 0 0;}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--soft);white-space:nowrap;background:#fff;}
  .pill .dot{margin:0;}
  .banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--panel-line);border-radius:14px;padding:16px 18px;margin:22px 0 6px;}
  .banner .what{font-size:14.5px;color:var(--soft);min-width:0;}
  .banner .what strong{color:var(--ink);}
  .banner .btn{margin-left:auto;}
  .btn{background:var(--brand);color:#fff;border:0;padding:11px 20px;border-radius:26px;
    font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;
    display:inline-block;white-space:nowrap;}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .sect{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:30px 0 4px;}
  .row{display:flex;align-items:flex-start;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .rtext{min-width:0;flex:1 1 auto;}
  .rname{font-size:16px;font-weight:700;}
  .rwhy{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.5;}
  .rval{flex:0 0 auto;font-size:14px;color:var(--soft);max-width:46%;text-align:right;word-break:break-word;}
  .rval a{color:var(--brand);font-weight:700;text-decoration:none;}
  /* A switch that is drawn but cannot be pressed says so by being pale, rather than by doing
     nothing when it is pressed. */
  .sw{flex:0 0 46px;width:46px;height:26px;border-radius:999px;background:var(--off);position:relative;opacity:.55;}
  .sw.on{background:var(--on);}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;}
  .sw.on::after{left:23px;}
  .none{background:var(--panel);border:1px dashed var(--panel-line);border-radius:12px;
    padding:18px 20px;font-size:14.5px;color:var(--soft);line-height:1.6;margin-top:18px;}
  .stepmark{margin-left:auto;font-size:15px;font-weight:800;color:#2E7D5B;}
  .railrow.on .stepmark{color:#fff;}
  .railrow.door{background:var(--panel);border:1.5px solid var(--panel-line);color:var(--brand);margin-top:10px;}
  .railrow.door.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .railrow.out{color:var(--soft);font-weight:700;}
  .back{display:inline-block;font-size:13.5px;font-weight:700;color:var(--brand);
    text-decoration:none;margin:0 0 14px;cursor:pointer;}
  .who{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
  .who button{font:inherit;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;cursor:pointer;
    background:#fff;border:1.5px solid #C9D6E2;color:var(--brand);}
  .who button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .addr{font:13px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);margin-top:6px;word-break:break-all;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">Account &amp; settings</h1>
  <div class="who" id="who"></div>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
(function () {
  /* ── THE WHOLE WAY ROUND, DRAWN ────────────────────────────────────────────────────────────
     Jessie, 2026-09-20: "design all this in the mokcup link so you confirm you know what i'm
     talking aboaut". So this is not four panes any more; it is the three rails and the doors
     between them, and it is pressable, because a picture of navigation proves nothing.

     HER WORDS, AND WHAT EACH ONE MEANS HERE:

     "no i like /myaccount as it is" and "I like /intro/?perm=1&step=welcome as it is" - neither
     page changes. What changes is the ADDRESS of the second and what sits at the foot of it.

     "i'id liek to change /intro to the word ikigai/ though and ikigai/step=info and
     ikigai/step=joy" - so the intro becomes /ikigai/?step=<name>.

     "but if the intro/info (first 4 steps) are completed, then all they see is from joy and down
     and at bottom after purpose it says solutions" - Info is one row that disappears once it is
     answered, and SOLUTIONS is the way onward from the foot of the list.

     "the solutions then take you to the new rail of the 4 solutions: About you / Your answers /
     Who sees what / Solutions".

     "About you goes to the railing with this: My events, My groups, My profile (goesback to
     ikigai/step=joy ...), My permissions (goes to Global permissions that loo like permissions
     for group), My account, Support, Sign out" - which is the rail that exists today.

     "remove balance in rail but keep the question Seeking balance? in needs" - no Balance row;
     the question stays inside Needs.

     THE SWITCH AT THE TOP shows the same rail as somebody NEW meets it and as somebody FINISHED
     meets it, because the difference between those two is the whole point of the design. */

  var finished = true;          // the switch at the top flips this
  var rail = 'ikigai';          // ikigai | four | about
  var here = 'joy';

  var IKIGAI = [
    { key:'info',  label:'Info',          addr:'/ikigai/?step=info',
      note:'The first four steps - welcome, your photo, where you are, and your name. This row is here only until they are answered; after that the list starts at Joy.' },
    { key:'joy',   label:'Joy',           addr:'/ikigai/?step=joy',   done:true },
    { key:'skills',label:'Skills',        addr:'/ikigai/?step=skills',done:true },
    { key:'care',  label:'Care',          addr:'/ikigai/?step=care',  done:true },
    { key:'needs', label:'Needs',         addr:'/ikigai/?step=needs',
      note:'Seeking balance? is asked here, inside Needs. It is not a row on the rail.' },
    { key:'offerings',label:'Offerings',  addr:'/ikigai/?step=offerings' },
    { key:'open',  label:'Open to work',  addr:'/ikigai/?step=open-to-work' },
    { key:'appreciation',label:'Appreciation', addr:'/ikigai/?step=appreciation' },
    { key:'purpose',label:'Purpose',      addr:'/ikigai/?step=purpose' }
  ];

  var FOUR = [
    { key:'about',   label:'About you',
      line:'Everything that is yours: your events, your groups, your profile, your permissions, your account.',
      opens:'about' },
    { key:'answers', label:'Your answers',
      line:'Everything you have told us - Joy through Purpose - as one page of headings.',
      opens:'ikigai' },
    { key:'sees',    label:'Who sees what',
      line:'Set it once for every group, or set one group on its own.' },
    { key:'solutions',label:'Solutions',
      line:'What you are using, and what each one may do with your answers.' }
  ];

  var ABOUT = [
    { key:'myevents', label:'My events',      addr:'/myevents/' },
    { key:'mygroups', label:'My groups',      addr:'/mygroups/' },
    /* AND EDITING IS ITS OWN PAGE. Jessie, 2026-09-20: "and editing goes to
       https://2gather.network/profile-edit/". So the two are kept apart on purpose: the list of
       answers is where you READ what you said, /profile-edit/ is where you CHANGE it. */
    { key:'myprofile',label:'My profile',     addr:'/ikigai/?step=joy',
      note:'Goes back to the list of answers, Joy through Purpose. Editing opens 2gather.network/profile-edit/.',
      opens:'ikigai' },
    { key:'myperms',  label:'My permissions', addr:'/ikigai/?step=permissions',
      note:'Opens Global permissions, shaped exactly like a group’s permissions.' },
    { key:'myaccount',label:'My account',     addr:'/account/',
      note:'Unchanged. Photo, name, email addresses, location and your link, exactly as it is today.' },
    { key:'support',  label:'Support',        addr:'/support/' },
    { key:'signout',  label:'Sign out',       addr:'/signin/?out=1', out:true }
  ];

  var SOLUTIONS = [
    { key:'balance', label:'Balance', name:'DayBalancer.com',  line:'Energy in. Energy out.', on:false },
    { key:'appear',  label:'Appear',  name:'Appear.Network',   line:'Where people, resources, and opportunities appear.', on:false },
    { key:'gather',  label:'Gather',  name:'2Gather.Network',  line:'Gathering for the common good.', on:true },
    { key:'license', label:'License', name:'Creating.Works',   line:'Because creating works.', on:true }
  ];

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function go(r, k){ rail = r; here = k; draw(); window.scrollTo({top:0,behavior:'smooth'}); }
  function find(list, k){ var hit = null; list.forEach(function(x){ if (x.key === k) hit = x; }); return hit; }

  function drawWho() {
    document.getElementById('who').innerHTML =
        '<button type="button" data-who="new"' + (finished ? '' : ' class="on"') + '>As somebody new sees it</button>'
      + '<button type="button" data-who="done"' + (finished ? ' class="on"' : '') + '>As somebody who has finished sees it</button>';
    document.getElementById('who').querySelectorAll('[data-who]').forEach(function (b) {
      b.onclick = function () {
        finished = b.getAttribute('data-who') === 'done';
        if (!finished) { rail = 'ikigai'; here = 'info'; }
        else if (here === 'info') { here = 'joy'; }
        draw();
      };
    });
  }

  function drawRail() {
    var h = '';
    if (rail === 'ikigai') {
      h += '<div class="railhead">Your answers</div>';
      IKIGAI.forEach(function (r) {
        if (r.key === 'info' && finished) { return; }      // answered, so it goes
        h += '<button type="button" class="railrow' + (here === r.key ? ' on' : '') + '" data-r="ikigai" data-k="' + esc(r.key) + '">'
          + esc(r.label) + (r.done ? '<span class="stepmark">✓</span>' : '') + '</button>';
      });
      // THE WAY ONWARD, at the foot and only once the answers are behind you.
      if (finished) {
        h += '<button type="button" class="railrow door' + (here === 'solutions-door' ? ' on' : '') + '" data-r="four" data-k="about">Solutions</button>';
      }
    } else if (rail === 'four') {
      h += '<div class="railhead">Everything of yours</div>';
      FOUR.forEach(function (r) {
        h += '<button type="button" class="railrow' + (here === r.key ? ' on' : '') + '" data-r="four" data-k="' + esc(r.key) + '">'
          + esc(r.label) + '</button>';
      });
    } else {
      h += '<div class="railhead">About you</div>';
      ABOUT.forEach(function (r) {
        h += '<button type="button" class="railrow' + (here === r.key ? ' on' : '') + (r.out ? ' out' : '') + '" data-r="about" data-k="' + esc(r.key) + '">'
          + esc(r.label) + '</button>';
      });
    }
    document.getElementById('rail').innerHTML = h;
    document.getElementById('rail').querySelectorAll('[data-k]').forEach(function (b) {
      b.onclick = function () { go(b.getAttribute('data-r'), b.getAttribute('data-k')); };
    });
  }

  function panel(title, line, addr, body, backTo, backWord) {
    var h = '<div class="mocknote"><strong>This is the navigation, drawn so you can press it.</strong> '
      + 'Nothing here saves and no page moves yet. Every screen it points at already exists — the '
      + 'addresses under each heading are what they would become.</div>';
    if (backTo) { h += '<a class="back" data-back="' + esc(backTo) + '">‹ ' + esc(backWord) + '</a>'; }
    h += '<div class="ptitle"><div><h2>' + esc(title) + '</h2>'
      + (line ? '<p class="pline">' + esc(line) + '</p>' : '')
      + (addr ? '<div class="addr">' + esc(addr) + '</div>' : '')
      + '</div></div>' + body;
    return h;
  }

  function rows(list) {
    return list.map(function (r) {
      return '<div class="row">'
        + (typeof r.on === 'boolean' ? '<span class="dot' + (r.on ? ' lit' : '') + '" style="margin:8px 0 0;"></span>' : '')
        + '<div class="rtext"><div class="rname">' + esc(r.name || r.label) + '</div>'
        + '<div class="rwhy">' + esc(r.why || r.line || r.note || '') + '</div>'
        + (r.addr ? '<div class="addr">' + esc(r.addr) + '</div>' : '')
        + '</div>'
        + (r.go ? '<div class="rval"><a href="#" data-go="' + esc(r.go) + '">Open</a></div>' : '')
        + '</div>';
    }).join('');
  }

  function drawBody() {
    var h = '';
    if (rail === 'ikigai') {
      var step = find(IKIGAI, here) || IKIGAI[1];
      var body = '<div class="sect">WHAT THIS STEP IS</div>'
        + '<div class="row"><div class="rtext"><div class="rname">' + esc(step.label) + '</div>'
        + '<div class="rwhy">' + esc(step.note || 'One of the questions. The page itself is unchanged — only its address and what sits at the foot of the rail.') + '</div></div></div>'
        + (finished
            ? '<div class="none">Every answer is behind you, so the rail starts at Joy and ends with '
              + '<strong>Solutions</strong> at the foot. That is the way onward.</div>'
            : '<div class="none">Info is on the rail because the first four steps are unanswered. '
              + 'Once they are answered this row goes and the list starts at Joy.</div>')
        + '<div class="sect">WHERE EDITING HAPPENS</div>'
        + '<div class="row"><div class="rtext"><div class="rname">Change an answer</div>'
        + '<div class="rwhy">Editing opens its own page, kept apart from reading on purpose.</div>'
        + '<div class="addr">/profile-edit/</div></div></div>'
        + '<div class="sect">NOT ON THIS RAIL</div>'
        + '<div class="row"><div class="rtext"><div class="rname">Balance</div>'
        + '<div class="rwhy">Removed from the rail. <strong>Seeking balance?</strong> stays as a question inside Needs.</div></div></div>';
      h = panel(step.label, '', step.addr, body,
                rail === 'ikigai' && here === 'joy' ? '' : '', '');
    } else if (rail === 'four') {
      var f = find(FOUR, here) || FOUR[0];
      var body = '';
      if (f.key === 'about') {
        body = '<div class="sect">WHAT IS BEHIND IT</div>' + rows(ABOUT.map(function (r) {
          return { label:r.label, why:r.note || '', addr:r.addr };
        })) + '<div class="none">Pressing <strong>About you</strong> opens that rail. '
             + '<a href="#" data-go="about:myevents">Open it</a>.</div>';
      } else if (f.key === 'answers') {
        body = '<div class="sect">WHAT IS BEHIND IT</div>' + rows(IKIGAI.map(function (r) {
          return { label:r.label, why:'', addr:r.addr };
        })) + '<div class="none">Pressing <strong>Your answers</strong> goes back to the list. '
             + '<a href="#" data-go="ikigai:joy">Open it</a>.</div>';
      } else if (f.key === 'sees') {
        body = '<div class="sect">ALL GROUPS</div>'
          + rows([{ label:'Global permissions', why:'Your name, where you are, your photo, your answers, findable in search, on the map. Set once, held for every group you are in.', addr:'/ikigai/?step=permissions' }])
          + '<div class="sect">ONE GROUP ON ITS OWN</div>'
          + rows([{ label:'Per group', why:'Pick a group and set that group differently from the rest. Same shape as the global one, which is the point.', addr:'/ikigai/?step=permissions' }]);
      } else {
        body = '<div class="sect">YOURS</div>' + rows(SOLUTIONS.map(function (r) {
          return { name:r.label, why:r.name + ' — ' + r.line, on:r.on };
        }));
      }
      h = panel(f.label, f.line, '', body, 'ikigai:joy', 'Your answers');
    } else {
      var a = find(ABOUT, here) || ABOUT[0];
      var body = '<div class="sect">WHERE IT GOES</div>'
        + '<div class="row"><div class="rtext"><div class="rname">' + esc(a.label) + '</div>'
        + '<div class="rwhy">' + esc(a.note || 'The page as it is today, unchanged.') + '</div>'
        + '<div class="addr">' + esc(a.addr) + '</div></div>'
        + (a.opens ? '<div class="rval"><a href="#" data-go="ikigai:joy">Open</a></div>' : '')
        + '</div>';
      h = panel(a.label, '', '', body, 'four:about', 'Everything of yours');
    }
    document.getElementById('body').innerHTML = h;
    document.getElementById('body').querySelectorAll('[data-go],[data-back]').forEach(function (el) {
      el.onclick = function (ev) { ev.preventDefault();
        var v = (el.getAttribute('data-go') || el.getAttribute('data-back') || '').split(':');
        go(v[0], v[1]); return false; };
    });
  }

  function draw() {
    document.getElementById('ttl').textContent =
      rail === 'ikigai' ? 'Your answers' : (rail === 'four' ? 'Everything of yours' : 'About you');
