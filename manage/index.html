<!--
  THE PAGE MOVED TO /myevents/manage/. This is the old address, kept only so links already shared
  keep working.

  Jessie, 2026-09-09: "is 2gather.network/myevents/manage/ forwarding to
  https://2gather.network/manage/? if so, that's not a fix - i want it to be this url and stay:
  2gather.network/myevents/manage".

  She is right, and the first attempt had it backwards. Forwarding the good address to the old one
  leaves the old one as the real page, which is a second thing to keep in step and exactly the debt
  worth avoiding. The page itself lives at /myevents/manage/ now and every link in this repository
  points there. This file forwards the other way, for addresses people have already sent each other
  and for anything outside this repository that still says /manage/.

  It was built as the editing page and became My events on 2026-09-08, which is why the address
  described what it used to be rather than what it is.

  Every parameter is carried through untouched, so an ?id= link somebody shared still opens its
  event. Same tab, and it replaces this step so Back does not land the person here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My events</title>
<style>
  html,body{margin:0;padding:0;background:#1F699E;}
</style>
<script>
  (function () {
    var qs = '';
    try { qs = window.location.search || ''; } catch (e) {}
    var to = 'https://2gather.network/myevents/manage/' + qs;
    try { window.location.replace(to); } catch (e) { window.location.href = to; }
  })();
</script>
</head>
<body></body>
</html>
