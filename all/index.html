<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All pages</title>
<script src="https://2gather.network/nav/identity.js?v=72"></script>
<script src="https://2gather.network/nav/waiting-words.js?v=21"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1F699E;--ink:#1A2E42;--brand:#1F699E;--line:#DDE4EE}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:96px 20px 60px}
.card{background:#fff;border-radius:14px;padding:22px 24px}
h1{font-size:22px;font-weight:800;margin:0 0 14px}
.l{display:block;padding:12px 0;border-top:1px solid var(--line);font-size:17px;font-weight:600;color:var(--brand);text-decoration:none}
.l:first-of-type{border-top:0}
.s{padding-left:22px;font-size:16px;font-weight:500}
.l:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.msg{font-size:17px;padding:12px 0}
</style>
</head>
<body>
<div id="pe-early" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2147481999;display:inline-flex;align-items:center;background:#fff;color:#1F699E;font:400 14px 'Nunito Sans',system-ui,sans-serif;padding:10px 20px;border-radius:22px;box-shadow:0 6px 24px rgba(16,42,67,.22);white-space:nowrap;">Loading information…</div>
<div class="wrap" id="list" hidden>
  <div class="card">
    <h1>All pages</h1>
    <a class="l" href="/messages/">Messages</a>
    <a class="l" href="/ikigai/interests">My profile</a>
    <a class="l s" href="/ikigai/?step=interests">Edit profile</a>
    <a class="l" href="/events/">Calendar</a>
    <a class="l s" href="/myevents/#new">Post an event</a>
    <a class="l s" href="/myevents/">My events</a>
    <a class="l" href="/network/contacts/">Network</a>
    <a class="l" href="/account/">Account</a>
    <a class="l s" href="/account/#permissions">Permissions</a>
    <a class="l" href="/support/">Support</a>
    <a class="l s" href="/faqs/">FAQs</a>
    <a class="l s" href="/support/admin/">Tickets</a>
  </div>
</div>
<div class="wrap" id="no" hidden><div class="card"><p class="msg">This page is not available.</p></div></div>
<script>
(function(){
  var t0=Date.now();
  function done(ok){var e=document.getElementById('pe-early');if(e)e.remove();document.getElementById(ok?'list':'no').hidden=false;}
  var iv=setInterval(function(){
    if(window.CW_SUPER_OK===true){clearInterval(iv);done(true);return;}
    if(window.CW_SUPER_KNOWN===true){clearInterval(iv);done(false);return;}
    if(Date.now()-t0>15000){clearInterval(iv);done(false);}
  },100);
})();
</script>
<script src="https://2gather.network/nav/topbar.js?v=7.13" defer></script>
</body>
</html>
